 que cumplen los requisitos pero no tienen capital suficiente", "Las pérdidas de rentabilidad de las AFP", "Los depósitos bancarios", "Las cesantías"], "e": "Con parte de las cotizaciones se financia este fondo, que complementa el capital para pagar la pensión mínima a quien cumple los requisitos."}, {"q": "¿Qué son las semanas cotizadas?", "o": ["El tiempo durante el cual se han hecho aportes al sistema de pensiones", "Las semanas de vacaciones del trabajador", "Las semanas que faltan para la pensión", "El tiempo que tarda una AFP en pagar"], "e": "Las semanas cotizadas miden el tiempo de aportes y son un requisito para acceder a la pensión en ambos regímenes."}, {"q": "¿Puede un pensionado del RAIS cambiar de modalidad de pensión de retiro programado a renta vitalicia?", "o": ["Sí, puede pasar de retiro programado a renta vitalicia, pero no al revés", "No, nunca", "Sí, puede cambiar cuantas veces quiera en ambos sentidos", "Solo con autorización judicial"], "e": "El pensionado en retiro programado puede contratar después una renta vitalicia. Una vez contratada la renta vitalicia, no se puede volver al retiro programado."}, {"q": "¿Qué es el capital necesario en el RAIS?", "o": ["El monto de ahorro requerido para financiar una pensión de determinado valor, según cálculos actuariales", "El capital mínimo para crear una AFP", "El valor de los aportes del empleador", "El monto del salario mínimo"], "e": "El capital necesario depende de la mesada deseada, la expectativa de vida y la de los beneficiarios, y las tasas técnicas."}, {"q": "¿Cuál es la función de la Superintendencia Financiera frente al sistema de pensiones?", "o": ["Vigilar a Colpensiones, las AFP y las aseguradoras que participan en el sistema", "Fijar el monto de cada pensión", "Pagar directamente las pensiones", "Elegir el fondo de cada afiliado"], "e": "La SFC supervisa a las entidades del sistema y controla su régimen de inversión y sus deberes."}, {"q": "El régimen de inversión de los fondos de pensiones obligatorias establece:", "o": ["Los activos admisibles y los límites de inversión para cada tipo de fondo", "El salario de los empleados de las AFP", "La edad de pensión", "El valor de la cotización"], "e": "El régimen de inversión, definido en el Decreto 2555, fija qué pueden comprar los fondos y en qué proporciones."}, {"q": "Un afiliado al RAIS puede cambiar de AFP:", "o": ["Sí, cumpliendo los requisitos de permanencia mínima que fija la regulación", "No, nunca", "Solo si se pensiona", "Solo si cambia de empleador"], "e": "Los afiliados pueden trasladarse entre AFP del mismo régimen, después de un tiempo mínimo de permanencia."}, {"q": "¿Qué es la afiliación obligatoria al Sistema General de Pensiones?", "o": ["La obligación de los trabajadores dependientes e independientes con ingresos de cotizar al sistema", "Una opción voluntaria para los empleados públicos", "La obligación de afiliarse a una sola AFP de por vida", "La obligación de comprar un seguro de vida"], "e": "La afiliación es obligatoria para trabajadores dependientes e independientes, que deben escoger un régimen."}, {"q": "Un afiliado que nunca elige régimen al iniciar su vida laboral:", "o": ["Debe elegir uno; la elección es libre y voluntaria", "Queda sin pensión", "Se le asigna una aseguradora", "No puede trabajar"], "e": "La Ley 100 establece la libre elección de régimen por parte del afiliado."}, {"q": "En el RAIS, ¿qué pasa con el bono pensional cuando el afiliado cumple los requisitos?", "o": ["Se redime y su valor se suma al capital de la cuenta individual", "Se pierde", "Se convierte en acciones de la AFP", "Se entrega en efectivo al empleador"], "e": "El bono pensional representa los aportes previos. Al redimirse, aumenta el capital disponible para la pensión."}, {"q": "Las AFP pueden administrar, además de los fondos de pensiones obligatorias:", "o": ["Fondos de cesantías y fondos de pensiones voluntarias", "Cuentas corrientes bancarias", "Seguros de autos", "Fondos de capital del Banco de la República"], "e": "Las sociedades administradoras de fondos de pensiones y cesantías gestionan pensiones obligatorias, voluntarias y cesantías."}, {"q": "En el portafolio de largo plazo de cesantías, el riesgo es mayor que en el de corto plazo porque:", "o": ["Invierte en activos con mayor horizonte y volatilidad, buscando mayor rentabilidad", "No tiene ningún control", "No invierte en renta fija", "No tiene rentabilidad mínima"], "e": "El portafolio de largo plazo está pensado para quienes no van a retirar pronto sus cesantías."}, {"q": "¿Qué deben hacer las AFP con los recursos de los fondos que administran?", "o": ["Invertirlos según el régimen de inversión y en el mejor interés de los afiliados", "Usarlos para pagar sus gastos", "Prestarlos a sus accionistas", "Mantenerlos en efectivo sin invertir"], "e": "Los recursos pertenecen a los afiliados y deben gestionarse con diligencia, dentro de los límites legales."}, {"q": "¿Qué es la doble asesoría en el traslado de régimen pensional?", "o": ["La obligación de que el afiliado reciba asesoría de ambos regímenes antes de trasladarse", "La asesoría de dos AFP distintas", "La asesoría de un abogado y un contador", "La revisión de la Superintendencia de cada traslado"], "e": "Antes de cambiar de régimen, el afiliado debe recibir asesoría de Colpensiones y de una AFP para comparar sus opciones."}, {"q": "El deber de asesoría e información de las AFP al afiliado incluye:", "o": ["Explicarle las características, ventajas y riesgos de cada régimen y de cada tipo de fondo", "Garantizarle la pensión más alta", "Elegir por él el régimen", "Ocultar la comisión"], "e": "La jurisprudencia y la regulación exigen información clara para que el afiliado tome decisiones informadas."}, {"q": "La rentabilidad de un fondo de pensiones se refleja en:", "o": ["El valor de la unidad del fondo", "Una tasa fija pactada con el afiliado", "El salario del afiliado", "La comisión de la AFP"], "e": "Igual que en los FIC, los aportes se convierten en unidades cuyo valor cambia con el desempeño del portafolio."}, {"q": "¿Cuál es una diferencia entre cesantías y pensiones?", "o": ["Las cesantías son una prestación del empleador para cubrir el desempleo y otras necesidades; la pensión cubre la vejez, la invalidez y la muerte", "Son lo mismo", "Las cesantías se pagan de por vida", "La pensión se retira cada año"], "e": "Las cesantías son un ahorro de corto o mediano plazo. La pensión es una protección de largo plazo."}, {"q": "Un trabajador independiente cotiza a pensiones sobre:", "o": ["El 40 % de sus ingresos mensuales, como regla general del IBC", "El 100 % de sus ingresos brutos sin depuración", "Un salario mínimo siempre", "Lo que él decida, sin mínimo"], "e": "Para trabajadores independientes, la base de cotización es, por regla general, el 40 % del ingreso mensual, sin ser inferior a un salario mínimo."}, {"q": "En el RAIS, el saldo de la cuenta individual es:", "o": ["Propiedad del afiliado", "Propiedad de la AFP", "Propiedad del Estado", "Propiedad del empleador"], "e": "Los aportes y rendimientos de la cuenta pertenecen al afiliado, aunque solo se pueden usar para los fines del sistema."}, {"q": "Los fondos de pensiones son inversionistas institucionales importantes en Colombia porque:", "o": ["Administran grandes volúmenes de recursos de largo plazo e invierten en el mercado de capitales", "Son entidades del Gobierno", "No pueden invertir en el mercado", "Solo invierten en el exterior"], "e": "Por su tamaño, los fondos de pensiones tienen un papel central en la demanda de TES, bonos y acciones."}, {"q": "Si una AFP no alcanza la rentabilidad mínima y la reserva de estabilización no es suficiente, debe:", "o": ["Cubrir la diferencia con sus propios recursos", "Reducir la pensión de los afiliados", "Pedir dinero al Banco de la República", "Cerrar el fondo sin pagar"], "e": "La AFP responde con su patrimonio por la rentabilidad mínima, lo que protege a los afiliados."}, {"q": "La asignación de un afiliado a un fondo de mayor riesgo, moderado o conservador puede cambiarse:", "o": ["Sí, el afiliado puede cambiar de tipo de fondo, cumpliendo las reglas de permanencia y edad", "No, nunca", "Solo una vez en la vida", "Solo si lo autoriza la empresa"], "e": "El afiliado puede elegir y cambiar de tipo de fondo, dentro de las restricciones de edad y permanencia."}, {"q": "¿Qué es el retiro programado con renta vitalicia diferida?", "o": ["Una modalidad en la que el afiliado recibe retiro programado por un tiempo y luego una renta vitalicia contratada desde el inicio", "Un retiro anticipado de cesantías", "Una pensión que solo se paga un año", "La devolución de saldos"], "e": "Combina las dos modalidades: primero retiros desde la cuenta y después, desde una fecha pactada, una renta vitalicia con una aseguradora."}, {"q": "En el RAIS, la pensión de vejez depende principalmente de:", "o": ["El capital acumulado, la edad y la expectativa de vida del afiliado y sus beneficiarios", "El último salario", "El número de hijos únicamente", "La decisión de la AFP"], "e": "El capital se divide en mesadas según cálculos actuariales que consideran la expectativa de vida."}, {"q": "¿Qué se entiende por ingreso base de liquidación (IBL) en el RPM?", "o": ["El promedio de los salarios sobre los que se cotizó en un período, que sirve para calcular la pensión", "El último salario del afiliado", "El salario mínimo", "El valor de la cuenta individual"], "e": "El IBL se calcula con el promedio de los ingresos cotizados en los últimos años o en toda la vida laboral, según la ley."}, {"q": "En el RPM, la pensión de vejez se calcula como:", "o": ["Un porcentaje del IBL que depende de las semanas cotizadas y del nivel de ingreso", "El saldo de la cuenta dividido por la expectativa de vida", "Un valor fijo para todos", "El último salario completo"], "e": "La tasa de reemplazo en el RPM depende de las semanas cotizadas y del ingreso del afiliado."}, {"q": "¿Qué es la tasa de reemplazo de una pensión?", "o": ["La relación entre la pensión y el ingreso que tenía el afiliado antes de pensionarse", "La tasa de interés de la cuenta individual", "El porcentaje de cotización", "La comisión de la AFP"], "e": "Una tasa de reemplazo de 70 % significa que la pensión equivale al 70 % del ingreso de referencia."}, {"q": "Las AFP deben invertir los recursos de los fondos de pensiones obligatorias buscando:", "o": ["Seguridad, rentabilidad y liquidez adecuadas, según el tipo de fondo", "Solo la máxima rentabilidad", "Solo la liquidez", "Beneficios para la AFP"], "e": "El régimen de inversión busca un equilibrio entre seguridad, rentabilidad y liquidez acorde con cada fondo."}, {"q": "¿Puede un afiliado del RAIS retirar su ahorro pensional obligatorio para comprar vivienda?", "o": ["No, el ahorro obligatorio solo financia las prestaciones del sistema; las cesantías sí permiten retiros para vivienda", "Sí, en cualquier momento", "Sí, una vez al año", "Sí, si tiene más de 40 años"], "e": "Los recursos pensionales obligatorios no se pueden retirar libremente; las cesantías y las pensiones voluntarias tienen otras reglas."}, {"q": "Un trabajador cambia de empleo. ¿Qué pasa con su afiliación a pensiones?", "o": ["Sigue afiliado al mismo régimen y fondo; el nuevo empleador cotiza al mismo fondo", "Debe afiliarse de nuevo desde cero", "Pierde las semanas cotizadas", "Pasa automáticamente al RPM"], "e": "La afiliación es del trabajador, no del empleo; las semanas y el saldo se conservan."}, {"q": "La mora del empleador en el pago de los aportes a pensiones:", "o": ["Genera intereses moratorios y la AFP o Colpensiones deben adelantar el cobro", "No tiene consecuencias", "La paga el trabajador", "Se perdona automáticamente"], "e": "Las administradoras están obligadas a cobrar los aportes en mora con sus intereses."}, {"q": "¿Qué son los aportes voluntarios a pensiones obligatorias en el RAIS?", "o": ["Sumas adicionales a la cotización obligatoria que aumentan el capital de la cuenta individual", "Las cesantías", "Los aportes del empleador", "El bono pensional"], "e": "Los aportes voluntarios en la cuenta obligatoria se suman al capital para la pensión."}, {"q": "El portafolio de corto plazo de cesantías es adecuado para:", "o": ["Trabajadores que planean retirar sus cesantías pronto", "Ahorros de muy largo plazo", "Inversiones en acciones de alto riesgo", "Pensionados"], "e": "Este portafolio prioriza la estabilidad y la liquidez."}, {"q": "En el RAIS, los rendimientos de la cuenta individual:", "o": ["Pertenecen al afiliado y aumentan su capital para la pensión", "Pertenecen a la AFP", "Se pagan cada mes en efectivo", "Se entregan al Estado"], "e": "Los rendimientos se acumulan en la cuenta del afiliado."}, {"q": "¿Quién define la rentabilidad mínima obligatoria de los fondos de pensiones?", "o": ["La Superintendencia Financiera, con la metodología del Decreto 2555", "Cada AFP libremente", "Colpensiones", "El afiliado"], "e": "La SFC calcula y publica la rentabilidad mínima según la fórmula del decreto."}, {"q": "La rentabilidad mínima obligatoria se calcula combinando:", "o": ["Un componente de referencia con el promedio ponderado de las rentabilidades de los fondos del mismo tipo", "Solo la inflación", "Solo la tasa del Banco de la República", "La rentabilidad de Colpensiones"], "e": "El Decreto 2555 combina un portafolio de referencia y el promedio del sistema, con ponderaciones distintas por tipo de fondo."}, {"q": "En la renta vitalicia, si el pensionado vive muchos más años de lo esperado:", "o": ["La aseguradora sigue pagando la mesada", "La pensión se suspende", "El pensionado debe devolver dinero", "La AFP asume el pago"], "e": "La aseguradora asume el riesgo de longevidad."}, {"q": "En el retiro programado, si el pensionado fallece y no tiene beneficiarios:", "o": ["El saldo restante forma parte de la herencia", "El saldo pasa a la AFP", "El saldo pasa a la aseguradora", "El saldo se pierde"], "e": "Al no haber beneficiarios de pensión, el saldo hace parte de la masa sucesoral."}, {"q": "Los fondos de pensiones voluntarias pueden recibir aportes de:", "o": ["El afiliado, el empleador o ambos", "Solo el Estado", "Solo las AFP", "Solo los pensionados"], "e": "Los aportes voluntarios pueden venir del trabajador, del empleador o de ambos, según los planes."}, {"q": "¿Qué es el seguro previsional del RAIS?", "o": ["El seguro que contrata la AFP para financiar las pensiones de invalidez y sobrevivencia", "Un seguro de vida voluntario", "Un seguro contra la inflación", "Un seguro contra la caída de la bolsa"], "e": "Cuando el capital de la cuenta no alcanza para esas pensiones, la aseguradora pone la suma adicional."}, {"q": "Una persona que cotizó 20 años en el RAIS y llega a la edad de pensión con un capital insuficiente y menos de 1.150 semanas recibe:", "o": ["La devolución de saldos", "La garantía de pensión mínima", "Una renta vitalicia gratuita", "La indemnización sustitutiva de Colpensiones"], "e": "Sin capital suficiente y sin las semanas para la garantía, procede la devolución de saldos."}, {"q": "¿Qué entidad maneja los Beneficios Económicos Periódicos (BEPS)?", "o": ["Colpensiones", "Las AFP privadas", "El Banco de la República", "AMV"], "e": "Colpensiones administra el programa BEPS."}, {"q": "Según la Ley 789 de 2002, el sistema de protección social es:", "o": ["El conjunto de políticas públicas para disminuir la vulnerabilidad y mejorar la calidad de vida en salud, pensión y trabajo", "El conjunto de fondos de pensiones privados", "El régimen de prima media", "Un programa exclusivo de subsidios de vivienda"], "e": "El SPS reúne políticas de seguridad social, promoción social, formación de capital humano, acumulación de activos y manejo de riesgos."}, {"q": "Según el artículo 48 de la Constitución, la seguridad social es:", "o": ["Un servicio público obligatorio, que pueden prestar entidades públicas o privadas bajo la coordinación y control del Estado", "Un servicio voluntario prestado solo por el Estado", "Un negocio privado sin control estatal", "Un beneficio exclusivo de los empleados públicos"], "e": "Es un derecho irrenunciable, de avance progresivo, regido por los principios de eficiencia, universalidad y solidaridad."}, {"q": "Según la guía de AMV, los tres pilares del sistema de protección a la vejez en Colombia son:", "o": ["Subsidiado, contributivo y voluntario", "Público, privado y mixto", "Vejez, invalidez y muerte", "Conservador, moderado y de mayor riesgo"], "e": "El subsidiado atiende a la población de menores ingresos (por ejemplo, BEPS); el contributivo exige cotizaciones (Colpensiones y AFP); el voluntario complementa con ahorro adicional y beneficios tributarios."}, {"q": "Los BEPS (beneficios económicos periódicos) son un ejemplo de prestación del pilar:", "o": ["Subsidiado, en su forma semicontributiva", "Contributivo", "Voluntario", "De retiro programado"], "e": "Son semicontributivos porque el beneficio supera lo que aporta la persona, gracias al subsidio estatal."}, {"q": "Los aportes voluntarios en fondos de pensiones obligatorias o en fondos voluntarios de pensión pertenecen al pilar:", "o": ["Voluntario", "Subsidiado", "Contributivo obligatorio", "Solidario"], "e": "El pilar voluntario lo forman quienes tienen capacidad económica para complementar su cotización, con beneficios tributarios."}, {"q": "El Sistema general de pensiones ampara a sus afiliados frente a las contingencias de:", "o": ["Vejez, invalidez y muerte", "Desempleo, enfermedad y vejez", "Accidentes de trabajo únicamente", "Vivienda y educación"], "e": "Por ley, sus recursos se destinan solo a cubrir esas contingencias y no pertenecen a la Nación ni a las administradoras."}, {"q": "Los recursos del Sistema general de pensiones pertenecen a:", "o": ["Ni a la Nación ni a las entidades que los administran; se destinan exclusivamente a cubrir las contingencias del sistema", "La Nación", "Las AFP", "Colpensiones"], "e": "La ley protege estos recursos con una destinación exclusiva."}, {"q": "¿Puede una persona estar afiliada simultáneamente al RAIS y al RPM?", "o": ["No; son regímenes excluyentes, aunque puede tener planes complementarios dentro o fuera del sistema", "Sí, si cotiza en ambos", "Sí, si es independiente", "Solo después de los 50 años"], "e": "Los dos regímenes compiten entre sí y son excluyentes."}, {"q": "Colpensiones es:", "o": ["Una empresa industrial y comercial del Estado, organizada como entidad financiera de carácter especial, vinculada al Ministerio del Trabajo", "Una sociedad anónima privada", "Un fondo de inversión colectiva", "Un establecimiento bancario"], "e": "Es la administradora pública del régimen de prima media con prestación definida."}, {"q": "En el RAIS, la pensión de vejez es de:", "o": ["Aporte definido: depende del capital acumulado", "Prestación definida: depende del IBL y las semanas", "Monto fijo de un salario mínimo para todos", "Monto definido por la AFP"], "e": "En el RAIS se define el aporte y la pensión resulta del capital. En el RPM se define la prestación con una fórmula."}, {"q": "En el RPM, el ingreso base para calcular la pensión de vejez es el IBC promedio de:", "o": ["Los últimos 10 años o de toda la vida laboral, el que resulte mayor", "El último año", "Los últimos 6 meses", "Los 5 mejores años"], "e": "El IBL toma el mayor entre el promedio de los últimos 10 años y el de toda la vida, si este último es más favorable."}, {"q": "En el RPM, quien cotizó 1.300 semanas recibe una mesada de:", "o": ["Entre el 65 % y el 55 % del IBL, decreciente según el nivel de ingresos, sin bajar de un salario mínimo", "El 100 % del último salario", "El 80 % del IBL siempre", "Un salario mínimo siempre"], "e": "Por cada 50 semanas adicionales sube 1,5 puntos del IBL, sin pasar del 80 % (art. 34 de la Ley 100)."}, {"q": "En el RPM, por cada 50 semanas adicionales a las mínimas, el porcentaje de la pensión aumenta:", "o": ["1,5 % del IBL, hasta un máximo del 80 %", "5 %, sin límite", "0,5 %, hasta el 70 %", "No aumenta"], "e": "Es la regla del artículo 34 de la Ley 100 de 1993."}, {"q": "¿Cómo se financia la garantía de pensión mínima en el RAIS?", "o": ["Con un fondo al que aportan todos los afiliados al RAIS (1,5 % de la cotización), administrado por las AFP", "Con el presupuesto de Colpensiones", "Con las comisiones de las AFP", "Con el impuesto de renta de los afiliados"], "e": "En el RPM, el faltante del fondo común se cubre con el Presupuesto General de la Nación."}, {"q": "Para acceder a la garantía de pensión mínima en el RAIS, se requiere:", "o": ["57 años las mujeres o 62 los hombres, con 1.150 semanas cotizadas", "1.300 semanas y 60 años", "Cualquier edad", "Solo 500 semanas"], "e": "Si el capital no alcanza para una pensión mínima, la garantía completa la diferencia."}, {"q": "En el RAIS, un afiliado puede pensionarse a cualquier edad si:", "o": ["Su capital financia una pensión de al menos el 110 % del salario mínimo", "Tiene 1.000 semanas", "Su AFP lo autoriza", "Tiene más de 50 años"], "e": "Es la pensión anticipada del RAIS. La garantía de pensión mínima, en cambio, exige edad y semanas."}, {"q": "En el RAIS, los excedentes de libre disponibilidad pueden retirarse si la pensión resultante es:", "o": ["Igual o mayor al 70 % del IBL (sin exceder 15 veces la pensión mínima) e igual o mayor al 110 % de la pensión mínima", "Igual a un salario mínimo", "Inferior al 50 % del IBL", "En el RPM, siempre"], "e": "Se puede disponer del capital que exceda el requerido para esa pensión. En el RPM no existen excedentes."}, {"q": "Si un afiliado al RPM no cumple los requisitos de pensión, recibe:", "o": ["La indemnización sustitutiva: devolución de aportes actualizados con IPC", "La devolución de saldos con rendimientos", "Una pensión de salario mínimo", "Nada"], "e": "En el RAIS el equivalente es la devolución de saldos (aportes más rendimientos). En ambos casos los recursos pasan a BEPS salvo que el afiliado decida otra cosa en seis meses."}, {"q": "Cuando un afiliado no cumple requisitos de pensión, sus recursos se trasladan a BEPS, salvo que dentro de los seis meses siguientes:", "o": ["Decida recibir la prestación o sumar semanas con su cónyuge o compañero para una pensión familiar", "Pague una multa", "Cambie de AFP", "Se afilie a una caja de compensación"], "e": "La pensión familiar permite sumar las cotizaciones de la pareja para alcanzar la pensión."}, {"q": "Si un afiliado del RAIS fallece sin beneficiarios de pensión, el saldo de su cuenta:", "o": ["Forma parte de la masa sucesoral (es heredable)", "Pasa a Colpensiones", "Se queda en la AFP", "Pasa al Fondo de Solidaridad"], "e": "En el RPM no hay cuenta individual heredable."}, {"q": "En el RPM, el Estado garantiza el pago de los beneficios cuando:", "o": ["Se agoten los ingresos y reservas de Colpensiones", "La AFP quiebre", "El afiliado lo solicite", "Nunca"], "e": "En el RAIS, el Estado garantiza los ahorros y el pago de las pensiones de los afiliados."}, {"q": "¿Quién ejerce la vigilancia sobre el RAIS y el RPM?", "o": ["La Superintendencia Financiera de Colombia en ambos", "El Ministerio de Hacienda en el RAIS y la SFC en el RPM", "AMV en ambos", "La Contraloría"], "e": "Ambos regímenes están vigilados por la SFC."}, {"q": "¿Son iguales los requisitos de las pensiones de invalidez y de sobrevivientes en el RAIS y en el RPM?", "o": ["Sí, son los mismos en los dos regímenes", "No, en el RAIS son más exigentes", "No, en el RPM no existen", "Solo para mujeres"], "e": "Están en los artículos 38 a 41, 46, 48, 69 y 73 de la Ley 100 de 1993."}, {"q": "Para tener derecho a pensión de invalidez o de sobrevivientes, el afiliado debe haber cotizado al menos:", "o": ["50 semanas en los tres años anteriores al hecho", "1.300 semanas", "100 semanas en el último año", "500 semanas en total"], "e": "Es la regla de los artículos 38 y 46 de la Ley 100. Por eso es importante mantenerse cotizando."}, {"q": "El seguro previsional de las AFP cubre la invalidez y la muerte de origen:", "o": ["Común; las de origen laboral las cubren las ARL", "Laboral", "Común y laboral", "Solo la muerte"], "e": "La AFP contrata la póliza colectiva por licitación pública con una aseguradora de vida autorizada en el ramo."}, {"q": "Del 16 % de la cotización a pensiones en el RAIS, ¿qué porcentaje se destina a la prima del seguro previsional y a la comisión de administración?", "o": ["3 %", "1,5 %", "10 %", "16 %"], "e": "El resto va principalmente a la cuenta individual y al fondo de garantía de pensión mínima (1,5 %)."}, {"q": "En el RPM, las contingencias de invalidez y muerte:", "o": ["Pueden ser asumidas por Colpensiones con cargo al fondo común, o contratar seguros", "Las cubre la AFP", "No se cubren", "Las cubre la ARL siempre"], "e": "Colpensiones constituye reservas o contrata seguros."}, {"q": "Para trasladarse de régimen pensional, el afiliado debe recibir previamente:", "o": ["Doble asesoría: de la administradora de cada régimen", "Una autorización de la SFC", "Un concepto de AMV", "Asesoría solo de la AFP"], "e": "La selección de régimen es libre y voluntaria, pero el traslado exige la doble asesoría."}, {"q": "¿Cuál de las siguientes NO es una prestación del Sistema general de pensiones?", "o": ["Auxilio de cesantía", "Pensión familiar", "Auxilio funerario", "Indemnización sustitutiva"], "e": "Las prestaciones son: pensiones de vejez, invalidez, sobrevivencia y familiar, auxilio funerario, garantía de pensión mínima, indemnización sustitutiva y devolución de saldos. Las cesantías son una prestación laboral."}, {"q": "¿Cuál de las siguientes NO es una modalidad de pensión en el RAIS?", "o": ["Pensión de prima media", "Renta vitalicia inmediata", "Retiro programado", "Retiro programado con renta vitalicia diferida"], "e": "El RAIS ofrece renta vitalicia inmediata, retiro programado, retiro programado con renta vitalicia diferida y otras aprobadas por la SFC. El RPM tiene una sola modalidad."}, {"q": "En la renta vitalicia inmediata, la mesada se ajusta cada año según:", "o": ["El IPC certificado por el DANE", "El salario mínimo", "La DTF", "La rentabilidad del fondo"], "e": "La contrata el afiliado de forma irrevocable con la aseguradora que elija; por ser irrevocable no puede cambiar de modalidad."}, {"q": "En la renta vitalicia inmediata, ¿quién paga la mesada?", "o": ["La aseguradora elegida por el afiliado", "La AFP con cargo a la cuenta individual", "Colpensiones", "El empleador"], "e": "En el retiro programado, en cambio, la paga la AFP contra la cuenta individual."}, {"q": "En el retiro programado, la mesada mensual es:", "o": ["La doceava parte de una anualidad que se recalcula cada año según el saldo, las tablas de mortalidad y la rentabilidad esperada", "Un valor fijo de por vida", "El 10 % del saldo cada mes", "Lo que decida la AFP"], "e": "Por eso la mesada puede variar año a año."}, {"q": "En el retiro programado, si el saldo se acerca al capital necesario para una pensión de un salario mínimo, la AFP debe:", "o": ["Contratar una renta vitalicia de salario mínimo con una aseguradora", "Suspender la pensión", "Devolver el saldo", "Pedir aportes adicionales"], "e": "El saldo nunca puede ser inferior al capital para financiar una renta vitalicia de un salario mínimo."}, {"q": "Los bonos pensionales son:", "o": ["Títulos de deuda pública que ayudan a formar el capital para financiar la pensión", "Acciones de las AFP", "Bonos de las aseguradoras", "Cupones de descuento"], "e": "Reconocen el tiempo cotizado en el régimen anterior y se suman al capital de la cuenta."}, {"q": "En el retiro programado con renta vitalicia diferida, la renta vitalicia diferida no puede ser inferior a:", "o": ["La pensión mínima de vejez vigente", "El 70 % del IBL", "Dos salarios mínimos", "El último salario"], "e": "El afiliado recibe retiro programado hasta que la aseguradora empieza a pagar la renta vitalicia."}, {"q": "En la renta temporal variable con renta vitalicia inmediata:", "o": ["El afiliado recibe dos mesadas a la vez: la renta vitalicia de la aseguradora y la renta temporal de la AFP", "Solo recibe la renta de la AFP", "No recibe pago hasta los 70 años", "Recibe todo el capital en un pago"], "e": "Si fallece, la renta vitalicia pasa a beneficiarios o se extingue; el saldo de la renta temporal entra a la herencia."}, {"q": "En la renta temporal cierta con renta vitalicia de diferimiento cierto:", "o": ["La aseguradora paga primero una renta temporal y luego una renta vitalicia; los riesgos de mercado y de longevidad los asume la aseguradora", "La AFP asume todos los riesgos", "El afiliado puede cambiarla cada año", "No hay renta vitalicia"], "e": "Es irrevocable. Si el pensionado fallece en el periodo temporal sin beneficiarios, lo que falte de esa renta va a la herencia."}, {"q": "El retiro programado sin negociación del bono pensional exige que el afiliado tenga capital para cubrir:", "o": ["El 130 % de las mesadas proyectadas hasta la redención normal del bono", "El 100 % del bono", "El 70 % del IBL", "10 años de mesadas"], "e": "El bono se redime en su fecha normal: a los 62 años en hombres y 60 en mujeres."}, {"q": "¿A qué edad se redime normalmente el bono pensional de una mujer?", "o": ["60 años", "57 años", "62 años", "65 años"], "e": "Para los hombres es a los 62 años."}, {"q": "Las AFP son:", "o": ["Sociedades de servicios financieros con objeto social exclusivo, vigiladas por la SFC", "Establecimientos bancarios", "Entidades públicas", "Fondos de inversión colectiva"], "e": "Tienen el carácter de entidades financieras."}, {"q": "Según el artículo 72 del EOSF, los administradores de una AFP deben abstenerse de:", "o": ["Concentrar riesgos por encima de los límites legales", "Valorar diariamente los fondos", "Atender quejas de los afiliados", "Publicar su política de inversión"], "e": "También: operar con vinculados sobre los límites, facilitar evasión fiscal, ejercer cargos sin posesión ante la SFC, obstruir la supervisión y usar información reservada."}, {"q": "¿Cuál es el máximo órgano social de una AFP?", "o": ["La asamblea de accionistas", "La junta directiva", "El comité de inversiones", "El revisor fiscal"], "e": "Se reúne al menos una vez al año y elige junta directiva, revisor fiscal y defensor del consumidor financiero."}, {"q": "La junta directiva de una AFP debe tener:", "o": ["Un número impar de miembros, no menor de cinco, con al menos uno de los trabajadores afiliados y otro de los empleadores", "Exactamente tres miembros", "Solo representantes de los accionistas", "Un número par de miembros"], "e": "Lo dispone el artículo 73 del EOSF. Los representantes de los afiliados se eligen en asambleas donde cada trabajador vota según sus unidades."}, {"q": "¿Quién aprueba la asignación estratégica de activos de cada tipo de fondo de pensiones obligatorias?", "o": ["La junta directiva de la AFP", "La asamblea de accionistas", "La SFC", "Cada afiliado"], "e": "La junta aprueba la política de inversión y la asignación estratégica, apoyada en los comités de riesgos e inversiones."}, {"q": "¿Quién elige al revisor fiscal de los fondos de pensiones obligatorias?", "o": ["Una comisión con tres representantes de los afiliados y los accionistas de la AFP", "La asamblea de accionistas sola", "La SFC", "El representante legal"], "e": "El revisor fiscal de la AFP lo elige su asamblea de accionistas."}, {"q": "La política de inversión de los fondos de pensiones obligatorias debe enviarse a la SFC:", "o": ["15 días hábiles antes de su publicación", "Después de publicarla", "Cada cinco años", "No se envía"], "e": "Se divulga en la página web e incluye objetivos, estructura, criterios de selección, derivados, repos, contrapartes, límites, riesgos, conflictos de interés e inversiones alternativas."}, {"q": "Los comités de riesgo y de inversiones de una AFP deben tener:", "o": ["Al menos cinco miembros (número impar), con al menos un miembro de la junta y uno independiente", "Tres miembros", "Solo miembros independientes", "Solo empleados de la AFP"], "e": "Los designa la junta directiva, que también evalúa su desempeño."}, {"q": "¿En qué comité de la AFP se toman las decisiones de inversión según la política y la asignación estratégica aprobadas?", "o": ["En el comité de inversiones", "En la asamblea de accionistas", "En el comité de auditoría", "En la revisoría fiscal"], "e": "El comité de inversiones también analiza los posibles conflictos de interés del proceso de inversión."}, {"q": "Según la Ley 1870 de 2017, ¿qué fondos NO se consideran vinculados a un conglomerado financiero?", "o": ["Los fondos de pensiones obligatorias, de cesantías y voluntarios cuya política de inversión no definan las entidades del conglomerado", "Todos los fondos de la AFP", "Los FIC de las fiduciarias", "Ninguno"], "e": "Así lo aclara el artículo 2.39.3.1.2 del Decreto 2555."}, {"q": "¿Cuál de los siguientes NO es un principio orientador sobre conflictos de interés e información privilegiada?", "o": ["Rentabilidad garantizada", "Transparencia", "Reserva", "Lealtad"], "e": "Los principios son transparencia, reserva, utilización adecuada de la información, lealtad, profesionalismo y adecuación a la ley."}, {"q": "El uso indebido de información privilegiada está tipificado como delito en:", "o": ["El artículo 258 del Código Penal", "La Ley 100 de 1993", "El Código de Comercio", "La Ley 1328 de 2009"], "e": "Además de la sanción penal, hay sanciones administrativas y disciplinarias."}, {"q": "Una AFP puede adquirir acciones de su matriz o de sus subordinadas:", "o": ["No, está prohibido", "Sí, sin límite", "Sí, hasta el 10 %", "Solo con autorización de la asamblea de afiliados"], "e": "También le está prohibido negociar títulos emitidos, avalados o garantizados por su matriz, filiales o subsidiarias."}, {"q": "Si un fondo de pensiones obligatorias no alcanza la rentabilidad mínima, la AFP debe:", "o": ["Responder con recursos propios, empezando por la reserva de estabilización de rendimientos", "Reducir las pensiones", "Cobrar más comisión", "Pedir recursos a la Nación"], "e": "Lo establece el artículo 101 de la Ley 100, modificado por la Ley 1328 de 2009."}, {"q": "¿Quién calcula, verifica y divulga la rentabilidad mínima obligatoria de los fondos de pensiones obligatorias?", "o": ["La Superintendencia Financiera de Colombia", "Asofondos", "El Banco de la República", "Cada AFP"], "e": "La SFC la verifica mensualmente y la divulga a más tardar el quinto día hábil siguiente a la verificación."}, {"q": "En el cálculo de la rentabilidad mínima del fondo conservador, el peso del componente de referencia es:", "o": ["30 %, y 70 % el promedio de rentabilidad de los fondos", "50 %", "10 %", "100 %"], "e": "Moderado: 20 % referencia y 80 % promedio. Mayor riesgo: 10 % y 90 %."}, {"q": "La rentabilidad mínima del fondo moderado es la menor entre:", "o": ["La suma de los factores menos 300 puntos básicos y la suma disminuida en un 35 %", "El IPC y la DTF", "La suma menos 200 pb y disminuida 30 %", "La suma menos 400 pb y disminuida 40 %"], "e": "Conservador: menos 200 pb o −30 %. Moderado: menos 300 pb o −35 %. Mayor riesgo: menos 400 pb o −40 %."}, {"q": "La suma ponderada de factores para el fondo de mayor riesgo es 10 %. ¿Cuál es su rentabilidad mínima?", "o": ["6 %", "5,5 %", "8 %", "7 %"], "e": "Opción A: 10 % − 4 % = 6 %. Opción B: 10 % × (1 − 0,40) = 6 %. Ambas dan 6 %, y se toma la menor."}, {"q": "La suma ponderada de factores para el fondo conservador es 8 %. ¿Cuál es su rentabilidad mínima?", "o": ["5,6 %", "6 %", "8 %", "4 %"], "e": "Opción A: 8 % − 2 % = 6 %. Opción B: 8 % × 0,70 = 5,6 %. La mínima es la menor: 5,6 %."}, {"q": "La suma ponderada de factores para el fondo moderado es 12 %. ¿Cuál es su rentabilidad mínima?", "o": ["7,8 %", "9 %", "8,4 %", "12 %"], "e": "Opción A: 12 % − 3 % = 9 %. Opción B: 12 % × 0,65 = 7,8 %. Se toma la menor: 7,8 %."}, {"q": "¿Cuál es el período de cálculo de la rentabilidad mínima del fondo moderado?", "o": ["48 meses", "36 meses", "60 meses", "12 meses"], "e": "Conservador 36, moderado 48, mayor riesgo 60 y retiro programado 48 meses."}, {"q": "¿Cuál es el período de cálculo de la rentabilidad mínima del fondo especial de retiro programado?", "o": ["48 meses", "36 meses", "60 meses", "24 meses"], "e": "Es el mismo período que el fondo moderado."}, {"q": "La rentabilidad de cada tipo de fondo de pensiones obligatorias se mide con la metodología de:", "o": ["Valor del activo neto: valor de la unidad al momento del cálculo frente a su valor inicial", "Costo histórico", "Valor nominal de los títulos", "Promedio de tasas de mercado"], "e": "Así lo establece el artículo 2.6.5.1.3 del Decreto 2555."}, {"q": "La asignación estratégica de activos de los fondos de pensiones debe establecerse:", "o": ["Anualmente y enviarse a la SFC dentro de los 3 días hábiles siguientes a su aprobación", "Cada cinco años", "Mensualmente", "Solo cuando la SFC lo pida"], "e": "Debe incluir horizonte, rentabilidad objetivo, volatilidad esperada, modelos de optimización, límites por clase de activo y proyecciones."}, {"q": "Las AFP deben ejercer los derechos políticos de sus inversiones cuando la participación es relevante, es decir, cuando sumando los fondos tienen:", "o": ["5 % o más del capital del emisor o de una emisión", "1 %", "50 %", "Cualquier participación"], "e": "También si un solo fondo tiene en un emisor o emisión el 5 % o más de su propio valor (Decreto 1393 de 2020)."}, {"q": "La política de ejercicio de derechos políticos de una AFP:", "o": ["La aprueba la junta directiva, se publica en la web y se revisa al menos una vez al año", "La aprueba la SFC", "No existe obligación de tenerla", "La decide cada afiliado"], "e": "La AFP debe actuar en interés de los afiliados y designar representantes para votar."}, {"q": "El mecanismo de registro de operaciones de una AFP debe:", "o": ["Identificar cada operación y el tipo de fondo al que pertenece, con respaldo diario y traza de auditoría", "Permitir cambiar el fondo de una operación después de ejecutada", "Llevarse en papel", "Ser opcional"], "e": "Los resultados de una operación no pueden afectar un fondo distinto al indicado inicialmente."}, {"q": "¿Qué deben revisar las AFP sobre el gobierno corporativo de los emisores en los que invierten?", "o": ["Composición de sus órganos, asignación de funciones, revelación de información, protección de minoritarios y manejo de conflictos", "Solo su rentabilidad", "Solo su calificación", "Nada"], "e": "La junta debe adoptar criterios para evaluar el gobierno corporativo del emisor."}, {"q": "Cada tipo de fondo de pensiones obligatorias debe tener:", "o": ["NIT propio, separación patrimonial, contabilidad independiente y cuentas bancarias exclusivas", "El mismo NIT de la AFP", "Una contabilidad conjunta con la AFP", "Un único NIT para los cuatro fondos"], "e": "Cada tipo de fondo es un patrimonio autónomo."}, {"q": "¿Qué fondo administra los recursos de los pensionados por retiro programado y beneficiarios de sobrevivencia?", "o": ["El fondo especial de retiro programado", "El fondo conservador", "El fondo moderado", "El fondo de cesantías"], "e": "Es el fondo de la etapa de desacumulación, orientado al pago de mesadas."}, {"q": "A diferencia de la asignación por defecto, las reglas de convergencia son:", "o": ["Obligatorias para el afiliado y la administradora", "Opcionales para el afiliado", "Solo para mujeres", "Recomendaciones de la SFC"], "e": "Obligan a trasladar los saldos progresivamente hacia fondos de menor riesgo hasta el conservador."}, {"q": "Según las reglas de convergencia, a partir de qué edad un hombre ya no puede tener recursos en el fondo de mayor riesgo:", "o": ["47 años (pasa gradualmente a moderado y a los 51 tiene 100 % en moderado)", "62 años", "40 años", "55 años"], "e": "Desde los 47 se mueve 20 % por año al moderado. Desde los 55 empieza a pasar al conservador y a los 59 tiene 100 % allí."}, {"q": "Una mujer afiliada al RAIS cumple 54 años. Según las reglas de convergencia, sus recursos deben estar:", "o": ["100 % en el fondo conservador", "100 % en el fondo de mayor riesgo", "50 % moderado y 50 % conservador", "100 % en el moderado"], "e": "Las mujeres empiezan a converger a los 42 hacia el moderado y desde los 50 hacia el conservador, con 100 % conservador a los 54."}, {"q": "Una mujer de 51 años en el RAIS, según las reglas de convergencia, tiene:", "o": ["60 % en moderado y 40 % en conservador", "100 % en mayor riesgo", "100 % en conservador", "80 % en mayor riesgo"], "e": "A los 50: 80/20; a los 51: 60/40; a los 52: 40/60; a los 53: 20/80; a los 54: 0/100 (moderado/conservador)."}, {"q": "Un hombre de 49 años en el RAIS, según las reglas de convergencia, tiene:", "o": ["40 % en mayor riesgo y 60 % en moderado", "100 % en mayor riesgo", "100 % en conservador", "80 % en conservador"], "e": "Hombres: a los 47 80/20, a los 48 60/40, a los 49 40/60, a los 50 20/80 y de 51 a 54 0/100 (mayor riesgo/moderado)."}, {"q": "Las cotizaciones voluntarias a un fondo de pensiones obligatorias se administran:", "o": ["En el mismo tipo de fondo de los aportes obligatorios, con las mismas reglas de convergencia", "En un fondo aparte elegido libremente", "En el fondo conservador siempre", "En Colpensiones"], "e": "Pueden retirarse con solicitud de al menos seis meses de antelación."}, {"q": "¿Con qué antelación debe solicitarse el retiro de cotizaciones voluntarias en un fondo de pensiones obligatorias?", "o": ["No menos de seis meses", "Un día hábil", "Un año", "No pueden retirarse"], "e": "Lo establece el Decreto 1833 de 2016."}, {"q": "Si la reserva de estabilización de rendimientos queda por debajo de lo requerido, la SFC impone una multa en favor de la solidaridad pensional del:", "o": ["3,5 % del defecto mensual", "1 % del fondo", "10 % del defecto", "0,5 % del patrimonio de la AFP"], "e": "Además, si la reserva se usa para cubrir la rentabilidad mínima, debe restablecerse al mes siguiente."}, {"q": "La reserva de estabilización de rendimientos está formada por:", "o": ["Recursos propios de la AFP, representados en unidades del respectivo fondo", "Aportes de los afiliados", "Recursos del Presupuesto Nacional", "Primas del seguro previsional"], "e": "Debe ser al menos el 1 % del valor del fondo y se ajusta mensualmente."}, {"q": "¿Cuál de las siguientes es una inversión admisible para los fondos de pensiones obligatorias?", "o": ["Participaciones en fondos de capital privado", "Préstamos a los accionistas de la AFP", "Acciones de la matriz de la AFP", "Criptomonedas sin regulación"], "e": "Son admisibles, entre otros, deuda pública, títulos de vigilados, titularizaciones, FIC, acciones, FCP, títulos del exterior, hedge funds regulados, derivados, repos activos, estructurados de capital protegido y TTV."}, {"q": "Los fondos de pensiones obligatorias pueden hacer operaciones con derivados:", "o": ["Con fines de cobertura y de inversión", "Solo especulativos", "No pueden usar derivados", "Solo con autorización de cada afiliado"], "e": "Están entre las 'otras inversiones y operaciones' admisibles."}, {"q": "Los títulos de los fondos de pensiones obligatorias y de cesantías que puedan custodiarse deben mantenerse:", "o": ["En depósitos centralizados de valores autorizados por la SFC (o custodios del exterior para valores en el extranjero)", "En la caja fuerte de la AFP", "En poder de cada afiliado", "En la BVC"], "e": "El custodio no puede prestar esos activos ni usarlos para liquidar deudas con la AFP."}, {"q": "La política de inversión de una AFP respecto a los riesgos ASG y climáticos debe:", "o": ["Explicar cómo se integran, o justificar explícitamente por qué no se incluyen", "Ignorarlos", "Prohibir inversiones en energía", "Ser aprobada por AMV"], "e": "Lo exige la Circular Básica Jurídica."}, {"q": "¿Quiénes son los partícipes de un fondo voluntario de pensión?", "o": ["Las personas naturales en cuyo interés se crea el plan", "Las empresas que hacen aportes", "Las aseguradoras", "Los accionistas de la administradora"], "e": "Los patrocinadores son empresas, sindicatos, asociaciones o gremios que crean o desarrollan planes institucionales. Los beneficiarios reciben las prestaciones."}, {"q": "Las prestaciones de un plan voluntario de pensión pueden consistir en:", "o": ["El pago de un capital o de una renta temporal o vitalicia", "Solo una renta vitalicia", "Solo una pensión mínima", "Acciones de la administradora"], "e": "Lo define el artículo 2.42.1.1.2 del Decreto 2555."}, {"q": "Los planes voluntarios de pensión solo pueden ser de:", "o": ["Contribución definida", "Prestación definida", "Beneficio garantizado", "Reparto"], "e": "Se define el aporte; las prestaciones dependen de la capitalización."}, {"q": "Un plan de pensiones voluntarias al que puede vincularse cualquier persona natural se denomina:", "o": ["Abierto o individual", "Institucional", "Cerrado", "Condicionado"], "e": "En los planes institucionales solo participan trabajadores, contratistas o miembros del patrocinador."}, {"q": "En un plan institucional condicionado, el partícipe:", "o": ["No adquiere la propiedad de los aportes hasta que se cumplan las condiciones del patrocinador", "Dispone de los aportes desde el primer día", "Nunca recibe los aportes", "Debe devolver los aportes"], "e": "Cuando se cumplen las condiciones ocurre la consolidación de aportes. En los no condicionados, se consolidan al aportar."}, {"q": "Las condiciones de un plan institucional condicionado deben:", "o": ["Ser física y moralmente posibles y no depender de la mera voluntad del patrocinador", "Depender solo de la voluntad del patrocinador", "Ser secretas", "Ser imposibles de cumplir"], "e": "Deben ser hechos o conductas que puedan ocurrir en el futuro."}, {"q": "Los aportes de una empresa a un plan institucional de pensiones voluntarias:", "o": ["No constituyen salario ni base de aportes a seguridad social, salvo pacto expreso", "Son salario", "Son base de parafiscales", "Están prohibidos"], "e": "Por eso son una herramienta de remuneración competitiva."}, {"q": "En una alternativa autogestionada de un fondo voluntario de pensión:", "o": ["El partícipe elige libremente los portafolios y el porcentaje de cada uno", "La administradora decide todo", "La administradora elige los portafolios y el partícipe los montos", "La SFC asigna los portafolios"], "e": "Estandarizada: la administradora decide portafolios y porcentajes. Flexible: la administradora elige portafolios y el partícipe los montos."}, {"q": "En una alternativa flexible de un fondo voluntario de pensión:", "o": ["La administradora selecciona los portafolios y el partícipe decide cuánto invierte en cada uno", "El partícipe elige todo", "La administradora decide todo", "No hay portafolios"], "e": "Es un punto intermedio entre la estandarizada y la autogestionada."}, {"q": "Un portafolio cerrado de un fondo voluntario de pensión es aquel en el que:", "o": ["Solo se puede entrar o redimir en momentos fijados en el prospecto", "Se puede entrar y salir en cualquier momento", "Nunca se puede redimir", "Solo invierten empresas"], "e": "En los portafolios abiertos se entra y se redime en cualquier momento."}, {"q": "¿Cuál de los siguientes activos es admisible en un fondo voluntario de pensión?", "o": ["Inmuebles y proyectos inmobiliarios", "Préstamos a la administradora", "Acciones propias de la administradora", "Ninguno distinto de TES"], "e": "Los FVP pueden invertir en valores inscritos o no, títulos valores, valores del exterior, fondos, divisas, inmuebles, commodities y derivados de inversión."}, {"q": "Los recursos de un fondo voluntario de pensión de una persona fallecida:", "o": ["Forman parte de la masa sucesoral y se entregan por las reglas de sucesión", "Pasan a la administradora", "Pasan al Estado", "Se pierden"], "e": "Los interesados deben adelantar el trámite sucesoral."}, {"q": "Las cotizaciones voluntarias y sus rendimientos son inembargables como las cuentas de ahorro, salvo para:", "o": ["Créditos alimentarios", "Deudas bancarias", "Impuestos", "Ninguna excepción"], "e": "La SFC actualiza cada año el monto inembargable."}, {"q": "Las fichas técnicas de los portafolios de un fondo voluntario de pensión se actualizan:", "o": ["Mensualmente, dentro de los 5 días hábiles siguientes al cierre del mes, y quedan publicadas al menos 12 meses", "Anualmente", "Cada semestre", "Solo cuando cambia el portafolio"], "e": "Cada portafolio tiene su ficha técnica."}, {"q": "Los extractos de un fondo voluntario de pensión deben enviarse:", "o": ["Al menos trimestralmente, dentro de los 10 días hábiles siguientes al cierre del trimestre", "Cada año", "Cada mes", "Solo a solicitud"], "e": "También deben quedar disponibles en la página web."}, {"q": "El revisor fiscal de un fondo voluntario de pensión:", "o": ["Debe ser el mismo de la sociedad administradora, con reportes independientes", "Lo elige la SFC", "Lo eligen los partícipes", "No es obligatorio"], "e": "Lo establece el artículo 2.42.1.4.3 del Decreto 2555."}, {"q": "La asesoría en los fondos voluntarios de pensión se rige por:", "o": ["Las mismas reglas de asesoría del mercado de valores (Libro 40, Parte 2, Decreto 2555)", "Ninguna regla", "La Ley 100", "El Código Civil"], "e": "Se da antes de la vinculación y en cualquier momento de la permanencia, por personas inscritas en el RNPMV y certificadas."}, {"q": "En una alternativa estandarizada, el documento descriptivo debe incluir, entre otros:", "o": ["Las comisiones, el plan de inversiones, el benchmark y la política de rebalanceo", "La lista de partícipes", "La rentabilidad garantizada", "El salario del gerente"], "e": "Para las alternativas flexibles y autogestionadas se entrega un enlace a los prospectos y fichas técnicas y un informe con las condiciones elegidas."}, {"q": "Las entidades territoriales pueden contratar patrimonios autónomos para garantizar sus obligaciones pensionales con:", "o": ["AFP, sociedades fiduciarias, o consorcios o uniones temporales de estas", "Solo con bancos", "Solo con Colpensiones", "Con cualquier comisionista"], "e": "Estos patrimonios siguen el régimen de inversión del Fonpet (Decreto 1068 de 2015)."}, {"q": "La conmutación pensional consiste en:", "o": ["Transferir a un tercero la responsabilidad del pago de pensiones a cargo de un empleador mediante el pago de una suma", "Cambiar de régimen pensional", "Pasar del RAIS al RPM", "Aumentar la mesada"], "e": "Es total si el empleador se libera de toda responsabilidad, o parcial si la conserva. La normalización es el género y la conmutación la especie."}, {"q": "La conmutación pensional puede hacerse con:", "o": ["Colpensiones, AFP o aseguradoras, con autorización de la SFC y concepto favorable del Ministerio del Trabajo", "Solo con la DIAN", "Solo con bancos", "Sin autorización alguna"], "e": "Puede constituirse un patrimonio autónomo para ello."}, {"q": "¿En cuál caso es obligatoria la normalización del pasivo pensional?", "o": ["Cuando se liquida una entidad con pasivos pensionales a su cargo", "Siempre que una empresa tenga utilidades", "Cuando un trabajador renuncia", "Nunca"], "e": "También en acuerdos de reorganización (Ley 1116), reestructuraciones territoriales (Ley 550) o cuando lo ordene el Ministerio."}, {"q": "¿En cuánto tiempo debe la entidad de destino responder una solicitud de traslado de cesantías?", "o": ["Máximo 15 días hábiles", "1 día hábil", "6 meses", "Un año"], "e": "La solicitud se presenta ante la entidad de destino con copia de la comunicación al administrador actual y al empleador."}, {"q": "Las cesantías pueden trasladarse:", "o": ["Entre administradoras de cesantías o hacia el Fondo Nacional del Ahorro", "Solo a Colpensiones", "No pueden trasladarse", "Solo a un FIC"], "e": "El trámite está en el Decreto 1072 de 2015."}, {"q": "¿Cuál de las siguientes causas permite el retiro TOTAL de las cesantías?", "o": ["Cambio a salario integral", "Pago del impuesto predial de la vivienda", "Pago de educación superior", "Ahorro programado"], "e": "Retiro total: terminación del contrato, sustitución de empleador, servicio militar, cambio a salario integral y fallecimiento. Las demás son de retiro parcial."}, {"q": "¿Cuál de las siguientes causas permite el retiro PARCIAL de las cesantías?", "o": ["Compra de acciones del Estado en procesos de privatización", "Terminación del contrato", "Fallecimiento del trabajador", "Sustitución de empleador"], "e": "Retiro parcial: educación superior, ahorro programado o seguro educativo, acciones del Estado, vivienda, créditos de vivienda e impuestos de la vivienda."}, {"q": "El portafolio de largo plazo de cesantías está orientado a recursos con horizonte de permanencia:", "o": ["Mayor a un año", "Menor a un mes", "De un día", "Exactamente seis meses"], "e": "El de corto plazo atiende recursos con horizonte de permanencia corto."}, {"q": "Los aportes voluntarios a fondos de pensiones obligatorias son ingreso no constitutivo de renta hasta:", "o": ["El 25 % del ingreso, sin exceder 2.500 UVT al año", "El 30 % del ingreso y 3.800 UVT", "El 40 % y 5.040 UVT", "Sin límite"], "e": "Lo establece el artículo 55 del Estatuto Tributario (modificado por la Ley 1943 de 2018)."}, {"q": "Los aportes voluntarios a fondos voluntarios de pensión son renta exenta hasta:", "o": ["El 30 % del ingreso laboral o tributario, sumados con las AFC, sin exceder 3.800 UVT al año", "El 25 % y 2.500 UVT", "El 10 % y 1.000 UVT", "Sin límite"], "e": "Además entran en el límite conjunto de rentas exentas y deducciones de la cédula general (40 %, hoy máximo 1.340 UVT)."}, {"q": "El límite conjunto de rentas exentas y deducciones de la cédula general, desde 2023, es:", "o": ["40 % de la renta líquida, sin exceder 1.340 UVT al año", "40 % sin exceder 5.040 UVT", "30 % sin límite", "25 % y 2.500 UVT"], "e": "La Ley 2277 de 2022 redujo el tope anual de 5.040 a 1.340 UVT."}, {"q": "Los aportes de una empresa patrocinadora a fondos voluntarios de pensión son deducibles hasta:", "o": ["3.800 UVT al año por trabajador", "2.500 UVT", "1.000 UVT", "Sin límite"], "e": "Lo establece el artículo 126-1 del Estatuto Tributario."}, {"q": "¿Cuál de las siguientes condiciones mantiene el beneficio tributario al retirar recursos de un fondo voluntario de pensión?", "o": ["Que cada aporte haya permanecido más de 10 años", "Que se retire antes de un año", "Que se use para viajes", "Que se retire a un tercero"], "e": "También: cumplir requisitos de pensión de vejez o destinarlos a vivienda (compra, crédito o leasing habitacional)."}, {"q": "Si se retiran sin cumplir requisitos aportes a un fondo voluntario hechos desde 2017 que se usaron como renta exenta, el fondo practica una retención del:", "o": ["7 %", "35 %", "15 %", "0 %"], "e": "Los recursos se vuelven ingreso gravado en el año del retiro."}, {"q": "Si se retiran aportes voluntarios de un fondo de pensiones obligatorias para un fin distinto a mejorar la pensión o pensionarse anticipadamente, la retención es del:", "o": ["35 % sobre capital y rendimientos", "7 %", "0 %", "4 por mil"], "e": "Aplica a aportes desde 2013, según el artículo 55 del Estatuto Tributario."}, {"q": "Las mesadas pensionales están exentas del impuesto de renta hasta:", "o": ["1.000 UVT mensuales", "2.500 UVT anuales", "Un salario mínimo", "No están exentas"], "e": "Los aportes voluntarios a FPO usados para mejorar la pensión reciben este mismo trato."}, {"q": "Los traslados hacia fondos de pensiones voluntarias están exentos del GMF (4 por mil) cuando:", "o": ["La cuenta de origen y la de destino están en la misma entidad y a nombre del mismo y único titular", "Se hacen en efectivo", "Son a nombre de terceros", "Superan 1.000 UVT"], "e": "Los retiros también están exentos de GMF hasta el pago al pensionado, afiliado o beneficiario."}, {"q": "Un retiro de un fondo voluntario de pensión de aportes que NO usaron beneficio tributario:", "o": ["No genera efecto en el capital, pero sus rendimientos sí son ingreso gravado", "Siempre es renta exenta", "Tiene retención del 35 %", "Está prohibido"], "e": "Se consideran recursos patrimoniales."}, {"q": "¿Cuál de los siguientes es un derecho del consumidor financiero del SGP?", "o": ["Elegir régimen y administradora y trasladarse según las normas", "Recibir una rentabilidad garantizada", "No actualizar sus datos", "Exigir pensión sin cumplir requisitos"], "e": "Otros derechos: información clara, conocer los activos y rentabilidades, acceder a simuladores, recibir educación, exigir diligencia y presentar PQR."}, {"q": "¿Cuál de los siguientes es un deber del consumidor financiero en pensiones?", "o": ["Mantener actualizada la información que requieren las administradoras", "Garantizar la rentabilidad del fondo", "Elegir el revisor fiscal", "Aprobar la política de inversión"], "e": "También debe informarse, leer los formatos de afiliación y usar los mecanismos de educación."}, {"q": "El defensor del consumidor financiero de una AFP es designado por:", "o": ["La asamblea de accionistas, por periodos de dos años prorrogables", "La SFC", "Los afiliados", "La junta directiva por un año"], "e": "Es un tercero que conoce y resuelve gratuitamente las quejas de los consumidores."}, {"q": "¿Cuál de las siguientes es una función del defensor del consumidor financiero?", "o": ["Actuar como conciliador entre el consumidor y la entidad", "Aprobar la política de inversión", "Fijar las comisiones", "Elegir a la junta directiva"], "e": "También: atender oportunamente, ser vocero de los consumidores, hacer recomendaciones a la entidad y proponer cambios normativos (art. 13, Ley 1328)."}, {"q": "Las decisiones del defensor del consumidor financiero son obligatorias para la entidad y el consumidor:", "o": ["Cuando así lo acuerden previamente o la entidad lo prevea en sus reglamentos", "Siempre", "Nunca", "Solo si la SFC las ratifica"], "e": "Lo establece el artículo 15 de la Ley 1328 de 2009."}, {"q": "En el mecanismo exprés de quejas ante la SFC, la entidad vigilada debe responder en un máximo de:", "o": ["15 días desde su recepción", "1 día", "3 meses", "1 año"], "e": "La respuesta se remite también a la SFC para su registro."}, {"q": "En la acción jurisdiccional de protección al consumidor ante la SFC, un proceso de cuantía menor a 40 SMMLV:", "o": ["Se tramita como verbal sumario y no tiene recursos", "Es verbal ordinario con apelación ante un tribunal", "No puede presentarse ante la SFC", "Tiene casación"], "e": "Entre 40 y 150 SMMLV es verbal con apelación ante un juez civil del circuito; más de 150 SMMLV, verbal con apelación ante un tribunal superior."}, {"q": "Según la Corte Suprema (SL 4360 de 2019), la sola firma del formulario de afiliación:", "o": ["No basta para probar que la AFP cumplió su deber de información", "Prueba que el afiliado fue bien asesorado", "Libera a la AFP de toda responsabilidad", "Es irrelevante para el traslado"], "e": "La AFP debe procurar que el afiliado haya recibido información clara, cierta y oportuna y la haya comprendido."}, {"q": "El procedimiento de doble asesoría debe completarse dentro de:", "o": ["Los 20 días hábiles siguientes a la solicitud", "1 día hábil", "6 meses", "1 año"], "e": "La administradora que recibe la solicitud informa a la del otro régimen a más tardar al día siguiente, y el informe de asesoría debe ser personalizado."}, {"q": "Según el artículo 9 de la Ley 1328 de 2009, ¿cuál información debe entregarse como mínimo al consumidor?", "o": ["Características del producto, derechos y obligaciones, condiciones, tarifas y la forma de calcularlas", "Solo la rentabilidad histórica", "Los nombres de otros clientes", "La remuneración del gerente"], "e": "También las medidas para el manejo seguro del producto y las consecuencias del incumplimiento."}, {"q": "A octubre de 2026, ¿cuál es el estado de la reforma pensional de la Ley 2381 de 2024?", "o": ["La Corte Constitucional la avaló en agosto de 2026 (devolvió algunos artículos a la Cámara) y se prevé que entre en vigor el 1 de abril de 2027; mientras tanto rige la Ley 100", "Rige desde el 1 de julio de 2025", "Fue declarada inexequible en su totalidad", "Rige desde 2024 solo para mujeres"], "e": "La Corte suspendió su entrada en vigor en junio de 2025 por un vicio de trámite y la avaló en la sentencia C-264 de 2026. La guía AMV vigente (PENS-001-2025) se basa en la Ley 100."}, {"q": "En la reforma pensional (Ley 2381 de 2024), ¿hasta qué ingreso se cotizaría obligatoriamente a Colpensiones en el pilar contributivo?", "o": ["Hasta 2,3 salarios mínimos; lo que exceda va al componente de ahorro individual en una AFP", "Hasta 4 salarios mínimos", "Todo el ingreso", "Hasta 1 salario mínimo"], "e": "Es el cambio central de la reforma, que entraría en vigor en 2027. Hoy el afiliado elige entre RPM y RAIS por la totalidad de su ingreso."}, {"q": "Un trabajador dependiente gana COP 2.500.000. ¿Cuánto aporta el empleador a pensión cada mes (sin fondo de solidaridad)?", "o": ["COP 300.000", "COP 100.000", "COP 400.000", "COP 200.000"], "e": "El empleador paga el 12 % de la cotización del 16 %: 2.500.000 × 12 % = COP 300.000. El trabajador aporta el 4 % (COP 100.000)."}, {"q": "Un trabajador dependiente gana COP 4.200.000. ¿Cuánto aporta el empleador a pensión cada mes (sin fondo de solidaridad)?", "o": ["COP 504.000", "COP 168.000", "COP 672.000", "COP 336.000"], "e": "El empleador paga el 12 % de la cotización del 16 %: 4.200.000 × 12 % = COP 504.000. El trabajador aporta el 4 % (COP 168.000)."}, {"q": "Un trabajador dependiente gana COP 6.000.000. ¿Cuánto aporta el empleador a pensión cada mes (sin fondo de solidaridad)?", "o": ["COP 720.000", "COP 240.000", "COP 960.000", "COP 480.000"], "e": "El empleador paga el 12 % de la cotización del 16 %: 6.000.000 × 12 % = COP 720.000. El trabajador aporta el 4 % (COP 240.000)."}, {"q": "Un trabajador dependiente gana COP 1.800.000. ¿Cuánto aporta el empleador a pensión cada mes (sin fondo de solidaridad)?", "o": ["COP 216.000", "COP 72.000", "COP 288.000", "COP 144.000"], "e": "El empleador paga el 12 % de la cotización del 16 %: 1.800.000 × 12 % = COP 216.000. El trabajador aporta el 4 % (COP 72.000)."}, {"q": "Un trabajador con salario de COP 2.000.000 trabajó 360 días del año. ¿Cuánto le corresponde de cesantías y de intereses sobre cesantías?", "o": ["COP 2.000.000 y COP 240.000", "COP 2.000.000 y COP 20.000", "COP 1.972.603 y COP 360.000", "COP 1.000.000 y COP 120.000"], "e": "Cesantías = salario × días / 360 = COP 2.000.000. Intereses = cesantías × 12 % × días / 360 = COP 240.000."}, {"q": "Un trabajador con salario de COP 3.600.000 trabajó 180 días del año. ¿Cuánto le corresponde de cesantías y de intereses sobre cesantías?", "o": ["COP 1.800.000 y COP 108.000", "COP 1.800.000 y COP 18.000", "COP 1.775.342 y COP 162.000", "COP 900.000 y COP 54.000"], "e": "Cesantías = salario × días / 360 = COP 1.800.000. Intereses = cesantías × 12 % × días / 360 = COP 108.000. Como no trabajó el año completo, los intereses son proporcionales."}, {"q": "Un trabajador con salario de COP 1.500.000 trabajó 270 días del año. ¿Cuánto le corresponde de cesantías y de intereses sobre cesantías?", "o": ["COP 1.125.000 y COP 101.250", "COP 1.125.000 y COP 11.250", "COP 1.109.589 y COP 151.875", "COP 562.500 y COP 50.625"], "e": "Cesantías = salario × días / 360 = COP 1.125.000. Intereses = cesantías × 12 % × días / 360 = COP 101.250. Como no trabajó el año completo, los intereses son proporcionales."}, {"q": "Un trabajador con salario de COP 4.800.000 trabajó 90 días del año. ¿Cuánto le corresponde de cesantías y de intereses sobre cesantías?", "o": ["COP 1.200.000 y COP 36.000", "COP 1.200.000 y COP 12.000", "COP 1.183.562 y COP 54.000", "COP 600.000 y COP 18.000"], "e": "Cesantías = salario × días / 360 = COP 1.200.000. Intereses = cesantías × 12 % × días / 360 = COP 36.000. Como no trabajó el año completo, los intereses son proporcionales."}, {"q": "Un afiliado gana COP 5.000.000 al mes. Con una UVT de COP 49.799, ¿cuál es el máximo anual de aportes voluntarios a su fondo de pensiones obligatorias que puede tratar como ingreso no constitutivo de renta?", "o": ["COP 15.000.000", "COP 18.000.000", "COP 189.236.200", "COP 1.250.000"], "e": "El tope es el menor entre el 25 % del ingreso anual (COP 15.000.000) y 2.500 UVT (COP 124.497.500): COP 15.000.000."}, {"q": "Un afiliado gana COP 12.000.000 al mes. Con una UVT de COP 49.799, ¿cuál es el máximo anual de aportes voluntarios a su fondo de pensiones obligatorias que puede tratar como ingreso no constitutivo de renta?", "o": ["COP 36.000.000", "COP 43.200.000", "COP 189.236.200", "COP 3.000.000"], "e": "El tope es el menor entre el 25 % del ingreso anual (COP 36.000.000) y 2.500 UVT (COP 124.497.500): COP 36.000.000."}, {"q": "Un afiliado gana COP 50.000.000 al mes. Con una UVT de COP 49.799, ¿cuál es el máximo anual de aportes voluntarios a su fondo de pensiones obligatorias que puede tratar como ingreso no constitutivo de renta?", "o": ["COP 124.497.500", "COP 180.000.000", "COP 189.236.200", "COP 12.500.000"], "e": "El tope es el menor entre el 25 % del ingreso anual (COP 150.000.000) y 2.500 UVT (COP 124.497.500): COP 124.497.500."}], "port": [{"q": "Según el CAPM, si la tasa libre de riesgo es 5 %, la rentabilidad esperada del mercado es 12 % y la beta de la acción es 1,2, ¿cuál es su rentabilidad esperada?", "o": ["13,4 %", "14,4 %", "12,0 %", "8,4 %"], "e": "E(R) = rf + β × (Rm − rf) = 5 % + 1,2 × (12 % − 5 %) = 5 % + 8,4 % = 13,4 %."}, {"q": "Un portafolio rentó 14 %, la tasa libre de riesgo es 6 % y la desviación estándar del portafolio es 16 %. ¿Cuál es su índice de Sharpe?", "o": ["0,50", "0,875", "0,375", "8,0"], "e": "Sharpe = (Rp − rf) / σp = (14 % − 6 %) / 16 % = 0,50."}, {"q": "Un portafolio rentó 14 %, la tasa libre de riesgo es 6 % y su beta es 0,8. ¿Cuál es su índice de Treynor?", "o": ["10 %", "8 %", "17,5 %", "6,4 %"], "e": "Treynor = (Rp − rf) / βp = (14 % − 6 %) / 0,8 = 10 %."}, {"q": "¿Cuál es la diferencia entre los índices de Sharpe y de Treynor?", "o": ["Sharpe usa el riesgo total (desviación estándar) y Treynor usa el riesgo sistemático (beta)", "Sharpe usa la beta y Treynor la desviación estándar", "Ambos usan la misma medida de riesgo", "Treynor no considera la tasa libre de riesgo"], "e": "Sharpe mide el exceso de rentabilidad por unidad de riesgo total. Treynor lo mide por unidad de riesgo sistemático y es más apropiado para portafolios bien diversificados."}, {"q": "Un portafolio tiene 60 % en un activo que renta 10 % y 40 % en otro que renta 5 %. ¿Cuál es la rentabilidad esperada del portafolio?", "o": ["8 %", "7,5 %", "15 %", "6 %"], "e": "La rentabilidad de un portafolio es el promedio ponderado: 0,6 × 10 % + 0,4 × 5 % = 6 % + 2 % = 8 %."}, {"q": "Un portafolio tiene 50 % en el activo A (volatilidad 20 %) y 50 % en el activo B (volatilidad 10 %), con correlación cero. ¿Cuál es la volatilidad del portafolio?", "o": ["11,18 %", "15,00 %", "12,50 %", "10,00 %"], "e": "σ² = 0,5² × 0,2² + 0,5² × 0,1² = 0,01 + 0,0025 = 0,0125. σ = √0,0125 = 11,18 %. Es menor que el promedio (15 %) gracias a la diversificación."}, {"q": "Un portafolio tiene 50 % en una acción con beta 1,2 y 50 % en otra con beta 0,8. ¿Cuál es la beta del portafolio?", "o": ["1,0", "2,0", "0,96", "1,2"], "e": "La beta de un portafolio es el promedio ponderado de las betas: 0,5 × 1,2 + 0,5 × 0,8 = 1,0."}, {"q": "Un portafolio rentó 15 % y, según el CAPM, debía rentar 13 %. ¿Cuál es su alfa de Jensen?", "o": ["2 %", "−2 %", "28 %", "13 %"], "e": "Alfa de Jensen = rentabilidad real − rentabilidad esperada según el CAPM = 15 % − 13 % = 2 %. Un alfa positivo indica que el gestor superó lo esperado por su riesgo."}, {"q": "Una acción con beta 1,5 tiende a:", "o": ["Moverse 1,5 veces lo que se mueve el mercado", "Moverse en sentido contrario al mercado", "No tener relación con el mercado", "Tener menos riesgo que el mercado"], "e": "La beta mide la sensibilidad frente al mercado. Con beta 1,5, si el mercado sube 10 %, se espera que la acción suba en promedio 15 %."}, {"q": "La frontera eficiente de Markowitz está formada por los portafolios que:", "o": ["Ofrecen la máxima rentabilidad esperada para cada nivel de riesgo", "Tienen el menor número de activos", "Tienen rentabilidad igual a la tasa libre de riesgo", "Solo contienen acciones"], "e": "Un portafolio es eficiente si no existe otro con más rentabilidad para el mismo riesgo, o con menos riesgo para la misma rentabilidad."}, {"q": "La diversificación de un portafolio reduce principalmente:", "o": ["El riesgo no sistemático o específico", "El riesgo sistemático o de mercado", "La rentabilidad esperada siempre", "El riesgo de inflación"], "e": "Combinar activos que no se mueven igual reduce el riesgo propio de cada emisor. El riesgo de mercado no se elimina con diversificación."}, {"q": "El beneficio de la diversificación es mayor cuando la correlación entre los activos es:", "o": ["Baja o negativa", "Igual a +1", "Exactamente cero, siempre", "Irrelevante; no importa la correlación"], "e": "Cuanto menor sea la correlación, más se compensan los movimientos de los activos y más se reduce el riesgo total."}, {"q": "La línea del mercado de capitales (LMC) relaciona:", "o": ["La rentabilidad esperada con el riesgo total de portafolios que combinan el activo libre de riesgo y el portafolio de mercado", "La rentabilidad de una acción con su beta", "El precio de un bono con la tasa de interés", "La inflación con el desempleo"], "e": "La LMC une el activo libre de riesgo con el portafolio de mercado. Usa la desviación estándar como medida de riesgo; la línea del mercado de valores (LMV), en cambio, usa la beta."}, {"q": "¿Qué diferencia hay entre gestión activa y gestión pasiva de un portafolio?", "o": ["La activa busca superar un índice de referencia; la pasiva busca replicarlo", "La pasiva busca superar el índice y la activa replicarlo", "La activa nunca opera y la pasiva opera todos los días", "No hay diferencia"], "e": "La gestión pasiva replica un benchmark con bajos costos. La activa toma decisiones de selección o de momento para superarlo."}, {"q": "El tracking error mide:", "o": ["La volatilidad de la diferencia de rentabilidad entre el portafolio y su índice de referencia", "El error en la valoración diaria del portafolio", "La pérdida máxima del portafolio", "El costo de las comisiones"], "e": "El tracking error es la desviación estándar del exceso de rentabilidad frente al benchmark. En un fondo indexado debe ser bajo."}, {"q": "La asignación estratégica de activos se refiere a:", "o": ["La distribución de largo plazo del portafolio entre clases de activos, según los objetivos y el perfil del inversionista", "Las desviaciones de corto plazo para aprovechar oportunidades", "La selección de una acción específica", "El cálculo diario del VaR"], "e": "La asignación estratégica define la mezcla objetivo de largo plazo. La táctica hace ajustes temporales para aprovechar condiciones del mercado."}, {"q": "¿Qué es el rebalanceo de un portafolio?", "o": ["Volver a llevar los pesos de los activos a la asignación objetivo cuando el mercado los ha desviado", "Vender todo el portafolio y comprar uno nuevo", "Cambiar el perfil del inversionista", "Aumentar el apalancamiento"], "e": "Con el tiempo, los activos que suben ganan peso. El rebalanceo restablece la mezcla objetivo y controla el riesgo."}, {"q": "¿Cuál de los siguientes factores define principalmente el perfil de riesgo de un inversionista?", "o": ["Su tolerancia al riesgo, su horizonte de inversión y sus objetivos y necesidades de liquidez", "El número de cuentas bancarias que tiene", "La entidad donde trabaja", "Su lugar de residencia"], "e": "El perfil se construye con la capacidad y la disposición a asumir pérdidas, el plazo, los objetivos y las necesidades de liquidez."}, {"q": "Un inversionista con horizonte de 2 años, que necesita el dinero para comprar vivienda, debería tener un portafolio:", "o": ["Conservador, con mayor peso en renta fija de corto plazo", "Agresivo, con 100 % en acciones", "Concentrado en derivados", "Concentrado en una sola acción"], "e": "Con un horizonte corto y un objetivo definido, el inversionista no puede asumir caídas grandes. Le conviene un portafolio conservador."}, {"q": "La rentabilidad ponderada por tiempo es la medida adecuada para evaluar a un gestor porque:", "o": ["Elimina el efecto de los aportes y retiros que decide el cliente", "Incluye el efecto de los aportes del cliente", "Es siempre mayor que la ponderada por dinero", "Solo se aplica a portafolios de renta fija"], "e": "El gestor no controla cuándo el cliente aporta o retira. La rentabilidad ponderada por tiempo aísla ese efecto y mide solo las decisiones del gestor."}, {"q": "Según el CAPM, el riesgo que el mercado remunera con mayor rentabilidad esperada es:", "o": ["El riesgo sistemático, medido por la beta", "El riesgo total, medido por la desviación estándar", "El riesgo no sistemático", "El riesgo operacional"], "e": "Como el riesgo no sistemático se elimina diversificando, el mercado solo paga una prima por el riesgo sistemático."}, {"q": "Un benchmark o índice de referencia sirve para:", "o": ["Comparar el desempeño del portafolio con una alternativa de inversión representativa", "Fijar la comisión del gestor por ley", "Calcular los impuestos del portafolio", "Determinar el perfil del cliente"], "e": "El benchmark permite saber si el gestor agregó valor frente a una alternativa comparable, como el MSCI COLCAP para un portafolio de acciones colombianas."}, {"q": "¿Qué significa que un portafolio tenga una beta de 0?", "o": ["Que su rentabilidad no está relacionada con los movimientos del mercado", "Que no tiene ningún riesgo", "Que replica exactamente al mercado", "Que siempre pierde cuando el mercado sube"], "e": "Una beta de cero indica que no hay riesgo sistemático, pero el portafolio puede tener riesgo específico."}, {"q": "La política de inversión de un portafolio debe incluir:", "o": ["Los objetivos, las restricciones, los activos permitidos, los límites y el índice de referencia", "Solo la lista de acciones que se van a comprar", "Únicamente las comisiones", "El nombre del gestor"], "e": "La política de inversión fija las reglas para gestionar el portafolio: objetivos de rentabilidad y riesgo, horizonte, liquidez, activos y límites, y benchmark."}, {"q": "Si un inversionista combina el activo libre de riesgo con un portafolio de mercado, su riesgo total:", "o": ["Aumenta en proporción al peso invertido en el portafolio de mercado", "Es siempre cero", "Es siempre igual al del mercado", "Disminuye al aumentar el peso del portafolio de mercado"], "e": "El activo libre de riesgo tiene volatilidad cero, así que el riesgo de la combinación es el peso en el mercado multiplicado por la volatilidad del mercado."}, {"q": "¿Qué es el portafolio de mínima varianza?", "o": ["La combinación de activos con el menor riesgo posible en la frontera eficiente", "El portafolio con mayor rentabilidad", "El portafolio con un solo activo", "El portafolio del mercado"], "e": "El portafolio de mínima varianza es el punto de la frontera con la menor volatilidad posible."}, {"q": "En la teoría de portafolios, un inversionista adverso al riesgo:", "o": ["Exige una mayor rentabilidad esperada para aceptar más riesgo", "Prefiere siempre el activo más riesgoso", "Es indiferente al riesgo", "No invierte nunca"], "e": "La aversión al riesgo implica que más riesgo solo se acepta a cambio de más rentabilidad esperada."}, {"q": "La línea del mercado de valores (LMV) del CAPM relaciona:", "o": ["La rentabilidad esperada de un activo con su beta", "La rentabilidad con la desviación estándar", "El precio del bono con su tasa", "La inflación con el desempleo"], "e": "La LMV representa E(R) = rf + β × (Rm − rf). Un activo sobre la línea está subvalorado y uno bajo ella, sobrevalorado."}, {"q": "Si una acción da una rentabilidad esperada superior a la que predice el CAPM según su beta, se considera:", "o": ["Subvalorada, con alfa positivo", "Sobrevalorada", "Correctamente valorada", "Libre de riesgo"], "e": "Un alfa positivo indica que rinde más de lo que exige su riesgo sistemático, así que su precio sería bajo."}, {"q": "¿Qué es la covarianza entre dos activos?", "o": ["Una medida de cómo se mueven conjuntamente sus rentabilidades", "La rentabilidad promedio de los dos activos", "La diferencia de precios entre ellos", "La suma de sus volatilidades"], "e": "La covarianza positiva indica que tienden a moverse en la misma dirección. La correlación es la covarianza estandarizada entre −1 y 1."}, {"q": "La correlación entre dos activos puede tomar valores entre:", "o": ["−1 y +1", "0 y 1", "−100 y 100", "0 e infinito"], "e": "La correlación es una medida estandarizada: −1 es relación perfectamente inversa, +1 perfectamente directa y 0 ausencia de relación lineal."}, {"q": "Un portafolio que mantiene una proporción fija de activos y se ajusta periódicamente sigue una estrategia de:", "o": ["Rebalanceo a pesos constantes", "Gestión activa de selección", "Especulación con derivados", "Market timing"], "e": "El rebalanceo periódico mantiene la asignación objetivo vendiendo lo que subió y comprando lo que bajó."}, {"q": "Una estrategia de inmunización de un portafolio de renta fija busca:", "o": ["Proteger el valor del portafolio frente a cambios en las tasas igualando la duración con el horizonte de inversión", "Maximizar la rentabilidad sin importar el riesgo", "Invertir solo en acciones", "Eliminar el riesgo de crédito"], "e": "Al igualar la duración con el horizonte, las pérdidas de precio se compensan con mayores tasas de reinversión, y viceversa."}, {"q": "La diversificación internacional de un portafolio puede reducir el riesgo porque:", "o": ["Los mercados de distintos países no se mueven siempre igual", "Los activos extranjeros no tienen riesgo", "Elimina el riesgo cambiario", "Garantiza mayor rentabilidad"], "e": "Las correlaciones imperfectas entre mercados reducen la volatilidad, aunque se agrega el riesgo cambiario."}, {"q": "El ratio de información mide:", "o": ["El exceso de rentabilidad frente al benchmark dividido entre el tracking error", "La rentabilidad total dividida entre la beta", "El número de activos del portafolio", "La liquidez del portafolio"], "e": "Mide cuánto exceso de rentabilidad obtiene el gestor por cada unidad de riesgo activo asumido."}, {"q": "¿Qué es el horizonte de inversión?", "o": ["El tiempo durante el cual el inversionista planea mantener su inversión antes de necesitar los recursos", "La fecha de vencimiento de un CDT", "El plazo de un crédito", "La duración de un bono"], "e": "El horizonte define cuánto riesgo puede asumir el inversionista: con horizontes largos puede tolerar más volatilidad."}, {"q": "La hipótesis de mercado eficiente en su forma semifuerte sostiene que:", "o": ["Los precios reflejan toda la información pública disponible", "Los precios reflejan solo la información histórica de precios", "Los precios reflejan incluso la información privilegiada", "Los precios no reflejan ninguna información"], "e": "En la forma semifuerte, el análisis de información pública no permite obtener rentabilidades extraordinarias de forma sistemática."}, {"q": "El análisis fundamental de una acción se basa en:", "o": ["Estimar su valor intrínseco a partir de la situación financiera y las perspectivas de la empresa", "Estudiar solo los gráficos de precios", "La opinión de los medios", "El número de accionistas"], "e": "El análisis fundamental usa estados financieros, flujos y el entorno económico. El técnico estudia patrones de precios y volúmenes."}, {"q": "El modelo de Gordon valora una acción como:", "o": ["Dividendo esperado del próximo año dividido entre (rentabilidad exigida − tasa de crecimiento del dividendo)", "Utilidad por acción multiplicada por 10", "Valor en libros dividido entre el precio", "Dividendo actual dividido entre la inflación"], "e": "P = D1 / (k − g). Supo
