/b> comercial, consumo, vivienda y microcrédito.<\/li>\n<\/ul>\n<p>El riesgo de contraparte se controla con <b>cupos<\/b>, con la <b>CRCC<\/b> (que exige garantías) y con <b>entrega contra pago<\/b>.<\/p>\n\n<h2>6. Riesgo de liquidez<\/h2>\n<ul>\n<li>El <b>IRL<\/b> = ALM − RLN: activos líquidos ajustados por liquidez de mercado (con descuento o haircut) menos requerimientos netos de liquidez. En razón: ALM / RLN. Ejemplo: 500 y 400 dan IRL de 100 y razón de 1,25.<\/li>\n<li>En un FIC se usan los retiros esperados o la liquidez mínima, el mayor. Para un FIC sin pacto de permanencia la liquidez mínima es <b>10 %<\/b> del portafolio.<\/li>\n<li><b>CFEN<\/b> = fondeo estable disponible / fondeo estable requerido ≥ <b>100 %<\/b>, con horizonte de un año; se reporta mensualmente a la SFC.<\/li>\n<li><b>Bid-ask spread:<\/b> diferencia entre precio de compra y de venta. Se amplía por costos de gestión, reglas del mercado, costos de inventario, nueva información y asimetría de información.<\/li>\n<li>Una <b>brecha negativa<\/b> en una banda de tiempo indica que las salidas superan a las entradas.<\/li>\n<li>Activos líquidos de alta calidad: efectivo, depósitos en el Banco de la República, TES.<\/li>\n<li>Mitigantes: colchón de activos líquidos y fuentes de fondeo diversificadas.<\/li>\n<\/ul>\n\n<h2>7. Herramientas: pruebas, límites y coberturas<\/h2>\n<ul>\n<li><b>Backtesting:<\/b> verificar y calibrar el modelo comparándolo con datos históricos.<\/li>\n<li><b>Stress testing:<\/b> tipos: análisis de sensibilidad, escenarios y pruebas inversas; escenarios históricos, hipotéticos o híbridos. Escenarios de la guía: <b>básico<\/b>, <b>deterioro macroeconómico<\/b> y <b>crisis de deuda soberana<\/b> (el más severo). En un conglomerado (Ley 1870 de 2017) incluyen filiales y subsidiarias.<\/li>\n<li><b>Stop loss:<\/b> en una compra va por debajo del precio de entrada (compra a 5.000 con SL de 100: 4.900); en una venta, por encima. Puede ser garantizado o dinámico (trailing).<\/li>\n<li><b>Take profit:<\/b> asegura la ganancia. Compra de 1.000 acciones a 2.000 con TP en 2.400: gana 400.000.<\/li>\n<li><b>Cobertura:<\/b> tomar la posición opuesta. Quien venderá petróleo vende futuros; el importador compra dólares a plazo. Renuncia a la ganancia si el precio se mueve a su favor. La cobertura perfecta exige correlación de 100 %.<\/li>\n<\/ul>\n\n<h2>8. Capital regulatorio y solvencia<\/h2>\n<ul>\n<li><b>Capital regulatorio:<\/b> el mínimo que exige el regulador. <b>Económico:<\/b> el que elegirían los accionistas sin regulación.<\/li>\n<li><b>Pilares de Basilea:<\/b> 1, requerimientos mínimos de capital; 2, revisión del supervisor; 3, disciplina de mercado (divulgación).<\/li>\n<li><b>Patrimonio técnico<\/b> = básico ordinario + básico adicional + adicional − deducciones (Decreto 2555 de 2010).<\/li>\n<li><b>Básico ordinario:<\/b> acciones suscritas y pagadas, perpetuas, con dividendo no acumulativo, no financiadas por la entidad y que absorben pérdidas. No incluye acciones propias readquiridas, pérdidas acumuladas ni impuesto diferido neto positivo.<\/li>\n<li><b>Básico adicional:<\/b> acciones con dividendos fijos o preferenciales. <b>Adicional:<\/b> deuda subordinada que solo se puede redimir después de <b>5 años<\/b>.<\/li>\n<\/ul>\n<p class=\"f\">Solvencia total = PT / (APNR + 100/9 × (VeR mercado + VeR operacional)) ≥ 9 %<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>PT = 90; APNR = 800; VeR de mercado = 10; VeR operacional = 8. Denominador = 800 + (100/9) × 18 = 1.000. Solvencia = 90 / 1.000 = <b>9 %<\/b>: cumple justo.<\/p><\/div>\n<p>Capital por riesgo operacional (Basilea II): indicador básico, estandarizado o medición avanzada.<\/p>\n\n<h2>9. Sistema de control interno (SCI)<\/h2>\n<p>Según la Circular Básica Jurídica, es el conjunto de políticas, principios, normas, procedimientos y mecanismos de verificación que da una <b>seguridad razonable<\/b> sobre el logro de los objetivos. Busca eficiencia y eficacia, prevenir fraudes y corrupción, gestionar riesgos, información confiable, cumplir la norma y proteger los activos.<\/p>\n<ul>\n<li><b>Principios:<\/b> autocontrol (cada funcionario controla su trabajo), autorregulación (la entidad crea sus normas) y autogestión (interpreta, coordina y evalúa su funcionamiento).<\/li>\n<li><b>Elementos:<\/b> ambiente de control (código de ética, políticas, comité de auditoría), gestión de riesgos, actividades de control, información y comunicación, monitoreo y evaluaciones independientes.<\/li>\n<li><b>Tipos de control:<\/b> preventivos (segregación de funciones, rotación), detectivos (auditorías) y correctivos (asientos de ajuste).<\/li>\n<li><b>Seguridad de la información:<\/b> confidencialidad, integridad y disponibilidad. Calidad: efectividad, eficiencia y confiabilidad.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead><tr><th>Órgano<\/th><th>Lo que debe saber<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Junta directiva<\/td><td>Aprueba las políticas del SCI y revisa la gestión de riesgos al menos cada 6 meses<\/td><\/tr>\n<tr><td>Comité de auditoría<\/td><td>Al menos 3 miembros de junta, mayoría independientes; se reúne al menos cada 3 meses; asesora, no reemplaza a la junta<\/td><\/tr>\n<tr><td>Representante legal<\/td><td>Implementa el SCI, certifica los estados financieros, canales de denuncia y programa antifraude<\/td><\/tr>\n<tr><td>Contralor normativo<\/td><td>Obligatorio en comisionistas (art. 21 Ley 964 de 2005); independiente; voz sin voto en junta; reporta de inmediato a la junta y a la SFC las irregularidades<\/td><\/tr>\n<tr><td>Revisoría fiscal<\/td><td>Control externo: opina sobre el SCI y la gestión de riesgos<\/td><\/tr>\n<tr><td>Auditoría interna<\/td><td>Independiente y objetiva, sin funciones de gestión; si no existe, se explica en el informe de gestión<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>No es independiente quien recibe de la entidad el 20 % o más de sus ingresos como consultor, ni quien fue empleado en el último año.<\/p>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto<\/span>\n<ul>\n<li>z = 1,65 (95 %) y 2,33 (99 %); VaR crece con √n.<\/li>\n<li>DM = D / (1 + TIR); Δ% ≈ −DM × Δtasa.<\/li>\n<li>Pérdida esperada = PI × PDI × EAD.<\/li>\n<li>Error humano, fraude o falla de sistemas: operacional.<\/li>\n<li>Middle office mide y controla, con independencia del front.<\/li>\n<li>7 eventos operacionales; factores LA/FT: clientes, productos, canales, jurisdicciones.<\/li>\n<li>VaR regulatorio: 10 días. IRL = ALM − RLN. CFEN ≥ 100 %. Solvencia ≥ 9 %.<\/li>\n<li>Apetito, tolerancia, capacidad. Controles preventivos, detectivos, correctivos.<\/li>\n<li>Comité de auditoría: 3 miembros, cada 3 meses. Contralor normativo: voz sin voto.<\/li>\n<\/ul><\/div>\n\n<p class=\"fuente\">Fuente: Guía de estudio de Administración y control de riesgos financieros de AMV (ADDR-002-2025). Contenido parafraseado con fines de estudio; algunos ejemplos numéricos son propios.<\/p>\n"};

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function drop(k) { try { localStorage.removeItem(k); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtTime(s) { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
function pct(x) { return Math.round(x * 100) + " %"; }

function makeItem(mod, idx) {
  const order = shuffle([0, 1, 2, 3]);
  return { m: mod, i: idx, order, ans: null, flag: false };
}
function buildRun(cfg) {
  let items = [];
  if (cfg.mode === "practice") {
    const pool = shuffle(BANK[cfg.mod].map((_, i) => i)).slice(0, cfg.count);
    items = pool.map(i => makeItem(cfg.mod, i));
  } else {
    for (const [k, m] of Object.entries(MODULES)) {
      if (!MODES[cfg.mode].comps.includes(m.comp)) continue;
      const pool = shuffle(BANK[k].map((_, i) => i)).slice(0, m.exam);
      items = items.concat(pool.map(i => makeItem(k, i)));
    }
    items = shuffle(items);
  }
  const minutes = cfg.mode === "practice" ? (cfg.timed ? Math.round(cfg.count * 1.3) : 0) : MODES[cfg.mode].minutes;
  return { cfg, items, cur: 0, started: Date.now(), limit: minutes * 60, elapsed: 0, done: false };
}

let run = null, tick = null, view = "home", filter = "all", confirmEnd = false;
const app = document.getElementById("app");

function q(item) { return BANK[item.m][item.i]; }
function isRight(item) { return item.ans !== null && item.order[item.ans] === 0; }

function startRun(cfg) {
  run = buildRun(cfg); confirmEnd = false; view = "exam"; save(STORE_RUN, run); startTimer(); render(); window.scrollTo(0, 0);
}
function startTimer() {
  clearInterval(tick);
  run.resumedAt = Date.now(); run.base = run.elapsed;
  tick = setInterval(() => {
    run.elapsed = run.base + (Date.now() - run.resumedAt) / 1000;
    if (run.limit && run.elapsed >= run.limit) { finish(); return; }
    const t = document.getElementById("timer");
    if (t) {
      const left = run.limit ? run.limit - run.elapsed : run.elapsed;
      t.textContent = fmtTime(left);
      t.classList.toggle("low", !!run.limit && left < 600);
    }
    if (Math.round(run.elapsed) % 10 === 0) save(STORE_RUN, run);
  }, 1000);
}
function finish() {
  clearInterval(tick);
  run.done = true;
  const sc = score(run);
  const hist = load(STORE_HIST, []);
  hist.unshift({ when: Date.now(), name: runName(run), comps: sc.comps.map(c => ({ name: c.name, ok: c.ok, n: c.n })), mins: Math.round(run.elapsed / 60) });
  save(STORE_HIST, hist.slice(0, 30));
  drop(STORE_RUN);
  view = "results"; filter = "all"; render(); window.scrollTo(0, 0);
}
function runName(r) { return r.cfg.mode === "practice" ? "Práctica: " + MODULES[r.cfg.mod].name : MODES[r.cfg.mode].name; }
function score(r) {
  const byMod = {}, byComp = {};
  for (const it of r.items) {
    const m = MODULES[it.m];
    byMod[it.m] = byMod[it.m] || { key: it.m, name: m.name, n: 0, ok: 0 };
    byMod[it.m].n++; if (isRight(it)) byMod[it.m].ok++;
    const ck = r.cfg.mode === "practice" ? "mod" : m.comp;
    byComp[ck] = byComp[ck] || { name: r.cfg.mode === "practice" ? m.name : COMPS[ck], n: 0, ok: 0 };
    byComp[ck].n++; if (isRight(it)) byComp[ck].ok++;
  }
  return { mods: Object.values(byMod).sort((a, b) => MODULES[a.key].n - MODULES[b.key].n), comps: Object.values(byComp) };
}

// Volver al menú: botones y el botón "atrás" del navegador o del celular
let pushed = false;
function showHome() {
  if (view === "exam" && run) { clearInterval(tick); save(STORE_RUN, run); }
  view = "home"; render(); window.scrollTo(0, 0);
}
function goHome() {
  if (pushed) {
    pushed = false;
    try { history.back(); setTimeout(() => { if (view !== "home") showHome(); }, 300); return; } catch (e) {}
  }
  showHome();
}
window.addEventListener("popstate", () => { pushed = false; if (view !== "home") showHome(); });
function render() {
  if (view !== "home" && !pushed) { try { history.pushState({ amv: 1 }, ""); pushed = true; } catch (e) {} }
  if (view === "exam") return renderExam();
  if (view === "results") return renderResults();
  if (view === "lesson") return renderLesson();
  renderHome();
}

function renderExam() {
  const it = run.items[run.cur], data = q(it);
  const answered = run.items.filter(x => x.ans !== null).length;
  const instant = run.cfg.mode === "practice" && run.cfg.instant;
  const locked = instant && it.ans !== null;
  const left = run.limit ? run.limit - run.elapsed : run.elapsed;
  const unanswered = run.items.length - answered;
  app.innerHTML = `
  <div class="bar"><div class="in">
    <button class="btn quiet back" id="home" title="Su avance se guarda y puede continuar después">← Menú principal</button>
    <div class="title">${esc(runName(run))}</div>
    <span class="muted num">${answered}/${run.items.length} respondidas</span>
    <span class="timer ${run.limit && left < 600 ? "low" : ""}" id="timer" title="${run.limit ? "Tiempo restante" : "Tiempo transcurrido"}">${fmtTime(left)}</span>
  </div><div class="progress"><span style="width:${answered / run.items.length * 100}%"></span></div></div>
  <div class="wrap" style="padding-top:22px">
    <div class="exam">
      <article class="qcard">
        <div class="qmeta"><span class="num">Pregunta ${run.cur + 1} de ${run.items.length}</span><span>Módulo ${MODULES[it.m].n} · ${esc(MODULES[it.m].name)}</span></div>
        <p class="qtext">${esc(data.q)}</p>
        <div class="opts">
          ${it.order.map((oi, pos) => {
            let cls = it.ans === pos ? "sel" : "";
            if (locked) { if (oi === 0) cls = "right"; else if (it.ans === pos) cls = "wrong"; }
            return `<button class="opt ${cls}" data-pos="${pos}" ${locked ? "disabled" : ""}><span class="k">${KEYS[pos]}</span><span>${esc(data.o[oi])}</span></button>`;
          }).join("")}
        </div>
        ${locked ? `<div class="explain"><b>${isRight(it) ? "Correcto." : "Incorrecto."}</b> ${esc(data.e)}</div>` : ""}
        <div class="qnav">
          <button class="btn quiet" id="prev" ${run.cur === 0 ? "disabled" : ""}>Anterior</button>
          <button class="btn quiet flagbtn ${it.flag ? "on" : ""}" id="flag">${it.flag ? "Marcada para revisar" : "Marcar para revisar"}</button>
          ${run.cur < run.items.length - 1 ? `<button class="btn" id="next">Siguiente</button>` : `<button class="btn" id="end2">Terminar y calificar</button>`}
        </div>
      </article>
      <aside class="side">
        <h3 style="margin-bottom:4px">Hoja de respuestas</h3>
        <div class="legend"><span><i style="background:var(--accent-soft)"></i>Respondida</span><span><i style="background:var(--flag)"></i>Marcada</span><span><i style="background:var(--bg);border:1px solid var(--line)"></i>En blanco</span></div>
        <div class="grid">${run.items.map((x, i) => `<button class="cell ${x.ans !== null ? "ans" : ""} ${x.flag ? "flag" : ""} ${i === run.cur ? "cur" : ""}" data-go="${i}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join("")}</div>
        <div style="margin-top:14px">
          ${confirmEnd ? `<div class="confirm"><span>${unanswered ? `Tiene <b>${unanswered}</b> preguntas en blanco, que contarán como incorrectas.` : "Respondió todas las preguntas."} ¿Terminar y calificar?</span><div class="row"><button class="btn" id="endyes">Sí, calificar</button><button class="btn quiet" id="endno">Seguir respondiendo</button></div></div>`
            : `<button class="btn ghost" id="end" style="width:100%">Terminar y calificar</button>`}
        </div>
      </aside>
    </div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (locked) return;
    it.ans = parseInt(b.dataset.pos, 10); save(STORE_RUN, run); renderExam();
  });
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { run.cur = parseInt(b.dataset.go, 10); renderExam(); });
  const go = d => { run.cur = Math.max(0, Math.min(run.items.length - 1, run.cur + d)); save(STORE_RUN, run); renderExam(); window.scrollTo(0, 0); };
  document.getElementById("prev").onclick = () => go(-1);
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => go(1);
  document.getElementById("flag").onclick = () => { it.flag = !it.flag; save(STORE_RUN, run); renderExam(); };
  const askEnd = () => { confirmEnd = true; renderExam(); };
  const e1 = document.getElementById("end"); if (e1) e1.onclick = askEnd;
  const e2 = document.getElementById("end2"); if (e2) e2.onclick = askEnd;
  const ey = document.getElementById("endyes"); if (ey) ey.onclick = finish;
  const en = document.getElementById("endno"); if (en) en.onclick = () => { confirmEnd = false; renderExam(); };
  document.getElementById("home").onclick = goHome;
}

function meter(p) { return `<div class="meter"><span style="width:${p * 100}%;background:${p >= PASS ? "var(--ok)" : "var(--bad)"}"></span><i title="70 %"></i></div>`; }

  const counts = { all: run.items.length, wrong: run.items.filter(x => !isRight(x)).length, flag: run.items.filter(x => x.flag).length, blank: run.items.filter(x => x.ans === null).length };

      </div>`; }).join("")}
    </div>
    ${sc.mods.length > 1 ? `<div class="mods"><h3 style="margin-bottom:8px">Resultado por módulo</h3>

    </div>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px">
      <button class="btn" id="again">Repetir con preguntas nuevas</button>
      <button class="btn quiet" id="home">Volver al menú principal</button>

    <h2>Revisión de respuestas</h2>
    <div class="filters">
      ${[["all", "Todas"], ["wrong", "Incorrectas y en blanco"], ["flag", "Marcadas"], ["blank", "En blanco"]].map(([k, l]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${l} (${counts[k]})</button>`).join("")}
    </div>
    <div class="review">
      ${items.length ? items.map(({ it, i }) => { const d = q(it); return `<article class="qcard">
        <div class="qmeta"><span class="num">Pregunta ${i + 1}${it.flag ? " · marcada" : ""}</span><span>Módulo ${MODULES[it.m].n} · ${esc(MODULES[it.m].name)}</span></div>
        <p class="qtext" style="font-size:1.02rem;margin-bottom:14px">${esc(d.q)}</p>
        <div class="opts">${it.order.map((oi, pos) => { const cls = oi === 0 ? "right" : it.ans === pos ? "wrong" : ""; return `<div class="opt ${cls}"><span class="k">${KEYS[pos]}</span><span>${esc(d.o[oi])}</span></div>`; }).join("")}</div>
        <p class="yours">${it.ans === null ? `<span class="pill bad">En blanco</span>` : isRight(it) ? `<span class="pill ok">Respondió ${KEYS[it.ans]}: correcto</span>` : `<span class="pill bad">Respondió ${KEYS[it.ans]}: incorrecto</span>`}</p>

  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderResults(); });
  document.getElementById("again").onclick = () => startRun(run.cfg);
  document.getElementById("home").onclick = goHome;
  document.getElementById("home2").onclick = goHome;
}

render();
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
