la el Índice de la tasa de cambio real (ITCR) en Colombia?", "o": ["El Banco de la República", "El DANE", "La SFC", "El Ministerio de Comercio"], "e": "Compara el valor de una misma canasta en Colombia y en otros países, expresada en pesos."}, {"q": "¿Cuál es el principal objetivo del mercado financiero?", "o": ["Distribuir liquidez entre quienes necesitan financiación y quienes tienen excedentes", "Fijar los salarios", "Recaudar impuestos", "Emitir moneda"], "e": "Además, forma precios, da liquidez a los activos, reduce costos de financiación y facilita los flujos de capital."}, {"q": "¿Cuáles son las características básicas que deben tener los mercados financieros?", "o": ["Transparencia, amplitud, profundidad, eficiencia y libertad", "Rentabilidad garantizada y riesgo cero", "Precios fijos y pocos participantes", "Secreto y exclusividad"], "e": "La amplitud se refiere a la diversidad de participantes y títulos; la profundidad, al número de transacciones."}, {"q": "El mercado monetario agrupa transacciones sobre activos con vencimiento:", "o": ["Menor a un año", "Mayor a cinco años", "Mayor a un año", "Perpetuo"], "e": "Incluye CDT, créditos de tesorería, papeles comerciales, repos y aceptaciones bancarias. Es de bajo riesgo y alta liquidez."}, {"q": "¿Cuál de estas es una función del mercado monetario?", "o": ["Apoyar la ejecución eficaz de la política monetaria", "Financiar proyectos de infraestructura a 30 años", "Emitir acciones", "Fijar los aranceles"], "e": "También facilita la financiación de corto plazo, provee liquidez y promueve la formación de tasas."}, {"q": "En el mercado de capitales colombiano, el segmento no intermediado es:", "o": ["El mercado público de valores, donde los emisores captan recursos directamente del público", "El de los créditos bancarios", "El mercado de divisas", "El mercado interbancario"], "e": "El segmento intermediado es el de establecimientos de crédito que canalizan ahorro hacia préstamos."}, {"q": "¿Por qué el mercado cambiario se considera descentralizado?", "o": ["Porque no tiene un órgano central de compensación y liquidación", "Porque solo opera en Bogotá", "Porque lo controla el Banco de la República", "Porque solo opera con efectivo"], "e": "Es el mercado con mayor volumen negociado del mundo y tiene participantes muy diversos."}, {"q": "En Colombia, las operaciones de compra y venta de divisas se realizan a través de:", "o": ["Intermediarios autorizados por el Banco de la República", "Cualquier persona sin restricción", "La Bolsa Mercantil exclusivamente", "Fogafín"], "e": "Lo establece el artículo 7 de la Resolución Externa 1 de 2018 del Banco de la República."}, {"q": "Según la guía, ¿cuál de estos es un indicador adelantado?", "o": ["Las licencias de construcción", "La tasa de desempleo", "La inflación", "Las tasas de interés"], "e": "Adelantados: índices bursátiles, inventarios, ventas minoristas, licencias, consumo de energía, creación de empresas, confianza del consumidor, ventas de autos."}, {"q": "Según la guía, ¿cuál de estos es un indicador rezagado?", "o": ["La tasa de desempleo", "El índice bursátil", "La confianza del consumidor", "El consumo de energía"], "e": "Los rezagados confirman los ciclos: crecimiento del PIB, salarios, desempleo, inflación, tasas de interés, utilidades."}, {"q": "¿Cuál de estos es un indicador coincidente?", "o": ["La producción industrial", "Las licencias de construcción", "La inflación", "La confianza del consumidor"], "e": "Los coincidentes varían al ritmo de la economía: producción industrial, manufactura, balanza comercial, ingresos personales."}, {"q": "La Ley de Okun describe la relación:", "o": ["Inversa entre el crecimiento del PIB y la tasa de desempleo", "Directa entre inflación y desempleo", "Inversa entre tasas de interés y precio de los bonos", "Directa entre dinero y precios"], "e": "Más actividad productiva lleva a más contratación y menos desempleo."}, {"q": "La curva de Phillips describe la relación:", "o": ["Inversa entre desempleo e inflación", "Directa entre PIB y desempleo", "Inversa entre exportaciones e importaciones", "Directa entre tasas y bonos"], "e": "Con alto desempleo cae la demanda y las empresas tienden a bajar precios."}, {"q": "Una variable contracíclica es aquella que:", "o": ["Se mueve en dirección contraria al ciclo económico, como el desempleo", "Sube cuando la economía crece", "No cambia con el ciclo", "Solo cambia en recesión"], "e": "Las ventas de automóviles son procíclicas; la demanda de bienes inferiores y el desempleo, contracíclicas."}, {"q": "Un bono paga 100 en un año. Si la tasa de mercado es 12 %, su precio es 89,29. ¿Cuál será su precio si la tasa baja a 8 %?", "o": ["92,59", "85,71", "100,00", "89,29"], "e": "VP = 100 / 1,08 = 92,59. Cuando bajan las tasas, sube el precio de los bonos."}, {"q": "¿Por qué los bonos de mayor plazo son más riesgosos ante cambios en las tasas de interés?", "o": ["Porque sus precios son más sensibles a esos cambios", "Porque pagan menos cupón", "Porque no tienen precio de mercado", "Porque no se pueden vender"], "e": "El riesgo de tasa de interés es mayor a mayor plazo."}, {"q": "Una curva de rendimientos plana suele interpretarse como:", "o": ["Incertidumbre sobre las condiciones económicas futuras", "Expectativa de fuerte crecimiento", "Expectativa segura de recesión", "Inflación cero"], "e": "La normal (pendiente positiva) anticipa crecimiento estable; la invertida, recesión y tasas a la baja."}, {"q": "El capital que entra y sale rápidamente de un país en busca de mejores rentabilidades de corto plazo se conoce como:", "o": ["Capital golondrina", "Inversión extranjera directa", "Reservas internacionales", "Capital de trabajo"], "e": "Responde a diferenciales de tasas de interés y expectativas de tasa de cambio."}, {"q": "Partiendo de paridad de tasas de interés, si sube la tasa de interés doméstica:", "o": ["Entran capitales, aumenta la oferta de divisas y la moneda local tiende a apreciarse", "Salen capitales y la moneda se deprecia", "No pasa nada con la tasa de cambio", "Suben las importaciones de inmediato"], "e": "Si sube la tasa externa o baja la doméstica, salen capitales y la moneda local tiende a depreciarse."}, {"q": "¿Cuáles son los tres niveles de objetivos de la política monetaria del Banco de la República?", "o": ["Operativo (tasa de intervención), intermedio (cantidad de dinero y expectativas) y de largo plazo (estabilidad de precios)", "Fiscal, cambiario y laboral", "Crecimiento, empleo y exportaciones", "Corto, mediano y largo plazo de la deuda"], "e": "La meta de largo plazo es una inflación de 3 % anual con un margen de ±1 punto."}, {"q": "Según la teoría cuantitativa del dinero (MV = PY), si la velocidad es constante, la oferta de dinero crece 10 % y el PIB real 3 %, la inflación esperada es:", "o": ["7 %", "13 %", "3 %", "10 %"], "e": "ΔP = ΔM − ΔY = 10 − 3 = 7 %. Para esta teoría, la inflación es un fenómeno de exceso de liquidez."}, {"q": "¿Qué autor afirmó que 'la inflación es siempre y en todas partes un fenómeno monetario'?", "o": ["Milton Friedman", "John Maynard Keynes", "David Ricardo", "Michael Porter"], "e": "La frase resume la visión monetarista que la guía presenta junto con la teoría cuantitativa."}, {"q": "Una política monetaria contractiva tiende a:", "o": ["Subir las tasas, reducir la demanda agregada y, en el mediano plazo, bajar la inflación", "Bajar las tasas y aumentar la inflación", "Aumentar la oferta de dinero", "Aumentar el gasto público"], "e": "La curva de demanda agregada se desplaza a la izquierda y el PIB crece más lento."}, {"q": "¿Cuál es una desventaja de un régimen de tasa de cambio fija?", "o": ["Se pierde la autonomía de la política monetaria y aumenta el riesgo de ataques especulativos", "Aumenta la volatilidad de corto plazo", "No requiere reservas internacionales", "Elimina el comercio exterior"], "e": "También exige amplias reservas para intervenir y elimina la tasa de cambio como estabilizador."}, {"q": "En un régimen de tasa de cambio semifija o mixta:", "o": ["La tasa fluctúa entre un piso y un techo, y el banco central interviene solo cuando tiende a salirse", "La tasa la fija cada día el gobierno", "La tasa es totalmente libre sin intervención", "No existen divisas"], "e": "Es una banda cambiaria. Colombia hoy tiene flexibilidad cambiaria."}, {"q": "¿Qué métodos tiene un banco central para mantener fija la tasa de cambio?", "o": ["Comprar o vender divisas, modificar la tasa de interés y aplicar controles de capital", "Emitir acciones", "Bajar los impuestos", "Fijar los salarios"], "e": "Son los tres métodos principales que describe la guía."}, {"q": "¿Por qué Colombia mantiene un régimen de flexibilidad cambiaria?", "o": ["Porque la tasa de cambio actúa como variable de ajuste ante choques externos y permite usar la tasa de interés para controlar la inflación", "Porque la tasa la fija la SFC", "Porque no hay reservas internacionales", "Porque así lo exige la OMC"], "e": "También reduce los incentivos a tomar riesgos cambiarios excesivos."}, {"q": "Si el Banco de la República compra dólares en el mercado, el efecto esperado es:", "o": ["Presión al alza de la tasa de cambio (devaluación del peso)", "Revaluación del peso", "Caída de las reservas", "Reducción de la liquidez en pesos"], "e": "Al comprar dólares inyecta pesos. Si vende dólares, aumenta la oferta de la divisa y presiona la revaluación."}, {"q": "¿Qué es la esterilización en la política cambiaria?", "o": ["Compensar el efecto monetario de comprar o vender divisas, por ejemplo vendiendo bonos para recoger los pesos inyectados", "Prohibir la compra de dólares", "Fijar la tasa de cambio", "Destruir billetes viejos"], "e": "Busca que la intervención cambiaria no choque con la meta de inflación."}, {"q": "¿Quién propone y administra la política fiscal en Colombia?", "o": ["El gobierno, a través del Ministerio de Hacienda, con aprobación del Congreso", "El Banco de la República", "La SFC", "AMV"], "e": "Sus instrumentos son el gasto público, los impuestos y las transferencias."}, {"q": "Una política fiscal contractiva:", "o": ["Reduce la deuda pública y puede ayudar contra la inflación, pero puede ser recesiva en el corto plazo", "Siempre acelera el crecimiento", "Consiste en bajar impuestos", "Aumenta las transferencias"], "e": "Consiste en reducir compras públicas o transferencias, o subir impuestos."}, {"q": "Según el artículo 371 de la Constitución, ¿cuál de estas es una función básica del Banco de la República?", "o": ["Ser prestamista de última instancia y banquero de los establecimientos de crédito", "Supervisar a las sociedades comisionistas", "Certificar a los operadores", "Recaudar impuestos"], "e": "También regula la moneda, los cambios y el crédito, emite la moneda, administra las reservas y es agente fiscal del gobierno."}, {"q": "¿Cómo está conformada la Junta Directiva del Banco de la República?", "o": ["Siete miembros: el ministro de Hacienda, que la preside, el gerente y cinco miembros de dedicación exclusiva", "Cinco ministros", "Tres miembros nombrados por el Congreso", "Nueve banqueros privados"], "e": "Los cinco miembros los nombra el presidente por periodos prorrogables de cuatro años; dos se reemplazan en cada periodo presidencial."}, {"q": "La Superintendencia Financiera de Colombia es:", "o": ["Un organismo técnico adscrito al Ministerio de Hacienda, con autonomía administrativa y financiera", "Una entidad privada sin ánimo de lucro", "Una dependencia del Banco de la República", "Un tribunal judicial"], "e": "Ejerce inspección, vigilancia y control sobre las actividades financiera, bursátil y aseguradora."}, {"q": "¿Qué entidad administra el seguro de depósitos en Colombia?", "o": ["Fogafín", "La SFC", "AMV", "El Banco de la República"], "e": "Fogafín protege los ahorros en bancos, corporaciones financieras, compañías de financiamiento y SEDPES. La guía cita una cobertura de hasta COP 50 millones por persona y entidad (2023)."}, {"q": "¿Cuál de estas es una función del Ministerio de Hacienda según el Decreto 4712 de 2008?", "o": ["Emitir y administrar la deuda pública y preparar el Presupuesto General de la Nación", "Fijar la tasa de intervención", "Certificar a los profesionales del mercado", "Administrar el seguro de depósitos"], "e": "También coordina con el Banco de la República y coordina el recaudo de impuestos que hace la DIAN."}, {"q": "Según las NIIF, ¿qué incluye un juego completo de estados financieros?", "o": ["Estado de situación financiera, estado de resultado integral, flujo de efectivo, cambios en el patrimonio y notas", "Solo el balance general", "Solo el estado de resultados y el presupuesto", "El balance y la declaración de renta"], "e": "Deben incluir datos del periodo actual y del anterior para comparar."}, {"q": "El término capex se refiere a:", "o": ["La inversión en adquisición de activos fijos", "Los gastos de funcionamiento", "Las ventas a crédito", "Los dividendos"], "e": "El opex son los gastos operacionales o de funcionamiento."}, {"q": "En el estado de resultados, ¿cuál es el orden correcto?", "o": ["Utilidad bruta, EBITDA, utilidad operacional, EBIT, utilidad antes de impuestos, utilidad neta", "Utilidad neta, EBIT, EBITDA, utilidad bruta", "EBIT, utilidad bruta, EBITDA, utilidad neta", "EBITDA, utilidad bruta, utilidad neta, EBIT"], "e": "Según la guía: a la utilidad operacional se suman los ingresos no operacionales para llegar al EBIT; luego se restan intereses e impuestos."}, {"q": "Una empresa tiene ventas de 900, costo de ventas de 180, gastos de administración de 90 y de ventas de 110. ¿Cuál es su EBITDA?", "o": ["520", "720", "420", "620"], "e": "Utilidad bruta = 900 − 180 = 720; EBITDA = 720 − 90 − 110 = 520."}, {"q": "Si el estado de resultados se elabora por causación, eso significa que:", "o": ["Registra la transacción cuando ocurre, no necesariamente cuando entra o sale el efectivo", "Solo registra el efectivo recibido", "Solo registra las ventas de contado", "Se elabora una vez cada diez años"], "e": "Por eso los ingresos operacionales no equivalen necesariamente al efectivo recibido."}, {"q": "En el estado de flujo de efectivo, el pago de un préstamo bancario se clasifica como actividad de:", "o": ["Financiación", "Operación", "Inversión", "No se registra"], "e": "La compra de un edificio es actividad de inversión; la venta de inventario, de operación; la emisión de acciones, de financiación."}, {"q": "Al construir el flujo de efectivo por el método indirecto, la depreciación:", "o": ["Se suma a la utilidad neta porque fue un gasto que no implicó salida de efectivo", "Se resta dos veces", "Se clasifica como financiación", "No se tiene en cuenta"], "e": "Lo mismo aplica a las amortizaciones."}, {"q": "Una empresa genera 720 en operación, usa 360 en inversión y 340 en financiación. ¿Cuál es la variación neta del efectivo?", "o": ["Aumenta en 20", "Disminuye en 20", "Aumenta en 1.420", "Aumenta en 360"], "e": "720 − 360 − 340 = 20."}, {"q": "En el análisis horizontal, si las ventas pasan de 700 a 900, ¿cuál es su variación?", "o": ["28,6 %", "22,2 %", "77,8 %", "200 %"], "e": "(900 − 700) / 700 = 28,6 %. El análisis horizontal mide la variación de cada cuenta entre periodos."}, {"q": "¿Cuál es la relación mínima de solvencia total exigida a los establecimientos de crédito en Colombia?", "o": ["9 % de los activos ponderados por riesgo", "4,5 %", "3 %", "20 %"], "e": "La solvencia básica mínima es 4,5 %, la básica adicional 6 % y la relación de apalancamiento 3 %."}, {"q": "La relación de solvencia básica mínima (patrimonio básico ordinario / activos ponderados por riesgo) es:", "o": ["4,5 %", "9 %", "6 %", "1,5 %"], "e": "El patrimonio técnico frente a los activos ponderados por riesgo de crédito, mercado y operacional debe ser al menos 9 %."}, {"q": "Según el Decreto 1477 de 2018, el colchón de conservación de capital es:", "o": ["1,5 % de los activos ponderados por riesgo", "1 % para todas las entidades", "9 %", "3 %"], "e": "El colchón para entidades de importancia sistémica es 1 %; la suma de ambos es el colchón combinado."}, {"q": "Los estándares internacionales de capital hacia los que converge Colombia con los Decretos 1771/2012, 904/2013 y 1477/2018 se conocen como:", "o": ["Basilea III", "Solvencia II", "NIIF 9", "IOSCO"], "e": "Los propone el Comité de Supervisión Bancaria de Basilea."}, {"q": "¿Qué es el capital económico?", "o": ["La medición del impacto monetario de los riesgos de mercado, crédito y operacional de una entidad, para hacer una provisión patrimonial", "El capital mínimo para constituir un banco", "El valor de mercado de las acciones", "El capital de trabajo"], "e": "Busca que el patrimonio cubra los riesgos asumidos."}, {"q": "Los capitales mínimos del artículo 80 del EOSF para constituir entidades financieras:", "o": ["Están en pesos de 2002 y se reajustan cada año según la variación del IPC", "Son fijos desde 1993", "Se reajustan con la TRM", "Los fija AMV"], "e": "Por ejemplo, para establecimientos bancarios la base es de 45.085 millones de pesos de 2002."}, {"q": "Las condiciones que un prestamista exige a una empresa sobre sus razones financieras durante la vigencia del crédito se denominan:", "o": ["Covenants", "Colchones", "Encajes", "Garantías soberanas"], "e": "Por ejemplo, una liquidez mínima o un endeudamiento máximo."}, {"q": "Una empresa tiene activo corriente de 820, inventarios de 500 y pasivo corriente de 560. ¿Cuál es su prueba ácida?", "o": ["0,57", "1,46", "0,89", "2,40"], "e": "(820 − 500) / 560 = 0,57. Sin vender inventarios, no alcanza a cubrir su pasivo corriente."}, {"q": "Un grado de endeudamiento (pasivo total / activo total) superior a qué nivel suele percibirse como sobreendeudamiento, según la guía?", "o": ["60 %", "10 %", "30 %", "95 %"], "e": "No hay un estándar único: depende de la industria. Los acreedores prefieren un endeudamiento bajo."}, {"q": "Una empresa tiene obligaciones financieras de 1.030 e ingresos operacionales de 900. ¿Cuál es su razón de deuda financiera a ingresos?", "o": ["114,4 %", "87,4 %", "44,4 %", "11,4 %"], "e": "1.030 / 900 = 1,144. Algunos autores sugieren que no supere el 30 %."}, {"q": "Una empresa tiene pasivo total de 1.760 y patrimonio de 2.200. ¿Cuál es su grado de apalancamiento (pasivo / patrimonio)?", "o": ["0,80", "1,25", "0,44", "1,80"], "e": "Tiene 0,80 de deuda por cada peso de capital propio."}, {"q": "Una empresa tiene activo total de 3.960 y patrimonio de 2.200. ¿Cuál es su coeficiente de apalancamiento financiero (multiplicador del patrimonio)?", "o": ["1,8", "0,56", "0,8", "2,2"], "e": "Activo / patrimonio = 3.960 / 2.200 = 1,8. Un valor más alto implica más dependencia de financiación externa."}, {"q": "El grado de concentración de la deuda (pasivo corriente / pasivo total) mide:", "o": ["La proporción de la deuda que debe pagarse en menos de un año", "La rentabilidad de los activos", "La rotación de inventarios", "La deuda con accionistas"], "e": "En una crisis, es preferible una concentración menor en el corto plazo."}, {"q": "Una empresa vende 450 a crédito al año y tiene cuentas por cobrar de 200. ¿Cuántos días tarda en promedio en cobrar?", "o": ["Cerca de 162 días", "Cerca de 44 días", "2,25 días", "365 días"], "e": "Rotación = 450 / 200 = 2,25 veces; periodo de cobro = 365 / 2,25 = 162,2 días."}, {"q": "Una empresa vende 900 al año, con inventario inicial de 600 y final de 500. ¿Cuál es su rotación de inventarios?", "o": ["1,63 veces", "1,80 veces", "1,50 veces", "0,61 veces"], "e": "Inventario promedio = (600 + 500) / 2 = 550; rotación = 900 / 550 = 1,63; unos 223 días."}, {"q": "Una empresa tarda 162 días en cobrar, 223 en vender su inventario y paga a proveedores a 90 días. ¿Cuál es su ciclo de efectivo?", "o": ["295 días", "475 días", "385 días", "151 días"], "e": "Ciclo = días de cartera + días de inventario − días de cuentas por pagar = 162 + 223 − 90 = 295."}, {"q": "En general, una empresa protege su liquidez cuando:", "o": ["Cobra su cartera en menos días de los que tarda en pagar a sus proveedores", "Paga a proveedores antes de cobrar", "Mantiene inventarios altos", "Vende todo a crédito"], "e": "Si cobra a 162 días pero paga a 90, probablemente enfrente iliquidez."}, {"q": "¿Qué indica que el ROE de una empresa sea mayor que su ROA?", "o": ["Que el apalancamiento es positivo: la deuda aumentó la rentabilidad del patrimonio", "Que la empresa no tiene deuda", "Que la empresa tiene pérdidas", "Que el patrimonio es negativo"], "e": "Sin deuda, el ROE y el ROA son iguales."}, {"q": "Una empresa tiene EBIT de 480 y gastos financieros de 80. ¿Cuál es su razón de cobertura de intereses?", "o": ["6 veces", "6,5 veces", "0,17 veces", "4 veces"], "e": "480 / 80 = 6. Se considera aceptable un mínimo cercano a 1,5."}, {"q": "Si el EBIT se mantiene en 480 pero los gastos financieros suben a 120 por mayores tasas, la cobertura de intereses:", "o": ["Baja a 4 veces", "Sube a 8 veces", "Se mantiene en 6", "Baja a 1,5"], "e": "480 / 120 = 4. Menos capacidad de pagar intereses con las utilidades."}, {"q": "¿Qué mide el margen operacional?", "o": ["La utilidad que queda por cada peso de ventas después de costos, gastos de administración y ventas, depreciación y amortización", "La utilidad después de impuestos", "Solo la utilidad bruta", "El efectivo generado por financiación"], "e": "Muestra el resultado de la actividad principal, antes de lo no operacional y de la financiación."}, {"q": "Una empresa tiene un margen bruto superior al de su industria, pero un margen operacional inferior. ¿Qué se puede concluir?", "o": ["Es eficiente en costos de producción, pero menos eficiente en gastos de administración, ventas o depreciación", "Es ineficiente en costos de producción", "No tiene deuda", "Sus ventas son todas a crédito"], "e": "Es el razonamiento del ejercicio de la guía con la Corporación ABC."}], "etica": [{"q": "Un conflicto de interés se presenta cuando:", "o": ["Una persona puede tomar una decisión entre dos o más intereses incompatibles que no puede atender a la vez", "Dos clientes quieren comprar la misma acción", "Un cliente pierde dinero en una inversión", "Dos entidades compiten por el mismo cliente"], "e": "Hay conflicto de interés cuando quien debe decidir tiene intereses contrapuestos e incompatibles, como el propio frente al del cliente."}, {"q": "¿Cuál es la forma correcta de manejar un conflicto de interés que no puede evitarse?", "o": ["Revelarlo al cliente y gestionarlo según las políticas de la entidad, dando prioridad al interés del cliente", "Ocultarlo para no perder el negocio", "Resolverlo a favor de la entidad", "Ignorarlo si el monto es pequeño"], "e": "Los conflictos deben identificarse, revelarse y administrarse según las políticas de la entidad. Cuando no pueden evitarse, prevalece el interés del cliente."}, {"q": "Un operador recibe una orden grande de compra de un cliente y, antes de ejecutarla, compra la misma acción para su cuenta personal. Esta conducta se conoce como:", "o": ["Front running o anticipación de órdenes", "Corretaje", "Mejor ejecución", "Arbitraje"], "e": "El front running consiste en aprovechar el conocimiento de una orden de un cliente para operar antes por cuenta propia. Es una práctica prohibida."}, {"q": "¿Qué es información privilegiada?", "o": ["Información concreta, no pública, que de conocerse podría influir en el precio de un valor", "Cualquier información financiera publicada en un diario", "Un informe de investigación distribuido a todos los clientes", "La información que el cliente da al abrir su cuenta"], "e": "La información privilegiada es concreta, no se ha hecho pública y tiene la capacidad de afectar el precio de los valores si se conoce."}, {"q": "Quien tiene información privilegiada sobre un emisor debe:", "o": ["Abstenerse de usarla para negociar y de suministrarla a terceros", "Usarla solo en beneficio de sus clientes", "Compartirla con sus compañeros de trabajo", "Publicarla en redes sociales"], "e": "Quien tiene información privilegiada debe guardar reserva, no puede usarla para negociar y no puede revelarla ni recomendar operaciones basadas en ella."}, {"q": "Un operador ejecuta compras y ventas entre cuentas relacionadas para crear una falsa apariencia de volumen. Esta conducta es:", "o": ["Manipulación del mercado", "Una estrategia legítima de liquidez", "Corretaje", "Una operación repo"], "e": "Crear una apariencia artificial de actividad o de precio es manipulación del mercado y está prohibido."}, {"q": "El deber de mejor ejecución obliga al intermediario a:", "o": ["Ejecutar las órdenes del cliente en las mejores condiciones posibles, según el mercado y las instrucciones del cliente", "Garantizar que el cliente siempre gane", "Ejecutar las órdenes solo cuando el precio sube", "Dar prioridad a las órdenes de la cuenta propia"], "e": "La mejor ejecución busca el resultado más favorable para el cliente en precio, costos, rapidez y probabilidad de ejecución, según sus instrucciones."}, {"q": "El 'churning' o rotación excesiva de un portafolio consiste en:", "o": ["Hacer operaciones excesivas en la cuenta del cliente para generar comisiones", "Diversificar el portafolio en muchos activos", "Rebalancear el portafolio cada año", "Vender valores para cubrir una pérdida"], "e": "El churning genera comisiones para el intermediario sin beneficio para el cliente. Viola el deber de lealtad."}, {"q": "¿Qué implica el deber de lealtad del intermediario?", "o": ["Obrar de manera íntegra, franca y objetiva, poniendo los intereses del cliente por encima de los propios", "Hacer siempre lo que la entidad le ordene", "No trabajar nunca para la competencia", "Recomendar solo productos de la propia entidad"], "e": "El deber de lealtad exige actuar con integridad y objetividad en beneficio del cliente y del mercado, evitando aprovecharse de la posición."}, {"q": "Un asesor recibe un regalo costoso de un emisor cuyos bonos recomienda a sus clientes. ¿Qué debería hacer?", "o": ["Rechazarlo o reportarlo según la política de su entidad, porque puede afectar su objetividad", "Aceptarlo, porque es un detalle comercial", "Aceptarlo y no contarle a nadie", "Venderlo y repartir el dinero con sus clientes"], "e": "Los regalos que puedan comprometer la objetividad del profesional generan conflicto de interés y deben manejarse según la política de la entidad."}, {"q": "El deber de reserva o confidencialidad obliga al intermediario a:", "o": ["No revelar la información de sus clientes, salvo autorización o requerimiento legal", "Publicar las operaciones de sus clientes", "Compartir la información de clientes con otras entidades", "Revelar a todos los clientes las posiciones de los demás"], "e": "La información de los clientes es confidencial y solo puede revelarse con autorización del cliente o por requerimiento de una autoridad competente."}, {"q": "Una 'muralla china' es:", "o": ["Un conjunto de barreras de información entre áreas de la entidad para evitar el flujo de información privilegiada", "Un sistema para limitar las pérdidas de un portafolio", "Una barrera arancelaria para valores extranjeros", "Un límite de inversión en un solo emisor"], "e": "Las murallas chinas separan áreas, como banca de inversión y negociación, para evitar que la información privilegiada se use de forma indebida."}, {"q": "¿Cuál de las siguientes conductas va contra el deber de información al cliente?", "o": ["Ocultar al cliente los riesgos de un producto que se le ofrece", "Explicar las comisiones antes de abrir la cuenta", "Entregar el extracto periódico", "Informar los cambios en las condiciones del producto"], "e": "El intermediario debe dar información clara, completa y oportuna, incluyendo los riesgos, costos y características de los productos."}, {"q": "Un operador usa recursos de un cliente para cubrir temporalmente una pérdida de otro cliente. ¿Qué deber vulnera?", "o": ["El deber de separación de activos", "El deber de mejor ejecución", "El deber de documentación", "El deber de asesoría"], "e": "Los recursos y valores de cada cliente deben mantenerse separados, de los de la entidad y de los de otros clientes."}, {"q": "¿Cuál es la conducta correcta de un profesional que se entera de una irregularidad cometida por un compañero?", "o": ["Informar a las instancias de control de su entidad, según los procedimientos internos", "Guardar silencio para no afectar el ambiente laboral", "Pedir al compañero parte de la ganancia", "Publicarlo en redes sociales"], "e": "Los profesionales deben reportar las conductas irregulares a los órganos de control de la entidad, como cumplimiento o auditoría."}, {"q": "Un operador da a un cliente una tasa peor que la que obtuvo en el mercado y se queda con la diferencia. Esta conducta es:", "o": ["Una apropiación indebida que viola el deber de lealtad", "Una comisión legítima", "Una operación de arbitraje", "Una práctica permitida si el cliente no pregunta"], "e": "Quedarse con una diferencia de precio no pactada perjudica al cliente y viola los deberes de lealtad y de mejor ejecución."}, {"q": "La difusión de rumores falsos para mover el precio de una acción constituye:", "o": ["Manipulación del mercado mediante información", "Análisis técnico", "Educación financiera", "Libertad de prensa sin consecuencias"], "e": "Difundir información falsa o engañosa que afecte el precio de los valores es una forma de manipulación prohibida."}, {"q": "Un cliente con perfil conservador pide invertir todo su patrimonio en derivados. ¿Qué debe hacer el asesor?", "o": ["Advertirle que el producto no es adecuado para su perfil y documentar la advertencia", "Ejecutar la orden sin comentarios", "Negarse a seguir atendiendo al cliente", "Cambiar el perfil del cliente sin consultarle"], "e": "El asesor debe advertir al cliente cuando un producto no corresponde a su perfil, explicar los riesgos y dejar constancia. La decisión final es del cliente."}, {"q": "¿Cuál es el propósito de un código de ética en una entidad del mercado de valores?", "o": ["Definir principios y conductas esperadas para proteger a los clientes y la integridad del mercado", "Fijar las metas comerciales del año", "Reemplazar las normas legales", "Establecer los salarios de los empleados"], "e": "El código de ética orienta la conducta de los empleados y complementa las normas legales y de autorregulación."}, {"q": "Un operador recibe la instrucción de un cliente de forma verbal y no la registra. ¿Qué deber incumple?", "o": ["El deber de documentación", "El deber de reserva", "El deber de separación de activos", "El deber de mejor ejecución"], "e": "Las órdenes y operaciones deben documentarse y grabarse según las reglas, para que exista evidencia de lo instruido por el cliente."}, {"q": "Un operador se entera en una reunión interna de que la entidad recomendará vender masivamente una acción. Antes de que se publique el informe, vende las acciones de su cuenta personal. ¿Qué conducta cometió?", "o": ["Uso indebido de información privilegiada", "Mejor ejecución", "Gestión de liquidez", "Arbitraje legítimo"], "e": "Usó información concreta y no pública, que afectaría el precio, en beneficio propio. Es uso indebido de información privilegiada."}, {"q": "Un asesor recomienda a sus clientes un FIC de su entidad porque le pagan una bonificación mayor, aunque otro producto se ajusta mejor a su perfil. ¿Qué principio vulnera?", "o": ["El deber de lealtad y el manejo adecuado de conflictos de interés", "El deber de reserva", "El deber de separación de activos", "Ninguno, porque es un producto de la entidad"], "e": "Anteponer su propio beneficio al interés del cliente es un conflicto de interés mal gestionado y viola el deber de lealtad."}, {"q": "Un cliente pide a su operador que no registre una orden para que no aparezca en sus extractos. ¿Qué debe hacer el operador?", "o": ["Negarse, porque todas las órdenes deben registrarse y documentarse", "Aceptar, porque el cliente manda", "Registrarla a nombre de otro cliente", "Ejecutarla sin dejar evidencia"], "e": "El deber de documentación exige registrar todas las órdenes. Ocultar operaciones puede encubrir conductas ilegales."}, {"q": "Un operador comenta con un amigo, en una cena, las posiciones de un cliente importante. ¿Qué deber incumple?", "o": ["El deber de reserva o confidencialidad", "El deber de mejor ejecución", "El deber de asesoría", "Ningún deber, si el amigo no trabaja en el mercado"], "e": "La información de los clientes es confidencial. Revelarla sin autorización viola el deber de reserva, sin importar a quién se le cuente."}, {"q": "Un operador compra y vende la misma acción al mismo tiempo entre dos cuentas de un mismo beneficiario para fijar un precio de cierre alto. ¿Cómo se denomina esta conducta?", "o": ["Manipulación del precio de cierre mediante operaciones ficticias", "Cobertura", "Mejor ejecución", "Operación repo"], "e": "Las operaciones sin cambio real de beneficiario, hechas para fijar artificialmente un precio, son manipulación del mercado."}, {"q": "Un asesor promete a un cliente que un fondo de acciones \"nunca pierde\". ¿Qué está haciendo?", "o": ["Dando información engañosa que vulnera el deber de información", "Cumpliendo con su deber de asesoría", "Usando un argumento comercial permitido", "Gestionando el riesgo de mercado"], "e": "Ningún producto de renta variable está libre de pérdidas. Prometer lo contrario es información engañosa."}, {"q": "Un operador da prioridad a las órdenes de su cuenta personal sobre las de sus clientes cuando el mercado se mueve rápido. ¿Qué conducta es?", "o": ["Una violación del deber de lealtad y de la prioridad de las órdenes de los clientes", "Una práctica normal de mercado", "Una estrategia de cobertura", "Una forma de mejor ejecución"], "e": "Las órdenes de los clientes tienen prioridad sobre las propias. Aprovechar la posición para ejecutar primero las personales viola el deber de lealtad."}, {"q": "Un analista publica un informe positivo sobre una empresa en la que tiene una inversión personal importante, sin revelarlo. ¿Qué falta comete?", "o": ["No revelar un conflicto de interés en un informe de investigación", "Ninguna, si el informe es correcto", "Manipulación de divisas", "Incumplimiento del deber de separación de activos"], "e": "Los conflictos de interés deben revelarse en los informes de investigación para que el lector pueda valorar su objetividad."}, {"q": "Un operador recibe una orden de un cliente y la ejecuta a un precio peor del disponible, porque así le conviene a otro cliente más grande. ¿Qué deber incumple?", "o": ["El deber de mejor ejecución y de trato equitativo", "El deber de reserva", "El deber de documentación", "El deber de conocer al cliente"], "e": "Cada cliente tiene derecho a la mejor ejecución posible. Favorecer a un cliente en perjuicio de otro viola el trato equitativo."}, {"q": "Un empleado del área de banca de inversión comparte con la mesa de negociación los detalles de una emisión aún no anunciada. ¿Qué mecanismo falló?", "o": ["Las barreras de información o murallas chinas", "El plan de continuidad del negocio", "El sistema de compensación", "El registro en el RNVE"], "e": "Las murallas chinas existen para que la información privilegiada de banca de inversión no llegue a las áreas que negocian."}, {"q": "¿Qué debe hacer un profesional que identifica que tiene un conflicto de interés en una operación con un cliente?", "o": ["Revelarlo, abstenerse si es necesario y seguir el procedimiento de su entidad", "Ocultarlo para cerrar la venta", "Pedir al cliente que firme sin leer", "Cambiar la fecha de la operación"], "e": "La revelación y la gestión del conflicto, o la abstención, protegen al cliente y a la integridad del mercado."}, {"q": "Un operador sugiere a un cliente vender una acción \"porque mañana sale una mala noticia\", que conoció por su cargo. ¿Qué hizo?", "o": ["Suministró información privilegiada a un tercero", "Prestó asesoría adecuada", "Actuó con mejor ejecución", "Cumplió el deber de información"], "e": "Recomendar operaciones con base en información privilegiada está prohibido, aunque el operador no opere directamente."}, {"q": "Un asesor clasifica a un cliente como inversionista profesional sin verificar los requisitos, para venderle un producto complejo. ¿Qué vulnera?", "o": ["Las normas de clasificación de clientes y el deber de protección al cliente", "Ninguna norma, si el cliente acepta", "Solo las normas tributarias", "El régimen cambiario"], "e": "La clasificación debe basarse en requisitos verificados. Clasificar mal a un cliente le quita protecciones a las que tiene derecho."}, {"q": "Una entidad paga a sus asesores comisiones solo por volumen de ventas, sin controles. ¿Qué riesgo ético genera?", "o": ["Incentivos para vender productos inadecuados al perfil de los clientes", "Mejora automática del servicio", "Reducción del riesgo de mercado", "Ningún riesgo"], "e": "Los esquemas de remuneración pueden crear conflictos de interés. Deben diseñarse y controlarse para no inducir ventas inadecuadas."}, {"q": "Un operador opera de forma reiterada en la cuenta de un cliente sin tener una orden previa. ¿Qué conducta es?", "o": ["Realizar operaciones no autorizadas", "Una práctica aceptable si gana dinero", "Gestión discrecional legítima", "Asesoría"], "e": "Sin un mandato discrecional expreso, el intermediario solo puede operar con órdenes del cliente. Operar sin orden es una falta grave."}, {"q": "¿Cuál es la conducta correcta ante una solicitud de información de un cliente por parte de una autoridad competente, como la Fiscalía?", "o": ["Entregar la información según el procedimiento legal de la entidad", "Negarse siempre por la reserva", "Avisar al cliente antes de entregarla", "Destruir la información"], "e": "La reserva cede ante el requerimiento de autoridades competentes. La entrega debe hacerse según los procedimientos internos."}, {"q": "Un operador difunde en un chat de inversionistas que una empresa va a ser comprada, sin saber si es cierto, para que suba la acción que él tiene. ¿Qué conducta es?", "o": ["Manipulación del mercado mediante la difusión de información falsa o engañosa", "Libertad de opinión sin consecuencias", "Análisis fundamental", "Educación financiera"], "e": "Difundir rumores para mover precios en beneficio propio es manipulación, sin importar el medio."}, {"q": "Un profesional recibe de un cliente un regalo de alto valor después de una operación muy rentable. ¿Qué debe hacer?", "o": ["Seguir la política de regalos de su entidad y reportarlo, porque puede crear un conflicto de interés", "Aceptarlo sin decir nada", "Pedir otro regalo para su compañero", "Venderlo y quedarse con el dinero"], "e": "Los regalos significativos pueden comprometer la objetividad. Las entidades tienen políticas que fijan límites y obligan a reportarlos."}, {"q": "Un operador aconseja a un cliente con perfil conservador concentrar su ahorro en una sola acción de alto riesgo. ¿Qué principio incumple?", "o": ["El deber de asesoría y la adecuación del producto al perfil", "El deber de reserva", "El deber de documentación", "La separación de activos"], "e": "La recomendación debe ser adecuada al perfil del cliente. Concentrar todo el ahorro de un conservador en una acción riesgosa no lo es."}, {"q": "¿Cuál de las siguientes es una buena práctica para evitar el uso indebido de información privilegiada?", "o": ["Mantener listas de valores restringidos y controlar las operaciones personales de los empleados", "Permitir que todos los empleados operen libremente", "Compartir la información con todos los clientes importantes", "Eliminar los controles para agilizar"], "e": "Las listas restringidas, la preautorización de operaciones personales y las murallas chinas son controles comunes."}, {"q": "Una operación \"cruzada\" en la que el mismo intermediario actúa como comprador y vendedor por cuenta de dos clientes:", "o": ["Es posible, pero debe hacerse en condiciones de mercado y con transparencia, sin favorecer a ninguno de los clientes", "Siempre está prohibida", "Siempre está permitida sin controles", "Solo es posible en el exterior"], "e": "Las operaciones cruzadas generan un conflicto potencial. Deben hacerse a precios de mercado y según las reglas del sistema de negociación."}, {"q": "Un operador dice a un cliente que la entidad cobra una comisión menor a la real, para cerrar la operación. ¿Qué deber incumple?", "o": ["El deber de información, que exige revelar los costos de forma clara y veraz", "El deber de mejor ejecución", "El deber de separación", "Ninguno, si después le devuelve la diferencia"], "e": "Los costos y comisiones deben informarse de forma clara y cierta antes de la operación."}, {"q": "Un directivo de una empresa inscrita en bolsa compra acciones de la empresa justo antes de anunciar resultados muy positivos que ya conocía. ¿Qué conducta es?", "o": ["Uso de información privilegiada", "Inversión de largo plazo legítima", "Mejor ejecución", "Cobertura de riesgo"], "e": "Los administradores tienen restricciones para negociar acciones de su empresa, precisamente por su acceso a información no pública."}, {"q": "Cuando un empleado detecta que su superior está manipulando precios, la conducta esperada es:", "o": ["Reportarlo por los canales internos de denuncia o al oficial de cumplimiento", "Unirse para no perder el empleo", "Ignorarlo", "Advertir al superior para que borre la evidencia"], "e": "Las entidades deben tener canales de denuncia confidenciales. Reportar las conductas irregulares protege al mercado y al empleado."}, {"q": "¿Cuál es el objetivo del deber de conocimiento del cliente?", "o": ["Entender su perfil, su actividad y el origen de sus recursos para asesorarlo y prevenir el lavado de activos", "Vender más productos", "Cobrar comisiones más altas", "Compartir sus datos con terceros"], "e": "Conocer al cliente sirve tanto para dar una asesoría adecuada como para prevenir el lavado de activos y la financiación del terrorismo."}, {"q": "Un asesor dice a un cliente que una inversión tiene \"rentabilidad garantizada por el Gobierno\", cuando no es cierto. Esto constituye:", "o": ["Publicidad o información engañosa", "Información veraz", "Una opinión personal permitida", "Educación financiera"], "e": "La información a los clientes debe ser cierta, clara y suficiente. Atribuir garantías inexistentes induce a error."}, {"q": "¿Por qué el profesional del mercado debe abstenerse de usar su posición para obtener beneficios personales?", "o": ["Porque el deber de lealtad exige anteponer los intereses del cliente y del mercado a los propios", "Porque está prohibido ganar dinero", "Porque así lo dice el contrato de trabajo únicamente", "Porque no tiene permitido invertir nunca"], "e": "Los profesionales pueden invertir de forma personal, pero sin aprovecharse de su posición ni de la información de clientes."}, {"q": "Un operador fracciona una orden grande de un cliente en muchas órdenes pequeñas para cobrar más comisiones. ¿Qué conducta es?", "o": ["Generación indebida de comisiones, contraria al deber de lealtad", "Mejor ejecución", "Una práctica recomendada", "Gestión del riesgo de liquidez"], "e": "Fraccionar órdenes para aumentar comisiones, sin beneficio para el cliente, va contra el deber de lealtad."}, {"q": "Una entidad publica una rentabilidad pasada de un fondo, pero omite indicar que no garantiza resultados futuros. ¿Qué falla?", "o": ["La información es incompleta y puede inducir a error", "Ninguna, la rentabilidad pasada es suficiente", "Viola el deber de reserva", "Viola la separación de activos"], "e": "La publicidad debe advertir que las rentabilidades pasadas no garantizan las futuras."}, {"q": "La integridad del mercado se ve afectada principalmente por:", "o": ["La manipulación, el uso de información privilegiada y el fraude", "La competencia entre intermediarios", "El aumento del número de inversionistas", "La publicación de información relevante"], "e": "Estas conductas dañan la confianza y la formación transparente de precios, que son la base del mercado."}, {"q": "Un operador olvida ejecutar una orden y, para ocultarlo, la registra con fecha anterior. ¿Qué conducta añade a su error?", "o": ["Alteración de registros, que es una falta grave de documentación e integridad", "Ninguna, porque corrigió el error", "Mejor ejecución", "Gestión de liquidez"], "e": "Los errores operativos deben reportarse y corregirse según el procedimiento. Alterar registros para ocultarlos es una conducta deshonesta."}, {"q": "¿Qué es el \"trading\" con base en las órdenes de clientes conocido como \"piggybacking\"?", "o": ["Replicar en la cuenta personal las operaciones de un cliente aprovechando el conocimiento de sus órdenes", "Comprar acciones para el largo plazo", "Hacer coberturas cambiarias", "Ejecutar órdenes en el exterior"], "e": "Aprovechar el conocimiento de las órdenes de un cliente para operar en beneficio propio viola el deber de lealtad y la confidencialidad."}, {"q": "Ante una duda sobre si una conducta es ética, la mejor práctica del profesional es:", "o": ["Consultar al área de cumplimiento antes de actuar", "Actuar y esperar que nadie lo note", "Preguntar a un cliente", "Hacerlo si la ganancia es pequeña"], "e": "El área de cumplimiento orienta sobre las conductas permitidas. Consultar antes de actuar previene infracciones."}, {"q": "Un asesor que no tiene la certificación vigente atiende clientes en nombre de un compañero certificado. ¿Qué falta comete?", "o": ["Ejercer funciones que requieren certificación sin tenerla", "Ninguna, si el compañero lo autoriza", "Una falta solo tributaria", "Una infracción de tránsito"], "e": "Las funciones que requieren certificación solo pueden ejercerlas profesionales certificados e inscritos en el RNPMV."}, {"q": "¿Cuál es la consecuencia de que un profesional actúe con integridad de forma constante?", "o": ["Fortalece la confianza de los clientes y del público en el mercado de valores", "Reduce la rentabilidad de todos los productos", "Elimina el riesgo de mercado", "Lo exime de supervisión"], "e": "La confianza es el activo principal del mercado. La integridad de los profesionales la sostiene."}, {"q": "Un operador recibe instrucciones del jefe para ejecutar una operación que considera manipulación. ¿Qué debe hacer?", "o": ["Abstenerse de hacerla y reportarla por los canales de la entidad", "Ejecutarla porque es una orden", "Ejecutarla y luego renunciar", "Pedir a otro operador que la haga"], "e": "Seguir órdenes no exime de responsabilidad. La conducta correcta es abstenerse y reportar."}, {"q": "¿Qué es la información pública en el mercado de valores?", "o": ["La información que ha sido divulgada al mercado por los medios establecidos, como el RNVE", "Cualquier información que conozca un empleado", "Los rumores en redes sociales", "La información de los clientes"], "e": "Una vez divulgada por los canales oficiales, la información deja de ser privilegiada."}, {"q": "Un analista recibe en una conferencia pública información que el presidente de una empresa reveló a todos los asistentes y medios. ¿Puede usarla?", "o": ["Sí, porque fue divulgada públicamente", "No, nunca", "Solo si paga una comisión", "Solo si la comparte primero con su jefe"], "e": "Si la información se divulgó al mercado en general, ya no es privilegiada y puede usarse."}, {"q": "Un profesional debe actuar con transparencia, lo que significa:", "o": ["Dar información clara, completa y verificable sobre sus actuaciones y los productos", "Revelar la información de sus clientes", "Publicar su salario", "Hablar de todo en redes sociales"], "e": "La transparencia permite a clientes y supervisores entender y verificar las actuaciones del profesional."}, {"q": "¿Cuál es el principio de equidad en el trato a los clientes?", "o": ["Tratar a todos los clientes de forma justa, sin favorecer a unos en perjuicio de otros", "Dar a todos los clientes la misma rentabilidad", "Cobrar la misma comisión a todos sin excepción", "Atender solo a los clientes grandes"], "e": "La equidad exige no privilegiar a unos clientes, por ejemplo en la asignación de operaciones o en la prioridad de órdenes."}, {"q": "En una colocación con alta demanda, el intermediario asigna los títulos solo a los clientes más rentables para él. ¿Qué principio afecta?", "o": ["El trato equitativo a los clientes", "El deber de documentación", "El deber de reserva", "Ninguno"], "e": "La asignación debe seguir reglas objetivas y conocidas, no el beneficio del intermediario."}, {"q": "Un operador usa el computador de un compañero, con su clave, para ingresar órdenes. ¿Qué problema genera?", "o": ["Afecta la trazabilidad y la responsabilidad de las operaciones, y viola los controles de seguridad", "Ninguno, si las órdenes son correctas", "Mejora la eficiencia", "Es una práctica recomendada"], "e": "Cada profesional debe operar con sus propias credenciales para que se sepa quién hizo cada operación."}, {"q": "Un asesor publica en sus redes recomendaciones de inversión sobre productos de su entidad, sin autorización. ¿Qué riesgo implica?", "o": ["Incumplir las políticas de comunicaciones y las normas de publicidad y asesoría", "Ninguno, porque es libertad de expresión", "Mejorar la reputación sin riesgos", "Cumplir con la educación financiera"], "e": "Las comunicaciones sobre productos deben cumplir reglas de publicidad, asesoría y aprobación interna."}, {"q": "¿Cuál es la conducta esperada frente a un error operativo que perjudicó a un cliente?", "o": ["Reportarlo, corregirlo según el procedimiento y compensar al cliente si corresponde", "Ocultarlo", "Culpar al cliente", "Esperar a que el cliente no lo note"], "e": "La transparencia ante los errores protege al cliente y a la entidad."}, {"q": "Un directivo exige a los operadores metas que solo se pueden cumplir rotando excesivamente las cuentas de los clientes. ¿Qué responsabilidad tiene?", "o": ["Responde por promover conductas contrarias a los deberes frente a los clientes", "Ninguna, porque no opera directamente", "Solo responde la entidad", "Solo responden los operadores"], "e": "Los directivos también son sujetos de la autorregulación y responden por las políticas que promueven."}, {"q": "La independencia del análisis de inversiones requiere que:", "o": ["Las recomendaciones no estén influenciadas por intereses comerciales de la entidad", "Los analistas trabajen sin supervisión", "Los informes no se publiquen", "Los analistas opinen solo de empresas grandes"], "e": "Los informes deben reflejar el criterio profesional del analista, separado de los intereses de banca de inversión o de ventas."}, {"q": "¿Qué es el \"spoofing\" o colocación de órdenes falsas?", "o": ["Ingresar órdenes que no se piensan ejecutar para crear una apariencia de oferta o demanda", "Hacer coberturas con derivados", "Comprar y mantener acciones", "Rebalancear un portafolio"], "e": "Las órdenes falsas engañan al mercado sobre la oferta o la demanda real. Es una forma de manipulación."}, {"q": "Un operador que tiene una relación sentimental con un cliente debe:", "o": ["Revelarlo a su entidad para gestionar el posible conflicto de interés", "Ocultarlo", "Darle mejores precios", "Dejar de registrar sus órdenes"], "e": "Las relaciones personales pueden afectar la objetividad y deben gestionarse como conflicto de interés."}, {"q": "Un profesional que pasa a trabajar a la competencia se lleva la base de datos de clientes. ¿Qué incumple?", "o": ["El deber de reserva y la protección de datos personales", "Ningún deber, porque los clientes eran suyos", "Solo una norma laboral", "El deber de mejor ejecución"], "e": "La información de los clientes pertenece a la relación con la entidad y está protegida por la reserva y la ley de datos personales."}, {"q": "¿Cuál es el principal propósito de las políticas de operaciones personales de los empleados?", "o": ["Prevenir conflictos de interés y el uso de información privilegiada", "Prohibir que los empleados ahorren", "Aumentar las comisiones", "Controlar el salario"], "e": "Estas políticas exigen, por ejemplo, autorizaciones previas, plazos mínimos de tenencia y reportes de las inversiones personales."}, {"q": "Un operador vende a un cliente un título de la posición propia de la entidad a un precio fuera de mercado. ¿Qué conducta es?", "o": ["Una operación en perjuicio del cliente que viola el deber de lealtad y de precios justos", "Una práctica normal", "Mejor ejecución", "Una cobertura"], "e": "Las operaciones entre la entidad y sus clientes deben hacerse a precios de mercado."}, {"q": "¿Qué significa actuar con diligencia profesional?", "o": ["Actuar con el cuidado, la preparación y la atención que se espera de un experto", "Actuar rápido sin revisar", "Actuar solo cuando el cliente lo pide", "Actuar según la intuición"], "e": "La diligencia exige conocer los productos, las normas y los clientes, y revisar cuidadosamente cada actuación."}, {"q": "Un asesor no conoce bien un producto complejo, pero lo recomienda igual porque tiene buena comisión. ¿Qué deber incumple?", "o": ["El deber de diligencia y de asesoría adecuada", "El deber de reserva", "El deber de separación", "Ninguno"], "e": "No se puede recomendar lo que no se entiende. El profesional debe conocer los productos que ofrece."}, {"q": "¿Qué es la información asimétrica en el mercado?", "o": ["Una situación en la que una parte tiene más o mejor información que la otra", "Información publicada en dos idiomas", "La información de los estados financieros", "Un tipo de informe técnico"], "e": "Las normas de información y conducta buscan reducir la asimetría entre intermediarios e inversionistas."}, {"q": "Un cliente pide a su asesor que le recomiende una inversión, y el asesor le explica que su entidad recibe comisiones de la gestora del fondo recomendado. ¿Qué está haciendo bien?", "o": ["Revelando un conflicto de interés", "Violando la reserva", "Haciendo publicidad engañosa", "Manipulando el mercado"], "e": "Revelar los incentivos que recibe la entidad permite al cliente valorar la recomendación."}, {"q": "Un operador se da cuenta de que, por un error del sistema, un cliente recibió más títulos de los que compró. ¿Qué debe hacer?", "o": ["Reportarlo para corregir el error según el procedimiento, aunque beneficie al cliente", "Callar, porque beneficia al cliente", "Quedarse con la diferencia", "Esperar a ver si alguien lo nota"], "e": "Los errores deben corregirse con transparencia, sin importar a quién beneficien."}, {"q": "¿Cuál de estas conductas refleja integridad profesional?", "o": ["Rechazar una operación rentable que va contra las normas", "Hacer lo que pida el cliente sin evaluar", "Ocultar información negativa de un producto", "Aceptar regalos de emisores"], "e": "La integridad implica cumplir las normas y los deberes, aunque signifique perder un negocio."}, {"q": "Un asesor comparte con su familia las recomendaciones de compra antes de que lleguen a los clientes. ¿Qué conducta es?", "o": ["Uso indebido de información y trato no equitativo a los clientes", "Una práctica permitida", "Educación financiera", "Mejor ejecución"], "e": "Anticipar a terceros recomendaciones no publicadas puede afectar el precio y perjudica a los clientes."}, {"q": "Una entidad ofrece una bonificación al operador que venda más títulos de la posición propia. ¿Qué debe controlar la entidad?", "o": ["Que los operadores no vendan esos títulos a clientes para quienes no son adecuados ni a precios fuera de mercado", "Nada, es un incentivo comercial normal", "Solo el monto de la bonificación", "La ropa de los operadores"], "e": "Los incentivos de venta crean conflictos de interés que deben gestionarse con controles."}, {"q": "¿Qué hace un profesional ético cuando un cliente insiste en una operación que no corresponde a su perfil?", "o": ["Le advierte los riesgos, deja constancia y respeta la decisión del cliente si este insiste", "Le niega el servicio sin explicación", "La ejecuta sin advertir", "Cambia el perfil del cliente sin informarle"], "e": "El asesor informa y documenta; la decisión final es del cliente informado."}, {"q": "Un profesional que divulga información falsa sobre la situación financiera de un competidor incurre en:", "o": ["Una conducta contraria a la ética y a la integridad del mercado", "Una estrategia comercial válida", "Libertad de expresión sin consecuencias", "Mejor ejecución"], "e": "La información falsa afecta la confianza y puede constituir manipulación o competencia desleal."}, {"q": "El principio de profesionalismo exige que el operador:", "o": ["Conozca las normas, los productos y el mercado, y actúe con criterio técnico", "Opere solo por intuición", "Siga las recomendaciones de redes sociales", "Evite capacitarse"], "e": "Ser profesional implica preparación técnica y actualización permanente."}, {"q": "¿Qué es una operación de \"cara a cara\" con un cliente en la que el intermediario es la contraparte?", "o": ["Una operación en la que el intermediario negocia directamente con el cliente desde su posición propia, que exige precios justos y revelación", "Una operación prohibida siempre", "Una operación sin riesgo", "Una operación de corretaje"], "e": "Cuando el intermediario es contraparte de su cliente hay un conflicto potencial, que se gestiona con precios de mercado y transparencia."}, {"q": "Un operador recibe una llamada de un supuesto cliente pidiendo transferir recursos a una cuenta nueva. ¿Qué debe hacer?", "o": ["Verificar la identidad y la instrucción por los canales seguros antes de ejecutar", "Ejecutar de inmediato para dar buen servicio", "Pedir la clave del cliente por teléfono", "Ignorar la llamada"], "e": "La verificación protege al cliente contra el fraude externo, un riesgo operacional frecuente."}, {"q": "Un analista cambia su recomendación por presión del área comercial. ¿Qué principio se afecta?", "o": ["La independencia y objetividad del análisis", "La reserva", "La separación de activos", "La documentación"], "e": "Las recomendaciones deben reflejar el criterio técnico del analista, no intereses comerciales."}, {"q": "Un operador opera a nombre de un familiar para evitar las restricciones de operaciones personales. ¿Qué conducta es?", "o": ["Una forma de evadir las políticas de operaciones personales y de conflictos de interés", "Una práctica permitida", "Una inversión de largo plazo", "Una cobertura"], "e": "Las políticas de operaciones personales suelen incluir a familiares y cuentas en las que el empleado tiene interés."}, {"q": "¿Por qué deben grabarse las conversaciones telefónicas en las que se reciben órdenes?", "o": ["Para tener evidencia de las instrucciones del cliente y resolver diferencias", "Para venderlas a terceros", "Para entrenamiento únicamente", "No deben grabarse"], "e": "La grabación es parte del deber de documentación y protege tanto al cliente como a la entidad."}, {"q": "Un operador revela a un cliente las órdenes pendientes de otros clientes. ¿Qué deber incumple?", "o": ["El deber de reserva y el trato equitativo", "El deber de asesoría", "El deber de mejor ejecución únicamente", "Ningún deber"], "e": "Las órdenes de los clientes son confidenciales y su revelación puede darles ventaja indebida a otros."}, {"q": "Una buena cultura ética en una entidad se caracteriza por:", "o": ["Liderazgo con el ejemplo, canales de denuncia y consecuencias claras ante las faltas", "Metas comerciales sin controles", "Tolerancia a las faltas pequeñas", "Silencio ante los errores"], "e": "La cultura ética depende del ejemplo de los directivos y de mecanismos que promuevan el cumplimiento."}, {"q": "Un profesional que se equivoca y lo reconoce a tiempo:", "o": ["Actúa con integridad y facilita la corrección del problema", "Comete una falta más grave", "Debe ser expulsado", "Pierde su certificación automáticamente"], "e": "Reconocer y corregir los errores es parte de la conducta íntegra y suele atenuar las consecuencias."}, {"q": "Un operador recibe un correo con información de un cliente equivocado. ¿Qué debe hacer?", "o": ["Informar el error, no usar la información y seguir el procedimiento de protección de datos", "Reenviarlo a sus compañeros", "Usar la información para ofrecerle productos", "Publicarlo"], "e": "La información recibida por error sigue siendo confidencial."}, {"q": "¿Qué deber se incumple al ofrecer un producto sin explicar sus costos de salida?", "o": ["El deber de información", "El deber de reserva", "El deber de separación", "El deber de documentación"], "e": "El cliente debe conocer todos los costos relevantes, incluidos los de retiro o salida."}, {"q": "La regla general frente a un conflicto de interés que no se puede gestionar adecuadamente es:", "o": ["Abstenerse de actuar", "Actuar a favor de la entidad", "Actuar y revelar después", "Delegar en un compañero sin informar"], "e": "Si el conflicto no puede gestionarse para proteger al cliente, la conducta correcta es no actuar."}, {"q": "Un asesor ofrece a un cliente devolverle parte de su comisión si compra un producto. ¿Qué problema ético hay?", "o": ["Puede inducir decisiones no basadas en la conveniencia del producto y debe sujetarse a las políticas de la entidad", "Ninguno, siempre es bueno para el cliente", "Es una práctica obligatoria", "Es una forma de mejor ejecución"], "e": "Los incentivos deben ser transparentes y autorizados; la recomendación debe basarse en la conveniencia del producto."}, {"q": "¿Qué protege el deber de reserva?", "o": ["La confianza del cliente y su información financiera y personal", "Los intereses del competidor", "La rentabilidad del intermediario", "La reputación de los reguladores"], "e": "La reserva es la base de la confianza entre el cliente y el intermediario."}, {"q": "Según la guía de ética de AMV, ¿cuál es la relación entre ética y ley?", "o": ["No son lo mismo: se puede actuar con poca ética sin violar la ley, pero quien infringe la ley actúa a la vez de forma ilegal y poco ética", "Son exactamente lo mismo", "Todo lo legal es ético por definición", "La ética solo aplica fuera del trabajo"], "e": "La ética es un proceso interno y reflexivo antes de actuar. Una conducta puede ser antisocial o poco ética sin ser ilegal."}, {"q": "¿Cuál es la pregunta básica que propone la guía de AMV ante un dilema ético?", "o": ["¿Lo que voy a hacer es honesto, franco, transparente y justo?", "¿Lo que voy a hacer es rentable?", "¿Alguien me está observando?", "¿Lo hacen los demás en el mercado?"], "e": "La prueba resume cuatro principios básicos. Si una acción falla en alguno, no debe hacerse."}, {"q": "Una persona encuentra un celular en el bus y se lo queda sin buscar a su dueño. Según la guía, ¿qué principio NO se cumple porque no intentó averiguar a quién pertenecía?", "o": ["Franqueza", "Rentabilidad", "Diversificación", "Liquidez"], "e": "La acción no es franca porque no buscó al dueño. Tampoco es honesta (el aparato no es suyo), ni transparente (no podría explicarla) ni justa (priva al propietario)."}, {"q": "En el supermercado no le cobran un producto. Según la guía, quedarse con él sin decir nada:", "o": ["No es justo, porque genera un perjuicio al establecimiento o incluso al cajero que se equivocó", "Es ético porque fue un error ajeno", "Es ético si nadie lo nota", "Es ético porque es una suma pequeña"], "e": "La guía aplica la prueba de lo honesto, franco, transparente y justo, y concluye que lo que parecía una lotería es algo que no se debe hacer."}, {"q": "Una 'buena prueba' adicional que sugiere la guía para evaluar si una conducta es correcta es preguntarse:", "o": ["¿Cómo reaccionarían mi familia u otras personas si se enteraran de lo que hice?", "¿Cuánto voy a ganar?", "¿Qué tan rápido puedo hacerlo?", "¿Me pueden descubrir?"], "e": "Tener presentes las normas sociales es un buen punto de partida para verificar que nuestros valores concuerdan con lo esperado."}, {"q": "Según la guía, el argumento de que ignorar la ética trae más beneficio que seguirla falla porque:", "o": ["Ignora que el resultado probable es la sanción social o incluso penal, que supera cualquier beneficio económico", "Siempre es cierto en el corto plazo", "La ética no tiene consecuencias", "Solo aplica a personas jurídicas"], "e": "Actuar solo en beneficio propio puede parecer defendible por un tiempo, pero el daño personal y social es mayor."}, {"q": "¿Existe un estándar ético más flexible para la vida laboral que para la personal?", "o": ["No: si algo está mal, está mal en cualquier esfera, aunque nadie esté vigilando", "Sí, en los negocios priman los resultados", "Sí, en el trabajo solo aplica la ley", "Depende de las metas comerciales"], "e": "La guía rechaza la idea de que la ética en los negocios sea más flexible que en la vida privada."}, {"q": "Según la guía de AMV, ¿cuál es el orden de prelación de intereses en los servicios financieros?", "o": ["Primero el cliente, luego la entidad y por último el interés personal", "Primero la entidad, luego el cliente y luego el personal", "Primero el interés personal, luego el cliente", "Todos los intereses tienen el mismo peso"], "e": "La regulación busca proteger al cliente incluso por encima de los intereses de la entidad y de sus integrantes."}, {"q": "Según la guía, la información de los clientes puede revelarse cuando:", "o": ["Está relacionada con actividades ilegales y una autoridad la requiere, la regulación exige divulgarla o el cliente lo autoriza expresamente", "Un colega la pide por curiosidad", "La pide un competidor", "El profesional cambia de empleo"], "e": "El deber de confidencialidad cubre a clientes actuales, anteriores y potenciales, con esas tres excepciones."}, {"q": "¿Por qué la venta de productos financieros exige estándares éticos más altos que la venta de un carro?", "o": ["Porque el desempeño del producto financiero se conoce con el tiempo y el cliente depende de la información que le da el vendedor", "Porque los productos financieros siempre ganan", "Porque los carros no tienen garantía", "Porque los vendedores financieros no cobran comisión"], "e": "Un carro se puede ver y probar. Un producto financiero no, por lo que la asimetría de información es mayor."}, {"q": "Un vendedor ético de un producto financiero, según la guía, debe explicarle al cliente:", "o": ["Los riesgos y la estructura del producto, si el rendimiento es real o estimado, que él recibe una comisión y los costos adicionales", "Solo el rendimiento ofrecido", "Que la oferta vence hoy y debe decidir ya", "Que nadie más ha preguntado eso"], "e": "Además debe asegurarse de que el cliente quiere el producto de forma voluntaria."}, {"q": "¿Cuál de estas frases es una señal de un vendedor con falencias éticas, según la guía?", "o": ["'Es una oportunidad limitada, debe decidir ahora mismo'", "'Le explico cómo se calcula el rendimiento'", "'Yo recibo una comisión si usted compra'", "'Estos son los costos de salida'"], "e": "Otras señales son 'nadie más me ha preguntado eso' o 'yo tampoco entiendo, pero en la firma hay expertos'."}, {"q": "Según la guía, la actitud propositiva esperada de un profesional del sector financiero incluye:", "o": ["Denunciar los actos incorrectos de otras personas por los canales institucionales", "Ignorar las faltas ajenas si no lo afectan", "Cumplir solo lo que el supervisor revisa", "Priorizar las metas comerciales"], "e": "Se espera reprochar y denunciar conductas antiéticas, por ejemplo mediante la línea ética, las áreas de cumplimiento o incluso ante AMV."}, {"q": "¿Qué diferencia hay entre un código de ética y un código de conducta?", "o": ["El de ética fija principios y valores generales; el de conducta detalla reglas concretas, procedimientos, canales de denuncia y sanciones", "Son lo mismo", "El de conducta solo aplica a los directivos", "El de ética es obligatorio por ley y el de conducta no existe"], "e": "Hoy las entidades suelen tener códigos de ética y conducta que combinan ambos enfoques."}, {"q": "Según el Decreto 2555 de 2010, el código de ética o conducta de las entidades debe incluir, entre otros:", "o": ["Procedimientos para manejar conflictos de interés, mecanismos contra el uso de información privilegiada, órganos de monitoreo y consecuencias por incumplir", "Las metas de ventas del año", "Los salarios de los empleados", "La lista de clientes más rentables"], "e": "Son los rasgos principales de las reglas de conducta que exige el Decreto 2555."}, {"q": "¿Quién establece los principios, políticas y procedimientos sobre conflictos de interés en un intermediario?", "o": ["La junta directiva u órgano equivalente", "Cada operador según su criterio", "Los clientes", "El revisor fiscal"], "e": "El Reglamento de AMV asigna esa responsabilidad a la junta directiva. Además, las áreas con potencial conflicto deben estar separadas física y operacionalmente."}, {"q": "En la comparación entre el marco ético y el marco de cumplimiento, ¿qué verbos son típicos del marco de cumplimiento?", "o": ["Abstenerse, evitar, informar, revelar, no acceder", "Promover, fomentar, valorar, orientar", "Invertir, vender, comprar", "Recomendar, persuadir, cerrar"], "e": "El marco ético usa verbos aspiracionales como promover o fomentar. El de cumplimiento usa verbos de obligación concreta."}, {"q": "El marco ético, a diferencia del marco de cumplimiento, se caracteriza por:", "o": ["Principios generales, valores y normas aspiracionales", "Reglas detalladas de obligatorio cumplimiento", "Procedimientos de denuncia y sanción", "Listas de conductas prohibidas"], "e": "El marco de cumplimiento aterriza esos principios en deberes, procedimientos e instancias concretas."}, {"q": "Según la guía, el profesional del sistema financiero debe actuar éticamente:", "o": ["Por convicción, buscando el mejor estándar, y no solo porque las normas son obligatorias o un supervisor lo pide", "Solo cuando lo vigilan", "Solo si la norma lo exige expresamente", "Solo frente a clientes grandes"], "e": "Ante situaciones que las normas no contemplan, se espera buen criterio y prudencia."}, {"q": "¿Qué evaluación de ética exige el Chartered Institute for Securities & Investment (CISI) a sus miembros?", "o": ["Integrity Matters", "El examen de certificación de AMV", "La prueba CFA nivel III", "El SARLAFT"], "e": "La guía la cita como ejemplo de normas profesionales que complementan las reglamentarias."}, {"q": "¿Cuál de estas actividades recomienda IOSCO, según la guía, para fortalecer la ética en las entidades financieras?", "o": ["Crear una cultura ética, formar a todo el personal, tener modelos para resolver dilemas y canales para denunciar", "Eliminar los códigos de conducta", "Pagar solo por volumen de ventas", "Reservar la ética para la alta dirección"], "e": "También recomienda revisar y actualizar el código cuando sea necesario."}, {"q": "Los usos y costumbres de un área, como guía de conducta:", "o": ["Pueden ser un precedente peligroso, porque cambian y no siempre representan el actuar adecuado", "Siempre prevalecen sobre las políticas", "Son la única fuente válida de ética", "Reemplazan al código de conducta"], "e": "La guía advierte que una práctica habitual en el mercado no la hace ética."}, {"q": "Ante una decisión dudosa, la guía recomienda:", "o": ["Adoptar un enfoque reflexivo y consultar con colegas confiables, embajadores de ética o el área de cumplimiento", "Actuar rápido para no perder la oportunidad", "Decidir solo con base en la meta comercial", "No consultar a nadie para mantener la reserva"], "e": "Precipitarse sin pensar puede llevar a arrepentimientos. Consultar lleva a decisiones más prudentes."}, {"q": "Caso 'Las formas en los negocios': durante la pandemia, un cliente autoriza por teléfono a la asesora para que firme por él documentos que la política exige firmar físicamente. ¿Qué debe hacer?", "o": ["No firmar por el cliente y ofrecerle un mecanismo seguro para que él firme físicamente, como mensajería especializada", "Firmar por él, porque la autorización fue verbal y clara", "Celebrar la operación y pedir la firma después de la pandemia", "Aceptar la firma digital aunque la política exija firma física"], "e": "El enfoque óptimo es adherirse a las políticas internas, que buscan asegurar que el cliente entiende la operación y la autoriza libremente."}, {"q": "En el caso 'Las formas en los negocios', ¿por qué tampoco es ético aceptar la firma digital del cliente?", "o": ["Porque la política exige firma física para ese producto por su complejidad y materialidad, y hay un compromiso con el supervisor", "Porque la firma digital es ilegal en Colombia", "Porque el cliente no tiene computador", "Porque la firma digital cuesta más"], "e": "La firma tenía un compromiso con la Superintendencia de reforzar los controles de firmas. Saltarse la política expone a la asesora y a la entidad."}, {"q": "Caso 'La información de los clientes, un tesoro a proteger': a un comercial le ofrecen un gran cargo en otra entidad con la condición de llevarse los clientes que atiende. ¿Qué debe hacer?", "o": ["Explicar al nuevo empleador, de forma directa, que no puede llevarse los clientes porque pertenecen a la entidad anterior", "Llevarse todos los clientes porque no hay una prohibición expresa", "Llevarse solo los clientes que él consiguió", "Llevarse solo los más rentables"], "e": "Los clientes son de la entidad, no del comercial, y contactarlos con información de la firma anterior viola la protección de datos."}, {"q": "En el caso del comercial que cambia de empleo, el hecho de que el código de ética de su entidad no mencione expresamente el tema:", "o": ["No hace ético llevarse los clientes", "Lo autoriza a llevarse los clientes", "Lo autoriza a llevarse solo el 70 % de los clientes", "Obliga a la entidad a cederle los clientes"], "e": "La ausencia de una regla expresa no convierte en correcta una práctica que la ética y las normas de protección de la información reprochan."}, {"q": "Caso 'Reconociendo un buen servicio': un cliente antiguo con una enfermedad terminal quiere regalarle a su asesora 50 millones de pesos en efectivo. ¿Cuál es la opción recomendada?", "o": ["Rechazar el regalo, informar al área de ética e invitar al cliente a evaluar el servicio por los canales de la entidad", "Aceptarlo sin decir nada, porque es un regalo personal", "Aceptarlo porque la política permite regalos", "Aceptarlo y repartirlo con el equipo"], "e": "El monto es alto, es en efectivo, el juicio del cliente puede estar afectado y la entidad ya remunera el buen servicio."}, {"q": "En el caso del regalo de 50 millones, ¿por qué no basta con que la política de la entidad permita regalos que no afecten la objetividad?", "o": ["Porque el monto, el efectivo y la condición del cliente pueden comprometer la objetividad e independencia, y la entidad ya premia el buen servicio", "Porque los regalos siempre están prohibidos por ley", "Porque el cliente es una persona jurídica", "Porque los regalos solo se aceptan si son de proveedores"], "e": "Antes de aceptar cualquier regalo relevante, debe ponerse en conocimiento del área responsable de ética."}, {"q": "Según el artículo 7.6.1.1.3 del Decreto 2555, el principio de transparencia del mercado se cumple cuando:", "o": ["Hay una apropiada formación de precios y toma de decisiones en igualdad de condiciones, con información accesible, oportuna, completa y clara", "Los operadores publican sus salarios", "Todas las operaciones son en efectivo", "Solo participan inversionistas profesionales"], "e": "Los principios orientadores son transparencia, confidencialidad y reserva, uso adecuado de información, lealtad, profesionalismo y respeto de la ley."}, {"q": "Según el Decreto 2555, el principio de lealtad implica, entre otros:", "o": ["Abstenerse de decidir ante un conflicto, de dar información ficticia o inexacta y de participar en operaciones no representativas del mercado", "Preferir siempre a los clientes más antiguos", "Guardar silencio ante cualquier autoridad", "Recomendar solo productos propios"], "e": "La lealtad es obrar de manera íntegra, franca, fiel y objetiva frente a todos los que intervienen en el mercado."}, {"q": "El principio de profesionalismo del Decreto 2555 exige que el intermediario:", "o": ["Con base en información seria, completa y objetiva, oriente y aconseje al cliente según sus necesidades para la mejor ejecución del encargo", "Tenga título de posgrado", "Cobre la tarifa más alta del mercado", "Opere siempre con la posición propia"], "e": "El profesionalismo se refiere al consejo idóneo para la mejor ejecución."}, {"q": "El principio de respeto de la ley destaca, en particular, la importancia de:", "o": ["Cumplir los deberes de información y comunicar al cliente cualquier circunstancia que pudiera modificar su voluntad contractual", "Pagar los impuestos de los clientes", "Publicar las operaciones en redes sociales", "Seguir las costumbres del mercado"], "e": "Es uno de los principios orientadores del artículo 7.6.1.1.3 del Decreto 2555."}, {"q": "Además de las situaciones clásicas, la guía de ética señala que hay conflicto de interés cuando se debe escoger entre:", "o": ["La utilidad del fondo que se administra y la de otro cliente, de la propia entidad o del profesional", "Dos productos igual de convenientes para el cliente", "Dos horarios de trabajo", "Dos sistemas de negociación con las mismas tarifas"], "e": "Las cuatro situaciones son: utilidad propia frente a la del cliente, la de un vinculado frente a la del cliente, la del fondo administrado frente a otros, y la de una operación frente a la transparencia del mercado."}, {"q": "Una persona que tiene varios roles dentro de una entidad:", "o": ["No está por eso en conflicto de interés; el conflicto surge cuando debe tomar una decisión en la que no puede favorecer objetivamente todos los intereses", "Siempre está en conflicto de interés", "Debe renunciar a uno de los roles", "Debe informarlo a AMV cada mes"], "e": "La existencia de conflictos es inherente a cualquier persona. Lo reprochable es decidir estando en esa situación."}, {"q": "Una empleada de compras debe elegir un proveedor y uno de los oferentes es su esposo. ¿Qué debe hacer?", "o": ["Revelar la situación y abstenerse de participar en la decisión, dejando que otra persona decida", "Elegir a su esposo si ofrece buen precio", "Descalificar a su esposo sin decir nada", "Decidir ella misma para mantener la reserva"], "e": "Además, quien tiene un posible conflicto no debe acceder a más información ni entregar información adicional que pueda influir en la decisión."}, {"q": "Desde que toma conciencia de un posible conflicto de interés, el profesional debe, además de revelarlo:", "o": ["No acceder a más información ni entregar información adicional, para no influir en quien decide", "Acelerar la operación", "Consultar al cliente afectado y ejecutar", "Destruir la información que tenga"], "e": "La revelación se hace al área encargada (gestión humana, cumplimiento o auditoría) y otra persona decide."}, {"q": "Según la guía de ética, una información es de carácter público cuando:", "o": ["Está disponible y es de fácil acceso para cualquier persona por distintos canales", "La conoce todo el equipo de la mesa", "Fue discutida en la junta directiva", "La conoce el cliente principal"], "e": "Puede haber sido divulgada voluntariamente, por orden de una autoridad o incluso filtrada. Aun así, debe usarse con seriedad y verificando su veracidad."}, {"q": "Si una información pública se conoció como consecuencia de un incumplimiento de una norma o política, la guía recomienda:", "o": ["Evitar difundirla o reenviarla", "Publicarla de inmediato", "Usarla para operar", "Venderla a terceros"], "e": "El uso ético de la información pública incluye considerar el impacto de replicarla."}, {"q": "Ante la duda sobre el tipo de información a la que se tiene acceso, la guía recomienda:", "o": ["Darle tratamiento de información confidencial y privilegiada", "Tratarla como pública", "Compartirla con colegas para consultar", "Ignorarla"], "e": "Ejemp
