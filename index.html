], "e": "V = (A − P) / N = (80.400 − 400) millones / 5.000.000 = COP 16.000,00."}, {"q": "Un FIC tiene activos por COP 9.900 millones, pasivos por COP 300 millones y 800.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 12.000,00", "COP 12.375,00", "COP 12.750,00", "COP 10.800,00"], "e": "V = (A − P) / N = (9.900 − 300) millones / 800.000 = COP 12.000,00."}, {"q": "Un inversionista aporta COP 20.000.000 a un FIC cuando la unidad vale COP 12.500. Al redimir, la unidad vale COP 13.250. ¿Cuánto recibe (sin retención) y qué rentabilidad obtuvo?", "o": ["COP 21.200.000 y 6,00 %", "COP 20.000.750 y 6,00 %", "COP 21.200.000 y 5,66 %", "COP 20.000.000 y 0,00 %"], "e": "Unidades = 20.000.000 / 12.500 = 1.600,00. Valor final = 1.600,00 × 13.250 = COP 21.200.000. Rentabilidad = 13.250/12.500 − 1 = 6,00 %."}, {"q": "Un inversionista aporta COP 8.000.000 a un FIC cuando la unidad vale COP 16.000. Al redimir, la unidad vale COP 15.680. ¿Cuánto recibe (sin retención) y qué rentabilidad obtuvo?", "o": ["COP 7.840.000 y -2,00 %", "COP 7.999.680 y -2,00 %", "COP 7.840.000 y -2,04 %", "COP 8.000.000 y 0,00 %"], "e": "Unidades = 8.000.000 / 16.000 = 500,00. Valor final = 500,00 × 15.680 = COP 7.840.000. Rentabilidad = 15.680/16.000 − 1 = -2,00 %."}, {"q": "Un inversionista aporta COP 50.000.000 a un FIC cuando la unidad vale COP 25.000. Al redimir, la unidad vale COP 26.500. ¿Cuánto recibe (sin retención) y qué rentabilidad obtuvo?", "o": ["COP 53.000.000 y 6,00 %", "COP 50.001.500 y 6,00 %", "COP 53.000.000 y 5,66 %", "COP 50.000.000 y 0,00 %"], "e": "Unidades = 50.000.000 / 25.000 = 2.000,00. Valor final = 2.000,00 × 26.500 = COP 53.000.000. Rentabilidad = 26.500/25.000 − 1 = 6,00 %."}, {"q": "Un FIC tiene un patrimonio de COP 20.000 millones y 1.000.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 20.000", "COP 2.000", "COP 200.000", "COP 50"], "e": "Valor de la unidad = patrimonio / unidades = COP 20.000.000.000 / 1.000.000 = COP 20.000."}, {"q": "Un FIC tiene un patrimonio de COP 8.000 millones y 1.000.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 8.000", "COP 800", "COP 80.000", "COP 125"], "e": "Valor de la unidad = patrimonio / unidades = COP 8.000.000.000 / 1.000.000 = COP 8.000."}, {"q": "Un FIC tiene un patrimonio de COP 8.000 millones y 500.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 16.000", "COP 1.600", "COP 160.000", "COP 62"], "e": "Valor de la unidad = patrimonio / unidades = COP 8.000.000.000 / 500.000 = COP 16.000."}, {"q": "Un FIC tiene un patrimonio de COP 8.000 millones y 2.000.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 4.000", "COP 400", "COP 40.000", "COP 250"], "e": "Valor de la unidad = patrimonio / unidades = COP 8.000.000.000 / 2.000.000 = COP 4.000."}, {"q": "Un FIC tiene un patrimonio de COP 5.000 millones y 2.000.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 2.500", "COP 250", "COP 25.000", "COP 400"], "e": "Valor de la unidad = patrimonio / unidades = COP 5.000.000.000 / 2.000.000 = COP 2.500."}, {"q": "Un inversionista aporta COP 10.000.000 a un FIC cuya unidad vale COP 20.000. ¿Cuántas unidades recibe?", "o": ["500,00 unidades", "5000,00 unidades", "2000,00 unidades", "50,00 unidades"], "e": "Unidades = aporte / valor de la unidad = COP 10.000.000 / COP 20.000 = 500,00."}, {"q": "Un inversionista aporta COP 5.000.000 a un FIC cuya unidad vale COP 15.000. ¿Cuántas unidades recibe?", "o": ["333,33 unidades", "3333,33 unidades", "3000,00 unidades", "33,33 unidades"], "e": "Unidades = aporte / valor de la unidad = COP 5.000.000 / COP 15.000 = 333,33."}, {"q": "Un inversionista aporta COP 3.000.000 a un FIC cuya unidad vale COP 12.000. ¿Cuántas unidades recibe?", "o": ["250,00 unidades", "2500,00 unidades", "4000,00 unidades", "25,00 unidades"], "e": "Unidades = aporte / valor de la unidad = COP 3.000.000 / COP 12.000 = 250,00."}, {"q": "Un inversionista aporta COP 2.000.000 a un FIC cuya unidad vale COP 10.500. ¿Cuántas unidades recibe?", "o": ["190,48 unidades", "1904,76 unidades", "5250,00 unidades", "19,05 unidades"], "e": "Unidades = aporte / valor de la unidad = COP 2.000.000 / COP 10.500 = 190,48."}, {"q": "Un inversionista aporta COP 10.000.000 a un FIC cuya unidad vale COP 12.500. ¿Cuántas unidades recibe?", "o": ["800,00 unidades", "8000,00 unidades", "1250,00 unidades", "80,00 unidades"], "e": "Unidades = aporte / valor de la unidad = COP 10.000.000 / COP 12.500 = 800,00."}, {"q": "El valor de la unidad de un FIC pasó de COP 12.000 a COP 12.960 en un año. ¿Cuál fue la rentabilidad del fondo, neta de comisiones?", "o": ["8,0 %", "-8,0 %", "96,0 %", "7,4 %"], "e": "Rentabilidad = (valor final − valor inicial) / valor inicial = (COP 12.960 − COP 12.000) / COP 12.000 = 8,0 %. Como el valor de la unidad ya descuenta comisiones, es una rentabilidad neta."}, {"q": "El valor de la unidad de un FIC pasó de COP 12.000 a COP 12.600 en un año. ¿Cuál fue la rentabilidad del fondo, neta de comisiones?", "o": ["5,0 %", "-5,0 %", "60,0 %", "4,8 %"], "e": "Rentabilidad = (valor final − valor inicial) / valor inicial = (COP 12.600 − COP 12.000) / COP 12.000 = 5,0 %. Como el valor de la unidad ya descuenta comisiones, es una rentabilidad neta."}, {"q": "El valor de la unidad de un FIC pasó de COP 10.000 a COP 11.000 en un año. ¿Cuál fue la rentabilidad del fondo, neta de comisiones?", "o": ["10,0 %", "-10,0 %", "120,0 %", "9,1 %"], "e": "Rentabilidad = (valor final − valor inicial) / valor inicial = (COP 11.000 − COP 10.000) / COP 10.000 = 10,0 %. Como el valor de la unidad ya descuenta comisiones, es una rentabilidad neta."}, {"q": "El valor de la unidad de un FIC pasó de COP 10.000 a COP 10.300 en un año. ¿Cuál fue la rentabilidad del fondo, neta de comisiones?", "o": ["3,0 %", "-3,0 %", "36,0 %", "2,9 %"], "e": "Rentabilidad = (valor final − valor inicial) / valor inicial = (COP 10.300 − COP 10.000) / COP 10.000 = 3,0 %. Como el valor de la unidad ya descuenta comisiones, es una rentabilidad neta."}, {"q": "El valor de la unidad de un FIC pasó de COP 15.000 a COP 14.700 en un año. ¿Cuál fue la rentabilidad del fondo, neta de comisiones?", "o": ["-2,0 %", "2,0 %", "-24,0 %", "-1,0 %"], "e": "Rentabilidad = (valor final − valor inicial) / valor inicial = (COP 14.700 − COP 15.000) / COP 15.000 = -2,0 %. Como el valor de la unidad ya descuenta comisiones, es una rentabilidad neta."}], "mat": [{"q": "Se invierten COP 10.000.000 al 12 % efectivo anual durante 3 años. ¿Cuál es el valor final?", "o": ["COP 14.049.280", "COP 13.600.000", "COP 13.200.000", "COP 14.400.000"], "e": "VF = VP × (1 + i)^n = 10.000.000 × 1,12^3 = 14.049.280. COP 13.600.000 sería el resultado con interés simple."}, {"q": "¿Cuánto hay que invertir hoy al 10 % efectivo anual para tener COP 5.000.000 dentro de 2 años?", "o": ["COP 4.132.231", "COP 4.000.000", "COP 4.545.455", "COP 4.166.667"], "e": "VP = VF / (1 + i)^n = 5.000.000 / 1,10^2 = 5.000.000 / 1,21 = 4.132.231."}, {"q": "¿Cuál es la tasa efectiva anual equivalente a una tasa del 12 % nominal mes vencido?", "o": ["12,68 %", "12,00 %", "12,55 %", "13,12 %"], "e": "Tasa mensual = 12 % / 12 = 1 %. EA = (1,01)^12 − 1 = 12,68 %."}, {"q": "¿Cuál es la tasa nominal mes vencido equivalente a una tasa del 10 % efectivo anual?", "o": ["9,57 % NMV", "10,00 % NMV", "10,47 % NMV", "8,33 % NMV"], "e": "Tasa mensual = (1,10)^(1/12) − 1 = 0,7974 %. Nominal = 0,7974 % × 12 = 9,57 % NMV."}, {"q": "¿Cuál es la tasa efectiva anual equivalente a un 12 % nominal trimestre anticipado?", "o": ["12,96 %", "12,55 %", "12,00 %", "13,42 %"], "e": "Tasa trimestral anticipada = 3 %. Vencida = 0,03 / (1 − 0,03) = 3,0928 %. EA = (1,030928)^4 − 1 = 12,96 %."}, {"q": "Un préstamo de COP 1.000.000 al 1 % mensual de interés simple durante 6 meses genera un valor final de:", "o": ["COP 1.060.000", "COP 1.061.520", "COP 1.010.000", "COP 1.120.000"], "e": "Con interés simple, los intereses se calculan siempre sobre el capital inicial: 1.000.000 × 0,01 × 6 = 60.000. Valor final = 1.060.000."}, {"q": "Un bono cero cupón tiene valor nominal de COP 1.000.000 y vence en 2 años. Si la TIR es 8 % efectiva anual, ¿cuál es su precio?", "o": ["COP 857.339", "COP 840.000", "COP 925.926", "COP 862.069"], "e": "Precio = 1.000.000 / 1,08^2 = 1.000.000 / 1,1664 = 857.339."}, {"q": "Un bono paga un cupón anual del 10 % y su TIR de mercado también es 10 %. Su precio será:", "o": ["Igual al valor nominal (a la par)", "Mayor que el valor nominal (con prima)", "Menor que el valor nominal (con descuento)", "Cero"], "e": "Cuando la tasa cupón es igual a la TIR, el bono se negocia a la par. Si la TIR es mayor que el cupón, se negocia con descuento, y si es menor, con prima."}, {"q": "Un bono de valor nominal 100 paga un cupón anual del 8 % y vence en 3 años. Si la TIR es 10 % efectiva anual, su precio es aproximadamente:", "o": ["95,03", "100,00", "104,97", "92,00"], "e": "Precio = 8/1,1 + 8/1,1^2 + 108/1,1^3 = 7,27 + 6,61 + 81,14 = 95,03. Se negocia con descuento porque la TIR es mayor que el cupón."}, {"q": "Una acción se compra en COP 10.000, paga un dividendo de COP 500 y se vende al año en COP 11.000. ¿Cuál fue la rentabilidad total?", "o": ["15 %", "10 %", "5 %", "16,7 %"], "e": "Rentabilidad = (precio final − precio inicial + dividendos) / precio inicial = (11.000 − 10.000 + 500) / 10.000 = 15 %."}, {"q": "Una inversión renta el 10 % nominal y la inflación del período fue 4 %. ¿Cuál es la tasa real?", "o": ["5,77 %", "6,00 %", "14,40 %", "4,00 %"], "e": "Tasa real = (1 + nominal) / (1 + inflación) − 1 = 1,10 / 1,04 − 1 = 5,77 %. Restar directamente (10 % − 4 %) es solo una aproximación."}, {"q": "Un CDT paga IPC + 3 % efectivo anual. Si el IPC es 5 %, ¿cuál es la tasa efectiva anual total?", "o": ["8,15 %", "8,00 %", "15,00 %", "7,85 %"], "e": "Las tasas se componen: (1 + IPC) × (1 + spread) − 1 = 1,05 × 1,03 − 1 = 8,15 %."}, {"q": "¿Cuál es el valor presente de 12 pagos mensuales vencidos de COP 100.000, descontados al 1 % mensual?", "o": ["COP 1.125.508", "COP 1.200.000", "COP 1.068.000", "COP 1.188.000"], "e": "VP de una anualidad = C × [1 − (1 + i)^−n] / i = 100.000 × [1 − 1,01^−12] / 0,01 = 1.125.508."}, {"q": "¿Aproximadamente cuántos años se requieren para duplicar una inversión al 12 % efectivo anual?", "o": ["6,1 años", "8,3 años", "5,0 años", "12 años"], "e": "n = ln(2) / ln(1,12) = 0,6931 / 0,1133 = 6,12 años. La regla del 72 da una aproximación: 72 / 12 = 6."}, {"q": "¿Cuál es la tasa efectiva semestral equivalente a un 21 % efectivo anual?", "o": ["10,0 %", "10,5 %", "11,0 %", "9,5 %"], "e": "Tasa semestral = (1,21)^(1/2) − 1 = 1,10 − 1 = 10 %."}, {"q": "¿Cuál es la tasa efectiva anual equivalente a un 18 % nominal semestre vencido?", "o": ["18,81 %", "18,00 %", "19,25 %", "17,50 %"], "e": "Tasa semestral = 18 % / 2 = 9 %. EA = (1,09)^2 − 1 = 18,81 %."}, {"q": "Se invierten COP 2.000.000 al 1,5 % mensual compuesto durante 12 meses. ¿Cuál es el valor final?", "o": ["COP 2.391.236", "COP 2.360.000", "COP 2.030.000", "COP 2.400.000"], "e": "VF = 2.000.000 × 1,015^12 = 2.391.236. COP 2.360.000 sería el resultado con interés simple."}, {"q": "¿Cuál es la tasa efectiva trimestral equivalente a un 12 % efectivo anual?", "o": ["2,87 %", "3,00 %", "4,00 %", "2,50 %"], "e": "Tasa trimestral = (1,12)^(1/4) − 1 = 2,87 %. Dividir 12 % entre 4 (3 %) solo es válido para tasas nominales."}, {"q": "¿Cuál es la tasa nominal trimestre vencido equivalente a un 12 % efectivo anual?", "o": ["11,49 % NTV", "12,00 % NTV", "12,55 % NTV", "10,80 % NTV"], "e": "Tasa trimestral = (1,12)^(1/4) − 1 = 2,874 %. Nominal = 2,874 % × 4 = 11,49 % NTV."}, {"q": "¿Cuál es la tasa efectiva anual equivalente a un 10 % nominal semestre anticipado?", "o": ["10,80 %", "10,25 %", "10,00 %", "11,11 %"], "e": "Tasa semestral anticipada = 5 %. Vencida = 0,05 / 0,95 = 5,263 %. EA = (1,05263)^2 − 1 = 10,80 %."}, {"q": "Una tasa anticipada siempre es, frente a su equivalente vencida del mismo período:", "o": ["Menor", "Mayor", "Igual", "Negativa"], "e": "Como los intereses anticipados se cobran al inicio, una tasa anticipada equivale a una tasa vencida más alta: iv = ia / (1 − ia). Por eso la anticipada es menor que su equivalente vencida."}, {"q": "Un CDT de COP 5.000.000 a 90 días paga una tasa del 9 % nominal anual con interés simple, base 360. ¿Cuánto recibe el inversionista al vencimiento, antes de impuestos?", "o": ["COP 5.112.500", "COP 5.450.000", "COP 5.110.959", "COP 5.225.000"], "e": "Intereses = 5.000.000 × 0,09 × 90/360 = 112.500. Total = 5.112.500."}, {"q": "Se ahorran COP 100.000 al final de cada mes durante 12 meses al 1 % mensual. ¿Cuánto se acumula al final?", "o": ["COP 1.268.250", "COP 1.200.000", "COP 1.125.508", "COP 1.212.000"], "e": "VF de una anualidad = C × [(1 + i)^n − 1] / i = 100.000 × [1,01^12 − 1] / 0,01 = 1.268.250."}, {"q": "Un crédito de COP 3.000.000 se paga en 12 cuotas mensuales iguales al 2 % mensual. ¿Cuál es la cuota?", "o": ["COP 283.679", "COP 250.000", "COP 310.000", "COP 260.000"], "e": "Cuota = VP × i / [1 − (1 + i)^−n] = 3.000.000 × 0,02 / [1 − 1,02^−12] = 283.679."}, {"q": "Un bono de valor nominal COP 1.000 paga un cupón anual del 5 % y vence en 2 años. Con una TIR del 6 % efectiva anual, su precio es aproximadamente:", "o": ["COP 981,67", "COP 1.000,00", "COP 1.018,59", "COP 943,40"], "e": "Precio = 50/1,06 + 1.050/1,06^2 = 47,17 + 934,50 = 981,67. Está bajo la par porque la TIR supera al cupón."}, {"q": "Una acción se compró en COP 10.000 y dos años después vale COP 11.500, sin dividendos. ¿Cuál fue la rentabilidad efectiva anual?", "o": ["7,24 %", "7,50 %", "15,00 %", "6,98 %"], "e": "Rentabilidad EA = (11.500 / 10.000)^(1/2) − 1 = 7,24 %. Dividir el 15 % entre dos años ignora la capitalización."}, {"q": "Si un bono se compra con prima (por encima del valor nominal), su TIR es:", "o": ["Menor que la tasa cupón", "Mayor que la tasa cupón", "Igual a la tasa cupón", "Igual a cero"], "e": "Pagar más que el nominal reduce el rendimiento: la TIR queda por debajo del cupón."}, {"q": "¿Qué es la tasa interna de retorno (TIR) de una inversión?", "o": ["La tasa de descuento que hace que el valor presente de los flujos sea igual a la inversión inicial", "La tasa de interés que fija el Banco de la República", "La tasa cupón de un bono", "La inflación esperada"], "e": "La TIR iguala el valor presente neto a cero. En bonos, es el rendimiento que obtiene quien compra al precio dado y conserva el título hasta el vencimiento."}, {"q": "Un proyecto requiere una inversión de 1.000 y genera 1.100 en un año. Si la tasa de descuento es 8 %, el valor presente neto es aproximadamente:", "o": ["18,5", "100,0", "1.018,5", "−18,5"], "e": "VPN = 1.100 / 1,08 − 1.000 = 1.018,52 − 1.000 = 18,52. Como es positivo, el proyecto rinde más que la tasa exigida."}, {"q": "Un título paga UVR + 3 % y se espera una variación de la UVR de 5 %. ¿Cuál es la rentabilidad efectiva anual esperada en pesos?", "o": ["8,15 %", "8,00 %", "15,00 %", "2,00 %"], "e": "Las tasas se componen: (1,05) × (1,03) − 1 = 8,15 %. La UVR sigue la inflación."}, {"q": "Una inversión rindió 15 % nominal en un año con inflación de 5 %. ¿Cuál fue la rentabilidad real?", "o": ["9,52 %", "10,00 %", "20,75 %", "3,00 %"], "e": "Tasa real = 1,15 / 1,05 − 1 = 9,52 %."}, {"q": "¿Cuál es la tasa efectiva semestral equivalente a un 8 % efectivo anual?", "o": ["3,92 %", "4,00 %", "4,16 %", "3,85 %"], "e": "Tasa semestral = (1,08)^(1/2) − 1 = 3,92 %."}, {"q": "Se tienen COP 1.000.000 al 1,25 % mensual compuesto durante 2 años. ¿Cuál es el valor final?", "o": ["COP 1.347.351", "COP 1.300.000", "COP 1.160.755", "COP 1.320.000"], "e": "VF = 1.000.000 × 1,0125^24 = 1.347.351. Con interés simple serían 1.300.000."}, {"q": "¿Cuál es la diferencia entre interés simple e interés compuesto?", "o": ["En el compuesto, los intereses se suman al capital y generan nuevos intereses", "En el simple, los intereses se capitalizan cada período", "No hay diferencia", "El compuesto solo aplica a créditos de vivienda"], "e": "Con interés compuesto se capitalizan los intereses, por eso el valor crece de forma exponencial."}, {"q": "Una tasa nominal es:", "o": ["Una tasa anual que se divide entre el número de períodos de capitalización", "La tasa que realmente se obtiene en un año", "La tasa descontada la inflación", "La tasa de los TES siempre"], "e": "La tasa nominal expresa la tasa periódica en términos anuales. La efectiva anual refleja la capitalización."}, {"q": "Si una tasa nominal se capitaliza más veces al año, su tasa efectiva anual:", "o": ["Aumenta", "Disminuye", "No cambia", "Se vuelve negativa"], "e": "Más capitalizaciones implican más intereses sobre intereses, por lo que la efectiva crece."}, {"q": "¿Qué significa que una tasa sea vencida?", "o": ["Que los intereses se pagan al final del período", "Que los intereses se pagan al inicio del período", "Que la tasa ya no está vigente", "Que es una tasa negativa"], "e": "En la tasa vencida los intereses se liquidan al final del período. En la anticipada, al inicio."}, {"q": "¿Cuál es la fórmula para convertir una tasa periódica anticipada (ia) a vencida (iv)?", "o": ["iv = ia / (1 − ia)", "iv = ia / (1 + ia)", "iv = ia × (1 − ia)", "iv = 1 − ia"], "e": "Como los intereses se descuentan al inicio, se paga ia sobre un capital efectivo de (1 − ia)."}, {"q": "¿Cuál es la fórmula para convertir una tasa periódica vencida (iv) a anticipada (ia)?", "o": ["ia = iv / (1 + iv)", "ia = iv / (1 − iv)", "ia = iv × (1 + iv)", "ia = 1 + iv"], "e": "Es la inversa de la anterior: ia = iv / (1 + iv)."}, {"q": "La regla del 72 se usa para estimar:", "o": ["El tiempo aproximado que tarda una inversión en duplicarse", "La TIR de un bono", "El VaR de un portafolio", "La inflación del año"], "e": "Años para duplicar ≈ 72 / tasa en porcentaje. Por ejemplo, al 8 % tarda unos 9 años."}, {"q": "El valor presente neto (VPN) de un proyecto es positivo cuando:", "o": ["La rentabilidad del proyecto supera la tasa de descuento usada", "La inversión es mayor que los flujos", "La TIR es menor que la tasa de descuento", "No hay flujos futuros"], "e": "Un VPN positivo indica que el proyecto crea valor a la tasa exigida, lo que equivale a una TIR mayor que esa tasa."}, {"q": "Una anualidad vencida es una serie de pagos:", "o": ["Iguales, periódicos, que se hacen al final de cada período", "Que se hacen todos al inicio", "De montos distintos cada período", "Que se pagan una sola vez"], "e": "Las anualidades vencidas son la base del cálculo de cuotas de créditos y del ahorro programado."}, {"q": "En la calculadora financiera, para hallar el valor futuro de una inversión única se usan las variables:", "o": ["N, I/YR, PV y se calcula FV", "PMT y N únicamente", "Solo FV", "IRR y NPV"], "e": "Se ingresan el número de períodos (N), la tasa por período (I/YR) y el valor presente (PV, con signo negativo), y se calcula FV."}, {"q": "Según Mankiw, ¿cuáles son las funciones del dinero?", "o": ["Medio de cambio, unidad de cuenta, depósito de valor y liquidez", "Ahorro, inversión, crédito y consumo", "Emisión, circulación, reserva y destrucción", "Medio de pago, garantía, colateral y cobertura"], "e": "De ellas, la de depósito de valor es la más relacionada con el valor del dinero en el tiempo."}, {"q": "¿Qué tres conceptos explican que un peso hoy no valga lo mismo que un peso dentro de un año?", "o": ["La inflación, el costo de oportunidad y el riesgo", "La oferta, la demanda y el precio", "La liquidez, la solvencia y la rentabilidad", "El encaje, la tasa de usura y la TRM"], "e": "Su interacción origina la tasa de interés: el precio del dinero en el tiempo."}, {"q": "Según el CFA Institute, la tasa de interés puede entenderse como:", "o": ["Tasa de retorno, tasa de descuento y costo de oportunidad", "Tasa nominal, efectiva y real", "Tasa activa, pasiva y de usura", "Tasa fija, variable e indexada"], "e": "Las tres hacen referencia a una tasa expresada en porcentaje."}, {"q": "¿Cuáles son los dos elementos fundamentales de toda tasa de interés?", "o": ["La unidad de moneda (capital base) y la unidad de tiempo (periodo de medición)", "El emisor y el inversionista", "La inflación y la devaluación", "El plazo y la garantía"], "e": "Una tasa sin periodo no se puede interpretar ni comparar."}, {"q": "Si la demanda de crédito supera los recursos captados por los bancos, el IBR tiende a:", "o": ["Subir", "Bajar", "Quedarse igual", "Volverse negativo"], "e": "El IBR refleja la oferta y demanda de dinero en el mercado interbancario."}, {"q": "Según la guía de AMV, ¿cuáles son los componentes de la tasa de interés total?", "o": ["Interés real, inflación, riesgo de crédito, riesgo de liquidez y riesgo de vencimiento", "Tasa de usura, DTF, IBR y spread", "Cupón, prima, descuento y comisión", "Tasa nominal, periódica, efectiva y anticipada"], "e": "Se combinan de forma compuesta: (1 + ir)(1 + if)(1 + ip)(1 + il)(1 + iv) − 1."}, {"q": "¿Quién formalizó el concepto de tasa de interés en 1930?", "o": ["Irving Fisher", "John Maynard Keynes", "Harry Markowitz", "Adam Smith"], "e": "Su obra 'The Theory of Interest' es la base de la relación entre tasa nominal, real e inflación."}, {"q": "En un diagrama de flujo de caja, las flechas hacia abajo representan:", "o": ["Salidas de dinero (egresos), como la inversión inicial o los pagos de una deuda", "Entradas de dinero", "Intereses capitalizados", "La tasa de interés"], "e": "Las flechas hacia arriba son entradas: intereses, dividendos o devolución del capital."}, {"q": "Según la guía, hay interés simple cuando:", "o": ["Los intereses se causan y se pagan en el mismo periodo, de modo que el capital permanece constante", "Los intereses se suman al capital cada periodo", "La tasa es anticipada", "No se pagan intereses"], "e": "En el interés compuesto los intereses no se pagan sino que se capitalizan: se gana interés sobre interés."}, {"q": "La tasa nominal se caracteriza porque:", "o": ["Es una tasa anual de referencia que no incluye la capitalización de intereses", "Refleja el costo real de un crédito", "Siempre es mayor que la efectiva", "Solo se usa en créditos de vivienda"], "e": "La efectiva sí incluye la capitalización; por eso es la que se usa para comparar."}, {"q": "Para comparar ofertas de crédito expresadas en tasas diferentes, lo correcto es:", "o": ["Convertirlas todas a su tasa efectiva anual equivalente", "Comparar las tasas nominales directamente", "Escoger la de menor número", "Sumar las tasas periódicas"], "e": "Solo las tasas de la misma naturaleza (tiempo y forma) se pueden comparar."}, {"q": "Las tasas anticipadas son frecuentes en operaciones de:", "o": ["Factoring y redescuento, donde se descuentan los intereses al inicio", "Cuentas de ahorro", "Acciones ordinarias", "Fondos de pensiones"], "e": "El banco descuenta los intereses por anticipado y entrega el monto neto."}, {"q": "La expresión 'trimestre anticipado' (TA) en una tasa como DTF + 2 % TA se refiere a:", "o": ["Una tasa nominal anual con capitalización trimestral anticipada", "Una tasa efectiva por exactamente 90 días", "Una tasa efectiva anual", "Una tasa mensual"], "e": "No significa necesariamente un periodo exacto de 90 días."}, {"q": "Una tasa efectiva y un spread también efectivo (por ejemplo IPC + 4 %) se combinan:", "o": ["De forma compuesta: (1 + IPC)(1 + spread) − 1", "Sumándolos directamente", "Restándolos", "Promediándolos"], "e": "Dos tasas efectivas no se pueden sumar aritméticamente."}, {"q": "Dos tasas nominales en la misma modalidad (por ejemplo DTF TA + spread TA) se combinan:", "o": ["Sumándolas directamente", "Multiplicando (1 + DTF)(1 + spread)", "Convirtiendo primero el spread a efectivo", "Restando el spread"], "e": "Por eso DTF + 2 % TA da una tasa nominal TA, que luego se convierte a efectiva."}, {"q": "Un spread de IPC + 150 pb equivale a:", "o": ["IPC + 1,5 %", "IPC + 15 %", "IPC + 0,15 %", "IPC + 150 %"], "e": "Un punto básico es 0,01 %."}, {"q": "¿Cuáles son las etapas del proceso de decisión en proyectos de inversión?", "o": ["Identificación, formulación y evaluación, selección, ejecución, y monitoreo y retroalimentación", "Identificación, medición, control y monitoreo", "Emisión, colocación, negociación y redención", "Ahorro, inversión, consumo y retiro"], "e": "En la formulación y evaluación se usan el VPN, la TIR y el periodo de recuperación."}, {"q": "Si el VPN de un proyecto es cero, significa que:", "o": ["El proyecto renta exactamente la tasa exigida; se puede aceptar porque es indiferente", "El proyecto pierde dinero", "La TIR es cero", "No se recupera la inversión"], "e": "VPN ≥ 0: se acepta. VPN < 0: se rechaza."}, {"q": "La TIR de un préstamo representa:", "o": ["El costo financiero real de ese préstamo", "La tasa de usura", "La tasa nominal pactada", "La inflación esperada"], "e": "En una inversión, la TIR es la rentabilidad efectiva esperada."}, {"q": "¿Qué supuesto, poco realista, hace la TIR tradicional?", "o": ["Que los flujos positivos se reinvierten a la misma TIR durante toda la vida del proyecto", "Que no hay inflación", "Que la tasa de descuento es cero", "Que todos los flujos son iguales"], "e": "La TIR modificada (TIRM) corrige esto usando una tasa de reinversión y una de financiamiento realistas."}, {"q": "La TIR modificada (TIRM) se calcula como:", "o": ["(VF de los flujos positivos a la tasa de reinversión / VP de los flujos negativos a la tasa de financiamiento)^(1/n) − 1", "VPN / inversión inicial", "La TIR menos la inflación", "El promedio de la TIR y la tasa de descuento"], "e": "En hoja de cálculo: TIRM(valores; tasa_financiamiento; tasa_reinversión)."}, {"q": "Frente a la TIR, la TIRM se considera:", "o": ["Una medida más conservadora y precisa de la rentabilidad", "Siempre mayor que la TIR", "Una medida que ignora la reinversión", "Igual a la TIR en todos los casos"], "e": "Cuando la TIR es muy alta, suponer reinversión a esa tasa sobreestima la rentabilidad."}, {"q": "¿Cómo se estima la TIR sin calculadora financiera?", "o": ["Por tanteo e interpolación entre una tasa que da VPN positivo y otra que da VPN negativo", "Con una fórmula algebraica directa", "Dividiendo la utilidad por la inversión", "Restando la inflación a la tasa nominal"], "e": "No existe una fórmula directa para despejar la TIR."}, {"q": "Al usar la calculadora financiera para hallar la TIR, si en un periodo no hay flujo de caja se debe:", "o": ["Ingresar cero en ese periodo", "Omitir el periodo", "Repetir el flujo anterior", "Ingresar el promedio de los flujos"], "e": "Si se omite, la calculadora no tiene en cuenta ese periodo y el resultado es incorrecto."}, {"q": "Si un proyecto tiene flujos mensuales y trimestrales, para calcular la TIR o el VPN se debe trabajar con:", "o": ["La menor periodicidad (flujo neto mensual)", "La mayor periodicidad (trimestral)", "Periodicidad anual", "Cualquiera, da igual"], "e": "Además, varios flujos de un mismo periodo se netean, y los ingresos y egresos llevan signos opuestos."}, {"q": "En una hoja de cálculo, ¿qué función convierte una tasa nominal en efectiva anual?", "o": ["INT.EFECTIVO(tasa_nominal; n_por_año)", "TASA.NOMINAL(tasa_efectiva; n_por_año)", "VNA(tasa; flujos)", "TIR(valores)"], "e": "TASA.NOMINAL hace la conversión inversa. VA y VF calculan valores presente y futuro; VNA, el VPN; TIR, la tasa interna de retorno."}, {"q": "Para usar la función VNA en hoja de cálculo, la tasa debe ser:", "o": ["Efectiva y de la misma periodicidad de los flujos", "Nominal anual", "Anticipada", "Siempre anual"], "e": "Si los flujos son semestrales, la tasa debe ser efectiva semestral."}, {"q": "¿Quién calcula y publica el IPC en Colombia y con qué frecuencia?", "o": ["El DANE, mensualmente (habitualmente el quinto día hábil)", "El Banco de la República, diariamente", "La SFC, semanalmente", "El Ministerio de Hacienda, anualmente"], "e": "Base: diciembre de 2018 = 100. Precios recolectados en 38 ciudades."}, {"q": "La canasta del IPC actual proviene de la Encuesta Nacional de Presupuestos de los Hogares 2016-2017 y tiene:", "o": ["443 artículos agrupados en 12 divisiones de gasto", "100 artículos en 5 divisiones", "1.000 artículos en 20 divisiones", "55 artículos en 3 divisiones"], "e": "Se consultan más de 55.000 fuentes de precios."}, {"q": "¿Qué ley creó formalmente la UVR y a quién le asignó su cálculo?", "o": ["La Ley 546 de 1999, al Banco de la República", "La Ley 964 de 2005, a la SFC", "La Ley 51 de 1990, al DANE", "La Ley 100 de 1993, al Ministerio de Hacienda"], "e": "La UVR se usa sobre todo en créditos de vivienda para preservar el valor real del dinero prestado."}, {"q": "La UVR se actualiza:", "o": ["Diariamente, con la variación del IPC del mes calendario anterior", "Mensualmente, con la DTF", "Semanalmente, con el IBR", "Anualmente, con el salario mínimo"], "e": "El periodo de cálculo va del día 16 de un mes al 15 del siguiente."}, {"q": "¿Qué diferencia hay entre un título indexado al IPC y un título denominado en UVR?", "o": ["En el indexado al IPC solo varían los cupones; en el UVR se ajustan tanto los intereses como el capital", "No hay diferencia", "En el UVR solo varía el capital", "El indexado al IPC no paga intereses"], "e": "Los TES UVR (clase B, Ley 51 de 1990) se liquidan en pesos con la UVR vigente en la fecha de pago."}, {"q": "Los títulos hipotecarios TIPS se originan en:", "o": ["Cartera hipotecaria de entidades bancarias", "Cartera de consumo", "Deuda pública", "Acciones de constructoras"], "e": "Los TIS también son de cartera hipotecaria, pero originada por entidades no bancarias."}, {"q": "¿Quién calcula y publica diariamente el IBR?", "o": ["El Banco de la República, con las cotizaciones de los bancos participantes", "El DANE", "La Bolsa de Valores de Colombia", "Asobancaria, sin intervención del emisor"], "e": "Se creó en 2008 por iniciativa privada con respaldo del Ministerio de Hacienda y la SFC."}, {"q": "¿En qué plazos se calcula el IBR?", "o": ["Overnight, 1, 3, 6 y 12 meses", "30, 60 y 90 días", "Solo overnight", "1, 2, 5 y 10 años"], "e": "Se calcula con la mediana de las cotizaciones de los bancos participantes (actualmente ocho)."}, {"q": "El IBR a 1, 3, 6 y 12 meses se forma a partir de:", "o": ["Operaciones de Overnight Index Swaps (OIS), compensadas en la CRCC sin entrega de capital", "Créditos interbancarios con entrega de fondos", "Subastas de TES", "Promedios de CDT a 90 días"], "e": "El IBR overnight sí se forma con créditos interbancarios con entrega real de fondos."}, {"q": "¿Cuál es el propósito principal del IBR?", "o": ["Mejorar la transmisión de la política monetaria y servir de referencia para derivados de tasa", "Medir la inflación", "Fijar la tasa de usura", "Calcular la TRM"], "e": "Refleja el costo del dinero en el mercado interbancario de corto plazo."}, {"q": "La DTF se calcula como:", "o": ["El promedio ponderado de las tasas de captación de los CDT a 90 días, con vigencia semanal", "La mediana de cotizaciones interbancarias, diaria", "El promedio simple de las tasas de crédito, mensual", "La tasa de intervención del Banco de la República"], "e": "Incluye bancos, corporaciones financieras y compañías de financiamiento."}, {"q": "¿En qué modalidad se expresa la DTF?", "o": ["Nominal anual trimestre anticipado", "Efectiva anual", "Nominal mes vencido", "Semestre vencido"], "e": "Por eso el spread sobre la DTF también se expresa en TA y se suma directamente."}, {"q": "¿Cuál NO es una característica de una anualidad?", "o": ["Los pagos pueden tener valores distintos", "Todos los pagos son iguales", "Los pagos se hacen a intervalos iguales", "A todos los pagos se les aplica la misma tasa"], "e": "Además, el número de pagos es igual al número de periodos."}, {"q": "En una anualidad vencida, el primer pago se realiza:", "o": ["Un periodo después de la fecha de negociación (periodo cero)", "En el periodo cero", "Al final del plazo", "Después de varios periodos de gracia"], "e": "Cuando el primer pago empieza después de varios periodos, es una anualidad diferida."}, {"q": "Una anualidad diferida es aquella en que:", "o": ["El primer pago empieza después de transcurrir cierto número de periodos", "Los pagos se hacen al inicio de cada periodo", "Los pagos crecen cada periodo", "No hay tasa de interés"], "e": "Se halla el VP de la anualidad un periodo antes del primer pago y luego se trae a cero como flujo único."}, {"q": "Una tasa se compone de interés real 2,0 %, inflación 5,0 %, riesgo de crédito 0,0 %, riesgo de liquidez 0,0 % y riesgo de vencimiento 1,0 %, todos EA. ¿Cuál es la tasa total EA?", "o": ["8,17 %", "8,00 %", "9,17 %", "7,00 %"], "e": "Las tasas efectivas se combinan de forma compuesta: (1+0,020)(1+0,050)(1+0,000)(1+0,000)(1+0,010) − 1 = 8,17 %. Sumarlas daría 8,00 %, que es incorrecto."}, {"q": "Una tasa se compone de interés real 1,5 %, inflación 4,0 %, riesgo de crédito 2,0 %, riesgo de liquidez 1,0 % y riesgo de vencimiento 0,5 %, todos EA. ¿Cuál es la tasa total EA?", "o": ["9,29 %", "9,00 %", "10,29 %", "5,50 %"], "e": "Las tasas efectivas se combinan de forma compuesta: (1+0,015)(1+0,040)(1+0,020)(1+0,010)(1+0,005) − 1 = 9,29 %. Sumarlas daría 9,00 %, que es incorrecto."}, {"q": "Una tasa se compone de interés real 1,0 %, inflación 6,0 %, riesgo de crédito 3,0 %, riesgo de liquidez 0,0 % y riesgo de vencimiento 1,0 %, todos EA. ¿Cuál es la tasa total EA?", "o": ["11,37 %", "11,00 %", "12,37 %", "7,00 %"], "e": "Las tasas efectivas se combinan de forma compuesta: (1+0,010)(1+0,060)(1+0,030)(1+0,000)(1+0,010) − 1 = 11,37 %. Sumarlas daría 11,00 %, que es incorrecto."}, {"q": "Se invierten COP 10.000.000 al 0,80 % mes vencido durante 12 meses y el inversionista retira cada mes los intereses (no se capitalizan). ¿Cuánto recibe en total entre capital e intereses?", "o": ["COP 10.960.000", "COP 11.003.387", "COP 960.000", "COP 11.040.000"], "e": "Interés simple: COP 10.000.000 × 0,80 % × 12 = COP 960.000 de intereses; total COP 10.960.000. Si se reinvirtieran, el total sería COP 11.003.387."}, {"q": "Se invierten COP 10.000.000 al 0,80 % mes vencido durante 12 meses y los intereses se reinvierten a la misma tasa. ¿Cuánto interés total se gana?", "o": ["COP 1.003.387", "COP 960.000", "COP 11.003.387", "COP 903.048"], "e": "VF = COP 10.000.000 × (1 + 0,0080)^12 = COP 11.003.387; intereses = COP 1.003.387. La reinversión genera interés sobre interés."}, {"q": "Se invierten COP 50.000.000 al 1,00 % mes vencido durante 6 meses y el inversionista retira cada mes los intereses (no se capitalizan). ¿Cuánto recibe en total entre capital e intereses?", "o": ["COP 53.000.000", "COP 53.076.008", "COP 3.000.000", "COP 53.500.000"], "e": "Interés simple: COP 50.000.000 × 1,00 % × 6 = COP 3.000.000 de intereses; total COP 53.000.000. Si se reinvirtieran, el total sería COP 53.076.008."}, {"q": "Se invierten COP 50.000.000 al 1,00 % mes vencido durante 6 meses y los intereses se reinvierten a la misma tasa. ¿Cuánto interés total se gana?", "o": ["COP 3.076.008", "COP 3.000.000", "COP 53.076.008", "COP 2.768.407"], "e": "VF = COP 50.000.000 × (1 + 0,0100)^6 = COP 53.076.008; intereses = COP 3.076.008. La reinversión genera interés sobre interés."}, {"q": "Se invierten COP 30.000.000 al 0,60 % mes vencido durante 24 meses y el inversionista retira cada mes los intereses (no se capitalizan). ¿Cuánto recibe en total entre capital e intereses?", "o": ["COP 34.320.000", "COP 34.631.619", "COP 4.320.000", "COP 34.500.000"], "e": "Interés simple: COP 30.000.000 × 0,60 % × 24 = COP 4.320.000 de intereses; total COP 34.320.000. Si se reinvirtieran, el total sería COP 34.631.619."}, {"q": "Se invierten COP 30.000.000 al 0,60 % mes vencido durante 24 meses y los intereses se reinvierten a la misma tasa. ¿Cuánto interés total se gana?", "o": ["COP 4.631.619", "COP 4.320.000", "COP 34.631.619", "COP 4.168.457"], "e": "VF = COP 30.000.000 × (1 + 0,0060)^24 = COP 34.631.619; intereses = COP 4.631.619. La reinversión genera interés sobre interés."}, {"q": "Una inversión ofrece 8,0 % nominal anual trimestre vencido, con base 360 y reinversión de intereses. ¿Cuál es la tasa efectiva anual?", "o": ["8,243 %", "8,000 %", "10,408 %", "2,000 %"], "e": "Tasa periódica = 8,0 % / 4 = 2,000 % cada 90 días; EA = (1 + 0,0200)^(360/90) − 1 = 8,243 %."}, {"q": "Una inversión ofrece 10,0 % nominal anual semestre vencido, con base 360 y reinversión de intereses. ¿Cuál es la tasa efectiva anual?", "o": ["10,250 %", "10,000 %", "15,763 %", "5,000 %"], "e": "Tasa periódica = 10,0 % / 2 = 5,000 % cada 180 días; EA = (1 + 0,0500)^(360/180) − 1 = 10,250 %."}, {"q": "Una inversión ofrece 9,0 % nominal anual mes vencido, con base 360 y reinversión de intereses. ¿Cuál es la tasa efectiva anual?", "o": ["9,381 %", "9,000 %", "10,201 %", "0,750 %"], "e": "Tasa periódica = 9,0 % / 12 = 0,750 % cada 30 días; EA = (1 + 0,0075)^(360/30) − 1 = 9,381 %."}, {"q": "Una inversión ofrece 12,0 % nominal anual trimestre vencido, con base 360 y reinversión de intereses. ¿Cuál es la tasa efectiva anual?", "o": ["12,551 %", "12,000 %", "15,927 %", "3,000 %"], "e": "Tasa periódica = 12,0 % / 4 = 3,000 % cada 90 días; EA = (1 + 0,0300)^(360/90) − 1 = 12,551 %."}, {"q": "Una inversión ofrece 7,0 % nominal anual mes vencido, con base 360 y reinversión de intereses. ¿Cuál es la tasa efectiva anual?", "o": ["7,229 %", "7,000 %", "7,855 %", "0,583 %"], "e": "Tasa periódica = 7,0 % / 12 = 0,583 % cada 30 días; EA = (1 + 0,0058)^(360/30) − 1 = 7,229 %."}, {"q": "Una inversión ofrece 15,0 % nominal anual semestre vencido, con base 360 y reinversión de intereses. ¿Cuál es la tasa efectiva anual?", "o": ["15,562 %", "15,000 %", "24,230 %", "7,500 %"], "e": "Tasa periódica = 15,0 % / 2 = 7,500 % cada 180 días; EA = (1 + 0,0750)^(360/180) − 1 = 15,562 %."}, {"q": "Una inversión ofrece 8,0 % nominal anual trimestre anticipado, base 360. ¿Cuál es su tasa efectiva anual?", "o": ["8,417 %", "8,243 %", "8,000 %", "8,163 %"], "e": "Periódica anticipada = 2,000 %; vencida = ia / (1 − ia) = 2,0408 %; EA = (1 + 0,02041)^4 − 1 = 8,417 %."}, {"q": "Una inversión ofrece 10,0 % nominal anual trimestre anticipado, base 360. ¿Cuál es su tasa efectiva anual?", "o": ["10,658 %", "10,381 %", "10,000 %", "10,256 %"], "e": "Periódica anticipada = 2,500 %; vencida = ia / (1 − ia) = 2,5641 %; EA = (1 + 0,02564)^4 − 1 = 10,658 %."}, {"q": "Una inversión ofrece 12,0 % nominal anual mes anticipado, base 360. ¿Cuál es su tasa efectiva anual?", "o": ["12,818 %", "12,683 %", "12,000 %", "12,121 %"], "e": "Periódica anticipada = 1,000 %; vencida = ia / (1 − ia) = 1,0101 %; EA = (1 + 0,01010)^12 − 1 = 12,818 %."}, {"q": "Una inversión ofrece 9,0 % nominal anual semestre anticipado, base 360. ¿Cuál es su tasa efectiva anual?", "o": ["9,646 %", "9,202 %", "9,000 %", "9,424 %"], "e": "Periódica anticipada = 4,500 %; vencida = ia / (1 − ia) = 4,7120 %; EA = (1 + 0,04712)^2 − 1 = 9,646 %."}, {"q": "¿Cuál es la tasa nominal anual semestre vencido (NASV) equivalente a 6,09 % EA, base 360?", "o": ["6,000 %", "6,090 %", "3,045 %", "6,180 %"], "e": "Periódica = (1 + 0,0609)^(1/2) − 1 = 3,0000 %; nominal = 3,0000 % × 2 = 6,000 %."}, {"q": "¿Cuál es la tasa nominal anual trimestre vencido (NATV) equivalente a 8,24 % EA, base 360?", "o": ["7,997 %", "8,240 %", "2,060 %", "8,237 %"], "e": "Periódica = (1 + 0,0824)^(1/4) − 1 = 1,9992 %; nominal = 1,9992 % × 4 = 7,997 %."}, {"q": "¿Cuál es la tasa nominal anual mes vencido (NAMV) equivalente a 10,47 % EA, base 360?", "o": ["9,999 %", "10,470 %", "0,873 %", "10,299 %"], "e": "Periódica = (1 + 0,1047)^(1/12) − 1 = 0,8332 %; nominal = 0,8332 % × 12 = 9,999 %."}, {"q": "Una empresa recibe tres ofertas: A, 1,8 % mensual; B, 24 % nominal semestre vencido; C, 24 % EA. ¿Cuál es la más barata?", "o": ["A, con 23,87 % EA", "B, con 25,44 % EA", "C, con 24 % EA", "Son iguales"], "e": "A: 1,018^12 − 1 = 23,87 % EA. B: 12 % semestral → 1,12² − 1 = 25,44 % EA. C: 24 % EA. Gana la menor efectiva: A."}, {"q": "¿Cuál es la tasa efectiva anual de un crédito al 2 % mensual?", "o": ["26,82 %", "24,00 %", "26,00 %", "22,42 %"], "e": "1,02^12 − 1 = 26,82 %. El 24 % sería la nominal (2 % × 12)."}, {"q": "Una compañía descuenta en factoring una factura de COP 80.000.000 que vence en un trimestre, al 2,5 % trimestre anticipado. ¿Cuánto recibe hoy y cuál es la tasa trimestral vencida real?", "o": ["COP 78.000.000 y 2,56 %", "COP 78.000.000 y 2,50 %", "COP 78.048.780 y 2,50 %", "COP 80.000.000 y 2,56 %"], "e": "Intereses anticipados = COP 80.000.000 × 2,5 % = COP 2.000.000; recibe COP 78.000.000. Tasa vencida = 0,025 / (1 − 0,025) = 2,56 %."}, {"q": "Una compañía descuenta en factoring una factura de COP 30.000.000 que vence en un trimestre, al 3,0 % trimestre anticipado. ¿Cuánto recibe hoy y cuál es la tasa trimestral vencida real?", "o": ["COP 29.100.000 y 3,09 %", "COP 29.100.000 y 3,00 %", "COP 29.126.214 y 3,00 %", "COP 30.000.000 y 3,09 %"], "e": "Intereses anticipados = COP 30.000.000 × 3,0 % = COP 900.000; recibe COP 29.100.000. Tasa vencida = 0,030 / (1 − 0,030) = 3,09 %."}, {"q": "Una compañía descuenta en factoring una factura de COP 120.000.000 que vence en un trimestre, al 1,8 % trimestre anticipado. ¿Cuánto recibe hoy y cuál es la tasa trimestral vencida real?", "o": ["COP 117.840.000 y 1,83 %", "COP 117.840.000 y 1,80 %", "COP 117.878.193 y 1,80 %", "COP 120.000.000 y 1,83 %"], "e": "Intereses anticipados = COP 120.000.000 × 1,8 % = COP 2.160.000; recibe COP 117.840.000. Tasa vencida = 0,018 / (1 − 0,018) = 1,83 %."}, {"q": "Una empresa necesita COP 150.000.000 dentro de 6 meses y puede invertir hoy al 9,0 % EA. ¿Cuánto debe depositar hoy?", "o": ["COP 143.673.943", "COP 137.614.679", "COP 143.280.279", "COP 143.250.000"], "e": "Tasa mensual = (1 + 0,09)^(1/12) − 1 = 0,7207 %; VP = COP 150.000.000 / (1 + 0,007207)^6 = COP 143.673.943. También: VF / (1 + EA)^(6/12)."}, {"q": "Una empresa necesita COP 80.000.000 dentro de 9 meses y puede invertir hoy al 10,0 % EA. ¿Cuánto debe depositar hoy?", "o": ["COP 74.480.996", "COP 72.727.273", "COP 74.168.305", "COP 74.000.000"], "e": "Tasa mensual = (1 + 0,10)^(1/12) − 1 = 0,7974 %; VP = COP 80.000.000 / (1 + 0,007974)^9 = COP 74.480.996. También: VF / (1 + EA)^(9/12)."}, {"q": "Una empresa necesita COP 200.000.000 dentro de 4 meses y puede invertir hoy al 8,0 % EA. ¿Cuánto debe depositar hoy?", "o": ["COP 194.934.516", "COP 185.185.185", "COP 194.559.630", "COP 194.666.667"], "e": "Tasa mensual = (1 + 0,08)^(1/12) − 1 = 0,6434 %; VP = COP 200.000.000 / (1 + 0,006434)^4 = COP 194.934.516. También: VF / (1 + EA)^(4/12)."}, {"q": "Se invierten COP 250.000.000 en un CDT al 1,1 % mensual durante 5 meses. ¿Cuál es el valor final?", "o": ["COP 264.055.846", "COP 263.750.000", "COP 261.182.835", "COP 263.254.631"], "e": "VF = COP 250.000.000 × (1 + 0,011)^5 = COP 264.055.846."}, {"q": "Se invierten COP 40.000.000 en un CDT al 0,9 % mensual durante 7 meses. ¿Cuál es el valor final?", "o": ["COP 42.589.070", "COP 42.520.000", "COP 42.209.187", "COP 42.466.016"], "e": "VF = COP 40.000.000 × (1 + 0,009)^7 = COP 42.589.070."}, {"q": "Un título se compra al 98,5 % de su nominal y se recibirán 100,0 % dentro de 90 días. ¿Cuál es la TIR efectiva anual (base 365)?", "o": ["6,32 %", "6,18 %", "6,23 %", "1,52 %"], "e": "TIR = (100,0 / 98,5)^(365/90) − 1 = 6,32 %. Multiplicar la rentabilidad del periodo por 365/90 da una tasa nominal, no efectiva."}, {"q": "Un título se compra al 101,3 % de su nominal y se recibirán 103,9 % dentro de 75 días. ¿Cuál es la TIR efectiva anual (base 365)?", "o": ["13,13 %", "12,49 %", "12,94 %", "2,57 %"], "e": "TIR = (103,9 / 101,3)^(365/75) − 1 = 13,13 %. Multiplicar la rentabilidad del periodo por 365/75 da una tasa nominal, no efectiva."}, {"q": "Un título se compra al 95,8 % de su nominal y se recibirán 100,0 % dentro de 300 días. ¿Cuál es la TIR efectiva anual (base 365)?", "o": ["5,36 %", "5,33 %", "5,28 %", "4,38 %"], "e": "TIR = (100,0 / 95,8)^(365/300) − 1 = 5,36 %. Multiplicar la rentabilidad del periodo por 365/300 da una tasa nominal, no efectiva."}, {"q": "Un título se compra al 99,2 % de su nominal y se recibirán 101,0 % dentro de 45 días. ¿Cuál es la TIR efectiva anual (base 365)?", "o": ["15,70 %", "14,72 %", "15,47 %", "1,81 %"], "e": "TIR = (101,0 / 99,2)^(365/45) − 1 = 15,70 %. Multiplicar la rentabilidad del periodo por 365/45 da una tasa nominal, no efectiva."}, {"q": "A un CDT de nominal COP 100.000.000 con tasa facial 11,0 % EA (paga capital e intereses al vencimiento, un año) le quedan 200 días. Si se negocia a una rentabilidad de 10,5 % EA (base 365), ¿cuál es su precio?", "o": ["COP 105.090.347", "COP 94.675.988", "COP 100.452.489", "COP 105.066.101"], "e": "Al vencimiento recibirá COP 111.000.000. Precio = COP 111.000.000 / (1 + 0,105)^(200/365) = COP 105.090.347."}, {"q": "A un CDT de nominal COP 50.000.000 con tasa facial 9,5 % EA (paga capital e intereses al vencimiento, un año) le quedan 120 días. Si se negocia a una rentabilidad de 10,0 % EA (base 365), ¿cuál es su precio?", "o": ["COP 53.061.017", "COP 48.457.550", "COP 49.772.727", "COP 53.060.302"], "e": "Al vencimiento recibirá COP 54.750.000. Precio = COP 54.750.000 / (1 + 0,100)^(120/365) = COP 53.061.017."}, {"q": "A un CDT de nominal COP 200.000.000 con tasa facial 12,0 % EA (paga capital e intereses al vencimiento, un año) le quedan 300 días. Si se negocia a una rentabilidad de 11,5 % EA (base 365), ¿cuál es su precio?", "o": ["COP 204.829.244", "COP 182.883.254", "COP 200.896.861", "COP 204.860.476"], "e": "Al vencimiento recibirá COP 224.000.000. Precio = COP 224.000.000 / (1 + 0,115)^(300/365) = COP 204.829.244."}, {"q": "Un título paga IPC + 3,5 % EA. Si el IPC de los últimos 12 meses es 5,2 %, ¿cuál es la tasa efectiva anual?", "o": ["8,882 %", "8,700 %", "1,643 %", "9,082 %"], "e": "(1 + 0,052)(1 + 0,035) − 1 = 8,882 %."}, {"q": "Un título paga IPC + 4,0 % EA. Si el IPC de los últimos 12 meses es 4,5 %, ¿cuál es la tasa efectiva anual?", "o": ["8,680 %" : ["12,965 %", "12,400 %", "13,100 %", "13,130 %"], "e": "IBR a EA: (1 + 0,0900/12)^12 − 1 = 9,3807 %; a nominal SV: 9,1704 %; + spread = 12,5704 %; EA = (1 + 0,12570/2)^2 − 1 = 12,965 %."}, {"q": "Un crédito cuesta IBR + 5,0 % TV. Si el IBR es 8,75 % nominal mes vencido, ¿cuál es la tasa EA del crédito?", "o": ["14,546 %", "13,750 %", "14,565 %", "14,651 %"], "e": "IBR a EA: (1 + 0,0875/12)^12 − 1 = 9,1096 %; a nominal TV: 8,8140 %; + spread = 13,8140 %; EA = (1 + 0,13814/4)^4 − 1 = 14,546 %."}, {"q": "Un crédito cuesta IBR + 3,0 % SV. Si el IBR es 10,00 % nominal mes vencido, ¿cuál es la tasa EA del crédito?", "o": ["13,647 %", "13,000 %", "13,785 %", "13,803 %"], "e": "IBR a EA: (1 + 0,1000/12)^12 − 1 = 10,4713 %; a nominal SV: 10,2107 %; + spread = 13,2107 %; EA = (1 + 0,13211/2)^2 − 1 = 13,647 %."}, {"q": "Un papel comercial paga IBR + 4,5 % (ambos nominales mes vencido), con IBR de 8,6 %. Si los intereses se pagan trimestre vencido, ¿cuál es la tasa trimestral para liquidarlos?", "o": ["3,3109 %", "3,2750 %", "13,9159 %", "1,0917 %"], "e": "Nominal MV = 13,1 %; mensual = 1,0917 %; EA = 13,9159 %; trimestral = (1 + 0,010917)^3 − 1 = 3,3109 %."}, {"q": "Un papel comercial paga IBR + 3,0 % (ambos nominales mes vencido), con IBR de 9,2 %. Si los intereses se pagan trimestre vencido, ¿cuál es la tasa trimestral para liquidarlos?", "o": ["3,0811 %", "3,0500 %", "12,9058 %", "1,0167 %"], "e": "Nominal MV = 12,2 %; mensual = 1,0167 %; EA = 12,9058 %; trimestral = (1 + 0,010167)^3 − 1 = 3,0811 %."}, {"q": "Un préstamo de COP 30.000.000 se paga en 24 cuotas mensuales iguales a una tasa de 20 % EA. ¿Cuál es la cuota?", "o": ["COP 1.503.112", "COP 1.250.000", "COP 1.526.874", "COP 1.500.000"], "e": "Tasa mensual = (1 + 0,20)^(1/12) − 1 = 1,5309 %; A = VP × i / (1 − (1 + i)^−n) = COP 1.503.112. Usar 20 %/12 como tasa mensual es un error común."}, {"q": "Un préstamo de COP 15.000.000 se paga en 12 cuotas mensuales iguales a una tasa de 18 % EA. ¿Cuál es la cuota?", "o": ["COP 1.365.696", "COP 1.250.000", "COP 1.375.200", "COP 1.475.000"], "e": "Tasa mensual = (1 + 0,18)^(1/12) − 1 = 1,3888 %; A = VP × i / (1 − (1 + i)^−n) = COP 1.365.696. Usar 18 %/12 como tasa mensual es un error común."}, {"q": "Un préstamo de COP 50.000.000 se paga en 36 cuotas mensuales iguales a una tasa de 15 % EA. ¿Cuál es la cuota?", "o": ["COP 1.710.288", "COP 1.388.889", "COP 1.733.266", "COP 1.597.222"], "e": "Tasa mensual = (1 + 0,15)^(1/12) − 1 = 1,1715 %; A = VP × i / (1 − (1 + i)^−n) = COP 1.710.288. Usar 15 %/12 como tasa mensual es un error común."}, {"q": "Se depositan COP 500.000 al final de cada mes durante 12 meses en un fondo que paga 1,0 % mensual. ¿Cuánto se acumula al final?", "o": ["COP 6.341.252", "COP 6.000.000", "COP 6.404.664", "COP 5.627.539"], "e": "VF = A × ((1 + i)^n − 1) / i = COP 6.341.252. COP 6.404.664 sería si los depósitos fueran al inicio de cada mes."}, {"q": "Se depositan COP 2.000.000 al final de cada mes durante 24 meses en un fondo que paga 1,2 % mensual. ¿Cuánto se acumula al final?", "o": ["COP 55.245.467", "COP 48.000.000", "COP 55.908.413", "COP 41.491.998"], "e": "VF = A × ((1 + i)^n − 1) / i = COP 55.245.467. COP 55.908.413 sería si los depósitos fueran al inicio de cada mes."}, {"q": "Se depositan COP 800.000 al final de cada mes durante 36 meses en un fondo que paga 0,8 % mensual. ¿Cuánto se acumula al final?", "o": ["COP 33.222.984", "COP 28.800.000", "COP 33.488.768", "COP 24.937.877"], "e": "VF = A × ((1 + i)^n − 1) / i = COP 33.222.984. COP 33.488.768 sería si los depósitos fueran al inicio de cada mes."}, {"q": "Para reunir COP 20.000.000 en 12 meses con depósitos iguales al final de cada mes en un fondo que rinde 1,30 % mensual, ¿cuánto se debe depositar cada mes?", "o": ["COP 1.550.834", "COP 1.666.667", "COP 1.810.834", "COP 1.628.375"], "e": "A = VF × i / ((1 + i)^n − 1) = COP 1.550.834."}, {"q": "Para reunir COP 40.000.000 en 24 meses con depósitos iguales al final de cada mes en un fondo que rinde 1,02 % mensual, ¿cuánto se debe depositar cada mes?", "o": ["COP 1.479.425", "COP 1.666.667", "COP 1.887.425", "COP 1.553.396"], "e": "A = VF × i / ((1 + i)^n − 1) = COP 1.479.425."}, {"q": "Para reunir COP 10.000.000 en 18 meses con depósitos iguales al final de cada mes en un fondo que rinde 0,90 % mensual, ¿cuánto se debe depositar cada mes?", "o": ["COP 514.261", "COP 555.556", "COP 604.261", "COP 539.974"], "e": "A = VF × i / ((1 + i)^n − 1) = COP 514.261."}, {"q": "¿Cuál es el valor presente de 12 pagos mensuales vencidos de COP 2.000.000 a una tasa de 2,0 % mensual?", "o": ["COP 21.150.682", "COP 24.000.000", "COP 26.824.179", "COP 21.573.696"], "e": "VP = A × (1 − (1 + i)^−n) / i = COP 21.150.682."}, {"q": "¿Cuál es el valor presente de 10 pagos mensuales vencidos de COP 1.500.000 a una tasa de 1,5 % mensual?", "o": ["COP 13.833.277", "COP 15.000.000", "COP 16.054.083", "COP 14.040.776"], "e": "VP = A × (1 − (1 + i)^−n) / i = COP 13.833.277."}, {"q": "¿Cuál es el valor presente de 24 pagos mensuales vencidos de COP 700.000 a una tasa de 1,1 % mensual?", "o": ["COP 14.694.825", "COP 16.800.000", "COP 19.106.984", "COP 14.856.468"], "e": "VP = A × (1 − (1 + i)^−n) / i = COP 14.694.825."}, {"q": "Se ahorran COP 10.000.000 al final de cada semestre durante 3 semestres en una cuenta que paga 12 % EA. ¿Cuál es el saldo final?", "o": ["COP 31.783.005", "COP 30.000.000", "COP 31.836.000", "COP 33.744.000"], "e": "Tasa semestral = (1 + 0,12)^(1/2) − 1 = 5,8301 %; VF = COP 31.783.005."}, {"q": "Se ahorran COP 5.000.000 al final de cada semestre durante 4 semestres en una cuenta que paga 10 % EA. ¿Cuál es el saldo final?", "o": ["COP 21.512.493", "COP 20.000.000", "COP 21.550.625", "COP 23.205.000"], "e": "Tasa semestral = (1 + 0,10)^(1/2) − 1 = 4,8809 %; VF = COP 21.512.493."}, {"q": "Una deuda de COP 12.500.000 se paga en 8 cuotas mensuales iguales, la primera dentro de 3 meses, al 3,5 % mensual. ¿Cuál es la cuota?", "o": ["COP 1.947.978", "COP 1.818.458", "COP 1.562.500", "COP 2.016.157"], "e": "Es una anualidad diferida con 2 periodos de gracia: VP = A × [(1 − (1 + i)^−8) / i] × (1 + i)^−2. Despejando, A = COP 1.947.978."}, {"q": "Una deuda de COP 20.000.000 se paga en 10 cuotas mensuales iguales, la primera dentro de 4 meses, al 2,0 % mensual. ¿Cuál es la cuota?", "o": ["COP 2.362.812", "COP 2.226.531", "COP 2.000.000", "COP 2.410.068"], "e": "Es una anualidad diferida con 3 periodos de gracia: VP = A × [(1 − (1 + i)^−10) / i] × (1 + i)^−3. Despejando, A = COP 2.362.812."}, {"q": "Una deuda de COP 9.000.000 se paga en 6 cuotas mensuales iguales, la primera dentro de 5 meses, al 2,5 % mensual. ¿Cuál es la cuota?", "o": ["COP 1.803.575", "COP 1.633.950", "COP 1.500.000", "COP 1.848.664"], "e": "Es una anualidad diferida con 4 periodos de gracia: VP = A × [(1 − (1 + i)^−6) / i] × (1 + i)^−4. Despejando, A = COP 1.803.575."}, {"q": "Un producto se financia con 15 cuotas mensuales de COP 300.000; la primera se paga a los 4 meses y la tasa es 2,0 % mensual. ¿Cuál es su valor de contado?", "o": ["COP 3.632.444", "COP 3.854.779", "COP 4.500.000", "COP 3.561.220"], "e": "VP de la anualidad en el mes 3 = COP 3.854.779; traído a hoy: / (1 + 0,020)^3 = COP 3.632.444."}, {"q": "Un producto se financia con 12 cuotas mensuales de COP 1.000.000; la primera se paga a los 6 meses y la tasa es 1,5 % mensual. ¿Cuál es su valor de contado?", "o": ["COP 10.125.004", "COP 10.907.505", "COP 12.000.000", "COP 9.975.374"], "e": "VP de la anualidad en el mes 5 = COP 10.907.505; traído a hoy: / (1 + 0,015)^5 = COP 10.125.004."}, {"q": "Hay COP 30.000.000 invertidos al 9 % EA y se retiran COP 1.200.000 al final de cada mes. ¿Aproximadamente cuántos retiros alcanza a cubrir el fondo?", "o": ["27,7 meses", "25,0 meses", "31,8 meses", "23,5 meses"], "e": "Tasa mensual = 0,7207 %; n = −ln(1 − VP × i / A) / ln(1 + i) = 27,7. Sin intereses serían 25,0."}, {"q": "Hay COP 50.000.000 invertidos al 10 % EA y se retiran COP 2.000.000 al final de cada mes. ¿Aproximadamen con prima, porque la TIR es menor que el cupón."}, {"q": "Un crédito de COP 10.000.000 se paga en 36 cuotas mensuales iguales al 1,2 % mensual. ¿Cuál es el valor de la cuota?", "o": ["COP 343.722", "COP 277.778", "COP 364.800", "COP 426.772"], "e": "Cuota = VP × i / [1 − (1 + i)^−n] = COP 10.000.000 × 0,012 / [1 − 1,012^−36] = COP 343.722."}, {"q": "Un crédito de COP 30.000.000 se paga en 12 cuotas mensuales iguales al 1,8 % mensual. ¿Cuál es el valor de la cuota?", "o": ["COP 2.802.059", "COP 2.500.000", "COP 2.991.600", "COP 3.096.801"], "e": "Cuota = VP × i / [1 − (1 + i)^−n] = COP 30.000.000 × 0,018 / [1 − 1,018^−12] = COP 2.802.059."}, {"q": "Un crédito de COP 30.000.000 se paga en 36 cuotas mensuales iguales al 1,5 % mensual. ¿Cuál es el valor de la cuota?", "o": ["COP 1.084.572", "COP 833.333", "COP 1.143.000", "COP 1.424.283"], "e": "Cuota = VP × i / [1 − (1 + i)^−n] = COP 30.000.000 × 0,015 / [1 − 1,015^−36] = COP 1.084.572."}, {"q": "Un crédito de COP 8.000.000 se paga en 18 cuotas mensuales iguales al 1,0 % mensual. ¿Cuál es el valor de la cuota?", "o": ["COP 487.856", "COP 444.444", "COP 523.200", "COP 531.621"], "e": "Cuota = VP × i / [1 − (1 + i)^−n] = COP 8.000.000 × 0,010 / [1 − 1,010^−18] = COP 487.856."}, {"q": "Un crédito de COP 30.000.000 se paga en 18 cuotas mensuales iguales al 1,8 % mensual. ¿Cuál es el valor de la cuota?", "o": ["COP 1.966.048", "COP 1.666.667", "COP 2.091.600", "COP 2.297.782"], "e": "Cuota = VP × i / [1 − (1 + i)^−n] = COP 30.000.000 × 0,018 / [1 − 1,018^−18] = COP 1.966.048."}, {"q": "Un crédito de COP 10.000.000 se paga en 12 cuotas mensuales iguales al 1,0 % mensual. ¿Cuál es el valor de la cuota?", "o": ["COP 888.488", "COP 833.333", "COP 954.000", "COP 939.021"], "e": "Cuota = VP × i / [1 − (1 + i)^−n] = COP 10.000.000 × 0,010 / [1 − 1,010^−12] = COP 888.488."}, {"q": "Una inversión rindió 8 % efectivo anual y la inflación fue 6 %. ¿Cuál fue la rentabilidad real?", "o": ["1,89 %", "2,00 %", "14,48 %", "7,55 %"], "e": "Tasa real = (1 + nominal) / (1 + inflación) − 1 = 1,08 / 1,06 − 1 = 1,89 %. Restar directamente (2,00 %) es solo una aproximación."}, {"q": "Una inversión rindió 12 % efectivo anual y la inflación fue 7 %. ¿Cuál fue la rentabilidad real?", "o": ["4,67 %", "5,00 %", "19,84 %", "11,21 %"], "e": "Tasa real = (1 + nominal) / (1 + inflación) − 1 = 1,12 / 1,07 − 1 = 4,67 %. Restar directamente (5,00 %) es solo una aproximación."}, {"q": "Una inversión rindió 8 % efectivo anual y la inflación fue 7 %. ¿Cuál fue la rentabilidad real?", "o": ["0,93 %", "1,00 %", "15,56 %", "7,48 %"], "e": "Tasa real = (1 + nominal) / (1 + inflación) − 1 = 1,08 / 1,07 − 1 = 0,93 %. Restar directamente (1,00 %) es solo una aproximación."}, {"q": "Una inversión rindió 9 % efectivo anual y la inflación fue 4 %. ¿Cuál fue la rentabilidad real?", "o": ["4,81 %", "5,00 %", "13,36 %", "8,65 %"], "e": "Tasa real = (1 + nominal) / (1 + inflación) − 1 = 1,09 / 1,04 − 1 = 4,81 %. Restar directamente (5,00 %) es solo una aproximación."}, {"q": "Un bono paga IPC + 4 % efectivo anual. Si el IPC del período es 3 %, ¿cuál es la tasa efectiva anual total?", "o": ["7,12 %", "7,00 %", "0,12 %", "8,12 %"], "e": "Las tasas se componen: (1 + IPC) × (1 + spread) − 1 = 1,03 × 1,04 − 1 = 7,12 %."}, {"q": "Un bono paga IPC + 3 % efectivo anual. Si el IPC del período es 5 %, ¿cuál es la tasa efectiva anual total?", "o": ["8,15 %", "8,00 %", "0,15 %", "9,15 %"], "e": "Las tasas se componen: (1 + IPC) × (1 + spread) − 1 = 1,05 × 1,03 − 1 = 8,15 %."}, {"q": "Un bono paga IPC + 3 % efectivo anual. Si el IPC del período es 6 %, ¿cuál es la tasa efectiva anual total?", "o": ["9,18 %", "9,00 %", "0,18 %", "10,18 %"], "e": "Las tasas se componen: (1 + IPC) × (1 + spread) − 1 = 1,06 × 1,03 − 1 = 9,18 %."}, {"q": "Un bono paga IPC + 5 % efectivo anual. Si el IPC del período es 4 %, ¿cuál es la tasa efectiva anual total?", "o": ["9,20 %", "9,00 %", "0,20 %", "10,20 %"], "e": "Las tasas se componen: (1 + IPC) × (1 + spread) − 1 = 1,04 × 1,05 − 1 = 9,20 %."}], "pen": [{"q": "¿Qué ley creó el Sistema General de Pensiones con dos regímenes, el de prima media y el de ahorro individual?", "o": ["Ley 100 de 1993", "Ley 964 de 2005", "Ley 1328 de 2009", "Ley 45 de 1990"], "e": "La Ley 100 de 1993 creó el Sistema de Seguridad Social Integral. En pensiones estableció dos regímenes: el de prima media con prestación definida (RPM) y el de ahorro individual con solidaridad (RAIS)."}, {"q": "¿Qué entidad administra el Régimen de Prima Media con Prestación Definida?", "o": ["Colpensiones", "Las sociedades administradoras de fondos de pensiones y cesantías (AFP)", "Las compañías de seguros", "Las sociedades fiduciarias"], "e": "Colpensiones, una entidad pública, administra el RPM. Las AFP privadas administran el RAIS."}, {"q": "¿Cuál es la característica principal del Régimen de Ahorro Individual con Solidaridad (RAIS)?", "o": ["Los aportes se acumulan en una cuenta individual y la pensión depende del capital ahorrado y sus rendimientos", "La pensión se calcula con una fórmula sobre el salario promedio, sin importar el ahorro", "Lo administra exclusivamente el Estado", "No admite aportes voluntarios"], "e": "En el RAIS cada afiliado tiene una cuenta individual. El monto de la pensión depende del capital acumulado, sus rendimientos y el bono pensional si lo hay."}, {"q": "La cotización obligatoria a pensiones es del 16 % del ingreso base de cotización. Para un trabajador dependiente, ¿cómo se distribuye?", "o": ["12 % a cargo del empleador y 4 % a cargo del trabajador", "8 % y 8 %", "16 % a cargo del trabajador", "16 % a cargo del empleador"], "e": "El empleador paga el 75 % de la cotización (12 puntos) y el trabajador el 25 % (4 puntos)."}, {"q": "Según la Ley 100 de 1993, modificada por la Ley 797 de 2003, ¿cuáles son la edad y las semanas para pensionarse en el RPM?", "o": ["57 años mujeres, 62 años hombres y 1.300 semanas", "55 años mujeres, 60 años hombres y 1.000 semanas", "60 años para ambos y 1.500 semanas", "62 años mujeres, 65 hombres y 1.200 semanas"], "e": "Hoy se exigen 57 años a las mujeres y 62 a los hombres, con 1.300 semanas cotizadas (Ley 100 de 1993, modificada por la Ley 797 de 2003). La reforma de la Ley 2381 de 2024 reduciría gradualmente las semanas de las mujeres, pero aún no está vigente: la Corte Constitucional la avaló en agosto de 2026 y se prevé que rija desde el 1 de abril de 2027."}, {"q": "¿Cada cuánto puede un afiliado trasladarse entre el RPM y el RAIS?", "o": ["Una vez cada cinco años, y no cuando le falten diez años o menos para la edad de pensión", "Una vez al año", "Cuando quiera, sin restricciones", "Solo una vez en la vida, al inicio de su vida laboral"], "e": "La Ley 797 de 2003 permite el traslado entre regímenes una vez cada cinco años. No es posible cuando al afiliado le faltan diez años o menos para la edad de pensión."}, {"q": "¿Cuáles son los tipos de fondos del esquema de multifondos en las pensiones obligatorias?", "o": ["Conservador, moderado, de mayor riesgo y de retiro programado", "Abierto, cerrado y con pacto de permanencia", "Renta fija, renta variable y derivados", "Corto plazo, mediano plazo y largo plazo"], "e": "El esquema de multifondos, creado por la Ley 1328 de 2009, ofrece los fondos conservador, moderado y de mayor riesgo para los afiliados, y el de retiro programado para los pensionados."}, {"q": "¿Qué sucede con un afiliado al RAIS que no elige un tipo de fondo dentro del esquema de multifondos?", "o": ["Se le asigna un fondo según su edad, siguiendo un esquema de ciclo de vida", "Queda sin fondo y sus aportes se devuelven", "Se le asigna siempre el fondo de mayor riesgo", "Se le traslada automáticamente al RPM"], "e": "Quien no elige queda en el esquema de ciclo de vida: se le asigna un fondo según su edad, con menos riesgo a medida que se acerca a la pensión."}, {"q": "¿Por qué un afiliado cercano a la edad de pensión no puede elegir el fondo de mayor riesgo?", "o": ["Porque una caída fuerte del mercado afectaría su ahorro sin tiempo para recuperarse", "Porque ese fondo solo es para extranjeros", "Porque ese fondo no tiene rendimientos", "Porque la ley prohíbe invertir en acciones"], "e": "A medida que se acerca la pensión, el horizonte de inversión es menor y un choque de mercado sería difícil de recuperar. Por eso las reglas limitan el fondo de mayor riesgo para quienes están cerca de pensionarse."}, {"q": "¿Qué es la rentabilidad mínima obligatoria en los fondos de pensiones obligatorias?", "o": ["Un nivel de rentabilidad que la AFP debe garantizar a cada tipo de fondo; si no se alcanza, la AFP debe cubrir la diferencia", "Una rentabilidad fija del 10 % anual", "La rentabilidad del Banco de la República", "La rentabilidad que paga Colpensiones"], "e": "La SFC calcula una rentabilidad mínima para cada tipo de fondo. Si un fondo no la alcanza, la AFP cubre la diferencia con la reserva de estabilización y, si no alcanza, con sus propios recursos."}, {"q": "La reserva de estabilización de rendimientos de una AFP equivale a:", "o": ["El 1 % del valor del fondo administrado, invertido en unidades del mismo fondo", "El 10 % de las utilidades de la AFP", "El 50 % del capital de la AFP", "El 5 % de los aportes mensuales"], "e": "Las AFP deben mantener una reserva equivalente al 1 % del valor de cada fondo, invertida en el mismo fondo, para responder si no se alcanza la rentabilidad mínima."}, {"q": "¿Cuál de las siguientes es una modalidad de pensión en el RAIS?", "o": ["Retiro programado", "Prima media", "Indemnización sustitutiva", "Pensión gracia"], "e": "En el RAIS las modalidades son retiro programado, renta vitalicia inmediata y retiro programado con renta vitalicia diferida, entre otras."}, {"q": "En la modalidad de renta vitalicia, el afiliado:", "o": ["Contrata con una aseguradora que le paga una mensualidad de por vida a cambio de su saldo", "Retira cada mes una parte de su saldo, que sigue en la AFP", "Recibe todo su saldo en un único pago", "Sigue cotizando hasta los 70 años"], "e": "En la renta vitalicia el afiliado traslada su capital a una aseguradora, que asume el riesgo de longevidad y paga una mensualidad vitalicia."}, {"q": "¿Qué es el bono pensional?", "o": ["Un título que reconoce los aportes hechos en el régimen de prima media cuando el afiliado se traslada al RAIS", "Una bonificación anual que paga la AFP a los afiliados", "Un bono de deuda pública emitido para financiar las pensiones", "Un pago adicional para quienes se pensionan anticipadamente"], "e": "El bono pensional representa los aportes hechos antes del traslado al RAIS. Se suma al capital de la cuenta individual cuando se redime."}, {"q": "¿Qué es la garantía de pensión mínima en el RAIS?", "o": ["El complemento que paga el Estado para que el afiliado reciba al menos un salario mínimo, si cumple edad y semanas pero su capital no alcanza", "Una pensión que pagan las AFP a todos los afiliados", "Una rentabilidad mínima del fondo", "Un seguro de desempleo"], "e": "Si el afiliado cumple la edad y las semanas mínimas (1.150) pero su capital no le alcanza para una pensión de un salario mínimo, el Estado completa la diferencia."}, {"q": "Las cesantías equivalen a:", "o": ["Un mes de salario por cada año trabajado, o la proporción correspondiente", "Quince días de salario por año", "El 12 % del salario mensual", "Dos meses de salario por año"], "e": "El empleador debe reconocer un mes de salario por cada año de servicio, o proporcionalmente por fracción de año."}, {"q": "¿Hasta qué fecha debe el empleador consignar las cesantías en el fondo del trabajador?", "o": ["Hasta el 14 de febrero del año siguiente", "Hasta el 31 de diciembre del mismo año", "Hasta el 31 de marzo del año siguiente", "Hasta el 30 de junio del año siguiente"], "e": "Las cesantías liquidadas a 31 de diciembre deben consignarse en el fondo de cesantías antes del 15 de febrero del año siguiente."}, {"q": "Los intereses sobre las cesantías equivalen al:", "o": ["12 % anual sobre el saldo, y el empleador los paga directamente al trabajador", "1 % mensual pagado por el fondo", "5 % anual consignado en el fondo", "6 % anual pagado por la AFP"], "e": "El empleador paga al trabajador intereses del 12 % anual sobre las cesantías, a más tardar el 31 de enero del año siguiente."}, {"q": "¿Qué portafolios ofrecen los fondos de cesantías?", "o": ["Un portafolio de corto plazo y uno de largo plazo", "Conservador, moderado y de mayor riesgo", "Abierto y cerrado", "Renta fija y derivados"], "e": "Los fondos de cesantías tienen un portafolio de corto plazo, para retiros cercanos, y uno de largo plazo, con mayor horizonte de inversión."}, {"q": "¿Qué entidades pueden administrar fondos de pensiones voluntarias?", "o": ["Las AFP, las sociedades fiduciarias y las compañías de seguros", "Solo Colpensiones", "Solo los bancos", "Solo las sociedades comisionistas de bolsa"], "e": "Los fondos de pensiones voluntarias pueden ser administrados por AFP, fiduciarias y aseguradoras autorizadas."}, {"q": "¿Qué entidad vigila a las sociedades administradoras de fondos de pensiones y cesantías?", "o": ["La Superintendencia Financiera de Colombia", "El Ministerio del Trabajo, únicamente", "La Superintendencia de Sociedades", "El DANE"], "e": "Las AFP son entidades vigiladas por la SFC, que controla su régimen de inversión, sus deberes y la rentabilidad mínima."}, {"q": "Un trabajador con ingresos de 4 o más salarios mínimos debe aportar además al:", "o": ["Fondo de Solidaridad Pensional, un punto adicional sobre su ingreso base", "Fondo Nacional del Ahorro", "Fondo de Garantías de Instituciones Financieras", "Fondo de Cesantías"], "e": "Quienes devengan 4 o más SMMLV aportan un 1 % adicional al Fondo de Solidaridad Pensional, con escalas mayores para ingresos más altos."}, {"q": "Si un afiliado al RAIS llega a la edad de pensión sin cumplir los requisitos de capital ni de semanas, ¿qué recibe?", "o": ["La devolución de los saldos de su cuenta individual con sus rendimientos", "Nada, pierde los aportes", "Una pensión de un salario mínimo sin condiciones", "La indemnización sustitutiva de Colpensiones"], "e": "En el RAIS, quien no logra pensionarse recibe la devolución de saldos. La indemnización sustitutiva es la figura equivalente en el RPM."}, {"q": "Los recursos de los fondos de pensiones obligatorias:", "o": ["Constituyen un patrimonio autónomo, separado del patrimonio de la AFP", "Hacen parte de los activos de la AFP", "Pertenecen al Estado", "Pueden usarse para pagar los gastos de la AFP"], "e": "Los fondos son patrimonios autónomos e independientes de la administradora, que responden solo por las obligaciones con los afiliados."}, {"q": "En el Régimen de Prima Media, la pensión de vejez se determina:", "o": ["Con una fórmula basada en el ingreso base de liquidación y las semanas cotizadas", "Según el saldo de la cuenta individual", "Según la rentabilidad del mercado", "Por una negociación entre el afiliado y Colpensiones"], "e": "El RPM es de prestación definida: la pensión se calcula como un porcentaje del ingreso base de liquidación, que depende de las semanas cotizadas."}, {"q": "¿Qué es el ingreso base de cotización (IBC)?", "o": ["El salario o ingreso sobre el cual se calculan los aportes al sistema", "El salario mínimo legal vigente", "La pensión que recibirá el afiliado", "El valor del bono pensional"], "e": "El IBC es la base sobre la que se aplica el porcentaje de cotización. Para un trabajador dependiente, normalmente es su salario."}, {"q": "Un trabajador dependiente gana COP 3.000.000 mensuales. ¿Cuánto se aporta en total a pensiones cada mes?", "o": ["COP 480.000", "COP 360.000", "COP 120.000", "COP 300.000"], "e": "Cotización = 16 % × 3.000.000 = 480.000. De ese valor, el empleador paga 360.000 (12 %) y el trabajador 120.000 (4 %)."}, {"q": "Un trabajador dependiente gana COP 3.000.000 mensuales. ¿Cuánto se le descuenta de su salario para pensiones, sin contar el fondo de solidaridad?", "o": ["COP 120.000", "COP 480.000", "COP 360.000", "COP 240.000"], "e": "Al trabajador le corresponde el 4 % de su IBC: 4 % × 3.000.000 = 120.000. El empleador paga el 12 % restante."}, {"q": "En el RAIS, ¿a qué se destina la mayor parte de la cotización obligatoria?", "o": ["A la cuenta de ahorro individual del afiliado", "A pagar las pensiones de los actuales pensionados", "Al presupuesto general de la Nación", "A la AFP como ganancia"], "e": "La mayor parte del aporte va a la cuenta individual. Otra parte cubre la comisión de administración, el seguro previsional y el fondo de garantía de pensión mínima."}, {"q": "El seguro previsional en el RAIS cubre:", "o": ["Las pensiones de invalidez y sobrevivencia", "La pensión de vejez", "Las cesantías", "Las pérdidas de rentabilidad"], "e": "La AFP contrata un seguro previsional para financiar las pensiones de invalidez y sobrevivencia de los afiliados."}, {"q": "En el Régimen de Prima Media, los aportes de los afiliados:", "o": ["Forman un fondo común que paga las pensiones, y el Estado garantiza la prestación", "Se acumulan en cuentas individuales", "Son propiedad de cada afiliado y se pueden heredar", "Se invierten en acciones a elección del afiliado"], "e": "En el RPM los aportes van a un fondo común de naturaleza pública y la pensión está definida por ley."}, {"q": "¿Cuál es la principal diferencia en materia de herencia entre el RAIS y el RPM?", "o": ["En el RAIS, si no hay beneficiarios de pensión, el saldo de la cuenta puede pasar a los herederos; en el RPM no existe una cuenta individual heredable", "En el RPM los aportes siempre se heredan", "No hay diferencia", "En ninguno de los dos se protege a la familia"], "e": "En el RAIS, a falta de beneficiarios de pensión de sobrevivientes, el saldo hace parte de la masa herencial. En el RPM no hay un saldo individual."}, {"q": "La pensión de sobrevivientes se reconoce a:", "o": ["Los beneficiarios del afiliado o pensionado fallecido, como el cónyuge o compañero permanente y los hijos que cumplan los requisitos", "Cualquier persona que el afiliado designe libremente", "Solo a los padres del afiliado", "A la AFP"], "e": "Los beneficiarios están definidos por ley: cónyuge o compañero permanente, hijos que cumplan los requisitos y, a falta de ellos, padres o hermanos inválidos dependientes."}, {"q": "Para tener derecho a la pensión de invalidez, la persona debe tener una pérdida de capacidad laboral de al menos:", "o": ["50 %", "30 %", "70 %", "20 %"], "e": "Se considera inválida la persona que pierde el 50 % o más de su capacidad laboral, además de cumplir el requisito de semanas cotizadas."}, {"q": "¿Cuál es el valor mínimo de una pensión de vejez en Colombia?", "o": ["Un salario mínimo legal mensual vigente", "Medio salario mínimo", "El 75 % del último salario", "No existe un mínimo"], "e": "La Constitución y la ley establecen que ninguna pensión puede ser inferior al salario mínimo mensual legal vigente."}, {"q": "¿Qué es la indemnización sustitutiva en el RPM?", "o": ["Un pago único para quien llega a la edad de pensión sin las semanas exigidas y declara que no puede seguir cotizando", "Una pensión mensual de por vida", "El bono pensional del afiliado", "Una multa a los empleadores morosos"], "e": "Quien no completa las semanas en el RPM puede recibir una indemnización sustitutiva en lugar de la pensión."}, {"q": "¿Qué son los Beneficios Económicos Periódicos (BEPS)?", "o": ["Un mecanismo de ahorro voluntario para personas de bajos ingresos, con un subsidio del Estado", "Un tipo de bono emitido por las AFP", "Las cesantías de los trabajadores públicos", "Una modalidad de renta vitalicia"], "e": "Los BEPS permiten ahorrar de manera flexible a personas que no alcanzan una pensión. El Estado da un incentivo sobre lo ahorrado."}, {"q": "En la modalidad de retiro programado, ¿quién asume el riesgo de que el afiliado viva más de lo esperado?", "o": ["El propio afiliado, porque la pensión depende del saldo y se recalcula cada año", "Una aseguradora", "El Estado siempre", "La AFP con sus propios recursos"], "e": "En el retiro programado el saldo sigue en la cuenta y la mesada se recalcula. Si el saldo se agota antes, la persona queda expuesta, salvo la garantía de pensión mínima si aplica."}, {"q": "Una ventaja de la renta vitalicia frente al retiro programado es que:", "o": ["Garantiza una mesada de por vida, porque la aseguradora asume el riesgo de longevidad", "El saldo se puede heredar siempre", "La mesada sube con el mercado", "No tiene ningún costo"], "e": "En la renta vitalicia la aseguradora se obliga a pagar la mesada sin importar cuánto viva el pensionado. A cambio, el saldo deja de ser del afiliado."}, {"q": "¿Qué fondo del esquema de multifondos tiene, normalmente, la mayor proporción de renta variable?", "o": ["El fondo de mayor riesgo", "El fondo conservador", "El fondo de retiro programado", "El portafolio de corto plazo de cesantías"], "e": "El fondo de mayor riesgo tiene límites más amplios en renta variable y busca más rentabilidad en el largo plazo."}, {"q": "¿Qué fondo de pensiones obligatorias está diseñado para quienes están cerca de pensionarse?", "o": ["El fondo conservador", "El fondo de mayor riesgo", "El fondo bursátil", "El fondo de capital privado"], "e": "El fondo conservador tiene más renta fija y menos volatilidad, adecuado para un horizonte de inversión corto."}, {"q": "¿Sobre qué período se calcula la rentabilidad mínima del fondo conservador de pensiones obligatorias?", "o": ["36 meses", "12 meses", "60 meses", "6 meses"], "e": "Según el Decreto 2555, la rentabilidad mínima se mide en 36 meses para el conservador, 48 para el moderado y 60 para el de mayor riesgo."}, {"q": "¿Por qué la rentabilidad mínima del fondo de mayor riesgo se mide en un período más largo (60 meses) que la del conservador?", "o": ["Porque su inversión es de largo plazo y su rentabilidad es más volátil en períodos cortos", "Porque tiene menos afiliados", "Porque no invierte en acciones", "Porque así lo pide el afiliado"], "e": "Un portafolio con más renta variable necesita un horizonte más largo para que su desempeño se evalúe de forma justa."}, {"q": "La comisión de administración en pensiones obligatorias se cobra:", "o": ["Como un porcentaje de la cotización del afiliado", "Como un porcentaje de los rendimientos únicamente", "Como una tarifa fija anual pagada en efectivo", "No se cobra"], "e": "En pensiones obligatorias la AFP descuenta su comisión de la cotización mensual."}, {"q": "¿Puede un afiliado del RAIS hacer aportes voluntarios a su cuenta de pensión obligatoria?", "o": ["Sí, para aumentar su saldo y así su pensión o adelantarla", "No, está prohibido", "Solo si es empleado público", "Solo después de pensionarse"], "e": "Los aportes voluntarios a la cuenta obligatoria aumentan el capital y pueden mejorar la pensión o permitir pensionarse antes."}, {"q": "En el RAIS, un afiliado puede pensionarse antes de la edad si:", "o": ["Su capital permite financiar una pensión de al menos el 110 % del salario mínimo", "Tiene más de 500 semanas", "Lo autoriza su empleador", "Paga una multa"], "e": "En el RAIS no hay una edad obligatoria: basta con tener el capital suficiente para una pensión mayor o igual al 110 % del salario mínimo."}, {"q": "¿Qué pasa con las cesantías si el trabajador termina su contrato?", "o": ["Puede retirarlas del fondo de cesantías", "Las pierde", "Se convierten en pensión automáticamente", "Pasan a la AFP como ganancia"], "e": "La terminación del contrato es una de las causales de retiro de las cesantías. También se pueden retirar para vivienda o educación."}, {"q": "Además de la terminación del contrato, las cesantías se pueden retirar parcialmente para:", "o": ["Comprar, construir o mejorar vivienda, o pagar educación", "Viajes de turismo", "Comprar acciones en bolsa", "Pagar multas de tránsito"], "e": "La ley permite retiros parciales para vivienda y educación del trabajador, su cónyuge o sus hijos."}, {"q": "Las pensiones voluntarias se caracterizan por:", "o": ["Ser aportes adicionales y libres, con beneficios tributarios si se cumplen ciertas condiciones de permanencia o destino", "Ser obligatorias para todos los trabajadores", "Garantizar una rentabilidad fija", "Reemplazar la pensión obligatoria"], "e": "Los fondos de pensiones voluntarias reciben aportes libres, con alternativas de inversión elegidas por el afiliado y beneficios tributarios según las condiciones de la ley."}, {"q": "¿Quién elige las alternativas de inversión en un fondo de pensiones voluntarias?", "o": ["El afiliado, dentro de las opciones que ofrece la administradora", "La Superintendencia Financiera", "Colpensiones", "El empleador"], "e": "En los fondos voluntarios el afiliado escoge entre los portafolios que ofrece la administradora según su perfil."}, {"q": "¿Qué entidad garantiza el pago de las pensiones en el RPM?", "o": ["El Estado", "Las AFP", "Las aseguradoras privadas", "La Bolsa de Valores"], "e": "En el RPM el Estado garantiza el pago de las prestaciones a los afiliados."}, {"q": "Un afiliado de 55 años, mujer, que quiere trasladarse del RAIS al RPM:", "o": ["No puede, porque le faltan menos de diez años para la edad de pensión", "Puede hacerlo libremente", "Solo puede si tiene más de 1.300 semanas", "Debe pagar una multa para hacerlo"], "e": "Con 55 años, a una mujer le faltan dos años para la edad de pensión (57). La ley no permite el traslado cuando faltan diez años o menos."}, {"q": "¿Cuál es el objetivo del esquema de ciclo de vida en los multifondos?", "o": ["Ajustar el nivel de riesgo del ahorro a la edad del afiliado, reduciéndolo a medida que se acerca la pensión", "Maximizar la comisión de la AFP", "Garantizar una rentabilidad fija", "Invertir todo en acciones extranjeras"], "e": "Los jóvenes pueden asumir más riesgo por su horizonte largo. Cerca de la pensión conviene proteger el capital acumulado."}, {"q": "¿Qué protege el Fondo de Garantía de Pensión Mínima?", "o": ["El pago de la pensión mínima a los afiliados del RAIS
