áx. 15 pensiones mínimas) y ≥ 110 % de la pensión mínima<\/td><\/tr>\n<tr><td>Modalidades<\/td><td>Una sola<\/td><td>Varias (ver sección 5)<\/td><\/tr>\n<tr><td>Requisitos de vejez<\/td><td>57 años mujeres, 62 hombres y 1.300 semanas<\/td><td>Capital suficiente; garantía de pensión mínima con 1.150 semanas y la misma edad<\/td><\/tr>\n<tr><td>Pensión anticipada<\/td><td>No<\/td><td>Sí, si el capital financia al menos el 110 % del salario mínimo<\/td><\/tr>\n<tr><td>Si no cumple requisitos<\/td><td>Indemnización sustitutiva<\/td><td>Devolución de saldos<\/td><\/tr>\n<tr><td>Herencia<\/td><td>No hay saldo individual<\/td><td>A falta de beneficiarios, el saldo pasa a los herederos<\/td><\/tr>\n<tr><td>Garantía<\/td><td>El Estado<\/td><td>Rentabilidad mínima y Fondo de Garantía de Pensión Mínima<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li>Ninguna pensión puede ser menor a un salario mínimo.<\/li>\n<li>Si no se cumplen requisitos, los recursos pasan a <b>BEPS<\/b>, salvo que en seis meses el afiliado pida la prestación o sume semanas con su pareja para una <b>pensión familiar<\/b>.<\/li>\n<li>Colpensiones es una empresa industrial y comercial del Estado, entidad financiera especial vinculada al Ministerio del Trabajo. La SFC vigila ambos regímenes.<\/li>\n<li>El traslado entre regímenes se permite una vez cada <b>cinco años<\/b>, y no cuando faltan <b>diez años o menos<\/b> para la edad de pensión. Exige doble asesoría.<\/li>\n<li>Los afiliados al RAIS pueden cambiar de AFP cumpliendo una permanencia mínima.<\/li>\n<\/ul>\n\n<h2>3. Cotización y seguro previsional<\/h2>\n<ul>\n<li>La cotización es el <b>16 % del IBC<\/b>: 12 % a cargo del empleador y 4 % a cargo del trabajador dependiente.<\/li>\n<li>Quien gana 4 o más salarios mínimos aporta un 1 % adicional al <b>Fondo de Solidaridad Pensional<\/b>.<\/li>\n<li>El trabajador independiente cotiza, por regla general, sobre el 40 % de sus ingresos.<\/li>\n<li>En el RAIS, la cotización financia la cuenta individual, la comisión de la AFP y el seguro previsional (juntos, <b>3 %<\/b> de los 16 puntos) y el fondo de garantía de pensión mínima (<b>1,5 %<\/b>).<\/li>\n<li>El <b>seguro previsional<\/b> es una póliza colectiva que la AFP contrata por licitación pública. Cubre invalidez y muerte de <b>origen común<\/b>; las de origen laboral las cubre la ARL.<\/li>\n<li>Para pensión de invalidez o sobrevivientes se requieren <b>50 semanas en los últimos 3 años<\/b>. Los requisitos son iguales en ambos regímenes.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Salario de COP 3.000.000: cotización total = 16 % = <b>COP 480.000<\/b>. El empleador paga 360.000 y al trabajador se le descuentan 120.000.<\/p><\/div>\n\n<h2>4. Otras prestaciones<\/h2>\n<ul>\n<li><b>Invalidez:<\/b> pérdida de capacidad laboral de al menos el 50 %, más el requisito de semanas.<\/li>\n<li><b>Sobrevivientes:<\/b> para los beneficiarios definidos por ley (cónyuge o compañero, hijos que cumplan requisitos y, a falta de ellos, padres o hermanos inválidos dependientes).<\/li>\n<li><b>Bono pensional:<\/b> título de deuda pública que reconoce el tiempo cotizado antes y se suma al capital. Se redime a los 62 años (hombres) o 60 (mujeres).<\/li>\n<li><b>Prestaciones del SGP:<\/b> pensiones de vejez, invalidez, sobrevivencia y familiar, auxilio funerario, garantía de pensión mínima, indemnización sustitutiva (RPM) y devolución de saldos (RAIS).<\/li>\n<li><b>BEPS:<\/b> ahorro voluntario flexible para personas de bajos ingresos, con un incentivo del Estado.<\/li>\n<\/ul>\n\n<h2>5. Modalidades de pensión en el RAIS<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Modalidad<\/th><th>Cómo funciona<\/th><th>Quién asume la longevidad<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Retiro programado<\/td><td>El saldo sigue en la AFP y la mesada se recalcula cada año<\/td><td>El afiliado<\/td><\/tr>\n<tr><td>Renta vitalicia<\/td><td>El capital pasa a una aseguradora, que paga de por vida<\/td><td>La aseguradora<\/td><\/tr>\n<tr><td>Retiro programado con renta vitalicia diferida<\/td><td>Primero retiro programado y luego renta vitalicia desde una fecha pactada<\/td><td>Compartido<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>Renta vitalicia inmediata:<\/b> se contrata de forma irrevocable con la aseguradora elegida. La mesada se reajusta con el IPC. Si el pensionado fallece, pasa a sus beneficiarios; sin beneficiarios, se extingue.<\/li>\n<li><b>Retiro programado:<\/b> la AFP paga 1/12 de una anualidad recalculada cada año. El saldo nunca puede bajar del capital para una renta vitalicia de un salario mínimo; si se acerca, la AFP contrata esa renta.<\/li>\n<li><b>Con renta vitalicia diferida:<\/b> la renta diferida no puede ser inferior a la pensión mínima.<\/li>\n<li><b>Otras aprobadas por la SFC:<\/b> renta temporal variable con renta vitalicia diferida; renta temporal variable con renta vitalicia inmediata (dos mesadas a la vez); renta temporal cierta con renta vitalicia de diferimiento cierto (la aseguradora asume riesgos de mercado y longevidad); retiro programado sin negociación del bono (exige capital para el <b>130 %<\/b> de las mesadas hasta la redención del bono).<\/li>\n<li>Se puede pasar de retiro programado a renta vitalicia, pero no al revés.<\/li>\n<\/ul>\n\n<h2>6. Las AFP: gobierno y conducta<\/h2>\n<ul>\n<li>Son sociedades de servicios financieros de <b>objeto exclusivo<\/b>, vigiladas por la SFC.<\/li>\n<li><b>Asamblea de accionistas:<\/b> máximo órgano; elige junta, revisor fiscal y defensor del consumidor financiero.<\/li>\n<li><b>Junta directiva:<\/b> número impar, mínimo <b>5<\/b>, con al menos un representante de los trabajadores afiliados y uno de los empleadores. Aprueba la política de inversión y la asignación estratégica de cada fondo.<\/li>\n<li><b>Revisor fiscal de los fondos obligatorios:<\/b> lo elige una comisión de 3 representantes de los afiliados y los accionistas.<\/li>\n<li><b>Comités de riesgos e inversiones:<\/b> mínimo 5 miembros (impar), con al menos uno de la junta y uno independiente. En el comité de inversiones se toman las decisiones de inversión.<\/li>\n<li>La política de inversión se publica en la web y se envía a la SFC <b>15 días hábiles<\/b> antes. La asignación estratégica se fija <b>anualmente<\/b> y se envía a la SFC en <b>3 días hábiles<\/b>.<\/li>\n<li><b>Derechos políticos:<\/b> obligatorios cuando la participación es relevante (≥ <b>5 %<\/b> del capital del emisor o de una emisión, o ≥ 5 % del valor de un fondo). La política la aprueba la junta y se revisa cada año.<\/li>\n<li>Prohibido: adquirir acciones de la matriz o subordinadas, o títulos emitidos o garantizados por ellas; concentrar riesgos sobre los límites; facilitar la evasión fiscal; usar información reservada. El uso indebido de información privilegiada es delito (art. 258 del Código Penal).<\/li>\n<li>Principios: transparencia, reserva, uso adecuado de la información, lealtad, profesionalismo y adecuación a la ley.<\/li>\n<\/ul>\n\n<h2>7. Multifondos y rentabilidad mínima<\/h2>\n<p>La Ley 1328 de 2009 creó el esquema de multifondos para las pensiones obligatorias:<\/p>\n<ul>\n<li><b>Conservador:<\/b> para quienes están cerca de pensionarse; más renta fija.<\/li>\n<li><b>Moderado.<\/b><\/li>\n<li><b>De mayor riesgo:<\/b> más renta variable; no pueden elegirlo quienes están cerca de la edad de pensión.<\/li>\n<li><b>Especial de retiro programado:<\/b> para los pensionados.<\/li>\n<\/ul>\n<p>Cada tipo de fondo es un <b>patrimonio autónomo<\/b> con NIT propio, contabilidad independiente y cuentas bancarias exclusivas. Quien no elige queda en la <b>asignación por defecto<\/b>. Las <b>reglas de convergencia<\/b>, en cambio, son obligatorias: trasladan los saldos hacia fondos de menor riesgo.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Edad mujer<\/th><th>Edad hombre<\/th><th>Mayor riesgo / Moderado / Conservador<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>&lt; 42<\/td><td>&lt; 47<\/td><td>100 / 0 / 0<\/td><\/tr>\n<tr><td>42 → 45<\/td><td>47 → 50<\/td><td>baja 20 puntos por año hacia el moderado (80/20, 60/40, 40/60, 20/80)<\/td><\/tr>\n<tr><td>46 – 49<\/td><td>51 – 54<\/td><td>0 / 100 / 0<\/td><\/tr>\n<tr><td>50 → 53<\/td><td>55 → 58<\/td><td>baja 20 puntos por año hacia el conservador (80/20 … 20/80)<\/td><\/tr>\n<tr><td>54 o más<\/td><td>59 o más<\/td><td>0 / 0 / 100<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Las cotizaciones voluntarias van al mismo fondo de los aportes obligatorios, siguen la convergencia y se retiran con aviso de <b>6 meses<\/b>.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Fondo<\/th><th>Período de cálculo de la rentabilidad mínima<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Conservador<\/td><td>36 meses<\/td><\/tr>\n<tr><td>Moderado<\/td><td>48 meses<\/td><\/tr>\n<tr><td>Mayor riesgo<\/td><td>60 meses<\/td><\/tr>\n<tr><td>Retiro programado<\/td><td>48 meses<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Cálculo (SFC, verificación mensual):<\/b> suma ponderada de un componente de referencia y del promedio de rentabilidad de los fondos del mismo tipo. Pesos: conservador 30/70, moderado 20/80, mayor riesgo 10/90. La mínima es la <b>menor<\/b> entre dos opciones:<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Fondo<\/th><th>Opción A<\/th><th>Opción B<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Conservador<\/td><td>Suma − 200 pb<\/td><td>Suma × (1 − 30 %)<\/td><\/tr>\n<tr><td>Moderado<\/td><td>Suma − 300 pb<\/td><td>Suma × (1 − 35 %)<\/td><\/tr>\n<tr><td>Mayor riesgo<\/td><td>Suma − 400 pb<\/td><td>Suma × (1 − 40 %)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Fondo moderado con suma ponderada de 12 %: A = 12 % − 3 % = 9 %; B = 12 % × 0,65 = 7,8 %. La rentabilidad mínima es <b>7,8 %<\/b>.<\/p><\/div>\n<p>Si un fondo no la alcanza, la AFP responde con recursos propios, primero con la <b>reserva de estabilización de rendimientos<\/b> (mínimo el <b>1 %<\/b> del fondo, en unidades del mismo fondo), que debe restablecer al mes siguiente. Si la reserva queda corta, la multa es del <b>3,5 %<\/b> del defecto mensual a favor de la solidaridad pensional.<\/p>\n<p><b>Inversiones admisibles:<\/b> deuda pública y privada, titularizaciones, FIC, acciones, fondos de capital privado, títulos del exterior, hedge funds regulados, depósitos, derivados de cobertura e inversión, repos y simultáneas activas, estructurados de capital protegido y TTV. Los títulos deben estar en depósitos centralizados de valores.<\/p>\n\n\n<h2>8. Cesantías<\/h2>\n<ul>\n<li>Equivalen a <b>un mes de salario por año<\/b> trabajado.<\/li>\n<li>El empleador las consigna a más tardar el <b>14 de febrero<\/b> del año siguiente.<\/li>\n<li>Los <b>intereses del 12 % anual<\/b> los paga el empleador directamente al trabajador, a más tardar el 31 de enero.<\/li>\n<li>Los fondos de cesantías tienen un portafolio de <b>corto plazo<\/b> y uno de <b>largo plazo<\/b>.<\/li>\n<li><b>Retiro total:<\/b> terminación del contrato, sustitución de empleador, servicio militar, cambio a salario integral o fallecimiento.<\/li>\n<li><b>Retiro parcial:<\/b> educación superior, ahorro programado o seguro educativo, acciones del Estado en privatizaciones, compra o mejora de vivienda, créditos de vivienda e impuestos de la vivienda.<\/li>\n<li><b>Traslado<\/b> entre administradoras o al FNA: se pide a la entidad de destino, que responde en máximo <b>15 días hábiles<\/b>.<\/li>\n<\/ul>\n\n<h2>9. Fondos voluntarios de pensión (FVP)<\/h2>\n<ul>\n<li>Las administran las AFP, las sociedades fiduciarias y las aseguradoras.<\/li>\n<li><b>Partícipes:<\/b> personas naturales del plan. <b>Patrocinadores:<\/b> empresas, sindicatos o gremios. <b>Beneficiarios:<\/b> quienes reciben la prestación (capital o renta temporal o vitalicia).<\/li>\n<li>Los planes son solo de <b>contribución definida<\/b>: <b>abiertos<\/b> (cualquier persona) o <b>institucionales<\/b> (trabajadores o miembros del patrocinador), que pueden ser <b>condicionados<\/b> (el partícipe adquiere los aportes cuando se cumple la condición) o <b>no condicionados<\/b>.<\/li>\n<li>Los aportes del patrocinador no son salario ni base de seguridad social, salvo pacto.<\/li>\n<li><b>Alternativas:<\/b> estandarizada (la administradora elige portafolios y porcentajes), flexible (ella elige portafolios y el partícipe los montos) y autogestionada (el partícipe elige todo). Los portafolios son abiertos o cerrados.<\/li>\n<li>Pueden invertir en valores, títulos, activos del exterior, fondos, divisas, inmuebles, commodities y derivados de inversión.<\/li>\n<li>Los recursos son <b>heredables<\/b> (masa sucesoral) e inembargables como las cuentas de ahorro, salvo por alimentos.<\/li>\n<li><b>Información:<\/b> prospecto previo; ficha técnica mensual (5 días hábiles, publicada 12 meses); extracto al menos <b>trimestral<\/b> (10 días hábiles). Revisor fiscal: el mismo de la administradora.<\/li>\n<li>La asesoría sigue las reglas del mercado de valores.<\/li>\n<\/ul>\n\n<h2>10. Beneficios tributarios<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th><\/th><th>Aportes voluntarios a fondo obligatorio (FPO)<\/th><th>Aportes a fondo voluntario (FVP)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Tratamiento<\/td><td>Ingreso no constitutivo de renta<\/td><td>Renta exenta<\/td><\/tr>\n<tr><td>Tope<\/td><td>25 % del ingreso, máx. 2.500 UVT/año<\/td><td>30 % del ingreso (junto con AFC), máx. 3.800 UVT/año, y dentro del 40 % / 1.340 UVT de la cédula general<\/td><\/tr>\n<tr><td>Retiro sin requisitos<\/td><td>Retención del 35 % (fin distinto a mejorar la pensión)<\/td><td>Pierde el beneficio; retención del 7 % para aportes desde 2017<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li>Un retiro de FVP conserva el beneficio si cada aporte duró más de <b>10 años<\/b>, si el aportante cumple requisitos de pensión o si se destina a <b>vivienda<\/b>.<\/li>\n<li>El patrocinador deduce hasta <b>3.800 UVT<\/b> anuales por trabajador.<\/li>\n<li>Las mesadas están exentas hasta <b>1.000 UVT<\/b> mensuales.<\/li>\n<li>Los traslados hacia FVP dentro de la misma entidad y del mismo titular están exentos de GMF.<\/li>\n<\/ul>\n\n<h2>11. Sector público: patrimonios autónomos y conmutación<\/h2>\n<ul>\n<li>Las entidades territoriales pueden contratar patrimonios autónomos pensionales con AFP o fiduciarias. Siguen el régimen de inversión del Fonpet (Decreto 1068 de 2015).<\/li>\n<li><b>Normalización pensional:<\/b> asegurar el pago del pasivo pensional. Es obligatoria en liquidaciones, acuerdos de reorganización o reestructuración, o por orden del Ministerio.<\/li>\n<li><b>Conmutación:<\/b> el empleador transfiere a un tercero (Colpensiones, AFP o aseguradora) el pago de pensiones. Puede ser total o parcial y requiere autorización de la SFC y concepto del Ministerio del Trabajo.<\/li>\n<\/ul>\n\n<h2>12. Protección al consumidor<\/h2>\n<ul>\n<li>Principios: debida diligencia, transparencia e información cierta, manejo de conflictos de interés y educación financiera.<\/li>\n<li><b>Defensor del consumidor financiero:<\/b> lo elige la asamblea de accionistas por <b>2 años<\/b> prorrogables. Atiende y resuelve gratis, es vocero y conciliador. Sus decisiones obligan si así se pactó.<\/li>\n<li><b>Queja exprés ante la SFC:<\/b> la entidad responde en máximo <b>15 días<\/b>.<\/li>\n<li><b>Acción jurisdiccional ante la SFC:<\/b> menos de 40 SMMLV, verbal sumario sin recursos; entre 40 y 150, apelación ante juez civil del circuito; más de 150, ante tribunal superior.<\/li>\n<li><b>Doble asesoría<\/b> para traslado de régimen: dentro de los <b>20 días hábiles<\/b>, con informe personalizado. La sola firma del formulario no prueba la asesoría (Corte Suprema, SL 4360 de 2019).<\/li>\n<\/ul>\n<\/ul>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto<\/span>\n<ul>\n<li>RPM: Colpensiones, fórmula, 57/62 años y 1.300 semanas.<\/li>\n<li>RAIS: AFP, cuenta individual, pensión según capital.<\/li>\n<li>Cotización 16 %: 12 % empleador, 4 % trabajador.<\/li>\n<li>Traslado: cada 5 años, nunca a 10 años o menos de la pensión.<\/li>\n<li>Reserva de estabilización: 1 % del fondo; multa de 3,5 % del defecto.<\/li>\n<li>Rentabilidad mínima: menor entre (suma − 2/3/4 %) y (suma × 0,70/0,65/0,60).<\/li>\n<li>Convergencia: 100 % conservador a los 54 (mujeres) y 59 (hombres).<\/li>\n<li>Invalidez o muerte: 50 semanas en los últimos 3 años.<\/li>\n<li>FPO voluntario: 25 % / 2.500 UVT. FVP: 30 % / 3.800 UVT.<\/li>\n<li>Cesantías: consignar hasta el 14 de febrero; intereses del 12 %.<\/li><\/ul><\/div>\n<p class=\"fuente\">Fuente: paráfrasis de la guía de estudio AMV «Fondos de pensiones» (PENS-001-2025), la Ley 100 de 1993 y el Decreto 2555 de 2010. Estado de la reforma según la sentencia C-264 de 2026 de la Corte Constitucional (prensa de agosto de 2026). Los ejemplos numéricos son propios.<\/p>\n", "port": "<span class=\"eyebrow\">Módulo 7 · 20 preguntas en el examen<\/span>\n<h1>Administración de portafolios<\/h1>\n<p>Este módulo abre el componente complementario. Cubre cuatro bloques: el proceso de inversión y el conocimiento del cliente, la teoría de portafolios (Markowitz, CAPM, APT, Fama-French), las finanzas comportamentales y la evaluación del desempeño del gestor.<\/p>\n\n<h2>1. El proceso de administración de portafolios<\/h2>\n<ol>\n<li><b>Conocimiento del cliente:<\/b> objetivos y restricciones.<\/li>\n<li><b>Definición del perfil de riesgo:<\/b> desde muy conservador hasta dinámico o agresivo.<\/li>\n<li><b>Diseño de la estrategia:<\/b> asignación de activos (asset allocation) y selección de títulos (security selection).<\/li>\n<li><b>Seguimiento:<\/b> rebalanceo, evaluación del desempeño y ajustes cuando cambia el cliente o el mercado.<\/li>\n<\/ol>\n<p>Para un inversionista institucional, la guía describe tres etapas: <b>planeación<\/b> (objetivos, IPS, expectativas de mercado), <b>ejecución<\/b> (asignación de activos y selección de títulos) y <b>retroalimentación<\/b> (seguimiento, rebalanceo y evaluación).<\/p>\n<h3>La declaración de política de inversión (IPS)<\/h3>\n<p>Es el documento que acuerda gestor y cliente. Recoge objetivos de rentabilidad y riesgo, restricciones, clases de activos permitidas, benchmark, política de rebalanceo, frecuencia de revisión y responsabilidades. Una IPS es <b>inadecuada<\/b> si es genérica, ambigua, irreal o si no se revisa cuando cambia la situación del cliente.<\/p>\n<h3>Restricciones del cliente<\/h3>\n<ul>\n<li><b>Liquidez:<\/b> necesidades de efectivo previstas o de emergencia.<\/li>\n<li><b>Horizonte:<\/b> cuándo se necesitará el dinero. Puede haber varias etapas.<\/li>\n<li><b>Fiscales:<\/b> el tratamiento tributario de cada inversión.<\/li>\n<li><b>Legales y regulatorias:<\/b> límites que impone la norma (por ejemplo, a fondos de pensiones).<\/li>\n<li><b>Circunstancias únicas:<\/b> preferencias éticas, religiosas o personales (por ejemplo, excluir armas o tabaco).<\/li>\n<\/ul>\n<h3>Capacidad y tolerancia al riesgo<\/h3>\n<div class=\"tw\"><table>\n<thead><tr><th><\/th><th>Capacidad<\/th><th>Tolerancia<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Naturaleza<\/td><td>Objetiva<\/td><td>Subjetiva (psicológica)<\/td><\/tr>\n<tr><td>Depende de<\/td><td>Ingresos, patrimonio neto, horizonte, capital humano, obligaciones<\/td><td>Actitud ante las pérdidas, experiencia, personalidad<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>Patrimonio neto<\/b> = activos − pasivos.<\/li>\n<li><b>Capital humano<\/b> = valor presente de los ingresos laborales futuros. Es alto en los jóvenes y cae con la edad.<\/li>\n<li>Si la capacidad es alta pero la tolerancia es baja, el asesor educa al cliente, pero en general respeta la medida más conservadora.<\/li>\n<\/ul>\n<h3>Objetivos típicos del inversionista individual<\/h3>\n<p>Reserva de emergencia, preservación de capital, ingreso corriente, retiro (que el portafolio dure, por ejemplo, unos 20 años de jubilación), crecimiento de capital y especulación.<\/p>\n<p><b>Tasa de retorno requerida (RRR):<\/b> por descuento de dividendos, <span class=\"f\">k = D₁/P₀ + g<\/span>; o por CAPM.<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Acción a COP 12.000, dividendo esperado COP 600, crecimiento 4 %: k = 600/12.000 + 4 % = 5 % + 4 % = <b>9 %<\/b>.<\/p><\/div>\n<h3>Asset only frente a ALM<\/h3>\n<p>En <b>asset only<\/b> se optimizan los activos sin mirar obligaciones. En <b>ALM<\/b> (asset liability management) los activos se construyen para pagar pasivos conocidos. Es el enfoque típico de aseguradoras y fondos de pensiones.<\/p>\n\n<h2>2. Clases de activos y estrategias de asignación<\/h2>\n<ul>\n<li><b>Clase de activo:<\/b> grupo de instrumentos con características y comportamiento similares: efectivo, renta fija, renta variable y alternativos.<\/li>\n<li><b>Alternativos:<\/b> capital privado, deuda privada, hedge funds, inmuebles, materias primas, coleccionables y productos estructurados. Son <b>menos líquidos, menos regulados y más costosos<\/b>, pero tienen <b>baja correlación<\/b> con los activos tradicionales.<\/li>\n<li><b>Asignación estratégica (SAA):<\/b> los pesos de largo plazo según el perfil. Es <b>pasiva<\/b>. Puede ser buy and hold (sin rebalancear) o con rebalanceo sistemático por reglas (por ejemplo, cuando un peso se desvía ±10 %), lo que se acerca a la indexación.<\/li>\n<li><b>Asignación táctica (TAA):<\/b> desviaciones temporales sobre la SAA según la visión del gestor. Es <b>activa<\/b>.<\/li>\n<li><b>Selección activa de títulos:<\/b> por análisis técnico, fundamental o información propia obtenida por investigación (nunca información privilegiada).<\/li>\n<\/ul>\n<h3>Factores de riesgo<\/h3>\n<ul>\n<li><b>Macroeconómicos<\/b> (explican retornos entre clases de activos): crecimiento, inflación, tasas de interés, crédito, liquidez.<\/li>\n<li><b>De estilo<\/b> (explican retornos dentro de una clase): valor, tamaño, momentum, calidad y mínima volatilidad.<\/li>\n<\/ul>\n<p><b>Teoría posmoderna de portafolios:<\/b> mide el riesgo a la baja (drawdown, asimetría y curtosis) y no solo la varianza, porque al inversionista le preocupan las pérdidas.<\/p>\n\n<h2>3. Rentabilidad y riesgo<\/h2>\n<ul>\n<li><b>Retorno de periodo de tenencia (HPR):<\/b> <span class=\"f\">(P₁ − P₀ + D) / P₀<\/span>.<\/li>\n<li><b>Rentabilidad esperada:<\/b> <span class=\"f\">E(R) = Σ pᵢ × Rᵢ<\/span>.<\/li>\n<li><b>Rentabilidad de un portafolio:<\/b> promedio ponderado de las rentabilidades de los activos.<\/li>\n<li><b>Riesgo:<\/b> se mide con la desviación estándar (volatilidad). El VaR aumenta con la volatilidad, con el horizonte y con el nivel de confianza.<\/li>\n<li><b>Covarianza y correlación:<\/b> miden cómo se mueven juntos dos activos. La correlación va de −1 a +1.<\/li>\n<\/ul>\n<p class=\"f\">σp² = w₁²σ₁² + w₂²σ₂² + 2·w₁·w₂·ρ·σ₁·σ₂<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Acción comprada en COP 2.500, dividendo COP 150, hoy vale COP 2.650: HPR = (2.650 − 2.500 + 150) / 2.500 = <b>12 %<\/b>.<\/p>\n<p>50 % en A (volatilidad 20 %) y 50 % en B (volatilidad 10 %), correlación 0: σ² = 0,25 × 0,04 + 0,25 × 0,01 = 0,0125, así que σ = <b>11,18 %<\/b>, menor que el promedio de 15 %. Esa diferencia es el beneficio de la diversificación.<\/p><\/div>\n\n<h2>4. Diversificación y Markowitz<\/h2>\n<ul>\n<li>Riesgo total = <b>sistemático<\/b> (de mercado, no diversificable) + <b>no sistemático<\/b> (específico o idiosincrático, diversificable).<\/li>\n<li>Según Statman (1987), se necesitan unas <b>30 acciones<\/b> para eliminar la mayor parte del riesgo específico.<\/li>\n<li><b>Supuestos de Markowitz (1952):<\/b> inversionistas racionales y adversos al riesgo que deciden solo con media y varianza en un periodo.<\/li>\n<li><b>Dominancia:<\/b> un portafolio domina a otro si da más rentabilidad con el mismo riesgo o menos riesgo con la misma rentabilidad. Los no dominados forman la <b>frontera eficiente<\/b>, cuyo punto de menor riesgo es el <b>portafolio de mínima varianza<\/b>.<\/li>\n<li>Correlación <b>+1<\/b>: no hay beneficio de diversificación. Correlación <b>−1<\/b>: existe una mezcla con riesgo cero.<\/li>\n<li>Con n activos hay que estimar <span class=\"f\">n(n−1)/2<\/span> covarianzas: 50 activos dan 1.225 covarianzas. Esta carga de cálculo motivó modelos más simples. (La guía menciona 12.250 para el S&amp;P 500; por la fórmula, 500 activos dan 124.750.)<\/li>\n<li><b>Tobin (1958):<\/b> combinar el activo libre de riesgo con una única cartera riesgosa (teorema de separación).<\/li>\n<li><b>Línea del mercado de capitales (CML):<\/b> une rf con el portafolio de mercado. Supone que se puede prestar y pedir prestado a rf. A la izquierda del mercado se presta; a la derecha se apalanca. Su pendiente es el Sharpe del mercado.<\/li>\n<li><b>Black-Litterman (1990):<\/b> parte del equilibrio del mercado y lo ajusta con las visiones del inversionista, lo que da asignaciones más estables.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>60 % en el portafolio de mercado (14 %, σ 18 %) y 40 % en rf (6 %): E(R) = 6 % + 0,6 × 8 % = <b>10,8 %<\/b>; σ = 0,6 × 18 % = <b>10,8 %<\/b>.<\/p><\/div>\n\n<h2>5. CAPM, APT y Fama-French<\/h2>\n<p class=\"f\">E(R) = rf + β × (Rm − rf)<\/p>\n<ul>\n<li>Desarrollado por <b>Sharpe, Lintner y Black<\/b>. Supone mercados sin fricciones, expectativas homogéneas, préstamo a rf e inversionistas que optimizan por media y varianza.<\/li>\n<li>En Colombia, una forma de estimar rf en pesos es: bono del Tesoro de EE. UU. + riesgo país + devaluación esperada. También se usan los TES.<\/li>\n<li>La <b>beta del mercado es 1<\/b>. Una beta menor que 1 es <b>defensiva<\/b> y una mayor que 1 es <b>agresiva o cíclica<\/b>. La beta de un portafolio es el promedio ponderado de las betas.<\/li>\n<li>El mercado solo remunera el riesgo sistemático.<\/li>\n<li><b>SML<\/b> (línea del mercado de valores): rentabilidad contra <b>beta<\/b>; aplica a cualquier activo. Un activo por encima de la línea tiene alfa positivo (está subvalorado). <b>CML<\/b>: rentabilidad contra <b>σ<\/b>; aplica solo a portafolios eficientes.<\/li>\n<li><b>APT (Ross, 1976):<\/b> varios factores de riesgo explican el retorno. Su supuesto central es que <b>no existen oportunidades de arbitraje<\/b>.<\/li>\n<li><b>Fama-French (1992-1993):<\/b> mercado + <b>SMB<\/b> (pequeñas menos grandes) + <b>HML<\/b> (alto menos bajo valor en libros/valor de mercado).<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>rf = 5 %, Rm = 12 %, β = 1,2: E(R) = 5 % + 1,2 × 7 % = <b>13,4 %<\/b>.<\/p><\/div>\n<h3>Hipótesis de mercados eficientes (Fama, 1970; Nobel 2013)<\/h3>\n<div class=\"tw\"><table>\n<thead><tr><th>Forma<\/th><th>Los precios reflejan<\/th><th>No da ganancias anormales<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Débil<\/td><td>Precios históricos<\/td><td>Análisis técnico<\/td><\/tr>\n<tr><td>Semifuerte<\/td><td>Toda la información pública<\/td><td>Técnico y fundamental<\/td><\/tr>\n<tr><td>Fuerte<\/td><td>Toda la información, incluida la privada<\/td><td>Ni siquiera la información privada<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>6. Finanzas comportamentales<\/h2>\n<p><b>Teoría prospectiva (Kahneman y Tversky, 1979):<\/b> las personas valoran los resultados frente a un punto de referencia y una pérdida duele entre 2 y 2,5 veces más que una ganancia igual.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Sesgo<\/th><th>Tipo<\/th><th>Cómo se ve<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Disponibilidad<\/td><td>Heurística<\/td><td>Sobreestimar lo reciente o fácil de recordar<\/td><\/tr>\n<tr><td>Confirmación<\/td><td>Cognitivo<\/td><td>Buscar solo información que apoya lo que ya se cree<\/td><\/tr>\n<tr><td>Representatividad<\/td><td>Cognitivo<\/td><td>Juzgar por estereotipos (\"buena empresa = buena inversión\")<\/td><\/tr>\n<tr><td>Conservatismo<\/td><td>Cognitivo<\/td><td>Ajustar demasiado poco ante información nueva<\/td><\/tr>\n<tr><td>Dependencia de la forma (framing)<\/td><td>Cognitivo<\/td><td>Decidir distinto según cómo se presenta lo mismo<\/td><\/tr>\n<tr><td>Exceso de confianza<\/td><td>Emocional<\/td><td>Operar en exceso y perder por costos (Barber y Odean)<\/td><\/tr>\n<tr><td>Status quo<\/td><td>Emocional<\/td><td>Dejar todo igual por comodidad<\/td><\/tr>\n<tr><td>Aversión a la pérdida<\/td><td>Emocional<\/td><td>Mantener las perdedoras y vender pronto las ganadoras<\/td><\/tr>\n<tr><td>Manada<\/td><td>Emocional<\/td><td>Imitar a la mayoría sin análisis propio<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Los sesgos cognitivos se corrigen con información. Con los emocionales, a menudo conviene adaptar la recomendación.<\/p>\n\n<h2>7. Índices, ETF y gestión activa o pasiva<\/h2>\n<ul>\n<li><b>Índices:<\/b> el primero fue el Dow Jones (1896). Se ponderan por capitalización, por capital flotante, por igual peso o por precio, y se recomponen periódicamente (trimestral o anual).<\/li>\n<li><b>MSCI COLCAP:<\/b> inició el 15 de enero de 2008 con base 1.000. Se recompone en enero, abril, julio y octubre.<\/li>\n<li><b>ETF:<\/b> fondo que cotiza en bolsa durante toda la jornada y suele replicar un índice a bajo costo. El primer fondo indexado minorista fue de Vanguard (1976).<\/li>\n<li><b>Gestión activa:<\/b> busca alfa, pero cuesta más y puede rentar menos que el índice. <b>Pasiva:<\/b> replica el índice con bajo costo y baja rotación.<\/li>\n<li><b>Gestión discrecional:<\/b> el gestor decide dentro de un mandato, como en el contrato de APT.<\/li>\n<li><b>Inmunización:<\/b> igualar la duración del portafolio de renta fija con el horizonte de inversión.<\/li>\n<li><b>Coberturas:<\/b> totales (todo el riesgo), selectivas (parte) o activas (se ajustan según la visión de mercado).<\/li>\n<\/ul>\n\n<h2>8. Evaluación del desempeño<\/h2>\n<p><b>Un buen benchmark<\/b> es preciso, replicable (invertible), medible, apropiado al estilo del gestor y se define <b>antes<\/b> del periodo. Puede ser un índice de mercado, uno de estrategia o uno combinado (por ejemplo, 50 % MSCI COLCAP y 50 % COLTES para un portafolio mixto).<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Medida<\/th><th>Fórmula<\/th><th>Tipo<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Retorno y volatilidad<\/td><td>Rp, σp<\/td><td>Absoluta<\/td><\/tr>\n<tr><td>Alfa (exceso)<\/td><td>Rp − Rb<\/td><td>Relativa<\/td><\/tr>\n<tr><td>Beta<\/td><td>Sensibilidad al mercado<\/td><td>Relativa<\/td><\/tr>\n<tr><td>Tracking error<\/td><td>Desviación estándar de (Rp − Rb)<\/td><td>Relativa<\/td><\/tr>\n<tr><td>Sharpe<\/td><td>(Rp − rf) / σp<\/td><td>Ajustada por riesgo total<\/td><\/tr>\n<tr><td>Treynor<\/td><td>(Rp − rf) / βp<\/td><td>Ajustada por riesgo sistemático<\/td><\/tr>\n<tr><td>Alfa de Jensen<\/td><td>Rp − [rf + βp(Rm − rf)]<\/td><td>Ajustada por riesgo (CAPM)<\/td><\/tr>\n<tr><td>Razón de información<\/td><td>Alfa / tracking error<\/td><td>Calidad de la gestión activa<\/td><\/tr>\n<tr><td>Drawdown máximo<\/td><td>Mayor caída desde un máximo<\/td><td>Riesgo a la baja<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Lectura de la razón de información:<\/b> negativa significa que no hubo alfa; entre 0,40 y 0,60 es aceptable; por encima de 1 es poco común y sobresaliente.<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto (caso propio)<\/span>\n<p>Un FIC rentó 15 %, su benchmark 13 %, rf = 6 %, σ = 10 %, β = 1,2 y tracking error 2,5 %.<\/p>\n<ul>\n<li>Sharpe = 9 % / 10 % = <b>0,90<\/b><\/li>\n<li>Treynor = 9 % / 1,2 = <b>7,5 %<\/b><\/li>\n<li>Alfa = 15 % − 13 % = <b>2 %<\/b><\/li>\n<li>Razón de información = 2 % / 2,5 % = <b>0,80<\/b><\/li>\n<\/ul><\/div>\n<p>Para evaluar al gestor se usa la <b>rentabilidad ponderada por tiempo<\/b>, que elimina el efecto de los aportes y retiros del cliente. La <b>ponderada por dinero<\/b> (la TIR de los flujos del cliente) mide la experiencia del inversionista.<\/p>\n<h3>Atribución del desempeño<\/h3>\n<p>El alfa se descompone en lo que aportó la <b>asignación de activos<\/b> y lo que aportó la <b>selección de títulos<\/b>. También existe un efecto de interacción entre ambas.<\/p>\n<p class=\"f\">Contribución = (peso en el portafolio − peso en el benchmark) × (retorno de la clase − retorno total del benchmark)<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Benchmark 50 % acciones / 50 % TES. El gestor invierte 70 % / 30 %. Las acciones rentan 12 % y los TES 8 %, así que el benchmark renta 10 %.<\/p>\n<ul>\n<li>Acciones: (+20 %) × (12 % − 10 %) = +0,40 %<\/li>\n<li>TES: (−20 %) × (8 % − 10 %) = +0,40 %<\/li>\n<li>Alfa por asignación = <b>0,80 %<\/b>. Se comprueba: el portafolio rinde 0,7 × 12 % + 0,3 × 8 % = 10,8 %, que es 0,8 % más que el benchmark.<\/li>\n<\/ul>\n<p>Selección: si sobrepondera una acción en 5 % y esta renta 18 % frente a un índice de 10 %, aporta 5 % × 8 % = <b>0,40 %<\/b> de alfa.<\/p><\/div>\n\n<h2>9. Valoración de acciones<\/h2>\n<ul>\n<li><b>Análisis fundamental:<\/b> valor intrínseco a partir de la situación de la empresa. <b>Técnico:<\/b> patrones de precios y volúmenes.<\/li>\n<li><b>Modelo de Gordon:<\/b> <span class=\"f\">P = D₁ / (k − g)<\/span>. Con D₁ = 500, k = 12 % y g = 2 %: P = 500 / 0,10 = <b>5.000<\/b>.<\/li>\n<\/ul>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto<\/span>\n<ul>\n<li>Proceso: conocer al cliente, perfil, estrategia, seguimiento. La IPS lo documenta.<\/li>\n<li>Restricciones: liquidez, horizonte, fiscales, legales y circunstancias únicas.<\/li>\n<li>Capacidad = objetiva; tolerancia = subjetiva.<\/li>\n<li>SAA = pasiva y de largo plazo; TAA = activa y temporal.<\/li>\n<li>Alternativos: menos líquidos, menos regulados, más caros, baja correlación.<\/li>\n<li>CAPM: rf + β(Rm − rf). SML usa β; CML usa σ.<\/li>\n<li>APT: multifactorial, sin arbitraje. Fama-French: mercado + SMB + HML.<\/li>\n<li>Eficiencia débil / semifuerte / fuerte: precios pasados / información pública / toda la información.<\/li>\n<li>Pérdidas pesan unas 2,5 veces más que las ganancias (teoría prospectiva).<\/li>\n<li>Sharpe usa σ; Treynor usa β; razón de información = alfa / TE.<\/li>\n<li>Atribución: (Δ peso) × (retorno de la clase − retorno del benchmark).<\/li>\n<\/ul><\/div>\n<p class=\"fuente\">Fuente: paráfrasis de la guía de estudio AMV «Administración de portafolios» (ADDP-002-2025). Los ejemplos numéricos son propios.<\/p>\n", "reg": "<span class=\"eyebrow\">Módulo 1 · 30 preguntas en el examen<\/span>\n<h1>Regulación del mercado de valores<\/h1>\n<p>Es el módulo con más peso del componente básico: 30 de las 110 preguntas. Cubre qué es un valor, quién lo puede emitir y negociar, qué operaciones existen, quién supervisa el mercado, cómo se previene el lavado de activos y cómo funciona la asesoría. Las normas base son la Ley 964 de 2005 (ley marco del mercado de valores), el Estatuto Orgánico del Sistema Financiero (EOSF) y el Decreto 2555 de 2010, que compila la regulación.<\/p>\n<div class=\"box clave\"><span class=\"tag\">Cómo estudiar este módulo<\/span>\n<p>El examen pregunta mucho por <b>cifras exactas<\/b> (umbrales, plazos, porcentajes) y por <b>quién puede hacer qué<\/b>. Al final hay un repaso con todas las cifras. Léelo varias veces antes del simulacro.<\/p><\/div>\n\n<h2>1. Conceptos generales<\/h2>\n<h3>Qué es un valor<\/h3>\n<p>Según el artículo 2 de la Ley 964 de 2005, un valor es <b>todo derecho de naturaleza negociable que haga parte de una emisión, cuando tenga por objeto o efecto la captación de recursos del público<\/b>. Las tres condiciones deben darse a la vez.<\/p>\n<ul>\n<li><b>Son valores<\/b> (lista enunciativa, no taxativa): acciones, bonos, CDT, papeles comerciales, aceptaciones bancarias, cédulas hipotecarias, títulos de deuda pública, títulos de titularización, certificados de depósito de mercancías, títulos de capital de riesgo, derivados estandarizados y valores de financiación colaborativa.<\/li>\n<li><b>No son valores:<\/b> las pólizas de seguros y los títulos de capitalización.<\/li>\n<li>Los derivados son valores cuando están estandarizados y pueden negociarse en bolsa o en un sistema de negociación. El Gobierno puede dar calidad de valor a derivados de energía o gas, informando antes a la CREG.<\/li>\n<li>Los valores tienen las prerrogativas de los títulos valores, <b>excepto la acción cambiaria de regreso<\/b>. No procede acción reivindicatoria contra quien los adquiera de buena fe exenta de culpa.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead><tr><th>Clasificación<\/th><th>Tipos<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Por forma de transferencia<\/td><td><b>Nominativos<\/b> (se inscriben en el registro del emisor), <b>a la orden<\/b> (endoso y entrega), <b>al portador<\/b> (solo entrega; únicamente cuando la ley lo autoriza)<\/td><\/tr>\n<tr><td>Por el derecho que incorporan<\/td><td><b>De deuda<\/b> (bonos, papeles, TES), <b>de participación<\/b> (acciones, participaciones en FIC), <b>de tradición<\/b> o representativos de mercancías (CDM, bonos de prenda)<\/td><\/tr>\n<tr><td>Por el rendimiento<\/td><td><b>Renta fija<\/b> (flujo de pagos previamente establecido, a tasa fija o variable) y <b>renta variable<\/b> (depende del desempeño del emisor)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h3>Actividades del mercado de valores<\/h3>\n<p>El artículo 3 de la Ley 964 enumera: emisión y oferta, intermediación, administración de fondos, depósito y administración de valores, administración de sistemas de negociación o registro, compensación y liquidación, calificación de riesgos, autorregulación, asesoría y suministro de información. Solo pueden ejercerlas entidades constituidas en Colombia, salvo la emisión y oferta y el suministro de información. Todas están sujetas a supervisión del Estado.<\/p>\n\n<h3>Oferta pública de valores (OPV)<\/h3>\n<p>Es la que se dirige a <b>personas no determinadas o a cien (100) o más personas determinadas<\/b> (art. 6.1.1.1.1 del Decreto 2555). Por regla general exige inscribir valor y emisor en el RNVE y autorización de la SFC.<\/p>\n<ul>\n<li>En el <b>mercado secundario<\/b> la oferta pública solo se dirige a personas <b>no determinadas<\/b> y no puede exigir cantidades mínimas ni máximas.<\/li>\n<li><b>No son oferta pública:<\/b> la oferta de acciones o BOCEAS a los accionistas cuando son <b>menos de 500<\/b>; la capitalización ordenada por una autoridad; los programas de beneficios para empleados o junta; las emisiones de financiación colaborativa.<\/li>\n<li>Toda compraventa de acciones inscritas por <b>66.000 UVR o más<\/b> debe hacerse por los sistemas de la bolsa, salvo excepciones (mismo beneficiario real, readquisición, ventas de la Nación o Fogafín, entidades en liquidación, entre otras).<\/li>\n<li>La OPA y la oferta para democratización son las únicas OPV del mercado secundario con trámite especial.<\/li>\n<\/ul>\n<div class=\"box trampa\"><span class=\"tag\">Trampa típica<\/span>\n<p>El umbral es de 100 personas <b>determinadas<\/b>. Si la oferta va a personas indeterminadas, es pública sin importar el número.<\/p><\/div>\n\n<h3>Emisores y régimen de información<\/h3>\n<p>Pueden ser emisores, entre otros: sociedades por acciones, SAS, limitadas, cooperativas, entidades sin ánimo de lucro, la Nación y entidades públicas, gobiernos extranjeros, multilaterales, sucursales de extranjeras, patrimonios autónomos, FIC y universalidades de titularización. La inscripción en el RNVE <b>no implica calificación ni responsabilidad de la SFC<\/b> sobre el emisor o el valor.<\/p>\n<ul>\n<li><b>Prospecto:<\/b> datos del emisor, del valor y de la oferta; se publica en la web del emisor, de la SFC y del sistema de negociación.<\/li>\n<li><b>Información periódica<\/b> (Decreto 151 de 2021): un informe de <b>fin de ejercicio<\/b> y un informe <b>trimestral<\/b>, con estados financieros, riesgos y prácticas de sostenibilidad.<\/li>\n<li><b>Información relevante:<\/b> la que un inversionista prudente y diligente tendría en cuenta para comprar, vender o conservar el valor o ejercer derechos políticos. Se publica <b>de inmediato<\/b> en la web de la SFC. La SFC puede autorizar no divulgarla si causaría perjuicio; mientras tanto es información privilegiada.<\/li>\n<\/ul>\n\n<h2>2. Principales valores<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Valor<\/th><th>Emisor<\/th><th>Lo que más preguntan<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Acción ordinaria<\/td><td>Sociedades por acciones<\/td><td>Dividendo, voto e inspección de libros<\/td><\/tr>\n<tr><td>Acción privilegiada<\/td><td>Sociedades por acciones<\/td><td>Derechos de la ordinaria más un privilegio económico y prioridad en el reembolso<\/td><\/tr>\n<tr><td>Acción preferencial sin voto<\/td><td>Sociedades por acciones<\/td><td>Prioridad en dividendos y en reembolso, sin voto<\/td><\/tr>\n<tr><td>CDT<\/td><td>Bancos, corporaciones financieras, compañías de financiamiento, cooperativas financieras<\/td><td>Nominativo, no redimible antes del vencimiento; si no se cobra se prorroga por el mismo plazo<\/td><\/tr>\n<tr><td>Bonos<\/td><td>Empresas, bancos, entidades públicas<\/td><td>Plazo mínimo de 1 año; monto mínimo de 52.626,04 UVT para inscribirse; representante legal de tenedores<\/td><\/tr>\n<tr><td>Papeles comerciales<\/td><td>Sociedades<\/td><td>Pagarés de más de 15 días y menos de 1 año; rotativa hasta 2 años; no para comprar acciones<\/td><\/tr>\n<tr><td>Aceptaciones bancarias<\/td><td>Bancos, corporaciones financieras, compañías de financiamiento<\/td><td>Letra de cambio aceptada por el banco en compraventas de bienes; plazo máximo 1 año<\/td><\/tr>\n<tr><td>TES<\/td><td>Ministerio de Hacienda (los administra el Banco de la República)<\/td><td>Ley 51 de 1990; a la orden. Clase A: sustituyen deuda de OMA. Clase B: financian el presupuesto<\/td><\/tr>\n<tr><td>Titularizaciones<\/td><td>Patrimonio autónomo o FIC<\/td><td>Originadora, agente de manejo, administradora y colocadora<\/td><\/tr>\n<tr><td>Certificado de depósito de mercancías<\/td><td>Almacenes generales de depósito<\/td><td>Bono de prenda: capital más rendimiento ≤ 70 % del certificado<\/td><\/tr>\n<tr><td>Valores de financiación colaborativa<\/td><td>SOFICO o bolsas (ej. a2censo)<\/td><td>No son OPV, no van al RNVE, no son intermediación<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>Detalles de acciones<\/h3>\n<ul>\n<li><b>Derecho de preferencia:<\/b> permite mantener la participación en nuevas emisiones, pero <b>no opera en la negociación de acciones inscritas en bolsa<\/b>.<\/li>\n<li><b>Período exdividendo:<\/b> entre el primer día hábil de pago del dividendo y los <b>cuatro días hábiles bursátiles anteriores<\/b>. Quien compra en ese período no recibe el dividendo: es del vendedor.<\/li>\n<\/ul>\n<h3>Detalles de bonos<\/h3>\n<ul>\n<li>El <b>representante legal de tenedores<\/b> (bancos, corporaciones financieras o fiduciarias) lo designa y lo paga el emisor; la asamblea de tenedores puede cambiarlo. Tiene voz pero no voto en la asamblea de accionistas del emisor.<\/li>\n<li>Un emisor en mora con sus bonos <b>no puede repartir dividendos<\/b>.<\/li>\n<li><b>Convertibles:<\/b> no se colocan por debajo del valor nominal. Los BOCEAS se convierten obligatoriamente; en los facultativos decide el inversionista. El emisor debe reservar las acciones.<\/li>\n<li><b>Bonos hipotecarios<\/b> (Ley 546 de 1999): obligación directa del emisor aunque estén respaldados por cartera. <b>Bonos de riesgo:<\/b> empresas en reestructuración, sin obligación de representante de tenedores.<\/li>\n<li>Desde 2024 los montos en SMMLV o UVT de operaciones financieras se convierten a <b>UVB<\/b> (Ley 2294 de 2023).<\/li>\n<\/ul>\n<h3>Financiación colaborativa<\/h3>\n<p>Aportante calificado: patrimonio ≥ 263.130,20 UVT, portafolio ≥ 131.565,10 UVT, operador certificado, entidad vigilada o multilateral. El proyecto debe financiarse en <b>máximo 6 meses<\/b>; si no logra el mínimo, el dinero se devuelve en <b>máximo 30 días<\/b>.<\/p>\n\n<h2>3. Clasificación del mercado y su infraestructura<\/h2>\n<ul>\n<li><b>Mostrador (OTC):<\/b> bilateral, fuera de los sistemas; la información es fragmentada. Las operaciones deben <b>registrarse<\/b> en un sistema de registro: en corretaje registra el intermediario; entre afiliado y no afiliado registra el afiliado. No registrar a tiempo atenta contra la integridad del mercado.<\/li>\n<li><b>Organizado:<\/b> multilateral, \"ciego\", con transparencia antes y después de negociar. Los principales sistemas son el <b>MEC<\/b> (BVC) y el <b>SEN<\/b> (Banco de la República).<\/li>\n<li><b>Primario<\/b> (el emisor coloca por primera vez) y <b>secundario<\/b> (entre inversionistas).<\/li>\n<li><b>Principal<\/b> (público en general) y <b>segundo mercado<\/b> (solo inversionistas profesionales, requisitos menos estrictos; no exige calificación).<\/li>\n<\/ul>\n<h3>Compensación y liquidación<\/h3>\n<p>Etapas: <b>cierre<\/b> (acuerdo de términos), <b>compensación<\/b> (cálculo de obligaciones, bruta, por saldos netos o con contraparte central) y <b>liquidación<\/b> (entrega definitiva). Pueden administrar estos sistemas las CRCC, las bolsas, el Banco de la República, los depósitos y entidades constituidas para ello.<\/p>\n<ul>\n<li><b>Principio de finalidad<\/b> (art. 10 Ley 964): la orden aceptada es <b>firme, irrevocable, exigible y oponible<\/b> frente a terceros.<\/li>\n<li>Las <b>garantías<\/b> entregadas al sistema no pueden embargarse hasta que se cumplan las obligaciones (art. 11).<\/li>\n<\/ul>\n\n<h2>4. Intermediación y clientes<\/h2>\n<p>Son intermediarios las <b>entidades vigiladas por la SFC con acceso directo a un sistema de negociación o de registro<\/b>. Se inscriben en el RNAMV y sus funcionarios en el RNPMV. Deben obrar como <b>expertos prudentes y diligentes<\/b>, con transparencia, honestidad, lealtad, imparcialidad, idoneidad y profesionalismo.<\/p>\n<h3>Clases de clientes<\/h3>\n<div class=\"tw\"><table>\n<thead><tr><th>Categoría<\/th><th>Requisitos<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Cliente inversionista<\/td><td>Todo el que no es profesional. Recibe la máxima protección y el deber de asesoría.<\/td><\/tr>\n<tr><td>Inversionista profesional (art. 7.2.1.1.2)<\/td><td>Patrimonio ≥ <b>157.878,12 UVT<\/b> y además: portafolio ≥ <b>78.939,06 UVT<\/b>, o <b>15 o más operaciones en 60 días<\/b> (dentro de los 2 años previos) por ≥ <b>552.573,41 UVT<\/b><\/td><\/tr>\n<tr><td>Profesional por definición (art. 7.2.1.1.3)<\/td><td>Operadores con certificación vigente, entidades vigiladas por la SFC, organismos financieros extranjeros y multilaterales, profesionales calificados en la Alianza del Pacífico<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>El profesional puede pedir trato de cliente inversionista, en general o para un tipo de operación, por escrito verificable. Si dos intermediarios operan entre sí, solo es cliente el que actúa por comisión o corretaje.<\/p>\n<h3>Deberes especiales de los intermediarios<\/h3>\n<ul>\n<li><b>Información:<\/b> objetiva, oportuna, completa, imparcial, clara y previa a la primera operación (naturaleza, riesgos, tarifas).<\/li>\n<li><b>Conflictos de interés:<\/b> políticas aprobadas por la junta, en el código de buen gobierno; separación decisoria, física y operativa. <b>Vinculado:<\/b> accionista o beneficiario real del <b>10 %<\/b> o más, sociedades donde el intermediario tenga el 10 % o más, matriz, filiales, subordinadas y administradores.<\/li>\n<li><b>Documentación<\/b> de órdenes y operaciones; <b>reserva<\/b>; <b>separación de activos<\/b> (los recursos de clientes no son prenda de los acreedores del intermediario); <b>valoración<\/b> a precios de mercado.<\/li>\n<li><b>Mejor ejecución:<\/b> para el cliente inversionista se mide por el precio o tasa <b>neto de costos<\/b>; para los demás también por tiempo, probabilidad y volumen.<\/li>\n<li><b>Asesoría:<\/b> aplica en asesoría como actividad principal, comisión y corretaje, APT, distribución de FIC, vinculación a FVP, fiducia de inversión y cuentas de margen.<\/li>\n<\/ul>\n\n<h2>5. Actividades de intermediación<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Actividad<\/th><th>Clave para el examen<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Contrato de comisión<\/td><td>En <b>nombre propio y por cuenta ajena<\/b>. Mandato no representativo, consensual, obligación <b>de medio<\/b>. Se perfecciona al recibir la orden. Solo SCB y comisionistas<\/td><\/tr>\n<tr><td>Corretaje<\/td><td>El corredor acerca a las partes <b>sin estar vinculado<\/b> a ellas (art. 1340 C. Co.)<\/td><\/tr>\n<tr><td>Cuenta propia<\/td><td>Con recursos propios. En el primario: colocación <b>en firme<\/b> (suscribe y revende), <b>garantizada<\/b> (suscribe el remanente) o al <b>mejor esfuerzo<\/b><\/td><\/tr>\n<tr><td>Distribución<\/td><td>El operador de distribución es contraparte de clientes en OTC, sin discrecionalidad para tomar posiciones<\/td><\/tr>\n<tr><td>APT<\/td><td>La SCB administra el portafolio de un cliente; extracto <b>mensual<\/b> con valor, rentabilidad neta y composición<\/td><\/tr>\n<tr><td>Fiducia de inversión<\/td><td>La fiduciaria es vocera del patrimonio autónomo; no asume obligaciones de resultado<\/td><\/tr>\n<tr><td>Administración de valores<\/td><td>La SCB cobra capital y rendimientos y reinvierte; responde hasta por <b>culpa leve<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>Órdenes y LEO<\/h3>\n<p>Las SCB registran las órdenes de terceros en el <b>libro electrónico de órdenes (LEO)<\/b>, en orden cronológico y consecutivo, con principios de trazabilidad, equidad, revelación e integridad. Las órdenes se reciben por medios verificables (verbal grabado, escrito o digital). Pueden ingresarlas directivos, digitadores, operadores y asesores certificados.<\/p>\n<h3>Cuentas de margen<\/h3>\n<ul>\n<li>Permiten comprar de contado por <b>montos mayores a los recursos aportados<\/b>; las posiciones se liquidan con repos, simultáneas o TTV.<\/li>\n<li>Solo las hacen <b>SCB<\/b> (comisión o APT) y <b>fiduciarias<\/b>, en sistemas de negociación y sobre valores de alta liquidez.<\/li>\n<li><b>Llamado al margen:<\/b> cuando el margen cae por debajo del <b>50 %<\/b> del requerido. Si el cliente no lo atiende, el cierre de posiciones es obligatorio.<\/li>\n<li>Prohibido: que la sociedad decida discrecionalmente, y que las personas inscritas en el RNPMV tengan cuentas de margen.<\/li>\n<\/ul>\n<h3>Financiación de valores (SCB)<\/h3>\n<p>Pasivos para financiar valores ≤ <b>3 veces el patrimonio técnico<\/b>; garantía ≥ <b>100 %<\/b> del préstamo; los valores en garantía se reciben como máximo al <b>80 %<\/b> de su valor; acciones de alta o media bursatilidad.<\/p>\n<h3>APT: prohibiciones más preguntadas<\/h3>\n<p>Invertir en valores emitidos o garantizados por la propia SCB; dar liquidez a sus vinculadas; comprar para el portafolio valores de una colocación en firme o garantizada antes de que termine; operar con socios, empleados y sus parientes o sociedades donde tengan el 25 % o más; representar en asambleas las acciones del portafolio; otorgar gravámenes sin autorización.<\/p>\n\n<h2>6. Manejo de recursos de terceros<\/h2>\n<ul>\n<li><b>FIC:<\/b> los administran SCB, fiduciarias y SAI. Abiertos (redención en cualquier momento, con posible pacto de permanencia) o cerrados (redención al final). Si el reglamento no dice nada, se presume abierto.\n<ul>\n<li>Mercado monetario: abierto sin pacto, valores en pesos con grado de inversión, plazo promedio ponderado ≤ <b>365 días<\/b>.<\/li>\n<li>Bursátiles (ETF): replican un índice.<\/li>\n<li>Capital privado (FCP): cerrados, al menos <b>2/3<\/b> en activos distintos de valores RNVE.<\/li>\n<li>Inmobiliarios: cerrados, al menos <b>75 %<\/b> en inmuebles (no exigible los primeros 6 meses).<\/li>\n<li>Familia de fondos: solo el <b>primer<\/b> fondo requiere autorización de la SFC.<\/li>\n<\/ul><\/li>\n<li><b>Fondos mutuos de inversión<\/b> (Decreto 2968 de 1960): aportes de trabajadores y empresa; acciones y BOCEAS ≤ 80 % del activo; repos, simultáneas y TTV ≤ 30 %.<\/li>\n<li><b>Pensiones obligatorias:<\/b> multifondos conservador, moderado, mayor riesgo y retiro programado. La AFP garantiza la rentabilidad mínima con su patrimonio y la reserva de estabilización.<\/li>\n<li><b>Cesantías:<\/b> cada AFC tiene un solo fondo con dos portafolios: corto plazo y largo plazo (más de 1 año).<\/li>\n<li><b>Fondos voluntarios (FVP):<\/b> los administran fiduciarias, AFP y aseguradoras; desde el Decreto 1207 de 2020 siguen reglas de FIC. Alternativas <b>estandarizadas<\/b> (la administradora decide portafolios y porcentajes), <b>flexibles<\/b> (la administradora elige portafolios y el partícipe los porcentajes) y <b>autogestionadas<\/b> (el cliente decide todo).<\/li>\n<\/ul>\n\n<h2>7. Tipos de operaciones<\/h2>\n<ul>\n<li><b>Contado:<\/b> de T+0 a T+3 (días hábiles desde el día siguiente al registro). <b>Plazo:<\/b> T+4 en adelante.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead><tr><th><\/th><th>Repo<\/th><th>Simultánea<\/th><th>TTV<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Partes<\/td><td>Enajenante y adquirente<\/td><td>Enajenante y adquirente<\/td><td>Originador y receptor<\/td><\/tr>\n<tr><td>Contraprestación<\/td><td>Dinero<\/td><td>Dinero<\/td><td>Otros valores o dinero de igual o mayor valor, o garantía<\/td><\/tr>\n<tr><td>Descuento (haircut) en el monto inicial<\/td><td><b>Sí puede<\/b><\/td><td><b>No<\/b><\/td><td>Según reglamento<\/td><\/tr>\n<tr><td>Sustituir los valores<\/td><td><b>Sí<\/b><\/td><td><b>No<\/b><\/td><td>No<\/td><\/tr>\n<tr><td>Restringir la movilidad<\/td><td><b>Sí<\/b><\/td><td><b>No<\/b><\/td><td>Sobre los valores que entrega el receptor<\/td><\/tr>\n<tr><td>Plazo máximo<\/td><td colspan=\"3\">1 año, <b>salvo que una CRCC se interponga<\/b> como contraparte<\/td><\/tr>\n<tr><td>Rendimientos durante la operación<\/td><td colspan=\"3\">Se transfieren al dueño original el mismo día del pago<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>Venta en corto:<\/b> vender lo que no se tiene. En Colombia, en la práctica, solo en renta fija. Se cubre a más tardar el mismo día; en acciones, el precio no puede ser inferior al último que marcó precio.<\/li>\n<li><b>Derivados:<\/b> se usan para cobertura, especulación o arbitraje. Forward (a la medida), futuro (estandarizado, en bolsa, con CRCC), swap (IRS y CCS; otros subyacentes son exóticos) y opción (derecho, no obligación). Costo de reposición = precio justo si es positivo, si no cero. Exposición crediticia = costo de reposición + exposición potencial futura. Solo las SCB hacen derivados por cuenta de terceros vía comisión.<\/li>\n<li><b>Estructurados:<\/b> uno o más no derivados más uno o más derivados. Si un componente es valor, el producto es valor.<\/li>\n<li><b>Carrusel:<\/b> operación estructurada en la que varios inversionistas se suceden en la tenencia de un mismo título, cada uno por un tramo del plazo.<\/li>\n<\/ul>\n<h3>Oferta pública de adquisición (OPA)<\/h3>\n<ul>\n<li>Obligatoria para convertirse en beneficiario real del <b>25 % o más<\/b> del capital con derecho a voto de una sociedad inscrita en bolsa.<\/li>\n<li>Quien ya tiene el 25 % o más solo puede aumentar en <b>más del 5 %<\/b> mediante OPA.<\/li>\n<li>La OPA debe cubrir al menos el <b>5 %<\/b> del capital con voto; requiere autorización de la SFC y una garantía ante la bolsa.<\/li>\n<li>No es obligatoria con aceptación escrita del 100 % de los accionistas, en privatizaciones, readquisición, emisión de capital con voto, capitalización de acreencias, donación, sucesión, orden judicial, liquidación o dación en pago.<\/li>\n<li>Democratización: acciones inscritas en bolsa con al menos <b>6 meses<\/b> de antelación y libres de gravámenes.<\/li>\n<\/ul>\n\n<h2>8. Participantes e infraestructura<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Entidad<\/th><th>Lo que más preguntan<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Bancos<\/td><td>Captan en cuenta corriente; colocan deuda pública; colocación de deuda de entes territoriales o extranjeros hasta el 10 % del capital y reservas<\/td><\/tr>\n<tr><td>Fiduciarias<\/td><td>Fiducia mercantil y encargos; representación de tenedores; administran FIC y FVP<\/td><\/tr>\n<tr><td>AFPC<\/td><td>Objeto exclusivo; 3 fondos + retiro programado; un fondo de cesantías con 2 portafolios<\/td><\/tr>\n<tr><td>SCB<\/td><td>Sociedades anónimas; comisión, corretaje, cuenta propia, APT, administración de valores, FIC, financiación de valores, repos<\/td><\/tr>\n<tr><td>Corporaciones financieras<\/td><td>Promueven empresas; suscriben acciones; colocan emisiones; representan tenedores<\/td><\/tr>\n<tr><td>Compañías de financiamiento<\/td><td>Depósitos a término, leasing, factoring, divisas<\/td><\/tr>\n<tr><td>SAI<\/td><td>Objeto único: administrar fondos de inversión (Decreto 384 de 1980)<\/td><\/tr>\n<tr><td>Bolsa de valores<\/td><td>Inscribe valores, administra sistemas transaccionales y martillos, fija cotizaciones. La BVC hace parte de la holding regional con las bolsas de Santiago y Lima<\/td><\/tr>\n<tr><td>CRCC<\/td><td>Objeto exclusivo: contraparte central. Exposición de contraparte = 0 en operaciones aceptadas. El miembro liquidador responde por sus terceros<\/td><\/tr>\n<tr><td>Depósitos (DCV del BanRep y Deceval)<\/td><td>Custodia de valores desmaterializados. Principios: prioridad, tracto sucesivo, rogación, buena fe, fungibilidad<\/td><\/tr>\n<tr><td>Calificadoras<\/td><td>SA con permiso SFC (BRC, Fitch, Value and Risk). La calificación <b>no es recomendación<\/b>, dura máximo <b>1 año<\/b>, se publica en <b>24 horas<\/b> y el soporte en 8 días hábiles<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Deben estar calificados: bonos ordinarios y papeles comerciales (salvo los de Fogafín), bonos de establecimientos de crédito y de entidades públicas, y valores de titularización. El segundo mercado no requiere calificación.<\/p>\n\n<h2>9. SIMEV<\/h2>\n<p>Conjunto de recursos de la SFC para dar información al mercado. La información es pública y su veracidad es responsabilidad de quien la entrega.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Registro<\/th><th>Quién se inscribe<\/th><th>Si se suspende<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>RNVE<\/td><td>Valores, emisores y emisiones<\/td><td>No puede hacerse oferta pública ni negociarse<\/td><\/tr>\n<tr><td>RNAMV<\/td><td>Intermediarios, bolsas, depósitos, calificadoras, custodios, fondos mutuos, autorreguladores, proveedores de información<\/td><td>El agente no puede actuar en esas actividades<\/td><\/tr>\n<tr><td>RNPMV<\/td><td>Personas naturales que dirigen, ejecutan, estructuran, promueven o asesoran<\/td><td>El profesional no puede actuar<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Para inscribirse en el RNPMV hay que estar <b>certificado<\/b> (examen y verificación de antecedentes). La inscripción es condición para actuar.<\/p>\n\n<h2>10. Intervención del Estado<\/h2>\n<ul>\n<li>Base: artículo <b>335 de la Constitución<\/b> (actividad de interés público).<\/li>\n<li><b>Congreso:<\/b> leyes marco (Ley 964 de 2005, EOSF). Solo él puede cambiar la estructura del mercado, la forma societaria, la disolución, la toma de posesión y la liquidación de las vigiladas (art. 5 Ley 964).<\/li>\n<li><b>Gobierno / MHCP:<\/b> decretos (Decreto 2555). La <b>URF<\/b> prepara los estudios y proyectos.<\/li>\n<li><b>Junta Directiva del Banco de la República:<\/b> autoridad monetaria, crediticia y cambiaria. <b>7 miembros<\/b>, la preside el Ministro de Hacienda; 5 de dedicación exclusiva por períodos de 4 años.<\/li>\n<li><b>SFC:<\/b> instruye, suspende preventivamente ofertas, negociaciones e inscripciones, impone medidas cautelares. Control <b>exclusivo<\/b> sobre vigiladas y <b>concurrente<\/b> sobre emisores vigilados por otra autoridad.<\/li>\n<\/ul>\n<h3>Régimen sancionatorio de la SFC<\/h3>\n<p>Principios (art. 208 EOSF): contradicción, proporcionalidad, revelación dirigida y ejemplarizante. Sanciones: amonestación, multa (ajustada por IPC), remoción, suspensión o <b>inhabilitación hasta por 5 años<\/b> y clausura de oficinas de representación. Quien viola la ley a sabiendas responde personalmente por los perjuicios (art. 210 EOSF).<\/p>\n<h3>Conglomerados financieros (Ley 1870 de 2017)<\/h3>\n<p>Un controlante común con dos o más entidades financieras, al menos una en Colombia. El <b>holding financiero<\/b> ejerce el primer nivel de control y queda bajo supervisión de la SFC aunque no sea entidad financiera. <b>No forman parte<\/b>: fondos de pensiones y cesantías, FVP, FIC (salvo FCP), fondos mutuos, titularizadoras, proveedores de infraestructura y entidades públicas.<\/p>\n\n<h2>11. Prevención de lavado de activos (SARLAFT)<\/h2>\n<ul>\n<li>Riesgos asociados: <b>reputacional, legal, operativo y de contagio<\/b>. Fases: <b>prevención y control<\/b>.<\/li>\n<li>Etapas: <b>identificación, medición, control y monitoreo<\/b>. Se apoya en una matriz de riesgo (inherente y residual).<\/li>\n<li>Elementos: políticas, procedimientos, documentación, estructura organizacional, órganos de control, infraestructura tecnológica, divulgación de información y capacitación.<\/li>\n<li>Segmentación mínima: <b>clientes, productos, canales y jurisdicciones<\/b>.<\/li>\n<li><b>Conocimiento del cliente:<\/b> actualizar datos al menos <b>anualmente<\/b>; el formulario electrónico no reemplaza la entrevista; las PEP requieren aprobación de un nivel jerárquico superior.<\/li>\n<li><b>Inusual<\/b> = no guarda relación con la actividad del cliente. <b>Sospechosa<\/b> = inusual sin justificación razonable → <b>ROS a la UIAF<\/b>, sin avisar al cliente.<\/li>\n<li><b>Oficial de cumplimiento<\/b> (con suplente): título profesional, 24 meses de experiencia en riesgos, mínimo segundo nivel jerárquico, posesionado ante la SFC, fuera de órganos de control y del área comercial. Informa a la junta al menos <b>cada semestre<\/b>. La revisoría fiscal evalúa el SARLAFT <b>cada año<\/b>.<\/li>\n<\/ul>\n\n<h2>12. Administradores<\/h2>\n<ul>\n<li>Son administradores (art. 22 Ley 222 de 1995): representante legal, liquidador, factor, miembros de juntas y quienes ejerzan esas funciones; también los miembros de comités de inversiones de FIC y de AFP.<\/li>\n<li>Obran de <b>buena fe, con lealtad y con la diligencia de un buen hombre de negocios<\/b>.<\/li>\n<li>Responden <b>solidaria e ilimitadamente<\/b> por dolo o culpa (art. 200 C. Co.); la culpa se presume si violan la ley o los estatutos.<\/li>\n<li>Acción social de responsabilidad: la decide la asamblea (mitad más una); si no se inicia en 3 meses, la puede ejercer cualquier administrador, el revisor fiscal o un socio.<\/li>\n<\/ul>\n\n<h2>13. Defensor del consumidor financiero<\/h2>\n<ul>\n<li>Lo designa la <b>asamblea de accionistas<\/b> por <b>2 años prorrogables<\/b>, con suplente; se posesiona ante la SFC.<\/li>\n<li>Requisitos: independiente (no haber trabajado para la entidad el año anterior), 5 años de experiencia, abogado conciliador.<\/li>\n<li>Resuelve quejas de forma objetiva y <b>gratuita<\/b>; puede actuar como conciliador (el acta presta mérito ejecutivo y hace tránsito a cosa juzgada).<\/li>\n<li><b>No conoce:<\/b> asuntos de más de <b>100 SMMLV<\/b>, hechos de <b>3 años<\/b> o más, temas laborales o de accionistas, asuntos en trámite judicial, la decisión de prestar o no un servicio.<\/li>\n<\/ul>\n\n<h2>14. Asesoría en el mercado de valores<\/h2>\n<p>Solo la prestan entidades vigiladas por la SFC, a través de personas <b>inscritas en el RNPMV y certificadas<\/b>. No aplica a gestores de FCP ni a banca de inversión.<\/p>\n<ul>\n<li><b>Recomendación profesional:<\/b> individual, según el perfil del cliente y del producto. No es vinculante.<\/li>\n<li><b>Consejo profesional<\/b> (abogados, contadores): no requiere certificación si es accesorio a su profesión y no se promueven como asesores.<\/li>\n<li><b>Comunicaciones generales e informes de investigación:<\/b> no son recomendación profesional y llevan la leyenda que lo aclara.<\/li>\n<li><b>Etapas:<\/b> perfilamiento del cliente → perfilamiento del producto (simple o complejo) → <b>análisis de conveniencia<\/b> (interno y previo) → recomendación profesional.<\/li>\n<li>El cliente inversionista solo puede <b>renunciar<\/b> a la recomendación en productos <b>simples<\/b>, con formato específico (no en un contrato de adhesión).<\/li>\n<li><b>Productos universales:<\/b> FIC y alternativas estandarizadas de FVP pueden dirigirse a cualquier perfil.<\/li>\n<li><b>Productos complejos:<\/b> derivados sin valor razonable diario, estructurados, deuda subordinada o sin vencimiento, FCP, fondos apalancados, inmobiliarios no negociados en sistemas. Al distribuirlos a un cliente inversionista hay que darle información suficiente, revelar riesgos y ofrecerle alternativas menos complejas o costosas si la entidad las tiene.<\/li>\n<li>Como <b>contraparte OTC<\/b> de un cliente inversionista, el intermediario le explica que actúa en posición propia, hace análisis de conveniencia y registra la instrucción el mismo día en el libro de instrucciones internas.<\/li>\n<\/ul>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto: las cifras<\/span>\n<ul>\n<li>OPV: 100 o más determinadas o indeterminadas · no es OPV a menos de 500 accionistas<\/li>\n<li>Acciones ≥ 66.000 UVR: por bolsa · exdividendo: 4 días hábiles<\/li>\n<li>Bonos: plazo ≥ 1 año · papeles comerciales: más de 15 días y menos de 1 año (rotativa hasta 2 años) · aceptaciones: hasta 1 año · bono de prenda ≤ 70 %<\/li>\n<li>Profesional: patrimonio 157.878,12 UVT + portafolio 78.939,06 UVT o 15 operaciones en 60 días<\/li>\n<li>Vinculado: 10 % · APT: extracto mensual · llamado al margen: 50 % · financiación: 3 veces el patrimonio técnico, garantía al 80 %<\/li>\n<li>Contado T+0 a T+3 · repos, simultáneas y TTV ≤ 1 año salvo CRCC<\/li>\n<li>OPA: 25 % · +5 % · mínimo 5 % del capital · democratización: 6 meses<\/li>\n<li>FIC monetario 365 días · FCP 2/3 · inmobiliario 75 %<\/li>\n<li>Calificación: 1 año, 24 horas · JDBR: 7 miembros · inhabilitación SFC: 5 años<\/li>\n<li>Oficial de cumplimiento: 24 meses, informe semestral · KYC anual · defensor: 2 años, 100 SMMLV, 3 años<\/li>\n<\/ul><\/div>\n<p class=\"fuente\">Contenido elaborado a partir de la Guía de estudio de Regulación de AMV (REMV-001-2025, 4.ª edición) y el temario oficial de julio de 2024.<\/p>\n", "riesgo": "<span class=\"eyebrow\">Módulo 5 · 25 preguntas en el examen<\/span>\n<h1>Administración de riesgos<\/h1>\n<p>Es el segundo módulo con más peso del componente básico (25 preguntas). Combina definiciones (qué tipo de riesgo es cada evento), cálculos sencillos (VaR, duración, pérdida esperada, IRL, solvencia) y la estructura de gestión y control interno de las entidades vigiladas.<\/p>\n<div class=\"box clave\"><span class=\"tag\">Mapa del módulo<\/span>\n<ul>\n<li><b>Cuantificables (financieros):<\/b> mercado, crédito y liquidez.<\/li>\n<li><b>No cuantificables:<\/b> operacional, estratégico, reputacional, legal y LA/FT. Se gestionan con modelos cualitativos o semicuantitativos por la falta de datos.<\/li>\n<li><b>Otros:<\/b> ambientales, sociales y de gobernanza (ASG).<\/li>\n<\/ul><\/div>\n\n<h2>1. Tipos de riesgo<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Riesgo<\/th><th>Pérdida por...<\/th><th>Ejemplo<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>De mercado<\/td><td>Cambios en precios, tasas de interés, tasa de cambio<\/td><td>Suben las tasas y cae el valor de los TES<\/td><\/tr>\n<tr><td>De crédito (y de emisor)<\/td><td>Incumplimiento de un deudor o emisor<\/td><td>Un emisor de bonos no paga<\/td><\/tr>\n<tr><td>De contraparte<\/td><td>Incumplimiento de la otra parte de una operación<\/td><td>El comprador no paga al liquidar<\/td><\/tr>\n<tr><td>De liquidación (principal)<\/td><td>Entregar y no recibir la contraprestación<\/td><td>Se entregan los títulos y no llega el dinero<\/td><\/tr>\n<tr><td>De liquidez<\/td><td>No conseguir recursos o tener que vender con descuento<\/td><td>Una acción sin volumen se vende muy por debajo<\/td><\/tr>\n<tr><td>Operacional<\/td><td>Fallas en procesos, personas, tecnología o eventos externos<\/td><td>Error de digitación, fraude, ciberataque<\/td><\/tr>\n<tr><td>Legal<\/td><td>Incumplir normas o contratos mal hechos (es parte del operacional)<\/td><td>Un contrato que no se puede ejecutar<\/td><\/tr>\n<tr><td>Reputacional<\/td><td>Desprestigio de la entidad<\/td><td>Pérdida de clientes tras un escándalo<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"box trampa\"><span class=\"tag\">Trampa típica<\/span>\n<p>Un error humano al ingresar una orden es riesgo <b>operacional<\/b>, aunque la pérdida se vea en el portafolio. Pregúntese por la causa, no por dónde aparece la pérdida.<\/p><\/div>\n<p><b>Riesgo sistemático<\/b> (de mercado, no se elimina diversificando; por ejemplo una reforma tributaria) y <b>no sistemático o específico<\/b> (propio de cada emisor, como una huelga; se reduce diversificando).<\/p>\n\n<h3>Riesgo operacional en detalle<\/h3>\n<p>La CBCF (Capítulo XXXI) lo define como pérdidas por fallas en procesos, tecnología, infraestructura o recurso humano, o por acontecimientos externos, <b>e incluye el riesgo legal<\/b>. Factores internos: recurso humano, procesos, tecnología e infraestructura. Externos: terceros y eventos físicos o naturales.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Los 7 tipos de evento<\/th><th>Ejemplo<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fraude interno<\/td><td>Un empleado desvía recursos de clientes<\/td><\/tr>\n<tr><td>Fraude externo<\/td><td>Suplantación de un cliente por el canal digital<\/td><\/tr>\n<tr><td>Relaciones laborales y seguridad laboral<\/td><td>Demanda laboral, accidente de trabajo<\/td><\/tr>\n<tr><td>Clientes, productos y prácticas empresariales<\/td><td>Vender un producto que no corresponde al perfil<\/td><\/tr>\n<tr><td>Daños a activos físicos<\/td><td>Inundación del centro de cómputo<\/td><\/tr>\n<tr><td>Fallas tecnológicas<\/td><td>Caída del sistema de negociación<\/td><\/tr>\n<tr><td>Ejecución y administración de procesos<\/td><td>Liquidar dos veces la misma operación<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Controles internos: separación de funciones, entradas duales, conciliaciones, control de cambios, auditoría interna. Externos: confirmaciones, verificación de precios, autorizaciones, auditoría externa. Para medir la probabilidad se usa un horizonte mínimo de <b>un año<\/b>.<\/p>\n\n<h3>Otros riesgos no cuantificables<\/h3>\n<ul>\n<li><b>Estratégico:<\/b> decisiones de negocio y competencia (por ejemplo, la llegada de fintech). Se divide en riesgo de <b>posicionamiento<\/b> (la entidad no se dirige según su estrategia) y de <b>ejecución<\/b> (la estrategia sigue siendo válida pero se ejecuta mal). Niveles de estrategia: corporativa (¿dónde crecer?), competitiva (¿cómo competir?) y funcional (¿cómo funciona?).<\/li>\n<li><b>Reputacional:<\/b> publicidad negativa, cierta o no. Causas: diferencia entre reputación y comportamiento real, cambio en las expectativas de los grupos de interés y falta de coordinación interna (mercadeo promete lo que operaciones no puede cumplir).<\/li>\n<li><b>Legal:<\/b> sanciones o indemnizaciones por incumplir normas o contratos, o por fallas en la formalización de contratos.<\/li>\n<li><b>LA/FT:<\/b> que la entidad sea usada para lavar activos o financiar terrorismo. Factores: <b>clientes, productos, canales y jurisdicciones<\/b>. El GAFI fija los estándares; en Colombia la UIAF recibe y analiza los reportes. Ejes del sistema: prevención, detección, investigación y judicialización. En la financiación del terrorismo los fondos pueden ser de origen legal.<\/li>\n<\/ul>\n\n<h3>Riesgos financieros en detalle<\/h3>\n<ul>\n<li><b>Mercado, 4 categorías:<\/b> tasa de interés (incluye el riesgo de reinversión cuando las tasas bajan), renta variable, tasa de cambio (incluye tasas cruzadas) y precio de commodities (agrícolas, energéticos, metales y animales).<\/li>\n<li><b>Crédito:<\/b> de emisor (el emisor no paga cupones, capital o dividendos decretados, o le bajan la calificación) y de contraparte. Eventos de crédito según ISDA: bancarrota, incumplimiento de pagos, incumplimiento de obligaciones, aceleración, repudio o moratoria, reestructuración y <b>default técnico<\/b> (incumplir un covenant).<\/li>\n<li><b>Liquidez:<\/b> de <b>fondeo<\/b> (no tener activos líquidos o pagar costos inusuales para fondearse) y de <b>mercado<\/b> (no poder deshacer posiciones a precio de mercado por poca profundidad). Se ve en el bid-ask spread y el volumen.<\/li>\n<\/ul>\n\n<h3>Factores ASG<\/h3>\n<p><b>Ambiental<\/b> (cambio climático, agua, residuos), <b>social<\/b> (trabajadores, clientes, comunidad) y <b>gobernanza<\/b> (derechos de accionistas, junta, remuneración, sobornos). La iniciativa <b>PRI<\/b> tiene 6 principios de inversión responsable; la Agenda 2030 de la ONU, 17 Objetivos de Desarrollo Sostenible.<\/p>\n\n<h2>2. Gestión del riesgo<\/h2>\n<ul>\n<li>En Colombia, la SFC estableció el <b>Sistema Integral de Administración de Riesgos (SIAR)<\/b> en el Capítulo XXXI de la CBCF (Circular Externa 018 de 2021).<\/li>\n<li>Elementos de una buena gestión: involucramiento estratégico, un sistema integral (SIAR), modelos de medición y supervisión basada en riesgos (SBR).<\/li>\n<li>Etapas: <b>identificar<\/b> (antes de nuevos mercados, productos, canales o fusiones; técnicas como Delphi, entrevistas, talleres, causa raíz), <b>medir<\/b> (modelo estándar del supervisor o modelo interno aprobado por él), <b>controlar<\/b> y <b>monitorear<\/b>.<\/li>\n<li>Según COSO: <b>apetito<\/b> (lo que la entidad está dispuesta a aceptar), <b>tolerancia<\/b> (variación aceptable en los resultados) y <b>capacidad<\/b> (lo máximo que puede soportar).<\/li>\n<li>Estrategias de tratamiento: evitar, mitigar, compartir, transferir, aceptar o aprovechar.<\/li>\n<li><b>Apetito de riesgo:<\/b> lo define la junta directiva; de allí salen los límites (VaR, posición, pérdidas, cupos de contraparte, concentración).<\/li>\n<li><b>Front office<\/b> negocia, <b>middle office<\/b> mide y controla los riesgos de forma independiente, <b>back office<\/b> registra y liquida.<\/li>\n<li><b>Líneas de defensa:<\/b> primera, las áreas de negocio; segunda, riesgos y cumplimiento (incluido SARLAFT); tercera, auditoría interna. La guía de AMV agrega una <b>cuarta<\/b>: supervisores, reguladores y revisoría fiscal.<\/li>\n<li>El control de los límites de liquidez lo hace un área distinta de la tesorería y de captación y colocación.<\/li>\n<li><b>Riesgo inherente<\/b> (antes de controles) y <b>residual<\/b> (después). La matriz combina probabilidad e impacto.<\/li>\n<li>Un exceso de límite se reporta de inmediato y se corrige; nunca se oculta.<\/li>\n<\/ul>\n\n<h2>3. Valor en Riesgo (VaR)<\/h2>\n<p>El VaR es la pérdida máxima esperada en un horizonte y con un nivel de confianza dados. Métodos: paramétrico, simulación histórica y Montecarlo.<\/p>\n<p class=\"f\">VaR paramétrico = valor × volatilidad × z<\/p>\n<p>Lo propuso JP Morgan. En Colombia se usa con 95 %, 97,5 % o 99 % de confianza, y el horizonte regulatorio de la SFC es de <b>10 días<\/b>.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Confianza<\/th><th>95 %<\/th><th>96 %<\/th><th>97 %<\/th><th>98 %<\/th><th>99 %<\/th><\/tr><\/thead>\n<tbody><tr><td>z<\/td><td>1,6448<\/td><td>1,7507<\/td><td>1,8808<\/td><td>2,0537<\/td><td>2,3263<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Para otro horizonte: <span class=\"f\">VaR(n días) = VaR(1 día) × √n<\/span>. Si la volatilidad es anual, se lleva a n días con <span class=\"f\">σ × √(n / 252)<\/span>.<\/p>\n<ul>\n<li><b>Paramétrico:<\/b> supone rendimientos normales.<\/li>\n<li><b>Simulación histórica:<\/b> toma el percentil (1 − confianza) de los rendimientos observados; no supone distribución.<\/li>\n<li><b>Montecarlo:<\/b> genera escenarios aleatorios; útil si hay opciones en el portafolio.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Un portafolio de COP 1.000 millones tiene volatilidad diaria de 2 %. ¿Cuál es el VaR a 1 día al 95 % y a 10 días?<\/p>\n<ul>\n<li>VaR 1 día = 1.000 × 0,02 × 1,65 = <b>33 millones<\/b><\/li>\n<li>VaR 10 días = 33 × √10 = 33 × 3,16 = <b>104,4 millones<\/b><\/li>\n<\/ul>\n<p>Con volatilidad anual: COP 2.000.000, σ anual 20 %, 10 días, 95 %: 2.000.000 × 0,20 × √(10/252) × 1,6449 ≈ <b>COP 131.069<\/b>.<\/p><\/div>\n<p>VaR de dos posiciones: <span class=\"f\">√(VaR₁² + VaR₂² + 2ρ·VaR₁·VaR₂)<\/span>. Con correlación menor que 1, el VaR conjunto es menor que la suma (beneficio de diversificación).<\/p>\n<p>Volatilidad de un portafolio de dos activos: <span class=\"f\">σ = √(w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂)<\/span>. Ejemplo: 50 % y 50 %, σ de 10 % y 20 %, ρ = 0: σ = √0,0125 ≈ 11,2 % (con ρ = 1 sería 15 %).<\/p>\n<p><b>Tracking error:<\/b> desviación estándar de (rendimiento del portafolio − rendimiento del benchmark). Un fondo que replica el índice tiene tracking error y VaR relativo cercanos a cero. El VaR relativo usa peso 1 en el portafolio y −1 en el benchmark.<\/p>\n<h3>Otras medidas de volatilidad<\/h3>\n<ul>\n<li><b>Desviación estándar:<\/b> mejor sobre rendimientos que sobre precios. <b>Correlación:<\/b> entre −1 y 1.<\/li>\n<li><b>Máximo drawdown:<\/b> máxima pérdida observada en la ventana (de máximo a mínimo).<\/li>\n<li><b>Beta:<\/b> sensibilidad frente al benchmark; mayor que 1, más riesgoso que el índice.<\/li>\n<li><b>Volatilidad implícita:<\/b> la que espera el mercado, sale del precio de las opciones. <b>Volatilidad móvil:<\/b> calculada con ventanas que se desplazan.<\/li>\n<li><b>ARCH<\/b> (reversión a una media de largo plazo), <b>EWMA<\/b> (más peso a lo reciente: varianza = λ·varianza anterior + (1 − λ)·rendimiento²) y <b>GARCH<\/b> (combina ambos).<\/li>\n<\/ul>\n<p>Limitaciones del VaR: no dice cuánto se pierde más allá del VaR. Por eso se complementa con el <b>expected shortfall<\/b> (pérdida promedio en la cola), las <b>pruebas de estrés<\/b> y el <b>backtesting<\/b>, que compara las pérdidas reales con las estimadas.<\/p>\n\n<h2>4. Riesgo de tasa de interés en bonos<\/h2>\n<ul>\n<li><b>DV01:<\/b> cambio del precio cuando la tasa sube 1 punto básico. Cero cupón de 1.000 a 1 año al 8 %: 1.000/1,08 − 1.000/1,0801 ≈ 0,086.<\/li>\n<li><b>Duración de Macaulay:<\/b> plazo promedio ponderado de los flujos. En un cero cupón es igual al plazo.<\/li>\n<li><b>Duración modificada:<\/b> <span class=\"f\">DM = D / (1 + TIR)<\/span>.<\/li>\n<li><b>Cambio de precio:<\/b> <span class=\"f\">Δ% precio ≈ −DM × Δtasa<\/span>.<\/li>\n<li>Más plazo y menos cupón significan más duración y más riesgo.<\/li>\n<li>La <b>convexidad<\/b> mejora la estimación ante cambios grandes de tasas.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Un bono con duración de Macaulay de 4 años, TIR de 10 % y precio de COP 1.000. ¿Qué pasa si las tasas suben 0,5 %?<\/p>\n<ul>\n<li>DM = 4 / 1,10 = <b>3,64<\/b><\/li>\n<li>Δ% ≈ −3,64 × 0,5 % = <b>−1,82 %<\/b>, es decir, el precio baja unos <b>COP 18,2<\/b>.<\/li>\n<\/ul><\/div>\n\n<h2>5. Riesgo de crédito<\/h2>\n<p class=\"f\">Pérdida esperada = PI × PDI × EAD = PD × (1 − tasa de recuperación) × exposición<\/p>\n<ul>\n<li><b>PI:<\/b> probabilidad de incumplimiento.<\/li>\n<li><b>PDI:<\/b> pérdida dado el incumplimiento (lo que no se recupera).<\/li>\n<li><b>EAD:<\/b> exposición en el momento del incumplimiento.<\/li>\n<li>Las <b>provisiones<\/b> cubren la pérdida esperada; el <b>capital<\/b> cubre la inesperada. La relación de solvencia compara el patrimonio técnico con los activos ponderados por riesgo.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Exposición de COP 1.000 millones, PI de 2 % y PDI de 45 %: pérdida esperada = 0,02 × 0,45 × 1.000 = <b>9 millones<\/b>.<\/p><\/div>\n<ul>\n<li><b>Scores de crédito:<\/b> calificación reactiva (para un producto específico), de comportamiento (seguimiento a clientes actuales) y proactiva (al cliente en general).<\/li>\n<li><b>Ciclo de crédito:<\/b> otorgamiento, control y monitoreo, y recuperación.<\/li>\n<li><b>Modalidades (CBCF):<\
