ne que los dividendos crecen a una tasa constante g menor que la rentabilidad exigida k."}, {"q": "Con el modelo de Gordon, si el próximo dividendo es COP 500, la rentabilidad exigida 12 % y el crecimiento 2 %, el precio de la acción es:", "o": ["COP 5.000", "COP 4.167", "COP 25.000", "COP 3.571"], "e": "P = 500 / (0,12 − 0,02) = 500 / 0,10 = 5.000."}, {"q": "Una asignación táctica de activos consiste en:", "o": ["Desviarse temporalmente de la asignación estratégica para aprovechar oportunidades de mercado", "Definir la mezcla de largo plazo", "Elegir el perfil del cliente", "Mantener siempre los mismos pesos"], "e": "La asignación táctica hace ajustes de corto plazo. La estratégica define la mezcla de referencia de largo plazo."}, {"q": "La rentabilidad ponderada por dinero equivale a:", "o": ["La TIR de los flujos de aportes y retiros del inversionista", "El promedio simple de las rentabilidades", "La rentabilidad del benchmark", "El rendimiento del activo libre de riesgo"], "e": "La rentabilidad ponderada por dinero considera el momento y el tamaño de los aportes y retiros, por eso mide la experiencia del inversionista."}, {"q": "¿Cuál es el principal riesgo que asume un inversionista al invertir en un portafolio de acciones extranjeras sin cobertura?", "o": ["El riesgo cambiario, además del riesgo de las acciones", "Ningún riesgo adicional", "El riesgo de inflación local únicamente", "El riesgo de reinversión de cupones"], "e": "La rentabilidad en pesos depende del desempeño de las acciones y de la variación de la tasa de cambio."}, {"q": "La rentabilidad esperada de un activo se puede estimar como:", "o": ["El promedio ponderado de las rentabilidades posibles por sus probabilidades", "La rentabilidad máxima histórica", "La rentabilidad del último día", "La tasa de interés del Banco de la República"], "e": "E(R) = Σ pᵢ × Rᵢ. Es el valor esperado de los escenarios posibles."}, {"q": "Un activo tiene 50 % de probabilidad de rentar 20 % y 50 % de rentar −4 %. ¿Cuál es su rentabilidad esperada?", "o": ["8 %", "12 %", "16 %", "24 %"], "e": "E(R) = 0,5 × 20 % + 0,5 × (−4 %) = 10 % − 2 % = 8 %."}, {"q": "El riesgo total de un activo se puede dividir en:", "o": ["Riesgo sistemático y riesgo no sistemático", "Riesgo de crédito y de liquidez", "Riesgo legal y operativo", "Riesgo interno y externo"], "e": "Riesgo total = sistemático (de mercado, no diversificable) + no sistemático (propio, diversificable)."}, {"q": "A medida que se agregan activos poco correlacionados a un portafolio, su riesgo total:", "o": ["Disminuye hasta acercarse al nivel del riesgo sistemático", "Aumenta sin límite", "Se vuelve cero siempre", "No cambia"], "e": "La diversificación elimina el riesgo específico, pero no el riesgo de mercado."}, {"q": "¿Qué es un benchmark adecuado para un portafolio de TES?", "o": ["Un índice de deuda pública local de duración similar", "El índice MSCI COLCAP", "El precio del petróleo", "La inflación de Estados Unidos"], "e": "El benchmark debe tener activos, riesgos y duración comparables a los del portafolio."}, {"q": "¿Qué mide el drawdown máximo de un portafolio?", "o": ["La mayor caída desde un máximo hasta un mínimo en un período", "La rentabilidad promedio", "La comisión total", "La duración del portafolio"], "e": "El drawdown máximo indica la peor pérdida acumulada que habría sufrido un inversionista que entró en el pico."}, {"q": "Un inversionista que no puede tolerar pérdidas de más del 5 % en un año debería:", "o": ["Tener un portafolio con baja exposición a activos volátiles como las acciones", "Invertir todo en acciones", "Invertir en derivados apalancados", "Concentrarse en una sola acción"], "e": "La tolerancia a pérdidas limita la proporción de activos de alta volatilidad."}, {"q": "¿Qué es la gestión de portafolios discrecional?", "o": ["Aquella en que el cliente autoriza al gestor a tomar decisiones de inversión dentro de un mandato", "Aquella en que el cliente da cada orden", "Aquella que replica un índice", "Aquella que no tiene comisiones"], "e": "En la gestión discrecional el gestor decide dentro de los límites del contrato y del perfil del cliente."}, {"q": "El mandato de inversión en un contrato de APT define:", "o": ["Los objetivos, activos permitidos, límites y nivel de riesgo que debe respetar el gestor", "El salario del gestor", "Las tasas del Banco de la República", "La fecha de pensión del cliente"], "e": "El mandato traduce el perfil del cliente en reglas de gestión."}, {"q": "La rentabilidad anualizada de una inversión que ganó 21 % en dos años es:", "o": ["10 %", "10,5 %", "21 %", "11 %"], "e": "(1,21)^(1/2) − 1 = 10 %. Dividir 21 % entre 2 ignora la capitalización."}, {"q": "En un portafolio con 30 % en un activo con rentabilidad de 12 % y 70 % en el activo libre de riesgo con 5 %, la rentabilidad esperada es:", "o": ["7,1 %", "8,5 %", "12 %", "5 %"], "e": "0,3 × 12 % + 0,7 × 5 % = 3,6 % + 3,5 % = 7,1 %."}, {"q": "Una cartera colectiva o FIC indexado se caracteriza por:", "o": ["Replicar un índice con bajos costos de gestión", "Buscar superar al mercado con mucha rotación", "Garantizar una rentabilidad", "Invertir en un solo activo"], "e": "La gestión indexada es pasiva y suele tener comisiones más bajas que la activa."}, {"q": "El costo de oportunidad de una inversión es:", "o": ["La rentabilidad de la mejor alternativa que se deja de lado", "El valor de la comisión", "El precio de compra", "La inflación del período"], "e": "Toda decisión de inversión implica renunciar a otras alternativas con su propio rendimiento y riesgo."}, {"q": "¿Qué representa la pendiente de la línea del mercado de capitales?", "o": ["El índice de Sharpe del portafolio de mercado", "La beta del mercado", "La tasa libre de riesgo", "La inflación esperada"], "e": "Pendiente = (Rm − rf) / σm: la recompensa por unidad de riesgo total del portafolio de mercado."}, {"q": "Si un portafolio está por encima de la línea del mercado de valores, se dice que:", "o": ["Tiene un alfa positivo", "Está sobrevalorado", "Tiene beta cero", "Es el portafolio de mercado"], "e": "Por encima de la LMV, la rentabilidad supera la exigida por su beta."}, {"q": "Un portafolio con beta 1,2 en un mercado que cae 10 % tendería a:", "o": ["Caer aproximadamente 12 %", "Subir 12 %", "Caer 10 %", "No cambiar"], "e": "Con beta 1,2, el portafolio amplifica los movimientos del mercado en un 20 %."}, {"q": "¿Cuál es el principal objetivo de la política de rebalanceo con bandas?", "o": ["Rebalancear solo cuando los pesos se salen de un rango definido, controlando costos y riesgo", "Rebalancear todos los días", "No rebalancear nunca", "Cambiar el perfil del cliente"], "e": "Las bandas evitan operaciones innecesarias y mantienen el riesgo cerca del objetivo."}, {"q": "¿Cuáles son, en orden, las cuatro etapas del proceso de administración de portafolios descrito por AMV?", "o": ["Conocimiento del cliente, definición del perfil, diseño de la estrategia y seguimiento", "Diseño de la estrategia, conocimiento del cliente, seguimiento y definición del perfil", "Selección de títulos, asignación táctica, rebalanceo y liquidación", "Apertura de cuenta, compra de activos, cobro de comisiones y cierre"], "e": "El proceso empieza por conocer al cliente (objetivos y restricciones), sigue con su perfil de riesgo, luego la estrategia (asignación de activos y selección) y termina con el seguimiento y ajuste."}, {"q": "El documento que formaliza los objetivos, restricciones y lineamientos de inversión acordados con el cliente se conoce como:", "o": ["Declaración de política de inversión (IPS)", "Reglamento del FIC", "Prospecto de emisión", "Contrato de depósito"], "e": "La IPS (Investment Policy Statement) recoge objetivos de rentabilidad y riesgo, restricciones, benchmark, rebalanceo y responsabilidades. Es la guía del gestor."}, {"q": "¿Cuál de las siguientes características hace que una IPS sea inadecuada?", "o": ["Que sea tan rígida o genérica que no refleje las circunstancias reales del cliente", "Que defina un benchmark para medir el desempeño", "Que establezca la frecuencia de revisión del portafolio", "Que incluya las restricciones de liquidez del cliente"], "e": "Una buena IPS es específica, realista y revisable. Una IPS genérica, ambigua o que no se revisa cuando cambian las circunstancias del cliente no cumple su función."}, {"q": "¿Cuál de las siguientes NO es una de las restricciones típicas que se analizan al construir el portafolio de un cliente?", "o": ["La rentabilidad histórica del gestor", "La liquidez", "El horizonte de inversión", "Las consideraciones tributarias"], "e": "Las restricciones clásicas son liquidez, horizonte, aspectos fiscales, aspectos legales o regulatorios y circunstancias únicas del cliente. El historial del gestor no es una restricción del cliente."}, {"q": "Un cliente pide no invertir en empresas de armas ni de tabaco. Esta condición se clasifica como:", "o": ["Una circunstancia única del cliente", "Una restricción de liquidez", "Una restricción de horizonte", "Un objetivo de rentabilidad"], "e": "Las preferencias éticas, religiosas o personales que limitan el universo de inversión se tratan como circunstancias únicas dentro de las restricciones."}, {"q": "La diferencia entre capacidad y tolerancia al riesgo es que:", "o": ["La capacidad es objetiva (ingresos, patrimonio, horizonte) y la tolerancia es subjetiva (disposición psicológica)", "La capacidad es subjetiva y la tolerancia es objetiva", "Son sinónimos y se miden con el mismo cuestionario", "La capacidad solo aplica a inversionistas institucionales"], "e": "La capacidad depende de la situación financiera (cuánto puede perder sin afectar sus metas). La tolerancia es la disposición emocional a asumir pérdidas. El perfil combina ambas."}, {"q": "Un cliente joven, con ingresos altos y estables, dice que no soporta ver pérdidas en su extracto. ¿Qué situación se presenta?", "o": ["Alta capacidad de riesgo y baja tolerancia al riesgo", "Baja capacidad y alta tolerancia", "Alta capacidad y alta tolerancia", "Baja capacidad y baja tolerancia"], "e": "Su situación objetiva le permite asumir riesgo (capacidad alta), pero psicológicamente no lo acepta (tolerancia baja). El asesor debe explicarle y, en general, respetar la medida más conservadora."}, {"q": "El capital humano de un inversionista se define como:", "o": ["El valor presente de sus ingresos laborales futuros", "El valor de sus acciones en el portafolio", "Su patrimonio neto contable", "El total de sus deudas de largo plazo"], "e": "El capital humano es el valor presente de lo que la persona espera ganar con su trabajo. Suele ser alto en jóvenes y disminuye con la edad, lo que influye en cuánto riesgo financiero pueden asumir."}, {"q": "El patrimonio neto de un inversionista individual se calcula como:", "o": ["Activos totales menos pasivos totales", "Ingresos menos gastos del año", "Activos financieros más capital humano", "Pasivos menos activos"], "e": "Patrimonio neto = activos − pasivos. Es un insumo clave para estimar la capacidad de riesgo."}, {"q": "¿Cuál de los siguientes es un objetivo de inversión típico de un inversionista individual?", "o": ["Preservación de capital", "Maximizar el tracking error", "Replicar exactamente el COLCAP en todo caso", "Minimizar la diversificación"], "e": "Los objetivos individuales incluyen reserva de emergencia, preservación de capital, ingreso corriente, retiro, crecimiento y especulación."}, {"q": "Un inversionista que necesita que su portafolio le pague una renta periódica para cubrir sus gastos tiene un objetivo de:", "o": ["Ingreso corriente", "Especulación", "Crecimiento de capital", "Reserva de emergencia"], "e": "El objetivo de ingreso corriente busca flujos periódicos (cupones, dividendos, intereses) para cubrir gastos."}, {"q": "El objetivo de inversión en el que el cliente acepta un riesgo muy alto buscando ganancias de corto plazo se denomina:", "o": ["Especulación", "Preservación", "Reserva", "Ingreso corriente"], "e": "La especulación implica asumir riesgos altos, frecuentemente con apalancamiento o activos volátiles, con horizonte corto."}, {"q": "Un fondo de reserva o de emergencia debe invertirse preferiblemente en:", "o": ["Activos muy líquidos y de bajo riesgo", "Acciones de baja bursatilidad", "Fondos de capital privado con permanencia de 5 años", "Inmuebles"], "e": "La reserva debe estar disponible de inmediato y sin pérdidas relevantes, por eso se invierte en activos líquidos y de bajo riesgo."}, {"q": "La tasa de retorno requerida (RRR) de una acción por el modelo de descuento de dividendos es:", "o": ["Dividendo esperado / precio + tasa de crecimiento de los dividendos", "Precio / dividendo − crecimiento", "Tasa libre de riesgo + beta", "Dividendo pagado × crecimiento"], "e": "Despejando el modelo de Gordon: k = D1/P0 + g. Es el retorno que exige el inversionista dado el precio actual."}, {"q": "La diferencia entre un enfoque asset only y un enfoque ALM (asset liability management) es que:", "o": ["El ALM construye el portafolio teniendo en cuenta los pasivos que debe pagar el inversionista", "El asset only considera los pasivos y el ALM no", "El ALM solo se usa con inversionistas individuales", "No hay diferencia: ambos ignoran los pasivos"], "e": "En asset only se optimizan los activos sin mirar obligaciones. En ALM (típico de aseguradoras y fondos de pensiones) los activos se calzan con los pasivos esperados."}, {"q": "¿Qué tipo de inversionista suele usar el enfoque ALM?", "o": ["Una aseguradora o un fondo de pensiones", "Un especulador individual de corto plazo", "Un inversionista sin obligaciones futuras", "Un cliente que solo busca replicar un índice"], "e": "Las aseguradoras y los fondos de pensiones tienen pasivos conocidos (siniestros, pensiones) y deben calzar sus activos con ellos."}, {"q": "Las tres grandes etapas del proceso de inversión de un inversionista institucional son:", "o": ["Planeación, ejecución y retroalimentación", "Compra, venta y liquidación", "Captación, colocación y recaudo", "Análisis técnico, fundamental y cuantitativo"], "e": "Planeación (objetivos, IPS, expectativas de mercado), ejecución (asignación de activos y selección de títulos) y retroalimentación (seguimiento, rebalanceo, evaluación)."}, {"q": "Dentro de la etapa de ejecución del proceso de inversión se encuentran:", "o": ["La asignación de activos y la selección de títulos", "La redacción de la IPS y el perfilamiento", "La evaluación de desempeño y el reporte al cliente", "La vinculación y el SARLAFT"], "e": "La ejecución convierte el plan en portafolio: se decide cuánto por clase de activo (asset allocation) y qué títulos comprar (security selection)."}, {"q": "Una clase de activo se caracteriza porque sus integrantes:", "o": ["Tienen características similares y se comportan de forma parecida ante el mercado", "Tienen exactamente la misma rentabilidad", "Son emitidos por el mismo emisor", "Siempre tienen correlación negativa entre sí"], "e": "Una clase de activo agrupa instrumentos con riesgo, rentabilidad y regulación similares, por ejemplo renta fija, renta variable, efectivo o alternativos."}, {"q": "Frente a los activos tradicionales, las inversiones alternativas suelen tener:", "o": ["Menor liquidez, menor regulación y comisiones más altas", "Mayor liquidez y menores comisiones", "Más regulación y más transparencia de precios", "Correlación perfecta con las acciones"], "e": "Los alternativos (capital privado, deuda privada, hedge funds, inmuebles, materias primas) son menos líquidos y regulados, más costosos, pero aportan baja correlación con activos tradicionales."}, {"q": "¿Cuál de los siguientes es un ejemplo de inversión alternativa?", "o": ["Un fondo de capital privado", "Un TES tasa fija", "Una acción del COLCAP", "Un CDT a 90 días"], "e": "El capital privado (private equity) invierte en empresas no listadas. Es un activo alternativo, ilíquido y de largo plazo."}, {"q": "La asignación estratégica de activos (SAA) se caracteriza por:", "o": ["Definir pesos de largo plazo según el perfil del cliente y mantenerlos con rebalanceos periódicos", "Cambiar los pesos a diario según noticias del mercado", "Elegir la mejor acción de cada sector", "Invertir todo en el activo de mayor rentabilidad reciente"], "e": "La SAA es la estrategia de largo plazo (es pasiva). La TAA hace desviaciones temporales sobre esos pesos para aprovechar oportunidades (es activa)."}, {"q": "Una estrategia que fija pesos objetivo y rebalancea cuando un activo se desvía, por ejemplo, ±10 % de su peso, es un ejemplo de:", "o": ["Rebalanceo sistemático propio de una estrategia pasiva", "Market timing", "Selección activa de títulos", "Especulación con derivados"], "e": "Rebalancear a pesos fijos por reglas mantiene la asignación estratégica. Es una forma de gestión pasiva, cercana a la indexación."}, {"q": "La estrategia buy and hold consiste en:", "o": ["Comprar y mantener los activos sin ajustes frecuentes", "Comprar y vender el mismo día", "Rebalancear todos los días", "Vender en corto y recomprar"], "e": "Buy and hold es pasiva: se compra y se mantiene. Los pesos cambian con el mercado porque no se rebalancea."}, {"q": "La asignación táctica de activos (TAA) busca:", "o": ["Desviarse temporalmente de la asignación estratégica para aprovechar expectativas de mercado", "Mantener siempre los mismos pesos sin importar el mercado", "Replicar un índice al menor costo", "Calzar activos con pasivos"], "e": "La TAA es activa: sobrepondera o infrapondera clases de activos por un tiempo, según la visión del gestor."}, {"q": "La selección activa de títulos puede basarse en:", "o": ["Análisis técnico, análisis fundamental o información privada (legal) obtenida por investigación", "Solo la capitalización bursátil", "Elegir al azar", "La calificación del gestor"], "e": "Los enfoques de selección activa son el técnico (precios y volúmenes), el fundamental (valor intrínseco) y la información propia que surge de la investigación. Nunca información privilegiada."}, {"q": "Los factores de estilo en la inversión por factores incluyen, entre otros:", "o": ["Valor, momentum, calidad, tamaño y mínima volatilidad", "Inflación, PIB y tasa de cambio", "Liquidez, horizonte y fiscalidad", "Sharpe, Treynor y Jensen"], "e": "Los factores de estilo explican retornos dentro de una clase de activo: valor, momentum, calidad, tamaño, baja volatilidad. Los macro (inflación, crecimiento, tasas) explican retornos entre clases."}, {"q": "¿Cuál de los siguientes es un factor de riesgo macroeconómico?", "o": ["La inflación", "El momentum", "La calidad", "El tamaño de la empresa"], "e": "Los factores macro son crecimiento económico, inflación, tasas de interés, crédito y liquidez. Momentum, calidad y tamaño son factores de estilo."}, {"q": "La teoría posmoderna de portafolios se diferencia de Markowitz porque:", "o": ["Mide el riesgo con el riesgo a la baja (drawdown, asimetría, curtosis) y no solo con la varianza", "Ignora la diversificación", "Supone que todos los retornos son normales", "Solo usa la beta"], "e": "La teoría posmoderna reconoce que los inversionistas temen las pérdidas más que la variabilidad al alza. Por eso usa medidas de riesgo a la baja y momentos superiores."}, {"q": "Un perfil de riesgo dinámico o agresivo se caracteriza por:", "o": ["Aceptar alta volatilidad y posibles pérdidas buscando mayor rentabilidad de largo plazo", "Priorizar la preservación de capital", "Invertir solo en depósitos a la vista", "No aceptar ninguna pérdida"], "e": "Los perfiles van de muy conservador (preservar capital) a dinámico o agresivo (crecimiento con alta volatilidad)."}, {"q": "¿Quién demostró que combinar un activo libre de riesgo con una cartera de activos riesgosos permite separar la decisión de inversión (teorema de separación)?", "o": ["James Tobin (1958)", "Eugene Fama (1970)", "Stephen Ross (1976)", "Myron Gordon (1959)"], "e": "Tobin mostró que todos los inversionistas eligen la misma cartera riesgosa y ajustan su riesgo con el activo libre de riesgo. Esto da origen a la línea del mercado de capitales."}, {"q": "Según el estudio de Statman (1987), ¿aproximadamente cuántas acciones se necesitan para lograr un portafolio bien diversificado?", "o": ["Alrededor de 30", "2", "Más de 500", "Exactamente 10"], "e": "Statman encontró que se necesitan unas 30 acciones (o más) para eliminar la mayor parte del riesgo diversificable."}, {"q": "El riesgo que puede eliminarse con diversificación también se llama:", "o": ["Riesgo no sistemático, específico o idiosincrático", "Riesgo de mercado", "Riesgo sistemático", "Riesgo país"], "e": "El riesgo específico depende de cada emisor y se reduce al diversificar. El sistemático afecta a todo el mercado y no se elimina."}, {"q": "¿Cuál de los siguientes es un supuesto del modelo de Markowitz?", "o": ["Los inversionistas son adversos al riesgo y eligen con base en media y varianza", "Los inversionistas son amantes del riesgo", "No existen costos de oportunidad", "Los retornos no tienen varianza"], "e": "Markowitz supone inversionistas racionales y adversos al riesgo que evalúan solo rentabilidad esperada y varianza en un periodo."}, {"q": "Un portafolio domina a otro cuando:", "o": ["Ofrece mayor rentabilidad con el mismo riesgo, o menor riesgo con la misma rentabilidad", "Tiene más activos", "Tiene mayor volatilidad", "Tiene mayor tracking error"], "e": "El criterio de dominancia lleva a la frontera eficiente: ningún inversionista racional elige un portafolio dominado."}, {"q": "Si dos activos tienen correlación de +1, combinar ambos en un portafolio:", "o": ["No reduce el riesgo: la volatilidad es el promedio ponderado de las volatilidades", "Elimina todo el riesgo", "Duplica la rentabilidad", "Hace que la beta sea cero"], "e": "Con correlación +1 no hay beneficio de diversificación. Con −1 se puede llegar a un portafolio de riesgo cero."}, {"q": "Si dos activos tienen correlación de −1, es posible:", "o": ["Construir un portafolio con riesgo cero", "Aumentar al máximo el riesgo específico", "Obtener una beta igual a 2", "Eliminar el riesgo sistemático del mercado completo"], "e": "Con correlación perfecta negativa existe una combinación de pesos que elimina la volatilidad del portafolio."}, {"q": "La línea del mercado de capitales (CML) supone que el inversionista puede:", "o": ["Prestar y pedir prestado a la tasa libre de riesgo", "Invertir solo en acciones", "Vender en corto sin límite el activo libre de riesgo pero nunca prestar", "Invertir solo en el portafolio de mínima varianza"], "e": "La CML une el activo libre de riesgo con el portafolio de mercado. A la izquierda del mercado se presta; a la derecha se pide prestado para apalancarse."}, {"q": "El modelo Black-Litterman (1990) mejora la optimización media-varianza porque:", "o": ["Combina el equilibrio de mercado con las visiones propias del inversionista", "Elimina el uso de covarianzas", "Supone que todos los activos tienen beta 1", "Usa solo análisis técnico"], "e": "Parte de los retornos implícitos del equilibrio de mercado y los ajusta con las visiones del gestor, lo que da asignaciones más estables y diversificadas."}, {"q": "Para optimizar un portafolio de 50 activos por Markowitz, ¿cuántas covarianzas distintas deben estimarse?", "o": ["1.225", "2.500", "50", "12.250"], "e": "n(n−1)/2 = 50×49/2 = 1.225 covarianzas, además de 50 varianzas y 50 rentabilidades esperadas."}, {"q": "¿Quiénes desarrollaron el CAPM?", "o": ["Sharpe, Lintner y Black (sobre el trabajo de Markowitz)", "Fama y French", "Kahneman y Tversky", "Black y Scholes únicamente"], "e": "El CAPM surge en los años 60 con Sharpe, Lintner y Mossin, y Black lo extiende en 1972 sin préstamo libre de riesgo."}, {"q": "En Colombia, una forma de estimar la tasa libre de riesgo para el CAPM en pesos es:", "o": ["Bono del Tesoro de EE. UU. + riesgo país + devaluación esperada", "Solo la DTF", "La tasa de usura", "El IPC del último mes"], "e": "Una práctica común parte de la tasa de los bonos del Tesoro de EE. UU., suma la prima por riesgo país y ajusta por devaluación esperada para llevarla a pesos. También se usan los TES."}, {"q": "Por definición, la beta del portafolio de mercado es:", "o": ["1", "0", "−1", "Igual a su desviación estándar"], "e": "La beta mide la sensibilidad frente al mercado. El mercado frente a sí mismo tiene beta 1."}, {"q": "Una acción con beta cercana a 0,5 se considera:", "o": ["Defensiva: se mueve menos que el mercado", "Agresiva: amplifica los movimientos del mercado", "Libre de riesgo", "Inversa al mercado"], "e": "Beta menor que 1 indica activos defensivos (por ejemplo, servicios públicos). Beta mayor que 1 indica activos cíclicos o agresivos."}, {"q": "La diferencia entre la SML y la CML es que:", "o": ["La SML usa la beta (riesgo sistemático) y aplica a cualquier activo; la CML usa la desviación estándar y aplica a portafolios eficientes", "La SML usa la desviación estándar y la CML usa la beta", "Son la misma recta", "La CML aplica solo a renta fija"], "e": "La CML relaciona retorno y riesgo total para portafolios eficientes. La SML relaciona retorno y beta para cualquier activo o portafolio."}, {"q": "La teoría de valoración por arbitraje (APT) de Ross (1976) se basa en:", "o": ["Que el retorno depende de varios factores de riesgo y que no deben existir oportunidades de arbitraje", "Que solo el riesgo de mercado explica el retorno", "Que los mercados son ineficientes", "Que los inversionistas son amantes del riesgo"], "e": "La APT es multifactorial y no exige identificar el portafolio de mercado. Su supuesto central es la ausencia de arbitraje."}, {"q": "El modelo de tres factores de Fama y French agrega al CAPM:", "o": ["Un factor de tamaño (SMB) y un factor de valor (HML)", "Un factor de inflación y otro de PIB", "El momentum y la liquidez", "La duración y la convexidad"], "e": "SMB (small minus big) captura la prima de empresas pequeñas y HML (high minus low) la prima de empresas con alta relación valor en libros/valor de mercado."}, {"q": "En el modelo de Fama y French, el factor HML se construye con:", "o": ["La diferencia de retornos entre empresas con alta y baja relación valor en libros/valor de mercado", "La diferencia de retornos entre empresas pequeñas y grandes", "La beta de mercado", "La prima por plazo de los bonos"], "e": "HML = high minus low book-to-market. Las empresas 'de valor' (B/M alto) históricamente han rentado más que las 'de crecimiento'."}, {"q": "La hipótesis de mercados eficientes fue formulada principalmente por:", "o": ["Eugene Fama (1970)", "Harry Markowitz (1952)", "William Sharpe (1964)", "Daniel Kahneman (1979)"], "e": "Fama sistematizó la hipótesis en 1970 y recibió el Nobel de Economía en 2013."}, {"q": "Según la forma débil de eficiencia del mercado:", "o": ["Los precios reflejan toda la información histórica de precios, por lo que el análisis técnico no da ganancias anormales", "Los precios reflejan toda la información, incluida la privada", "El análisis fundamental siempre gana", "Los precios no reflejan ninguna información"], "e": "Débil: precios pasados. Semifuerte: toda la información pública. Fuerte: toda la información, incluso privada."}, {"q": "Si el mercado es eficiente en forma fuerte:", "o": ["Ni siquiera con información privada se obtienen retornos anormales", "El análisis técnico da ganancias", "Solo el análisis fundamental funciona", "Los precios son aleatorios y no reflejan nada"], "e": "En la forma fuerte los precios ya incorporan toda la información, pública y privada."}, {"q": "La teoría prospectiva (Kahneman y Tversky, 1979) sostiene que:", "o": ["Las pérdidas se sienten más intensamente que las ganancias de igual monto", "Los inversionistas son siempre racionales", "Las ganancias pesan más que las pérdidas", "La utilidad depende solo de la riqueza final"], "e": "Las personas evalúan resultados frente a un punto de referencia y una pérdida duele aproximadamente 2 a 2,5 veces más que una ganancia equivalente."}, {"q": "El sesgo de disponibilidad consiste en:", "o": ["Sobreestimar la probabilidad de eventos que se recuerdan con facilidad o son recientes", "Buscar solo información que confirme lo que se piensa", "Mantener una posición por no tomar decisiones", "Seguir lo que hace la mayoría"], "e": "Es una heurística: se juzga la probabilidad por lo fácil que es recordar ejemplos (noticias recientes, experiencias propias)."}, {"q": "Un inversionista solo lee análisis que respaldan su decisión de comprar una acción e ignora los negativos. Presenta sesgo de:", "o": ["Confirmación", "Disponibilidad", "Status quo", "Aversión a la pérdida"], "e": "El sesgo de confirmación lleva a buscar y sobrevalorar la información que apoya las creencias previas."}, {"q": "El sesgo de representatividad se presenta cuando el inversionista:", "o": ["Juzga por estereotipos o patrones recientes, por ejemplo cree que una buena empresa es siempre una buena inversión", "Mantiene su portafolio sin cambios por comodidad", "Vende rápido las ganadoras", "Confía demasiado en su capacidad"], "e": "Representatividad: clasificar algo según su parecido con un estereotipo e ignorar la probabilidad base."}, {"q": "Barber y Odean documentaron que los inversionistas con exceso de confianza tienden a:", "o": ["Negociar más y obtener peores rentabilidades netas", "Diversificar más", "Negociar menos y ganar más", "Invertir solo en renta fija"], "e": "El exceso de confianza lleva a operar en exceso. Los costos de transacción reducen el retorno neto. Los autores hallaron el efecto más fuerte en hombres."}, {"q": "Un cliente mantiene durante años el mismo portafolio heredado, aunque ya no se ajusta a sus objetivos, porque cambiarlo le genera incomodidad. Presenta sesgo de:", "o": ["Status quo", "Manada", "Disponibilidad", "Exceso de confianza"], "e": "El sesgo de status quo es la preferencia por dejar las cosas como están, aun cuando cambiar sería mejor."}, {"q": "El efecto manada en los mercados se refiere a:", "o": ["Imitar las decisiones de la mayoría sin análisis propio", "Diversificar entre muchos activos", "Preferir activos locales", "Mantener las pérdidas esperando recuperarlas"], "e": "El comportamiento de manada amplifica burbujas y caídas porque los inversionistas siguen al grupo."}, {"q": "Mantener acciones perdedoras demasiado tiempo para no realizar la pérdida es una manifestación de:", "o": ["Aversión a la pérdida", "Exceso de confianza", "Conservatismo", "Sesgo de disponibilidad"], "e": "Por aversión a la pérdida los inversionistas evitan materializar pérdidas y venden muy pronto las ganadoras (efecto disposición)."}, {"q": "El sesgo de conservatismo consiste en:", "o": ["Aferrarse a una creencia previa y ajustarla poco frente a información nueva", "Invertir solo en activos conservadores", "Seguir a la mayoría", "Operar en exceso"], "e": "Es un sesgo cognitivo: el inversionista reacciona con lentitud a nueva información relevante."}, {"q": "Un cliente acepta una inversión presentada como '90 % de probabilidad de ganar' pero rechaza la misma presentada como '10 % de probabilidad de perder'. Presenta sesgo de:", "o": ["Dependencia de la forma (framing)", "Status quo", "Manada", "Conservatismo"], "e": "El framing hace que la decisión cambie según cómo se presenta la información, aunque el contenido sea el mismo."}, {"q": "En finanzas comportamentales, los sesgos se clasifican en:", "o": ["Cognitivos (errores de razonamiento) y emocionales (sentimientos e impulsos)", "Técnicos y fundamentales", "Sistemáticos y no sistemáticos", "Activos y pasivos"], "e": "Los cognitivos (confirmación, representatividad, conservatismo, framing) pueden corregirse con información. Los emocionales (exceso de confianza, aversión a la pérdida, status quo) son más difíciles de corregir y a veces conviene adaptarse a ellos."}, {"q": "El primer índice bursátil moderno, creado en 1896, fue:", "o": ["El Dow Jones Industrial Average", "El S&P 500", "El MSCI COLCAP", "El Nasdaq"], "e": "Charles Dow creó el índice industrial en 1896. Es ponderado por precio."}, {"q": "¿Cuál de los siguientes NO es un método de ponderación de índices bursátiles?", "o": ["Ponderación por calificación crediticia", "Por capitalización bursátil", "Por capital flotante", "Equiponderado"], "e": "Los índices se ponderan por capitalización, por capitalización ajustada por flotante, por igual peso o por precio."}, {"q": "Un ETF se diferencia de un fondo de inversión tradicional principalmente porque:", "o": ["Se negocia en bolsa durante toda la jornada a precios de mercado", "Solo se redime una vez al año", "No puede replicar índices", "No tiene comisiones"], "e": "El ETF (exchange traded fund) cotiza en bolsa como una acción y suele replicar un índice a bajo costo."}, {"q": "El primer fondo indexado para inversionistas minoristas fue lanzado en 1976 por:", "o": ["Vanguard", "BlackRock", "Goldman Sachs", "La Bolsa de Valores de Colombia"], "e": "John Bogle lanzó en Vanguard el primer fondo indexado al S&P 500 en agosto de 1976."}, {"q": "¿Cuál es una ventaja de la gestión activa frente a la pasiva?", "o": ["La posibilidad de superar al benchmark (generar alfa)", "Menores comisiones", "Menor rotación del portafolio", "Garantía de rentabilidad"], "e": "La gestión activa busca alfa, pero con mayores costos y el riesgo de rentar por debajo del índice."}, {"q": "¿Cuál es una desventaja de la gestión activa?", "o": ["Costos y comisiones más altos que pueden erosionar el alfa", "No permite desviarse del índice", "Siempre renta menos que el mercado", "No requiere análisis"], "e": "Más análisis y más rotación implican más costos. Muchos gestores no superan su benchmark después de costos."}, {"q": "El alfa de un portafolio representa:", "o": ["El retorno obtenido por encima de su benchmark o de lo que predice su riesgo", "Su sensibilidad al mercado", "Su volatilidad total", "La tasa libre de riesgo"], "e": "El alfa puede medirse como exceso frente al benchmark (Rp − Rb) o como alfa de Jensen frente al CAPM."}, {"q": "Cubrir solo las posiciones que el gestor considera más expuestas, y no todo el portafolio, es una cobertura:", "o": ["Selectiva", "Total", "Natural", "Pasiva"], "e": "Las coberturas pueden ser totales (todo el riesgo), selectivas (parte) o activas (se ajustan según la visión de mercado)."}, {"q": "¿Cuál de las siguientes es una característica de un buen benchmark?", "o": ["Debe definirse antes del periodo de evaluación", "Debe elegirse al final del periodo según lo que mejor resultó", "Debe ser imposible de replicar", "Debe tener activos que el gestor no puede comprar"], "e": "Un buen benchmark es preciso, replicable (invertible), medible, apropiado al estilo del gestor y se especifica de antemano."}, {"q": "El índice MSCI COLCAP inició con un valor base de:", "o": ["1.000 puntos (15 de enero de 2008)", "100 puntos (2001)", "10.000 puntos (2013)", "500 puntos (2015)"], "e": "El COLCAP comenzó el 15 de enero de 2008 con base 1.000. En 2021 pasó a ser calculado por MSCI."}, {"q": "La recomposición trimestral del MSCI COLCAP se realiza en los meses de:", "o": ["Enero, abril, julio y octubre", "Marzo, junio, septiembre y diciembre", "Solo en enero", "Febrero y agosto"], "e": "MSCI revisa la canasta trimestralmente (enero, abril, julio y octubre) y anuncia los cambios con antelación."}, {"q": "Un benchmark combinado, por ejemplo 50 % MSCI COLCAP y 50 % COLTES, se usa cuando:", "o": ["El portafolio invierte en varias clases de activos", "El portafolio solo tiene acciones", "No se quiere medir el desempeño", "El gestor elige el índice al final del año"], "e": "Los benchmarks combinados reflejan la asignación estratégica de un portafolio mixto."}, {"q": "La razón de información (information ratio) se calcula como:", "o": ["Alfa / tracking error", "(Rp − rf) / σp", "(Rp − rf) / beta", "Beta / alfa"], "e": "Mide cuánto alfa se generó por cada unidad de desviación frente al benchmark."}, {"q": "Una razón de información de 0,5 se considera, según la guía:", "o": ["Aceptable: hubo alfa positivo sin asumir un tracking error excesivo", "Pésima: el gestor destruyó valor", "Imposible de lograr", "Señal de que el portafolio replica exactamente el índice"], "e": "Entre 0,40 y 0,60 se considera aceptable. Por encima de 1 es poco común y sobresaliente."}, {"q": "Una razón de información negativa indica que:", "o": ["El portafolio rentó menos que su benchmark", "El portafolio superó al benchmark", "La volatilidad fue cero", "La beta es negativa"], "e": "Si el alfa (Rp − Rb) es negativo, el information ratio es negativo."}, {"q": "Las medidas de desempeño se agrupan en:", "o": ["Absolutas, relativas y ajustadas por riesgo", "Técnicas y fundamentales", "Activas y pasivas", "Cognitivas y emocionales"], "e": "Absoluta: el retorno o la volatilidad. Relativa: alfa, beta, tracking error. Ajustada por riesgo: Sharpe, Treynor, información."}, {"q": "El análisis de atribución de desempeño (performance attribution) busca:", "o": ["Descomponer el alfa en la parte explicada por asignación de activos y la parte por selección de títulos", "Calcular la comisión del gestor", "Definir el perfil del cliente", "Estimar el VaR"], "e": "La atribución identifica qué decisiones del gestor agregaron o restaron valor frente al benchmark."}, {"q": "En el análisis de atribución, una decisión de asignación genera alfa positivo cuando el gestor:", "o": ["Sobrepondera clases con retorno superior al del benchmark total o infrapondera clases con retorno inferior", "Sobrepondera clases con retorno inferior al benchmark", "Mantiene exactamente los pesos del benchmark", "Invierte todo en efectivo"], "e": "Contribución = (peso portafolio − peso benchmark) × (retorno de la clase − retorno total del benchmark). Es positiva si ambos factores tienen el mismo signo."}, {"q": "El efecto interacción en la atribución de desempeño mide:", "o": ["El impacto conjunto de la asignación de activos y la selección de títulos", "Solo el efecto de las comisiones", "La correlación entre dos acciones", "El efecto de la inflación"], "e": "Además de asignación y selección, existe un término que captura cómo se combinan ambas decisiones."}, {"q": "Una acción se compró en COP 2.500, pagó un dividendo de COP 150 y hoy vale COP 2.650. ¿Cuál es su retorno de periodo de tenencia (HPR)?", "o": ["12,00 %", "6,00 %", "11,32 %", "0,00 %"], "e": "HPR = (P1 − P0 + D)/P0 = (2.650 − 2.500 + 150)/2.500 = 12,00 %."}, {"q": "Una acción se compró en COP 18.000, pagó un dividendo de COP 700 y hoy vale COP 19.100. ¿Cuál es su retorno de periodo de tenencia (HPR)?", "o": ["10,00 %", "6,11 %", "9,42 %", "3,89 %"], "e": "HPR = (P1 − P0 + D)/P0 = (19.100 − 18.000 + 700)/18.000 = 10,00 %."}, {"q": "Una acción se compró en COP 4.200, pagó un dividendo de COP 250 y hoy vale COP 4.000. ¿Cuál es su retorno de periodo de tenencia (HPR)?", "o": ["1,19 %", "-4,76 %", "1,25 %", "5,95 %"], "e": "HPR = (P1 − P0 + D)/P0 = (4.000 − 4.200 + 250)/4.200 = 1,19 %."}, {"q": "Una acción se compró en COP 32.000, pagó un dividendo de COP 960 y hoy vale COP 35.200. ¿Cuál es su retorno de periodo de tenencia (HPR)?", "o": ["13,00 %", "10,00 %", "11,82 %", "3,00 %"], "e": "HPR = (P1 − P0 + D)/P0 = (35.200 − 32.000 + 960)/32.000 = 13,00 %."}, {"q": "Una acción se compró en COP 9.000, pagó un dividendo de COP 180 y hoy vale COP 8.550. ¿Cuál es su retorno de periodo de tenencia (HPR)?", "o": ["-3,00 %", "-5,00 %", "-3,16 %", "2,00 %"], "e": "HPR = (P1 − P0 + D)/P0 = (8.550 − 9.000 + 180)/9.000 = -3,00 %."}, {"q": "Una acción se compró en COP 12.500, pagó un dividendo de COP 500 y hoy vale COP 13.000. ¿Cuál es su retorno de periodo de tenencia (HPR)?", "o": ["8,00 %", "4,00 %", "7,69 %", "0,00 %"], "e": "HPR = (P1 − P0 + D)/P0 = (13.000 − 12.500 + 500)/12.500 = 8,00 %."}, {"q": "Un activo tiene 30 % de probabilidad de rentar 20 %, 50 % de probabilidad de rentar 10 %, 20 % de probabilidad de rentar 0 %. ¿Cuál es su rentabilidad esperada?", "o": ["11,00 %", "10,00 %", "20,00 %", "12,00 %"], "e": "E(R) = Σ pᵢ·Rᵢ = 0,30×20 % + 0,50×10 % + 0,20×0 % = 11,00 %."}, {"q": "Un activo tiene 25 % de probabilidad de rentar 18 %, 50 % de probabilidad de rentar 8 %, 25 % de probabilidad de rentar -6 %. ¿Cuál es su rentabilidad esperada?", "o": ["7,00 %", "6,67 %", "18,00 %", "8,00 %"], "e": "E(R) = Σ pᵢ·Rᵢ = 0,25×18 % + 0,50×8 % + 0,25×-6 % = 7,00 %."}, {"q": "Un activo tiene 20 % de probabilidad de rentar 25 %, 60 % de probabilidad de rentar 12 %, 20 % de probabilidad de rentar -10 %. ¿Cuál es su rentabilidad esperada?", "o": ["10,20 %", "9,00 %", "25,00 %", "11,20 %"], "e": "E(R) = Σ pᵢ·Rᵢ = 0,20×25 % + 0,60×12 % + 0,20×-10 % = 10,20 %."}, {"q": "Un activo tiene 40 % de probabilidad de rentar 15 %, 40 % de probabilidad de rentar 9 %, 20 % de probabilidad de rentar -5 %. ¿Cuál es su rentabilidad esperada?", "o": ["8,60 %", "6,33 %", "15,00 %", "9,60 %"], "e": "E(R) = Σ pᵢ·Rᵢ = 0,40×15 % + 0,40×9 % + 0,20×-5 % = 8,60 %."}, {"q": "Una acción cuesta COP 12.000, se espera un dividendo de COP 600 el próximo año y que los dividendos crezcan 4,0 % anual. ¿Cuál es la tasa de retorno requerida?", "o": ["9,00 %", "5,00 %", "1,00 %", "4,00 %"], "e": "RRR = D1/P0 + g = 600/12.000 + 4,0 % = 5,00 % + 4,0 % = 9,00 %."}, {"q": "Una acción cuesta COP 30.000, se espera un dividendo de COP 1.200 el próximo año y que los dividendos crezcan 5,0 % anual. ¿Cuál es la tasa de retorno requerida?", "o": ["9,00 %", "4,00 %", "-1,00 %", "5,00 %"], "e": "RRR = D1/P0 + g = 1.200/30.000 + 5,0 % = 4,00 % + 5,0 % = 9,00 %."}, {"q": "Una acción cuesta COP 7.000, se espera un dividendo de COP 350 el próximo año y que los dividendos crezcan 3,0 % anual. ¿Cuál es la tasa de retorno requerida?", "o": ["8,00 %", "5,00 %", "2,00 %", "3,00 %"], "e": "RRR = D1/P0 + g = 350/7.000 + 3,0 % = 5,00 % + 3,0 % = 8,00 %."}, {"q": "Una acción cuesta COP 15.000, se espera un dividendo de COP 900 el próximo año y que los dividendos crezcan 3,5 % anual. ¿Cuál es la tasa de retorno requerida?", "o": ["9,50 %", "6,00 %", "2,50 %", "3,50 %"], "e": "RRR = D1/P0 + g = 900/15.000 + 3,5 % = 6,00 % + 3,5 % = 9,50 %."}, {"q": "Una acción cuesta COP 40.000, se espera un dividendo de COP 2.000 el próximo año y que los dividendos crezcan 4,5 % anual. ¿Cuál es la tasa de retorno requerida?", "o": ["9,50 %", "5,00 %", "0,50 %", "4,50 %"], "e": "RRR = D1/P0 + g = 2.000/40.000 + 4,5 % = 5,00 % + 4,5 % = 9,50 %."}, {"q": "Un portafolio tiene 60 % en A (σ = 20 %) y 40 % en B (σ = 10 %), con correlación 0,3. ¿Cuál es su desviación estándar?", "o": ["13,74 %", "16,00 %", "1,89 %", "12,65 %"], "e": "σp² = wA²σA² + wB²σB² + 2·wA·wB·ρ·σA·σB = 0,018880; σp = √0,018880 = 13,74 %. Solo con ρ = 1 sería el promedio ponderado (16,00 %)."}, {"q": "Un portafolio tiene 50 % en A (σ = 25 %) y 50 % en B (σ = 15 %), con correlación 0,0. ¿Cuál es su desviación estándar?", "o": ["14,58 %", "20,00 %", "2,12 %", "16,76 %"], "e": "σp² = wA²σA² + wB²σB² + 2·wA·wB·ρ·σA·σB = 0,021250; σp = √0,021250 = 14,58 %. Solo con ρ = 1 sería el promedio ponderado (20,00 %)."}, {"q": "Un portafolio tiene 40 % en A (σ = 18 %) y 60 % en B (σ = 8 %), con correlación -0,2. ¿Cuál es su desviación estándar?", "o": ["7,81 %", "12,00 %", "0,61 %", "8,65 %"], "e": "σp² = wA²σA² + wB²σB² + 2·wA·wB·ρ·σA·σB = 0,006106; σp = √0,006106 = 7,81 %. Solo con ρ = 1 sería el promedio ponderado (12,00 %)."}, {"q": "Un portafolio tiene 70 % en A (σ = 22 %) y 30 % en B (σ = 12 %), con correlación 0,5. ¿Cuál es su desviación estándar?", "o": ["17,48 %", "19,00 %", "3,06 %", "15,82 %"], "e": "σp² = wA²σA² + wB²σB² + 2·wA·wB·ρ·σA·σB = 0,030556; σp = √0,030556 = 17,48 %. Solo con ρ = 1 sería el promedio ponderado (19,00 %)."}, {"q": "Un portafolio tiene 30 % en A (σ = 30 %) y 70 % en B (σ = 10 %), con correlación 0,1. ¿Cuál es su desviación estándar?", "o": ["11,94 %", "16,00 %", "1,43 %", "11,40 %"], "e": "σp² = wA²σA² + wB²σB² + 2·wA·wB·ρ·σA·σB = 0,014260; σp = √0,014260 = 11,94 %. Solo con ρ = 1 sería el promedio ponderado (16,00 %)."}, {"q": "Un inversionista pone 60 % de su capital en el portafolio de mercado (retorno esperado 14 %, σ 18 %) y presta (invierte) el resto a la tasa libre de riesgo, con rf = 6 %. ¿Cuál es el retorno esperado y la volatilidad de su posición?", "o": ["10,80 % y 10,80 %", "8,40 % y 10,80 %", "10,80 % y 18,00 %", "14,00 % y 10,80 %"], "e": "Sobre la CML: E(R) = rf + w·(Rm − rf) = 6 % + 0,60×8 % = 10,80 %; σ = w·σm = 10,80 % (el activo libre de riesgo no aporta volatilidad)."}, {"q": "Un inversionista pone 130 % de su capital en el portafolio de mercado (retorno esperado 12 %, σ 16 %) y pide prestado a la tasa libre de riesgo para invertir 130 % de su capital, con rf = 5 %. ¿Cuál es el retorno esperado y la volatilidad de su posición?", "o": ["14,10 % y 20,80 %", "15,60 % y 20,80 %", "14,10 % y 16,00 %", "12,00 % y 20,80 %"], "e": "Sobre la CML: E(R) = rf + w·(Rm − rf) = 5 % + 1,30×7 % = 14,10 %; σ = w·σm = 20,80 % (el activo libre de riesgo no aporta volatilidad)."}, {"q": "Un inversionista pone 40 % de su capital en el portafolio de mercado (retorno esperado 15 %, σ 20 %) y presta (invierte) el resto a la tasa libre de riesgo, con rf = 7 %. ¿Cuál es el retorno esperado y la volatilidad de su posición?", "o": ["10,20 % y 8,00 %", "6,00 % y 8,00 %", "10,20 % y 20,00 %", "15,00 % y 8,00 %"], "e": "Sobre la CML: E(R) = rf + w·(Rm − rf) = 7 % + 0,40×8 % = 10,20 %; σ = w·σm = 8,00 % (el activo libre de riesgo no aporta volatilidad)."}, {"q": "Un inversionista pone 150 % de su capital en el portafolio de mercado (retorno esperado 13 %, σ 15 %) y pide prestado a la tasa libre de riesgo para invertir 150 % de su capital, con rf = 6 %. ¿Cuál es el retorno esperado y la volatilidad de su posición?", "o": ["16,50 % y 22,50 %", "19,50 % y 22,50 %", "16,50 % y 15,00 %", "13,00 % y 22,50 %"], "e": "Sobre la CML: E(R) = rf + w·(Rm − rf) = 6 % + 1,50×7 % = 16,50 %; σ = w·σm = 22,50 % (el activo libre de riesgo no aporta volatilidad)."}, {"q": "Un FIC rentó 15,0 %, su benchmark 13,0 %, rf = 6,2 %, σ del fondo 8,5 %, beta 1,10 y tracking error 2,0 %. ¿Cuál es su razón de información?", "o": ["1,00", "1,04", "2,00", "4,40"], "e": "IR = alfa / TE = (15,0 % − 13,0 %)/2,0 % = 1,00. (Sharpe = 1,04; Treynor = 8,00 %.)"}, {"q": "Un FIC rentó 15,0 %, rf = 6,2 %, σ del fondo 8,5 % y beta 1,10. ¿Cuál es su razón de Treynor?", "o": ["8,00 %", "1,04", "13,64 %", "9,68 %"], "e": "Treynor = (Rp − rf)/β = 8,8 %/1,10 = 8,00 % por unidad de riesgo sistemático."}, {"q": "Un FIC rentó 12,0 %, su benchmark 10,0 %, rf = 5,0 %, σ del fondo 10,0 %, beta 0,90 y tracking error 4,0 %. ¿Cuál es su razón de información?", "o": ["0,50", "0,70", "2,00", "1,75"], "e": "IR = alfa / TE = (12,0 % − 10,0 %)/4,0 % = 0,50. (Sharpe = 0,70; Treynor = 7,78 %.)"}, {"q": "Un FIC rentó 12,0 %, rf = 5,0 %, σ del fondo 10,0 % y beta 0,90. ¿Cuál es su razón de Treynor?", "o": ["7,78 %", "0,70", "13,33 %", "6,30 %"], "e": "Treynor = (Rp − rf)/β = 7,0 %/0,90 = 7,78 % por unidad de riesgo sistemático."}, {"q": "Un FIC rentó 18,0 %, su benchmark 15,0 %, rf = 7,0 %, σ del fondo 14,0 %, beta 1,20 y tracking error 5,0 %. ¿Cuál es su razón de información?", "o": ["0,60", "0,79", "3,00", "2,20"], "e": "IR = alfa / TE = (18,0 % − 15,0 %)/5,0 % = 0,60. (Sharpe = 0,79; Treynor = 9,17 %.)"}, {"q": "Un FIC rentó 18,0 %, rf = 7,0 %, σ del fondo 14,0 % y beta 1,20. ¿Cuál es su razón de Treynor?", "o": ["9,17 %", "0,79", "15,00 %", "13,20 %"], "e": "Treynor = (Rp − rf)/β = 11,0 %/1,20 = 9,17 % por unidad de riesgo sistemático."}, {"q": "Un FIC rentó 9,0 %, su benchmark 11,0 %, rf = 6,0 %, σ del fondo 7,0 %, beta 0,80 y tracking error 3,0 %. ¿Cuál es su razón de información?", "o": ["-0,67", "0,43", "-2,00", "1,00"], "e": "IR = alfa / TE = (9,0 % − 11,0 %)/3,0 % = -0,67. (Sharpe = 0,43; Treynor = 3,75 %.)"}, {"q": "Un FIC rentó 9,0 %, rf = 6,0 %, σ del fondo 7,0 % y beta 0,80. ¿Cuál es su razón de Treynor?", "o": ["3,75 %", "0,43", "11,25 %", "2,40 %"], "e": "Treynor = (Rp − rf)/β = 3,0 %/0,80 = 3,75 % por unidad de riesgo sistemático."}, {" "reg": [{"q": "Según la Ley 964 de 2005, ¿qué características debe tener un derecho para ser considerado valor?", "o": ["Ser de naturaleza negociable, hacer parte de una emisión y tener por objeto o efecto la captación de recursos del público", "Estar inscrito en una bolsa de valores y tener calificación de riesgo", "Ser emitido por una entidad vigilada por la Superintendencia Financiera", "Tener un plazo de vencimiento superior a un año"], "e": "El artículo 2 de la Ley 964 de 2005 define valor como todo derecho de naturaleza negociable que haga parte de una emisión, cuando tenga por objeto o efecto la captación de recursos del público. La inscripción en bolsa, la calificación o el plazo no son requisitos de la definición."}, {"q": "Una oferta es pública cuando se dirige a:", "o": ["Personas no determinadas o a cien (100) o más personas determinadas", "Más de cincuenta (50) personas determinadas", "Cualquier persona natural, sin importar el número", "Inversionistas profesionales únicamente"], "e": "El Decreto 2555 de 2010 considera pública la oferta dirigida a personas no determinadas o a cien o más personas determinadas, con el fin de suscribir, enajenar o adquirir valores."}, {"q": "¿Cuáles registros conforman el Sistema Integral de Información del Mercado de Valores (SIMEV)?", "o": ["RNVE, RNAMV y RNPMV", "RNVE, SARLAFT y SIAR", "Registro mercantil, RNVE y RUT", "RNPMV, registro de accionistas y libro de actas"], "e": "El SIMEV está compuesto por el Registro Nacional de Valores y Emisores (RNVE), el Registro Nacional de Agentes del Mercado de Valores (RNAMV) y el Registro Nacional de Profesionales del Mercado de Valores (RNPMV)."}, {"q": "¿En qué registro deben inscribirse las personas naturales que actúan como operadores en el mercado de valores?", "o": ["Registro Nacional de Profesionales del Mercado de Valores (RNPMV)", "Registro Nacional de Valores y Emisores (RNVE)", "Registro Nacional de Agentes del Mercado de Valores (RNAMV)", "Registro Único Tributario (RUT)"], "e": "Las personas naturales que ejercen actividades del mercado de valores se inscriben en el RNPMV. El RNAMV es para las entidades (agentes) y el RNVE para los valores y sus emisores."}, {"q": "¿Cuál es la entidad que ejerce la inspección, vigilancia y control sobre los intermediarios de valores en Colombia?", "o": ["La Superintendencia Financiera de Colombia", "El Autorregulador del Mercado de Valores (AMV)", "El Banco de la República", "La Bolsa de Valores de Colombia"], "e": "La SFC ejerce la supervisión estatal. AMV es un organismo de autorregulación, de naturaleza privada, y la Bolsa es un proveedor de infraestructura."}, {"q": "Un cliente acredita un patrimonio de 160.000 UVT y un portafolio de inversión de 80.000 UVT. ¿Cómo puede clasificarlo el intermediario?", "o": ["Como inversionista profesional, porque supera el patrimonio de 157.878,12 UVT y el portafolio de 78.939,06 UVT", "Solo como cliente inversionista, porque es persona natural", "Como inversionista profesional, únicamente si además tiene certificación AMV", "Como contraparte institucional, sin ningún régimen de protección"], "e": "El artículo 7.2.1.1.2 del Decreto 2555 exige un patrimonio igual o superior a 157.878,12 UVT y, además, un portafolio de al menos 78.939,06 UVT o haber hecho 15 o más operaciones en 60 días (dentro de los dos años anteriores) por al menos 552.573,41 UVT. Este cliente cumple patrimonio y portafolio."}, {"q": "¿Cuál es la principal diferencia de protección entre un cliente inversionista y un inversionista profesional?", "o": ["El cliente inversionista recibe un mayor nivel de protección y deberes del intermediario más estrictos", "El inversionista profesional no puede presentar quejas ante el defensor del consumidor", "El cliente inversionista no puede invertir en renta variable", "No hay diferencia; ambos reciben el mismo trato"], "e": "La clasificación existe para graduar la protección: el cliente inversionista, por tener menos experiencia o capacidad, recibe la mayor protección, por ejemplo en el deber de asesoría y en la información que debe recibir."}, {"q": "¿Cuál de los siguientes NO es un deber general de los intermediarios de valores?", "o": ["Garantizar una rentabilidad mínima al cliente", "Deber de información", "Deber de mejor ejecución", "Deber de documentación"], "e": "Los intermediarios tienen deberes de información, documentación, separación de activos, confidencialidad, mejor ejecución y manejo de conflictos de interés, entre otros. Nunca pueden garantizar rentabilidad en inversiones de riesgo."}, {"q": "En el contrato de comisión para la compra y venta de valores, la sociedad comisionista actúa:", "o": ["En nombre propio y por cuenta del cliente", "En nombre y por cuenta del cliente", "En nombre propio y por cuenta propia", "En nombre del cliente y por cuenta propia"], "e": "La comisión es un mandato sin representación: el comisionista actúa en su propio nombre pero por cuenta de un tercero (el comitente)."}, {"q": "¿Qué es el corretaje en el mercado de valores?", "o": ["Poner en contacto a dos o más partes para que celebren un negocio sobre valores, sin estar vinculado a ellas", "Comprar valores con recursos propios para venderlos después", "Administrar un portafolio de valores de un tercero", "Custodiar los valores de un cliente"], "e": "El corredor pone en relación a las partes para que concluyan un negocio, sin estar ligado a ellas por relaciones de colaboración, dependencia, mandato o representación."}, {"q": "Una operación por cuenta propia de un intermediario es aquella en la que:", "o": ["El intermediario actúa con sus propios recursos y asume el riesgo de la operación", "El intermediario actúa por cuenta de un cliente con recursos de este", "El intermediario solo pone en contacto a dos clientes", "El intermediario custodia valores del cliente"], "e": "En la cuenta propia la entidad negocia valores para sí misma, con sus recursos y asumiendo el riesgo, sin que medie una orden de un cliente."}, {"q": "La administración de portafolios de terceros (APT) se caracteriza porque:", "o": ["El intermediario administra valores de un cliente de forma individual, según un contrato y su perfil", "Los recursos de muchos inversionistas se agrupan en un solo fondo", "El cliente da una orden específica por cada operación", "Solo pueden prestarla los bancos"], "e": "En el contrato de APT se gestiona el portafolio de un cliente de manera individual. Cuando los recursos de varios inversionistas se agrupan, se habla de fondos de inversión colectiva."}, {"q": "¿Qué entidades pueden administrar fondos de inversión colectiva en Colombia?", "o": ["Sociedades fiduciarias, sociedades comisionistas de bolsa y sociedades administradoras de inversión", "Bancos comerciales, cooperativas y aseguradoras", "Solo sociedades fiduciarias", "Fondos de pensiones y cajas de compensación"], "e": "El Decreto 2555 de 2010 autoriza a las sociedades fiduciarias, las sociedades comisionistas de bolsa de valores y las sociedades administradoras de inversión para administrar FIC."}, {"q": "Una operación de contado en el mercado de valores es aquella cuyo cumplimiento se pacta:", "o": ["El mismo día (T+0) o hasta tres días hábiles después de la celebración", "Siempre en T+0", "Entre uno y treinta días calendario", "Más de tres días hábiles después de la celebración"], "e": "Se consideran de contado las operaciones que se cumplen entre T+0 y T+3. Las que se pactan a un plazo mayor son operaciones a plazo."}, {"q": "En una operación repo, el enajenante:", "o": ["Transfiere la propiedad de unos valores a cambio de dinero y se compromete a readquirirlos en una fecha posterior", "Presta unos valores a cambio de otros valores, sin recibir dinero", "Vende definitivamente los valores sin compromiso de recompra", "Recibe valores y entrega dinero sin obligación posterior"], "e": "En el repo el enajenante transfiere valores, recibe dinero y se obliga a readquirir valores de la misma especie y características a un precio y en una fecha pactados. Es una operación de liquidez."}, {"q": "¿Cuál es una diferencia clave entre una operación simultánea y una operación repo?", "o": ["En la simultánea no se pueden establecer restricciones a la movilidad de los valores", "En la simultánea no hay intercambio de dinero", "La simultánea solo puede pactarse a más de un año", "El repo no implica transferencia de propiedad"], "e": "En el repo se pueden pactar restricciones a la movilidad de los valores; en la simultánea no. En ambas hay transferencia de propiedad y dinero."}, {"q": "En una transferencia temporal de valores (TTV), el originador:", "o": ["Transfiere valores al receptor, quien entrega como garantía otros valores o dinero y se compromete a devolver valores de la misma especie", "Vende valores de forma definitiva", "Recibe dinero sin entregar valores", "Garantiza una rentabilidad mínima al receptor"], "e": "La TTV es un préstamo de valores: el originador entrega valores y el receptor entrega garantías (valores o dinero) y se obliga a restituir valores de la misma especie y características."}, {"q": "Las operaciones repo, simultáneas y TTV, por regla general, no pueden tener un plazo superior a:", "o": ["Un año", "Tres días hábiles", "Seis meses", "Cinco años"], "e": "El plazo inicialmente convenido no puede superar un año, salvo cuando una cámara de riesgo central de contraparte se interpone como contraparte y administra la compensación y liquidación."}, {"q": "La operación conocida como 'carrusel' consiste en:", "o": ["Una serie de operaciones sucesivas sobre un mismo valor con varios compradores, cada uno por un tramo del plazo", "Una operación de cobertura con derivados de tasa de cambio", "Una oferta pública de adquisición de acciones", "La compra de un portafolio diversificado de acciones"], "e": "En el carrusel varios inversionistas se suceden en la tenencia de un mismo título, cada uno por un tramo del plazo, mediante compraventas encadenadas. Es una operación estructurada que la regulación restringe."}, {"q": "¿Cuándo es obligatorio realizar una oferta pública de adquisición (OPA)?", "o": ["Cuando alguien quiere convertirse en beneficiario real del 25 % o más de las acciones con derecho a voto de una sociedad inscrita", "Siempre que se compre cualquier acción en bolsa", "Cuando una sociedad emite bonos por primera vez", "Cuando un fondo de pensiones invierte en acciones"], "e": "La OPA es obligatoria para quien pretenda alcanzar el 25 % o más del capital con derecho a voto de una sociedad inscrita, o aumentar en más del 5 % una participación que ya supera ese umbral. Busca proteger a los accionistas minoritarios."}, {"q": "¿Qué función cumple un depósito centralizado de valores (DCV o Deceval)?", "o": ["Custodiar y administrar valores, y permitir su transferencia mediante anotaciones en cuenta", "Fijar las tasas de interés del mercado", "Calificar el riesgo de los emisores", "Supervisar a las sociedades comisionistas"], "e": "Los depósitos centralizados reciben en depósito los valores, los administran y permiten su transferencia por anotación en cuenta (desmaterialización)."}, {"q": "La cámara de riesgo central de contraparte (CRCC) se caracteriza porque:", "o": ["Se interpone entre comprador y vendedor, convirtiéndose en contraparte de ambos", "Califica el riesgo crediticio de las emisiones", "Administra los fondos de pensiones obligatorias", "Registra los valores en el RNVE"], "e": "La CRCC actúa como comprador frente al vendedor y vendedor frente al comprador, gestionando el riesgo de contraparte con garantías."}, {"q": "¿Qué miden las sociedades calificadoras de riesgo?", "o": ["La capacidad del emisor de cumplir oportunamente con sus obligaciones", "La rentabilidad futura de una acción", "El cumplimiento de las normas de AMV", "El precio justo de mercado de un valor"], "e": "La calificación expresa una opinión sobre la probabilidad de pago oportuno de capital e intereses de un valor o la solidez de una entidad. No es una recomendación de inversión ni un precio."}, {"q": "¿Qué es el mercado mostrador (OTC)?", "o": ["El que se desarrolla por fuera de los sistemas de negociación de valores", "El mercado de la bolsa de valores para acciones", "El mercado donde solo negocia el Banco de la República", "El mercado de valores no inscritos en el RNVE"], "e": "El mercado mostrador u OTC es el que se realiza fuera de los sistemas de negociación. Las operaciones que se hacen allí deben registrarse en un sistema de registro autorizado."}, {"q": "El mercado primario es aquel en el que:", "o": ["Los valores se colocan por primera vez y el emisor recibe los recursos", "Los inversionistas negocian entre sí valores ya emitidos", "Se negocian únicamente títulos de deuda pública", "Solo participan inversionistas profesionales"], "e": "En el mercado primario el emisor coloca los valores y capta los recursos. En el secundario los inversionistas negocian valores ya emitidos."}, {"q": "¿Cuál es el título de deuda pública interna más negociado en Colombia?", "o": ["Los TES", "Los CDT", "Las aceptaciones bancarias", "Los papeles comerciales"], "e": "Los Títulos de Tesorería (TES), emitidos por la Nación, son el principal instrumento de deuda pública interna y el más negociado del mercado de renta fija."}, {"q": "Los papeles comerciales son valores de deuda con plazo:", "o": ["Superior a 15 días e inferior a un año", "Superior a cinco años", "Exactamente de 90 días", "Indefinido"], "e": "Los papeles comerciales son pagarés ofrecidos públicamente con un plazo superior a 15 días e inferior a un año, emitidos por sociedades para financiar capital de trabajo."}, {"q": "¿Quién emite los Certificados de Depósito a Término (CDT)?", "o": ["Los establecimientos de crédito", "El Ministerio de Hacienda", "Las sociedades comisionistas de bolsa", "Los fondos de pensiones"], "e": "Los CDT son emitidos por establecimientos de crédito (bancos, corporaciones financieras, compañías de financiamiento) como un instrumento de captación a plazo."}, {"q": "La titularización es un proceso mediante el cual:", "o": ["Se transforman activos o flujos futuros en valores negociables a través de un vehículo de propósito especial", "Una empresa se inscribe por primera vez en bolsa", "Se califican los riesgos de un emisor", "Se liquida una sociedad comisionista"], "e": "En la titularización se aíslan activos (cartera, inmuebles, flujos) en un patrimonio autónomo o vehículo que emite valores respaldados por esos activos."}, {"q": "¿Qué medida preventiva puede adoptar la Superintendencia Financiera frente a una entidad vigilada?", "o": ["Ordenar la suspensión de operaciones o la toma de posesión", "Expulsar a un profesional del RNPMV por decisión de AMV", "Fijar la tasa de intervención del Banco de la República", "Modificar la calificación de riesgo de un emisor"], "e": "La SFC puede adoptar medidas cautelares y de intervención como la suspensión de operaciones, la vigilancia especial o la toma de posesión. Las sanciones disciplinarias de AMV son otro régimen."}, {"q": "¿Qué ley estableció el régimen de supervisión de los conglomerados financieros en Colombia?", "o": ["Ley 1870 de 2017", "Ley 964 de 2005", "Ley 100 de 1993", "Ley 1328 de 2009"], "e": "La Ley 1870 de 2017 creó el marco de supervisión de los conglomerados financieros y de sus holdings. La Ley 964 regula el mercado de valores, la Ley 100 el sistema de seguridad social y la Ley 1328 la protección al consumidor financiero."}, {"q": "¿A qué entidad se deben reportar las operaciones sospechosas relacionadas con lavado de activos?", "o": ["A la Unidad de Información y Análisis Financiero (UIAF)", "Al Autorregulador del Mercado de Valores", "A la Fiscalía, únicamente cuando hay sentencia", "Al cliente involucrado, para que dé explicaciones"], "e": "Las operaciones sospechosas se reportan a la UIAF mediante el ROS. Está prohibido informar al cliente que se hizo el reporte."}, {"q": "Una operación inusual se diferencia de una sospechosa en que:", "o": ["La inusual no guarda relación con el perfil del cliente; es sospechosa cuando, tras analizarla, no tiene una justificación razonable", "Toda operación inusual debe reportarse a la UIAF de inmediato", "La operación sospechosa siempre involucra efectivo", "No existe diferencia entre ambas"], "e": "Primero se detecta la operación inusual. Si después del análisis no hay explicación razonable, se califica como sospechosa y se reporta a la UIAF."}, {"q": "Un operador nota que un cliente fracciona sus depósitos para evitar los controles de efectivo. ¿Qué debe hacer?", "o": ["Informar la situación al oficial de cumplimiento de su entidad", "Advertir al cliente que lo van a reportar", "Ignorar la situación si el cliente es antiguo", "Rechazar los depósitos y no decir nada a nadie"], "e": "Las señales de alerta deben escalarse al oficial de cumplimiento, quien analiza y decide si se reporta a la UIAF. Advertir al cliente está prohibido."}, {"q": "El SARLAFT es el sistema de administración del riesgo de:", "o": ["Lavado de activos y financiación del terrorismo", "Liquidez y fondeo", "Tasa de interés y tasa de cambio", "Crédito y contraparte"], "e": "SARLAFT significa Sistema de Administración del Riesgo de Lavado de Activos y de la Financiación del Terrorismo."}, {"q": "¿Cuál es una de las funciones del defensor del consumidor financiero?", "o": ["Atender y resolver de forma objetiva las quejas de los consumidores contra la entidad", "Fijar las comisiones que cobra la entidad", "Representar a la entidad ante la Superintendencia", "Aprobar los productos que la entidad lanza al mercado"], "e": "Según la Ley 1328 de 2009, el defensor del consumidor financiero atiende las quejas de los consumidores de forma objetiva y gratuita, y actúa como vocero ante la entidad."}, {"q": "En la actividad de asesoría, una recomendación profesional es:", "o": ["Un consejo ajustado al perfil de riesgo de un cliente específico, sobre un producto o una operación", "Cualquier información publicitaria sobre un producto", "Un informe de investigación dirigido al público en general", "Una conversación sobre temas económicos generales"], "e": "La recomendación profesional es personalizada: tiene en cuenta el perfil del cliente y el perfil del producto. La información general o la educación financiera no lo son."}, {"q": "Para distribuir un producto complejo a un cliente inversionista, el intermediario debe:", "o": ["Brindarle asesoría y verificar que el producto sea adecuado para su perfil", "Exigirle solamente la firma de un formato estándar", "Abstenerse siempre; está prohibido", "Ofrecerlo solo por medios digitales"], "e": "Los productos complejos, como derivados y estructurados, exigen asesoría al cliente inversionista y una evaluación de adecuación frente a su perfil de riesgo."}, {"q": "¿Cuál de los siguientes se considera un producto simple?", "o": ["Un CDT de un establecimiento de crédito", "Un swap de tasa de interés", "Un bono estructurado con opciones", "Un contrato de futuros sobre acciones"], "e": "Productos como los CDT o los TES son considerados simples por su estructura conocida y fácil de entender. Los derivados y estructurados son productos complejos."}, {"q": "Los administradores de una sociedad deben obrar de buena fe, con lealtad y con la diligencia de:", "o": ["Un buen hombre de negocios", "Un buen padre de familia", "Un experto financiero certificado", "Un funcionario público"], "e": "El artículo 23 de la Ley 222 de 1995 exige a los administradores obrar con la diligencia de un buen hombre de negocios, además de buena fe y lealtad."}, {"q": "¿Qué es la información relevante que deben divulgar los emisores de valores?", "o": ["Toda situación del emisor o de su emisión que un experto prudente tendría en cuenta para comprar, vender o conservar sus valores", "Solo los estados financieros anuales", "Los rumores de mercado sobre el emisor", "La información que el emisor decida publicar voluntariamente"], "e": "La información relevante es la que un experto prudente y diligente tendría en cuenta para decidir sobre los valores del emisor. Debe divulgarse en forma veraz, clara, suficiente y oportuna a través del RNVE."}, {"q": "¿Por qué medio deben divulgar los emisores la información relevante?", "o": ["A través del mecanismo de información relevante de la página web de la Superintendencia Financiera (RNVE)", "Por correo a cada accionista", "Únicamente en la asamblea anual de accionistas", "En redes sociales del emisor"], "e": "La información relevante se publica en el mecanismo que dispone la SFC, para que todo el mercado la conozca al mismo tiempo."}, {"q": "¿Cuál es la característica principal de las acciones preferenciales sin derecho a voto?", "o": ["Otorgan un dividendo preferencial a cambio de no tener derecho a voto, salvo en los casos que señala la ley", "Tienen un rendimiento fijo garantizado como un bono", "Dan doble derecho a voto en la asamblea", "No dan derecho a dividendos"], "e": "Las acciones preferenciales sin derecho a voto reciben un dividendo mínimo preferente y el reembolso preferente del aporte en la liquidación, pero no votan salvo en casos especiales."}, {"q": "Una acción ordinaria otorga a su titular, entre otros, el derecho a:", "o": ["Participar en las deliberaciones de la asamblea y votar en ella", "Recibir un cupón fijo de intereses", "Recibir el valor nominal al vencimiento", "Exigir la recompra de la acción por el emisor"], "e": "Las acciones ordinarias dan derecho a votar, a participar en las utilidades, a negociar libremente la acción, a inspeccionar los libros y a recibir una parte de los activos en la liquidación."}, {"q": "Un bono es un valor que representa:", "o": ["Una parte de un crédito colectivo a cargo del emisor", "Una participación en el capital del emisor", "Un derecho sobre mercancías depositadas", "Una participación en un fondo de inversión"], "e": "El bono es un título de deuda: el inversionista presta dinero al emisor, que se obliga a pagar intereses y devolver el capital."}, {"q": "¿Qué es una aceptación bancaria?", "o": ["Una letra de cambio girada por un comprador y aceptada por un banco, que se obliga a pagarla al vencimiento", "Un certificado de depósito a la vista", "Un préstamo interbancario a un día", "Un bono emitido por el Banco de la República"], "e": "La aceptación bancaria nace de una operación comercial: el banco acepta una letra de cambio y garantiza su pago al vencimiento, lo que la hace negociable."}, {"q": "Los certificados de depósito de mercancías (CDM) son expedidos por:", "o": ["Los almacenes generales de depósito", "Los bancos comerciales", "La Bolsa de Valores de Colombia", "Las sociedades fiduciarias"], "e": "Los CDM son títulos expedidos por almacenes generales de depósito que representan mercancías depositadas y permiten negociarlas o darlas en garantía."}, {"q": "El segundo mercado se caracteriza porque:", "o": ["Los valores solo pueden ser adquiridos por inversionistas profesionales y tienen requisitos de inscripción más simples", "Es el mercado de valores usados o de segunda mano", "Solo se negocian títulos de deuda pública", "No requiere ninguna inscripción ni información"], "e": "El segundo mercado está dirigido a inversionistas profesionales. Por eso tiene requisitos de autorización e información más flexibles que el mercado principal."}, {"q": "¿En qué sistema se negocian principalmente los TES entre entidades del mercado en Colombia?", "o": ["En el SEN, administrado por el Banco de la República, y en el MEC de la Bolsa de Valores", "En la Cámara de Comercio", "Únicamente en el mercado mostrador sin registro", "En el sistema de pagos de Colpensiones"], "e": "Los TES se negocian principalmente en el SEN (Sistema Electrónico de Negociación del Banco de la República) y en el MEC (Mercado Electrónico Colombiano) de la BVC."}, {"q": "¿Qué entidad actúa como depósito centralizado de los títulos de deuda pública emitidos por la Nación, como los TES?", "o": ["El Depósito Central de Valores (DCV) del Banco de la República", "Las sociedades fiduciarias", "La Superintendencia Financiera", "El Ministerio de Hacienda directamente"], "e": "Los TES se custodian en el DCV del Banco de la República. Los demás valores privados se custodian en el depósito centralizado privado."}, {"q": "El principio de entrega contra pago (DVP) busca:", "o": ["Que la entrega de los valores y el pago del dinero ocurran al mismo tiempo, para eliminar el riesgo de principal", "Que el comprador pague antes de recibir los valores", "Que el vendedor entregue los valores sin recibir el pago", "Que las operaciones se liquiden a plazo"], "e": "Con entrega contra pago ninguna de las partes queda expuesta a entregar su parte sin recibir la otra, lo que elimina el riesgo de principal en la liquidación."}, {"q": "La compensación de operaciones sobre valores consiste en:", "o": ["Determinar las obligaciones netas de dinero y valores que cada participante debe entregar o recibir", "Entregar físicamente los títulos", "Calificar el riesgo de las operaciones", "Registrar a los profesionales en el RNPMV"], "e": "La compensación calcula lo que cada parte debe entregar. La liquidación es el paso siguiente, en el que se entregan efectivamente el dinero y los valores."}, {"q": "Una cuenta de margen permite al cliente:", "o": ["Hacer operaciones de compraventa de contado por montos mayores a los recursos que aportó", "Garantizar una rentabilidad mínima sobre su inversión", "Invertir sin asumir ningún riesgo de mercado", "Delegar en la sociedad todas las decisiones de inversión"], "e": "Las cuentas de margen permiten operar de contado por sumas mayores a los recursos aportados; las posiciones se liquidan total o parcialmente con recursos de repos, simultáneas o TTV. La sociedad no puede tener discrecionalidad sobre las decisiones de inversión."}, {"q": "¿Cuándo se hace el llamado al margen en una cuenta de margen?", "o": ["Cuando el margen, considerando pérdidas y ganancias, es inferior al 50 % del margen que se requeriría para una posición equivalente", "Cuando el margen cae por debajo del 90 % del valor inicial", "Solo al vencimiento de la operación", "Cuando el cliente lo solicita por escrito"], "e": "Según el artículo 2.33.1.2.3 del Decreto 2555, el llamado procede cuando el margen cae por debajo del 50 % del requerido. Si el cliente no lo atiende a tiempo, la sociedad debe cerrar obligatoriamente sus posiciones."}, {"q": "Una persona natural que cuenta con la certificación de AMV como operador puede ser clasificada como:", "o": ["Inversionista profesional", "Cliente inversionista obligatoriamente", "Emisor de valores", "Proveedor de infraestructura"], "e": "La regulación permite clasificar como inversionista profesional a quien acredite la certificación de profesional del mercado como operador, por su conocimiento del mercado."}, {"q": "Las entidades vigiladas por la Superintendencia Financiera, cuando actúan como clientes de un intermediario, se consideran:", "o": ["Inversionistas profesionales", "Clientes inversionistas", "Consumidores financieros con máxima protección", "Emisores"], "e": "Las entidades vigiladas por la SFC tienen la experiencia y el conocimiento para ser tratadas como inversionistas profesionales."}, {"q": "¿Qué debe hacer un intermediario antes de prestar asesoría a un cliente?", "o": ["Perfilar al cliente para conocer sus objetivos, situación financiera, conocimiento y tolerancia al riesgo", "Ofrecerle el producto con mayor comisión", "Pedirle que firme una renuncia a sus derechos", "Garantizarle una rentabilidad"], "e": "El perfil del cliente es la base de cualquier recomendación: permite verificar que los productos sean adecuados para él."}, {"q": "Según la guía de AMV, ¿qué productos pueden clasificarse como universales?", "o": ["Los FIC y los portafolios o alternativas estandarizadas de fondos voluntarios de pensión, según sus características", "Los derivados de cobertura", "Los productos estructurados", "Los fondos de capital privado"], "e": "Un producto universal está dirigido a cualquier tipo de inversionista, sin importar su perfil. La norma permite esta clasificación para FIC y alternativas estandarizadas de FVP. Los FCP son siempre productos complejos."}, {"q": "Un informe de investigación publicado por un intermediario debe:", "o": ["Incluir la leyenda de que su contenido no constituye una recomendación profesional", "Garantizar que la recomendación será rentable", "Enviarse solo a clientes que paguen por él", "Omitir la metodología usada"], "e": "Los informes de investigación y las comunicaciones generales no son recomendación profesional y deben llevar la leyenda del artículo 2.40.1.1.2 del Decreto 2555. No pueden usar lenguaje que haga pensar que la inversión es adecuada al perfil del receptor."}, {"q": "¿Cuál es la principal función de una bolsa de valores?", "o": ["Mantener un mercado organizado que ofrezca condiciones de seguridad, transparencia y liquidez para negociar valores", "Emitir valores para financiar al Gobierno", "Supervisar a los intermediarios", "Calificar el riesgo de los emisores"], "e": "La bolsa administra sistemas de negociación organizados y promueve la formación de precios y la liquidez. La supervisión corresponde a la SFC y a AMV."}, {"q": "La desmaterialización de un valor significa que:", "o": ["El valor existe solo como un registro electrónico (anotación en cuenta) y no como un título físico", "El valor ha perdido todo su valor económico", "El valor fue cancelado por el emisor", "El valor solo puede negociarse en el exterior"], "e": "Los valores desmaterializados se emiten y transfieren mediante anotaciones en cuenta en un depósito centralizado, sin papel."}, {"q": "Según el Decreto 2555 y la Circular Básica Contable, una operación a plazo es aquella cuyo cumplimiento se pacta:", "o": ["A más de tres días hábiles contados desde el día siguiente al registro (T+4 en adelante)", "El mismo día de la celebración (T+0)", "Entre T+1 y T+3", "A más de un año"], "e": "Las operaciones de contado se cumplen entre T+0 y T+3. Todas las que se pactan a más de tres días hábiles (T+4 en adelante) son operaciones a plazo."}, {"q": "Un intermediario que realiza operaciones por cuenta propia y por cuenta de clientes al mismo tiempo debe:", "o": ["Dar prioridad a las órdenes de los clientes sobre las de su cuenta propia", "Ejecutar primero las de su cuenta propia", "Cobrar una comisión doble", "Abstenerse siempre de operar por cuenta de clientes"], "e": "Cuando hay órdenes en conflicto, el intermediario debe dar prioridad a las de los clientes frente a las propias, para evitar aprovecharse de su posición."}, {"q": "¿Quién expide la regulación general del mercado de valores mediante decretos?", "o": ["El Gobierno nacional, en ejercicio de su facultad de intervención", "AMV", "La Bolsa de Valores de Colombia", "Los emisores"], "e": "El Gobierno nacional regula el mercado mediante decretos, con base en las leyes marco como la Ley 964 de 2005. La SFC expide instrucciones y AMV reglamentos de autorregulación."}, {"q": "La Ley 964 de 2005 es una ley marco, lo que significa que:", "o": ["Fija los objetivos y criterios generales, y el Gobierno desarrolla la regulación detallada mediante decretos", "Regula en detalle cada operación del mercado", "Solo aplica a los bancos", "Fue reemplazada por el Decreto 2555 de 2010"], "e": "Las leyes marco señalan objetivos y criterios. El Gobierno las desarrolla con decretos, compilados en buena parte en el Decreto 2555 de 2010."}, {"q": "¿Qué son los valores emitidos en un proceso de titularización hipotecaria?", "o": ["Valores respaldados por una cartera de créditos hipotecarios aislada en un vehículo de propósito especial", "Acciones de los bancos hipotecarios", "Bonos del Gobierno para vivienda", "Certificados de depósito de mercancías"], "e": "En la titularización hipotecaria se aíslan créditos de vivienda en un vehículo que emite títulos pagados con los flujos de esos créditos."}, {"q": "Las sociedades comisionistas de
