La segunda (riesgos y cumplimiento) los monitorea, y la tercera (auditoría interna) evalúa todo el sistema de forma independiente."}, {"q": "El apetito de riesgo de una entidad es:", "o": ["El nivel de riesgo que la entidad está dispuesta a asumir para cumplir sus objetivos", "El máximo riesgo que permite la ley", "El riesgo que tienen sus clientes", "La pérdida histórica más grande"], "e": "La junta directiva define el apetito de riesgo. De allí se derivan los límites operativos."}, {"q": "Un fraude cometido por un empleado de la entidad es un evento de:", "o": ["Riesgo operacional, por fraude interno", "Riesgo de mercado", "Riesgo de crédito", "Riesgo de liquidez"], "e": "El fraude interno es una de las categorías de eventos de riesgo operacional, junto con el fraude externo, las fallas tecnológicas y los errores en procesos."}, {"q": "El riesgo de modelo es la posibilidad de pérdida por:", "o": ["Errores en los supuestos, datos o implementación de los modelos usados para valorar o medir riesgos", "Movimientos de la tasa de cambio", "El incumplimiento de un deudor", "La falta de liquidez del mercado"], "e": "Un modelo mal especificado o mal usado puede subestimar riesgos o valorar mal las posiciones. Se controla con validación independiente y backtesting."}, {"q": "Una brecha de liquidez (gap) negativa en una banda de tiempo indica que:", "o": ["Las salidas de recursos superan a las entradas en ese período", "La entidad tiene exceso de liquidez", "El portafolio tiene ganancias", "El VaR es negativo"], "e": "El análisis de brechas compara entradas y salidas por bandas de tiempo. Una brecha negativa muestra necesidad de recursos en esa banda."}, {"q": "El riesgo de mercado de una posición en acciones se mide principalmente con:", "o": ["La volatilidad del precio y la beta frente al mercado", "La duración modificada", "La probabilidad de incumplimiento", "El indicador de riesgo de liquidez"], "e": "Para acciones se usan la volatilidad y la beta. La duración aplica a instrumentos de renta fija."}, {"q": "Un portafolio de bonos tiene una duración modificada de 3. ¿Qué pasa con su valor si las tasas bajan 1 %?", "o": ["Sube aproximadamente 3 %", "Baja aproximadamente 3 %", "Sube aproximadamente 1 %", "No cambia"], "e": "Cambio % ≈ −DM × Δtasa = −3 × (−1 %) = +3 %."}, {"q": "¿Qué es el riesgo de emisor?", "o": ["La posibilidad de pérdida porque el emisor de un valor incumpla sus obligaciones o se deteriore su calidad crediticia", "El riesgo de que la bolsa cierre", "El riesgo de cometer errores al emitir órdenes", "El riesgo de que suban las tasas"], "e": "El riesgo de emisor es un tipo de riesgo de crédito asociado a quien emitió el título que se tiene en el portafolio."}, {"q": "¿Para qué sirven las garantías que exige una cámara de riesgo central de contraparte?", "o": ["Para cubrir las pérdidas si un participante incumple sus obligaciones", "Para pagar las comisiones de la bolsa", "Para garantizar ganancias a los participantes", "Para financiar al Gobierno"], "e": "Las garantías iniciales y las de variación permiten a la cámara cumplir las operaciones aunque un participante incumpla."}, {"q": "Al aumentar el nivel de confianza del VaR de 95 % a 99 %, manteniendo lo demás igual, el VaR:", "o": ["Aumenta", "Disminuye", "No cambia", "Se vuelve negativo"], "e": "Un mayor nivel de confianza exige cubrir pérdidas más extremas, así que el VaR crece (z pasa de 1,65 a 2,33)."}, {"q": "Una posición larga en dólares de una entidad colombiana pierde valor cuando:", "o": ["El peso se revalúa frente al dólar", "El peso se devalúa frente al dólar", "Sube la TRM", "Sube la inflación en Estados Unidos"], "e": "Una posición larga en dólares gana si el dólar se aprecia (TRM sube) y pierde si el peso se revalúa (TRM baja)."}, {"q": "¿Qué es el riesgo de tasa de interés del libro bancario?", "o": ["El riesgo de pérdida por cambios en las tasas que afectan los ingresos y el valor de los activos y pasivos no negociables", "El riesgo de fraude", "El riesgo de un error en la contabilidad", "El riesgo de que la bolsa cierre"], "e": "Además de la tesorería, los cambios de tasas afectan el margen financiero y el valor económico de la cartera y los depósitos."}, {"q": "Una estrategia para reducir el riesgo de liquidez es:", "o": ["Mantener un colchón de activos líquidos de alta calidad y diversificar las fuentes de fondeo", "Concentrar todo el fondeo en un solo depositante", "Invertir todo en activos de largo plazo sin mercado", "Eliminar las reservas"], "e": "Los activos líquidos y la diversificación del fondeo permiten atender salidas inesperadas de recursos."}, {"q": "Los activos líquidos de alta calidad incluyen principalmente:", "o": ["El efectivo, los depósitos en el Banco de la República y los TES", "Los inmuebles", "Las acciones de baja bursatilidad", "La cartera de créditos"], "e": "Se consideran de alta calidad los activos que pueden convertirse en efectivo rápido y con poca pérdida, como los TES."}, {"q": "En el riesgo de crédito, la exposición en el momento del incumplimiento (EAD) es:", "o": ["El monto que la entidad tendría expuesto si el deudor incumple", "La probabilidad de incumplimiento", "El porcentaje recuperado", "La tasa de interés del crédito"], "e": "La EAD es el saldo expuesto al momento del incumplimiento. Junto con la PI y la PDI, determina la pérdida esperada."}, {"q": "Las provisiones de cartera de una entidad financiera cubren principalmente:", "o": ["Las pérdidas esperadas por riesgo de crédito", "Las pérdidas por riesgo de mercado", "Los gastos de nómina", "Las pérdidas no esperadas"], "e": "Las provisiones se constituyen para cubrir la pérdida esperada. El capital cubre las pérdidas inesperadas."}, {"q": "¿Cuál es la principal función del capital de una entidad financiera desde el punto de vista del riesgo?", "o": ["Absorber las pérdidas inesperadas", "Cubrir las pérdidas esperadas", "Pagar los dividendos", "Financiar los gastos operativos"], "e": "El capital es el colchón para las pérdidas que exceden lo previsto en las provisiones."}, {"q": "La relación de solvencia de un establecimiento de crédito compara:", "o": ["El patrimonio técnico con los activos ponderados por nivel de riesgo", "Los activos líquidos con los pasivos", "Las utilidades con los ingresos", "La cartera con los depósitos"], "e": "La solvencia mide si el capital es suficiente frente a los riesgos asumidos, según los estándares de Basilea."}, {"q": "Un evento de riesgo operacional por un ciberataque que interrumpe el sistema de negociación se clasifica como:", "o": ["Fallas tecnológicas o fraude externo, según su origen", "Riesgo de mercado", "Riesgo de crédito", "Riesgo de tasa de cambio"], "e": "Los incidentes de ciberseguridad son eventos de riesgo operacional y se gestionan también con el plan de continuidad."}, {"q": "Una política de límites de riesgo de mercado debe incluir, entre otros:", "o": ["Límites de VaR, de posición y de pérdidas, aprobados por la junta directiva", "Solo metas de ventas", "El número de empleados de la mesa", "La comisión de cada operador"], "e": "Los límites traducen el apetito de riesgo en restricciones medibles que el middle office controla."}, {"q": "Cuando un operador excede un límite de riesgo, lo correcto es:", "o": ["Reportarlo de inmediato según el procedimiento de la entidad y ajustar la posición", "Ocultarlo hasta recuperar la pérdida", "Pedir a un compañero que lo cubra", "Aumentar la posición"], "e": "Los excesos deben reportarse y gestionarse según las políticas. Ocultarlos agrava el riesgo y es una falta."}, {"q": "¿Qué es el riesgo de base?", "o": ["El riesgo de que la cobertura y la posición cubierta no se muevan exactamente igual", "El riesgo de que suban las tasas", "El riesgo de un error contable", "El riesgo de que un cliente no pague"], "e": "Una cobertura imperfecta deja expuesta la diferencia entre ambos activos."}, {"q": "¿Qué es el riesgo de reinversión?", "o": ["El riesgo de reinvertir los flujos recibidos a tasas menores a las esperadas", "El riesgo de no poder vender", "El riesgo de fraude", "El riesgo de que el emisor no pague"], "e": "Afecta a los bonos con cupones cuando las tasas bajan."}, {"q": "Un aumento de la volatilidad del mercado, manteniendo todo igual, hace que el VaR:", "o": ["Aumente", "Disminuya", "No cambie", "Se vuelva negativo"], "e": "El VaR paramétrico es proporcional a la volatilidad."}, {"q": "La diversificación de un portafolio reduce el VaR cuando:", "o": ["Las correlaciones entre los activos son menores que 1", "Todos los activos tienen correlación 1", "El portafolio tiene un solo activo", "La volatilidad aumenta"], "e": "Con correlaciones menores que 1, el VaR conjunto es menor que la suma de los individuales."}, {"q": "¿Cuál es el objetivo de una prueba de estrés de liquidez?", "o": ["Evaluar si la entidad puede atender salidas de recursos en escenarios extremos", "Calcular la rentabilidad del portafolio", "Medir la satisfacción del cliente", "Calcular la comisión"], "e": "Simula retiros masivos o cierre de mercados para verificar la suficiencia de los activos líquidos."}, {"q": "Un banco que capta a corto plazo y presta a largo plazo está expuesto principalmente a:", "o": ["Riesgo de liquidez y riesgo de tasa de interés", "Riesgo reputacional únicamente", "Riesgo de tipo de cambio únicamente", "Ningún riesgo"], "e": "El descalce de plazos genera necesidad de renovar fondeo y sensibilidad a cambios en las tasas."}, {"q": "En el ámbito financiero, el riesgo se describe desde dos perspectivas:", "o": ["La probabilidad de que ocurra un evento inesperado y el impacto de ese evento", "La rentabilidad y la liquidez de una inversión", "El riesgo de mercado y el riesgo de crédito", "La volatilidad y la duración"], "e": "La gestión de riesgos consiste en identificar e interpretar el riesgo, evaluarlo y tomar decisiones frente a él."}, {"q": "¿Por qué a algunos riesgos se les llama 'no cuantificables'?", "o": ["Porque es difícil medirlos con técnicas cuantitativas, por escasez de datos históricos o por limitaciones de procesamiento y tecnología", "Porque nunca generan pérdidas", "Porque la ley prohíbe medirlos", "Porque solo afectan a entidades no vigiladas"], "e": "En la práctica se gestionan con modelos cualitativos o semicuantitativos. Algunos autores sostienen que todo riesgo se puede medir de alguna forma."}, {"q": "Según la guía de AMV, ¿cuáles son los cinco riesgos considerados no cuantificables?", "o": ["Operacional, estratégico, reputacional, legal y de LA/FT", "Mercado, crédito, liquidez, contraparte y emisor", "Tasa de interés, tasa de cambio, acciones, commodities e inflación", "Sistemático, no sistemático, de base, de modelo y de reinversión"], "e": "Los riesgos de mercado, crédito y liquidez son los financieros o cuantificables."}, {"q": "¿Cuáles son los riesgos financieros o cuantificables?", "o": ["Mercado, crédito y liquidez", "Operacional, legal y reputacional", "Estratégico y de LA/FT", "Ambiental, social y de gobernanza"], "e": "Se pueden medir con herramientas estadísticas y son ampliamente tratados por el Comité de Basilea."}, {"q": "La relación entre rentabilidad esperada y riesgo, según la teoría financiera, es:", "o": ["Positiva: a mayor rentabilidad esperada, mayor riesgo", "Negativa: a mayor rentabilidad, menor riesgo", "Inexistente", "Positiva solo en renta fija"], "e": "Markowitz (1952) formalizó la relación rentabilidad-riesgo, base de la teoría moderna de portafolios."}, {"q": "¿Quién formuló la teoría moderna de portafolios con su artículo 'Portfolio Selection' de 1952?", "o": ["Harry Markowitz", "Milton Friedman", "John Maynard Keynes", "Fischer Black"], "e": "Markowitz recibió el Nobel de Economía en 1990. La diversificación reduce el riesgo del portafolio."}, {"q": "El Comité de Supervisión Bancaria de Basilea:", "o": ["Da orientación mundial en regulación bancaria a través de los Acuerdos de Basilea I, II y III", "Es el supervisor bancario de Colombia", "Emite normas de obligatorio cumplimiento directo en todos los países", "Solo regula a los bancos suizos"], "e": "Sus recomendaciones se adoptan en cada país mediante la regulación local. En Colombia, por decretos y circulares de la SFC."}, {"q": "Según la Circular Básica Contable y Financiera, el riesgo operacional incluye expresamente:", "o": ["El riesgo legal", "El riesgo de mercado", "El riesgo de liquidez", "El riesgo de crédito"], "e": "Es la posibilidad de pérdidas por deficiencias o fallas en procesos, tecnología, infraestructura o recurso humano, o por acontecimientos externos asociados, e incluye el riesgo legal."}, {"q": "¿Cuáles son los factores de riesgo operacional?", "o": ["Internos (recurso humano, procesos, tecnología e infraestructura) y externos (terceros y eventos físicos o naturales)", "Mercado, crédito y liquidez", "Clientes, productos, canales y jurisdicciones", "Ambientales, sociales y de gobernanza"], "e": "Clientes, productos, canales y jurisdicciones son los factores de riesgo de LA/FT."}, {"q": "¿Cuál de los siguientes NO es uno de los siete tipos de eventos de riesgo operacional de la CBCF?", "o": ["Variación de la tasa de cambio", "Fraude interno", "Fallas tecnológicas", "Daños a activos físicos"], "e": "Los siete son: fraude interno, fraude externo, relaciones laborales y seguridad laboral, clientes, productos y prácticas empresariales, daños a activos físicos, fallas tecnológicas y ejecución y administración de procesos."}, {"q": "Un empleado de la mesa liquida dos veces la misma operación por un error en el procedimiento. Es un evento de:", "o": ["Ejecución y administración de procesos", "Fraude externo", "Daños a activos físicos", "Clientes, productos y prácticas empresariales"], "e": "Es un error no intencional en un proceso. Si fuera intencional para beneficiarse sería fraude interno."}, {"q": "Un grupo de delincuentes suplanta a un cliente y retira sus recursos por el canal digital. Es un evento de:", "o": ["Fraude externo", "Fraude interno", "Relaciones laborales", "Ejecución de procesos"], "e": "El fraude es externo cuando lo cometen terceros ajenos a la entidad."}, {"q": "Una inundación daña el centro de cómputo de la entidad. Es un evento de:", "o": ["Daños a activos físicos", "Fraude externo", "Riesgo de mercado", "Clientes, productos y prácticas empresariales"], "e": "El factor es externo (físico o natural) y el evento es daño a activos físicos; puede activar el plan de continuidad del negocio."}, {"q": "Vender a un cliente un producto que no corresponde a su perfil, incumpliendo el deber de asesoría, es un evento de riesgo operacional de tipo:", "o": ["Clientes, productos y prácticas empresariales", "Fallas tecnológicas", "Daños a activos físicos", "Relaciones laborales y seguridad laboral"], "e": "Esta categoría agrupa fallas frente a los clientes por el diseño o la venta de los productos."}, {"q": "¿Por qué es difícil cuantificar el riesgo operacional?", "o": ["Por la escasez de datos de pérdidas: los eventos no se han materializado, no se recogen formalmente o las áreas son renuentes a reportar errores", "Porque no genera pérdidas", "Porque lo prohíbe Basilea", "Porque solo afecta a las aseguradoras"], "e": "Por eso se complementan los datos internos con datos externos."}, {"q": "¿Cuál es un método interno de control del riesgo operacional?", "o": ["La separación de funciones y las conciliaciones", "La auditoría externa", "Las confirmaciones con la contraparte", "La verificación de precios con un proveedor externo"], "e": "Métodos internos: separación de funciones, entradas duales, conciliaciones, control de cambios y auditoría interna. Externos: confirmaciones, verificación de precios, autorizaciones, liquidaciones y auditorías externas."}, {"q": "Para la medición de la probabilidad de ocurrencia de los riesgos operacionales, la CBCF exige considerar un horizonte mínimo de:", "o": ["Un año", "Un mes", "Diez días", "Cinco años"], "e": "La medición debe ser cualitativa y, cuando hay datos históricos, también cuantitativa."}, {"q": "La reducción de los ingresos de un banco por la llegada de bancos digitales y fintech es un ejemplo de riesgo:", "o": ["Estratégico", "Operacional", "De liquidez", "Legal"], "e": "El riesgo estratégico surge de las decisiones estratégicas, el entorno de negocios y la competencia."}, {"q": "Cuando la estrategia no se está ejecutando correctamente, pero los objetivos siguen siendo válidos en el mercado actual, se habla de riesgo de:", "o": ["Ejecución estratégica", "Posicionamiento estratégico", "Reputación", "Contraparte"], "e": "El riesgo de posicionamiento estratégico se presenta cuando la entidad no se está dirigiendo de acuerdo con su estrategia."}, {"q": "Según Schendel y Hofer, ¿qué pregunta responde la estrategia corporativa?", "o": ["¿Cómo y dónde crecer?", "¿Cómo competir?", "¿Cómo funciona cada área?", "¿Cuánto capital mínimo se necesita?"], "e": "La estrategia competitiva responde cómo competir; la funcional, cómo funciona cada área (decisiones operativas)."}, {"q": "Una campaña de mercadeo promete características de un producto que el área operativa no puede cumplir. ¿Qué riesgo se genera principalmente?", "o": ["Reputacional, por falta de coordinación interna entre unidades de negocio", "De mercado", "De liquidez de fondeo", "De tasa de cambio"], "e": "Las causas de exposición reputacional son: diferencia entre reputación y comportamiento real, cambios en las expectativas de los grupos de interés y falta de coordinación interna."}, {"q": "El riesgo reputacional puede originarse en:", "o": ["Información negativa sobre la entidad, cierta o no, y también en la materialización de otros riesgos", "Únicamente en hechos comprobados", "Solo en el riesgo de mercado", "Solo en decisiones de la SFC"], "e": "La publicidad negativa puede ser cierta o no; aun así puede causar pérdida de clientes, ingresos o procesos judiciales."}, {"q": "El riesgo legal, según Basilea y la SFC, es la posibilidad de pérdida por:", "o": ["Ser sancionada u obligada a indemnizar por incumplir normas u obligaciones contractuales, o por fallas en contratos y transacciones", "Cambios en las tasas de interés", "Falta de activos líquidos", "Pérdida de reputación en redes sociales"], "e": "Incluye a los terceros que actúan en representación de la entidad en actividades tercerizadas."}, {"q": "¿Cuáles son los factores de riesgo de LA/FT según la Circular Básica Jurídica?", "o": ["Clientes o usuarios, productos, canales de distribución y jurisdicciones", "Procesos, personas, tecnología y eventos externos", "Tasa de interés, tasa de cambio, acciones y commodities", "Probabilidad, exposición, recuperación y plazo"], "e": "Son los agentes generadores del riesgo de lavado de activos y financiación del terrorismo."}, {"q": "¿Qué diferencia hay entre lavado de activos y financiación del terrorismo?", "o": ["En el lavado los recursos tienen origen ilícito; en la financiación del terrorismo los fondos pueden tener origen legal o ilícito", "Son exactamente lo mismo", "La financiación del terrorismo solo usa efectivo", "El lavado solo ocurre en el exterior"], "e": "Ambos buscan ocultar: el lavado, el origen de los recursos; la financiación del terrorismo, su fuente y destino final."}, {"q": "¿Qué organismo internacional fija los estándares contra el lavado de activos y la financiación del terrorismo?", "o": ["El GAFI (Grupo de Acción Financiera Internacional)", "El Comité de Basilea", "IOSCO", "La OMC"], "e": "En Colombia, la UIAF es la unidad de inteligencia financiera que recibe y analiza los reportes."}, {"q": "¿Cuáles son los ejes del sistema nacional ALA/CFT?", "o": ["Prevención, detección, investigación y judicialización", "Identificación, medición, control y monitoreo", "Autocontrol, autorregulación y autogestión", "Regulación, supervisión, disciplina y certificación"], "e": "Supervisores y reportantes participan en la prevención; la UIAF en la detección; la Fiscalía y la Policía Judicial en la investigación; la Rama Judicial en la judicialización."}, {"q": "¿Cuáles son las cuatro categorías del riesgo de mercado?", "o": ["Tasa de interés, renta variable, tasa de cambio y precio de commodities", "Crédito, contraparte, emisor y liquidez", "Operacional, legal, reputacional y estratégico", "Sistemático, no sistemático, de base y de modelo"], "e": "Según Basilea, son pérdidas en posiciones dentro y fuera del balance por movimientos en los precios de mercado."}, {"q": "Si las tasas de interés bajan, el tenedor de un bono enfrenta principalmente:", "o": ["Riesgo de reinversión, porque los cupones se reinvierten a tasas menores", "Pérdida en el precio del bono", "Riesgo de liquidación", "Riesgo de contraparte"], "e": "Cuando las tasas suben, el precio del bono cae; cuando bajan, el precio sube pero los cupones se reinvierten peor."}, {"q": "Una huelga en una empresa que afecta el precio de su acción es un ejemplo de riesgo:", "o": ["Específico o idiosincrático (no sistemático)", "Sistemático", "De tasa de cambio", "De liquidación"], "e": "El riesgo específico es propio de cada empresa y se reduce diversificando. Una reforma tributaria afecta a todo el mercado: es sistemático."}, {"q": "El oro, el cobre y el platino pertenecen, dentro del riesgo de commodities, al grupo de:", "o": ["Metales", "Energéticos", "Productos agrícolas", "Animales"], "e": "Energéticos: petróleo, carbón, gas, electricidad. Agrícolas: maíz, trigo, soya, café. Animales: ganado, cerdos, aves."}, {"q": "Un importador colombiano que debe pagar dólares en tres meses pierde si:", "o": ["El peso se devalúa (sube la tasa de cambio)", "El peso se revalúa", "Baja la tasa de interés local", "Sube el precio de las acciones"], "e": "Con una tasa de cambio más alta necesita más pesos para pagar los mismos dólares."}, {"q": "Según ISDA, ¿cuál de los siguientes es un evento de crédito?", "o": ["La reestructuración de la deuda", "Una baja del precio de la acción por noticias del mercado", "Un aumento de la volatilidad", "Una subida general de tasas"], "e": "Eventos de crédito: bancarrota, incumplimiento de pagos, incumplimiento de obligaciones, aceleración, repudio o moratoria y reestructuración."}, {"q": "El incumplimiento de un covenant pactado en un crédito, aunque no haya mora en los pagos, se considera:", "o": ["Default técnico", "Riesgo de mercado", "Riesgo de base", "Riesgo de reinversión"], "e": "Es un evento de crédito por incumplir condiciones pactadas con anticipación."}, {"q": "Un inversionista en acciones sufre riesgo de emisor cuando:", "o": ["El emisor no paga los dividendos decretados", "La acción baja por una caída general del mercado", "La bolsa suspende la negociación por fallas técnicas", "El comisionista se equivoca al registrar la orden"], "e": "Para el tenedor de bonos, se materializa con una baja de calificación o el impago de cupones o capital."}, {"q": "Según la guía de AMV, la pérdida esperada por riesgo de crédito se calcula como:", "o": ["(1 − tasa de recuperación) × exposición × probabilidad de incumplimiento", "Exposición × volatilidad × z", "Exposición / probabilidad de incumplimiento", "Tasa de recuperación × exposición"], "e": "Es la misma idea que PI × PDI × EAD, porque la PDI es 1 menos la tasa de recuperación."}, {"q": "Una inversión de COP 200 millones tiene probabilidad de incumplimiento de 5 % y tasa de recuperación de 40 %. ¿Cuál es la pérdida esperada?", "o": ["COP 6 millones", "COP 4 millones", "COP 10 millones", "COP 80 millones"], "e": "(1 − 0,40) × 200 × 0,05 = 6 millones."}, {"q": "Un modelo de score que se usa para clasificar a un cliente al momento de pedir un producto específico (por ejemplo, una tarjeta de crédito) es de calificación:", "o": ["Reactiva", "De comportamiento", "Proactiva", "Regulatoria"], "e": "La de comportamiento hace seguimiento a clientes que ya tienen productos; la proactiva clasifica al cliente en general, no frente a un producto."}, {"q": "¿Cuáles son las cuatro modalidades de crédito según la CBCF?", "o": ["Comercial, consumo, vivienda y microcrédito", "Corto, mediano, largo plazo y rotativo", "Público, privado, mixto y externo", "Garantizado, no garantizado, sindicado y puente"], "e": "El microcrédito se rige por el artículo 39 de la Ley 590 de 2000."}, {"q": "Las etapas del ciclo de crédito son:", "o": ["Otorgamiento, control y monitoreo, y recuperación", "Identificación, medición, control y monitoreo", "Emisión, colocación y redención", "Negociación, compensación y liquidación"], "e": "El otorgamiento se basa en el conocimiento del deudor, su capacidad de pago, las garantías y las condiciones del contrato."}, {"q": "¿Cuáles son las dos formas del riesgo de liquidez?", "o": ["Liquidez de fondeo y liquidez de mercado", "Liquidez de corto y de largo plazo", "Liquidez interna y externa", "Liquidez de crédito y de contraparte"], "e": "Fondeo: insuficiencia de activos líquidos o costos inusuales de fondeo. Mercado: no poder deshacer posiciones a precios de mercado por falta de profundidad o cambios drásticos."}, {"q": "Una entidad no logra renovar sus CDT y tiene que pagar tasas muy altas para captar. Es riesgo de:", "o": ["Liquidez de fondeo", "Liquidez de mercado", "Tasa de cambio", "Emisor"], "e": "El riesgo de fondeo se da cuando hay que devolver recursos de corto plazo y no se pueden renovar o sustituir."}, {"q": "El bid-ask spread de un activo es:", "o": ["La diferencia entre el precio al que el mercado compra y el precio al que vende", "La diferencia entre el precio máximo y mínimo del día", "La comisión del comisionista", "La diferencia entre la TIR y el cupón"], "e": "Un spread amplio indica menos liquidez y más costo de operar."}, {"q": "¿Cuál de estos factores amplía el bid-ask spread?", "o": ["La asimetría de información entre los participantes", "Un mayor número de participantes en el mercado", "Mayor volumen de negociación", "Menor volatilidad"], "e": "Otros factores: costos de gestión de órdenes, reglas del mercado (tick, monto mínimo), costos de inventario y llegada de nueva información."}, {"q": "En la fórmula del IRL de la SFC (IRL = ALM − RLN), ALM significa:", "o": ["Activos líquidos ajustados por liquidez de mercado", "Activos de largo plazo menos pasivos", "Apalancamiento líquido máximo", "Activos libres de margen"], "e": "RLN son los requerimientos de liquidez netos en el horizonte. A los activos que no son de alta calidad se les aplica un descuento (haircut)."}, {"q": "Una entidad tiene activos líquidos ajustados de 500 y requerimientos netos de liquidez de 400. ¿Cuál es su IRL en monto y en razón?", "o": ["IRL = 100 y razón = 1,25", "IRL = 900 y razón = 0,8", "IRL = −100 y razón = 0,8", "IRL = 100 y razón = 0,8"], "e": "IRL = 500 − 400 = 100; razón = 500 / 400 = 1,25. Un IRL positivo (razón mayor a 1) indica que cubre sus requerimientos."}, {"q": "Para un fondo de inversión colectiva sin pacto de permanencia, la liquidez mínima que se usa en el IRL es:", "o": ["10 % del valor del portafolio", "1 % del valor del portafolio", "50 % del valor del portafolio", "No hay liquidez mínima"], "e": "En los fondos, en lugar de los vencimientos contractuales se usan los retiros esperados o la liquidez mínima, el que sea mayor."}, {"q": "El coeficiente de fondeo estable neto (CFEN) es:", "o": ["Fondeo estable disponible / fondeo estable requerido, y debe ser de al menos 100 %", "Activos líquidos / pasivos de corto plazo, mínimo 9 %", "Patrimonio técnico / activos ponderados, mínimo 100 %", "Depósitos / cartera, máximo 80 %"], "e": "Mide si las fuentes estables de fondeo alcanzan para financiar los activos en un horizonte de un año. Se reporta mensualmente a la SFC."}, {"q": "Un banco tiene fondeo estable disponible de 1.100 y fondeo estable requerido de 1.000. ¿Cumple el CFEN?", "o": ["Sí, su CFEN es 110 %", "No, su CFEN es 91 %", "Sí, su CFEN es 10 %", "No se puede saber sin el patrimonio técnico"], "e": "1.100 / 1.000 = 110 %, por encima del mínimo de 100 %."}, {"q": "¿Qué efecto tiene una alta concentración del fondeo en pocos depositantes grandes?", "o": ["Aumenta el riesgo de liquidez, porque un retiro masivo de esos depositantes afecta la capacidad de pago", "Reduce el riesgo de liquidez", "Mejora el CFEN automáticamente", "Solo afecta el riesgo de mercado"], "e": "Un fondeo diversificado por instrumento, inversionista y plazo es más estable."}, {"q": "¿Qué significa ASG?", "o": ["Ambiental, social y de gobernanza", "Activos, solvencia y garantías", "Administración del sistema de gestión", "Análisis sectorial global"], "e": "En inglés es ESG. Son factores que afectan el desempeño de largo plazo de los emisores y los fondos."}, {"q": "¿Cuántos principios de inversión responsable promueve la iniciativa PRI?", "o": ["Seis", "Diecisiete", "Tres", "Diez"], "e": "El primero es incorporar los factores ASG en el análisis y la toma de decisiones de inversión. Los 17 son los Objetivos de Desarrollo Sostenible de la Agenda 2030."}, {"q": "La Agenda 2030 de las Naciones Unidas contiene:", "o": ["17 Objetivos de Desarrollo Sostenible", "6 principios de inversión responsable", "3 pilares de capital", "7 tipos de eventos de riesgo"], "e": "Fue adoptada en 2015 e incluye eliminar la pobreza, combatir el cambio climático y la igualdad de la mujer, entre otros."}, {"q": "La composición e independencia de la junta directiva y la política de compensación gerencial son riesgos del factor:", "o": ["Gobernanza", "Ambiental", "Social", "De mercado"], "e": "Gobernanza también incluye derechos de los accionistas, fraudes y sobornos."}, {"q": "Las prácticas laborales, la salud y seguridad de los empleados y la relación con la comunidad pertenecen al factor:", "o": ["Social", "Ambiental", "Gobernanza", "Operacional"], "e": "Ambiental: cambio climático, emisiones, uso del agua, polución y residuos."}, {"q": "¿Por qué la desviación estándar eleva al cuadrado las desviaciones frente a la media?", "o": ["Para que las variaciones positivas y negativas no se cancelen y pesen más las desviaciones grandes", "Para que el resultado siempre sea menor que 1", "Para convertir precios en rendimientos", "Para anualizar la volatilidad"], "e": "Por eso es más útil calcularla sobre rendimientos (centrados cerca de cero) que sobre precios."}, {"q": "El coeficiente de correlación entre dos activos toma valores entre:", "o": ["−1 y 1", "0 y 1", "0 e infinito", "−100 y 100"], "e": "−1 es correlación inversa perfecta, 1 directa perfecta y 0 indica que no hay relación lineal."}, {"q": "El máximo drawdown mide:", "o": ["La máxima pérdida observada en una ventana de tiempo, entre el precio máximo y el mínimo", "La volatilidad esperada por el mercado", "La sensibilidad frente al índice", "La pérdida promedio en la cola"], "e": "Por ejemplo, si un activo sube a 120 y luego cae a 90, el drawdown es 30 (25 % desde el máximo)."}, {"q": "Una acción tiene beta de 1,3 frente al COLCAP. Esto indica que:", "o": ["Es más riesgosa (volátil) que el índice", "Es menos riesgosa que el índice", "No tiene relación con el índice", "Tiene correlación negativa con el índice"], "e": "Beta mayor que 1: más riesgosa que el benchmark; menor que 1: menos riesgosa."}, {"q": "La volatilidad implícita:", "o": ["Es la volatilidad futura que espera el mercado, deducida de los precios de las opciones", "Es la desviación estándar de los últimos 30 días", "Es la volatilidad mínima regulatoria", "Solo existe en renta fija"], "e": "Se usa cuando se considera que el pasado no representa bien el futuro."}, {"q": "¿Qué modelo de volatilidad da más peso a las observaciones más recientes mediante un factor λ?", "o": ["EWMA (media móvil exponencialmente ponderada)", "ARCH", "Desviación estándar simple", "Máximo drawdown"], "e": "ARCH supone reversión a una media de largo plazo con igual peso para todos los días; GARCH combina ambas ideas."}, {"q": "En un modelo EWMA con λ = 0,94, ¿qué peso recibe el rendimiento al cuadrado más reciente?", "o": ["6 %", "94 %", "0,94 %", "50 %"], "e": "La varianza de hoy = λ × varianza de ayer + (1 − λ) × rendimiento² reciente. El peso del dato nuevo es 1 − 0,94 = 0,06."}, {"q": "El modelo GARCH se caracteriza por:", "o": ["Combinar una media de largo plazo de la volatilidad con mayor peso a la información reciente", "Suponer volatilidad constante", "Usar solo precios de opciones", "No requerir datos históricos"], "e": "Une la reversión a la media del ARCH con la ponderación reciente del EWMA."}, {"q": "¿Quién propuso el VaR como medida de riesgo?", "o": ["JP Morgan", "El Banco de la República", "Harry Markowitz", "El GAFI"], "e": "Lo difundió a través de su metodología RiskMetrics."}, {"q": "En Colombia, los niveles de confianza más usados para el VaR son:", "o": ["95 %, 97,5 % y 99 %", "50 %, 75 % y 90 %", "80 % y 85 %", "99,9 % únicamente"], "e": "El horizonte regulatorio de la SFC para el VaR es de 10 días, aunque debe guardar relación con el horizonte de tenencia."}, {"q": "Según la regulación de la SFC, el VaR regulatorio se estima con un horizonte de:", "o": ["10 días", "1 día", "1 año", "30 días"], "e": "El horizonte debe guardar relación con el plazo esperado de tenencia de la inversión."}, {"q": "El valor de z para un nivel de confianza de 98 % (una cola) es aproximadamente:", "o": ["2,05", "1,65", "2,33", "1,88"], "e": "Tabla de la guía: 95 % = 1,6448; 96 % = 1,7507; 97 % = 1,8808; 98 % = 2,0537; 99 % = 2,3263."}, {"q": "El valor de z para un nivel de confianza de 97 % (una cola) es aproximadamente:", "o": ["1,88", "1,65", "2,05", "2,33"], "e": "A mayor confianza, mayor z y mayor VaR."}, {"q": "Una inversión de COP 2.000.000 tiene volatilidad anual de 20 %. ¿Cuál es su VaR paramétrico a 10 días con 95 % de confianza (252 días hábiles al año)?", "o": ["Aproximadamente COP 131.000", "Aproximadamente COP 658.000", "Aproximadamente COP 41.000", "Aproximadamente COP 400.000"], "e": "VaR = 2.000.000 × 0,20 × √(10/252) × 1,6449 ≈ 131.069. La volatilidad anual se lleva a 10 días multiplicando por √(10/252)."}, {"q": "Una inversión de COP 5.000.000 tiene volatilidad anual de 15 %. ¿Cuál es su VaR paramétrico a 10 días con 99 % de confianza (252 días)?", "o": ["Aproximadamente COP 347.600", "Aproximadamente COP 1.744.700", "Aproximadamente COP 245.700", "Aproximadamente COP 750.000"], "e": "VaR = 5.000.000 × 0,15 × √(10/252) × 2,3263 ≈ 347.558."}, {"q": "¿Qué supuesto hace el VaR paramétrico?", "o": ["Que los rendimientos siguen una distribución normal", "Que los precios nunca bajan", "Que no hay correlación entre activos", "Que la volatilidad es cero"], "e": "La simulación histórica no supone ninguna distribución: usa el percentil de los rendimientos observados."}, {"q": "El VaR por simulación histórica se calcula:", "o": ["Tomando el percentil (1 − nivel de confianza) de los rendimientos históricos y multiplicándolo por el valor de la inversión", "Con la fórmula valor × σ × z", "Generando números aleatorios", "Con la duración modificada"], "e": "No asume una distribución de probabilidad."}, {"q": "¿En qué caso es especialmente útil el VaR por simulación de Montecarlo?", "o": ["Cuando el portafolio tiene opciones u otras características difíciles de modelar con los otros métodos", "Cuando no hay computador disponible", "Cuando el portafolio solo tiene CDT", "Cuando se quiere evitar supuestos de distribución"], "e": "Genera escenarios aleatorios (usualmente normales) y sobre ellos calcula el percentil."}, {"q": "La afirmación 'hay 99 % de probabilidad de que la pérdida del próximo mes no supere COP 20 millones' significa que:", "o": ["El VaR mensual al 99 % es COP 20 millones", "La pérdida máxima posible es COP 20 millones", "La pérdida esperada es COP 20 millones", "El expected shortfall es COP 20 millones"], "e": "Hay 1 % de probabilidad de perder más que eso; el VaR no dice cuánto más."}, {"q": "¿Por qué el VaR de un portafolio no es igual a la suma de los VaR individuales?", "o": ["Porque la diversificación entre activos con correlación menor que 1 reduce el riesgo conjunto", "Porque el VaR de un portafolio siempre es mayor", "Porque la SFC lo prohíbe", "Porque los VaR individuales se calculan con otra confianza"], "e": "Solo con correlación perfecta (+1) el VaR conjunto es la suma."}, {"q": "Un portafolio tiene 50 % en un activo con σ = 10 % y 50 % en otro con σ = 20 %, con correlación 0. ¿Cuál es la volatilidad del portafolio?", "o": ["Aproximadamente 11,2 %", "15 %", "30 %", "7,5 %"], "e": "σ = √(0,5²×0,10² + 0,5²×0,20²) = √0,0125 ≈ 11,18 %. Con correlación 1 sería el promedio ponderado: 15 %."}, {"q": "El tracking error mide:", "o": ["La desviación estándar de la diferencia entre el rendimiento del portafolio y el de su benchmark", "La pérdida máxima del portafolio", "La duración del portafolio", "La comisión del administrador"], "e": "Un fondo que replica exactamente el índice tiene tracking error cercano a cero; los fondos indexados buscan minimizarlo."}, {"q": "En el VaR relativo al benchmark (tracking error VaR), el portafolio teórico se construye con:", "o": ["Peso 1 en el portafolio analizado y peso −1 en el benchmark", "Peso 0,5 en cada uno", "Solo el benchmark", "Peso 1 en el activo libre de riesgo"], "e": "Así se mide el riesgo de desviarse del índice de referencia."}, {"q": "Si un portafolio está invertido exactamente como el índice COLCAP, su VaR relativo al COLCAP es:", "o": ["Cero", "Igual al VaR del COLCAP", "El doble del VaR del COLCAP", "Negativo"], "e": "No hay diferencia entre los rendimientos del portafolio y los del índice."}, {"q": "El DV01 de un bono es:", "o": ["El cambio en su precio cuando la tasa de descuento sube un punto básico (0,01 %)", "Su duración en días", "El cupón dividido por el precio", "La diferencia entre el bid y el ask"], "e": "Es la medida de sensibilidad más intuitiva de un bono."}, {"q": "Un bono cero cupón de nominal COP 1.000 vence en un año y se negocia al 8 % EA. ¿Cuál es aproximadamente su DV01?", "o": ["COP 0,086", "COP 0,86", "COP 8,6", "COP 0,0086"], "e": "P(8 %) = 1.000 / 1,08 = 925,926; P(8,01 %) = 1.000 / 1,0801 = 925,840. La diferencia es 0,0857."}, {"q": "Según la guía, la convexidad sirve para:", "o": ["Corregir el error de la aproximación lineal de la duración modificada, porque la relación precio-tasa es curva", "Medir el riesgo de crédito", "Calcular el cupón", "Medir la liquidez del bono"], "e": "La duración modificada es la pendiente de la tangente; la convexidad agrega el efecto de la curvatura."}, {"q": "Un bono cero cupón a 1 año tiene TIR de 5 %. ¿Cuál es su duración modificada?", "o": ["0,952", "1", "1,05", "0,5"], "e": "Duración de Macaulay = 1 (cero cupón); DM = 1 / 1,05 = 0,952."}, {"q": "¿Cuáles son las etapas del ciclo de gestión del riesgo en el SIAR?", "o": ["Identificación, medición, control y monitoreo", "Prevención, detección, investigación y judicialización", "Otorgamiento, seguimiento y recuperación", "Planeación, ejecución, cierre y archivo"], "e": "Es el mismo ciclo para los riesgos de mercado, crédito, liquidez y operacional."}, {"q": "¿Cuáles son los cuatro elementos que requiere una buena gestión del riesgo según la guía?", "o": ["Involucramiento estratégico, sistema integral de administración de riesgos, modelos de medición y supervisión basada en riesgos", "Capital, liquidez, solvencia y rentabilidad", "Front, middle, back office y auditoría", "Ambiente, actividades, información y monitoreo"], "e": "La supervisión basada en riesgos (SBR) permite al supervisor una visión más integral y prospectiva."}, {"q": "¿Cuándo debe hacerse la etapa de identificación de riesgos, además de periódicamente?", "o": ["Antes de entrar a nuevos mercados, negociar nuevos productos, cambiar procesos o canales, o hacer una fusión o adquisición", "Solo después de una pérdida", "Únicamente cuando lo pida la SFC", "Al cierre de cada año fiscal"], "e": "También cuando haya cambios estructurales en el mercado o la economía."}, {"q": "¿Cuál de estas es una técnica de identificación de riesgos?", "o": ["El método Delphi", "El VaR paramétrico", "La duración modificada", "El CFEN"], "e": "Otras: encuestas, entrevistas, lluvia de ideas, talleres y análisis de causa raíz."}, {"q": "En la etapa de medición, ¿cuál es la diferencia entre un modelo estándar y un modelo interno?", "o": ["El estándar lo define el supervisor; el interno lo diseña la entidad y debe ser aprobado por el supervisor", "El estándar es más preciso", "El interno no necesita aprobación", "El estándar solo se usa para riesgo operacional"], "e": "Los modelos internos deben poder medir escenarios extremos (stress testing)."}, {"q": "Según COSO, el nivel máximo de riesgo que una entidad es capaz de soportar es su:", "o": ["Capacidad de riesgo", "Apetito de riesgo", "Tolerancia al riesgo", "Riesgo residual"], "e": "Apetito: lo que está dispuesta a aceptar. Tolerancia: la variación aceptable en los resultados. Capacidad: lo máximo que puede soportar."}, {"q": "Según COSO, el nivel aceptable de variación en los resultados de la entidad en la búsqueda de sus objetivos es la:", "o": ["Tolerancia al riesgo", "Capacidad de riesgo", "Apetito de riesgo", "Pérdida esperada"], "e": "Apetito ≤ tolerancia ≤ capacidad, en términos generales."}, {"q": "El SIAR está regulado en:", "o": ["El Capítulo XXXI de la Circular Básica Contable y Financiera", "La Ley 964 de 2005", "El reglamento de AMV", "La Resolución Externa 1 de 2018"], "e": "Es el conjunto de políticas, estrategias, procedimientos, metodologías, controles y límites que permiten administrar de forma integrada los riesgos."}, {"q": "En la gestión del riesgo de liquidez, el control del cumplimiento de los límites debe hacerlo:", "o": ["Un área funcional diferente a la tesorería y a las áreas de captación y colocación", "La misma mesa de tesorería", "El revisor fiscal", "La SFC directamente"], "e": "Es el principio de independencia entre quien toma el riesgo y quien lo controla."}, {"q": "¿Qué es el backtesting según la guía?", "o": ["La verificación y calibración de un modelo, comparando sus resultados con los datos históricos", "Un escenario de crisis de deuda soberana", "Una orden de stop loss", "Un indicador de liquidez"], "e": "Valida si el modelo funciona antes de usarlo en una estrategia de trading o inversión."}, {"q": "¿Cuáles son los tres escenarios del stress testing que menciona la guía, de menor a mayor severidad?", "o": ["Básico, deterioro macroeconómico y crisis de la deuda soberana", "Optimista, neutral y pesimista", "Histórico, hipotético e híbrido", "Diario, mensual y anual"], "e": "El de crisis de deuda soberana suma al deterioro macroeconómico un deterioro de la deuda pública, como ocurrió en Europa."}, {"q": "¿Cuáles son tipos de pruebas de estrés?", "o": ["Análisis de sensibilidad, pruebas de escenarios y pruebas de estrés inversas", "VaR, DV01 y duración", "Backtesting, auditoría y revisoría", "Reactivas, proactivas y de comportamiento"], "e": "Los escenarios pueden ser históricos, hipotéticos o híbridos."}, {"q": "En un conglomerado financiero, las pruebas de estrés deben:", "o": ["Abarcar todos los ámbitos, incluidas las filiales y subsidiarias", "Hacerse solo en la matriz", "Excluir las entidades del exterior", "Hacerse solo cuando lo pida la junta"], "e": "La Ley 1870 de 2017 define los conglomerados financieros: entidades con un controlante común que incluye dos o más entidades vigiladas por la SFC."}, {"q": "Un inversionista compra una acción a COP 5.000 y fija un stop loss de COP 100. ¿A qué nivel queda el stop loss?", "o": ["COP 4.900", "COP 5.100", "COP 5.000", "COP 4.500"], "e": "En una compra, el stop loss siempre está por debajo del precio de entrada; en una venta en corto, por encima."}, {"q": "En una posición vendida (corta) con precio de entrada de 11.700 puntos y stop loss de 10 puntos, el stop loss se ubica en:", "o": ["11.710 puntos", "11.690 puntos", "11.700 puntos", "11.600 puntos"], "e": "Si el precio sube, la posición vendida pierde; por eso el stop está arriba."}, {"q": "Un stop loss que se actualiza automáticamente a medida que el precio se mueve a favor se llama:", "o": ["Stop loss dinámico (trailing)", "Stop loss garantizado", "Take profit", "Orden de mercado"], "e": "El garantizado es aquel en que el bróker garantiza cerrar la operación al nivel fijado."}, {"q": "Un inversionista compra 1.000 acciones a COP 2.000 y pone un take profit en COP 2.400. Si se ejecuta, ¿cuál es su ganancia?", "o": ["COP 400.000", "COP 2.400.000", "COP 40.000", "COP 4.000.000"], "e": "(2.400 − 2.000) × 1.000 = 400.000. El take profit asegura la ganancia ante una caída posterior."}, {"q": "Una empresa petrolera que venderá crudo en tres meses quiere protegerse de una caída del precio. ¿Qué cobertura toma?", "o": ["Una posición corta (venta) en futuros de petróleo", "Una posición larga (compra) en futuros de petróleo", "Comprar más crudo de contado", "No puede cubrirse"], "e": "La posición opuesta compensa: si el precio cae, gana en el futuro lo que pierde en la venta física."}, {"q": "Para que una cobertura sea perfecta, el instrumento de cobertura debe tener con la posición cubierta una correlación de:", "o": ["100 % (en sentido que compense exactamente)", "0 %", "50 %", "−50 %"], "e": "En la práctica es casi imposible, pero los futuros permiten acercarse."}, {"q": "¿Qué renuncia una empresa importadora que fija hoy la tasa de cambio con un forward?", "o": ["A beneficiarse si el dólar baja", "A recibir los dólares", "A pagar la deuda", "A la protección si el dólar sube"], "e": "La cobertura elimina tanto la pérdida como la ganancia por movimientos de la tasa."}, {"q": "¿Qué diferencia hay entre capital regulatorio y capital económico?", "o": ["El regulatorio es el mínimo exigido por el regulador; el económico es el que elegirían los accionistas sin regulación", "Son lo mismo", "El económico lo fija la SFC", "El regulatorio solo cubre el riesgo operacional"], "e": "El Pilar 1 de Basilea busca acercar el capital regulatorio al económico."}, {"q": "¿Cuáles son los tres pilares de Basilea?", "o": ["Requerimientos mínimos de capital, revisión del supervisor y disciplina de mercado", "Mercado, crédito y liquidez", "Identificación, medición y control", "Solvencia, liquidez y rentabilidad"], "e": "El Pilar 3 (disciplina de mercado) se basa en requerimientos de divulgación de información."}, {"q": "El patrimonio técnico se calcula como:", "o": ["Patrimonio básico ordinario + patrimonio básico adicional + patrimonio adicional − deducciones", "Activos − pasivos", "Capital suscrito + utilidades", "Activos ponderados × 9 %"], "e": "Está regulado en el Decreto 2555 de 2010 y el Capítulo XIII-16 de la CBCF."}, {"q": "¿Cuál es una característica de las acciones del patrimonio básico ordinario?", "o": ["Perpetuidad: solo se pagan en caso de liquidación", "Pagan un dividendo fijo obligatorio", "Pueden redimirse a los 5 años", "Pueden ser financiadas por la misma entidad"], "e": "Otros criterios: suscritas y pagadas, subordinación, dividendo no acumulativo y capacidad de absorber pérdidas."}, {"q": "¿Cuál de los siguientes NO hace parte del patrimonio básico ordinario?", "o": ["Las acciones propias readquiridas por la entidad", "El capital suscrito y pagado", "Las reservas legales", "Las utilidades retenidas"], "e": "Tampoco: pérdidas acumuladas, impuesto diferido neto positivo, inversiones en entidades financieras no consolidadas y el valor no amortizado del pasivo pensional."}, {"q": "Las acciones con dividendos fijos asimilables a intereses, que no califican como patrimonio básico ordinario, pueden ser:", "o": ["Patrimonio básico adicional", "Pasivo de corto plazo", "Deducciones", "Activos ponderados"], "e": "Al patrimonio básico adicional también se suman los dividendos decretados y el interés minoritario."}, {"q": "Para ser patrimonio adicional, un instrumento de deuda solo puede redimirse o recomprarse anticipadamente después de:", "o": ["Cinco años desde su emisión", "Un año", "Diez años", "Nunca"], "e": "Es el criterio de vocación de permanencia, además de subordinación general y no estar financiado por la entidad."}, {"q": "La relación de solvencia total se calcula como:", "o": ["Patrimonio técnico / (APNR + 100/9 × (VeR de mercado + VeR operacional)) y debe ser al menos 9 %", "Patrimonio / activos totales, mínimo 3 %", "Activos líquidos / pasivos, mínimo 100 %", "Utilidad / patrimonio, mínimo 9 %"], "e": "APNR son los activos ponderados por nivel de riesgo crediticio."}, {"q": "Un banco tiene patrimonio técnico de 90, APNR de 800, VeR de mercado de 10 y VeR operacional de 8. ¿Cuál es su solvencia total?", "o": ["9 %", "11,25 %", "10,9 %", "5 %"], "e": "Denominador = 800 + (100/9) × 18 = 800 + 200 = 1.000; solvencia = 90 / 1.000 = 9 %, justo el mínimo."}, {"q": "¿Qué métodos de Basilea II existen para calcular el capital por riesgo operacional?", "o": ["Indicador básico, estandarizado y de medición avanzada", "Paramétrico, histórico y Montecarlo", "Reactivo, de comportamiento y proactivo", "Sensibilidad, escenarios e inverso"], "e": "El riesgo operacional se incluyó en la solvencia con Basilea II."}, {"q": "Según Basilea III adoptado en Colombia, el IRL a 30 días tiene un límite de:", "o": ["100 %", "9 %", "3 %", "50 %"], "e": "Los activos líquidos de alta calidad deben cubrir los requerimientos netos a 30 días."}, {"q": "Según la Circular Básica Jurídica, el sistema de control interno es:", "o": ["El conjunto de políticas, principios, normas, procedimientos y mecanismos de verificación que da seguridad razonable sobre el logro de los objetivos", "Un área de la entidad que audita los estados financieros", "El comité que nombra la SFC", "Un software de control de límites"], "e": "Lo establecen la junta directiva, la alta dirección y los demás funcionarios."}, {"q": "¿Cuál NO es un objetivo del sistema de control interno?", "o": ["Garantizar una rentabilidad mínima a los accionistas", "Prevenir y mitigar fraudes", "Proteger los activos de la organización", "Aumentar la confiabilidad de la información"], "e": "También busca eficiencia y eficacia, gestionar los riesgos, cumplir la norma y prevenir la corrupción."}, {"q": "¿Cuáles son los principios del sistema de control interno?", "o": ["Autocontrol, autorregulación y autogestión", "Integridad, confidencialidad y disponibilidad", "Prevención, detección y corrección", "Legalidad, eficiencia y publicidad"], "e": "Autocontrol: cada funcionario evalúa y controla su propio trabajo. Autorregulación: la organización desarrolla sus propias normas. Autogestión: interpreta, coordina y evalúa su funcionamiento."}, {"q": "La capacidad de cada funcionario, sin importar su cargo, de evaluar y controlar su trabajo y corregir desviaciones es el principio de:", "o": ["Autocontrol", "Autogestión", "Autorregulación", "Segregación"], "e": "No sustituye la responsabilidad de los administradores en el diseño del SCI."}, {"q": "¿Cuáles son elementos del sistema de control interno?", "o": ["Ambiente de control, gestión de riesgos, actividades de control, información y comunicación, monitoreo y evaluaciones independientes", "Front, middle y back office", "Pilar 1, 2 y 3", "Identificación, medición y control"], "e": "Siguen el marco COSO."}, {"q": "El código de ética y conducta, la política de recurso humano y el comité de auditoría hacen parte del elemento:", "o": ["Ambiente de control", "Monitoreo", "Información y comunicación", "Actividades de control"], "e": "El ambiente de control es la cultura y la estructura de gobierno que orientan a todos hacia el control."}, {"q": "¿Cuáles son las estrategias posibles para tratar un riesgo?", "o": ["Evitarlo, mitigarlo, compartirlo, transferirlo, aceptarlo o aprovecharlo", "Ocultarlo o ignorarlo", "Solo transferirlo a una aseguradora", "Solo aceptarlo"], "e": "Se elige la que tenga mejor relación entre beneficio esperado y costo."}, {"q": "La segregación de funciones y la rotación de personal son controles de tipo:", "o": ["Preventivo", "Detectivo", "Correctivo", "Compensatorio"], "e": "Detectivos: identifican discrepancias (auditorías). Correctivos: se aplican cuando el error ya ocurrió, como un asiento de ajuste."}, {"q": "Registrar un asiento de ajuste para corregir un error contable ya cometido es un control:", "o": ["Correctivo", "Preventivo", "Detectivo", "General"], "e": "Se usa cuando los controles preventivos y detectivos no evitaron el error."}, {"q": "Los criterios de seguridad de la información son:", "o": ["Confidencialidad, integridad y disponibilidad", "Efectividad, eficiencia y confiabilidad", "Autocontrol, autorregulación y autogestión", "Oportunidad, suficiencia y calidad"], "e": "Efectividad, eficiencia y confiabilidad son los criterios de calidad."}, {"q": "En el modelo de líneas de defensa de la guía, ¿quién conforma la segunda línea?", "o": ["Las áreas de riesgos (crédito, mercado, liquidez, operacional) y SARLAFT", "Las áreas de negocio", "La auditoría interna", "Los supervisores y la revisoría fiscal"], "e": "Primera: negocio. Segunda: riesgos y cumplimiento. Tercera: auditoría interna. Cuarta: supervisores, reguladores y revisoría fiscal."}, {"q": "En el modelo de cuatro líneas de defensa de la guía de AMV, la cuarta línea corresponde a:", "o": ["Los supervisores, reguladores y la revisoría fiscal", "La auditoría interna", "El comité de riesgos", "Las áreas comerciales"], "e": "La auditoría interna es la tercera línea."}, {"q": "¿Con qué frecuencia mínima debe la junta directiva hacer seguimiento a la gestión de riesgos a través de informes del comité de auditoría?", "o": ["Cada seis meses", "Cada mes", "Cada año", "Cada tres años"], "e": "También al final de cada ejercicio presenta a la asamblea un informe sobre la evaluación del SCI."}, {"q": "El comité de auditoría debe reunirse por lo menos:", "o": ["Cada tres meses", "Cada mes", "Cada seis meses", "Una vez al año"], "e": "Depende de la junta directiva y sus funciones son de asesoría y apoyo; no sustituye la responsabilidad de la junta."}, {"q": "El comité de auditoría debe estar integrado por:", "o": ["Al menos tres miembros de la junta directiva, en su mayoría independientes cuando la entidad tenga miembros independientes", "El revisor fiscal y dos auditores", "Cinco empleados de la entidad", "Funcionarios de la SFC"], "e": "Sus decisiones constan en actas según el artículo 189 del Código de Comercio."}, {"q": "¿Quién NO puede considerarse miembro independiente del comité de auditoría?", "o": ["Un socio de una firma consultora que recibe de la entidad el 20 % o más de sus ingresos operacionales", "Un profesional sin vínculos con la entidad", "Un académico que solo recibe honorarios como miembro de junta", "Un exdirectivo que dejó la entidad hace cinco años"], "e": "Tampoco son independientes: empleados o directivos (o quienes lo fueron el año anterior), accionistas controlantes, ni quien reciba remuneración distinta de los honorarios de junta o comités."}, {"q": "¿Quién debe certificar que los estados financieros no contienen vicios, imprecisiones o errores?", "o": ["El representante legal", "El comité de auditoría", "La SFC", "El contralor normativo"], "e": "También debe establecer mecanismos para recibir denuncias y un programa antifraude, y dejar constancia documental de sus actuaciones."}, {"q": "Las sociedades comisionistas de bolsa deben contar con un contralor normativo según:", "o": ["El artículo 21 de la Ley 964 de 2005", "El Decreto 2555 de 2010, artículo 9", "La Ley 1870 de 2017", "El reglamento de AMV"], "e": "Debe ser independiente según los criterios del artículo 44 de la misma ley."}, {"q": "El contralor normativo de una sociedad comisionista:", "o": ["Asiste a la junta directiva con voz pero sin voto e informa de inmediato a la junta y a la SFC las irregularidades materiales", "Vota en la junta directiva", "Es empleado de la mesa de negociación", "Solo reporta al revisor fiscal una vez al año"], "e": "Vigila conflictos de interés, separación de activos de clientes, deber de asesoría, libro de órdenes, mejor ejecución, publicación de tarifas y que solo operen personas inscritas en el RNPMV."}, {"q": "¿Qué órgano de control externo debe valorar el sistema de control interno y de administración de riesgos y emitir su opinión?", "o": ["La revisoría fiscal", "La auditoría interna", "El comité de auditoría", "El contralor normativo"], "e": "La auditoría interna es interna e independiente de las áreas que audita, pero no externa."}, {"q": "Una característica fundamental de la auditoría interna es que:", "o": ["Es independiente y objetiva y no debe asumir responsabilidades de gestión", "Dirige las áreas de negocio", "Aprueba los límites de riesgo", "Es nombrada por la SFC"], "e": "Evalúa y mejora la eficacia de los procesos de gestión de riesgos, control y gobierno."}, {"q": "Si una entidad vigilada no tiene departamento de auditoría interna, debe:", "o": ["Explicar las razones en el informe de gestión que presentan los administradores al máximo órgano social", "Cerrar operaciones", "Pedir autorización a AMV", "Contratar a la revisoría fiscal como auditor interno"], "e": "Las entidades públicas vigiladas pueden aplicar el enfoque de auditoría interna del modelo MECI."}, {"q": "Un portafolio vale COP 5.000 millones y tiene una volatilidad diaria de 1.2 %. Con un nivel de confianza del 95 % (z = 1.65). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 99,0 millones", "COP 60,0 millones", "COP 139,8 millones", "COP 313,1 millones"], "e": "VaR = valor × volatilidad × z = 5000 × 0,012 × 1,65 = 99,0 millones."}, {"q": "Un portafolio vale COP 1.000 millones y tiene una volatilidad diaria de 1.0 %. Con un nivel de confianza del 99 % (z = 2.33). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 23,3 millones", "COP 10,0 millones", "COP 16,5 millones", "COP 73,7 millones"], "e": "VaR = valor × volatilidad × z = 1000 × 0,010 × 2,33 = 23,3 millones."}, {"q": "Un portafolio vale COP 800 millones y tiene una volatilidad diaria de 1.0 %. Con un nivel de confianza del 95 % (z = 1.65). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 13,2 millones", "COP 8,0 millones", "COP 18,6 millones", "COP 41,7 millones"], "e": "VaR = valor × volatilidad × z = 800 × 0,010 × 1,65 = 13,2 millones."}, {"q": "Un portafolio vale COP 1.000 millones y tiene una volatilidad diaria de 1.2 %. Con un nivel de confianza del 95 % (z = 1.65). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 19,8 millones", "COP 12,0 millones", "COP 28,0 millones", "COP 62,6 millones"], "e": "VaR = valor × volatilidad × z = 1000 × 0,012 × 1,65 = 19,8 millones."}, {"q": "Un portafolio vale COP 5.000 millones y tiene una volatilidad diaria de 1.5 %. Con un nivel de confianza del 99 % (z = 2.33). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 174,8 millones", "COP 75,0 millones", "COP 123,8 millones", "COP 552,6 millones"], "e": "VaR = valor × volatilidad × z = 5000 × 0,015 × 2,33 = 174,8 millones."}, {"q": "Un portafolio vale COP 5.000 millones y tiene una volatilidad diaria de 1.0 %. Con un nivel de confianza del 99 % (z = 2.33). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 116,5 millones", "COP 50,0 millones", "COP 82,5 millones", "COP 368,4 millones"], "e": "VaR = valor × volatilidad × z = 5000 × 0,010 × 2,33 = 116,5 millones."}, {"q": "Un portafolio vale COP 1.000 millones y tiene una volatilidad diaria de 1.2 %. Con un nivel de confianza del 99 % (z = 2.33). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 28,0 millones", "COP 12,0 millones", "COP 19,8 millones", "COP 88,4 millones"], "e": "VaR = valor × volatilidad × z = 1000 × 0,012 × 2,33 = 28,0 millones."}, {"q": "Un portafolio vale COP 1.000 millones y tiene una volatilidad diaria de 1.0 %. Con un nivel de confianza del 95 % (z = 1.65). ¿cuál es el VaR paramétrico a un día?", "o": ["COP 16,5 millones", "COP 10,0 millones", "COP 23,3 millones", "COP 52,2 millones"], "e": "VaR = valor × volatilidad × z = 1000 × 0,010 × 1,65 = 16,5 millones."}, {"q": "El VaR a un día de un portafolio es COP 12 millones. Según la regla de la raíz del tiempo, ¿cuál es el VaR aproximado a 10 días?", "o": ["COP 37,9 millones", "COP 120,0 millones", "COP 60,0 Macaulay de 5 años y una TIR de 10 % efectiva anual. ¿Cuál es su duración modificada?", "o": ["4,55", "5,50", "4,90", "5,00"], "e": "Duración modificada = D / (1 + TIR) = 5 / 1,10 = 4,55."}, {"q": "Un bono tiene una duración de Macaulay de 6 años y una TIR de 8 % efectiva anual. ¿Cuál es su duración modificada?", "o": ["5,56", "6,48", "5,92", "6,00"], "e": "Duración modificada = D / (1 + TIR) = 6 / 1,08 = 5,56."}, {"q": "Un bono tiene una duración de Macaulay de 6 años y una TIR de 12 % efectiva anual. ¿Cuál es su duración modificada?", "o": ["5,36", "6,72", "5,88", "6,00"], "e": "Duración modificada = D / (1 + TIR) = 6 / 1,12 = 5,36."}, {"q": "Un bono tiene una duración modificada de 5 y un precio de COP 500.000. Si las tasas bajan 0,25 %, ¿cuál es el cambio aproximado en su precio?", "o": ["Sube aproximadamente COP 6.250", "Baja aproximadamente COP 6.250", "Sube aproximadamente COP 1.250", "Sube aproximadamente COP 12.500"], "e": "Cambio % ≈ −DM × Δtasa = −5 × (−0,25 %) = +1,25 %. Sobre COP 500.000 son COP 6.250. Precio y tasa se mueven en sentido contrario."}, {"q": "Un bono tiene una duración modificada de 8 y un precio de COP 100.000. Si las tasas bajan 1,00 %, ¿cuál es el cambio aproximado en su precio?", "o": ["Sube aproximadamente COP 8.000", "Baja aproximadamente COP 8.000", "Sube aproximadamente COP 1.000", "Sube aproximadamente COP 16.000"], "e": "Cambio % ≈ −DM × Δtasa = −8 × (−1,00 %) = +8,00 %. Sobre COP 100.000 son COP 8.000. Precio y tasa se mueven en sentido contrario."}, {"q": "Un bono tiene una duración modificada de 4 y un precio de COP 1.000. Si las tasas bajan 0,25 %, ¿cuál es el cambio aproximado en su precio?", "o": ["Sube aproximadamente COP 10", "Baja aproximadamente COP 10", "Sube aproximadamente COP 2", "Sube aproximadamente COP 20"], "e": "Cambio % ≈ −DM × Δtasa = −4 × (−0,25 %) = +1,00 %. Sobre COP 1.000 son COP 10. Precio y tasa se mueven en sentido contrario."}, {"q": "Un bono tiene una duración modificada de 4 y un precio de COP 500.000. Si las tasas bajan 1,00 %, ¿cuál es el cambio aproximado en su precio?", "o": ["Sube aproximadamente COP 20.000", "Baja aproximadamente COP 20.000", "Sube aproximadamente COP 5.000", "Sube aproximadamente COP 40.000"], "e": "Cambio % ≈ −DM × Δtasa = −4 × (−1,00 %) = +4,00 %. Sobre COP 500.000 son COP 20.000. Precio y tasa se mueven en sentido contrario."}, {"q": "Un bono tiene una duración modificada de 2 y un precio de COP 100.000. Si las tasas bajan 1,00 %, ¿cuál es el cambio aproximado en su precio?", "o": ["Sube aproximadamente COP 2.000", "Baja aproximadamente COP 2.000", "Sube aproximadamente COP 1.000", "Sube aproximadamente COP 4.000"], "e": "Cambio % ≈ −DM × Δtasa = −2 × (−1,00 %) = +2,00 %. Sobre COP 100.000 son COP 2.000. Precio y tasa se mueven en sentido contrario."}, {"q": "Un bono tiene una duración modificada de 6 y un precio de COP 1.000. Si las tasas bajan 0,25 %, ¿cuál es el cambio aproximado en su precio?", "o": ["Sube aproximadamente COP 15", "Baja aproximadamente COP 15", "Sube aproximadamente COP 2", "Sube aproximadamente COP 30"], "e": "Cambio % ≈ −DM × Δtasa = −6 × (−0,25 %) = +1,50 %. Sobre COP 1.000 son COP 15. Precio y tasa se mueven en sentido contrario."}, {"q": "Una exposición de COP 500 millones tiene una probabilidad de incumplimiento de 1 % y una pérdida dado el incumplimiento de 35 %. ¿Cuál es la pérdida esperada?", "o": ["COP 1,8 millones", "COP 5,0 millones", "COP 175,0 millones", "COP 3,2 millones"], "e": "Pérdida esperada = PI × PDI × exposición = 0,01 × 0,35 × 500 = 1,8 millones."}, {"q": "Una exposición de COP 1.000 millones tiene una probabilidad de incumplimiento de 3 % y una pérdida dado el incumplimiento de 60 %. ¿Cuál es la pérdida esperada?", "o": ["COP 18,0 millones", "COP 30,0 millones", "COP 600,0 millones", "COP 12,0 millones"], "e": "Pérdida esperada = PI × PDI × exposición = 0,03 × 0,60 × 1000 = 18,0 millones."}, {"q": "Una exposición de COP 2.000 millones tiene una probabilidad de incumplimiento de 1 % y una const LESSONS = {"auto": "<span class=\"eyebrow\">Módulo 2 · 15 preguntas en el examen<\/span>\n<h1>Autorregulación en el mercado de valores<\/h1>\n<p>La autorregulación es la capacidad de los propios participantes del mercado de fijar normas, vigilar su cumplimiento, sancionar a quienes las incumplen y certificar a sus profesionales. En Colombia la ejerce principalmente el Autorregulador del Mercado de Valores (AMV), y es <b>obligatoria<\/b> para quienes hacen intermediación de valores (artículo 25 de la Ley 964 de 2005).<\/p>\n\n<h2>1. Qué es AMV y quién puede autorregular<\/h2>\n<ul>\n<li>AMV es una <b>corporación privada sin ánimo de lucro<\/b>, constituida exclusivamente para autorregular. La <b>SFC<\/b> la supervisa y autoriza sus reglamentos.<\/li>\n<li>La autorregulación <b>complementa<\/b> la supervisión estatal: no reemplaza a la SFC, que conserva todas sus facultades. Una misma conducta puede tener consecuencias ante AMV, ante la SFC y ante la justicia penal.<\/li>\n<li>Según la Ley 964, pueden ser autorreguladores: organizaciones creadas solo para ese fin, organizaciones gremiales o profesionales, bolsas de valores, bolsas de commodities y sociedades administradoras de sistemas de negociación.<\/li>\n<li>Hoy hay dos esquemas: <b>AMV<\/b> y la <b>Bolsa Mercantil de Colombia<\/b>. La BMC ejerce las funciones normativa, de supervisión y disciplinaria.<\/li>\n<\/ul>\n\n<h2>2. Las cuatro funciones de AMV<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Función<\/th><th>En qué consiste<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Normativa<\/td><td>Expedir reglamentos obligatorios para miembros y PNV, que pueden ser más exigentes que la ley.<\/td><\/tr>\n<tr><td>De supervisión<\/td><td>Verificar el cumplimiento mediante monitoreo, visitas, requerimientos de información y herramientas preventivas.<\/td><\/tr>\n<tr><td>Disciplinaria<\/td><td>Investigar (AMV) y juzgar (Tribunal disciplinario) las infracciones, e imponer sanciones.<\/td><\/tr>\n<tr><td>De certificación<\/td><td>Acreditar la capacidad técnica y profesional y verificar los antecedentes de quienes deben inscribirse en el RNPMV.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"box trampa\"><span class=\"tag\">Trampa típica<\/span>\n<p>La guía oficial dice que las <b>cuatro<\/b> funciones (normativa, supervisión, disciplina y certificación) le corresponden a AMV <b>por expresa disposición legal<\/b> (Ley 964 y Decreto 2555). No descartes la certificación como si fuera una función \"extra\".<\/p><\/div>\n\n<h2>3. Cómo nace una norma de AMV<\/h2>\n<ol>\n<li>El proyecto se publica para comentarios del público durante <b>15 días hábiles<\/b>.<\/li>\n<li>El <b>Comité de regulación<\/b> debe emitir concepto favorable.<\/li>\n<li>La <b>Sala de revisión<\/b> del Tribunal opina, pero su concepto <b>no es vinculante<\/b>.<\/li>\n<li>El <b>Consejo directivo<\/b> aprueba la norma.<\/li>\n<li>La <b>SFC<\/b> la autoriza. Rige desde el día siguiente a la publicación de la aprobación en firme.<\/li>\n<\/ol>\n<ul>\n<li>Las <b>cartas circulares<\/b> instruyen o aclaran el alcance de las normas y <b>no<\/b> requieren aprobación de la SFC.<\/li>\n<li>En el mercado de <b>divisas<\/b> se pide concepto previo al <b>Banco de la República<\/b>, que tiene 20 días hábiles para darlo.<\/li>\n<\/ul>\n\n<h2>4. Supervisión<\/h2>\n<ul>\n<li>AMV hace monitoreo de operaciones, visitas, requerimientos y seguimiento, y adopta <b>herramientas preventivas<\/b> para que las entidades corrijan sus controles.<\/li>\n<li>Presenta a la SFC su plan anual de supervisión y su informe de gestión en el <b>primer mes de cada año<\/b>.<\/li>\n<li>Califica preliminarmente las conductas como <b>muy graves<\/b> (defraudación, uso indebido de recursos, adulterar documentos), <b>graves<\/b> (conflictos de interés, mejor ejecución, deberes generales) o <b>leves<\/b> (ingreso de terceros a la mesa, hablar durante el examen).<\/li>\n<li><b>Reincidencia<\/b>: repetir la misma conducta dentro de los <b>3 años<\/b> siguientes a la adopción de una herramienta preventiva.<\/li>\n<\/ul>\n\n<h2>5. Sujetos de autorregulación<\/h2>\n<ul>\n<li><b>Obligatorios:<\/b> los intermediarios de valores (miembros) y sus <b>personas naturales vinculadas (PNV)<\/b>.<\/li>\n<li>Una PNV es cualquier administrador o funcionario que participe directa o indirectamente en la intermediación, la asesoría o la gestión de riesgos y control interno asociada, <b>sin importar el tipo de contrato<\/b> y <b>aunque no esté inscrita<\/b> en el RNPMV.<\/li>\n<li><b>Voluntarios:<\/b> quienes, sin ser intermediarios, se someten a AMV. Hoy el único esquema voluntario es el de <b>divisas<\/b>, con los mismos deberes y derechos que los miembros.<\/li>\n<li>Un aspirante también puede ser disciplinado por su conducta <b>durante el examen<\/b> de certificación.<\/li>\n<\/ul>\n\n<h2>6. Certificación<\/h2>\n<p>La certificación tiene dos componentes que deben estar vigentes al mismo tiempo: <b>aprobar el examen de idoneidad<\/b> y <b>verificar los antecedentes personales<\/b>. La adelanta la Gerencia de certificación e información, sin apoyo de quienes cumplen funciones disciplinarias o de supervisión.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Modalidad<\/th><th>Exámenes<\/th><th>Vigencia<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Directivo<\/td><td>Básico + especializado<\/td><td><b>4 años<\/b><\/td><\/tr>\n<tr><td>Operador<\/td><td>Examen de operador (básico + especializado) + una especialidad: renta fija, renta variable, derivados o maestro<\/td><td>3 años<\/td><\/tr>\n<tr><td>Asesor financiero<\/td><td>Básico + especializado<\/td><td>3 años<\/td><\/tr>\n<tr><td>Digitador<\/td><td>Básico + especializado<\/td><td>3 años<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li>Certificarse <b>no<\/b> es inscribirse en el RNPMV ni autoriza a actuar en el mercado. La inscripción en el RNPMV es la que habilita.<\/li>\n<li><b>Operador:<\/b> quien ejecuta órdenes de clientes, opera con recursos de la entidad, tiene código de acceso de operador (salvo uso exclusivo en colocaciones primarias) o imparte instrucciones desde la mesa. El operador puede hacer las labores de asesor sin otra certificación.<\/li>\n<li><b>Jefes de mesa<\/b>, aunque cumplan los requisitos de directivo, se certifican como operador en su especialidad. El <b>gerente de riesgo de mercado<\/b> sí debe ser directivo. Las juntas directivas y los presidentes no, salvo que tengan código de operador.<\/li>\n<li><b>Digitador:<\/b> solo ingresa posturas siguiendo instrucciones, sin contacto con clientes ni discrecionalidad.<\/li>\n<li><b>No<\/b> requieren certificación: quienes solo promueven CDT y CDAT, los corresponsales no bancarios y no bursátiles, y quien solo pone a disposición herramientas tecnológicas.<\/li>\n<li>Cualquier persona puede presentar el examen sin estar vinculada a un intermediario, y queda sometida al reglamento de AMV.<\/li>\n<li>El miembro debe verificar el SIAMV <b>al menos una vez al mes<\/b>. El responsable del deber de certificación informa a la junta cada semestre y reporta a AMV los incumplimientos dentro de <b>10 días hábiles<\/b>.<\/li>\n<\/ul>\n<div class=\"box clave\"><span class=\"tag\">Causales para negar la certificación<\/span>\n<ul>\n<li>Estar suspendido o inhabilitado por la SFC.<\/li>\n<li>Remoción del cargo por la SFC en los últimos <b>5 años<\/b>.<\/li>\n<li>Tener vigente una cancelación o suspensión en el RNAMV o el RNPMV, o una suspensión o expulsión de AMV o de un sistema de negociación.<\/li>\n<li>Condena en los últimos <b>20 años<\/b>, o vigente, por delito doloso contra el sistema financiero, el patrimonio o la administración pública, o por lavado, enriquecimiento ilícito o narcotráfico.<\/li>\n<li>Extinción de dominio en los últimos 20 años, sanciones en el exterior por lavado o narcotráfico, o estar en listas vinculantes de terrorismo.<\/li>\n<\/ul><\/div>\n\n<h2>7. El proceso disciplinario<\/h2>\n<p>La disciplina es un instrumento de <b>última instancia<\/b>: primero van el acompañamiento, la supervisión y las herramientas preventivas. Se prioriza lo muy grave, la reincidencia, la afectación de recursos de seguridad social o de muchos clientes, y los infractores en cargos relevantes. Se respetan el debido proceso (legalidad, tipicidad, prescripción) y los principios de <b>oportunidad, economía y celeridad<\/b>.<\/p>\n<ul>\n<li><b>Caducidad:<\/b> AMV no puede iniciar el proceso pasados <b>3 años<\/b> desde los hechos. Se cuentan desde la ejecución (infracción instantánea), desde el último acto (permanente o sucesiva) o desde que cesó el deber de actuar (omisión).<\/li>\n<li><b>Sujetos pasivos:<\/b> miembros, asociados voluntarios y PNV. La responsabilidad es institucional y personal, y una PNV puede ser investigada aunque ya se haya desvinculado, por hechos ocurridos mientras estaba vinculada.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead><tr><th>Etapa<\/th><th>Quién<\/th><th>Qué pasa<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Indagación preliminar<\/td><td>AMV<\/td><td>Identifica hechos y sujetos para decidir si abre la investigación.<\/td><\/tr>\n<tr><td>Investigación<\/td><td>AMV (Vicepresidencia de investigación y disciplina o Gerencia de disciplina)<\/td><td>En el proceso general: auto de apertura, explicaciones facultativas y pruebas. Termina en archivo motivado o en pliego de cargos.<\/td><\/tr>\n<tr><td>Decisión, 1.ª instancia<\/td><td>Una de las 12 salas de decisión del Tribunal<\/td><td>Pliego de cargos; descargos en <b>10 días prorrogables por 10<\/b>; pruebas y audiencia opcional. Debe sancionar dentro de <b>1 año<\/b> desde la notificación del pliego.<\/td><\/tr>\n<tr><td>Decisión, 2.ª instancia<\/td><td>Sala de revisión<\/td><td>Apelación dentro de <b>8 días<\/b>, por el imputado, AMV o ambos. Si solo apela el imputado, no se puede agravar su situación. No admite más recursos.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li>Cada sala tiene <b>3 miembros<\/b>: 2 independientes y 1 de la industria, y al menos uno debe ser abogado.<\/li>\n<li><b>Proceso abreviado:<\/b> para conductas objetivas de una lista taxativa. Empieza directamente con el pliego de cargos, sin auto de apertura. Ejemplos: actuar sin certificación o sin inscripción, incumplir suspensiones, exceder límites de repos, simultáneas y TTV por cuenta de terceros, no informar tarifas, no registrar operaciones OTC, incumplir medios verificables, ingreso de terceros o dispositivos prohibidos en la mesa, y contrapartes o activos no autorizados.<\/li>\n<li>Contra la decisión final cabe una <b>acción judicial por culpa grave o dolo<\/b> dentro del mes siguiente.<\/li>\n<\/ul>\n\n<h2>8. Colaboración y acuerdos de terminación anticipada (ATA)<\/h2>\n<ul>\n<li><b>Programa de colaboración:<\/b> la PNV que reconoce su participación y aporta información veraz, suficiente y nueva puede obtener el principio de oportunidad o una reducción del <b>40 % al 80 %<\/b> de la multa o suspensión. Si fue el <b>promotor<\/b>, solo del 40 % al 50 %. El primero en solicitarla obtiene más beneficios.<\/li>\n<li>Si ya hay proceso, la colaboración debe darse <b>antes del pliego de cargos<\/b>. Si no lo hay, cuando falte al menos un año para que caduque la facultad.<\/li>\n<li>Los beneficios se pierden si el colaborador controvierte los hechos que reconoció, no atiende requerimientos o citaciones, obstaculiza pruebas o da información falsa.<\/li>\n<li><b>ATA:<\/b> termina el proceso con reconocimiento de responsabilidad y tiene efecto de sanción. <b>No es una instancia<\/b> del proceso. Se puede pedir desde el inicio del proceso hasta el vencimiento del término de descargos, y <b>no lo puede pedir un reincidente<\/b>.<\/li>\n<li>AMV lo firma directamente si la sanción es amonestación, cursos o una multa de hasta <b>1.368 UVT<\/b> (persona natural) o <b>2.735 UVT<\/b> (persona jurídica), y en el proceso general la solicitud llegó en la investigación. Si no, va a la Sala de revisión, que lo aprueba, lo imprueba o le hace observaciones.<\/li>\n<li>La solicitud <b>suspende<\/b> el proceso. Firmado el ATA, se renuncia a otras acciones sobre esos hechos.<\/li>\n<\/ul>\n\n<h2>9. Sanciones<\/h2>\n<p>Los principios de la sanción (artículo 51 de la Ley 964) son <b>proporcionalidad, carácter disuasorio, revelación dirigida y contradicción<\/b>.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Sanción<\/th><th>Persona natural<\/th><th>Persona jurídica<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Amonestación<\/td><td>Sí<\/td><td>Sí<\/td><\/tr>\n<tr><td>Multa<\/td><td>Hasta <b>5.470 UVT<\/b>. Se paga en 15 días hábiles con patrimonio propio; si no paga, queda suspendida automáticamente.<\/td><td>Hasta <b>27.351 UVT<\/b>. Se paga en 5 días hábiles.<\/td><\/tr>\n<tr><td>Cursos de educación continuada<\/td><td>Sí, solo si está vinculada. Debe aprobarlos en 1 mes; si no, su certificación queda suspendida.<\/td><td>No<\/td><\/tr>\n<tr><td>Suspensión<\/td><td>De 1 día hábil a <b>10 años<\/b><\/td><td>No<\/td><\/tr>\n<tr><td>Expulsión<\/td><td>Sí. Se puede pedir readmisión tras <b>20 años<\/b>.<\/td><td>Sí. Pierde la calidad de miembro; readmisión tras 20 años.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li>Si se prueba un beneficio económico mayor que el tope, la multa puede llegar al <b>doble del beneficio<\/b>.<\/li>\n<li>La expulsión exige <b>unanimidad<\/b> de la sala.<\/li>\n<li>Las sanciones pueden ser concurrentes. Los ATA y las resoluciones prestan <b>mérito ejecutivo<\/b>. Incumplir una sanción es una nueva falta.<\/li>\n<li><b>Publicación<\/b> (solo sanciones en firme): amonestación y cursos, 3 años sin nombres; multa o suspensión, 5 años con nombres; expulsión, 20 años. Las suspensiones y expulsiones se informan además por boletín a la industria.<\/li>\n<li>Cuando se sanciona a una PNV, su entidad debe informar las medidas preventivas adoptadas dentro del mes siguiente.<\/li>\n<\/ul>\n\n<h2>10. Deberes de los sujetos de autorregulación<\/h2>\n<ul>\n<li><b>Generales:<\/b> actuar como experto prudente y diligente, con transparencia, honestidad, lealtad, claridad, precisión, probidad comercial, seriedad, cumplimiento, imparcialidad, idoneidad y profesionalismo. A esto se suman la competencia leal, el trato equitativo y la responsabilidad del miembro por los actos de sus PNV.<\/li>\n<li><b>Información al cliente:<\/b> debe ser oportuna, objetiva, completa, imparcial, clara y acorde con su perfil. Antes de la primera operación se informa la naturaleza de la entidad, las operaciones, los valores, sus riesgos y las tarifas. Los FIC y FVP informan mediante reglamento, prospecto, ficha técnica, extracto e informe de rendición de cuentas.<\/li>\n<li><b>Frente a AMV:<\/b> entregar la información requerida sin oponer reserva, informar cualquier situación irregular y acudir a las citaciones.<\/li>\n<li><b>Documentación:<\/b> las órdenes se reciben por <b>medio verificable<\/b>; sin él, se entiende que no hay orden. No se opera con clientes sin conocimiento del cliente completo.<\/li>\n<li><b>Reserva:<\/b> no es oponible a AMV, a las autoridades judiciales y administrativas competentes ni para efectos tributarios.<\/li>\n<li><b>Separación de activos:<\/b> los recursos de clientes no son del intermediario, no garantizan a sus acreedores y no pueden usarse para operaciones propias o de otros clientes.<\/li>\n<li><b>Valoración:<\/b> a precio justo de intercambio. Las inversiones de FIC y fondos de pensiones obligatorias se valoran como <b>negociables<\/b> (precios de mercado).<\/li>\n<li><b>Mejor ejecución:<\/b> buscar el mejor resultado posible <b>dentro de las instrucciones<\/b> del cliente. Para el cliente inversionista se mide por el precio o tasa en las condiciones del mercado.<\/li>\n<li><b>Asesoría:<\/b> perfil del cliente, perfil del producto y análisis de conveniencia. Si el cliente elige más riesgo del recomendado, se deja registro previo en medio verificable. El inversionista profesional que pide recomendación debe recibirla.<\/li>\n<li><b>Contraparte en el OTC:<\/b> no hay comisión ni mejor ejecución, se in
