los: estados financieros de clientes, oportunidades de negocio estratégicas y decisiones de inversión o desinversión."}, {"q": "La información confidencial en el sistema financiero:", "o": ["Está protegida por la reserva bancaria y bursátil, y solo la conocen quienes la necesitan para fines específicos", "Puede compartirse libremente dentro de la entidad", "Pierde la reserva al año", "Es lo mismo que información pública"], "e": "El sistema financiero tiene un deber de reserva superior al de otros sectores."}, {"q": "Dar a los recursos de un cliente un uso no autorizado o distinto a su intención es, según la guía:", "o": ["Mal uso de los recursos del cliente, una mala práctica contraria al tono ético", "Una práctica aceptada si genera rentabilidad", "Mejor ejecución", "Una facultad del intermediario"], "e": "Es una de las normas de conducta que destaca la guía."}, {"q": "Según la guía de ética, defraudar consiste en:", "o": ["Obtener una ventaja excesiva para sí o un tercero, afectando a un tercero o al mercado, en las operaciones o actividades de intermediación", "Cobrar la tarifa informada", "Recomendar un producto adecuado", "Revelar un conflicto de interés"], "e": "Es uno de los deberes de abstención del Reglamento de AMV."}, {"q": "¿Qué ley regula la transparencia de la información financiera y llevó a la creación del Valor Total Unificado (VTU)?", "o": ["La Ley 1748 de 2014", "La Ley 1778 de 2016", "La Ley 964 de 2005", "La Ley 2381 de 2024"], "e": "La ley busca que las entidades informen la tasa efectivamente pagada o recibida y el total de los cargos. El Decreto 1854 de 2015 desarrolló el VTU."}, {"q": "¿Qué es el Valor Total Unificado (VTU)?", "o": ["Un valor único, en porcentaje efectivo anual y en pesos, con el total que el cliente recibe o paga realmente", "La comisión máxima que puede cobrar una SCB", "El valor de la unidad de un FIC", "La tasa de referencia del Banco de la República"], "e": "Permite comparar de forma homogénea las ofertas de distintas entidades."}, {"q": "¿Qué norma desarrolló el VTU modificando el Decreto 2555 de 2010?", "o": ["El Decreto 1854 de 2015", "El Decreto 151 de 2021", "La Circular Externa 008 de 2024", "La Ley 1328 de 2009"], "e": "Desarrolló la Ley 1748 de 2014 sobre transparencia en la información financiera."}, {"q": "La Ley 1778 de 2016, conocida como ley antisoborno, se centra en sancionar:", "o": ["El soborno transnacional, es decir, a la parte oferente que da o promete beneficios a un servidor público extranjero", "La manipulación de precios en bolsa", "El uso de información privilegiada", "El lavado de activos"], "e": "Sanciona a la persona jurídica cuyos empleados, directivos, accionistas, proveedores o subordinadas ofrecen beneficios a un servidor público extranjero en un negocio internacional."}, {"q": "¿Qué entidad recibió amplias facultades para combatir el soborno transnacional según la Ley 1778 de 2016?", "o": ["La Superintendencia de Sociedades", "AMV", "El Banco de la República", "La Bolsa de Valores de Colombia"], "e": "La Supersociedades expidió una directriz sobre programas de ética empresarial, basada en estándares de la OCDE y leyes del Reino Unido y Estados Unidos."}, {"q": "¿Cuál de estos actores se menciona en la guía como fundamental para prevenir la corrupción transnacional dentro de la empresa?", "o": ["El revisor fiscal y el oficial de cumplimiento", "Los clientes minoristas", "Los proveedores de precios", "Los competidores"], "e": "También la junta directiva, el presidente y el equipo ejecutivo. Todos los empleados deben actuar éticamente."}, {"q": "¿Qué instrucción de la SFC, vigente desde mayo de 2024, pide fortalecer los sistemas de control interno, incluyendo el tono y la cultura ética?", "o": ["La Circular Externa 008 de 2024", "La Circular Básica Contable 100 de 1995", "La Ley 1748 de 2014", "El Decreto 2555 de 2010"], "e": "La guía la menciona como desarrollo reciente en el sistema financiero."}, {"q": "Según el artículo 159 del Reglamento de AMV, durante el examen de certificación el aspirante debe abstenerse de:", "o": ["Intentar acceder al banco de preguntas, copiar, tener elementos no autorizados o cometer fraude", "Usar una calculadora financiera", "Llevar su documento de identidad", "Llegar antes de la hora"], "e": "Incumplir estos deberes puede llevar a sanciones disciplinarias de AMV."}, {"q": "¿Hasta cuándo puede reprogramarse un examen de certificación de AMV?", "o": ["Hasta tres días hábiles antes de la fecha programada", "Hasta el mismo día del examen", "Hasta un mes antes", "No se puede reprogramar"], "e": "Las guías de AMV indican ese plazo tanto para el examen presencial como para el virtual."}, {"q": "En el examen presencial de AMV, ¿con cuánta anticipación conviene llegar?", "o": ["30 minutos, porque no se permite la entrada una vez empieza la sesión", "5 minutos", "Se puede llegar en cualquier momento", "2 horas"], "e": "La citación llega por correo dos días antes. Se debe llevar documento de identidad válido."}, {"q": "¿Qué elemento está permitido durante el examen de AMV?", "o": ["Una calculadora financiera o científica", "El celular", "Los apuntes de estudio", "Un libro de consulta"], "e": "En el examen virtual se permiten hasta dos hojas en blanco y un bolígrafo, que deben mostrarse a la cámara al inicio y al final."}, {"q": "¿Cuándo puede consultarse el resultado detallado por módulo del examen de AMV?", "o": ["Al día siguiente, en el SIAMV", "Un mes después, por correo físico", "Solo si se reprueba", "Nunca, solo se informa aprobado o no"], "e": "El resultado general se conoce al terminar el examen."}], "fic": [{"q": "Un fondo de inversión colectiva (FIC) es:", "o": ["Un mecanismo que capta dinero de un número plural de personas para gestionarlo de forma colectiva, con resultados también colectivos", "Un contrato individual de administración de portafolio", "Un depósito bancario con rentabilidad garantizada", "Un seguro de vida con componente de ahorro"], "e": "El FIC agrupa recursos de varios inversionistas, que se gestionan en conjunto. Los resultados económicos se reparten de forma proporcional entre ellos."}, {"q": "¿Qué norma regula principalmente los fondos de inversión colectiva en Colombia?", "o": ["El Decreto 2555 de 2010, Parte 3", "La Ley 100 de 1993", "La Ley 1328 de 2009", "El Código Civil"], "e": "El régimen de los FIC está en la Parte 3 del Decreto 2555 de 2010, que fue modificada por el Decreto 1242 de 2013."}, {"q": "¿Cuál es la característica de un FIC abierto?", "o": ["Los inversionistas pueden redimir sus participaciones en cualquier momento, según el reglamento", "Los inversionistas solo pueden redimir al final del plazo del fondo", "No admite nuevos inversionistas", "Solo invierte en acciones"], "e": "En el FIC abierto la redención puede hacerse en cualquier momento. Puede tener un pacto de permanencia, en cuyo caso el retiro anticipado tiene una penalidad."}, {"q": "En un FIC cerrado, los inversionistas:", "o": ["Solo pueden redimir sus participaciones al final del plazo previsto para la duración del fondo", "Pueden redimir en cualquier momento sin penalidad", "No reciben rendimientos", "No pueden vender sus participaciones a terceros"], "e": "En el FIC cerrado la redención ocurre al final de su duración. Mientras tanto, el inversionista puede ceder sus participaciones si el reglamento lo permite."}, {"q": "¿Qué es el pacto de permanencia en un FIC?", "o": ["Un plazo mínimo de permanencia; si el inversionista se retira antes, paga una penalidad", "Un compromiso de la sociedad administradora de garantizar la rentabilidad", "La obligación de reinvertir los rendimientos", "El plazo total de duración del fondo"], "e": "El pacto de permanencia exige mantener la inversión un tiempo mínimo. El retiro anticipado genera una sanción definida en el reglamento."}, {"q": "El valor de la unidad de un FIC se calcula como:", "o": ["El valor del patrimonio del fondo dividido entre el número de unidades en circulación", "El valor de los aportes dividido entre el número de inversionistas", "La rentabilidad diaria multiplicada por el patrimonio", "El valor nominal de las acciones del portafolio"], "e": "El valor de la unidad es el patrimonio del FIC dividido entre las unidades en circulación. Su variación diaria refleja la rentabilidad del fondo."}, {"q": "Un FIC tiene un patrimonio de COP 10.000 millones y 1.000.000 de unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 10.000", "COP 1.000", "COP 100.000", "COP 10"], "e": "Valor de la unidad = 10.000.000.000 / 1.000.000 = 10.000."}, {"q": "Un inversionista aporta COP 5.000.000 a un FIC cuya unidad vale COP 12.500. ¿Cuántas unidades recibe?", "o": ["400 unidades", "4.000 unidades", "62.500 unidades", "2.500 unidades"], "e": "Unidades = aporte / valor de la unidad = 5.000.000 / 12.500 = 400."}, {"q": "La rentabilidad de un FIC está determinada por:", "o": ["La variación del valor de la unidad, que depende de los resultados del portafolio y las comisiones", "Una tasa fija pactada en el reglamento", "La tasa de interés del Banco de la República", "El número de inversionistas del fondo"], "e": "El FIC no promete una tasa fija. La rentabilidad depende del desempeño de los activos, después de gastos y comisiones."}, {"q": "¿Puede la sociedad administradora de un FIC garantizar una rentabilidad a los inversionistas?", "o": ["No; sus obligaciones son de medio y no de resultado", "Sí, siempre que lo indique el prospecto", "Sí, si el fondo es de renta fija", "Sí, si la Superintendencia lo autoriza"], "e": "La sociedad administradora se obliga a gestionar con diligencia y profesionalismo, pero no garantiza resultados. Prometer rentabilidad está prohibido."}, {"q": "Si la sociedad administradora entra en liquidación, ¿qué pasa con los activos del FIC?", "o": ["No forman parte de los activos de la administradora, porque el FIC es un patrimonio independiente y separado", "Se usan para pagar a los acreedores de la administradora", "Pasan a ser propiedad del Estado", "Se pierden para los inversionistas"], "e": "Los bienes del FIC constituyen un patrimonio independiente y separado de los de la administradora, así que no responden por las deudas de esta."}, {"q": "¿Cuál es la función del custodio de valores de un FIC?", "o": ["Salvaguardar los valores del fondo, compensar y liquidar las operaciones y administrar los derechos patrimoniales", "Decidir las inversiones del fondo", "Comercializar las participaciones", "Fijar la comisión de administración"], "e": "El custodio, que debe ser una sociedad fiduciaria autorizada por la SFC, protege los valores del FIC, compensa y liquida sus operaciones y cobra rendimientos y dividendos. También verifica que se cumplan el reglamento y los límites legales."}, {"q": "¿Qué documento contiene las reglas que rigen la relación entre la sociedad administradora y los inversionistas del FIC?", "o": ["El reglamento del FIC", "La ficha técnica", "El extracto de cuenta", "El informe de gestión anual de la sociedad"], "e": "El reglamento contiene las reglas del FIC: política de inversión, comisiones, redenciones, órganos y derechos de los inversionistas."}, {"q": "La ficha técnica de un FIC es:", "o": ["Un documento resumido y estandarizado con información clave del fondo, como rentabilidad, volatilidad y composición, que se actualiza periódicamente", "El contrato que firma el inversionista", "El documento de constitución de la sociedad administradora", "El acta de la asamblea de inversionistas"], "e": "La ficha técnica permite comparar fondos: muestra rentabilidad, volatilidad, comisiones, composición del portafolio y otros datos, con un formato definido por la SFC."}, {"q": "El prospecto de un FIC tiene como objetivo:", "o": ["Dar a conocer al inversionista, antes de invertir, la información esencial del fondo de forma clara", "Reemplazar el reglamento", "Informar la rentabilidad garantizada", "Registrar las operaciones diarias"], "e": "El prospecto es un documento de divulgación previa, con la información esencial sobre la política de inversión, los riesgos y las condiciones del FIC."}, {"q": "¿Cuál es el máximo órgano de decisión de los inversionistas de un FIC?", "o": ["La asamblea de inversionistas", "El comité de inversiones", "La junta directiva de la sociedad administradora", "El revisor fiscal"], "e": "La asamblea de inversionistas reúne a los inversionistas y toma decisiones como la liquidación, la fusión o el cambio de administradora."}, {"q": "¿Cuál es la función del comité de inversiones de un FIC?", "o": ["Analizar las inversiones y definir los cupos y políticas para adquirir y liquidar inversiones", "Atender las quejas de los inversionistas", "Auditar los estados financieros del fondo", "Aprobar el reglamento ante la SFC"], "e": "El comité de inversiones analiza las inversiones y los emisores, define cupos y políticas, siempre dentro del reglamento."}, {"q": "Un FIC bursátil se caracteriza por:", "o": ["Replicar o seguir un índice bursátil, con participaciones que se negocian en bolsa", "Invertir únicamente en inmuebles", "Garantizar la rentabilidad de la bolsa", "Tener un pacto de permanencia obligatorio"], "e": "Los FIC bursátiles, similares a los ETF, buscan replicar un índice y sus participaciones se transan en un sistema de negociación."}, {"q": "Los fondos de capital privado (FCP) son FIC cerrados que deben invertir:", "o": ["Al menos dos terceras partes de los aportes en activos distintos a valores inscritos en el RNVE", "Exclusivamente en TES", "Solo en acciones inscritas en bolsa", "Únicamente en depósitos a la vista"], "e": "Los FCP invierten principalmente en activos no inscritos en el RNVE, como empresas no listadas, proyectos e infraestructura. Por eso son cerrados."}, {"q": "¿Cuál es la principal fuente de remuneración de la sociedad administradora de un FIC?", "o": ["La comisión de administración, que se descuenta del valor del fondo", "Un porcentaje de las pérdidas del fondo", "Una tarifa fija pagada por el Estado", "Los intereses de los créditos que otorga el fondo"], "e": "La administradora cobra una comisión, normalmente un porcentaje anual sobre el valor del fondo que se causa diariamente. Puede existir también una comisión de éxito si el reglamento la prevé."}, {"q": "¿Con qué frecuencia se valora el portafolio de un FIC abierto?", "o": ["Diariamente", "Una vez al mes", "Una vez al año", "Solo cuando un inversionista redime"], "e": "Los FIC valoran sus activos y calculan el valor de la unidad diariamente, de modo que los aportes y retiros se hacen a valor justo."}, {"q": "El informe de rendición de cuentas de un FIC sirve para:", "o": ["Explicar a los inversionistas los resultados, la gestión y la composición del portafolio en el período", "Solicitar nuevos aportes", "Cambiar el reglamento", "Liquidar el fondo"], "e": "La rendición de cuentas explica periódicamente cómo se gestionó el fondo, qué resultados obtuvo y cuáles fueron sus principales riesgos."}, {"q": "¿Puede un FIC tener un gestor externo?", "o": ["Sí, la sociedad administradora puede delegar la gestión del portafolio en un gestor externo, sin perder su responsabilidad", "No, nunca", "Solo si el gestor es el Banco de la República", "Solo si los inversionistas son menos de diez"], "e": "El régimen permite contratar un gestor externo para la gestión del portafolio. La administradora sigue siendo responsable frente a los inversionistas."}, {"q": "¿Qué derecho tiene un inversionista de un FIC abierto sin pacto de permanencia?", "o": ["Redimir total o parcialmente sus participaciones en cualquier momento, según el reglamento", "Exigir una rentabilidad mínima", "Decidir las inversiones del fondo", "Retirar los activos del portafolio en especie"], "e": "En un FIC abierto sin pacto de permanencia, el inversionista puede pedir la redención de sus participaciones cuando quiera, según los plazos del reglamento."}, {"q": "Un FIC compuesto principalmente por instrumentos de corto plazo y alta liquidez, de bajo riesgo, se denomina normalmente:", "o": ["FIC del mercado monetario", "FIC de capital privado", "FIC inmobiliario", "FIC apalancado"], "e": "Los FIC del mercado monetario invierten en instrumentos de corto plazo y bajo riesgo, buscando preservar el capital y dar liquidez."}, {"q": "Un FIC con pacto de permanencia de 90 días cobra una penalidad del 2 % por retiro anticipado. Un inversionista retira COP 10.000.000 a los 60 días. ¿Cuánto paga de penalidad?", "o": ["COP 200.000", "COP 20.000", "COP 2.000.000", "No paga nada"], "e": "Penalidad = 2 % × 10.000.000 = 200.000, porque se retira antes de cumplir el plazo de permanencia."}, {"q": "¿Qué característica tienen los FIC inmobiliarios?", "o": ["Invierten principalmente en inmuebles o en derechos sobre inmuebles", "Invierten solo en TES", "Garantizan una renta fija", "Replican un índice bursátil"], "e": "Los FIC inmobiliarios destinan la mayor parte de sus recursos a activos inmobiliarios, como oficinas, locales o bodegas."}, {"q": "¿Cuál es el máximo que un solo inversionista puede tener del valor patrimonial de un FIC abierto, después de su primer año de operación?", "o": ["10 %", "60 %", "25 %", "No hay límite"], "e": "En un FIC abierto un solo inversionista no puede tener, directa o indirectamente (incluso por cuenta ómnibus), más del 10 % del valor del fondo. En un FIC cerrado el límite es 60 %. Ninguno aplica en el primer año de operación."}, {"q": "¿Qué es una comisión de éxito en un FIC?", "o": ["Una remuneración adicional para la administradora cuando la rentabilidad supera un referente definido en el reglamento", "Una comisión que paga el inversionista al entrar al fondo", "Una multa por retiro anticipado", "El costo de la custodia"], "e": "La comisión de éxito se cobra solo si el fondo supera el desempeño pactado en el reglamento."}, {"q": "¿Qué diferencia hay entre el reglamento y el prospecto de un FIC?", "o": ["El reglamento contiene todas las reglas contractuales del fondo; el prospecto es un resumen informativo para el inversionista", "Son el mismo documento", "El prospecto se actualiza cada día", "El reglamento solo lo conoce la Superintendencia"], "e": "El reglamento es el documento que rige la relación con el inversionista. El prospecto presenta de forma resumida la información esencial."}, {"q": "Si la sociedad administradora quiere modificar el reglamento de un FIC en aspectos que afectan los derechos económicos de los inversionistas, debe:", "o": ["Informar a los inversionistas, quienes pueden retirarse sin penalidad si no están de acuerdo", "Hacerlo sin informar a nadie", "Pedir permiso al Banco de la República", "Cerrar el fondo"], "e": "Los cambios que afectan los derechos económicos deben informarse y los inversionistas que no estén de acuerdo pueden redimir sin penalidad."}, {"q": "Las operaciones de naturaleza apalancada en un FIC:", "o": ["Solo pueden hacerse si el reglamento lo permite y dentro de los límites legales", "Están permitidas en todos los FIC sin límites", "Están prohibidas siempre", "Las decide cada inversionista"], "e": "El apalancamiento aumenta el riesgo. Por eso debe estar previsto en el reglamento y sujetarse a límites."}, {"q": "La revisoría fiscal de un FIC:", "o": ["Es ejercida por el revisor fiscal de la sociedad administradora, que dictamina sobre el fondo", "No existe", "La ejerce el custodio", "La ejercen los inversionistas"], "e": "El revisor fiscal de la sociedad administradora también examina y dictamina los estados financieros del FIC."}, {"q": "¿Qué es la distribución especializada de FIC mediante cuentas ómnibus?", "o": ["Un mecanismo en el que un distribuidor agrupa a varios inversionistas en una sola cuenta ante el FIC", "Una forma de invertir en el exterior", "Un tipo de pacto de permanencia", "Un FIC con un solo inversionista"], "e": "En la cuenta ómnibus el distribuidor actúa a nombre propio y por cuenta de varios inversionistas, y mantiene el registro individual de cada uno."}, {"q": "La gestión de un FIC debe realizarse:", "o": ["Con profesionalismo, diligencia y en el mejor interés de los inversionistas", "Buscando la mayor comisión para la administradora", "Según las instrucciones de cada inversionista", "Sin seguir la política de inversión"], "e": "La administradora y el gestor deben actuar de manera profesional, con diligencia y lealtad hacia los inversionistas."}, {"q": "¿Qué información contiene el extracto de cuenta de un inversionista de un FIC?", "o": ["Los aportes, retiros, unidades, valor de la unidad, rendimientos y saldo del inversionista en el período", "La política de inversión completa", "Los estados financieros de la sociedad administradora", "Las actas del comité de inversiones"], "e": "El extracto informa al inversionista sobre sus movimientos y el valor de su inversión."}, {"q": "¿Qué pasa con la rentabilidad de un FIC cuando sube la comisión de administración, manteniendo lo demás igual?", "o": ["La rentabilidad neta para el inversionista disminuye", "La rentabilidad neta aumenta", "No cambia", "Se vuelve fija"], "e": "La comisión se descuenta del valor del fondo. A mayor comisión, menor rentabilidad neta."}, {"q": "¿Cuál es el principal riesgo de un FIC de renta fija de largo plazo?", "o": ["El riesgo de tasa de interés: si las tasas suben, el valor de la unidad puede bajar", "No tiene ningún riesgo", "El riesgo de que el reglamento cambie", "El riesgo de tipo de cambio siempre"], "e": "Los títulos de largo plazo tienen mayor duración, lo que los hace más sensibles a los cambios de tasas."}, {"q": "¿Puede un FIC de renta fija tener rentabilidades negativas?", "o": ["Sí, cuando el valor de mercado de sus títulos cae, por ejemplo por un alza de tasas", "No, nunca", "Solo si la administradora quiebra", "Solo si es un FIC cerrado"], "e": "Los títulos se valoran a precios de mercado. Si las tasas suben, sus precios bajan y el FIC puede rentar negativo en ese período."}, {"q": "¿Qué es un FIC de mercado monetario?", "o": ["Un FIC que invierte en instrumentos de corto plazo y alta liquidez, con baja volatilidad", "Un FIC que invierte en divisas", "Un FIC de acciones", "Un FIC inmobiliario"], "e": "Los FIC de mercado monetario buscan preservar el capital y ofrecer liquidez, con inversiones de corto plazo."}, {"q": "¿Qué organismo puede decidir la liquidación de un FIC, además de las causales del reglamento?", "o": ["La asamblea de inversionistas", "El custodio", "El defensor del consumidor", "El comité de inversiones"], "e": "La asamblea de inversionistas puede decidir la liquidación del fondo. También son causales el vencimiento del plazo y la disminución del patrimonio por debajo del mínimo."}, {"q": "Un FIC cerrado puede ofrecer liquidez a sus inversionistas antes del vencimiento mediante:", "o": ["La negociación de sus participaciones en el mercado secundario, si están inscritas, o redenciones parciales previstas en el reglamento", "Retiros en cualquier momento a voluntad", "El pago con recursos propios de la administradora", "Créditos del Banco de la República"], "e": "El FIC cerrado no permite redenciones libres. Sus participaciones pueden negociarse si el reglamento y su inscripción lo permiten."}, {"q": "¿Quién es responsable de valorar diariamente los activos de un FIC?", "o": ["La sociedad administradora, siguiendo las normas de valoración y usando los precios de un proveedor de precios", "Cada inversionista", "El Banco de la República", "La calificadora de riesgo"], "e": "La administradora valora el portafolio diariamente con metodologías de la SFC y precios de proveedores autorizados."}, {"q": "La ficha técnica de un FIC debe informar, entre otros datos:", "o": ["La rentabilidad, la volatilidad, las comisiones y la composición del portafolio", "Los nombres de todos los inversionistas", "El salario del gestor", "Las órdenes de compra del día siguiente"], "e": "La ficha técnica resume los datos clave para comparar fondos y entender su perfil de riesgo."}, {"q": "¿Qué debe hacer la sociedad administradora si un FIC no cumple los límites de inversión por movimientos del mercado?", "o": ["Ajustarse a los límites dentro de los plazos y procedimientos previstos e informar según las normas", "Ignorar el incumplimiento", "Cerrar el fondo de inmediato", "Cobrar una comisión adicional"], "e": "Los excesos pasivos deben corregirse en los plazos establecidos y reportarse según las reglas."}, {"q": "¿Qué tipo de obligación asume la sociedad administradora frente a los inversionistas de un FIC?", "o": ["Obligaciones de medio, no de resultado", "Obligaciones de resultado", "Ninguna obligación", "La obligación de garantizar el capital"], "e": "La administradora debe gestionar con diligencia profesional, pero no garantiza rentabilidad ni la devolución del capital."}, {"q": "¿Qué es un FIC con participaciones diferenciales?", "o": ["Un FIC con distintos tipos de participaciones para grupos de inversionistas, por ejemplo con comisiones distintas", "Un FIC que solo admite un inversionista", "Un FIC sin comisión", "Un FIC cerrado de capital privado"], "e": "Las participaciones diferenciales permiten condiciones distintas, como comisiones o montos mínimos, para diferentes tipos de inversionistas."}, {"q": "¿Qué es un compartimento en un fondo de capital privado?", "o": ["Una división del fondo con un plan de inversión y unos inversionistas propios", "Una cuenta bancaria del gestor", "Un tipo de comisión", "Un FIC del mercado monetario"], "e": "Los compartimentos permiten administrar distintos portafolios dentro de un mismo fondo, cada uno con sus reglas."}, {"q": "En los fondos de capital privado, la figura del gestor profesional:", "o": ["Es la persona experta encargada de las decisiones de inversión del fondo, designada según el reglamento", "Es el inversionista mayoritario", "Es el revisor fiscal", "Es el custodio"], "e": "El gestor profesional aporta experiencia en el tipo de activos del FCP y toma las decisiones de inversión."}, {"q": "Un FIC de renta variable es más adecuado para un inversionista:", "o": ["Con horizonte de largo plazo y tolerancia a la volatilidad", "Que necesita el dinero el próximo mes", "Con perfil muy conservador", "Que busca rentabilidad garantizada"], "e": "La renta variable puede caer mucho en el corto plazo. Es adecuada para quienes pueden esperar y tolerar fluctuaciones."}, {"q": "¿Cuándo se materializa la rentabilidad de un inversionista en un FIC?", "o": ["Al redimir sus participaciones, según el valor de la unidad en ese momento", "Cada día en efectivo", "Al inicio de la inversión", "Solo si el fondo se liquida"], "e": "Mientras el inversionista permanece, la rentabilidad se refleja en el valor de la unidad. Se realiza al redimir."}, {"q": "¿Qué FIC está obligado a tener la sociedad administradora con un custodio de valores?", "o": ["Todos los FIC que inviertan en valores, porque la custodia es obligatoria para esos activos", "Solo los FIC inmobiliarios", "Ningún FIC", "Solo los FIC con un inversionista"], "e": "La regulación exige que los valores de los FIC estén en custodia de una entidad autorizada, independiente de la administradora."}, {"q": "La política de inversión de un FIC debe estar definida en:", "o": ["El reglamento del fondo", "El extracto de cuenta", "Las actas de la asamblea de accionistas de la administradora", "El contrato laboral del gestor"], "e": "El reglamento fija los activos admisibles, límites, plazos y riesgos que puede asumir el fondo."}, {"q": "¿Puede un FIC invertir en valores emitidos por su propia sociedad administradora?", "o": ["Solo dentro de los límites y condiciones que fija la regulación, para manejar el conflicto de interés", "Sí, sin límite", "No, en ninguna circunstancia, y es delito", "Solo si el inversionista lo pide"], "e": "La regulación restringe las inversiones en la matriz o vinculadas de la administradora por el conflicto de interés que generan."}, {"q": "Las redenciones en un FIC abierto se pagan normalmente:", "o": ["En el plazo que señale el reglamento, después de la solicitud", "En la fecha que elija la administradora sin límite", "Solo al final del año", "Solo en especie"], "e": "El reglamento define el plazo para pagar las redenciones, por ejemplo el mismo día o al día hábil siguiente."}, {"q": "Un inversionista de un FIC abierto pide la redención total. ¿A qué valor se le paga?", "o": ["Al valor de la unidad vigente para el día de la redención, menos la retención y penalidades que apliquen", "Al valor de su aporte inicial", "Al valor máximo histórico de la unidad", "Al valor que el inversionista elija"], "e": "La redención se liquida con el valor de la unidad del día, que refleja la valoración del portafolio."}, {"q": "En la ficha técnica, la volatilidad histórica del FIC indica:", "o": ["Qué tanto ha variado su rentabilidad, como medida de riesgo", "La rentabilidad garantizada", "El número de inversionistas", "La comisión de éxito"], "e": "Una volatilidad alta significa que el valor de la unidad ha fluctuado más y, por tanto, que el fondo es más riesgoso."}, {"q": "Si un FIC cobra una comisión de administración del 1,5 % efectivo anual sobre el valor del fondo, esta se causa:", "o": ["Diariamente, sobre el valor del fondo", "Solo al final del año", "Solo cuando el inversionista redime", "Solo si el fondo gana"], "e": "La comisión se calcula y descuenta diariamente del valor del fondo, por eso la rentabilidad publicada ya es neta."}, {"q": "¿Qué es un FIC con montos mínimos de inversión?", "o": ["Un FIC que exige un aporte mínimo para vincularse o mantenerse, según el reglamento", "Un FIC sin comisión", "Un FIC exclusivo del Gobierno", "Un FIC cerrado"], "e": "El reglamento puede fijar montos mínimos de vinculación y de permanencia."}, {"q": "La rendición de cuentas de un FIC debe presentarse al menos:", "o": ["Cada seis meses, con cortes a 30 de junio y 31 de diciembre", "Una vez al año, con corte a 31 de diciembre", "Cada mes, junto con la ficha técnica", "Solo cuando la asamblea lo pida"], "e": "El informe de rendición de cuentas se presenta mínimo semestralmente (cortes 30 de junio y 31 de diciembre), salvo que el reglamento fije una periodicidad menor, y se envía a más tardar 15 días comunes después del corte."}, {"q": "¿Qué debe hacer la administradora antes de vincular a un inversionista a un FIC?", "o": ["Entregarle información sobre el fondo, como el reglamento y el prospecto, y verificar su conocimiento según SARLAFT", "Garantizarle una rentabilidad", "Pedirle que renuncie a sus derechos", "Vincularlo sin documentos"], "e": "La vinculación exige información previa al inversionista y los procedimientos de conocimiento del cliente."}, {"q": "Los gastos que pueden cargarse a un FIC son:", "o": ["Solo los previstos en el reglamento, como custodia, auditoría y comisiones de transacción", "Cualquier gasto de la administradora", "Los salarios de todos los empleados de la administradora", "Los impuestos personales de los inversionistas"], "e": "Solo se pueden cobrar al fondo los gastos que el reglamento autoriza y que se relacionan con su operación."}, {"q": "¿Qué FIC no permite nuevos aportes después del período de suscripción inicial?", "o": ["Normalmente, los FIC cerrados", "Los FIC abiertos sin pacto", "Los FIC del mercado monetario", "Los FIC bursátiles"], "e": "En los FIC cerrados el capital se suscribe en un período inicial y queda comprometido hasta el final del plazo."}, {"q": "¿Cuál es el papel de la Superintendencia Financiera frente a los FIC?", "o": ["Vigilar a las sociedades administradoras y verificar el cumplimiento de las normas de los fondos", "Garantizar la rentabilidad de los fondos", "Elegir las inversiones de los fondos", "Recibir los aportes de los inversionistas"], "e": "La SFC supervisa a las administradoras y puede tomar medidas si incumplen la regulación."}, {"q": "¿Qué FIC puede invertir en otros FIC?", "o": ["Un FIC cuyo reglamento lo permita, dentro de los límites de la regulación (fondo de fondos)", "Ninguno", "Solo los FIC del Banco de la República", "Todos sin límites"], "e": "Los FIC pueden invertir en otros fondos si el reglamento lo autoriza, y se aplican reglas para evitar el cobro doble de comisiones."}, {"q": "¿Qué FIC se recomienda para manejar recursos de liquidez de corto plazo?", "o": ["Un FIC abierto sin pacto de permanencia de baja volatilidad, como uno del mercado monetario", "Un FIC cerrado de capital privado", "Un FIC inmobiliario", "Un FIC de acciones apalancado"], "e": "Para necesidades de liquidez se requiere disponibilidad inmediata y baja volatilidad."}, {"q": "La asamblea de inversionistas de un FIC puede ser convocada por:", "o": ["La administradora, el gestor externo, el revisor fiscal, inversionistas con al menos 25 % de las participaciones o la SFC", "Solo la Superintendencia Financiera", "Solo la junta directiva de la administradora", "Cualquier inversionista, sin importar su participación"], "e": "Pueden convocarla la sociedad administradora, el gestor externo si existe, el revisor fiscal, inversionistas que tengan mínimo el 25 % de las participaciones o la SFC."}, {"q": "¿Puede una sociedad administradora ceder la administración de un FIC a otra sociedad?", "o": ["Sí, con los requisitos de la regulación y garantizando los derechos de los inversionistas", "No, nunca", "Solo si el fondo tiene pérdidas", "Solo con autorización del Banco de la República"], "e": "La cesión es posible, con información a los inversionistas y el derecho a retirarse si no están de acuerdo."}, {"q": "La fusión de dos FIC requiere, entre otros:", "o": ["Informar a los inversionistas y darles la posibilidad de retirarse si no están de acuerdo", "Solo la decisión del gestor", "La liquidación previa de ambos", "La autorización de cada cliente por escrito notarial"], "e": "La fusión cambia las condiciones de inversión, por eso se protege el derecho de retiro."}, {"q": "Los activos admisibles de un FIC están definidos en:", "o": ["El reglamento, dentro de lo que permite la regulación", "El extracto mensual", "La ficha técnica del mes anterior", "El contrato laboral del gestor"], "e": "La política de inversión del reglamento define qué puede comprar el fondo."}, {"q": "Si un FIC tiene una volatilidad anual de 15 % y otro de 2 %, en principio:", "o": ["El primero es más riesgoso", "El segundo es más riesgoso", "Tienen el mismo riesgo", "El primero tiene rentabilidad garantizada"], "e": "Mayor volatilidad indica mayor variabilidad del valor de la unidad y, por tanto, mayor riesgo."}, {"q": "Un inversionista compara dos FIC de renta fija con la misma rentabilidad bruta. Uno cobra 1 % y otro 2 % de comisión. ¿Cuál tendrá mejor rentabilidad neta, manteniendo todo igual?", "o": ["El de 1 % de comisión", "El de 2 % de comisión", "Ambos igual", "No se puede saber"], "e": "Con igual rentabilidad bruta, la menor comisión deja una rentabilidad neta mayor."}, {"q": "¿Qué son las participaciones de un FIC?", "o": ["Los derechos de los inversionistas sobre el fondo, expresados en unidades", "Acciones de la sociedad administradora", "Bonos emitidos por el custodio", "Depósitos bancarios"], "e": "Cada inversionista tiene participaciones (unidades) proporcionales a su aporte."}, {"q": "La administradora de un FIC debe abstenerse de:", "o": ["Dar preferencia a unos inversionistas sobre otros en condiciones iguales", "Valorar el portafolio diariamente", "Publicar la ficha técnica", "Rendir cuentas"], "e": "El trato igualitario a inversionistas del mismo tipo de participación es un deber de la administradora."}, {"q": "¿Qué FIC tiene como característica que el inversionista no puede redimir antes del final del plazo, pero puede vender sus participaciones a otro inversionista si están inscritas?", "o": ["El FIC cerrado", "El FIC abierto", "El FIC del mercado monetario", "El FIC con pacto de permanencia de 1 día"], "e": "La liquidez del FIC cerrado viene del mercado secundario de sus participaciones, si existe."}, {"q": "Los FIC son vigilados por la Superintendencia Financiera a través de:", "o": ["La supervisión de sus sociedades administradoras", "AMV únicamente", "El Banco de la República", "La DIAN"], "e": "La SFC supervisa a las sociedades administradoras y, por medio de ellas, el funcionamiento de los fondos."}, {"q": "¿Qué es la política de riesgos de un FIC?", "o": ["El conjunto de reglas para identificar, medir y controlar los riesgos de mercado, crédito, liquidez y operacionales del fondo", "La lista de inversionistas", "El cálculo de la comisión", "El plazo de redención"], "e": "La administradora debe gestionar los riesgos del fondo con políticas y límites."}, {"q": "En un FIC abierto, la administradora debe mantener recursos líquidos para:", "o": ["Atender las redenciones esperadas de los inversionistas", "Pagar sus propios gastos", "Prestar a otros fondos", "Pagar dividendos a sus accionistas"], "e": "La gestión de liquidez del fondo asegura que pueda pagar los retiros sin vender activos con pérdidas grandes."}, {"q": "¿Qué es la rentabilidad bruta de un FIC?", "o": ["La rentabilidad del portafolio antes de descontar la comisión de administración", "La rentabilidad después de comisiones", "La rentabilidad garantizada", "El valor de la unidad"], "e": "La rentabilidad neta, que recibe el inversionista, es la bruta menos comisiones y gastos."}, {"q": "Un FIC tiene una rentabilidad bruta de 9 % y cobra una comisión de 1,5 %. ¿Cuál es la rentabilidad neta aproximada?", "o": ["7,5 %", "10,5 %", "9 %", "1,5 %"], "e": "Rentabilidad neta ≈ 9 % − 1,5 % = 7,5 %. Es una aproximación, porque la comisión se causa diariamente."}, {"q": "Según el Decreto 2555 de 2010, ¿qué entidades pueden administrar FIC en Colombia?", "o": ["Sociedades fiduciarias, sociedades comisionistas de bolsa y sociedades administradoras de inversión", "Solo los bancos", "Las administradoras de fondos de pensiones y las aseguradoras", "Cualquier sociedad anónima inscrita en la Cámara de Comercio"], "e": "Solo estas tres clases de entidades vigiladas por la SFC pueden ser sociedades administradoras de FIC. Las mismas tres pueden actuar como gestores externos."}, {"q": "La característica de los FIC según la cual sus activos son un patrimonio independiente de los de la sociedad administradora se denomina:", "o": ["Segregación", "Diversificación", "Apalancamiento", "Bursatilidad"], "e": "Por la segregación, los activos del FIC no forman parte del patrimonio de la administradora ni de otros negocios que esta administre."}, {"q": "¿Cuál es el patrimonio mínimo de un FIC?", "o": ["El equivalente a 39.500 UVT, hoy expresado en UVB", "1.000 SMMLV", "COP 100 millones", "No existe patrimonio mínimo"], "e": "El FIC debe tener un patrimonio mínimo equivalente a 39.500 UVT. Desde 2024 los requisitos financieros expresados en UVT se convierten a UVB (Ley 2294 de 2023)."}, {"q": "¿De cuánto tiempo dispone la sociedad administradora para que un FIC alcance el patrimonio mínimo?", "o": ["Un año desde su entrada en operación, prorrogable una vez hasta por seis meses con aprobación de la SFC", "Seis meses, sin prórroga", "Tres años", "Debe tenerlo desde el primer día"], "e": "La norma da un año desde que el FIC entra en operación, con una única prórroga de hasta seis meses previa aprobación de la SFC."}, {"q": "Si el reglamento de un FIC no dice si es abierto o cerrado, se entiende que es:", "o": ["Abierto", "Cerrado", "De capital privado", "Bursátil"], "e": "Por regla general los FIC son abiertos, salvo que el reglamento disponga otra cosa."}, {"q": "En un FIC cerrado, ¿cuál es el máximo de participación que puede tener un solo inversionista?", "o": ["60 % del valor patrimonial", "10 %", "15 %", "100 %"], "e": "En los cerrados el límite por inversionista es 60 %. En los abiertos es 10 %. Ninguno aplica durante el primer año de operación."}, {"q": "Los límites de concentración por inversionista en un FIC no aplican:", "o": ["Durante el primer año de operación del fondo", "Si el inversionista es extranjero", "Si el inversionista es una persona natural", "Nunca: aplican desde el primer día"], "e": "La norma excluye el primer año de operación del FIC para dar tiempo a vincular inversionistas."}, {"q": "¿Qué pasa si, después del primer año, un FIC no cumple los límites de participación por inversionista?", "o": ["Es causal de liquidación, que puede enervarse (corregirse) en máximo dos meses", "Nada, es solo una recomendación", "La SFC lo convierte en FIC cerrado", "El inversionista pierde sus participaciones excedentes"], "e": "El incumplimiento de los límites por inversionista es causal de liquidación, aunque la administradora tiene hasta dos meses para corregirlo."}, {"q": "En un FIC abierto, los aportes de los inversionistas:", "o": ["Deben ser en dinero; no se aceptan aportes en especie", "Pueden ser en dinero o en inmuebles", "Deben ser en acciones", "Pueden hacerse mediante promesas de pago futuras"], "e": "Los abiertos solo reciben dinero. Los cerrados pueden aceptar aportes en especie y compromisos de suscripción si el reglamento lo permite."}, {"q": "Los derechos de participación de un FIC abierto:", "o": ["No son títulos valores, ni valores, ni son negociables", "Son valores inscritos en el RNVE", "Son títulos valores al portador", "Se negocian en la BVC"], "e": "En los abiertos los aportes se representan en derechos de participación que no son valores ni negociables. En los cerrados sí tienen calidad de valores y pueden inscribirse en el RNVE."}, {"q": "En un FIC abierto con pacto de permanencia, las penalidades por redención anticipada:", "o": ["Son ingresos para el propio FIC", "Son ingresos de la sociedad administradora", "Se pagan a la SFC", "Se reparten entre el gestor y el distribuidor"], "e": "Las penalidades benefician al fondo, es decir, a los inversionistas que permanecen."}, {"q": "En un FIC cerrado, el plazo mínimo de permanencia que puede fijarse para redenciones parciales es de:", "o": ["30 días comunes", "1 día hábil", "1 año", "5 años"], "e": "Los cerrados pueden fijar en el reglamento plazos mínimos de 30 días comunes para redenciones."}, {"q": "Los FIC del mercado monetario son:", "o": ["FIC abiertos sin pacto de permanencia", "FIC cerrados", "FIC con permanencia mínima de un año", "Fondos bursátiles"], "e": "Los fondos del mercado monetario son abiertos y sin pacto de permanencia. Pagan redenciones al día hábil siguiente a la solicitud."}, {"q": "¿En qué pueden invertir los FIC del mercado monetario?", "o": ["Valores en moneda nacional inscritos en el RNVE con calificación mínima de grado de inversión, o deuda pública de la Nación, BanRep o Fogafín", "Acciones de alta bursatilidad", "Inmuebles y proyectos inmobiliarios", "Empresas no listadas"], "e": "Invierten en renta fija local de alta calidad y en deuda pública, con plazo promedio ponderado de vencimiento de máximo 365 días."}, {"q": "¿Cuál es el plazo máximo promedio ponderado de vencimiento de los valores de un FIC del mercado monetario?", "o": ["365 días", "90 días", "5 años", "No tiene límite"], "e": "El vencimiento promedio ponderado de su portafolio no puede superar 365 días, lo que limita el riesgo de tasa."}, {"q": "Las redenciones en un FIC del mercado monetario se pagan:", "o": ["Al día hábil siguiente a la solicitud", "Al final del plazo del fondo", "A los 30 días comunes", "Después de un año"], "e": "Por ser abiertos sin pacto, atienden las redenciones al día hábil siguiente."}, {"q": "Un fondo de capital privado (FCP) cuya política se enfoca en los activos admisibles de los FIC inmobiliarios puede destinar a ellos:", "o": ["Hasta el 100 % de los aportes", "Máximo dos terceras partes", "Máximo el 50 %", "Máximo el 10 %"], "e": "La regla general es invertir al menos 2/3 en activos distintos de valores inscritos en el RNVE, pero el FCP inmobiliario puede llegar al 100 %."}, {"q": "Un FIC inmobiliario (FICI) debe tener una concentración mínima en activos inmobiliarios de:", "o": ["75 % de los activos totales", "2/3 de los aportes", "50 %", "100 %"], "e": "Los FICI invierten como mínimo el 75 % de sus activos en inmuebles, titularizaciones inmobiliarias, derechos fiduciarios sobre inmuebles, proyectos o participaciones en fondos inmobiliarios."}, {"q": "En un FIC inmobiliario, la permanencia mínima del aportante es de:", "o": ["Un año", "30 días", "Un día hábil", "Cinco años"], "e": "El inversionista de un FICI debe tener una permanencia mínima de un año."}, {"q": "¿Hasta qué monto puede endeudarse un FIC inmobiliario?", "o": ["Hasta dos veces su valor patrimonial, con garantía de los inmuebles adquiridos", "No puede endeudarse", "Hasta el 10 % del patrimonio", "Sin límite"], "e": "Para el FICI, la administradora puede obtener créditos por hasta 2 veces el valor patrimonial del fondo, garantizados con los inmuebles."}, {"q": "Después de sus primeros seis meses, ¿cuántos inversionistas como mínimo debe tener un FIC inmobiliario?", "o": ["Dos", "Cien", "Uno", "Diez"], "e": "Los FCP y los FICI deben tener al menos dos inversionistas; en el FICI esto aplica después de los primeros seis meses."}, {"q": "¿Qué FIC puede emitir bonos mediante oferta pública, con autorización de la SFC y sin que su plazo supere la duración del fondo?", "o": ["El fondo de capital privado", "El FIC del mercado monetario", "El fondo bursátil", "Cualquier FIC abierto"], "e": "Los FCP pueden emitir bonos inscritos en el RNVE con autorización de la SFC. La junta directiva de la administradora autoriza las emisiones."}, {"q": "¿Cuál de las siguientes afirmaciones sobre los fondos bursátiles (ETF) en Colombia es correcta?", "o": ["No se clasifican como abiertos ni cerrados, y su administradora no está obligada a generar fichas técnicas ni extractos", "Son FIC cerrados con permanencia de un año", "Invierten solo en empresas no listadas", "No pueden usar derivados"], "e": "Los fondos bursátiles replican o siguen un índice, cotizan en tiempo real y pueden usar derivados estandarizados sobre activos del índice."}, {"q": "Un fondo bursátil puede replicar un índice mediante:", "o": ["Algunos o todos los activos de la canasta del índice, o derivados estandarizados sobre ellos", "Solo inmuebles", "Créditos a empresas no listadas", "Depósitos a la vista exclusivamente"], "e": "El ETF sigue un índice nacional o internacional (accionario, de renta fija o de materias primas) con los activos de la canasta o con derivados estandarizados."}, {"q": "¿Necesita un fondo de capital privado autorización previa de la SFC para constituirse?", "o": ["No; basta con enviar previamente la documentación, el reglamento y el perfil del gestor profesional", "Sí, siempre", "Solo si tiene más de 100 inversionistas", "Solo si invierte en el exterior"], "e": "A diferencia de otros FIC, el FCP no requiere autorización previa. Se envían los documentos antes de iniciar."}, {"q": "Un cliente inversionista (no profesional) puede invertir o comprometerse a invertir en un FCP como máximo:", "o": ["El 20 % de sus ingresos anuales o de su patrimonio, el que sea mayor", "El 50 % de su patrimonio", "Lo que quiera, sin límite", "El 10 % de sus ingresos mensuales"], "e": "La norma protege al cliente inversionista limitando su exposición a estos vehículos ilíquidos y complejos."}, {"q": "Un fondo de capital privado de 'capital emprendedor' invierte principalmente en:", "o": ["Empresas en etapa temprana, en su mayoría de base tecnológica", "Proyectos de carreteras y puertos", "Reforestación y ganadería", "TES de corto plazo"], "e": "Las tipologías de FCP incluyen adquisición y crecimiento, capital emprendedor, impacto, inmobiliario, infraestructura y recursos naturales."}, {"q": "Los fondos de inversión del exterior que se ofrecen en Colombia:", "o": ["Operan en otra jurisdicción bajo un supervisor con convenio de intercambio de información con la SFC, que sigue supervisándolos", "Pasan a ser supervisados por la SFC", "No pueden ofrecerse en Colombia", "Deben ser FIC cerrados colombianos"], "e": "La supervisión del fondo del exterior y su administrador sigue a cargo de la autoridad de su jurisdicción de origen."}, {"q": "Para crear una familia de FIC se requiere:", "o": ["Autorización previa de la SFC para la familia y su primer fondo; los siguientes solo se informan dentro de los 5 días siguientes a su entrada en funcionamiento", "Autorización previa de la SFC para cada fondo de la familia", "Solo aprobación de la asamblea de inversionistas", "Ninguna autorización"], "e": "Una vez autorizada la familia y su primer FIC, los demás fondos se informan a la SFC dentro de los cinco días siguientes."}, {"q": "¿Cuál de las siguientes afirmaciones sobre las familias de FIC es correcta?", "o": ["Una familia de FIC no puede estar formada por otras familias, y cada fondo es un patrimonio separado de los demás", "Los fondos de una familia comparten un mismo patrimonio", "Una familia puede contener otras familias", "Solo pueden tener FIC del mercado monetario"], "e": "Cada FIC de la familia mantiene su patrimonio independiente. Las familias pueden incluir fondos de renta fija o acciones inscritas sin apalancamiento, ETF sobre índices reconocidos o FICI."}, {"q": "Según la guía, el valor de la unidad de un FIC se calcula como:", "o": ["(Activos − pasivos) / número de unidades", "Activos / número de inversionistas", "Pasivos / unidades", "Aportes − retiros"], "e": "V = (A − P) / N. El valor patrimonial aumenta con rendimientos, aportes e ingresos, y disminuye con retiros y gastos."}, {"q": "El patrimonio de un FIC puede variar por:", "o": ["Entradas y salidas de inversionistas, y cambios en el valor de mercado de sus activos", "Solo por cambios en la comisión", "Solo por decisiones de la SFC", "Solo por el pago de dividendos de la administradora"], "e": "El número de unidades cambia con aportes y redenciones, y el valor de la unidad con la valoración del portafolio."}, {"q": "Las participaciones diferenciales de un FIC permiten:", "o": ["Dar a distintos tipos de inversionistas condiciones diferentes (como la comisión o las reglas de aportes y redenciones), cada una con su propio valor de unidad", "Que un inversionista tenga más votos que su participación", "Garantizar rentabilidad a algunos inversionistas", "Excluir a inversionistas pequeños de la asamblea"], "e": "Se crean bajo un mismo reglamento y plan de inversiones, respetando el trato equitativo entre inversionistas en las mismas condiciones objetivas."}, {"q": "¿Cuáles son los órganos de administración de un FIC según el Decreto 2555 de 2010?", "o": ["Junta directiva, gerente, comité de inversiones, revisor fiscal y asamblea de inversionistas", "Solo la asamblea de inversionistas", "Consejo directivo, defensor del consumidor y custodio", "Gerente y SFC"], "e": "Estos cinco órganos están previstos para la administración y control del FIC."}, {"q": "¿Quién nombra al gerente de un FIC y a su suplente?", "o": ["La junta directiva de la sociedad administradora (o del gestor externo o extranjero, según el caso)", "La asamblea de inversionistas", "La Superintendencia Financiera", "El revisor fiscal"], "e": "La junta directiva nombra al gerente y su suplente. También designa al custodio y fija las políticas de valoración y de conflictos de interés."}, {"q": "¿Cuál de las siguientes es una función de la junta directiva de la sociedad administradora de FIC?", "o": ["Designar a la entidad que prestará la custodia de valores", "Decretar la liquidación del FIC", "Ejecutar a diario las operaciones del portafolio", "Votar en la asamblea de inversionistas"], "e": "La junta define políticas, designa al custodio, nombra al gerente, fija los procedimientos de valoración y conflictos de interés y autoriza emisiones de bonos. Liquidar el FIC por decisión de los inversionistas corresponde a la asamblea."}, {"q": "El gerente de un FIC debe ser:", "o": ["Una persona natural de dedicación exclusiva, inscrita en el RNPMV", "Una persona jurídica", "Un miembro de la junta directiva", "El revisor fiscal"], "e": "El gerente ejecuta la gestión del portafolio como experto prudente y diligente. Él y su suplente deben estar inscritos en el RNPMV."}, {"q": "¿Puede una misma persona ser gerente de varios FIC?", "o": ["Sí, de varios FIC de la misma administradora o gestor, incluso de varias familias", "No, cada FIC necesita un gerente distinto", "Solo si los FIC son cerrados", "Solo con autorización de la asamblea"], "e": "La norma permite que una persona gerencie varios fondos. El suplente actúa solo en ausencias temporales o absolutas del principal."}, {"q": "Los miembros del comité de inversiones de un FIC se consideran:", "o": ["Administradores, según el artículo 22 de la Ley 222 de 1995", "Inversionistas del fondo", "Empleados de la SFC", "Asesores sin responsabilidad"], "e": "Por ser administradores, tienen deberes de diligencia y lealtad y responden por sus actuaciones."}, {"q": "Cuando no hay gestor externo, ¿quién elige a los miembros del comité de inversiones?", "o": ["La junta directiva de la sociedad administradora", "La asamblea de inversionistas", "El gerente del FIC", "El custodio"], "e": "La junta los elige, les fija lineamientos y les hace seguimiento."}, {"q": "¿Cuál es el quórum deliberatorio de la asamblea de inversionistas de un FIC?", "o": ["Inversionistas que representen como mínimo el 51 % de las participaciones", "El 25 % de las participaciones", "La totalidad de los inversionistas", "Cualquier número de inversionistas"], "e": "La asamblea delibera con un número plural de inversionistas que tenga al menos el 51 % de las participaciones."}, {"q": "Las decisiones de la asamblea de inversionistas de un FIC se toman, salvo mayoría superior en el reglamento, con:", "o": ["La mitad más una de las participaciones presentes; el reglamento puede exigir más, pero no por encima del 70 %", "Unanimidad", "Dos terceras partes de todas las participaciones", "El voto de la sociedad administradora"], "e": "Cada participación da un voto. La mayoría puede elevarse en el reglamento, sin superar el 70 % de las participaciones presentes."}, {"q": "Si la sociedad administradora tiene participaciones en el FIC que administra:", "o": ["No cuentan para el quórum ni le dan derecho a voto en la asamblea", "Tiene voto doble", "Decide sola las votaciones", "Puede vetar las decisiones"], "e": "Se excluye su participación para evitar conflictos de interés."}, {"q": "¿Cuál de las siguientes es una función de la asamblea de inversionistas de un FIC?", "o": ["Aprobar o improbar el proyecto de fusión del FIC", "Nombrar al gerente del FIC", "Designar al custodio", "Aprobar el manual SARLAFT"], "e": "La asamblea puede designar un auditor externo, entregar la administración a otra sociedad, decretar la liquidación y nombrar liquidador, aprobar la fusión y pedir la remoción del gestor externo."}, {"q": "Como alternativa a la reunión de la asamblea de inversionistas, el reglamento de un FIC puede prever:", "o": ["Una consulta universal escrita a todos los inversionistas", "Una decisión directa de la SFC", "Una votación solo de la junta directiva", "Una encuesta telefónica a una muestra"], "e": "La consulta universal es un mecanismo escrito que sigue el procedimiento del Decreto 2555."}, {"q": "¿Quién ejerce la revisoría fiscal de un FIC?", "o": ["El revisor fiscal de la sociedad administradora, del gestor externo o del distribuidor especializado, con informes separados para el fondo", "Un funcionario de la SFC", "El gerente del FIC", "La asamblea de inversionistas"], "e": "Los informes sobre el FIC se presentan de forma independiente de los de la sociedad. El FIC puede contratar además un auditor externo con cargo a sus recursos."}, {"q": "Desde junio de 2021 (Circular Externa 006 de 2021), las participaciones de FIC cerrados y FCP inscritas en el RNVE se valoran:", "o": ["Con metodologías de los proveedores de precios que incorporan señales del mercado secundario", "Solo al valor de la unidad", "Al costo de adquisición", "Una vez al año"], "e": "Antes se usaba el valor de la unidad. Ahora el proveedor de precios incorpora las negociaciones, y usa el valor de la unidad solo si no hay información suficiente."}, {"q": "Las instrucciones de valoración del portafolio de los FIC están en:", "o": ["La Circular Básica Contable y Financiera de la SFC", "El Código de Comercio", "La Ley 964 de 2005 únicamente", "El reglamento de AMV"], "e": "La valoración diaria sigue la metodología de la SFC (Circular Básica Contable y Financiera)."}, {"q": "¿Cuál de las siguientes conductas está prohibida a la sociedad administradora de un FIC?", "o": ["Aceptar las participaciones del FIC como garantía de créditos que ella misma haya concedido a sus inversionistas", "Valorar diariamente el portafolio", "Contratar un custodio", "Cobrar la comisión prevista en el reglamento"], "e": "También le está prohibido prestar dinero del FIC (salvo repos, simultáneas y TTV activas), actuar como contraparte del fondo y usar recursos del FIC para dar liquidez a la administradora o a su grupo."}, {"q": "¿Puede el FIC conceder préstamos con sus recursos?", "o": ["No, salvo operaciones de reporto, simultáneas o transferencia temporal de valores activas", "Sí, a cualquier inversionista", "Sí, a la sociedad administradora", "Sí, si el gerente lo aprueba"], "e": "Los préstamos están prohibidos. Solo se permiten las operaciones activas del mercado monetario."}, {"q": "¿Puede un FIC invertir en valores cuyo emisor o garante sea su propia sociedad administradora?", "o": ["No, está prohibido", "Sí, sin límite", "Sí, hasta el 30 %", "Sí, si es un FIC cerrado"], "e": "Está prohibido invertir en valores emitidos, avalados o garantizados por la administradora o el gestor externo. Otra cosa son los valores de la matriz o subordinadas, que tienen límites."}, {"q": "Un FIC (distinto de un fondo bursátil) puede invertir en valores emitidos por la matriz o subordinadas de su administradora hasta:", "o": ["10 % de sus activos, o hasta 30 % si lo autoriza la asamblea de inversionistas, y solo a través de sistemas de negociación", "Sin límite", "50 % de sus activos", "Está totalmente prohibido"], "e": "Es una situación de conflicto de interés que se administra con límites y transparencia."}, {"q": "¿Cuál es el máximo de participaciones que la propia sociedad administradora puede suscribir en un FIC que administra?", "o": ["15 % del valor del fondo al momento de invertir", "10 %", "60 %", "No puede invertir"], "e": "Debe estar previsto en el reglamento y el prospecto. Además debe mantener esas participaciones mínimo un año (o la mitad de la duración si el FIC dura menos de un año)."}, {"q": "Los depósitos de un FIC en cuentas de ahorro o corrientes de la matriz o subordinadas de su administradora no pueden superar:", "o": ["10 % de los activos del FIC (30 % durante los primeros seis meses)", "50 %", "1 %", "No hay límite"], "e": "Es otro conflicto de interés regulado con límites."}, {"q": "Un FIC de un único emisor debe invertir en los valores de ese emisor como mínimo:", "o": ["80 % de sus activos, y el resto en fondos del mercado monetario o depósitos a la vista", "50 %", "100 %", "2/3"], "e": "La administradora puede crear FIC con valores de un único emisor, con ese mínimo de concentración."}, {"q": "En un FIC que emite bonos, la sociedad administradora, su matriz y subordinadas pueden suscribir como máximo:", "o": ["10 % del monto total de la emisión", "50 %", "100 %", "Nada"], "e": "Se limita la participación del grupo de la administradora en los bonos del FIC."}, {"q": "Cuando varios FIC de una misma administradora dan órdenes sobre el mismo valor, la administradora debe:", "o": ["Distribuir la inversión sin favorecer a ningún fondo, según su código de gobierno corporativo", "Dar prioridad al fondo más grande", "Asignar todo al fondo con mayor comisión", "Rechazar todas las órdenes"], "e": "Es una situación generadora de conflicto de interés que se administra con reglas de asignación equitativa."}, {"q": "¿Qué requisito NO forma parte del procedimiento de fusión de FIC?", "o": ["Autorización de AMV", "Proyecto de fusión con datos financieros y relación de intercambio", "Aprobación de la junta directiva de la administradora", "Publicación del resumen en un diario de amplia circulación"], "e": "El procedimiento incluye proyecto, aprobación de la junta, publicación, convocatoria a la asamblea y comunicación a la SFC. Si los fondos tienen administradoras distintas, la fusión requiere autorización de la SFC."}, {"q": "En una fusión de FIC, los inversionistas que no estén de acuerdo o no asistan a la asamblea:", "o": ["Pueden pedir la redención de sus participaciones dentro del mes siguiente a la asamblea", "Quedan obligados a la fusión", "Pierden sus participaciones", "Deben esperar al vencimiento del fondo"], "e": "Tienen derecho de retiro, con un plazo de un mes contado desde la asamblea."}, {"q": "La convocatoria a la asamblea que decide una fusión de FIC se realiza:", "o": ["Por escrito con el compromiso de fusión, y la asamblea se celebra pasados 15 días hábiles del envío", "Por teléfono el mismo día", "Solo en la página web, con 2 días de antelación", "No se requiere asamblea"], "e": "La comunicación escrita va acompañada del compromiso de fusión y la asamblea se celebra pasados 15 días hábiles."}, {"q": "¿Cuál de las siguientes es una causal de liquidación de un FIC?", "o": ["Que su patrimonio quede por debajo del mínimo exigido", "Que su rentabilidad sea negativa un mes", "Que cambie el gerente", "Que la SFC publique la ficha técnica"], "e": "Otras causales: vencimiento del plazo, decisión de la asamblea, decisión motivada de la junta directiva, imposibilidad de la administradora, toma de posesión, e incumplir los límites por inversionista tras el primer año."}, {"q": "Cuando ocurre una causal de liquidación de un FIC, la administradora debe informar a la SFC, a las bolsas y a los inversionistas:", "o": ["A más tardar al día siguiente de la ocurrencia de la causal", "Dentro del mes siguiente", "Al final del año", "Solo si la asamblea lo pide"], "e": "La comunicación debe ser inmediata, a más tardar el día siguiente."}, {"q": "Desde que ocurre una causal de liquidación de un FIC y mientras subsista:", "o": ["No se pueden constituir nuevas participaciones ni atender redenciones", "Se siguen recibiendo aportes normalmente", "Se duplican las redenciones", "Se suspende la valoración"], "e": "Es el primer paso del proceso: se congelan las suscripciones y redenciones, y se suspende la negociación de los valores emitidos por el FIC."}, {"q": "Si la asamblea de inversionistas no designa un liquidador especial para el FIC:", "o": ["La liquidación la adelanta la sociedad administradora", "La SFC nombra al liquidador", "El FIC no se liquida", "El custodio liquida el fondo"], "e": "En ausencia de liquidador especial, se entiende que la administradora lleva a cabo la liquidación."}, {"q": "¿Cuál es el plazo máximo inicial para que el liquidador venda las inversiones de un FIC?", "o": ["El que diga el reglamento, sin superar un año", "Seis meses", "Cinco años", "No hay plazo"], "e": "Si vencido el plazo quedan activos sin realizar, la asamblea se reúne dentro de los cuatro meses siguientes y puede dar más plazo o pedir la entrega de los activos en pago."}, {"q": "Una vez liquidadas todas las inversiones del FIC, el pago a los inversionistas debe hacerse en un máximo de:", "o": ["15 días hábiles", "1 día hábil", "6 meses", "1 año"], "e": "Las participaciones se cancelan en máximo 15 días hábiles tras el vencimiento del plazo de liquidación."}, {"q": "Si un gasto no está relacionado en el reglamento del FIC:", "o": ["Lo asume la sociedad administradora", "Lo asume el FIC de todos modos", "Lo paga el custodio", "Lo paga la SFC"], "e": "Todos los gastos del FIC deben estar relacionados de forma detallada en el reglamento; los no previstos corren por cuenta de la administradora."}, {"q": "¿Cuál de los siguientes es un gasto que puede cargarse al FIC si el reglamento lo prevé?", "o": ["Los honorarios de la revisoría fiscal del FIC", "Los salarios de la junta directiva de la administradora", "La publicidad institucional de la administradora", "Las multas impuestas a la administradora"], "e": "Gastos atribuibles: depósito y custodia, remuneración de la administradora y el gestor, defensa del fondo, seguros, gastos bancarios, asambleas, tributos del FIC, inscripciones, revisoría, comisiones de operación, intereses de operaciones pasivas, calificación y coberturas."}, {"q": "En un FIC con participaciones diferenciales, los gastos que no correspondan a un tipo específico de participación:", "o": ["Se asumen a prorrata por todos los inversionistas", "Los paga solo la participación más grande", "Los asume la administradora", "Los paga el último inversionista que ingresó"], "e": "Los gastos comunes se reparten proporcionalmente entre todos los inversionistas."}, {"q": "¿Cuál de los siguientes NO forma parte del contenido de la política de inversión de un FIC?", "o": ["La hoja de vida de cada inversionista", "El plan de inversiones", "El perfil de riesgo del FIC", "La política sobre depósitos en cuentas corrientes o de ahorro"], "e": "La política de inversión incluye el plan de inversiones, las operaciones del mercado monetario, los depósitos, el perfil de riesgo y la gestión de riesgos."}, {"q": "La administración de un FIC comprende tres actividades:", "o": ["Gestión, distribución y custodia", "Captación, colocación y crédito", "Valoración, publicidad y auditoría", "Compra, venta y liquidación"], "e": "La gestión y la distribución pueden contratarse con terceros. La custodia debe contratarse con una sociedad fiduciaria autorizada."}, {"q": "¿Hasta qué grado de culpa responde la sociedad administradora de un FIC?", "o": ["Culpa leve", "Culpa grave", "Culpa levísima", "Solo dolo"], "e": "Responde por culpa leve: debe emplear la diligencia que las personas usan ordinariamente en sus propios negocios."}, {"q": "¿Cuál de las siguientes es una obligación de la sociedad administradora de un FIC?", "o": ["Llevar por separado la contabilidad de cada FIC", "Garantizar la rentabilidad mínima", "Consolidar los FIC con su propio balance", "Escoger intermediarios sin criterios definidos"], "e": "Otras obligaciones: actuar solo en interés de los inversionistas, gestionar riesgos, valorar el portafolio, ejercer los derechos de los activos, no discriminar inversionistas y reportar a la SFC y a AMV."}, {"q": "La gestión del portafolio de un FIC comprende:", "o": ["Tomar las decisiones de inversión y desinversión, e identificar, medir, controlar y gestionar los riesgos del portafolio", "Solo la promoción del fondo", "Solo la custodia de los valores", "La atención de quejas de los inversionistas"], "e": "Puede hacerla la propia administradora o un gestor externo, incluso del exterior."}, {"q": "¿Con qué frecuencia mínima debe el gestor externo presentar informes a la sociedad administradora?", "o": ["Una vez al mes", "Una vez al año", "Cada semestre", "Solo al liquidar el FIC"], "e": "El gestor externo informa al menos mensualmente sobre la gestión y sus resultados."}, {"q": "Un gestor extranjero de un FIC debe ser:", "o": ["Una persona jurídica constituida fuera de Colombia que gestione portafolios de terceros según su regulación", "Una persona natural colombiana", "Una sociedad fiduciaria colombiana", "Un banco central extranjero"], "e": "Debe ser experto en el tipo de portafolio y cumplir los requisitos de experiencia, idoneidad y solvencia moral del reglamento."}, {"q": "La actividad de distribución de FIC puede ser realizada por:", "o": ["La sociedad administradora o un distribuidor especializado mediante cuentas ómnibus", "Cualquier persona natural sin vínculo", "La Superintendencia Financiera", "El custodio de valores"], "e": "Los distribuidores especializados pueden ser otra sociedad administradora de FIC o un establecimiento bancario."}, {"q": "¿Por cuál de los siguientes medios NO se pueden distribuir FIC según el Decreto 2555?", "o": ["Por medio de un intermediario no vigilado sin contrato", "Fuerza de ventas de la administradora o del distribuidor", "Contrato de uso de red", "Contrato de corresponsalía"], "e": "Los medios previstos son la fuerza de ventas, el contrato de uso de red y el contrato de corresponsalía."}, {"q": "La información 'necesaria y suficiente' que debe recibir un potencial inversionista de un FIC incluye:", "o": ["La estructura y características del FIC, precios y comparación de beneficios y riesgos, y sus riesgos inherentes", "Solo la rentabilidad del último mes", "Un pronóstico de rentabilidad", "Los datos de otros inversionistas"], "e": "Con esa información el inversionista puede decidir de forma informada."}, {"q": "Si un promotor de la fuerza de ventas de un FIC comete un error al vincular a un cliente:", "o": ["Compromete la responsabilidad de la sociedad administradora o del distribuidor especializado", "Solo responde el promotor", "No hay responsabilidad", "Responde la SFC"], "e": "Los errores, omisiones o infracciones de la fuerza de ventas comprometen a la entidad para la que actúa."}, {"q": "¿Cuál de las siguientes es una obligación de los promotores de FIC?", "o": ["Verificar que el inversionista conozca, entienda y acepte el reglamento y el prospecto", "Garantizar una rentabilidad", "Recibir dinero en efectivo a su nombre", "Hacer pronósticos sobre el fondo"], "e": "También deben identificarse como promotores de la entidad, entregar la información, no hacer afirmaciones engañosas y remitir órdenes oportunamente."}, {"q": "¿Cuál de las siguientes prácticas está prohibida en la publicidad de un FIC?", "o": ["Hacer pronósticos sobre el comportamiento futuro del fondo", "Indicar que la administradora es vigilada por la SFC", "Expresar la información financiera en tasas efectivas anuales", "Incluir el nombre del gestor externo"], "e": "Está prohibido asegurar rendimientos, hacer pronósticos, presentar como definitivas situaciones transitorias, atribuir características que no son propias del FIC y divulgar calificaciones incompletas."}, {"q": "La información financiera en la publicidad de un FIC debe presentarse, cuando aplique, en:", "o": ["Tasas efectivas anuales", "Tasas nominales mensuales", "Pesos constantes", "Dólares"], "e": "La información promocional debe ser veraz, verificable, actualizada, exacta, entendible y completa, y presentar rentabilidades en tasa efectiva anual."}, {"q": "¿Cuáles son los cinco mecanismos de revelación de información de un FIC?", "o": ["Reglamento, prospecto, ficha técnica, extracto de cuenta e informe de rendición de cuentas", "Balance, estado de resultados, flujo de caja, notas y dictamen", "Página web, redes sociales, prensa, radio y televisión", "Contrato, pagaré, factura, recibo y certificado"], "e": "Son los medios por los que la administradora mantiene informados a los inversionistas."}, {"q": "Las cláusulas del reglamento de un FIC que limitan los derechos de los inversionistas deben presentarse:", "o": ["De forma resaltada y en letra fácilmente legible", "En un anexo confidencial", "Solo en inglés", "En letra pequeña al final"], "e": "La información debe ser sencilla, comprensible y las limitaciones deben destacarse."}, {"q": "El reglamento marco de una familia de FIC debe contener como mínimo:", "o": ["Un plan estratégico de la familia, con el plan de negocio, los tipos de subyacentes y el término estimado", "La lista de inversionistas", "La rentabilidad garantizada", "Los estados financieros de la matriz"], "e": "El reglamento marco describe el plan general de negocio para la familia de fondos."}, {"q": "¿Cuándo debe darse a conocer el prospecto de un FIC?", "o": ["Antes de la vinculación del inversionista, dejando constancia de su aceptación y entendimiento", "Después del primer aporte", "Solo si el inversionista lo pide", "Al liquidar el fondo"], "e": "El prospecto es imprescindible para comercializar el FIC y debe ser coherente con el reglamento."}, {"q": "La ficha técnica de un FIC se actualiza y publica:", "o": ["Mensualmente, dentro de los 5 días hábiles siguientes al cierre del mes", "Anualmente", "Diariamente", "Cada semestre"], "e": "Contiene, entre otros, valor del fondo, número de inversionistas, calificaciones, política de inversión, permanencia, comisiones, rentabilidad, volatilidad, composición, custodio, hoja de vida del gerente y contactos del revisor fiscal y del defensor del consumidor."}, {"q": "¿Cuál de los siguientes datos NO aparece en la ficha técnica de un FIC?", "o": ["El nombre de cada inversionista", "La volatilidad del FIC", "La hoja de vida del gerente", "Las comisiones de administración"], "e": "La ficha técnica no revela datos individuales de inversionistas, solo su número."}, {"q": "El informe de rendición de cuentas de un FIC debe enviarse en un plazo máximo de:", "o": ["15 días comunes contados desde la fecha del corte", "5 días hábiles", "3 meses", "1 año"], "e": "Se presenta mínimo cada seis meses (cortes a 30 de junio y 31 de diciembre) e incluye el balance general y el estado de resultados del fondo."}, {"q": "¿Cuál de las siguientes es una ventaja de invertir a través de un FIC?", "o": ["Acceder con montos bajos a mercados normalmente reservados para grandes inversionistas", "Garantía de rentabilidad", "Ausencia total de riesgo", "Exención de comisiones"], "e": "Otras ventajas: diversificación, liquidez (en abiertos), administración profesional, variedad de oferta, supervisión de la SFC y AMV, y comodidad."}, {"q": "Según la Circular Básica Jurídica, ¿cuáles son las etapas de la actividad de asesoría?", "o": ["Perfil del inversionista, perfil del producto, análisis de conveniencia, recomendación profesional, entrega de información y distribución", "Captación, colocación, cobro y liquidación", "Apertura, compra, venta y cierre", "Publicidad, promoción, venta y posventa"], "e": "La asesoría la prestan solo entidades vigiladas por la SFC, a partir del perfil del cliente y del producto."}, {"q": "Un FIC clasificado como producto simple y universal:", "o": ["Puede distribuirse sin perfilar al cliente, sin análisis de conveniencia y sin recomendación profesional", "Requiere siempre recomendación profesional", "Solo puede venderse a inversionistas profesionales", "Es un producto complejo"], "e": "Los productos universales se consideran adecuados para cualquier inversionista, sin importar su perfil."}, {"q": "¿Cuál de los siguientes FIC se clasifica como producto complejo?", "o": ["Uno que realiza operaciones de naturaleza apalancada", "Un FIC del mercado monetario sin pacto", "Un FIC de TES sin apalancamiento", "Un FIC de acciones inscritas en el RNVE sin apalancamiento"], "e": "Son complejos los FCP, los inmobiliarios cuyas participaciones no se negocian en un sistema, los que invierten en activos no inscritos o en commodities no representados en valores, los apalancados y ciertos ETF sobre índices no reconocidos o subyacentes poco claros."}, {"q": "Un fondo bursátil (ETF) se considera producto complejo cuando:", "o": ["Replica índices no elaborados por bolsas o entidades reconocidas por la SFC, o subyacentes poco claros", "Replica el MSCI COLCAP", "Cotiza en la BVC", "Tiene más de 100 inversionistas"], "e": "El índice o el subyacente determina si el ETF es simple o complejo."}, {"q": "Durante la permanencia en un FIC, la administradora o el distribuidor debe dar recomendación profesional:", "o": ["Cuando el cliente la pida o cuando ocurra una circunstancia que afecte sustancialmente la inversión", "Todos los días", "Nunca después de la vinculación", "Solo una vez al año"], "e": "En la vinculación siempre se da recomendación (salvo universales). Después, según el reglamento, y obligatoriamente en esos dos casos."}, {"q": "La comercialización primaria de participaciones de un fondo de capital privado:", "o": ["No se considera distribución de FIC, pero exige perfilar al inversionista, entregarle el reglamento e informarle los riesgos", "Requiere siempre recomendación profesional", "Está prohibida", "Solo la puede hacer la SFC"], "e": "No aplican las normas de asesoría en la colocación primaria del FCP. En la negociación secundaria sí aplican, porque son productos complejos."}, {"q": "¿Qué entidades pueden prestar el servicio de custodia de valores en Colombia?", "o": ["Sociedades fiduciarias autorizadas por la SFC", "Cualquier comisionista de bolsa", "El Banco de la República exclusivamente", "Los bancos comerciales"], "e": "La custodia se reconoció como actividad independiente con los decretos 1243 y 1498 de 2013, y la ejercen sociedades fiduciarias autorizadas."}, {"q": "¿Cuál de los siguientes es un servicio obligatorio de la custodia de valores?", "o": ["La compensación y liquidación de operaciones", "La administración de derechos políticos", "La valoración del portafolio del FIC", "La contabilidad del FIC"], "e": "Obligatorios: salvaguarda, compensación y liquidación, y administración de derechos patrimoniales. Complementarios: derechos políticos, valoración, TTV, obligaciones fiscales y cambiarias. Especiales para FIC: valoración del portafolio y contabilidad del FIC."}, {"q": "La administración de derechos patrimoniales que hace el custodio consiste en:", "o": ["Cobrar rendimientos, dividendos y capital de los valores custodiados", "Votar en asambleas de accionistas", "Decidir qué valores comprar", "Fijar la comisión del FIC"], "e": "Los derechos patrimoniales son económicos (cobro). Los políticos (voto) son un servicio complementario que se ejerce según instrucciones."}, {"q": "¿Cuál de los siguientes NO es un principio de la actividad de custodia de valores?", "o": ["Rentabilidad garantizada", "Independencia", "Segregación", "Profesionalidad"], "e": "Los principios son independencia (separación de áreas con posibles conflictos), segregación (los valores custodiados no son del custodio ni responden por sus deudas) y profesionalidad."}, {"q": "¿Con qué frecuencia debe el custodio reportar los movimientos a la sociedad administradora del FIC?", "o": ["Diariamente", "Mensualmente", "Semestralmente", "Anualmente"], "e": "Además, presenta un informe mensual escrito a la SFC, a AMV y a la junta directiva de la administradora sobre eventos que impidieron la custodia o incumplimientos del reglamento."}, {"q": "La anotación en cuenta de los valores de un FIC custodiado se hace a nombre de:", "o": ["La sociedad administradora, seguida del nombre o identificación del FIC", "Cada inversionista del FIC", "El custodio", "El gerente del FIC"], "e": "Así se identifica que los valores pertenecen al fondo y no a la administradora."}, {"q": "El custodio de un FIC presenta un informe mensual escrito sobre incumplimientos del reglamento o problemas de custodia a:", "o": ["La SFC, AMV y la junta directiva de la sociedad administradora", "Solo a los inversionistas", "La DIAN", "El Banco de la República"], "e": "Es una obligación especial del custodio de valores de FIC."}, {"q": "Un FIC tiene activos por COP 52.000 millones, pasivos por COP 2.000 millones y 4.000.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 12.500,00", "COP 13.000,00", "COP 13.500,00", "COP 11.250,00"], "e": "V = (A − P) / N = (52.000 − 2.000) millones / 4.000.000 = COP 12.500,00."}, {"q": "Un FIC tiene activos por COP 31.500 millones, pasivos por COP 1.500 millones y 2.500.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 12.000,00", "COP 12.600,00", "COP 13.200,00", "COP 10.800,00"], "e": "V = (A − P) / N = (31.500 − 1.500) millones / 2.500.000 = COP 12.000,00."}, {"q": "Un FIC tiene activos por COP 12.600 millones, pasivos por COP 600 millones y 1.000.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 12.000,00", "COP 12.600,00", "COP 13.200,00", "COP 10.800,00"], "e": "V = (A − P) / N = (12.600 − 600) millones / 1.000.000 = COP 12.000,00."}, {"q": "Un FIC tiene activos por COP 80.400 millones, pasivos por COP 400 millones y 5.000.000 unidades en circulación. ¿Cuál es el valor de la unidad?", "o": ["COP 16.000,00", "COP 16.080,00", "COP 16.160,00", "COP 14.400,00"
