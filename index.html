<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMV Operador">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Simulador AMV Operador</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a single study column; the exam runs as a sticky timer bar over one question card, with a numbered answer grid beside it on wide screens. */
:root {
  --bg: #f5f6f3;
  --surface: #ffffff;
  --ink: #17221d;
  --muted: #5b6862;
  --line: #d9dfda;
  --accent: #0f6b4f;
  --accent-soft: #e2efe9;
  --gold: #a5741b;
  --ok: #1d7a43;
  --ok-soft: #e3f2e8;
  --bad: #b3362b;
  --bad-soft: #f8e6e3;
  --flag: #b07d12;
  --flag-soft: #f7efd9;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #18221d; --ink: #e6ece8; --muted: #9aa8a1; --line: #2c3933;
    --accent: #5cc09b; --accent-soft: #1d3a2f; --gold: #d8a649;
    --ok: #63c48a; --ok-soft: #183526; --bad: #ef7d70; --bad-soft: #3d1f1b;
    --flag: #e2b552; --flag-soft: #3a2f16; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #18221d; --ink: #e6ece8; --muted: #9aa8a1; --line: #2c3933;
  --accent: #5cc09b; --accent-soft: #1d3a2f; --gold: #d8a649;
  --ok: #63c48a; --ok-soft: #183526; --bad: #ef7d70; --bad-soft: #3d1f1b;
  --flag: #e2b552; --flag-soft: #3a2f16; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.1; }
h2 { font-size: 1.45rem; line-height: 1.2; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 600; color: var(--accent); }
.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); padding: 10px 18px; border-radius: 8px; font-weight: 600; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: start; margin-bottom: 36px; }
.hero .lead { font-size: 1.05rem; color: var(--muted); max-width: 58ch; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.ticket table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.ticket th { text-align: left; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 0 6px; }
.ticket td { padding: 5px 0; border-top: 1px solid var(--line); }
.ticket td.r, .ticket th.r { text-align: right; padding-left: 14px; }
.ticket tr.comprow td { font-weight: 700; padding-top: 10px; border-top: 1px solid var(--ink); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.mode { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.mode.primary { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mode .facts { display: flex; gap: 14px; font-size: 0.9rem; color: var(--muted); flex-wrap: wrap; }
.mode .facts b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.mode .btn { margin-top: auto; align-self: flex-start; }
.practice { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-bottom: 36px; }
.practice .fields { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
select, input[type="number"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--ink); }
.resume { background: var(--flag-soft); border: 1px solid var(--flag); border-radius: 12px; padding: 14px 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 24px; }
.history table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.history th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 8px; }
.history td { padding: 8px; border-top: 1px solid var(--line); }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.method { margin-top: 36px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.method div { border-top: 2px solid var(--ink); padding-top: 10px; font-size: 0.93rem; color: var(--muted); }
.method h3 { color: var(--ink); margin-bottom: 4px; }
.note { font-size: 0.82rem; color: var(--muted); margin-top: 28px; max-width: 75ch; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 36px; }
.lcard { text-align: left; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.lcard:hover { border-color: var(--accent); }
.lcard .n { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); }
.lcard b { font-weight: 600; line-height: 1.3; }
.lcard .muted { font-size: 0.82rem; }
.lcard.read .n::after { content: " · leída"; color: var(--muted); }
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(18px, 4vw, 40px); max-width: 820px; margin: 0 auto; min-width: 0; }
.lesson h1 { margin-bottom: 8px; }
.lesson h2 { margin: 32px 0 10px; font-size: 1.3rem; }
.lesson h3 { margin: 22px 0 6px; font-size: 1.05rem; }
.lesson p, .lesson li { max-width: 68ch; }
.lesson p { margin: 0 0 12px; }
.lesson ul, .lesson ol { margin: 0 0 14px; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.lesson .tw { overflow-x: auto; margin: 6px 0 16px; }
.lesson table { border-collapse: collapse; font-size: 0.92rem; min-width: 420px; width: 100%; }
.lesson th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border-bottom: 1px solid var(--ink); padding: 6px 8px; }
.lesson td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
.box { border-radius: 10px; padding: 14px 16px; margin: 14px 0 18px; }
.box > :last-child { margin-bottom: 0; }
.box .tag { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 6px; }
.box.ej { background: var(--accent-soft); }
.box.ej .tag { color: var(--accent); }
.box.trampa { background: var(--flag-soft); }
.box.trampa .tag { color: var(--flag); }
.box.clave { background: var(--bg); border: 1px solid var(--line); }
.box.clave .tag { color: var(--muted); }
.lesson code, .lesson .f { font-family: var(--mono); font-size: 0.9em; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.lesson p.f { display: block; width: fit-content; max-width: 100%; overflow-x: auto; padding: 6px 10px; }
.lesson li ul, .lesson li ol { margin: 4px 0 2px; }
.lesson .fuente { margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
.btn.back { white-space: nowrap; }
.lnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; max-width: 820px; margin: 18px auto 0; }

/* Exam */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .in { max-width: 1080px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.bar .title { font-weight: 600; flex: 1 1 200px; min-width: 0; }
.timer { font-family: var(--mono); font-size: 1.25rem; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.progress { height: 3px; background: var(--line); }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; min-width: 0; }
.qmeta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
.qtext { font-size: 1.12rem; line-height: 1.5; margin-bottom: 20px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--mono); width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 0.85rem; background: var(--surface); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--bg); border-left: 3px solid var(--accent); font-size: 0.95rem; }
.qnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.flagbtn.on { border-color: var(--flag); color: var(--flag); background: var(--flag-soft); }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; max-height: 52vh; overflow-y: auto; padding: 2px; }
.cell { font-family: var(--mono); font-size: 0.75rem; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 0; position: relative; }
.cell.ans { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.cell.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--flag); }
.cell.cur { outline: 2px solid var(--ink); outline-offset: 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); margin: 10px 0 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.confirm { margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px solid var(--bad); background: var(--bad-soft); font-size: 0.9rem; display: flex; flex-direction: column; gap: 10px; }
.confirm .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Results */
.verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 20px 0 28px; }
.comp { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.comp .big { font-family: var(--display); font-size: 2.6rem; line-height: 1; }
.comp.pass { border-color: var(--ok); }
.comp.fail { border-color: var(--bad); }
.meter { position: relative; height: 8px; background: var(--line); border-radius: 4px; }
.meter span { display: block; height: 100%; border-radius: 4px; }
.meter i { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); left: 70%; }
.mods { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 28px; }
.modrow { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 88px; gap: 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.93rem; }
.modrow:first-of-type { border-top: 0; }
.modrow .num { text-align: right; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
.filters button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 0.88rem; }
.filters button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.review { display: flex; flex-direction: column; gap: 14px; }
.review .qcard { padding: 20px; }
.yours { font-size: 0.85rem; margin-top: 10px; }
@media (max-width: 860px) {
  .hero, .exam { grid-template-columns: minmax(0, 1fr); }
  .modes, .method { grid-template-columns: minmax(0, 1fr); }
  .practice { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .grid { max-height: none; }
  .modrow { grid-template-columns: minmax(0, 1fr) auto; }
  .modrow .num { white-space: nowrap; }
  .modrow .meter { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
const BANK = {"auto": [{"q": "¿Qué ley estableció la obligación de autorregulación para los intermediarios del mercado de valores en Colombia?", "o": ["Ley 964 de 2005", "Ley 45 de 1990", "Ley 1328 de 2009", "Ley 222 de 1995"], "e": "La Ley 964 de 2005 estableció la autorregulación obligatoria para quienes realizan actividades de intermediación de valores. AMV es el organismo que ejerce esa función."}, {"q": "¿Cuáles son las funciones que ejerce AMV por expresa disposición legal?", "o": ["Normativa, de supervisión, disciplinaria y de certificación", "Monetaria, cambiaria y crediticia", "De inspección, vigilancia y control estatal", "De calificación de riesgo y custodia"], "e": "La guía de AMV señala que las cuatro funciones (normativa, de supervisión, disciplinaria y de certificación) le corresponden por disposición legal: Ley 964 de 2005 y Decreto 2555 de 2010."}, {"q": "La naturaleza jurídica de AMV es la de:", "o": ["Una corporación privada sin ánimo de lucro", "Una entidad pública adscrita al Ministerio de Hacienda", "Una sociedad anónima con ánimo de lucro", "Una dependencia de la Superintendencia Financiera"], "e": "AMV es una entidad de derecho privado, sin ánimo de lucro, que ejerce funciones de autorregulación. Está supervisada por la Superintendencia Financiera."}, {"q": "La función normativa de AMV consiste en:", "o": ["Expedir reglamentos que deben cumplir sus miembros y las personas vinculadas", "Expedir leyes sobre el mercado de valores", "Fijar tasas de interés máximas", "Dictar normas de política cambiaria"], "e": "Por la función normativa, AMV adopta reglamentos de autorregulación de obligatorio cumplimiento para sus miembros y personas naturales vinculadas, que requieren aprobación de la SFC."}, {"q": "La función de supervisión de AMV permite:", "o": ["Verificar el cumplimiento de las normas del mercado y de los reglamentos de autorregulación", "Tomar posesión de una entidad en dificultades", "Fijar la tasa de cambio oficial", "Aprobar la emisión de nuevos valores"], "e": "La supervisión de AMV verifica que miembros y personas vinculadas cumplan las normas del mercado de valores y la autorregulación. La toma de posesión es facultad de la SFC."}, {"q": "¿Quiénes están sujetos a la autorregulación de AMV?", "o": ["Los miembros autorregulados y sus personas naturales vinculadas", "Todos los inversionistas del mercado", "Solo las sociedades comisionistas de bolsa", "Los emisores de valores y sus accionistas"], "e": "Los sujetos de autorregulación son los intermediarios miembros de AMV y las personas naturales vinculadas a ellos, como operadores y asesores."}, {"q": "¿Qué órgano de AMV decide los procesos disciplinarios?", "o": ["El Tribunal Disciplinario", "El Consejo Directivo", "La Asamblea de Miembros", "La Superintendencia Financiera"], "e": "El Tribunal Disciplinario de AMV decide los procesos disciplinarios mediante sus salas de decisión, y la Sala de Revisión resuelve las apelaciones."}, {"q": "¿Cuál es el orden correcto de las etapas del proceso disciplinario de AMV?", "o": ["Indagación preliminar, investigación (auto de apertura y pruebas), pliego de cargos y decisión del Tribunal", "Pliego de cargos, investigación, decisión y apelación ante la SFC", "Decisión del Tribunal, investigación e indagación preliminar", "Denuncia penal, investigación y sanción"], "e": "La actividad disciplinaria comprende la indagación preliminar y las etapas de investigación (a cargo de AMV) y de decisión (a cargo del Tribunal disciplinario). La etapa de decisión empieza con el pliego de cargos."}, {"q": "¿Qué es un acuerdo de terminación anticipada en el proceso disciplinario de AMV?", "o": ["Un acuerdo entre AMV y el investigado que da por terminado el proceso, con la aceptación de los hechos y una sanción", "El archivo del proceso por falta de pruebas", "Una apelación ante la Sala de Revisión", "La renuncia del investigado a la entidad"], "e": "El investigado puede llegar a un acuerdo con AMV para terminar el proceso de forma anticipada. Normalmente implica aceptar los hechos y una sanción."}, {"q": "¿Cuál de las siguientes es una sanción que puede imponer AMV?", "o": ["Expulsión", "Toma de posesión de la entidad", "Pena de prisión", "Liquidación forzosa administrativa"], "e": "AMV puede imponer sanciones como amonestación, multa, suspensión y expulsión. La toma de posesión y la liquidación son medidas de la SFC, y la prisión es una pena penal."}, {"q": "Si un sancionado no está de acuerdo con la decisión de primera instancia del Tribunal Disciplinario, puede:", "o": ["Interponer recurso de apelación ante la Sala de Revisión", "Apelar ante la Bolsa de Valores de Colombia", "Solicitar la revisión al Banco de la República", "No puede hacer nada; la decisión es única"], "e": "Las decisiones de las salas de decisión pueden apelarse ante la Sala de Revisión del Tribunal Disciplinario de AMV."}, {"q": "¿Qué entidad supervisa a AMV?", "o": ["La Superintendencia Financiera de Colombia", "El Banco de la República", "La Bolsa de Valores de Colombia", "La Contraloría General de la República"], "e": "AMV, como organismo de autorregulación, está sometido a la supervisión de la SFC, que también aprueba sus reglamentos."}, {"q": "¿Quiénes deben obtener la certificación de AMV?", "o": ["Los profesionales que realizan actividades de intermediación, asesoría o dirección en el mercado de valores, según su función", "Todos los inversionistas antes de comprar acciones", "Solo los presidentes de las entidades financieras", "Únicamente los empleados de los fondos de pensiones"], "e": "La certificación es obligatoria para los profesionales que ejercen funciones como operadores, asesores, directivos y otras definidas por la regulación."}, {"q": "¿Qué requisitos exige la certificación de un profesional ante AMV?", "o": ["Aprobar el examen de idoneidad y acreditar que cumple los requisitos de capacidad técnica y profesional", "Tener título de posgrado en finanzas", "Tener al menos diez años de experiencia", "Ser accionista de la entidad"], "e": "El proceso de certificación incluye aprobar el examen correspondiente y verificar los antecedentes del profesional."}, {"q": "La certificación de AMV tiene una vigencia de:", "o": ["Tres años, tras los cuales debe renovarse", "Un año", "Diez años", "Indefinida"], "e": "La certificación AMV tiene una vigencia de tres años. Antes del vencimiento, el profesional debe renovarla mediante los mecanismos que AMV defina."}, {"q": "Un operador pasa a trabajar en otra entidad. ¿Qué debe ocurrir con su inscripción en el RNPMV?", "o": ["Debe actualizarse para reflejar su vinculación a la nueva entidad", "Se cancela y debe volver a presentar el examen", "No es necesario hacer nada", "La actualiza el Banco de la República"], "e": "La inscripción en el RNPMV refleja la entidad a la que está vinculado el profesional, por lo que debe actualizarse cuando cambia de empleador."}, {"q": "¿Cuál es el objetivo principal de la autorregulación en el mercado de valores?", "o": ["Proteger a los inversionistas y la integridad del mercado mediante normas y supervisión de los propios participantes", "Fijar los precios de los valores", "Reemplazar la supervisión del Estado", "Garantizar ganancias a los intermediarios"], "e": "La autorregulación complementa la supervisión estatal: los participantes adoptan y vigilan normas para proteger al inversionista y la integridad del mercado."}, {"q": "AMV puede investigar a una persona natural que ya no está vinculada a un intermediario por hechos ocurridos durante su vinculación:", "o": ["Sí, porque la competencia se mantiene sobre los hechos ocurridos cuando estaba vinculada", "No, nunca", "Solo si la Superintendencia lo autoriza expresamente", "Solo si la persona lo acepta"], "e": "AMV conserva su competencia disciplinaria sobre las conductas ocurridas mientras la persona estaba vinculada, dentro de los términos de caducidad."}, {"q": "Los reglamentos de AMV, antes de entrar en vigencia, deben ser aprobados por:", "o": ["La Superintendencia Financiera de Colombia", "El Congreso de la República", "La Asamblea de accionistas de la Bolsa de Valores", "El Ministerio de Comercio"], "e": "La SFC aprueba los reglamentos de los organismos de autorregulación antes de que entren en vigencia."}, {"q": "¿Cuál es una diferencia entre las sanciones de AMV y las de la Superintendencia Financiera?", "o": ["AMV impone sanciones disciplinarias a sus sujetos de autorregulación; la SFC impone sanciones administrativas como autoridad del Estado", "AMV puede imponer penas de prisión y la SFC no", "La SFC no puede sancionar a personas naturales", "No hay diferencia; ambas son el mismo proceso"], "e": "Son regímenes distintos. La SFC actúa como autoridad estatal con sanciones administrativas. AMV actúa sobre sus miembros y vinculados con sanciones disciplinarias."}, {"q": "¿Qué es una persona natural vinculada (PNV) a un miembro de AMV?", "o": ["Una persona que, vinculada a un intermediario, participa en actividades de intermediación o relacionadas con el mercado de valores", "Cualquier cliente de un intermediario", "Un accionista de una sociedad inscrita en bolsa", "Un funcionario de la Superintendencia Financiera"], "e": "Las personas naturales vinculadas son administradores, empleados o contratistas del intermediario que realizan actividades de intermediación o relacionadas. Están sujetas a la autorregulación."}, {"q": "La pertenencia a un organismo de autorregulación es obligatoria para:", "o": ["Quienes realizan actividades de intermediación de valores", "Todos los inversionistas", "Los emisores de valores", "Las calificadoras de riesgo únicamente"], "e": "La Ley 964 de 2005 obliga a quienes realizan intermediación de valores a ser miembros de un organismo autorregulador."}, {"q": "Además del mercado de valores, AMV también actúa como autorregulador en:", "o": ["El mercado de divisas, para las entidades que se vinculan a él", "El mercado de seguros de vida", "El mercado de vivienda", "El sistema de salud"], "e": "AMV ejerce autorregulación en el mercado de divisas para las entidades que la adoptan, además de su función en el mercado de valores."}, {"q": "¿Qué principio exige que una sanción disciplinaria guarde relación con la gravedad de la conducta?", "o": ["Proporcionalidad", "Retroactividad", "Doble instancia", "Publicidad"], "e": "Por el principio de proporcionalidad, la sanción debe ser adecuada a la gravedad de la falta y a sus circunstancias."}, {"q": "¿Cuál de los siguientes factores se tiene en cuenta para graduar una sanción disciplinaria?", "o": ["El beneficio obtenido, el daño causado y la reincidencia", "El número de hijos del investigado", "La antigüedad de la entidad en bolsa", "El salario del investigado únicamente"], "e": "Para graduar la sanción se consideran factores como la gravedad, el beneficio obtenido, el daño causado, la reincidencia y la colaboración del investigado."}, {"q": "El derecho del investigado a conocer las pruebas, presentar explicaciones y controvertir la acusación en un proceso de AMV corresponde al principio de:", "o": ["Debido proceso", "Reserva bancaria", "Libre competencia", "Autonomía de la voluntad"], "e": "El proceso disciplinario de AMV respeta el debido proceso: el investigado puede conocer las pruebas, presentar explicaciones y defenderse."}, {"q": "En el proceso general, la notificación del auto de apertura de investigación tiene como propósito:", "o": ["Informar al investigado los hechos que dieron origen al proceso y poner el expediente a su disposición para que ejerza su defensa", "Imponer de inmediato la sanción", "Archivar el proceso", "Notificar a la Fiscalía"], "e": "Con el auto de apertura se informan los hechos al investigado y el expediente queda a su disposición. El investigado puede pronunciarse o no: su silencio no se interpreta como aceptación."}, {"q": "Si al terminar la etapa de investigación AMV identificó los hechos e individualizó al responsable, el paso siguiente es:", "o": ["Formular un pliego de cargos ante el Tribunal Disciplinario", "Imponer directamente una multa", "Remitir el caso al Banco de la República", "Cerrar el proceso"], "e": "AMV formula el pliego de cargos y lo radica en la Secretaría del Tribunal disciplinario; con ello empieza la etapa de decisión. Si no hay mérito, archiva la investigación de forma motivada."}, {"q": "La Sala de Revisión del Tribunal Disciplinario de AMV:", "o": ["Resuelve los recursos de apelación contra las decisiones de las salas de decisión", "Investiga los hechos en primera instancia", "Expide los reglamentos de AMV", "Aplica los exámenes de certificación"], "e": "La Sala de Revisión es la segunda instancia del proceso disciplinario."}, {"q": "¿Qué organismo de AMV expide sus reglamentos?", "o": ["El Consejo Directivo, con aprobación de la Superintendencia Financiera", "El Tribunal Disciplinario", "La Gerencia de Certificación", "Los miembros de forma individual"], "e": "El Consejo Directivo de AMV adopta los reglamentos, que deben ser aprobados por la SFC antes de entrar en vigencia."}, {"q": "En la supervisión, AMV puede:", "o": ["Realizar visitas, solicitar información y monitorear las operaciones de sus miembros", "Ordenar la liquidación de una entidad", "Fijar las tasas de los TES", "Expedir decretos"], "e": "La función de supervisión incluye el monitoreo de operaciones, las visitas y los requerimientos de información para verificar el cumplimiento normativo."}, {"q": "¿Qué sucede con la información de una investigación de AMV mientras el proceso está en curso?", "o": ["Tiene carácter reservado", "Se publica de inmediato en la prensa", "Se envía a todos los clientes del investigado", "Se publica en redes sociales de AMV"], "e": "Las investigaciones son reservadas mientras están en curso. Las sanciones en firme se publican, por ejemplo en el SIAMV."}, {"q": "¿Dónde pueden consultarse los antecedentes disciplinarios de un profesional certificado?", "o": ["En el Sistema de Información de AMV (SIAMV) y en el RNPMV", "En el registro mercantil", "En el RUT", "En la página de la DIAN"], "e": "El SIAMV y el RNPMV permiten consultar el estado de certificación e inscripción y las sanciones en firme de los profesionales."}, {"q": "La certificación de profesionales del mercado de valores se obtiene mediante:", "o": ["La aprobación de un examen de idoneidad y la verificación de antecedentes por una entidad certificadora", "Un curso de un día sin evaluación", "La recomendación de la entidad empleadora", "La compra de una licencia"], "e": "La regulación exige aprobar un examen de idoneidad profesional y verificar los antecedentes. AMV actúa como entidad certificadora."}, {"q": "Según la regulación, el examen de idoneidad se divide en:", "o": ["Una parte básica y una parte especializada", "Una parte oral y una escrita", "Una parte teórica y una entrevista", "Tres partes de igual peso"], "e": "El Decreto 2555 de 2010 establece una parte básica, con el marco regulatorio y de autorregulación, y una especializada, según la modalidad."}, {"q": "Según el Decreto 2555 de 2010, ¿qué puntaje mínimo se exige en cada parte del examen de idoneidad?", "o": ["70 %", "60 %", "80 %", "50 %"], "e": "La norma exige obtener al menos el 70 % en cada una de las partes del examen."}, {"q": "Las entidades certificadoras de profesionales deben contar, entre otros, con:", "o": ["Un comité académico y un banco de preguntas propio", "Una red de oficinas en todo el país", "Un fondo de inversión colectiva", "Autorización del Banco de la República"], "e": "El Decreto 2555 exige a las entidades certificadoras un comité académico, con representantes de la academia y la industria, y un banco de preguntas propio."}, {"q": "Un profesional que no aprueba el examen de certificación:", "o": ["Puede volver a presentarlo según el cronograma de la entidad que lo aplica", "Queda inhabilitado de por vida", "Debe esperar diez años", "Debe cambiar de profesión"], "e": "La norma permite presentar nuevamente el examen, según las fechas que defina la entidad que lo aplica."}, {"q": "¿Puede presentar el examen de certificación una persona que no trabaja en un intermediario?", "o": ["Sí, la regulación lo permite aunque no tenga relación laboral con un intermediario", "No, solo los empleados de entidades vigiladas", "Solo si tiene un posgrado", "Solo si es extranjero"], "e": "El Decreto 2555 permite que personas no obligadas a inscribirse en el RNPMV presenten el examen de forma voluntaria."}, {"q": "Un profesional con la certificación vencida que sigue ejerciendo funciones que la requieren:", "o": ["Incumple la regulación y puede ser objeto de investigación disciplinaria", "No incurre en ninguna falta", "Solo debe pagar una multa de tránsito", "Queda certificado automáticamente"], "e": "Ejercer sin la certificación vigente infringe las normas del mercado. La entidad y el profesional deben asegurarse de mantenerla al día."}, {"q": "La autorregulación se considera un complemento de la supervisión estatal porque:", "o": ["Los participantes adoptan normas y vigilan su cumplimiento, sin reemplazar las facultades de la Superintendencia", "Reemplaza completamente a la Superintendencia", "Es ejercida por el Banco de la República", "Solo aplica a emisores extranjeros"], "e": "La SFC conserva sus facultades. AMV agrega una capa de normas, supervisión y disciplina propia del mercado."}, {"q": "¿Puede AMV imponer sanciones a una entidad miembro, además de a las personas naturales vinculadas?", "o": ["Sí, puede sancionar tanto a los miembros como a las personas naturales vinculadas", "No, solo a las personas naturales", "No, solo a las entidades", "Solo con autorización del Congreso"], "e": "Los sujetos de autorregulación son las entidades miembro y sus personas naturales vinculadas, y ambos pueden ser sancionados."}, {"q": "Un acuerdo de terminación anticipada en AMV puede celebrarse:", "o": ["Desde que se inicia el proceso y hasta que vence el término para presentar descargos", "Solo después de la decisión de segunda instancia", "Únicamente ante un juez penal", "En cualquier momento, incluso después de la decisión de primera instancia"], "e": "La solicitud de ATA puede presentarse desde el inicio del proceso hasta el vencimiento del término para rendir descargos. Solo puede pedirlo quien no sea reincidente."}, {"q": "Las normas de autorregulación se diferencian de las leyes y decretos en que:", "o": ["Son expedidas por el autorregulador y obligan a sus miembros y personas vinculadas", "Son expedidas por el Congreso", "Solo son recomendaciones sin efectos", "Aplican a todos los ciudadanos"], "e": "Los reglamentos de AMV, aprobados por la SFC, son obligatorios para los sujetos de autorregulación, no para el público en general."}, {"q": "La función disciplinaria de AMV consiste en:", "o": ["Imponer sanciones a sus miembros y personas vinculadas por incumplir las normas del mercado y de autorregulación", "Juzgar delitos financieros", "Resolver quejas de consumidores contra bancos", "Fijar el valor de las multas de la SFC"], "e": "La función disciplinaria investiga y sanciona las infracciones a las normas del mercado de valores, los reglamentos de autorregulación y los de las bolsas."}, {"q": "Las normas cuyo incumplimiento puede ser sancionado por AMV incluyen:", "o": ["Las normas del mercado de valores, los reglamentos de AMV y los reglamentos de las bolsas y sistemas de negociación", "Solo las normas tributarias", "Solo los contratos laborales", "Solo el Código de Tránsito"], "e": "AMV vigila el cumplimiento de las normas del mercado, de sus propios reglamentos y de los reglamentos de los administradores de sistemas de negociación."}, {"q": "¿Quién elige a los miembros del Tribunal Disciplinario de AMV?", "o": ["El Consejo Directivo de AMV, que debe garantizar la independencia de una parte de sus integrantes", "La Superintendencia Financiera", "Los investigados", "La Bolsa de Valores de Colombia"], "e": "El Consejo Directivo elige a los miembros del Tribunal Disciplinario. El reglamento exige que una parte de ellos sean independientes de la industria."}, {"q": "Para un intermediario, la consecuencia de no ser miembro de un organismo autorregulador es:", "o": ["No puede realizar actividades de intermediación de valores", "Puede operar sin restricciones", "Debe pagar un impuesto adicional", "Solo puede operar en el exterior"], "e": "La membresía en un organismo autorregulador es requisito para hacer intermediación de valores en Colombia."}, {"q": "¿Qué es el SIAMV?", "o": ["El sistema de información de AMV, donde se gestionan los procesos de certificación y se consulta información de los profesionales", "Un sistema de negociación de acciones", "Un fondo de garantías", "El sistema de pagos del Banco de la República"], "e": "El SIAMV es la plataforma de AMV para trámites de certificación, inscripción a exámenes y consulta de información de profesionales y sanciones."}, {"q": "¿Cuál es la ventaja principal de la autorregulación frente a la regulación estatal exclusiva?", "o": ["El conocimiento especializado y la cercanía de la industria a la operación diaria del mercado", "Que elimina la necesidad de supervisión estatal", "Que no tiene costos", "Que no sanciona a nadie"], "e": "La autorregulación aprovecha el conocimiento técnico de los participantes para adoptar normas y vigilar el mercado con agilidad."}, {"q": "Las normas que expide AMV pueden ser más exigentes que las normas legales:", "o": ["Sí, siempre que no contradigan la ley y sean aprobadas por la Superintendencia", "No, deben ser idénticas a la ley", "Solo si las aprueba el Congreso", "Solo para emisores extranjeros"], "e": "Los reglamentos de autorregulación pueden elevar los estándares de conducta por encima del mínimo legal."}, {"q": "Una persona natural sancionada con multa no la paga dentro de los 15 días hábiles siguientes a la firmeza de la decisión. ¿Qué ocurre?", "o": ["Queda suspendida automáticamente, sin pronunciamiento del Tribunal, hasta que pague", "No pasa nada", "La entidad a la que está vinculada debe pagarla por ella", "La multa se convierte en una amonestación"], "e": "El no pago produce suspensión automática hasta que se pague. Además, la multa debe salir del patrimonio de la persona: no puede asumirla la entidad, ni su matriz o subordinadas."}, {"q": "Un profesional sancionado con suspensión por AMV:", "o": ["No puede ejercer las actividades del mercado de valores durante el tiempo de la suspensión", "Puede seguir operando normalmente", "Pierde su nacionalidad", "Debe cambiar de entidad"], "e": "La suspensión impide temporalmente actuar en el mercado de valores."}, {"q": "Un profesional sancionado con expulsión por AMV:", "o": ["Queda excluido del mercado de valores como persona vinculada a los miembros de AMV", "Solo recibe una advertencia", "Puede seguir trabajando en la misma mesa", "Solo paga una multa"], "e": "La expulsión es la sanción más grave e implica la salida del profesional del mercado."}, {"q": "¿Cuál es el propósito de la amonestación como sanción?", "o": ["Reprochar formalmente una conducta de menor gravedad", "Retirar la certificación de forma definitiva", "Cerrar la entidad", "Imponer una pena de prisión"], "e": "La amonestación es la sanción más leve y deja constancia del reproche."}, {"q": "Los miembros de AMV pagan cuotas para financiar:", "o": ["El funcionamiento del autorregulador", "Las pensiones de sus empleados", "Los dividendos de la bolsa", "La Superintendencia Financiera"], "e": "AMV se financia principalmente con las contribuciones de sus miembros y con las tarifas de servicios como la certificación."}, {"q": "Un intermediario debe informar a AMV cuando:", "o": ["Desvincula a una persona natural vinculada, o cuando la regulación le exige reportar hechos o información", "Contrata personal de aseo", "Cambia de oficina dentro del mismo edificio", "Un cliente abre una cuenta de ahorros"], "e": "Los miembros deben mantener actualizada la información de sus personas vinculadas y atender los reportes que exige la autorregulación."}, {"q": "Las decisiones del Tribunal Disciplinario de AMV que quedan en firme:", "o": ["Se publican para que el mercado las conozca", "Son siempre secretas", "Solo las conoce el sancionado", "Se borran después de un año"], "e": "Publicar las sanciones tiene un efecto disuasorio y permite a los clientes conocer los antecedentes."}, {"q": "En el proceso disciplinario de AMV, el investigado tiene derecho a:", "o": ["Presentar explicaciones, aportar y solicitar pruebas, y apelar la decisión", "Elegir a los miembros del Tribunal", "Suspender el proceso indefinidamente", "No ser notificado"], "e": "El reglamento garantiza el debido proceso y el derecho de defensa del investigado."}, {"q": "¿Puede la Superintendencia Financiera investigar los mismos hechos que AMV?", "o": ["Sí, porque son competencias independientes, una estatal y otra de autorregulación", "No, si AMV ya investiga", "Solo si AMV lo autoriza", "Solo si los hechos son penales"], "e": "Ambas entidades tienen competencias propias, aunque coordinan su actuación para evitar duplicidades."}, {"q": "La función normativa de AMV incluye la expedición de reglas sobre:", "o": ["Conducta, conflictos de interés, deberes frente a clientes y certificación de profesionales", "Tasas de interés del Banco de la República", "Política fiscal", "Normas de tránsito"], "e": "Los reglamentos de AMV regulan la conducta y los deberes de los intermediarios y sus profesionales."}, {"q": "¿Cuál de los siguientes es un sujeto que NO está bajo la competencia disciplinaria de AMV?", "o": ["Un inversionista particular que compra acciones para sí mismo", "Una sociedad comisionista miembro", "Un operador de una sociedad comisionista", "Un directivo de una fiduciaria miembro"], "e": "AMV tiene competencia sobre sus miembros y personas vinculadas, no sobre los inversionistas en general."}, {"q": "¿Qué debe hacer un intermediario frente a las solicitudes de información de AMV en una investigación?", "o": ["Atenderlas de manera completa y oportuna", "Ignorarlas", "Responder solo si le conviene", "Destruir los documentos"], "e": "No atender los requerimientos del autorregulador es una infracción en sí misma."}, {"q": "La certificación de un profesional puede ser cancelada o suspendida:", "o": ["Como consecuencia de una sanción disciplinaria o por no cumplir los requisitos de la regulación", "Por cambiar de domicilio", "Por tomar vacaciones", "Por cumplir años"], "e": "Las sanciones o la pérdida de los requisitos pueden afectar la certificación y la inscripción en el RNPMV."}, {"q": "¿Cuáles son las modalidades de certificación que ofrece AMV, entre otras?", "o": ["Asesor financiero, operador, directivo y digitador", "Médico, abogado e ingeniero", "Contador, revisor fiscal y auditor", "Piloto, conductor y marinero"], "e": "AMV certifica distintas modalidades según la función del profesional en el mercado."}, {"q": "Quien realiza actividades de intermediación sin estar autorizado por la Superintendencia incurre en:", "o": ["Ejercicio ilegal de la actividad, que puede tener consecuencias administrativas y penales", "Una falta menor sin consecuencias", "Una práctica permitida si tiene experiencia", "Una infracción solo de AMV"], "e": "La intermediación de valores es una actividad reservada a las entidades autorizadas y vigiladas."}, {"q": "La captación masiva y habitual de dinero del público sin autorización es:", "o": ["Un delito, porque esa actividad solo la pueden hacer entidades autorizadas", "Una actividad comercial libre", "Una forma legítima de crowdfunding sin reglas", "Una función de AMV"], "e": "La captación ilegal de recursos del público está tipificada como delito en el Código Penal colombiano."}, {"q": "¿Qué es la reincidencia en el régimen disciplinario?", "o": ["Incurrir en la misma conducta que motivó una herramienta preventiva dentro de los tres años siguientes a su adopción", "Apelar una decisión", "Presentar explicaciones", "Cambiar de entidad"], "e": "Según la Política de supervisión y disciplina, hay reincidencia cuando el sujeto repite la misma conducta dentro de los tres años siguientes a la adopción de la herramienta preventiva. La reincidencia es un foco de la función disciplinaria y además impide acceder a un ATA."}, {"q": "Colaborar con la investigación y reconocer la infracción, en el proceso de AMV:", "o": ["Puede tenerse en cuenta como atenuante al graduar la sanción", "No tiene ningún efecto", "Aumenta la sanción", "Anula el proceso"], "e": "Los reglamentos consideran la colaboración y la aceptación de los hechos como factores que pueden reducir la sanción."}, {"q": "¿Cuál es el órgano de AMV encargado de su dirección y de adoptar los reglamentos?", "o": ["El Consejo Directivo", "El Tribunal Disciplinario", "La Sala de Revisión", "El comité académico"], "e": "El Consejo Directivo dirige AMV y adopta sus reglamentos, que luego aprueba la SFC."}, {"q": "¿Qué tipo de normas puede expedir AMV en ejercicio de su función normativa?", "o": ["Reglamentos de autorregulación sobre conducta, operaciones y certificación", "Leyes de la República", "Decretos reglamentarios", "Resoluciones monetarias"], "e": "AMV expide reglamentos, que son normas privadas obligatorias para sus sujetos una vez aprobadas por la SFC."}, {"q": "La supervisión de AMV sobre las operaciones del mercado se apoya, entre otros, en:", "o": ["El monitoreo de las operaciones registradas en los sistemas de negociación y registro", "Las declaraciones de renta de los clientes", "Las encuestas de opinión", "Las redes sociales de los operadores únicamente"], "e": "AMV recibe información de las operaciones y detecta patrones inusuales que pueden indicar infracciones."}, {"q": "Si AMV encuentra en su supervisión una posible infracción penal, debe:", "o": ["Informar a las autoridades competentes, sin perjuicio de su propio proceso disciplinario", "Ocultarla", "Resolverla imponiendo una pena", "Esperar a que el cliente denuncie"], "e": "El proceso disciplinario es independiente de la responsabilidad penal, que corresponde a la Fiscalía y a los jueces."}, {"q": "¿Puede una misma conducta generar a la vez una sanción de AMV, una de la Superintendencia y una responsabilidad penal?", "o": ["Sí, porque son regímenes distintos con fines distintos", "No, solo puede haber una sanción", "Solo si el investigado lo acepta", "Solo si es reincidente"], "e": "Cada régimen protege bienes distintos, por eso pueden concurrir respetando las garantías del investigado."}, {"q": "La finalidad de la sanción disciplinaria en AMV es, principalmente:", "o": ["Proteger la integridad del mercado y disuadir conductas indebidas", "Recaudar dinero para los miembros", "Castigar a los inversionistas", "Compensar a la Superintendencia"], "e": "Las sanciones buscan corregir y prevenir infracciones, para mantener la confianza en el mercado."}, {"q": "En un proceso de AMV, ¿quién formula el pliego de cargos?", "o": ["AMV, a través de su área de investigación", "El Tribunal Disciplinario", "La Superintendencia Financiera", "El cliente afectado"], "e": "La función de investigar y acusar está separada de la de decidir, que corresponde al Tribunal."}, {"q": "La separación entre quien investiga y quien decide en el proceso de AMV busca garantizar:", "o": ["La imparcialidad de la decisión", "La rapidez del proceso a cualquier costo", "Que siempre haya sanción", "Que el investigado no se defienda"], "e": "Separar la acusación de la decisión es una garantía del debido proceso."}, {"q": "¿Qué es un sujeto de autorregulación voluntaria?", "o": ["Una entidad que, sin estar obligada, se somete a la autorregulación de un organismo como AMV", "Un inversionista que compra acciones", "Un funcionario de la Superintendencia", "Un emisor extranjero"], "e": "Algunas entidades se vinculan voluntariamente a la autorregulación, por ejemplo en el mercado de divisas."}, {"q": "El reglamento de AMV establece que los miembros deben contar con políticas para:", "o": ["Prevenir y gestionar conflictos de interés, y para la ejecución de órdenes de clientes", "Fijar los salarios del sector", "Definir la política monetaria", "Determinar los impuestos de los clientes"], "e": "Los reglamentos exigen a los intermediarios políticas internas que garanticen el cumplimiento de sus deberes."}, {"q": "¿Qué debe hacer un profesional antes de que venza su certificación?", "o": ["Renovarla por los mecanismos que defina AMV", "Nada, se renueva sola sin requisitos", "Presentar una carta al empleador", "Pagar una multa"], "e": "La certificación tiene vigencia limitada y debe renovarse antes de vencer para seguir ejerciendo."}, {"q": "Un operador que pasa de la mesa de renta fija a la de derivados en su entidad:", "o": ["Debe verificar que su certificación cubra la nueva actividad y, si no, obtener la especialidad requerida", "No necesita nada adicional", "Debe renunciar a la certificación", "Solo necesita autorización verbal del jefe"], "e": "Las especialidades de certificación corresponden a las actividades. Cambiar de actividad puede exigir una certificación adicional."}, {"q": "¿Qué información del profesional contiene el RNPMV?", "o": ["Sus datos de inscripción, la entidad a la que está vinculado, su certificación y sus sanciones en firme", "Su historia clínica", "Su declaración de renta", "Sus cuentas bancarias personales"], "e": "El RNPMV permite verificar que el profesional esté habilitado para ejercer y conocer sus antecedentes."}, {"q": "Un intermediario permite que un empleado sin certificación ejerza funciones de operador. ¿Quién puede ser sancionado?", "o": ["Tanto la entidad como el empleado", "Solo el empleado", "Solo el cliente", "Nadie"], "e": "La entidad incumple su deber de controlar a sus personas vinculadas y el empleado ejerce sin habilitación."}, {"q": "La función de certificación busca principalmente:", "o": ["Asegurar que los profesionales tengan los conocimientos y la idoneidad necesarios", "Recaudar recursos para el Estado", "Limitar el número de profesionales del mercado", "Reemplazar la formación universitaria"], "e": "La certificación protege al inversionista garantizando un nivel mínimo de conocimiento y antecedentes adecuados."}, {"q": "¿Qué pasa con una sanción de AMV que no fue apelada dentro del término?", "o": ["Queda en firme y se ejecuta", "Se anula automáticamente", "Se convierte en recomendación", "Pasa a la Superintendencia para que la repita"], "e": "Si no se interpone el recurso a tiempo, la decisión queda en firme."}, {"q": "AMV puede expedir conceptos o cartas circulares para:", "o": ["Orientar a sus miembros sobre la interpretación y aplicación de las normas", "Modificar las leyes", "Fijar tasas de interés", "Imponer impuestos"], "e": "Las cartas circulares y conceptos de AMV orientan sobre buenas prácticas y el alcance de las normas."}, {"q": "La autorregulación del mercado de valores en Colombia se basa en un modelo:", "o": ["Mixto, en el que conviven la supervisión estatal y la autorregulación", "Exclusivamente estatal", "Exclusivamente privado sin Estado", "Internacional sin normas locales"], "e": "La SFC y AMV coexisten, con funciones complementarias y coordinación entre ellas."}, {"q": "Un operador sancionado con multa por AMV pregunta si puede seguir trabajando. ¿Qué le responde?", "o": ["Sí, la multa por sí sola no le impide ejercer, a diferencia de la suspensión o la expulsión", "No, toda sanción impide trabajar", "Solo si cambia de entidad", "Solo después de diez años"], "e": "La multa es una sanción económica. La suspensión y la expulsión son las que impiden ejercer."}, {"q": "La reserva de las investigaciones de AMV protege principalmente:", "o": ["El buen nombre del investigado y la eficacia de la investigación mientras no hay decisión", "Los intereses de la competencia", "La rentabilidad de los clientes", "A la Superintendencia"], "e": "Mientras no exista una decisión en firme, la reserva evita daños injustificados y protege la investigación."}, {"q": "Antes de su aprobación, los proyectos de reglamento de AMV se publican para comentarios del público durante:", "o": ["15 días hábiles", "5 días calendario", "3 meses", "1 año"], "e": "Los proyectos normativos se publican para comentarios durante 15 días hábiles, luego pasan por el Comité de regulación y el Consejo directivo, y requieren autorización de la SFC."}, {"q": "¿Qué concepto debe ser favorable para que un proyecto de reglamento de AMV continúe su trámite?", "o": ["El del Comité de regulación", "El del Banco de la República en todos los casos", "El de la Fiscalía", "El de la Bolsa de Valores de Colombia"], "e": "El Comité de regulación debe emitir concepto favorable. La Sala de revisión del Tribunal da un concepto que no es vinculante, y luego aprueba el Consejo directivo."}, {"q": "El concepto que emite la Sala de revisión del Tribunal disciplinario sobre un proyecto normativo de AMV es:", "o": ["No vinculante", "Vinculante y definitivo", "Sustituto de la autorización de la SFC", "Obligatorio solo para divisas"], "e": "La Sala de revisión opina sobre los proyectos, pero su concepto no obliga. Quien aprueba es el Consejo directivo y quien autoriza es la SFC."}, {"q": "Un reglamento de AMV aprobado por la SFC entra en vigencia:", "o": ["El día siguiente a la publicación de la aprobación en firme", "Un año después de la aprobación", "Cuando lo ratifique el Congreso", "Cuando lo firme cada miembro"], "e": "Tras la autorización de la SFC, la norma rige a partir del día siguiente a la publicación de la aprobación en firme."}, {"q": "¿Qué instrumento de AMV NO requiere aprobación previa de la SFC?", "o": ["Las cartas circulares", "Los reglamentos de autorregulación", "Las modificaciones al Reglamento de AMV", "El Reglamento de divisas"], "e": "Las cartas circulares instruyen o aclaran el alcance de las normas, por lo que no requieren aprobación de la SFC. Los reglamentos sí."}, {"q": "Cuando AMV tramita normas sobre el mercado de divisas, debe pedir concepto previo a:", "o": ["El Banco de la República, que tiene 20 días hábiles para pronunciarse", "La DIAN", "El Ministerio de Comercio", "La Contraloría"], "e": "En divisas, la función normativa requiere concepto del Banco de la República, autoridad cambiaria, dentro de 20 días hábiles."}, {"q": "¿A quién presenta AMV su plan anual de supervisión y su informe de gestión?", "o": ["A la SFC, en el primer mes del año", "Al Congreso, cada semestre", "A la Fiscalía, cada trimestre", "A la BVC, al final del año"], "e": "AMV remite a la SFC su plan anual y el informe de gestión del año anterior durante el primer mes de cada año."}, {"q": "En la calificación preliminar de AMV, ¿cuál de estas conductas se considera muy grave?", "o": ["Defraudación o uso indebido de recursos de clientes", "Permitir el ingreso de terceros a la mesa de negociación", "Hablar durante el examen de certificación", "Un retraso menor en una actualización del SIAMV"], "e": "La política de AMV pone como ejemplos de muy graves la defraudación, el uso indebido de recursos y la adulteración de documentos. El ingreso de terceros a mesas y hablar durante el examen son ejemplos de leves."}, {"q": "Incumplir normas sobre conflictos de interés o el deber de mejor ejecución se califica preliminarmente como:", "o": ["Grave", "Leve", "Muy grave en todos los casos", "No sancionable"], "e": "En la tabla de calificación preliminar de AMV, los conflictos de interés, la mejor ejecución y los deberes generales aparecen como ejemplos de faltas graves."}, {"q": "Una afectación patrimonial efectiva a fondos de pensiones obligatorias o voluntarias puede llevar a que la infracción se califique como:", "o": ["Muy grave", "Leve", "Inexistente si se repara", "Administrativa y no disciplinaria"], "e": "La guía indica que la afectación efectiva y patrimonial a fondos de pensiones puede hacer que la conducta se califique como muy grave."}, {"q": "¿En qué consiste el spoofing?", "o": ["Ingresar posturas que no se pretende ejecutar para inducir a otros a operar, y cancelarlas después", "Comprar acciones con información privilegiada", "Cobrar comisiones excesivas por operaciones innecesarias", "Ejecutar órdenes de clientes antes de las propias"], "e": "El spoofing usa órdenes engañosas que se cancelan antes de ejecutarse, para aparentar oferta o demanda. El layering es una variante con varias capas de órdenes a distintos precios."}, {"q": "La utilización indebida de algoritmos de alta frecuencia para ingresar y cancelar grandes volúmenes de posturas, aparentando liquidez y ralentizando el sistema, se denomina:", "o": ["Quote stuffing", "Churning", "Front running", "Contrato de liquidez"], "e": "El Manual guía MG 18 de AMV describe el quote stuffing como el uso de algoritmos de alta frecuencia para saturar el sistema con posturas que se cancelan."}, {"q": "Un acuerdo entre operadores para ejecutar una operación en condiciones preestablecidas, con un precio determinado artificialmente, se conoce como:", "o": ["Collusion", "Estabilización legítima", "Operación cruzada permitida", "Mejor ejecución"], "e": "La collusion es un esquema manipulativo: el precio no se forma libremente sino por acuerdo previo entre operadores."}, {"q": "Ejecutar operaciones o ingresar posturas con el objeto de disparar órdenes límite de clientes recibidas antes, para sacar provecho de ellas, se denomina:", "o": ["Activación de órdenes", "Formación de liquidez", "Readquisición de acciones", "Cruce autorizado"], "e": "La activación de órdenes es una práctica manipulativa descrita en el MG 18: el intermediario mueve el precio para activar órdenes que ya conoce."}, {"q": "¿Cuál de estas actividades NO se considera manipulación según el literal b) del artículo 50 de la Ley 964 de 2005?", "o": ["La estabilización de valores legítimamente ejercida, incluidos los contratos de liquidez", "Aparentar ofertas o demandas por valores", "Manipular la liquidez de un valor", "Obstaculizar la libre concurrencia de otros en las ofertas"], "e": "La función de estabilización legítimamente ejercida (incluidos los contratos de liquidez y los formadores de liquidez) no es infracción."}, {"q": "Para distinguir una manipulación de una conducta legítima que también afecta los precios, la guía sugiere analizar:", "o": ["La conducta, la intención (dolo), la motivación y el efecto artificial en el mercado", "Solo el volumen negociado", "Únicamente si hubo ganancia", "Solo el horario de la operación"], "e": "Se identifican cuatro elementos: la conducta del manipulador, el dolo (usualmente inferido de indicios), la motivación y el efecto artificial en el precio."}, {"q": "La certificación de AMV, por sí sola:", "o": ["No implica la inscripción en el RNPMV ni autoriza para actuar en el mercado", "Equivale a la inscripción en el RNPMV", "Reemplaza los trámites de admisión de las bolsas en todos los casos", "Autoriza a la persona para constituir un intermediario"], "e": "La certificación es previa a la inscripción en el RNPMV, que es la que habilita para actuar. Tampoco sustituye la admisión en bolsas o sistemas, salvo que sus reglamentos lo digan."}, {"q": "¿Cuáles son los dos componentes del proceso integral de certificación de AMV?", "o": ["Acreditar la capacidad técnica y profesional, y verificar los antecedentes personales", "Pagar la tarifa y firmar un contrato laboral", "Tener título universitario y cinco años de experiencia", "Aprobar el examen y tener carta de un cliente"], "e": "La certificación exige ambos componentes vigentes: el examen de idoneidad y la verificación de antecedentes, que se hace de forma simultánea."}, {"q": "¿Qué área de AMV está a cargo del proceso de certificación?", "o": ["La Gerencia de certificación e información", "La Vicepresidencia de investigación y disciplina", "El Tribunal disciplinario", "La Sala de revisión"], "e": "La Gerencia de certificación e información puede apoyarse en funcionarios de AMV, excepto en quienes cumplen funciones disciplinarias o de supervisión."}, {"q": "Los funcionarios de AMV que tienen acceso al banco de preguntas:", "o": ["No pueden participar en actividades de capacitación", "Pueden dictar cursos de preparación", "Deben publicar las preguntas cada año", "Pueden presentar el examen sin pagar"], "e": "Para proteger el banco de preguntas, AMV no puede usar en capacitación a quienes tienen acceso a él."}, {"q": "¿Cuál es la vigencia de la certificación en la modalidad de directivo?", "o": ["Cuatro años", "Tres años", "Dos años", "Indefinida"], "e": "Directivo tiene vigencia de 4 años. Operador, asesor financiero y digitador tienen 3 años."}, {"q": "¿Cuántos exámenes debe aprobar quien aspira a certificarse como operador?", "o": ["Dos: el examen de operador (básico y especializado) y uno de especialidad", "Uno solo, el básico", "Tres, incluido el de directivo", "Ninguno, basta la experiencia"], "e": "El examen de operador es obligatorio para todos y tiene componente básico y especializado. Además se elige una especialidad: renta fija, renta variable, derivados o maestro."}, {"q": "¿Cuál de las siguientes NO es una especialidad del examen de operador?", "o": ["Fondos de pensiones obligatorias", "Negociación de instrumentos de renta fija", "Negociación de instrumentos de renta variable", "Negociación de derivados con subyacente financiero"], "e": "Las especialidades son renta fija, renta variable, derivados con subyacente financiero y maestro negociación (que combina las tres)."}, {"q": "Una persona certificada como operador quiere hacer labores de asesoría. ¿Qué necesita?", "o": ["Nada adicional: el operador puede realizar actividades de asesor financiero", "Certificarse además como asesor financiero", "Certificarse como directivo", "Una autorización especial de la SFC"], "e": "Según la guía, quien está certificado como operador puede hacer las actividades de asesor financiero sin otra certificación."}, {"q": "Debe certificarse como operador quien:", "o": ["Tiene asignado un código de acceso de operador para un sistema de negociación, salvo uso exclusivo para colocaciones primarias", "Solo vende CDT en una oficina", "Es miembro de la junta directiva sin código de acceso", "Trabaja como corresponsal no bancario"], "e": "Entre otros, deben certificarse como operador quienes ejecutan órdenes, operan con recursos propios de la entidad, tienen código de acceso de operador o imparten instrucciones desde la mesa."}, {"q": "Un jefe de mesa que cumple los requisitos para ser considerado directivo debe certificarse como:", "o": ["Operador, en su respectiva especialidad", "Directivo únicamente", "Asesor financiero únicamente", "Digitador"], "e": "La guía aclara que los jefes de mesa, aunque cumplan requisitos de directivo, solo deben certificarse como operador en su especialidad."}, {"q": "¿Quién debe certificarse como directivo?", "o": ["El gerente de riesgo de mercado de una SCB o una AFP", "Los miembros de la junta directiva de una SCB sin código de operador", "El presidente de una SCB sin código de operador", "Cualquier empleado administrativo"], "e": "Debe certificarse como directivo quien toma decisiones sobre estructura, límites, políticas o estrategias de intermediación, y quien es autoridad del área de riesgo de mercado. Juntas y presidentes no, salvo que tengan código de operador."}, {"q": "¿Cuál de estas personas NO requiere certificación de AMV?", "o": ["Un asesor comercial que solo promueve la compra y venta de CDT y CDAT", "Quien ejecuta órdenes de clientes sobre valores", "Quien asesora clientes en contratos de comisión", "Quien tiene código de acceso de operador"], "e": "No requieren certificación los asesores comerciales que solo promueven CDT y CDAT, los corresponsales no bancarios y no bursátiles, ni quienes solo ponen a disposición herramientas tecnológicas sin asesorar."}, {"q": "Un digitador certificado:", "o": ["Solo ingresa ofertas y posturas en el sistema siguiendo instrucciones de operadores, sin contacto con clientes", "Puede ejecutar órdenes de clientes con discrecionalidad", "Puede asesorar a clientes inversionistas", "Puede operar la posición propia de la entidad"], "e": "El digitador no tiene contacto con clientes ni discrecionalidad, y no puede realizar actividades propias de los operadores."}, {"q": "Es causal para negar la certificación que el aspirante haya sido condenado por un delito doloso contra el sistema financiero:", "o": ["Dentro de los últimos 20 años, o que la condena siga vigente", "Dentro de los últimos 2 años solamente", "En cualquier momento, aunque haya sido absuelto", "Solo si la condena fue en el exterior"], "e": "La causal cubre condenas por delitos dolosos contra el sistema financiero, el patrimonio, la administración pública, lavado, enriquecimiento ilícito o narcotráfico en los últimos 20 años o vigentes."}, {"q": "Una sanción de remoción del cargo impuesta por la SFC impide certificarse si ocurrió:", "o": ["Dentro de los cinco años anteriores a la solicitud", "En cualquier momento de la vida del aspirante", "Dentro del último mes", "Solo si fue apelada"], "e": "Es causal de negación la remoción del cargo por la SFC dentro de los cinco años anteriores, contados desde la ejecutoria del acto."}, {"q": "Estar reportado en listas vinculantes para Colombia de personas asociadas con organizaciones terroristas:", "o": ["Es causal para negar la certificación", "No tiene efecto en la certificación", "Solo impide certificarse como directivo", "Reduce la vigencia de la certificación a un año"], "e": "La Ley 1121 de 2006 sustenta esta causal: el aspirante reportado en esas listas no puede certificarse."}, {"q": "Para que una certificación se considere vigente:", "o": ["Deben estar vigentes tanto los exámenes requeridos como la verificación de antecedentes", "Basta con haber aprobado el examen alguna vez", "Basta con estar vinculado a un intermediario", "Basta con pagar la tarifa anual"], "e": "La certificación es integral: requiere la acreditación y vigencia de ambos componentes. El profesional debe presentar los exámenes antes de que pierdan vigencia."}, {"q": "¿Cada cuánto deben los miembros verificar que la información de sus PNV esté actualizada en el SIAMV?", "o": ["Al menos una vez al mes", "Una vez al año", "Cada tres años", "Solo cuando AMV lo pida"], "e": "La guía indica que los miembros deben verificar la información de sus PNV en el SIAMV al menos mensualmente."}, {"q": "La persona designada por la junta directiva para controlar el deber de certificación debe reportar a AMV un incumplimiento dentro de:", "o": ["Los 10 días hábiles siguientes a conocerlo", "Los 30 días calendario siguientes", "El año siguiente", "Las 24 horas siguientes"], "e": "Además presenta a la junta un informe semestral sobre los controles y fallas. El reporte de incumplimientos a AMV se hace dentro de 10 días hábiles."}, {"q": "Una persona que presenta voluntariamente el examen de AMV, sin estar vinculada a un intermediario:", "o": ["Queda sometida al reglamento de AMV, incluidas sus competencias de supervisión y disciplina, en lo aplicable", "No queda sujeta a ninguna norma de AMV", "Solo puede presentar el examen de digitador", "Necesita autorización del Ministerio de Hacienda"], "e": "Quien se presenta voluntariamente acepta el régimen de AMV. Por ejemplo, puede ser sancionado por incumplir los deberes del examinado durante la prueba."}, {"q": "Actualmente, el único esquema de autorregulación voluntaria existente en AMV es el del mercado:", "o": ["De divisas", "De criptoactivos", "De seguros", "Inmobiliario"], "e": "Los autorregulados en divisas tienen un contrato de afiliación con AMV y quedan sujetos a sus cuatro funciones, con los mismos deberes y derechos que los miembros."}, {"q": "Según el artículo 25 de la Ley 964 de 2005, ¿cuál de estas entidades puede actuar como organismo autorregulador?", "o": ["Las bolsas de productos agropecuarios, agroindustriales o de otros commodities", "Los bancos comerciales", "Las calificadoras de riesgo", "Las compañías de seguros"], "e": "Pueden actuar como autorreguladores: organizaciones constituidas exclusivamente para ese fin, organizaciones gremiales o profesionales, bolsas de valores, bolsas de commodities y sociedades administradoras de sistemas de negociación."}, {"q": "En Colombia hoy existen dos esquemas de autorregulación. Son:", "o": ["AMV, constituido exclusivamente para ese fin, y la Bolsa Mercantil de Colombia", "AMV y la Superintendencia Financiera", "La BVC y el Banco de la República", "Asofondos y Asobancaria"], "e": "La BMC ejerce funciones normativa, de supervisión y disciplinaria como bolsa de commodities. AMV es la organización creada exclusivamente para autorregular."}, {"q": "Las funciones de AMV se ejercen sobre las personas naturales vinculadas a sus miembros:", "o": ["Aunque aún no estén inscritas en el RNPMV ni en el autorregulador", "Solo si están inscritas en el RNPMV", "Solo si tienen contrato laboral a término indefinido", "Solo si son directivos"], "e": "El Decreto 2555 y el Reglamento de AMV extienden las funciones a las PNV aunque no estén inscritas, y sin importar el tipo de relación contractual."}, {"q": "Además de miembros, asociados voluntarios y PNV, ¿quién puede ser sujeto pasivo de un proceso disciplinario de AMV de forma excepcional?", "o": ["Un aspirante que incumple los deberes del examinado durante una sesión de examen", "Cualquier inversionista del mercado", "Un periodista que comenta sobre acciones", "Un funcionario de la SFC"], "e": "Al aceptar los términos del examen, el aspirante se somete al régimen disciplinario de AMV por su conducta durante la prueba."}, {"q": "¿Cuál es el plazo máximo para que AMV inicie un proceso disciplinario?", "o": ["Tres años desde la ocurrencia de los hechos", "Un año desde los hechos", "Diez años desde los hechos", "No hay plazo"], "e": "Para infracciones instantáneas se cuenta desde la ejecución; para las permanentes o sucesivas, desde el último acto; para omisiones, desde que cesó el deber de actuar."}, {"q": "Una infracción de ejecución permanente o sucesiva: ¿desde cuándo se cuentan los tres años para iniciar el proceso disciplinario?", "o": ["Desde la realización del último acto o hecho", "Desde el primer acto", "Desde que AMV la descubre", "Desde que la entidad la reporta"], "e": "Para infracciones con varios hechos o de ejecución permanente, el término corre desde el último acto. Para omisiones, desde que cesó el deber de actuar."}, {"q": "¿Qué principio permite a AMV no iniciar un proceso disciplinario cuando, por costo-beneficio y materialidad, la infracción no lo amerita?", "o": ["Oportunidad", "Tipicidad", "Revelación dirigida", "Doble instancia"], "e": "Con el principio de oportunidad, AMV evalúa costos, materialidad, reparación de perjuicios y sanciones internas ya impuestas, y puede optar por no iniciar el proceso."}, {"q": "La función disciplinaria de AMV se considera:", "o": ["Un instrumento de última instancia, precedido de herramientas preventivas, supervisión y acompañamiento", "La primera herramienta ante cualquier hallazgo", "Una función delegada por la Fiscalía", "Una función que solo se aplica a personas jurídicas"], "e": "AMV primero acompaña, supervisa y adopta herramientas preventivas. Disciplina cuando estas fallan, hay reincidencia o la conducta es grave."}, {"q": "¿Cuál de estos casos es un foco prioritario de la función disciplinaria según la Política de supervisión y disciplina de AMV?", "o": ["Conductas muy graves, reincidencia, afectación de recursos de protección social o de muchos clientes, e infractores en cargos relevantes", "Cualquier error operativo menor sin impacto", "Solo las conductas cometidas por digitadores", "Solo conductas en el mercado de divisas"], "e": "El foco incluye conductas preliminarmente muy graves, reincidencia, afectación de recursos de seguridad social o de un número representativo de clientes, infractores como administradores o jefes de mesa e infracciones sucesivas."}, {"q": "En el programa de colaboración, una PNV que aporta información efectiva puede obtener una reducción de la multa o suspensión de:", "o": ["Entre el 40 % y el 80 %", "Entre el 5 % y el 10 %", "El 100 % siempre", "Entre el 90 % y el 100 %"], "e": "Los beneficios pueden ser la aplicación del principio de oportunidad o una reducción del 40 % al 80 %. Si el colaborador fue el promotor, la reducción es solo del 40 % al 50 %."}, {"q": "Si quien solicita los beneficios de colaboración fue el promotor de la infracción, el único beneficio posible es:", "o": ["Una reducción del 40 % al 50 % de la multa o suspensión", "La exoneración total", "Una reducción del 80 %", "Ninguno: el promotor no puede colaborar"], "e": "El promotor puede colaborar, pero su beneficio se limita a una reducción entre el 40 % y el 50 %."}, {"q": "¿Cuál de estos hechos hace perder los beneficios del programa de colaboración?", "o": ["Controvertir los hechos reconocidos en la solicitud", "Contratar un abogado", "Cambiar de empleador", "Pedir una audiencia"], "e": "También se pierden si se desatienden requerimientos o citaciones de AMV, se destruye u obstaculiza información, se entrega información falsa o se incumple el acuerdo."}, {"q": "Cuando el proceso disciplinario ya se inició, una PNV puede obtener beneficios por colaboración si entrega la información:", "o": ["Antes de la formulación del pliego de cargos", "Después de la decisión de segunda instancia", "Solo durante la audiencia", "En cualquier momento, sin límite"], "e": "Si aún no hay proceso, la solicitud debe hacerse cuando falte al menos un año para que caduque la facultad disciplinaria. Si ya hay proceso, antes del pliego de cargos."}, {"q": "En el programa de colaboración, cuando hay varios colaboradores:", "o": ["El primero en presentar la solicitud obtiene más beneficios que los siguientes", "Todos reciben el mismo beneficio", "Solo el último recibe beneficios", "Ninguno recibe beneficios"], "e": "El programa está diseñado para premiar el orden cronológico. Quien no es admitido puede subsanar, pero pierde su turno."}, {"q": "Un miembro de AMV que denuncia a su propia PNV puede acceder a beneficios por colaboración si, entre otras condiciones:", "o": ["La PNV actuó de forma autónoma y no están involucrados el presidente ni los órganos colegiados de la entidad", "El presidente de la entidad participó en los hechos", "La entidad no adoptó medidas para proteger a los clientes", "La denuncia se hace después de la sanción"], "e": "Se exige además proteger a los clientes afectados, comprometerse con medidas correctivas y colaborar plenamente con AMV."}, {"q": "¿Qué diferencia al proceso abreviado del proceso general?", "o": ["El abreviado se aplica a infracciones objetivas listadas en el reglamento y empieza directamente con el pliego de cargos, sin auto de apertura", "El abreviado no permite defensa", "El abreviado lo decide la SFC", "El abreviado solo aplica a personas jurídicas"], "e": "En el abreviado basta probar que la conducta ocurrió. No hay auto de apertura: la primera oportunidad de defensa son los descargos ante el Tribunal."}, {"q": "¿Cuál de estas infracciones se tramita por proceso abreviado?", "o": ["Ejercer funciones que requieren inscripción en el RNPMV sin estar certificado o inscrito", "Uso de información privilegiada", "Manipulación de precios", "Defraudación a un cliente"], "e": "El abreviado incluye, entre otras: exceder límites de repos, simultáneas y TTV por cuenta de terceros; actuar sin certificación; incumplir suspensiones; no informar tarifas; no registrar operaciones OTC; incumplir medios verificables; dispositivos prohibidos en mesas; ingreso de terceros a mesas."}, {"q": "Permitir el ingreso de terceros no autorizados a la mesa de negociación se tramita por:", "o": ["Proceso abreviado", "Proceso general obligatoriamente", "Proceso penal exclusivamente", "Ningún proceso: no es infracción"], "e": "Es una de las conductas objetivas listadas en el artículo 58 del Reglamento de AMV para el proceso abreviado."}, {"q": "Una vez notificado el pliego de cargos, el imputado tiene para presentar sus descargos:", "o": ["10 días, prorrogables por otros 10", "3 días improrrogables", "30 días hábiles", "Un año"], "e": "El plazo de descargos es de 10 días prorrogables por 10 más, tanto en el proceso general como en el abreviado."}, {"q": "¿Cómo están conformadas las salas de decisión del Tribunal disciplinario de AMV?", "o": ["Por tres miembros: dos independientes y uno vinculado a la industria, y al menos uno debe ser abogado", "Por un solo juez de la SFC", "Por cinco funcionarios de AMV", "Por el Consejo directivo en pleno"], "e": "Hay 12 salas de decisión para la primera instancia. La Sala de revisión, que conoce la segunda instancia, tiene la misma composición."}, {"q": "¿Cuánto tiempo tiene la Sala de decisión para dictar una resolución sancionatoria?", "o": ["Un año desde el día hábil siguiente a la notificación del pliego de cargos", "Tres años desde los hechos", "Un mes desde la audiencia", "No tiene límite"], "e": "Pasado un año desde la notificación del pliego de cargos, la Sala de decisión ya no puede sancionar."}, {"q": "¿Dentro de qué plazo puede apelarse la decisión de primera instancia del Tribunal disciplinario?", "o": ["Ocho días siguientes a su notificación", "Un mes", "Tres días hábiles", "Seis meses"], "e": "El recurso lo pueden interponer el imputado, AMV o ambos, por escrito ante el secretario del Tribunal y expresando las razones."}, {"q": "Si solo el imputado apela la decisión de primera instancia:", "o": ["La Sala de revisión no puede agravar su situación", "La Sala de revisión debe aumentar la sanción", "La apelación se rechaza automáticamente", "El caso pasa a la SFC"], "e": "Cuando solo apela el imputado, rige la prohibición de agravar su situación."}, {"q": "Contra la decisión de la Sala de revisión del Tribunal disciplinario:", "o": ["No proceden recursos, pero puede impugnarse judicialmente por culpa grave o dolo dentro del mes siguiente", "Procede apelación ante la SFC", "Procede un recurso de reposición ante AMV", "Procede apelación ante el Consejo directivo"], "e": "La decisión de segunda instancia es final en AMV. La Ley 964 de 2005 permite una acción judicial por culpa grave o dolo dentro del mes siguiente."}, {"q": "¿Puede la Sala de decisión devolver un proceso general a AMV?", "o": ["Sí, para que amplíe la investigación y, si es el caso, modifique o eleve un nuevo pliego de cargos", "No, nunca", "Sí, pero solo para archivarlo", "Solo si el imputado lo pide en segunda instancia"], "e": "El artículo 76 del Reglamento de AMV permite esa devolución en el procedimiento general."}, {"q": "En la etapa de decisión, ¿quién puede decretar pruebas?", "o": ["La Sala de decisión, de oficio o a solicitud del imputado", "Solo la SFC", "Nadie: las pruebas solo se practican en la investigación", "Solo el Consejo directivo"], "e": "El imputado puede pedir pruebas que no aportó o que AMV no decretó, y la Sala también puede decretarlas de oficio, garantizando la contradicción."}, {"q": "¿Quién NO puede acceder a un acuerdo de terminación anticipada (ATA)?", "o": ["Quien sea reincidente", "Quien actúe con apoderado", "Una persona jurídica", "Quien esté en la etapa de investigación"], "e": "La guía indica que solo puede acudir al ATA quien no sea reincidente."}, {"q": "El Presidente de AMV puede firmar directamente un ATA con una persona natural cuando la solicitud se presentó en la investigación y la multa acordada no supera:", "o": ["1.368 UVT", "5.470 UVT", "27.351 UVT", "100 SMMLV"], "e": "El tope es 1.368 UVT para personas naturales y 2.735 UVT para personas jurídicas, o sanciones de amonestación u orden de tomar exámenes."}, {"q": "Si un ATA incorpora una sanción mayor a los topes o se solicita después del pliego de cargos, el proyecto debe enviarse a:", "o": ["La Sala de revisión, que evalúa la proporcionalidad de la sanción", "La SFC para su aprobación", "Un juez civil", "El Consejo directivo"], "e": "La Sala de revisión puede aprobar, improbar o f
