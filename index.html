forma expresamente que se actúa como contraparte y se otorgan condiciones de mercado.<\/li>\n<\/ul>\n\n<h2>11. Conflictos de interés<\/h2>\n<ul>\n<li>Hay conflicto cuando se debe escoger entre la utilidad propia y la del cliente, la de un vinculado y la del cliente, o la utilidad de la operación y la transparencia del mercado.<\/li>\n<li><b>Vinculados<\/b> al intermediario: accionistas o beneficiarios reales del <b>10 %<\/b> o más, sociedades donde el intermediario tenga el 10 % o más, la matriz, filiales y subordinadas, y los administradores.<\/li>\n<li>Los cuatro deberes son <b>abstención<\/b> (también en caso de duda), <b>revelación<\/b>, <b>obtener decisión<\/b> y <b>documentación<\/b>.<\/li>\n<li><b>Deberes de las PNV:<\/b> revelar sus partes relacionadas (cónyuge y parientes hasta 2.º de consanguinidad, 2.º de afinidad y único civil); informar sus inversiones personales; no tener como clientes a sus partes relacionadas; revelar las dádivas y no recibir las que afecten su objetividad.<\/li>\n<li>El operador de <b>posición propia<\/b> no puede hacer funciones de operador de terceros o de distribución, ni intermediar con clientes, salvo en el programa de creadores de mercado.<\/li>\n<\/ul>\n<div class=\"box trampa\"><span class=\"tag\">Caso: \"Una compra ciega\"<\/span>\n<p>El operador de terceros avisa a la posición propia sobre la orden de su cliente, la posición propia compra primero y luego le vende al cliente a precios preacordados. Aunque el cliente quede satisfecho, hay conflicto de interés mal administrado, violación de la reserva, falta de información sobre la contraparte y provecho indebido.<\/p><\/div>\n\n<h2>12. Conductas que afectan el mercado<\/h2>\n<ul>\n<li><b>Información privilegiada:<\/b> es concreta, no pública y relevante. Está prohibido usarla, suministrarla o recomendar con base en ella. No importa si el hecho finalmente ocurre, y los rumores de redes sociales <b>no<\/b> la hacen pública.<\/li>\n<li><b>Manipulación:<\/b> afectar la libre formación de precios, manipular la liquidez, aparentar ofertas o demandas, mover artificialmente el precio u obstaculizar la libre concurrencia. Tipologías: <b>spoofing, layering, collusion, quote stuffing y activación de órdenes<\/b>. La estabilización legítima, incluidos los contratos de liquidez, <b>no<\/b> es manipulación.<\/li>\n<li><b>Defraudación:<\/b> requiere provecho indebido, afectación a un tercero o al mercado, y que ocurra en la intermediación. El <b>churning<\/b> (operaciones excesivas para generar comisiones) es un ejemplo.<\/li>\n<li><b>Operaciones cruzadas<\/b> sobre renta variable: son legítimas, salvo acuerdos directos entre clientes sin aviso a la SFC y la bolsa con 1 mes de anticipación, acuerdos entre dos SCB en cuenta propia, o un mismo beneficiario real sin aviso de 5 días comunes.<\/li>\n<li><b>Exceso de mandato<\/b>: actuar fuera de las instrucciones del cliente. Un buen resultado no lo justifica (caso \"El Rally\").<\/li>\n<li><b>Prácticas inseguras:<\/b> garantizar rentabilidad, usar activos de clientes sin autorización, trasladar a otros los riesgos de la posición propia y ejercer cargos sin posesión ante la SFC.<\/li>\n<li>Los <b>administradores<\/b> de un emisor solo pueden negociar sus acciones sin fines especulativos y con autorización de la junta (2/3, sin el voto del solicitante) o de la asamblea (artículo 404 del Código de Comercio).<\/li>\n<\/ul>\n\n<h2>13. Delitos relacionados con el mercado<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Delito<\/th><th>Artículo del Código Penal<\/th><th>Prisión<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Uso indebido de información privilegiada<\/td><td>258<\/td><td>1 a 3 años (multa de 5 a 50 SMMLV)<\/td><\/tr>\n<tr><td>Manipulación fraudulenta de especies del RNVE<\/td><td>317<\/td><td>32 a 108 meses<\/td><\/tr>\n<tr><td>Pánico económico<\/td><td>302<\/td><td>32 a 144 meses<\/td><\/tr>\n<tr><td>Lavado de activos<\/td><td>323<\/td><td>10 a 30 años<\/td><\/tr>\n<tr><td>Estafa<\/td><td>246<\/td><td>32 a 144 meses<\/td><\/tr>\n<tr><td>Abuso de confianza<\/td><td>249<\/td><td>16 a 72 meses<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto: las cifras<\/span>\n<ul>\n<li>Comentarios a proyectos normativos: 15 días hábiles. Concepto del BanRep en divisas: 20 días hábiles.<\/li>\n<li>Caducidad: 3 años. Reincidencia: 3 años.<\/li>\n<li>Descargos: 10 + 10 días. Apelación: 8 días. Plazo para sancionar: 1 año por instancia. Acción judicial: 1 mes.<\/li>\n<li>Multa máxima: 5.470 UVT (natural) y 27.351 UVT (jurídica), o el doble del beneficio. Tope del ATA firmado por AMV: 1.368 y 2.735 UVT.<\/li>\n<li>Suspensión: de 1 día hábil a 10 años. Readmisión tras expulsión: 20 años.<\/li>\n<li>Colaboración: reducción del 40 % al 80 % (promotor, 40 % al 50 %).<\/li>\n<li>Vigencia: 3 años (directivo, 4). Revisión del SIAMV: mensual. Reporte de incumplimientos de certificación: 10 días hábiles.<\/li>\n<\/ul><\/div>\n<p class=\"fuente\">Fuente: Guía de estudio de Autorregulación de AMV (AAMV-002-2025). Contenido parafraseado con fines de estudio.<\/p>\n", "eco": "<span class=\"eyebrow\">Módulo 4 · 15 preguntas en el examen<\/span>\n<h1>Análisis económico y financiero<\/h1>\n<p>Este módulo tiene tres partes: los conceptos básicos de economía, la macroeconomía (inflación, tasas, tasa de cambio, crecimiento y quién decide cada cosa) y el análisis de los estados financieros de una empresa. Las preguntas suelen pedir el efecto de un cambio (\"si sube la tasa de interés, ¿qué pasa con…?\") o un cálculo corto de un indicador.<\/p>\n\n<h2>1. Conceptos básicos de economía<\/h2>\n<ul>\n<li><b>Microeconomía<\/b> estudia a los hogares y las empresas; <b>macroeconomía<\/b>, la economía en su conjunto (PIB, inflación, desempleo).<\/li>\n<li><b>Factores de producción:<\/b> tierra (recursos naturales), trabajo, capital y capacidad empresarial.<\/li>\n<li><b>Bienes:<\/b> normales (su demanda sube con el ingreso), inferiores (baja con el ingreso), sustitutos (sube el precio de uno y sube la demanda del otro), complementarios (sube el precio de uno y baja la demanda del otro).<\/li>\n<li><b>Bien Veblen:<\/b> se demanda más cuando es más caro, por estatus. <b>Bien Giffen:<\/b> bien inferior básico cuya demanda sube con el precio porque el hogar ya no alcanza para el sustituto.<\/li>\n<li><b>Ley de la demanda:<\/b> si sube el precio, baja la cantidad demandada. <b>Ley de la oferta:<\/b> si sube el precio, sube la cantidad ofrecida. El equilibrio es donde se cruzan.<\/li>\n<li><b>Estructuras de mercado:<\/b> competencia perfecta (muchos oferentes, nadie fija el precio), monopolio (un oferente), oligopolio (pocos), competencia monopolística (muchos con productos diferenciados).<\/li>\n<\/ul>\n<h3>Elasticidad precio de la demanda<\/h3>\n<p><span class=\"f\">Elasticidad = % cambio en la cantidad / % cambio en el precio<\/span> (en valor absoluto). Mayor que 1: <b>elástica<\/b>, el consumidor reacciona mucho. Menor que 1: <b>inelástica<\/b>, como los bienes de primera necesidad o sin sustitutos.<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>El precio de un producto sube 5 % y la cantidad demandada cae 15 %. Elasticidad = 15 / 5 = <b>3<\/b>: demanda elástica. Si la cantidad hubiera caído solo 2 %, sería 2 / 5 = 0,4: inelástica.<\/p><\/div>\n\n<h2>2. Actividad económica y cuentas nacionales<\/h2>\n<ul>\n<li><b>PIB:<\/b> valor de los bienes y servicios <b>finales<\/b> producidos dentro del país en un período. Las cuentas nacionales las elabora el <b>DANE<\/b>; la balanza de pagos, el <b>Banco de la República<\/b>.<\/li>\n<li><b>Tres formas de medirlo:<\/b> por el gasto <span class=\"f\">PIB = C + I + G + (X − M)<\/span>, por el ingreso (salarios, rentas, utilidades, impuestos netos) y por la producción (suma del valor agregado de cada sector).<\/li>\n<li><b>PIB nominal y real:<\/b> el nominal usa precios corrientes; el real, precios de un año base, y por eso mide el crecimiento \"de verdad\". Deflactor = PIB nominal / PIB real.<\/li>\n<li><b>PIB potencial y brecha del producto:<\/b> producir por encima del potencial genera presiones inflacionarias.<\/li>\n<li><b>Ciclo económico:<\/b> expansión, auge (pico), recesión (contracción) y recuperación (valle).<\/li>\n<li><b>Mercado laboral:<\/b> lo mide el DANE con la Gran Encuesta Integrada de Hogares (<b>GEIH<\/b>). <span class=\"f\">Tasa de desempleo = desocupados / fuerza de trabajo<\/span>.<\/li>\n<li><b>Ventaja comparativa:<\/b> un país gana especializándose en lo que produce con menor costo de oportunidad, aunque otro país sea mejor en todo (ventaja absoluta). La <b>OMC<\/b> regula el comercio entre países.<\/li>\n<\/ul>\n<h3>Tipos de indicadores<\/h3>\n<div class=\"tw\"><table>\n<thead><tr><th>Tipo<\/th><th>Qué hace<\/th><th>Ejemplos<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Adelantados (líderes)<\/td><td>Se mueven antes que la economía<\/td><td>Confianza del consumidor, licencias de construcción, curva de rendimientos, bolsa<\/td><\/tr>\n<tr><td>Coincidentes<\/td><td>Se mueven al tiempo<\/td><td>Producción industrial, ventas minoristas, PIB<\/td><\/tr>\n<tr><td>Rezagados<\/td><td>Se mueven después<\/td><td>Desempleo, inflación, tasas de los créditos<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>Ley de Okun:<\/b> relación inversa entre crecimiento del PIB y desempleo.<\/li>\n<li><b>Curva de Phillips:<\/b> relación inversa (de corto plazo) entre desempleo e inflación.<\/li>\n<li><b>Variables procíclicas<\/b> suben con la economía (consumo, inversión, importaciones); las <b>contracíclicas<\/b> se mueven al revés (desempleo).<\/li>\n<\/ul>\n\n<h2>3. Inflación<\/h2>\n<ul>\n<li>El <b>IPC<\/b> lo calcula el DANE cada mes con una canasta que sale de la Encuesta Nacional de Presupuestos de los Hogares (se actualiza más o menos cada 10 años). En la canasta actual, <b>alojamiento y servicios públicos<\/b> es la división de mayor peso.<\/li>\n<li>El <b>IPP<\/b> mide precios al productor (lo calcula el DANE) y suele anticipar al IPC. La <b>inflación básica<\/b> excluye los componentes más volátiles, como alimentos y regulados.<\/li>\n<li><b>Deflación:<\/b> caída generalizada de precios. <b>Desinflación:<\/b> la inflación sigue positiva pero baja. <b>Hiperinflación:<\/b> más de 50 % <b>al mes<\/b>. <b>Estanflación:<\/b> estancamiento con inflación alta.<\/li>\n<li>Inflación de demanda (la gente gasta más de lo que se produce) y de costos (suben insumos, salarios o el dólar).<\/li>\n<li><b>Tasa real:<\/b> <span class=\"f\">(1 + nominal) / (1 + inflación) − 1<\/span>. La <b>UVR<\/b> se ajusta con la inflación.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Un CDT paga 11 % efectivo anual y la inflación fue 5 %. Tasa real = 1,11 / 1,05 − 1 = <b>5,71 %<\/b>. La resta simple (6 %) es una aproximación, y en el examen la respuesta exacta es la de la fórmula.<\/p>\n<p>El IPC pasó de 120 a 126,6: inflación = 126,6 / 120 − 1 = <b>5,5 %<\/b>.<\/p><\/div>\n\n<h2>4. Política monetaria y teoría del dinero<\/h2>\n<p>La <b>Junta Directiva del Banco de la República<\/b> (7 miembros, presidida por el ministro de Hacienda, art. 371 y siguientes de la Constitución) es la autoridad monetaria, cambiaria y crediticia. Su mandato es mantener la capacidad adquisitiva de la moneda, en coordinación con la política económica general. Funciona con <b>inflación objetivo<\/b>, en tres niveles:<\/p>\n<ul>\n<li><b>Operativo:<\/b> la tasa de intervención y su efecto en las tasas de corto plazo.<\/li>\n<li><b>Intermedio:<\/b> la cantidad de dinero y las expectativas de inflación.<\/li>\n<li><b>Largo plazo:<\/b> estabilidad de precios, con meta de <b>3 % ± 1 punto<\/b>.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead><tr><th>Si el Banco de la República...<\/th><th>Efecto esperado<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Sube la tasa de política<\/td><td>Crédito más caro, menos demanda, menos inflación; tiende a revaluar el peso<\/td><\/tr>\n<tr><td>Baja la tasa de política<\/td><td>Crédito más barato, más demanda y actividad<\/td><\/tr>\n<tr><td>Hace operaciones de expansión (compra títulos, presta con repos)<\/td><td>Inyecta liquidez<\/td><\/tr>\n<tr><td>Sube el encaje<\/td><td>Los bancos prestan menos; baja el multiplicador del dinero<\/td><\/tr>\n<tr><td>Compra dólares y luego \"esteriliza\"<\/td><td>Retira los pesos que emitió (vende TES o hace contracción) para que no suba la inflación ni baje la tasa de corto plazo<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Teoría cuantitativa:<\/b> <span class=\"f\">M × V = P × Y<\/span>. Si la velocidad es estable, el crecimiento del dinero ≈ inflación + crecimiento real. Ejemplo: el dinero crece 10 % y el PIB real 3 %, entonces la inflación esperada es cerca de <b>7 %<\/b>. Friedman: \"la inflación es siempre un fenómeno monetario\".<\/p>\n<p>Tasas de referencia: el <b>IBR<\/b> (mercado monetario, incluido el overnight), la <b>DTF<\/b> (promedio de captación de CDT a 90 días). La SFC certifica el interés bancario corriente; la <b>tasa de usura<\/b> es 1,5 veces ese valor.<\/p>\n\n<h2>5. Política fiscal<\/h2>\n<p>La maneja el Gobierno a través del <b>Ministerio de Hacienda<\/b> con el gasto y los impuestos. Expansiva: más gasto o menos impuestos; contractiva: lo contrario. El ahorro del gobierno es <span class=\"f\">Sg = T − G − TR<\/span> (impuestos menos gasto menos transferencias); si es negativo hay <b>déficit fiscal<\/b>, que se financia con deuda, principalmente <b>TES<\/b>. La <b>regla fiscal<\/b> limita el déficit y la deuda del Gobierno central.<\/p>\n\n<h2>6. Sector externo y tasa de cambio<\/h2>\n<ul>\n<li><b>Balanza de pagos:<\/b> cuenta corriente (bienes, servicios, rentas y transferencias como las remesas) y cuenta financiera (inversión extranjera directa y de portafolio, préstamos, reservas).<\/li>\n<li>Un <b>déficit en cuenta corriente<\/b> se financia con entradas de capital o reservas. El <b>capital golondrina<\/b> es inversión de corto plazo que entra y sale rápido buscando rentabilidad.<\/li>\n<li><b>Regímenes cambiarios:<\/b> fijo, bandas, flotación sucia y flexible. Colombia tiene <b>tasa de cambio flexible<\/b> desde 1999. La <b>TRM<\/b> la calcula y certifica la SFC.<\/li>\n<li><b>Devaluación del peso:<\/b> beneficia a exportadores; perjudica a importadores y a quienes deben en dólares.<\/li>\n<li>Entrada de dólares (inversión extranjera, petróleo caro) presiona la <b>revaluación<\/b>. Salida de capitales (por ejemplo, si la Reserva Federal sube tasas) presiona la devaluación.<\/li>\n<li><b>Tasa de cambio real:<\/b> compara precios entre países ya convertidos a la misma moneda. Si sube, los productos nacionales se vuelven más baratos para el exterior (más competitividad). El BanRep publica el <b>ITCR<\/b>.<\/li>\n<li><b>Paridad de tasas de interés:<\/b> la diferencia de tasas entre dos países se compensa con la devaluación esperada.<\/li>\n<li>Una baja en la <b>calificación soberana<\/b> sube las tasas de los TES y baja sus precios.<\/li>\n<\/ul>\n<div class=\"box trampa\"><span class=\"tag\">Trampa típica<\/span>\n<p>Tasas de interés y precios de los bonos se mueven en sentido contrario. Si una pregunta dice \"suben las tasas\", el precio de los TES baja. Un bono que paga 100 en un año, descontado al 8 %, vale 100 / 1,08 = 92,59.<\/p><\/div>\n<p>La <b>curva de rendimientos<\/b> normal tiene pendiente positiva. Una curva <b>invertida<\/b> (corto plazo más alto) suele anticipar una desaceleración; una curva <b>plana<\/b> indica incertidumbre sobre el rumbo.<\/p>\n\n<h2>7. Mercados y autoridades<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Mercado<\/th><th>Qué se negocia<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Monetario<\/td><td>Recursos a menos de 1 año: interbancarios, repos, simultáneas, CDT cortos<\/td><\/tr>\n<tr><td>Capitales<\/td><td>Financiación de largo plazo: bonos, acciones, TES largos<\/td><\/tr>\n<tr><td>Cambiario<\/td><td>Divisas; régimen en la Resolución Externa 1 de 2018 del BanRep<\/td><\/tr>\n<tr><td>Derivados<\/td><td>Contratos cuyo valor depende de otro activo (forwards, futuros, opciones, swaps)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"tw\"><table>\n<thead><tr><th>Entidad<\/th><th>Papel<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Banco de la República<\/td><td>Política monetaria, cambiaria y crediticia; reservas internacionales; emisor<\/td><\/tr>\n<tr><td>Ministerio de Hacienda<\/td><td>Política fiscal, deuda pública (TES) y regulación financiera (con la URF)<\/td><\/tr>\n<tr><td>Superintendencia Financiera<\/td><td>Inspección, vigilancia y control del sector financiero y de valores<\/td><\/tr>\n<tr><td>Fogafín<\/td><td>Seguro de depósitos (hasta COP 50 millones por persona y entidad)<\/td><\/tr>\n<tr><td>DANE<\/td><td>Estadísticas: PIB, IPC, IPP, desempleo<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>8. Estados financieros<\/h2>\n<p>Bajo NIIF, los estados básicos son: <b>situación financiera<\/b> (balance), <b>resultados<\/b>, <b>flujos de efectivo<\/b>, <b>cambios en el patrimonio<\/b> y las notas. La contabilidad se lleva por <b>causación<\/b>: los hechos se registran cuando ocurren, no cuando se paga o se cobra.<\/p>\n<ul>\n<li><b>Capex<\/b> es inversión en activos de largo plazo (va al balance y se deprecia); <b>opex<\/b> es gasto de operación (va a resultados).<\/li>\n<li><b>Orden del estado de resultados:<\/b> ventas − costo de ventas = utilidad bruta; − gastos operacionales = utilidad operacional (EBIT); − intereses = utilidad antes de impuestos; − impuestos = utilidad neta. <span class=\"f\">EBITDA = EBIT + depreciaciones y amortizaciones<\/span>.<\/li>\n<li><b>Flujo de efectivo:<\/b> operación (cobros a clientes, pagos a proveedores e impuestos), inversión (compra o venta de activos fijos) y financiación (préstamos, dividendos, emisión de acciones).<\/li>\n<li><b>Análisis vertical:<\/b> cada cuenta como % del total de su estado. <b>Horizontal:<\/b> la variación de una cuenta entre dos períodos (por ejemplo, de 700 a 900 es +28,6 %).<\/li>\n<\/ul>\n\n<h2>9. Indicadores financieros<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Grupo<\/th><th>Indicador<\/th><th>Fórmula<\/th><\/tr><\/thead>\n<tbody>\n<tr><td rowspan=\"3\">Liquidez<\/td><td>Razón corriente<\/td><td>Activo corriente / pasivo corriente<\/td><\/tr>\n<tr><td>Prueba ácida<\/td><td>(Activo corriente − inventarios) / pasivo corriente<\/td><\/tr>\n<tr><td>Capital de trabajo neto<\/td><td>Activo corriente − pasivo corriente<\/td><\/tr>\n<tr><td rowspan=\"4\">Endeudamiento<\/td><td>Endeudamiento<\/td><td>Pasivo total / activo total (más de 60 % suele verse alto)<\/td><\/tr>\n<tr><td>Apalancamiento<\/td><td>Pasivo total / patrimonio<\/td><\/tr>\n<tr><td>Multiplicador del capital<\/td><td>Activo total / patrimonio<\/td><\/tr>\n<tr><td>Deuda financiera / ingresos<\/td><td>Obligaciones financieras / ventas<\/td><\/tr>\n<tr><td rowspan=\"2\">Cobertura<\/td><td>Razón de cobertura de intereses<\/td><td><b>EBIT<\/b> / gastos financieros (se espera al menos 1,5)<\/td><\/tr>\n<tr><td>Cobertura ajustada<\/td><td><b>EBITDA<\/b> / gastos financieros<\/td><\/tr>\n<tr><td rowspan=\"4\">Actividad<\/td><td>Rotación de cartera (días)<\/td><td>Cuentas por cobrar × 365 / ventas a crédito<\/td><\/tr>\n<tr><td>Rotación de inventarios (días)<\/td><td>Inventario × 365 / costo de ventas<\/td><\/tr>\n<tr><td>Rotación de proveedores (días)<\/td><td>Cuentas por pagar × 365 / compras (o costo de ventas)<\/td><\/tr>\n<tr><td>Ciclo de efectivo<\/td><td>Días de cartera + días de inventario − días de proveedores<\/td><\/tr>\n<tr><td rowspan=\"5\">Rentabilidad<\/td><td>Margen bruto<\/td><td>Utilidad bruta / ventas<\/td><\/tr>\n<tr><td>Margen operacional / EBITDA<\/td><td>EBIT / ventas; EBITDA / ventas<\/td><\/tr>\n<tr><td>Margen neto<\/td><td>Utilidad neta / ventas<\/td><\/tr>\n<tr><td>ROA<\/td><td>Utilidad neta / activos<\/td><\/tr>\n<tr><td>ROE<\/td><td>Utilidad neta / patrimonio<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>El <b>análisis DuPont<\/b> descompone el ROE en margen neto × rotación de activos × multiplicador del capital. Si la empresa tiene deuda, el multiplicador es mayor que 1 y por eso el <b>ROE es mayor que el ROA<\/b>. Los <b>covenants<\/b> son compromisos en un crédito (por ejemplo, mantener una cobertura mínima) cuyo incumplimiento permite al banco exigir el pago.<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Una empresa tiene activo corriente de 500, pasivo corriente de 250, inventarios de 100, activo total de 1.500, patrimonio de 800, EBIT de 240, gastos financieros de 60 y utilidad neta de 120.<\/p>\n<ul>\n<li>Razón corriente = 500 / 250 = <b>2,0<\/b>; prueba ácida = 400 / 250 = <b>1,6<\/b><\/li>\n<li>Endeudamiento = 700 / 1.500 = <b>46,7 %<\/b>; multiplicador = 1.500 / 800 = <b>1,875<\/b><\/li>\n<li>Cobertura de intereses = 240 / 60 = <b>4 veces<\/b><\/li>\n<li>ROA = 120 / 1.500 = <b>8 %<\/b>; ROE = 120 / 800 = <b>15 %<\/b> (= 8 % × 1,875)<\/li>\n<\/ul>\n<p>Si cobra a 120 días, rota inventario cada 150 y paga a 60, el ciclo de efectivo es 120 + 150 − 60 = <b>210 días<\/b>. Cobrar más rápido acorta el ciclo y libera caja.<\/p><\/div>\n\n<h2>10. Solvencia de los bancos (Basilea III)<\/h2>\n<ul>\n<li><b>Solvencia total:<\/b> patrimonio técnico / activos ponderados por riesgo de mínimo <b>9 %<\/b>.<\/li>\n<li><b>Patrimonio básico ordinario:<\/b> mínimo <b>4,5 %<\/b>; patrimonio básico (con el adicional): mínimo <b>6 %<\/b>.<\/li>\n<li><b>Colchones:<\/b> de conservación <b>1,5 %<\/b> y, para entidades sistémicas, <b>1 %<\/b> adicional.<\/li>\n<li><b>Apalancamiento:<\/b> patrimonio básico / activos sin ponderar de mínimo <b>3 %<\/b>.<\/li>\n<li>El <b>capital económico<\/b> es el que la entidad estima que necesita para cubrir pérdidas inesperadas con su propio modelo; el <b>regulatorio<\/b> es el que exige la norma.<\/li>\n<li>El capital mínimo para constituir una entidad lo fija el EOSF (art. 80) en pesos de 2002, ajustados cada año por el IPC.<\/li>\n<\/ul>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto<\/span>\n<ul>\n<li>PIB, IPC, IPP y desempleo: DANE. Balanza de pagos y tasa de política: BanRep. TRM e interés bancario corriente: SFC. Seguro de depósitos: Fogafín.<\/li>\n<li>Meta de inflación: 3 % ± 1. Hiperinflación: más de 50 % al mes. Usura = 1,5 × interés bancario corriente.<\/li>\n<li>Sube la tasa: menos inflación, bonos más baratos. Devaluación ayuda a exportadores.<\/li>\n<li>M × V = P × Y. Okun: PIB y desempleo inversos. Phillips: desempleo e inflación inversos.<\/li>\n<li>Cobertura de intereses usa EBIT; la ajustada usa EBITDA.<\/li>\n<li>Ciclo de efectivo = cartera + inventario − proveedores.<\/li>\n<li>Solvencia 9 %, básico ordinario 4,5 %, apalancamiento 3 %.<\/li>\n<\/ul><\/div>\n\n<p class=\"fuente\">Fuente: Guía de estudio de Análisis económico y financiero de AMV (AAEE-002-2025). Contenido parafraseado con fines de estudio; los ejemplos numéricos son propios.<\/p>\n", "etica": "<span class=\"eyebrow\">Módulo 3 · 15 preguntas en el examen<\/span>\n<h1>Ética e integridad<\/h1>\n<p>Las preguntas de este módulo suelen ser casos: un operador hace algo y usted debe identificar qué deber incumple o qué debería hacer. La clave es reconocer unos pocos principios y saber aplicarlos.<\/p>\n\n<h2>1. Ética en la práctica<\/h2>\n<ul>\n<li><b>Ética y ley no son lo mismo.<\/b> Se puede actuar con poca ética sin violar la ley. Pero quien viola la ley actúa de forma ilegal y poco ética a la vez.<\/li>\n<li>La ética es \"hacer lo correcto aunque nadie esté mirando\". No hay un estándar más flexible para el trabajo que para la vida personal.<\/li>\n<li>El beneficio de ignorar la ética parece mayor solo en el corto plazo: el resultado probable es la sanción social o penal.<\/li>\n<\/ul>\n<div class=\"box clave\"><span class=\"tag\">La prueba de la guía oficial<\/span>\n<p>Antes de actuar, pregúntese si lo que va a hacer es <b>honesto, franco, transparente y justo<\/b>. Los ejemplos de la guía (quedarse con un celular encontrado, una bebida gratis de una máquina o un producto que no le cobraron) parecen \"suerte\", pero fallan la prueba. Otra prueba útil: ¿cómo reaccionaría su familia si se enterara?<\/p><\/div>\n\n<h2>2. Ética en los servicios financieros<\/h2>\n<ul>\n<li><b>Prelación de intereses:<\/b> primero el <b>cliente<\/b>, luego la <b>entidad<\/b> y al final el interés <b>personal<\/b>.<\/li>\n<li>Deberes mínimos frente al cliente: lealtad; confidencialidad de clientes actuales, anteriores y potenciales; no incurrir en deshonestidad, fraude o engaño; y revelar los conflictos de interés.<\/li>\n<li>La información del cliente solo se revela si se relaciona con actividades ilegales y una autoridad la pide, si la regulación lo exige o si el cliente lo autoriza expresamente.<\/li>\n<li>Un producto financiero no se puede \"probar\" como un carro: su desempeño se conoce con el tiempo. Por eso el vendedor ético explica riesgos, estructura, si el rendimiento es real o estimado, su comisión y los costos.<\/li>\n<li>Señales de alerta de un vendedor antiético: \"es una oportunidad limitada, decida ya\", \"nadie me había preguntado eso\", \"yo tampoco entiendo, pero tenemos expertos\".<\/li>\n<li>Se espera una actitud <b>propositiva<\/b>: denunciar los actos incorrectos de otros por los canales institucionales o ante AMV.<\/li>\n<\/ul>\n\n<h2>3. Evaluando dilemas<\/h2>\n<ul>\n<li><b>Código de ética:<\/b> principios, valores y normas generales. <b>Código de conducta:<\/b> reglas concretas, procedimientos, canales de denuncia y sanciones. Hoy se combinan en códigos de ética y conducta.<\/li>\n<li>El <b>Decreto 2555<\/b> exige que el código incluya: valores y directrices de conducta, procedimientos para conflictos de interés, mecanismos contra el uso de información privilegiada, órganos de monitoreo y consecuencias por incumplir.<\/li>\n<li>El <b>Reglamento de AMV<\/b> exige actuar como experto prudente y diligente, mantener la competencia libre y justa y separar física y operacionalmente las áreas con posibles conflictos. La <b>junta directiva<\/b> fija las políticas sobre conflictos.<\/li>\n<li><b>IOSCO<\/b> recomienda cultura ética, formación, modelos para resolver dilemas, actualizar el código y canales de denuncia. El <b>CISI<\/b> exige a sus miembros la evaluación <i>Integrity Matters<\/i>.<\/li>\n<li>Los usos y costumbres son un precedente peligroso. Ante la duda, consulte con colegas confiables, embajadores de ética o cumplimiento.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead><tr><th>Marco ético<\/th><th>Marco de cumplimiento<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Principios generales y valores<\/td><td>Reglas de conducta y procedimientos<\/td><\/tr>\n<tr><td>Normas aspiracionales, discrecionales<\/td><td>Deberes de obligatorio cumplimiento, instancias y sanciones<\/td><\/tr>\n<tr><td>Verbos: promover, fomentar, valorar, orientar<\/td><td>Verbos: abstenerse, evitar, informar, revelar, no acceder<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>4. Los tres casos de la guía oficial<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Caso<\/th><th>Dilema<\/th><th>Qué hacer<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Las formas en los negocios<\/td><td>En pandemia, el cliente autoriza por teléfono a la asesora a firmar por él documentos que la política exige firmar en físico.<\/td><td>No firmar por él, no aceptar firma digital ni firmar después. Ofrecer un medio seguro para que firme en físico. <b>Adherirse a las políticas internas.<\/b><\/td><\/tr>\n<tr><td>La información de los clientes, un tesoro a proteger<\/td><td>Le ofrecen un gran cargo a un comercial si se lleva los clientes de su firma actual. El código no lo prohíbe expresamente.<\/td><td>Explicar al nuevo empleador que no puede llevárselos: los clientes son de la entidad y su información está protegida.<\/td><\/tr>\n<tr><td>Reconociendo un buen servicio<\/td><td>Un cliente con enfermedad terminal quiere regalarle 50 millones en efectivo a su asesora.<\/td><td>Rechazar el regalo, informar al área de ética e invitar al cliente a evaluar el servicio por los canales de la entidad.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"nota\">El temario de julio de 2024 menciona casos de la edición anterior de la guía (\"Una pila de problemas\", \"Una nube de humo\", \"Entrega del sobre\"). La guía vigente los reemplazó por estos tres, pero la lógica es la misma: políticas internas por encima de la conveniencia, información del cliente protegida y regalos que comprometen la objetividad.<\/p>\n\n<h2>5. Los deberes que más se evalúan<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Deber<\/th><th>Qué exige<\/th><th>Ejemplo de incumplimiento<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Lealtad<\/td><td>Obrar con integridad y poner el interés del cliente por encima del propio<\/td><td>Rotar la cuenta del cliente para ganar comisiones<\/td><\/tr>\n<tr><td>Información<\/td><td>Dar información clara, completa, veraz y oportuna, incluidos riesgos y costos<\/td><td>Decir que un fondo de acciones \"nunca pierde\"<\/td><\/tr>\n<tr><td>Documentación<\/td><td>Registrar todas las órdenes y operaciones<\/td><td>Aceptar una orden verbal sin registrarla<\/td><\/tr>\n<tr><td>Reserva<\/td><td>No revelar información de los clientes sin autorización<\/td><td>Comentar las posiciones de un cliente en una cena<\/td><\/tr>\n<tr><td>Separación de activos<\/td><td>Mantener separados los recursos de cada cliente y los de la entidad<\/td><td>Usar dinero de un cliente para cubrir la pérdida de otro<\/td><\/tr>\n<tr><td>Mejor ejecución<\/td><td>Ejecutar las órdenes en las mejores condiciones posibles<\/td><td>Dar a un cliente un precio peor para favorecer a otro<\/td><\/tr>\n<tr><td>Asesoría<\/td><td>Recomendar lo adecuado al perfil del cliente<\/td><td>Recomendar derivados a un cliente conservador<\/td><\/tr>\n<tr><td>Diligencia<\/td><td>Actuar con el cuidado y el conocimiento de un experto<\/td><td>Recomendar un producto que el asesor no entiende<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>6. Conflictos de interés<\/h2>\n<p>Hay conflicto de interés cuando quien debe decidir tiene intereses incompatibles, por ejemplo el propio y el del cliente. La conducta correcta es <b>identificarlo, revelarlo y gestionarlo<\/b> según las políticas de la entidad, o <b>abstenerse<\/b>. Si no puede evitarse, prevalece el interés del cliente.<\/p>\n<p>Según la guía, hay conflicto cuando hay que escoger entre: (1) la utilidad propia o de la entidad y la del cliente; (2) la de un vinculado y la del cliente; (3) la del fondo administrado y la de otro cliente, la entidad o el profesional; o (4) la de una operación y la transparencia del mercado.<\/p>\n<ul>\n<li>Tener varios roles no es en sí un conflicto. El conflicto existe cuando hay que <b>decidir<\/b> y no se pueden favorecer objetivamente todos los intereses.<\/li>\n<li>Al detectarlo: revelarlo al área competente (gestión humana, cumplimiento o auditoría), abstenerse de decidir y <b>no acceder ni entregar más información<\/b>.<\/li>\n<li>Ejemplo de la guía: la empleada de compras cuyo esposo es oferente debe apartarse de la decisión.<\/li>\n<\/ul>\n<p>Fuentes comunes de conflicto: bonificaciones por vender ciertos productos, regalos de clientes o emisores, inversiones personales en los valores que se recomiendan, relaciones personales con clientes, operaciones cruzadas entre clientes y operaciones entre la entidad y sus clientes.<\/p>\n<div class=\"box clave\"><span class=\"tag\">Controles típicos<\/span>\n<ul>\n<li><b>Murallas chinas:<\/b> barreras de información entre áreas, como banca de inversión y negociación.<\/li>\n<li><b>Listas restringidas<\/b> de valores que los empleados no pueden negociar.<\/li>\n<li><b>Políticas de operaciones personales:<\/b> autorización previa, plazos mínimos de tenencia y reportes.<\/li>\n<li><b>Políticas de regalos<\/b> con límites y obligación de reportar.<\/li>\n<\/ul><\/div>\n\n<h2>7. Información pública, confidencial y privilegiada<\/h2>\n<ul>\n<li><b>Pública:<\/b> disponible y de fácil acceso para cualquiera, aunque se haya filtrado. Úsela con seriedad y, si se conoció por un incumplimiento, no la difunda.<\/li>\n<li><b>Confidencial:<\/b> de alto impacto, solo para quien la necesita; protegida por la <b>reserva bancaria y bursátil<\/b>.<\/li>\n<li><b>Privilegiada:<\/b> la definición sigue.<\/li>\n<\/ul>\n<p>Ante la duda, trate la información como confidencial y privilegiada.<\/p>\n<p>La privilegiada es información <b>concreta<\/b>, <b>no pública<\/b> y que <b>podría influir en el precio<\/b> de un valor si se conociera. Quien la tiene debe:<\/p>\n<ul>\n<li>abstenerse de negociar con base en ella;<\/li>\n<li>no revelarla a terceros;<\/li>\n<li>no recomendar operaciones basadas en ella.<\/li>\n<\/ul>\n<p>Deja de ser privilegiada cuando se divulga al mercado por los canales oficiales, como el mecanismo de información relevante de la SFC.<\/p>\n<div class=\"box trampa\"><span class=\"tag\">Trampa típica<\/span>\n<p>No hace falta negociar para cometer la falta. Recomendar a un amigo que venda \"porque mañana sale una mala noticia\" ya es suministrar información privilegiada.<\/p><\/div>\n\n<h2>8. Abuso de mercado y manipulación<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Conducta<\/th><th>En qué consiste<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Front running<\/td><td>Operar por cuenta propia antes que la orden de un cliente que se conoce<\/td><\/tr>\n<tr><td>Piggybacking<\/td><td>Copiar en la cuenta personal las operaciones de un cliente<\/td><\/tr>\n<tr><td>Operaciones ficticias<\/td><td>Comprar y vender entre cuentas del mismo beneficiario para aparentar volumen o fijar precios<\/td><\/tr>\n<tr><td>Spoofing<\/td><td>Ingresar órdenes que no se piensan ejecutar para aparentar oferta o demanda<\/td><\/tr>\n<tr><td>Difusión de rumores<\/td><td>Divulgar información falsa o engañosa para mover precios<\/td><\/tr>\n<tr><td>Churning<\/td><td>Rotación excesiva de la cuenta del cliente para generar comisiones<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>9. Principios del Decreto 2555 y leyes complementarias<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Principio (art. 7.6.1.1.3)<\/th><th>Idea clave<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Transparencia<\/td><td>Formación de precios en igualdad de condiciones, con información accesible, oportuna, completa y clara.<\/td><\/tr>\n<tr><td>Confidencialidad y reserva<\/td><td>No revelar información confidencial que, al hacerse pública, influiría en el mercado.<\/td><\/tr>\n<tr><td>Uso adecuado de información<\/td><td>No usar información privilegiada para obtener ventaja.<\/td><\/tr>\n<tr><td>Lealtad<\/td><td>Abstenerse de decidir en conflicto, de dar información ficticia o inexacta, de inducir a error y de operaciones no representativas del mercado.<\/td><\/tr>\n<tr><td>Profesionalismo<\/td><td>Orientar y aconsejar al cliente con información seria, completa y objetiva para la mejor ejecución.<\/td><\/tr>\n<tr><td>Respeto de la ley<\/td><td>Cumplir los deberes de información y comunicar cualquier circunstancia que cambie la voluntad del cliente.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>Ley 1748 de 2014 (transparencia):<\/b> informar la tasa efectivamente pagada o recibida y todos los cargos. El <b>Decreto 1854 de 2015<\/b> creó el <b>Valor Total Unificado (VTU)<\/b>: un solo valor, en porcentaje efectivo anual y en pesos, que permite comparar ofertas.<\/li>\n<li><b>Ley 1778 de 2016 (antisoborno):<\/b> sanciona a la persona jurídica por el <b>soborno transnacional<\/b> a servidores públicos extranjeros, es decir, a la parte <b>oferente<\/b>. Le dio facultades a la <b>Superintendencia de Sociedades<\/b>, que exige programas de ética empresarial. Actores clave: revisor fiscal, oficial de cumplimiento, junta directiva, presidente y equipo ejecutivo.<\/li>\n<li><b>Circular Externa 008 de 2024 de la SFC:<\/b> fortalece el control interno de las vigiladas, incluido el tono y la cultura ética.<\/li>\n<\/ul>\n\n<h2>10. Cómo resolver un caso ético<\/h2>\n<ol>\n<li>Identifique a quién perjudica la conducta: al cliente, al mercado o a la entidad.<\/li>\n<li>Busque si el profesional se beneficia a costa de otro.<\/li>\n<li>Relacione la conducta con el deber de la tabla.<\/li>\n<li>Para las preguntas de \"¿qué debe hacer?\", la respuesta casi siempre es abstenerse, revelar o reportar por los canales internos (cumplimiento).<\/li>\n<\/ol>\n<div class=\"box ej\"><span class=\"tag\">Caso resuelto<\/span>\n<p>Un jefe ordena a un operador hacer operaciones entre dos cuentas de un mismo cliente al cierre para subir el precio. ¿Qué debe hacer el operador?<\/p>\n<p><b>Abstenerse y reportar.<\/b> Es manipulación. Seguir órdenes no exime de responsabilidad, porque AMV sanciona a las personas naturales vinculadas, no solo a la entidad.<\/p><\/div>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto<\/span>\n<ul>\n<li>Conflicto de interés: identificar, revelar, gestionar o abstenerse.<\/li>\n<li>Información privilegiada: concreta, no pública, afecta el precio.<\/li>\n<li>Órdenes de clientes antes que las propias.<\/li>\n<li>Nunca prometer rentabilidades en productos de riesgo.<\/li>\n<li>Ante la duda, consultar a cumplimiento antes de actuar.<\/li>\n<li>Prueba: honesto, franco, transparente y justo. Prelación: cliente, entidad, persona.<\/li>\n<li>VTU: Ley 1748/2014 y Decreto 1854/2015. Soborno transnacional: Ley 1778/2016 y Supersociedades.<\/li>\n<\/ul><\/div>\n\n<p class=\"fuente\">Fuente: Guía de estudio de Ética e integridad de AMV (ETIC-001-2025, 2.ª ed.). Contenido parafraseado con fines de estudio.<\/p>\n", "fic": "<span class=\"eyebrow\">Módulo 8 · 20 preguntas en el examen<\/span>\n<h1>Fondos de inversión colectiva<\/h1>\n<p>Un fondo de inversión colectiva (FIC) reúne dinero u otros activos de un número plural de personas para gestionarlos de forma colectiva y obtener resultados también colectivos. Su régimen está en la Parte 3 del Decreto 2555 de 2010. Pueden administrarlos solo las <b>sociedades fiduciarias, las sociedades comisionistas de bolsa y las sociedades administradoras de inversión<\/b>, vigiladas por la SFC.<\/p>\n\n<h2>1. Rasgos básicos<\/h2>\n<ul>\n<li><b>Segregación:<\/b> los activos del FIC son un patrimonio independiente y separado del de la administradora y de los demás negocios que esta maneje. Si la administradora quiebra, los activos del fondo no responden por sus deudas.<\/li>\n<li>El inversionista es dueño de <b>unidades<\/b> (participaciones), no de cada activo. Los resultados se reparten a diario y en proporción.<\/li>\n<li><b>Patrimonio mínimo:<\/b> 39.500 UVT (hoy expresado en UVB, por la Ley 2294 de 2023). Hay un año para alcanzarlo, prorrogable una vez hasta seis meses con aprobación de la SFC.<\/li>\n<li>La administradora asume <b>obligaciones de medio, no de resultado<\/b> y responde hasta por <b>culpa leve<\/b>. No puede garantizar rentabilidad.<\/li>\n<li>Si el reglamento no dice otra cosa, el FIC es <b>abierto<\/b>.<\/li>\n<\/ul>\n\n<h2>2. FIC abiertos y cerrados<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th><\/th><th>Abierto<\/th><th>Cerrado<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Redención<\/td><td>En cualquier momento<\/td><td>Al final del plazo del fondo<\/td><\/tr>\n<tr><td>Permanencia<\/td><td>Puede pactarse; la penalidad por retiro anticipado es ingreso del FIC<\/td><td>Pueden fijarse plazos mínimos de 30 días comunes para redenciones<\/td><\/tr>\n<tr><td>Máximo por inversionista<\/td><td><b>10 %<\/b> del valor del fondo<\/td><td><b>60 %<\/b> del valor del fondo<\/td><\/tr>\n<tr><td>Aportes<\/td><td>Solo en dinero<\/td><td>Dinero, en especie o compromisos de suscripción si el reglamento lo permite<\/td><\/tr>\n<tr><td>Participaciones<\/td><td>No son valores ni negociables<\/td><td>Son valores; pueden inscribirse en el RNVE<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Los límites por inversionista (incluidas cuentas ómnibus) no aplican en el <b>primer año<\/b> de operación. Incumplirlos después es causal de liquidación, corregible en máximo dos meses.<\/p>\n\n<h2>3. FIC según su finalidad<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Tipo<\/th><th>Claves<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Del mercado monetario<\/td><td>Abierto sin pacto. Renta fija en pesos con grado de inversión o deuda pública (Nación, BanRep, Fogafín). Vencimiento promedio ponderado máximo de <b>365 días<\/b>. Redención al día hábil siguiente.<\/td><\/tr>\n<tr><td>Capital privado (FCP)<\/td><td>Cerrado. Al menos <b>2/3<\/b> de los aportes en activos distintos de valores inscritos en el RNVE (hasta 100 % si su objeto son activos inmobiliarios). Mínimo dos inversionistas. Puede emitir bonos. No requiere autorización previa de la SFC. Un cliente inversionista puede comprometer máximo el <b>20 %<\/b> de sus ingresos anuales o de su patrimonio, el mayor.<\/td><\/tr>\n<tr><td>Bursátil (ETF)<\/td><td>Replica un índice con los activos de la canasta o derivados estandarizados. Cotiza en tiempo real. No se clasifica como abierto ni cerrado y no está obligado a ficha técnica ni extractos.<\/td><\/tr>\n<tr><td>Inmobiliario (FICI)<\/td><td>Cerrado. Mínimo <b>75 %<\/b> de los activos en inmuebles y activos relacionados. Permanencia mínima de <b>un año<\/b>. Puede endeudarse hasta <b>2 veces<\/b> su patrimonio. Dos inversionistas mínimo tras seis meses.<\/td><\/tr>\n<tr><td>Del exterior<\/td><td>Opera en otra jurisdicción con un supervisor que tiene convenio con la SFC, y este sigue supervisándolo.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Tipologías de FCP:<\/b> adquisición y crecimiento, capital emprendedor (etapa temprana, tecnología), impacto, inmobiliario, infraestructura y recursos naturales. Los fondos de deuda privada los complementan.<\/p>\n<p><b>Familias de FIC:<\/b> la SFC autoriza la familia y su primer fondo; los siguientes solo se informan dentro de los 5 días siguientes a su entrada en funcionamiento. Una familia no puede contener otras familias y cada FIC conserva su patrimonio separado.<\/p>\n\n<h2>4. Unidades y valor del fondo<\/h2>\n<p class=\"f\">Valor de la unidad = (activos − pasivos) / número de unidades<\/p>\n<ul>\n<li>El patrimonio cambia por aportes y retiros, y por la variación de mercado de los activos.<\/li>\n<li>Al aportar se reciben <span class=\"f\">aporte / valor de la unidad<\/span> unidades.<\/li>\n<li><b>Participaciones diferenciales:<\/b> bajo un mismo reglamento, tipos de participación con condiciones distintas (comisión, aportes, redenciones), cada uno con su propio valor de unidad.<\/li>\n<li>La rentabilidad es la variación del valor de la unidad, ya neta de comisiones y gastos.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Activos COP 52.000 millones, pasivos COP 2.000 millones y 4.000.000 de unidades: V = 50.000.000.000 / 4.000.000 = <b>COP 12.500<\/b>.<\/p>\n<p>Un inversionista aporta COP 20.000.000 y recibe 1.600 unidades. Si la unidad sube a COP 13.250, su inversión vale 1.600 × 13.250 = <b>COP 21.200.000<\/b>, una rentabilidad del <b>6 %<\/b>.<\/p><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: pacto de permanencia<\/span>\n<p>Pacto de 90 días con penalidad de 2 %. Un inversionista retira COP 10.000.000 a los 60 días: paga 2 % × 10.000.000 = <b>COP 200.000<\/b>, que quedan en el fondo.<\/p><\/div>\n\n<h2>5. Órganos del FIC<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Órgano<\/th><th>Claves<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Junta directiva (de la administradora)<\/td><td>Define políticas; decide gestión directa o por gestor externo; designa al custodio; fija la valoración; define conflictos de interés; aprueba manuales (SARLAFT, código de conducta, control interno); nombra al gerente y su suplente; autoriza emisiones de bonos; elige al comité de inversiones si no hay gestor externo.<\/td><\/tr>\n<tr><td>Gerente<\/td><td>Persona natural de dedicación exclusiva, con suplente, inscrita en el RNPMV. Ejecuta la gestión como experto prudente y diligente. Puede gerenciar varios FIC.<\/td><\/tr>\n<tr><td>Comité de inversiones<\/td><td>Analiza inversiones y emisores; define cupos y políticas de compra y venta. Sus miembros son administradores (art. 22, Ley 222 de 1995). Puede ser uno solo para todos los FIC.<\/td><\/tr>\n<tr><td>Revisor fiscal<\/td><td>El de la administradora, del gestor externo o del distribuidor especializado, con informes separados para el FIC. Puede contratarse además un auditor externo.<\/td><\/tr>\n<tr><td>Asamblea de inversionistas<\/td><td>Quórum: <b>51 %<\/b> de las participaciones. Decide con la mitad más una de las presentes (el reglamento puede subirla hasta el 70 %). Convocan: la administradora, el gestor externo, el revisor fiscal, inversionistas con <b>25 %<\/b> o la SFC. La participación de la administradora no cuenta ni vota.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Funciones de la asamblea:<\/b> designar auditor externo, pasar la administración a otra sociedad, decretar la liquidación y nombrar liquidador, aprobar la fusión y pedir la remoción del gestor externo. Puede reemplazarse por una <b>consulta universal<\/b> escrita si el reglamento lo prevé.<\/p>\n\n<h2>6. Valoración, prohibiciones y conflictos de interés<\/h2>\n<ul>\n<li>La valoración es <b>diaria<\/b>, según la Circular Básica Contable y Financiera de la SFC. Desde junio de 2021 (CE 006 de 2021), las participaciones de FIC cerrados y FCP inscritas se valoran con precios del proveedor que incorporan el mercado secundario.<\/li>\n<li><b>Prohibido:<\/b> prestar recursos del FIC (salvo repos, simultáneas y TTV activas); aceptar participaciones como garantía de créditos propios; invertir en valores emitidos o garantizados por la propia administradora o el gestor externo; dar liquidez a la administradora o su grupo; ser contraparte del FIC; usar el FIC para reciprocidades; comprar o vender activos de socios, directivos o empleados y sus familiares.<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead><tr><th>Conflicto de interés<\/th><th>Límite<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Órdenes de varios FIC sobre el mismo valor<\/td><td>Repartir sin favorecer a ningún fondo<\/td><\/tr>\n<tr><td>La administradora invierte en su propio FIC<\/td><td>Máximo <b>15 %<\/b> del fondo; mantenerlo mínimo un año<\/td><\/tr>\n<tr><td>Valores de la matriz o subordinadas<\/td><td><b>10 %<\/b> de los activos (hasta 30 % con autorización de la asamblea), solo en sistemas de negociación; no aplica a fondos bursátiles<\/td><\/tr>\n<tr><td>FIC de un único emisor<\/td><td>Mínimo <b>80 %<\/b> en ese emisor<\/td><\/tr>\n<tr><td>Depósitos en la matriz o subordinadas<\/td><td>Máximo <b>10 %<\/b> (30 % en los primeros seis meses)<\/td><\/tr>\n<tr><td>Operaciones apalancadas o créditos del FICI con el grupo<\/td><td>Máximo <b>10 %<\/b> de los activos<\/td><\/tr>\n<tr><td>Bonos emitidos por el FIC<\/td><td>El grupo de la administradora suscribe máximo <b>10 %<\/b> de la emisión<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>7. Fusión y liquidación<\/h2>\n<p><b>Fusión:<\/b> proyecto con datos financieros y relación de intercambio; aprobación de la junta; publicación del resumen en un diario nacional; convocatoria escrita a la asamblea, que se celebra pasados <b>15 días hábiles<\/b>; los inversionistas en desacuerdo o ausentes pueden redimir dentro de <b>un mes<\/b>; luego se informa a la SFC. Si las administradoras son distintas, la SFC debe autorizarla.<\/p>\n<p><b>Causales de liquidación:<\/b> vencimiento del plazo; decisión de la asamblea; decisión motivada de la junta; imposibilidad de la administradora o del gestor sin reemplazo viable; patrimonio por debajo del mínimo; toma de posesión; incumplir los límites por inversionista tras el primer año. Se informa a más tardar al día siguiente.<\/p>\n<ol>\n<li>Se congelan suscripciones y redenciones.<\/li>\n<li>Si la causal no fue el plazo ni la asamblea, se convoca asamblea entre 5 y 10 días calendario después (si falla, nueva reunión entre 3 y 6 días con cualquier quórum).<\/li>\n<li>La asamblea puede trasladar el fondo a otra administradora, o elegir liquidador. Si no lo elige, liquida la administradora.<\/li>\n<li>El liquidador vende los activos en máximo <b>un año<\/b>. Si no alcanza, la asamblea se reúne en los 4 meses siguientes y puede dar más plazo o pedir la entrega de activos en pago.<\/li>\n<li>Se paga a los inversionistas en máximo <b>15 días hábiles<\/b>.<\/li>\n<\/ol>\n\n<h2>8. Gastos y política de inversión<\/h2>\n<ul>\n<li>Solo se cargan al FIC los gastos relacionados en el reglamento. <b>Los que no estén ahí los asume la administradora.<\/b><\/li>\n<li>Gastos admitidos: depósito y custodia, remuneración de la administradora y del gestor, defensa del fondo, seguros, gastos bancarios, asambleas, tributos del FIC, inscripciones en el RNVE y la bolsa, revisoría fiscal, comisiones de operaciones, intereses de operaciones pasivas y bonos, calificación, coberturas y, en los FICI, administración y seguros de inmuebles.<\/li>\n<li>En participaciones diferenciales, los gastos comunes se reparten a prorrata.<\/li>\n<li>La política de inversión va en el reglamento y el prospecto: plan de inversiones, operaciones del mercado monetario, depósitos, perfil de riesgo y gestión de riesgos.<\/li>\n<\/ul>\n\n<h2>9. Actividades: gestión, distribución y custodia<\/h2>\n<p>La administración comprende <b>gestión<\/b> (puede delegarse en un gestor externo o extranjero), <b>distribución<\/b> (puede delegarse) y <b>custodia<\/b> (obligatoria, con una sociedad fiduciaria). Delegar no libera a la administradora de su responsabilidad.<\/p>\n<ul>\n<li>Gestores externos: solo fiduciarias, comisionistas y SAI. Informan a la administradora al menos <b>mensualmente<\/b>. El gestor extranjero es una persona jurídica del exterior experta en ese portafolio.<\/li>\n<li>Obligaciones de la administradora: actuar solo en interés de los inversionistas; gestionar riesgos; valorar (puede delegarlo en el custodio); ejercer los derechos de los activos; contabilidad separada por FIC; independencia de funciones; no discriminar inversionistas; reportar a la SFC y a AMV.<\/li>\n<\/ul>\n\n<h2>10. Distribución, publicidad y asesoría<\/h2>\n<ul>\n<li>Distribuyen la administradora o un <b>distribuidor especializado<\/b> mediante cuentas ómnibus (otra administradora de FIC o un banco). Medios: fuerza de ventas, contrato de uso de red y contrato de corresponsalía.<\/li>\n<li>Los errores de la fuerza de ventas <b>comprometen a la entidad<\/b>. El promotor debe identificarse, entregar información necesaria y suficiente, no engañar, verificar que el cliente entienda y acepte el reglamento y el prospecto, y tramitar órdenes oportunamente.<\/li>\n<li><b>Publicidad:<\/b> veraz, verificable, actualizada, exacta, entendible y completa. Debe decir que la entidad es vigilada por la SFC e indicar el gestor externo. Las rentabilidades se dan en <b>tasa efectiva anual<\/b>. Prohibido asegurar rendimientos, hacer pronósticos, presentar lo transitorio como definitivo y divulgar calificaciones incompletas.<\/li>\n<li><b>Asesoría (Circular Básica Jurídica):<\/b> perfil del inversionista, perfil del producto, análisis de conveniencia, recomendación profesional, información y distribución. Los FIC <b>simples y universales<\/b> no requieren perfilamiento, conveniencia ni recomendación.<\/li>\n<li><b>Productos complejos:<\/b> FCP; inmobiliarios no negociados en un sistema; FIC con activos no inscritos o commodities no representados en valores; FIC apalancados; ETF sobre índices no reconocidos o subyacentes poco claros.<\/li>\n<li>Durante la permanencia, la recomendación se da cuando el cliente la pide o cuando algo afecta sustancialmente la inversión.<\/li>\n<li>La colocación primaria de un FCP no es distribución de FIC, pero exige perfilar, entregar el reglamento e informar riesgos.<\/li>\n<\/ul>\n\n<h2>11. Revelación de información<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Documento<\/th><th>Claves<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Reglamento<\/td><td>Todas las reglas del fondo, en castellano claro, sin cláusulas abusivas; las limitaciones de derechos van resaltadas. La familia tiene un reglamento marco con plan estratégico.<\/td><\/tr>\n<tr><td>Prospecto<\/td><td>Se entrega antes de vincularse, con constancia de aceptación; debe concordar con el reglamento.<\/td><\/tr>\n<tr><td>Ficha técnica<\/td><td><b>Mensual<\/b>, dentro de los 5 días hábiles siguientes al cierre del mes: valor del fondo, número de inversionistas, calificación, política, permanencia, comisiones, rentabilidad, volatilidad, composición, custodio, hoja de vida del gerente, contactos del revisor fiscal y del defensor del consumidor.<\/td><\/tr>\n<tr><td>Extracto<\/td><td>Aportes, retiros y rentabilidad del periodo de cada inversionista.<\/td><\/tr>\n<tr><td>Rendición de cuentas<\/td><td>Mínimo <b>semestral<\/b> (30 de junio y 31 de diciembre), con balance y estado de resultados; se envía en máximo <b>15 días comunes<\/b>.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Los cambios del reglamento que afectan derechos económicos deben informarse, y quien no esté de acuerdo puede retirarse sin penalidad.<\/p>\n<p><b>Ventajas de los FIC:<\/b> acceso con montos bajos, diversificación, liquidez (abiertos), gestión profesional, variedad de oferta, supervisión de la SFC y AMV, y comodidad.<\/p>\n\n<h2>12. Custodia de valores<\/h2>\n<p>La ejercen <b>sociedades fiduciarias<\/b> autorizadas (decretos 1243 y 1498 de 2013). Como mínimo, salvaguarda los valores, compensa y liquida operaciones y administra los derechos patrimoniales.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Obligatorios<\/th><th>Complementarios<\/th><th>Especiales para FIC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Salvaguarda; compensación y liquidación; administración de derechos patrimoniales (cobro de rendimientos, dividendos y capital); en FIC, verificar el reglamento y los límites<\/td><td>Derechos políticos; valoración de valores; TTV; obligaciones fiscales y cambiarias<\/td><td>Valoración del portafolio y las participaciones; contabilidad del FIC<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>Principios:<\/b> independencia, segregación (los valores no son del custodio ni responden por sus deudas) y profesionalidad.<\/li>\n<li>Anotación en cuenta a nombre de la administradora seguida del nombre del FIC.<\/li>\n<li>Reporte <b>diario<\/b> de movimientos a la administradora e <b>informe mensual<\/b> a la SFC, AMV y la junta de la administradora sobre incumplimientos o fallas.<\/li>\n<\/ul>\n\n<div class=\"box trampa\"><span class=\"tag\">Trampas típicas<\/span>\n<ul>\n<li>\"Ningún inversionista puede tener más del 60 % de un FIC abierto\": falso, en el abierto es 10 %; el 60 % es para el cerrado.<\/li>\n<li>\"La administradora garantiza un rendimiento mínimo\": falso, sus obligaciones son de medio.<\/li>\n<li>\"Los gastos no previstos en el reglamento los paga el fondo\": falso, los asume la administradora.<\/li>\n<li>\"Las penalidades por retiro anticipado son ingreso de la administradora\": falso, son del FIC.<\/li>\n<li>Confundir reglamento (contrato completo) con prospecto (resumen previo).<\/li>\n<\/ul><\/div>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto<\/span>\n<ul>\n<li>Administran: fiduciarias, comisionistas y SAI. Custodian: solo fiduciarias.<\/li>\n<li>Abierto: 10 % por inversionista, aportes en dinero. Cerrado: 60 %, participaciones como valores.<\/li>\n<li>Mercado monetario: 365 días máximo. FCP: 2/3 fuera del RNVE. FICI: 75 % en inmuebles, un año de permanencia.<\/li>\n<li>Asamblea: quórum 51 %, convocan inversionistas con 25 %.<\/li>\n<li>Administradora en su FIC: 15 %. Matriz: 10 % (30 % con asamblea).<\/li>\n<li>Ficha técnica mensual; rendición de cuentas semestral.<\/li>\n<li>Valor de la unidad = (A − P) / N.<\/li>\n<\/ul><\/div>\n<p class=\"fuente\">Fuente: paráfrasis de la guía de estudio AMV «Fondos de inversión colectiva» (FICS-004-2026, 3.ª edición, diciembre de 2025) y del Decreto 2555 de 2010. Los ejemplos numéricos son propios.<\/p>\n", "m0": "<span class=\"eyebrow\">Módulo 0<\/span>\n<h1>Metodología del examen y hábitos de estudio<\/h1>\n<p>El examen de Operador de AMV tiene 170 preguntas en 3 horas y 40 minutos. Para aprobar hay que sacar al menos el 70 % en el componente básico y el 70 % en el complementario, por separado. Este módulo explica cómo funciona el examen y cómo organizar las 8 semanas de estudio.<\/p>\n\n<h2>1. Cómo está armado el examen<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Componente<\/th><th>Módulo<\/th><th>Preguntas<\/th><\/tr><\/thead>\n<tbody>\n<tr><td rowspan=\"6\">Básico (110 preguntas, aprueba con 77)<\/td><td>1. Regulación del mercado de valores<\/td><td>30<\/td><\/tr>\n<tr><td>2. Autorregulación<\/td><td>15<\/td><\/tr>\n<tr><td>3. Ética e integridad<\/td><td>15<\/td><\/tr>\n<tr><td>4. Análisis económico y financiero<\/td><td>15<\/td><\/tr>\n<tr><td>5. Administración de riesgos<\/td><td>25<\/td><\/tr>\n<tr><td>6. Matemática financiera<\/td><td>10<\/td><\/tr>\n<tr><td rowspan=\"3\">Complementario (60 preguntas, aprueba con 42)<\/td><td>7. Administración de portafolios<\/td><td>20<\/td><\/tr>\n<tr><td>8. Fondos de inversión colectiva<\/td><td>20<\/td><\/tr>\n<tr><td>9. Fondos de pensiones<\/td><td>20<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"box clave\"><span class=\"tag\">Lo esencial<\/span>\n<p>No se promedian los componentes. Si saca 90 % en el básico y 65 % en el complementario, no aprueba. Por eso no conviene descuidar ningún módulo.<\/p><\/div>\n\n<h2>2. Reglas del día del examen<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th><\/th><th>Presencial<\/th><th>Virtual<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Citación<\/td><td>Por correo, dos días antes, con la hora de registro y de inicio<\/td><td>Por correo el día anterior, con enlace de Microsoft Teams (revise la carpeta de spam)<\/td><\/tr>\n<tr><td>Llegada<\/td><td>30 minutos antes. Iniciada la sesión no se permite la entrada<\/td><td>Conectarse a Teams (en el navegador) a la hora citada o máximo 15 minutos después; el supervisor revisa el lugar. Si no se conecta a tiempo, se registra inasistencia<\/td><\/tr>\n<tr><td>Documento<\/td><td colspan=\"2\">Cédula de ciudadanía, cédula de extranjería, pasaporte o contraseña vigente. Sin documento no se presenta el examen<\/td><\/tr>\n<tr><td>Calculadora<\/td><td colspan=\"2\">Financiera o científica (por ejemplo, HP 12C, HP 10bII+ o una científica)<\/td><\/tr>\n<tr><td>Papel<\/td><td>Se lo entregan en el lugar y lo devuelve al final<\/td><td>Hasta 2 hojas en blanco y un bolígrafo o lápiz, que se muestran en cámara al inicio y al final. Escritorio despejado<\/td><\/tr>\n<tr><td>Prohibido<\/td><td colspan=\"2\">Celulares, relojes inteligentes, agendas electrónicas o cualquier dispositivo con acceso a información<\/td><\/tr>\n<tr><td>Reprogramar<\/td><td colspan=\"2\">Hasta 3 días hábiles antes del examen<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul>\n<li><b>Virtual:<\/b> instale y pruebe el software de seguridad <b>Respondus<\/b>, use Google Chrome actualizado, reinicie el computador antes y evite actualizaciones pendientes de Windows o macOS. Tenga sus datos de contacto al día en el SIAMV.<\/li>\n<li>En el virtual, el supervisor tiene hasta <b>8 días hábiles<\/b> para validar que se cumplieron las condiciones; después llega el correo de aprobación.<\/li>\n<li>Intentar acceder al banco de preguntas, copiar o tener elementos no autorizados es una infracción disciplinaria (art. 159 del Reglamento de AMV).<\/li>\n<\/ul>\n\n<h2>3. Manejo del tiempo<\/h2>\n<p>Con 220 minutos para 170 preguntas hay unos 77 segundos por pregunta. La mayoría de las preguntas conceptuales se responden en menos de un minuto, lo que deja tiempo para los cálculos.<\/p>\n<ol>\n<li><b>Primera pasada (unos 120 minutos):<\/b> responda todo lo que sabe. Si una pregunta le toma más de 2 minutos, márquela y siga.<\/li>\n<li><b>Segunda pasada (unos 70 minutos):<\/b> vuelva a las marcadas y haga los cálculos con calma.<\/li>\n<li><b>Revisión final (unos 30 minutos):<\/b> verifique que no quedó ninguna en blanco.<\/li>\n<\/ol>\n<div class=\"box trampa\"><span class=\"tag\">Trampa típica<\/span>\n<p>Dejar preguntas en blanco. Una respuesta en blanco cuenta igual que una incorrecta, así que siempre conviene marcar la opción más probable.<\/p><\/div>\n\n<h2>4. Cómo leer una pregunta de selección múltiple<\/h2>\n<ul>\n<li>Lea el enunciado completo y fíjese en palabras como <b>NO<\/b>, <b>siempre<\/b>, <b>nunca<\/b>, <b>principalmente<\/b>.<\/li>\n<li>Descarte primero las opciones que son claramente falsas. Muchas preguntas tienen dos opciones absurdas y dos parecidas.<\/li>\n<li>Desconfíe de las opciones que prometen garantías o rentabilidades fijas en productos de riesgo: casi siempre son falsas.<\/li>\n<li>En los cálculos, estime el orden de magnitud antes de calcular. Si la opción que obtuvo está muy lejos de su estimado, revise el procedimiento.<\/li>\n<\/ul>\n\n<h2>5. Plan de 8 semanas<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th>Semana<\/th><th>Contenido<\/th><th>Horas<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>Este módulo, un diagnóstico de 40 preguntas y Matemática financiera<\/td><td>14<\/td><\/tr>\n<tr><td>2<\/td><td>Regulación (conceptos, valores, intermediación, operaciones)<\/td><td>15<\/td><\/tr>\n<tr><td>3<\/td><td>Regulación (participantes, supervisión, SARLAFT, asesoría) y Autorregulación<\/td><td>16<\/td><\/tr>\n<tr><td>4<\/td><td>Ética y Análisis económico y financiero<\/td><td>15<\/td><\/tr>\n<tr><td>5<\/td><td>Administración de riesgos<\/td><td>16<\/td><\/tr>\n<tr><td>6<\/td><td>Simulacro del componente básico, refuerzo y Portafolios<\/td><td>15<\/td><\/tr>\n<tr><td>7<\/td><td>Fondos de inversión colectiva y Fondos de pensiones<\/td><td>15<\/td><\/tr>\n<tr><td>8<\/td><td>Dos simulacros completos, refuerzo y repaso final<\/td><td>15<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>6. Hábitos que funcionan<\/h2>\n<ul>\n<li><b>Estudie, practique y revise.<\/b> Lea la lección, haga una práctica de 20 a 30 preguntas con respuesta inmediata y lea la explicación de cada pregunta fallada.<\/li>\n<li><b>Lleve un registro de errores.<\/b> Anote el concepto que falló, no la pregunta. Repase esa lista cada semana.<\/li>\n<li><b>Practique con la calculadora desde el primer día.<\/b> El día del examen no es momento para aprender las teclas.<\/li>\n<li><b>Haga simulacros en condiciones reales.<\/b> Con cronómetro, sin apuntes y sin interrupciones.<\/li>\n<li><b>Meta: 80 % en los simulacros.<\/b> Ese margen sobre el 70 % absorbe los nervios del día del examen.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Cómo usar este simulador<\/span>\n<p>Cada lección tiene un botón para practicar 10 preguntas del módulo con la respuesta al instante. En la página de inicio puede elegir más preguntas, activar el cronómetro o hacer los simulacros completos. Sus resultados quedan guardados en este navegador.<\/p><\/div>\n", "mat": "<span class=\"eyebrow\">Módulo 6 · 10 preguntas en el examen<\/span>\n<h1>Matemática financiera<\/h1>\n<p>Son pocas preguntas, pero son las más fáciles de asegurar si se practica. Casi todo se reduce a cinco fórmulas y a no confundir tasas nominales, efectivas, anticipadas y vencidas. Practique cada ejemplo con su calculadora financiera.<\/p>\n\n<h2>1. La tasa de interés<\/h2>\n<p>Un peso hoy vale más que un peso mañana por tres razones: <b>inflación<\/b>, <b>costo de oportunidad<\/b> y <b>riesgo<\/b>. La tasa de interés es el precio del dinero en el tiempo y puede verse como tasa de retorno, tasa de descuento o costo de oportunidad. Siempre tiene una unidad de moneda y una unidad de tiempo.<\/p>\n<p>Según la guía de AMV, la tasa total combina interés real, inflación, riesgo de crédito, riesgo de liquidez y riesgo de vencimiento, <b>de forma compuesta<\/b>:<\/p>\n<p class=\"f\">(1 + i) = (1 + ir)(1 + if)(1 + ip)(1 + il)(1 + iv)<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Real 2 %, inflación 5 %, sin riesgo de crédito ni de liquidez, vencimiento 1 %: 1,02 × 1,05 × 1,01 − 1 = <b>8,17 % EA<\/b> (no 8 %).<\/p><\/div>\n<p>En los diagramas de flujo, las flechas hacia abajo son salidas de dinero y las flechas hacia arriba, entradas.<\/p>\n\n<h2>2. Interés simple y compuesto<\/h2>\n<ul>\n<li><b>Simple:<\/b> los intereses se causan y se pagan en el mismo período, así que el capital no cambia y siempre se calcula sobre el capital inicial. <span class=\"f\">VF = VP × (1 + i × n)<\/span><\/li>\n<li><b>Compuesto:<\/b> los intereses se suman al capital y generan nuevos intereses. <span class=\"f\">VF = VP × (1 + i)^n<\/span> y <span class=\"f\">VP = VF / (1 + i)^n<\/span><\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>COP 10.000.000 al 12 % efectivo anual durante 3 años.<\/p>\n<ul>\n<li>Compuesto: 10.000.000 × 1,12³ = <b>COP 14.049.280<\/b><\/li>\n<li>Simple: 10.000.000 × (1 + 0,12 × 3) = COP 13.600.000<\/li>\n<\/ul>\n<p>En la calculadora (HP 12C): <code>3 n<\/code>, <code>12 i<\/code>, <code>10000000 CHS PV<\/code>, <code>FV<\/code>.<\/p><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: retirar o reinvertir<\/span>\n<p>COP 10.000.000 al 0,8 % mes vencido durante 12 meses.<\/p>\n<ul>\n<li>Retirando los intereses cada mes: 80.000 × 12 = 960.000 de intereses.<\/li>\n<li>Reinvirtiéndolos: 10.000.000 × 1,008¹² − 10.000.000 = <b>1.003.387<\/b>.<\/li>\n<\/ul><\/div>\n\n<h2>3. Tipos de tasas<\/h2>\n<p>La <b>nominal<\/b> es una tasa anual de referencia que no incluye la capitalización. La <b>efectiva<\/b> sí la incluye y es la única que sirve para comparar. Las tasas <b>anticipadas<\/b> son comunes en factoring y redescuento. Ojo: \"trimestre anticipado\" se refiere a una nominal anual TA, no a 90 días exactos.<\/p>\n<div class=\"tw\"><table>\n<thead><tr><th>Tasa<\/th><th>Qué significa<\/th><th>Ejemplo<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Nominal<\/td><td>Tasa anual que se divide entre los períodos del año<\/td><td>12 % NMV = 1 % mensual vencido<\/td><\/tr>\n<tr><td>Efectiva anual (EA)<\/td><td>Lo que realmente rinde en un año, con capitalización<\/td><td>1 % mensual = 12,68 % EA<\/td><\/tr>\n<tr><td>Periódica<\/td><td>Tasa de cada período (mes, trimestre, semestre)<\/td><td>3 % trimestral<\/td><\/tr>\n<tr><td>Vencida<\/td><td>Los intereses se pagan al final del período<\/td><td>NTV, NSV, NMV<\/td><\/tr>\n<tr><td>Anticipada<\/td><td>Los intereses se pagan al inicio del período<\/td><td>NTA, NMA<\/td><\/tr>\n<\/tbody><\/table><\/div>\n\n<h2>4. Conversión de tasas, paso a paso<\/h2>\n<p>Las guías de AMV trabajan con <b>base 360<\/b> para tasas nominales (mes = 30 días, trimestre = 90, semestre = 180) y con <b>base 365<\/b> para descontar títulos por días: <span class=\"f\">EA = (1 + i periódica)^(base / días) − 1<\/span>.<\/p>\n<ol>\n<li><b>De nominal a periódica:<\/b> divida por el número de períodos. 12 % NTV → 12 / 4 = 3 % trimestral vencido.<\/li>\n<li><b>De anticipada a vencida:<\/b> <span class=\"f\">iv = ia / (1 − ia)<\/span>. De vencida a anticipada: <span class=\"f\">ia = iv / (1 + iv)<\/span>.<\/li>\n<li><b>De periódica vencida a efectiva anual:<\/b> <span class=\"f\">EA = (1 + i)^m − 1<\/span>, donde m es el número de períodos del año.<\/li>\n<li><b>De efectiva anual a periódica:<\/b> <span class=\"f\">i = (1 + EA)^(1/m) − 1<\/span>. Multiplique por m si le piden la nominal.<\/li>\n<\/ol>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: anticipada<\/span>\n<p>¿Qué EA equivale a un 12 % NTA?<\/p>\n<ul>\n<li>Trimestral anticipada = 12 % / 4 = 3 %<\/li>\n<li>Trimestral vencida = 0,03 / 0,97 = 3,0928 %<\/li>\n<li>EA = 1,030928⁴ − 1 = <b>12,96 %<\/b><\/li>\n<\/ul><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: de EA a nominal<\/span>\n<p>¿Qué tasa NMV equivale a un 10 % EA?<\/p>\n<ul>\n<li>Mensual = 1,10^(1/12) − 1 = 0,7974 %<\/li>\n<li>Nominal = 0,7974 % × 12 = <b>9,57 % NMV<\/b><\/li>\n<\/ul><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: factoring<\/span>\n<p>Se descuenta una factura de COP 80.000.000 a un trimestre al 2,5 % TA. Intereses anticipados: 2.000.000; recibe <b>78.000.000<\/b>. La tasa vencida real es 0,025 / 0,975 = <b>2,56 % trimestral<\/b>.<\/p><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: comparar ofertas<\/span>\n<p>A: 1,8 % mensual → 1,018¹² − 1 = 23,87 % EA. B: 24 % NSV → 1,12² − 1 = 25,44 % EA. C: 24 % EA. La más barata es <b>A<\/b>.<\/p><\/div>\n<div class=\"box trampa\"><span class=\"tag\">Trampas típicas<\/span>\n<ul>\n<li>Dividir una tasa <b>efectiva<\/b> anual entre 12 para obtener la mensual. Eso solo vale para tasas nominales.<\/li>\n<li>Olvidar convertir la anticipada a vencida antes de capitalizar.<\/li>\n<li>Con la misma tasa nominal, más capitalizaciones al año dan una EA mayor.<\/li>\n<li>Una tasa anticipada siempre es menor que su equivalente vencida.<\/li>\n<\/ul><\/div>\n\n<h2>5. Indicadores económicos y tasas indexadas<\/h2>\n<ul>\n<li><b>Indexadas:<\/b> IPC + 3 % con IPC de 5 % → <span class=\"f\">(1,05 × 1,03) − 1 = 8,15 %<\/span>, no 8 %.<\/li>\n<li><b>Tasa real:<\/b> <span class=\"f\">(1 + nominal) / (1 + inflación) − 1<\/span>. Con 10 % nominal e inflación de 4 %: 1,10 / 1,04 − 1 = <b>5,77 %<\/b>.<\/li>\n<\/ul>\n<div class=\"box clave\"><span class=\"tag\">Regla de oro<\/span>\n<p>Dos tasas <b>efectivas<\/b> se combinan multiplicando (IPC + spread, UVR + spread). Dos tasas <b>nominales en la misma modalidad<\/b> se suman (DTF TA + spread TA, IBR MV + spread MV) y luego se convierten a efectiva. 100 pb = 1 %.<\/p><\/div>\n<div class=\"tw\"><table>\n<thead><tr><th>Indicador<\/th><th>Quién y cómo<\/th><th>Cómo se combina<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>IPC<\/td><td>DANE, mensual (quinto día hábil); base dic. 2018 = 100; 443 artículos, 12 divisiones, 38 ciudades<\/td><td>(1 + IPC)(1 + spread) − 1<\/td><\/tr>\n<tr><td>UVR<\/td><td>Banco de la República, diaria (Ley 546 de 1999); se ajusta con el IPC del mes anterior; periodo del 16 al 15<\/td><td>UVRt = UVR15 × (1 + IPC mes)^(t/d); tasa = (1 + inflación)(1 + spread) − 1<\/td><\/tr>\n<tr><td>IBR<\/td><td>Banco de la República, diario; overnight, 1, 3, 6 y 12 meses; mediana de cotizaciones de 8 bancos; desde 2008<\/td><td>Nominal: se suma al spread en la misma modalidad<\/td><\/tr>\n<tr><td>DTF<\/td><td>Promedio ponderado de tasas de CDT a 90 días; vigencia semanal; nominal TA<\/td><td>DTF TA + spread TA; luego a EA<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>En un título <b>indexado al IPC<\/b> solo varían los cupones; en un título <b>en UVR<\/b> (como los TES UVR, Ley 51 de 1990) se ajustan los intereses y el capital. El IBR overnight se forma con préstamos interbancarios con entrega de fondos; los plazos de 1 a 12 meses, con swaps OIS compensados en la CRCC.<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: DTF<\/span>\n<p>Crédito a DTF + 4 % TA con DTF de 8,5 % TA. Nominal total = 12,5 % TA → trimestral anticipada 3,125 % → vencida 0,03125 / 0,96875 = 3,2258 % → EA = 1,032258⁴ − 1 = <b>13,54 %<\/b>.<\/p><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: IBR<\/span>\n<p>Papel a IBR + 4,5 % con IBR de 8,6 % (ambos NMV), pagos trimestrales. Nominal total = 13,1 % NMV → mensual 1,0917 % → trimestral = 1,010917³ − 1 = <b>3,31 %<\/b>; EA = 13,92 %.<\/p><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: UVR<\/span>\n<p>UVR del día 15: 370,25; IPC del mes anterior: 0,30 %; periodo de 31 días. A los 30 días: 370,25 × 1,003^(30/31) = <b>371,32<\/b>.<\/p><\/div>\n\n<h2>6. Anualidades<\/h2>\n<p>Serie de pagos <b>iguales<\/b>, a <b>intervalos iguales<\/b>, con la <b>misma tasa<\/b> y tantos pagos como períodos. En la <b>vencida<\/b> el primer pago es un período después del momento cero:<\/p>\n<ul>\n<li><span class=\"f\">VP = C × [1 − (1 + i)^−n] / i<\/span><\/li>\n<li><span class=\"f\">VF = C × [(1 + i)^n − 1] / i<\/span><\/li>\n<li>Cuota de un crédito: <span class=\"f\">C = VP × i / [1 − (1 + i)^−n]<\/span><\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Un crédito de COP 3.000.000 a 12 cuotas mensuales al 2 % mensual.<\/p>\n<p>C = 3.000.000 × 0,02 / [1 − 1,02⁻¹²] = <b>COP 283.679<\/b>.<\/p>\n<p>En la calculadora: <code>12 n<\/code>, <code>2 i<\/code>, <code>3000000 PV<\/code>, <code>0 FV<\/code>, <code>PMT<\/code>.<\/p><\/div>\n<div class=\"box trampa\"><span class=\"tag\">Trampa típica<\/span>\n<p>Si el crédito está en EA y las cuotas son mensuales, primero convierta: 20 % EA → 1,20^(1/12) − 1 = 1,5309 % mensual. Usar 20 % / 12 da una cuota equivocada.<\/p><\/div>\n<p><b>Anualidad diferida:<\/b> el primer pago llega después de m períodos de gracia. <span class=\"f\">VP = C × [1 − (1 + i)^−n] / i × (1 + i)^−m<\/span>, donde m es el número de períodos antes del primer pago menos uno.<\/p>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: diferida<\/span>\n<p>12 cuotas de COP 1.000.000, la primera en el mes 6, al 1,5 % mensual. VP en el mes 5 = 10.907.505; hoy = 10.907.505 / 1,015⁵ = <b>COP 10.125.004<\/b>.<\/p><\/div>\n\n<h2>7. Valoración de títulos, VPN, TIR y TIRM<\/h2>\n<ul>\n<li><b>Precio de un bono:<\/b> valor presente de los cupones y del principal, descontados a la TIR de mercado.<\/li>\n<li>Cupón = TIR: el bono vale <b>a la par<\/b>. TIR mayor que cupón: <b>con descuento<\/b>. TIR menor que cupón: <b>con prima<\/b>.<\/li>\n<li><b>TIR:<\/b> tasa que iguala el valor presente de los flujos con el precio o la inversión.<\/li>\n<li><b>VPN:<\/b> valor presente de los flujos menos la inversión, a la tasa de oportunidad. VPN ≥ 0 se acepta (igual a cero: renta justo lo exigido); VPN &lt; 0 se rechaza.<\/li>\n<li><b>TIR:<\/b> la tasa que hace VPN = 0. En un préstamo, es su costo real. Sin calculadora se halla por tanteo e interpolación. Supone que los flujos se reinvierten a la misma TIR.<\/li>\n<li><b>TIRM:<\/b> <span class=\"f\">(VF de los positivos a la tasa de reinversión / VP de los negativos a la tasa de financiamiento)^(1/n) − 1<\/span>. Es más conservadora.<\/li>\n<li>Etapas de una decisión de inversión: identificación, formulación y evaluación, selección, ejecución, y monitoreo.<\/li>\n<\/ul>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto: título por días<\/span>\n<p>Un título se compra al 98,5 % y paga 100 % en 90 días. TIR = (100 / 98,5)^(365/90) − 1 = <b>6,32 % EA<\/b>.<\/p>\n<p>Un CDT de nominal 100 millones con tasa facial 11 % EA paga 111 millones al vencimiento. Si le quedan 200 días y se negocia al 10,5 % EA: precio = 111.000.000 / 1,105^(200/365) = <b>COP 105.090.347<\/b><\/p><\/div>\n<div class=\"box clave\"><span class=\"tag\">Calculadora y hoja de cálculo<\/span>\n<ul>\n<li>Período sin flujo: ingrese 0. Trabaje con la periodicidad menor y con el flujo neto de cada período. Ingresos y egresos con signos opuestos.<\/li>\n<li>Hoja de cálculo: INT.EFECTIVO, TASA.NOMINAL, VA, VF, VNA (tasa efectiva de la misma periodicidad de los flujos), TIR y TIRM.<\/li>\n<\/ul><\/div>\n<div class=\"box ej\"><span class=\"tag\">Ejemplo resuelto<\/span>\n<p>Bono de nominal 100, cupón anual de 8 %, 3 años, TIR de 10 %.<\/p>\n<p>Precio = 8/1,1 + 8/1,1² + 108/1,1³ = 7,27 + 6,61 + 81,14 = <b>95,03<\/b> (con descuento).<\/p>\n<p>En la calculadora: <code>3 n<\/code>, <code>10 i<\/code>, <code>8 PMT<\/code>, <code>100 FV<\/code>, <code>PV<\/code>.<\/p><\/div>\n\n<h2>8. Rentabilidad<\/h2>\n<ul>\n<li>Rentabilidad de un período: <span class=\"f\">(precio final − precio inicial + dividendos) / precio inicial<\/span>.<\/li>\n<li>Anualizar una rentabilidad de varios años: <span class=\"f\">(1 + r total)^(1/años) − 1<\/span>. Por ejemplo, 21 % en 2 años = 10 % anual.<\/li>\n<li><b>Regla del 72:<\/b> años para duplicar ≈ 72 / tasa. Al 12 %, unos 6 años.<\/li>\n<\/ul>\n\n<div class=\"box clave\"><span class=\"tag\">Repaso en 1 minuto<\/span>\n<ul>\n<li>VF = VP(1 + i)^n.<\/li>\n<li>Nominal → periódica: dividir. Periódica → EA: (1 + i)^m − 1.<\/li>\n<li>Anticipada → vencida: ia / (1 − ia).<\/li>\n<li>Tasas indexadas y reales: multiplicar o dividir, nunca sumar o restar.<\/li>\n<li>TIR mayor que cupón: bono con descuento.<\/li>\n<li>Efectivas se multiplican; nominales de igual modalidad se suman.<\/li>\n<li>DTF: semanal, CDT 90 días, TA. IBR: BanRep, mediana, 5 plazos. UVR: diaria, Ley 546/1999.<\/li>\n<li>Cuotas mensuales con tasa EA: convertir primero a mensual.<\/li>\n<\/ul><\/div>\n\n<p class=\"fuente\">Fuente: Guía de estudio de Matemática financiera de AMV (MAFI-001-2026) y Guía de ejercicios de matemáticas financieras (MATE-2026-001). Contenido parafraseado con fines de estudio; los ejemplos numéricos son propios.<\/p>\n", "pen": "<span class=\"eyebrow\">Módulo 9 · 20 preguntas en el examen<\/span>\n<h1>Fondos de pensiones<\/h1>\n<p>El Sistema General de Pensiones fue creado por la Ley 100 de 1993 con dos regímenes que compiten entre sí. Este módulo cubre cómo funcionan, cómo se invierten los ahorros de los afiliados y qué son las cesantías y las pensiones voluntarias.<\/p>\n<div class=\"box trampa\"><span class=\"tag\">Estado de la reforma pensional (octubre de 2026)<\/span>\n<p>La <b>Ley 2381 de 2024<\/b> aún <b>no está vigente<\/b>. Debía regir desde el 1 de julio de 2025, pero la Corte Constitucional suspendió su entrada en vigor por un vicio de trámite. El 25 de agosto de 2026 la Corte la avaló en su mayoría (sentencia C-264 de 2026) y devolvió nueve artículos a la Cámara para corregir su trámite. Según la prensa, entraría en vigor el <b>1 de abril de 2027<\/b>. Hasta entonces rige la Ley 100 de 1993.<\/p>\n<p>La guía de AMV vigente (PENS-001-2025) y, por tanto, el examen se basan en la Ley 100. Para cultura general, los cambios principales de la reforma son:<\/p>\n<ul>\n<li>Pilares <b>solidario<\/b> (renta básica para adultos mayores pobres), <b>semicontributivo<\/b> (para quienes tienen entre 300 y 1.000 semanas), <b>contributivo<\/b> y <b>de ahorro voluntario<\/b>.<\/li>\n<li>En el contributivo, todos cotizan a Colpensiones hasta <b>2,3 salarios mínimos<\/b>; lo que exceda va a una cuenta de ahorro individual en una AFP.<\/li>\n<li>Se reducirían gradualmente las semanas exigidas a las mujeres, y existe un régimen de transición para quienes ya tenían muchas semanas.<\/li>\n<\/ul><\/div>\n\n<h2>1. El sistema y sus pilares<\/h2>\n<ul>\n<li>La seguridad social es un <b>servicio público obligatorio<\/b> (art. 48 de la Constitución), irrenunciable, prestado por entidades públicas o privadas bajo control del Estado.<\/li>\n<li>Pilares de protección a la vejez según la guía: <b>subsidiado<\/b> (no contributivo o semicontributivo, como los BEPS), <b>contributivo<\/b> (Colpensiones y AFP) y <b>voluntario<\/b> (aportes voluntarios con beneficios tributarios).<\/li>\n<li>El SGP ampara la <b>vejez, la invalidez y la muerte<\/b>. Sus recursos no son de la Nación ni de las administradoras.<\/li>\n<li>RAIS y RPM son <b>excluyentes<\/b>: solo se puede estar en uno, aunque se pueden tener planes complementarios.<\/li>\n<\/ul>\n\n<h2>2. Los dos regímenes<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th><\/th><th>Prima Media (RPM)<\/th><th>Ahorro Individual (RAIS)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Administra<\/td><td>Colpensiones<\/td><td>Las AFP privadas<\/td><\/tr>\n<tr><td>Aportes<\/td><td>Fondo común<\/td><td>Cuenta individual del afiliado<\/td><\/tr>\n<tr><td>Pensión<\/td><td>Prestación definida: 65 % a 55 % del IBL con 1.300 semanas (decreciente según ingreso), +1,5 % por cada 50 semanas adicionales, máximo 80 %. IBL: últimos 10 años o toda la vida, el mayor<\/td><td>Aporte definido: depende del capital (aportes + rendimientos + bono), la edad, los beneficiarios y la expectativa de vida<\/td><\/tr>\n<tr><td>Garantía de pensión mínima<\/td><td>Faltantes del fondo común con el Presupuesto Nacional<\/td><td>Fondo de garantía con 1,5 % de la cotización de todos los afiliados, administrado por las AFP<\/td><\/tr>\n<tr><td>Excedentes de libre disponibilidad<\/td><td>No hay<\/td><td>Si la pensión es ≥ 70 % del IBL (m
