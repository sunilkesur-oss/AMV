bolsa pueden, entre otras actividades:", "o": ["Realizar operaciones por cuenta propia, administrar portafolios de terceros y administrar fondos de inversión colectiva", "Captar depósitos a la vista del público", "Otorgar créditos de consumo", "Emitir CDT"], "e": "Las SCB realizan contratos de comisión, cuenta propia, APT, administración de FIC y asesoría, entre otras. Captar depósitos y emitir CDT es propio de los establecimientos de crédito."}, {"q": "¿Cuál es el objeto principal de una sociedad fiduciaria?", "o": ["Celebrar negocios fiduciarios, en los que recibe bienes para administrarlos o enajenarlos según la finalidad que fije el fideicomitente", "Captar depósitos de ahorro", "Administrar fondos de pensiones obligatorias", "Negociar valores en bolsa por cuenta de terceros como comisionista"], "e": "Las fiduciarias celebran negocios fiduciarios. En la fiducia mercantil se transfieren bienes que forman un patrimonio autónomo administrado para la finalidad pactada."}, {"q": "En la fiducia mercantil, los bienes fideicomitidos:", "o": ["Forman un patrimonio autónomo, separado de los bienes de la fiduciaria y del fideicomitente", "Pasan a ser propiedad de la fiduciaria para todos los efectos", "Siguen siendo garantía de las deudas de la fiduciaria", "Se convierten en acciones de la fiduciaria"], "e": "El patrimonio autónomo está separado de los bienes de la fiduciaria. Solo responde por las obligaciones contraídas para cumplir la finalidad del fideicomiso."}, {"q": "La Superintendencia Financiera puede imponer a una persona natural que viola normas del mercado de valores sanciones como:", "o": ["Multa, amonestación, suspensión o inhabilitación para ejercer cargos", "Prisión", "Expropiación de bienes", "Expulsión del país"], "e": "El régimen sancionatorio administrativo de la SFC incluye multas, amonestaciones, suspensión, inhabilitación y remoción de cargos. La prisión es competencia de los jueces penales."}, {"q": "¿Qué es el Decreto 2555 de 2010?", "o": ["El decreto que recoge y reexpide las normas del sector financiero, asegurador y del mercado de valores", "La ley que creó la Superintendencia Financiera", "El reglamento de AMV", "El estatuto tributario"], "e": "El Decreto 2555 de 2010 compila la regulación del sector financiero, asegurador y del mercado de valores, y ha sido modificado muchas veces."}, {"q": "¿Cuál es uno de los objetivos de la intervención del Gobierno en el mercado de valores según la Ley 964 de 2005?", "o": ["Proteger los derechos de los inversionistas y promover la transparencia y la eficiencia del mercado", "Fijar los precios de las acciones", "Garantizar rentabilidades a los inversionistas", "Prohibir la inversión extranjera"], "e": "La ley busca proteger a los inversionistas, promover el desarrollo y la eficiencia del mercado, prevenir el riesgo sistémico y preservar su integridad."}, {"q": "Para realizar una oferta pública de valores en Colombia, por regla general, se requiere:", "o": ["Que el valor y el emisor estén inscritos en el RNVE y que la oferta esté autorizada por la Superintendencia Financiera", "Solo publicarla en un periódico", "La aprobación del Banco de la República", "Que el emisor sea una entidad pública"], "e": "La oferta pública exige inscripción en el RNVE y autorización de la SFC, salvo las excepciones previstas en la norma."}, {"q": "El prospecto de información de una emisión de valores tiene como propósito:", "o": ["Dar a los inversionistas la información necesaria para tomar una decisión de inversión sobre la emisión", "Registrar las operaciones de la bolsa", "Fijar el precio de mercado del valor", "Reemplazar los estados financieros"], "e": "El prospecto describe al emisor, la emisión, sus condiciones y sus riesgos."}, {"q": "Los emisores de valores deben presentar a la Superintendencia y al mercado, como información periódica:", "o": ["Un informe periódico de fin de ejercicio y un informe periódico trimestral", "Solo las actas de junta directiva", "Las declaraciones de renta de sus accionistas", "Un informe mensual de salarios"], "e": "El Decreto 151 de 2021 actualizó el régimen: la información periódica se compone del informe de fin de ejercicio y del informe trimestral, que incluyen información financiera, riesgos y prácticas de sostenibilidad."}, {"q": "¿Qué es el código de mejores prácticas corporativas (Código País)?", "o": ["Un conjunto de recomendaciones de gobierno corporativo para los emisores, que deben reportar si las adoptan", "Una ley obligatoria con sanciones penales", "El reglamento de la bolsa", "La lista de valores inscritos"], "e": "El Código País recoge recomendaciones de gobierno corporativo. Los emisores informan cada año cuáles adoptan, bajo el esquema de cumplir o explicar."}, {"q": "¿Cuál es la principal diferencia entre una oferta pública primaria y una secundaria?", "o": ["En la primaria el emisor capta recursos con valores nuevos; en la secundaria los tenedores venden valores ya emitidos", "La primaria solo es para bonos", "La secundaria la autoriza el Banco de la República", "No hay diferencia"], "e": "En la primaria el emisor recibe los recursos. En la secundaria los recursos van a quien vende los valores existentes."}, {"q": "Un martillo en la Bolsa de Valores de Colombia es:", "o": ["Un mecanismo de subasta para vender un bloque de valores al mejor postor", "Un sistema de custodia", "Una sanción disciplinaria", "Un tipo de derivado"], "e": "El martillo es un mecanismo de negociación por subasta, usado por ejemplo para enajenar participaciones estatales o bloques grandes."}, {"q": "La democratización de la propiedad accionaria del Estado se hace mediante:", "o": ["Ofertas que dan condiciones preferenciales a trabajadores, sindicatos, fondos de empleados y otros destinatarios del sector solidario", "Venta directa a un solo comprador extranjero", "Donación de acciones", "Emisión de TES"], "e": "La Ley 226 de 1995 exige ofrecer primero las acciones del Estado a destinatarios preferenciales en condiciones especiales."}, {"q": "Los títulos de deuda pública externa emitidos por la Nación en mercados internacionales se conocen como:", "o": ["Bonos de deuda externa o bonos globales", "CDT", "Aceptaciones bancarias", "Papeles comerciales"], "e": "La Nación emite bonos en el exterior, en dólares u otras monedas, además de los TES en el mercado local."}, {"q": "¿Quién administra la emisión de los TES?", "o": ["El Ministerio de Hacienda, con el Banco de la República como agente", "Las sociedades comisionistas", "La Bolsa de Valores", "AMV"], "e": "El Ministerio de Hacienda emite los TES. El Banco de la República actúa como agente administrador y los custodia en el DCV."}, {"q": "Los creadores de mercado de deuda pública son:", "o": ["Entidades que se comprometen a dar liquidez a los TES y participar en las subastas, a cambio de ciertos beneficios", "Las calificadoras de riesgo", "Los emisores de CDT", "Los fondos de pensiones obligatoriamente"], "e": "El programa de creadores de mercado del Ministerio de Hacienda busca liquidez y formación de precios en el mercado de TES."}, {"q": "¿Cuál es la función de un proveedor de precios para valoración?", "o": ["Calcular y publicar precios e insumos que las entidades usan para valorar sus inversiones", "Negociar valores por cuenta de clientes", "Supervisar a las bolsas", "Emitir valores"], "e": "Los proveedores de precios autorizados por la SFC suministran los precios para la valoración diaria a precios de mercado."}, {"q": "Un fondo de inversión extranjero que invierte en el mercado colombiano debe actuar a través de:", "o": ["Un administrador local autorizado, de acuerdo con el régimen de inversión de capital del exterior", "Ningún intermediario", "Una cuenta personal de un empleado", "El Banco de la República directamente"], "e": "La inversión de portafolio del exterior se canaliza por medio de administradores locales autorizados y se registra según el régimen cambiario."}, {"q": "En una operación a plazo de cumplimiento efectivo, al vencimiento:", "o": ["Se entregan los valores y se paga el precio pactado", "Solo se paga la diferencia de precios", "No se entrega nada", "Se renegocia automáticamente"], "e": "En el cumplimiento efectivo hay entrega física del valor y pago total. En el cumplimiento financiero solo se liquida la diferencia."}, {"q": "¿Cuál de las siguientes entidades puede administrar un sistema de negociación de valores?", "o": ["Una bolsa de valores o una sociedad administradora de sistemas de negociación autorizada", "Una sociedad fiduciaria", "Un fondo de pensiones", "Una calificadora de riesgo"], "e": "Los sistemas de negociación los administran bolsas y sociedades autorizadas por la SFC, como las que operan plataformas de deuda o divisas."}, {"q": "La sociedad comisionista de bolsa debe mantener los recursos de sus clientes:", "o": ["Separados de sus propios recursos", "Mezclados con sus recursos para invertir mejor", "En su cuenta de gastos", "En efectivo en su caja fuerte"], "e": "El deber de separación de activos protege a los clientes frente a los riesgos de la propia entidad."}, {"q": "La Superintendencia Financiera fue creada en 2005 a partir de:", "o": ["La fusión de la Superintendencia Bancaria y la Superintendencia de Valores", "La división del Banco de la República", "La transformación de AMV", "La Bolsa de Bogotá"], "e": "El Decreto 4327 de 2005 fusionó las superintendencias Bancaria y de Valores en la Superintendencia Financiera."}, {"q": "¿Qué es la vigilancia especial que puede ordenar la Superintendencia?", "o": ["Una medida cautelar para que una entidad corrija situaciones que pueden afectar su estabilidad, con supervisión más intensa", "Una sanción penal", "Una calificación de riesgo", "La liquidación inmediata de la entidad"], "e": "La vigilancia especial es una medida preventiva que impone condiciones y seguimiento a una entidad en dificultades."}, {"q": "El Fondo de Garantías de Instituciones Financieras (Fogafín) administra:", "o": ["El seguro de depósitos que protege a los ahorradores de establecimientos de crédito", "Los fondos de pensiones obligatorias", "La custodia de TES", "El registro de profesionales"], "e": "Fogafín protege a los depositantes ante la quiebra de un establecimiento de crédito, con un seguro de depósitos hasta un monto por persona."}, {"q": "¿Cuál de estas operaciones NO es una actividad de intermediación de valores?", "o": ["Que una persona compre acciones para sí misma en bolsa a través de un comisionista", "El contrato de comisión de una SCB", "La administración de un FIC", "La cuenta propia de un intermediario con el público"], "e": "Un inversionista que compra para sí mismo no intermedia: es cliente. La intermediación la realizan las entidades autorizadas."}, {"q": "El deber de asesoría frente a un cliente inversionista implica:", "o": ["Dar recomendaciones profesionales adecuadas a su perfil cuando el producto lo exige", "Garantizar ganancias", "Decidir por el cliente sin consultarle", "Ofrecer siempre el producto más rentable"], "e": "La asesoría ayuda al cliente a decidir, con recomendaciones adecuadas a su perfil y a las características del producto."}, {"q": "El oficial de cumplimiento en materia de SARLAFT debe:", "o": ["Velar por el funcionamiento del sistema de prevención de lavado de activos y reportar las operaciones sospechosas", "Aprobar los créditos de la entidad", "Negociar en la mesa de tesorería", "Atender las quejas comerciales"], "e": "El oficial de cumplimiento coordina el SARLAFT, analiza las alertas y presenta los reportes a la UIAF."}, {"q": "Las etapas del SARLAFT son:", "o": ["Identificación, medición, control y monitoreo", "Compra, venta y liquidación", "Planeación, ejecución y cierre", "Captación, colocación y recuperación"], "e": "El SARLAFT gestiona el riesgo de LA/FT a través de esas cuatro etapas, como los demás sistemas de administración de riesgos."}, {"q": "La debida diligencia en el conocimiento del cliente incluye:", "o": ["Identificar al cliente y al beneficiario final, conocer su actividad y verificar el origen de sus recursos", "Solo pedir el número de teléfono", "Revisar sus redes sociales únicamente", "Pedir una referencia comercial verbal"], "e": "La debida diligencia exige identificar y verificar al cliente y al beneficiario final, y entender su actividad y transacciones esperadas."}, {"q": "¿Qué son las personas expuestas políticamente (PEP) en el SARLAFT?", "o": ["Personas que manejan recursos públicos o tienen poder público, a quienes se aplica una debida diligencia reforzada", "Personas sancionadas por AMV", "Empleados de la bolsa", "Accionistas de los bancos"], "e": "Por su exposición a riesgos de corrupción, los PEP requieren controles más estrictos en su vinculación y monitoreo."}, {"q": "El reporte de una operación sospechosa a la UIAF:", "o": ["No constituye una denuncia penal ni da lugar a responsabilidad para quien lo hace de buena fe", "Debe informarse al cliente", "Requiere la aprobación del cliente", "Solo procede si hay una condena"], "e": "El ROS es una herramienta de inteligencia financiera. Quien reporta de buena fe está protegido."}, {"q": "La Ley 1328 de 2009 se conoce como:", "o": ["El régimen de protección al consumidor financiero", "La ley del mercado de valores", "La ley de pensiones", "El estatuto orgánico del Banco de la República"], "e": "La Ley 1328 establece los derechos de los consumidores financieros, las obligaciones de las entidades y la figura del defensor del consumidor."}, {"q": "Un consumidor financiero que no está conforme con la atención de la entidad puede acudir a:", "o": ["El defensor del consumidor financiero de la entidad o la Superintendencia Financiera", "AMV, para que le devuelva su dinero", "El Banco de la República", "La Bolsa de Valores"], "e": "El consumidor puede presentar quejas ante la entidad, su defensor del consumidor o la SFC, que también tiene funciones jurisdiccionales."}, {"q": "¿Qué son las cláusulas abusivas según el régimen de protección al consumidor financiero?", "o": ["Cláusulas que limitan los derechos del consumidor o lo ponen en desventaja injustificada, y que están prohibidas", "Cláusulas que fijan comisiones claras", "Cláusulas aprobadas por el cliente con asesoría", "Cláusulas sobre el horario de atención"], "e": "La Ley 1328 prohíbe incluir cláusulas abusivas en los contratos con consumidores financieros; si se incluyen, se tienen por no escritas."}, {"q": "Según la Ley 964 de 2005, ¿cuál de los siguientes NO se considera un valor?", "o": ["Una póliza de seguros", "Un CDT", "Una aceptación bancaria", "Una cédula hipotecaria"], "e": "Las pólizas de seguros y los títulos de capitalización no son valores. CDT, aceptaciones bancarias y cédulas hipotecarias sí aparecen en la lista (enunciativa) de valores."}, {"q": "Los valores tienen las características de los títulos valores, EXCEPTO:", "o": ["La acción cambiaria de regreso", "La negociabilidad", "La incorporación de un derecho", "La legitimación del tenedor"], "e": "El parágrafo 5 del artículo 2 de la Ley 964 de 2005 excluye la acción cambiaria de regreso. Tampoco procede acción reivindicatoria contra quien adquiera valores inscritos de buena fe exenta de culpa."}, {"q": "Un título que solo requiere su entrega para transferirse válidamente es un título:", "o": ["Al portador", "Nominativo", "A la orden", "De participación"], "e": "Los nominativos requieren inscripción en el registro del emisor; los a la orden, endoso y entrega; los al portador, solo la entrega, y solo pueden expedirse cuando la ley lo autoriza."}, {"q": "Según el derecho que incorporan, las acciones y las participaciones en un FIC son títulos:", "o": ["De participación", "De deuda", "De tradición o representativos de mercancías", "Al portador"], "e": "Los de participación otorgan una parte alícuota de un patrimonio. Los de deuda dan derecho a recibir una suma de dinero, y los de tradición incorporan derechos sobre mercancías (como el CDM)."}, {"q": "En el mercado secundario, una oferta pública de valores:", "o": ["Debe dirigirse a personas no determinadas y no puede exigir cantidades mínimas o máximas de aceptación", "Puede dirigirse a un grupo cerrado de 50 inversionistas", "Debe exigir un monto mínimo de compra", "Requiere siempre una OPA"], "e": "Según el artículo 6.15.1.1.1 del Decreto 2555, en el mercado secundario la oferta pública solo se dirige a personas no determinadas y no admite condiciones adicionales como mínimos o máximos."}, {"q": "¿Cuál de las siguientes ofertas NO constituye oferta pública de valores?", "o": ["La oferta de acciones a los accionistas de la sociedad emisora, cuando son menos de 500 destinatarios", "Una emisión de bonos dirigida al público en general", "Una oferta de acciones dirigida a 150 personas determinadas", "Una OPA sobre acciones inscritas en bolsa"], "e": "No son oferta pública, entre otras: la oferta de acciones o BOCEAS a menos de 500 accionistas, las capitalizaciones ordenadas por autoridad, los programas de beneficios para empleados y las emisiones de financiación colaborativa."}, {"q": "La compraventa de acciones inscritas en bolsa por un valor igual o superior a 66.000 UVR debe:", "o": ["Realizarse a través de los sistemas transaccionales de la bolsa, salvo las excepciones legales", "Registrarse únicamente en el mercado mostrador", "Autorizarse previamente por el Banco de la República", "Hacerse siempre mediante OPA"], "e": "El artículo 6.15.1.1.2 del Decreto 2555 obliga a negociar por bolsa estas operaciones. Entre las excepciones están las compraventas entre un mismo beneficiario real, la readquisición de acciones y las ventas de la Nación o Fogafín."}, {"q": "La inscripción de un valor en el RNVE implica que la Superintendencia Financiera:", "o": ["No asume ninguna responsabilidad sobre la solvencia del emisor ni sobre la bondad del valor", "Garantiza el pago del valor", "Recomienda la inversión", "Certifica la rentabilidad esperada"], "e": "La inscripción no implica calificación ni responsabilidad de la SFC sobre el emisor, el precio, la bondad o la negociabilidad del valor, y esta advertencia debe constar en la información que se divulgue."}, {"q": "¿Qué tipo de acción otorga prioridad en el pago de dividendos y en el reembolso del capital, pero sin derecho a voto?", "o": ["Acción preferencial sin derecho a voto", "Acción ordinaria", "Acción privilegiada", "Acción de goce"], "e": "La acción privilegiada tiene los derechos de la ordinaria más un privilegio económico. La preferencial sin voto da prioridad en dividendos y reembolso, pero no vota."}, {"q": "El derecho de preferencia en la negociación de acciones:", "o": ["No opera cuando las acciones están inscritas en una bolsa de valores", "Opera siempre, incluso en bolsa", "Solo opera para acciones preferenciales", "Obliga a vender primero a la Superintendencia"], "e": "El derecho de preferencia permite a los accionistas mantener su participación en nuevas emisiones, pero no opera en la negociación de acciones inscritas en bolsa: una cláusula en ese sentido se tiene por no escrita (art. 407 C. Co.)."}, {"q": "Si un inversionista compra acciones durante el período exdividendo, el dividendo pendiente de pago:", "o": ["Pertenece al vendedor", "Pertenece al comprador", "Se divide entre ambos", "Se pierde"], "e": "El período exdividendo va entre el primer día hábil de pago de dividendos y los cuatro días hábiles bursátiles anteriores. Las compras en ese período no incluyen el dividendo, que queda para el vendedor."}, {"q": "El período exdividendo comprende el primer día hábil de pago del dividendo y:", "o": ["Los cuatro días hábiles bursátiles inmediatamente anteriores", "Los diez días calendario anteriores", "El mes anterior", "Los dos días hábiles siguientes"], "e": "Así lo define el Reglamento de la BVC. Su propósito es dar tiempo al emisor para actualizar el libro de accionistas."}, {"q": "Si un CDT no se redime a su vencimiento:", "o": ["Se entiende prorrogado por un plazo igual al inicialmente pactado", "Se liquida automáticamente y el dinero pasa a una cuenta de ahorros", "Pierde sus intereses", "Se convierte en un bono"], "e": "Los CDT son nominativos y no redimibles antes del vencimiento. Si no se cobran, se prorrogan por el mismo plazo."}, {"q": "¿Cuál es el plazo mínimo de los bonos según el Decreto 2555 de 2010?", "o": ["Un año", "Tres meses", "Quince días", "Cinco años"], "e": "No pueden emitirse bonos con vencimiento inferior a un año, aunque en los convertibles el prospecto puede prever la conversión antes de ese plazo."}, {"q": "¿Quién designa y quién paga al representante legal de los tenedores de bonos?", "o": ["Lo designa inicialmente el emisor y lo remunera el emisor", "Lo designa la Superintendencia y lo pagan los tenedores", "Lo elige la bolsa y lo paga el Gobierno", "Lo nombra AMV y no recibe remuneración"], "e": "El emisor lo designa inicialmente y paga su remuneración; la asamblea de tenedores puede reemplazarlo en cualquier momento. Pueden serlo bancos, corporaciones financieras y fiduciarias autorizadas."}, {"q": "El representante legal de los tenedores de bonos, en las asambleas de accionistas del emisor:", "o": ["Interviene con voz pero sin voto", "Tiene voz y voto", "No puede asistir", "Vota en nombre de los tenedores"], "e": "Es una de sus funciones según el artículo 6.4.1.1.9 del Decreto 2555."}, {"q": "En los bonos obligatoriamente convertibles en acciones (BOCEAS):", "o": ["Al vencimiento el inversionista recibe el capital y los rendimientos en acciones", "El inversionista decide si convierte o no", "Siempre se pagan en efectivo", "Pueden colocarse por debajo de su valor nominal"], "e": "En los BOCEAS la conversión es obligatoria. En los facultativamente convertibles decide el inversionista. Ningún bono convertible puede colocarse por debajo de su valor nominal."}, {"q": "Una sociedad emisora que está en mora de pagar sus bonos o los intereses de estos:", "o": ["No puede repartir ni pagar dividendos", "Puede pagar dividendos con autorización de la asamblea", "Debe liquidarse de inmediato", "Puede emitir más bonos sin restricción"], "e": "Lo establece el artículo 6.4.1.1.26 del Decreto 2555."}, {"q": "¿Qué característica tienen los bonos de riesgo?", "o": ["Los emiten empresas en proceso de reestructuración y no es obligatorio que tengan representante legal de tenedores", "Los emite la Nación para financiar proyectos riesgosos", "Son siempre de corto plazo", "Solo pueden negociarse en el segundo mercado"], "e": "Se rigen por el Decreto 1074 de 2015, pueden convertirse en acciones o cuotas, y en una liquidación se pagan después de otros pasivos externos y antes de cualquier reembolso a acreedores internos."}, {"q": "En una emisión rotativa de papeles comerciales:", "o": ["El emisor puede volver a colocar el monto redimido hasta el cupo global autorizado, sin superar dos años", "No hay posibilidad de rotación ni de prórroga", "El plazo de cada papel puede ser de tres años", "Los recursos pueden usarse para comprar acciones"], "e": "La emisión única no admite rotación ni prórroga. Los recursos de papeles comerciales no pueden destinarse a adquirir acciones o bonos convertibles."}, {"q": "La financiación mediante aceptaciones bancarias tiene un plazo máximo de:", "o": ["Un año", "Cinco años", "Noventa días", "No tiene límite"], "e": "Las aceptaciones nacen de compraventas de bienes muebles o de operaciones de comercio exterior; las pueden aceptar bancos, corporaciones financieras y compañías de financiamiento."}, {"q": "Los TES Clase A se emiten para:", "o": ["Sustituir la deuda contraída en operaciones de mercado abierto o la deuda interna de la Nación con el Banco de la República", "Financiar las apropiaciones presupuestales del Gobierno", "Financiar a las empresas privadas", "Captar ahorro de los fondos de pensiones exclusivamente"], "e": "Los TES Clase B son los que financian apropiaciones presupuestales y operaciones de tesorería del Gobierno. Los TES se crearon con la Ley 51 de 1990 y son títulos a la orden."}, {"q": "En un proceso de titularización, el agente de manejo es quien:", "o": ["Actúa como vocero del patrimonio autónomo emisor, recauda los recursos de la emisión y se relaciona con los inversionistas", "Transfiere los activos al patrimonio autónomo", "Custodia y administra los activos titularizados", "Califica el riesgo de la emisión"], "e": "La originadora transfiere los activos, la administradora los custodia y recauda sus flujos, y la colocadora (no esencial) actúa como underwriter."}, {"q": "¿Qué afirmación es correcta sobre los valores de financiación colaborativa (crowdfunding)?", "o": ["No constituyen oferta pública ni se inscriben en el RNVE, y su colocación no es intermediación de valores", "Deben inscribirse en el RNVE y negociarse en el segundo mercado", "Requieren representante legal de tenedores", "Solo pueden adquirirlos inversionistas profesionales"], "e": "Los emiten solo entidades autorizadas (SOFICO o bolsas, como a2censo de la BVC) y no pueden trasladarse al mercado principal ni al segundo mercado."}, {"q": "En un proyecto de financiación colaborativa que no alcanza el porcentaje mínimo de financiación en el plazo fijado, los recursos deben devolverse en un máximo de:", "o": ["Treinta días", "Seis meses", "Un año", "Tres días hábiles"], "e": "La consecución de recursos no puede superar seis meses desde la publicación; si no se logra el mínimo, se devuelve el dinero en máximo 30 días."}, {"q": "En los bonos de prenda, la suma del capital y del rendimiento del crédito no puede superar:", "o": ["El 70 % del valor del certificado de depósito", "El 100 % del valor de la mercancía", "El 50 % del patrimonio del depositante", "El 25 % del valor del certificado"], "e": "Además, la vigencia del bono no puede ser superior al término del depósito."}, {"q": "Según el principio de finalidad (artículo 10 de la Ley 964 de 2005), una orden aceptada por un sistema de compensación y liquidación:", "o": ["Es firme, irrevocable, exigible y oponible frente a terceros", "Puede anularse por decisión del cliente hasta la liquidación", "Queda sujeta a aprobación de la Superintendencia", "Puede embargarse en cualquier momento"], "e": "Desde su aceptación, la orden no puede impugnarse, anularse ni suspenderse. Además, las garantías entregadas al sistema no pueden ser embargadas hasta que se cumplan las obligaciones (art. 11)."}, {"q": "¿En qué orden se desarrollan las etapas del proceso de una operación sobre valores?", "o": ["Cierre, compensación y liquidación", "Liquidación, cierre y compensación", "Compensación, cierre y liquidación", "Registro, custodia y cierre"], "e": "En el cierre las partes acuerdan los términos; en la compensación se calculan las prestaciones (bruta, por saldos netos o con contraparte central); en la liquidación se cumplen definitivamente."}, {"q": "En una operación del mercado mostrador entre un afiliado a un sistema de registro y una persona no afiliada, ¿quién debe registrarla?", "o": ["El afiliado", "La persona no afiliada", "La bolsa de valores", "La Superintendencia Financiera"], "e": "Cuando la operación se hace por corretaje, la registra el intermediario. La omisión del registro oportuno es una conducta contraria a la integridad del mercado."}, {"q": "¿Quiénes son intermediarios de valores?", "o": ["Las entidades vigiladas por la SFC con acceso directo a un sistema de negociación o de registro para hacer operaciones de intermediación", "Todas las personas que compran valores", "Los emisores de valores", "Las calificadoras de riesgo"], "e": "Además, deben inscribirse en el RNAMV y sus funcionarios que dirigen o ejecutan operaciones, en el RNPMV."}, {"q": "¿Qué entidades pueden celebrar contratos de comisión y de corretaje sobre valores?", "o": ["Las sociedades comisionistas de bolsa, las comisionistas independientes y las comisionistas de bolsas de productos agropecuarios (sobre valores)", "Los bancos comerciales", "Las sociedades fiduciarias", "Las administradoras de fondos de pensiones"], "e": "La colocación de emisiones (en firme, garantizada o al mejor esfuerzo) la pueden hacer además las corporaciones financieras."}, {"q": "Cuando dos intermediarios participan en una misma operación, ¿cuál se considera cliente?", "o": ["El intermediario que actúa en desarrollo de un contrato de comisión o de corretaje", "Ambos, siempre", "Ninguno", "El que tenga mayor patrimonio"], "e": "Lo dispone el artículo 7.2.1.1.1 del Decreto 2555. Además, todo intermediario debe clasificar a sus clientes e informarles su categoría y el régimen de protección."}, {"q": "Además del patrimonio mínimo, ¿cuál condición alternativa permite clasificar a un cliente como inversionista profesional?", "o": ["Haber hecho 15 o más operaciones en 60 días calendario, en los dos años anteriores, por un valor agregado de al menos 552.573,41 UVT", "Tener un título universitario en economía", "Haber invertido alguna vez en acciones", "Llevar más de un año como cliente de la entidad"], "e": "La otra alternativa es tener un portafolio de inversión de al menos 78.939,06 UVT. El patrimonio mínimo es de 157.878,12 UVT."}, {"q": "¿Cuál de los siguientes clientes es inversionista profesional sin necesidad de acreditar patrimonio?", "o": ["Un organismo financiero multilateral", "Un trabajador con un CDT", "Un pensionado", "Una pyme no vigilada"], "e": "También lo son las personas con certificación vigente de operador, las entidades vigiladas por la SFC y quienes estén calificados como profesionales en la Alianza del Pacífico."}, {"q": "Un inversionista profesional que quiere más protección puede:", "o": ["Pedir el tratamiento de cliente inversionista, de forma general o para un tipo de operación, dejándolo por escrito verificable", "Nada; la clasificación es permanente", "Pedir que la SFC lo reclasifique", "Renunciar a su certificación"], "e": "El intermediario debe informarle de este derecho al clasificarlo (art. 7.2.1.1.6 del Decreto 2555)."}, {"q": "Para efectos de conflictos de interés, ¿quién es un 'vinculado' de un intermediario de valores?", "o": ["El accionista o beneficiario real del 10 % o más de la participación en el intermediario", "Cualquier cliente con más de un año de antigüedad", "Un proveedor de servicios tecnológicos", "Un accionista con el 1 % del capital"], "e": "También son vinculados las sociedades en que el intermediario tiene el 10 % o más, su matriz, filiales y subordinadas, y los administradores del intermediario y de esas entidades."}, {"q": "Para un cliente inversionista, el deber de mejor ejecución se evalúa principalmente con base en:", "o": ["El precio o la tasa de la operación, neto de todos los costos asociados", "La rapidez de la ejecución exclusivamente", "La comisión más alta para el intermediario", "El volumen negociado por el intermediario ese día"], "e": "Para los demás clientes se consideran también los costos, el tiempo, la probabilidad de ejecución y el volumen. El intermediario debe poder acreditar que cumplió su política de ejecución."}, {"q": "Los recursos o valores de los clientes que maneja un intermediario:", "o": ["No hacen parte de los activos del intermediario ni son prenda general de sus acreedores", "Pueden usarse para cumplir las operaciones por cuenta propia", "Forman parte del patrimonio técnico del intermediario", "Pueden embargarse por deudas del intermediario"], "e": "Es el deber de separación de activos: el intermediario nunca puede usar esos recursos para sus propias operaciones."}, {"q": "El deber de asesoría NO aplica cuando la entidad:", "o": ["Actúa como gestor de un fondo de capital privado", "Distribuye fondos de inversión colectiva", "Ejecuta un contrato de comisión", "Vincula clientes a un fondo voluntario de pensiones"], "e": "Tampoco aplica a los estructuradores de banca de inversión ni al ofrecimiento de servicios financieros del exterior. Sí aplica a comisión, corretaje, APT, FIC, FVP, fiducia de inversión y cuentas de margen."}, {"q": "El contrato de comisión genera para el comisionista una obligación:", "o": ["De medio y no de resultado", "De resultado", "De garantizar la rentabilidad", "Solidaria con el emisor"], "e": "Es un mandato no representativo, consensual y que exige un mandatario profesional. Se perfecciona cuando la entidad recibe la orden del cliente."}, {"q": "El libro electrónico de órdenes (LEO) de una sociedad comisionista registra:", "o": ["En forma consecutiva y cronológica todas las órdenes recibidas por cuenta de terceros", "Solo las operaciones por cuenta propia", "Las quejas de los clientes", "Los estados financieros diarios"], "e": "Debe cumplir los principios de trazabilidad, equidad, revelación e integridad. Pueden ingresar órdenes los directivos, digitadores, operadores y asesores certificados en la especialidad correspondiente."}, {"q": "¿Cuál de los siguientes es un medio válido para recibir una orden de un cliente?", "o": ["Un medio verbal grabado o cualquier otro medio verificable", "Una conversación informal sin registro", "Un mensaje de un tercero no autorizado", "Una suposición del operador sobre lo que quiere el cliente"], "e": "Las órdenes, sus modificaciones y cancelaciones deben recibirse por medios verificables: verbales grabados, escritos firmados o digitales con identificación cierta del cliente."}, {"q": "¿Qué entidades pueden celebrar contratos de cuentas de margen?", "o": ["Las sociedades comisionistas de bolsa (comisión o APT) y las sociedades fiduciarias (fiducia o encargo)", "Cualquier banco comercial", "Las administradoras de fondos de pensiones", "Las calificadoras de riesgo"], "e": "Las operaciones solo pueden hacerse en sistemas de negociación y sobre valores de alta liquidez definidos por la SFC."}, {"q": "¿Cuál de las siguientes es una prohibición en las cuentas de margen?", "o": ["Que las personas inscritas en el RNPMV hagan operaciones de cuentas de margen", "Que el cliente sea una persona jurídica", "Que se usen sistemas de negociación", "Que el margen se deposite antes de invertir"], "e": "Tampoco se permite que la sociedad tome decisiones discrecionales en la cuenta, ni hacer operaciones con efectos similares sin cumplir los requisitos."}, {"q": "En la colocación garantizada de una emisión, la sociedad comisionista:", "o": ["Se compromete a colocar la emisión en un plazo y a suscribir el remanente que no logre colocar", "Suscribe toda la emisión desde el inicio para luego revenderla", "Solo hace su mejor esfuerzo, sin obligación de comprar", "Garantiza la rentabilidad a los inversionistas"], "e": "En la colocación en firme suscribe la emisión y luego la ofrece al público; en la de mejor esfuerzo no asume el remanente."}, {"q": "En la financiación de valores que otorga una sociedad comisionista, los valores recibidos en garantía se aceptan como máximo por:", "o": ["El 80 % de su valor actual según su cotización en bolsa", "El 100 % de su valor nominal", "El 50 % de su valor de compra", "El 120 % de su valor de mercado"], "e": "La garantía debe cubrir como mínimo el 100 % del préstamo, y los pasivos de la SCB destinados a financiar valores no pueden superar tres veces su patrimonio técnico."}, {"q": "Un operador de distribución:", "o": ["Representa a la entidad como contraparte de clientes en el mercado mostrador, sin discrecionalidad para asumir posiciones", "Administra portafolios de terceros", "Coloca emisiones en el mercado primario", "Ejecuta órdenes de clientes en la bolsa"], "e": "Es una figura propia de la actividad de distribución, dentro del manejo de recursos propios."}, {"q": "Una sociedad comisionista que administra portafolios de terceros debe enviar a su cliente extractos con una periodicidad:", "o": ["Mensual", "Anual", "Trimestral", "Solo cuando el cliente lo pida"], "e": "El extracto debe incluir al menos el valor total del portafolio, la rentabilidad neta y la composición por plazos y especies."}, {"q": "¿Cuál de las siguientes conductas está prohibida a una SCB que administra portafolios de terceros?", "o": ["Invertir los recursos del portafolio en valores emitidos o garantizados por la propia SCB", "Cobrar oportunamente los dividendos del portafolio", "Llevar contabilidad separada de cada portafolio", "Adoptar el SARLAFT"], "e": "Tampoco puede dar liquidez a sus vinculadas con esos recursos, comprar valores de colocaciones que hace en firme antes de terminar, ni representar en asambleas las acciones del portafolio."}, {"q": "Los encargos y contratos fiduciarios de inversión:", "o": ["No pueden tener por objeto asumir obligaciones de resultado, salvo que la ley lo prevea", "Garantizan siempre la rentabilidad pactada", "Transfieren los bienes al patrimonio de la fiduciaria", "Pueden usarse para actos que el fideicomitente no podría hacer directamente"], "e": "La fiduciaria actúa como vocera del patrimonio autónomo y el negocio fiduciario no puede servir para hacer actos que el fideicomitente no podría celebrar directamente."}, {"q": "Un fondo de inversión colectiva del mercado monetario se caracteriza porque:", "o": ["Es abierto sin pacto de permanencia, invierte en valores en pesos con grado de inversión y su plazo promedio ponderado no supera 365 días", "Es cerrado e invierte en inmuebles", "Invierte al menos dos tercios en activos no inscritos en el RNVE", "Replica un índice bursátil"], "e": "Los títulos de la Nación, del Banco de la República y de Fogafín no requieren calificación."}, {"q": "Un fondo de capital privado (FCP) debe destinar al menos:", "o": ["Dos terceras partes de los aportes a activos distintos de valores inscritos en el RNVE", "El 75 % a inmuebles", "El 100 % a TES", "La mitad a acciones inscritas en bolsa"], "e": "Los FCP son FIC cerrados. Los inmobiliarios, también cerrados, deben tener al menos el 75 % en activos inmobiliarios (no exigible en los primeros seis meses)."}, {"q": "¿Cuál es la ventaja de crear una familia de fondos de inversión colectiva?", "o": ["Solo el primer fondo de la familia requiere autorización de la Superintendencia", "Los fondos de la familia no pagan comisión", "La familia garantiza una rentabilidad mínima", "Los fondos pueden invertir sin límites"], "e": "Los fondos que se creen después dentro de la familia ya autorizada no deben surtir el trámite de autorización."}, {"q": "Una administradora de fondos de pensiones y cesantías puede gestionar:", "o": ["Un solo fondo de cesantías, con un portafolio de corto plazo y otro de largo plazo", "Varios fondos de cesantías con un solo portafolio", "Solo fondos voluntarios", "Fondos de capital privado únicamente"], "e": "En pensiones obligatorias debe ofrecer los fondos conservador, moderado y de mayor riesgo, más el de retiro programado. Garantiza rentabilidad mínima en los fondos obligatorios y en ambos portafolios de cesantías."}, {"q": "En los fondos voluntarios de pensión, una alternativa en la que la administradora define los portafolios y el partícipe decide qué porcentaje invierte en cada uno se llama:", "o": ["Alternativa flexible", "Alternativa estandarizada", "Alternativa autogestionada", "Alternativa cerrada"], "e": "En la estandarizada la administradora decide portafolios y porcentajes; en la autogestionada el cliente elige libremente portafolios y distribución."}, {"q": "En la administración de valores, la sociedad comisionista responde hasta por:", "o": ["La culpa leve", "La culpa grave únicamente", "El dolo únicamente", "No asume ninguna responsabilidad"], "e": "Debe emplear el mayor grado de diligencia, controlar el cobro de capital y rendimientos y reinvertir según las instrucciones del cliente."}, {"q": "¿Cuál es una diferencia entre el repo y la simultánea respecto del monto inicial?", "o": ["En el repo puede calcularse con un descuento (haircut) sobre el precio de mercado; en la simultánea no", "En la simultánea se aplica siempre un descuento del 20 %", "En ambos se prohíbe cualquier descuento", "En el repo no hay monto inicial"], "e": "Además, en el repo se pueden sustituir los valores entregados y restringir su movilidad; en la simultánea no se puede hacer ninguna de las dos cosas."}, {"q": "Durante la vigencia de un repo, si los valores pagan rendimientos o dividendos:", "o": ["El adquirente debe transferir su importe al enajenante en la misma fecha del pago", "Los conserva el adquirente", "Se reparten por mitades", "Se pagan al vencimiento de la operación"], "e": "En la TTV ocurre lo mismo: el receptor transfiere al originador los rendimientos de los valores objeto de la operación."}, {"q": "En Colombia, las ventas en corto se usan en la práctica:", "o": ["Solo en el mercado de renta fija, porque renta variable no tiene una rueda libre de TTV para tomar prestados los valores", "Solo en acciones", "En todos los mercados sin restricción", "Están prohibidas"], "e": "El vendedor debe hacer, a más tardar el mismo día, las operaciones necesarias para no dejar descubierta la venta. En acciones, el precio no puede ser inferior al último que marcó precio."}, {"q": "El costo de reposición de un instrumento financiero derivado es:", "o": ["Su precio justo de intercambio cuando es positivo; si es negativo, cero", "El precio pagado al inicio del contrato", "La prima de la opción", "El valor nominal del contrato"], "e": "La exposición crediticia de un derivado es la suma del costo de reposición y la exposición potencial futura."}, {"q": "¿Quiénes pueden hacer operaciones con derivados en nombre propio pero por cuenta ajena, mediante contrato de comisión?", "o": ["Solo las sociedades comisionistas de bolsa", "Todos los bancos", "Las fiduciarias", "Las compañías de seguros"], "e": "Las entidades vigiladas por la SFC pueden hacer operaciones con derivados y estructurados, pero solo las SCB pueden hacerlas por cuenta de terceros vía comisión (art. 2.35.1.1.2 del Decreto 2555)."}, {"q": "Un producto estructurado tiene la calidad de valor cuando:", "o": ["Al menos uno de sus componentes tiene la calidad de valor", "Lo autoriza el Banco de la República", "Su plazo supera un año", "Todos sus componentes son derivados"], "e": "Un estructurado combina uno o más instrumentos no derivados con uno o más derivados."}, {"q": "¿Cuál de las siguientes NO constituye un instrumento financiero derivado?", "o": ["Una permuta o intercambio de títulos", "Un swap de tasa de interés (IRS)", "Un forward de tasa de cambio", "Un futuro sobre TES"], "e": "Los swaps básicos son los de tasa de interés y los de monedas (CCS). Los swaps sobre otros subyacentes se consideran exóticos."}, {"q": "Quien ya es beneficiario real del 25 % o más del capital con derecho a voto de una sociedad inscrita en bolsa solo puede aumentar su participación en más de un 5 % mediante:", "o": ["Una oferta pública de adquisición (OPA)", "Una compra en el mercado mostrador", "Un repo", "Una TTV"], "e": "Artículo 6.15.2.1.1 del Decreto 2555. La OPA debe hacerse por al menos el 5 % del capital con derecho a voto y requiere autorización de la SFC y una garantía ante la bolsa."}, {"q": "¿En cuál de estos casos NO es obligatorio realizar una OPA?", "o": ["Cuando la sociedad readquiere sus propias acciones", "Cuando un inversionista quiere pasar del 10 % al 30 % del capital con voto de una sociedad inscrita", "Cuando quien ya tiene el 30 % quiere subir al 40 %", "Cuando un grupo de un mismo beneficiario real quiere llegar al 26 %"], "e": "Tampoco es obligatoria con aceptación escrita del 100 % de los accionistas, en privatizaciones, al emitirse capital con voto, al capitalizar acreencias, o por donación, sucesión, orden judicial o dación en pago."}, {"q": "En una oferta pública para la democratización, las acciones ofrecidas deben estar inscritas en bolsa con una antelación no inferior a:", "o": ["Seis meses", "Un mes", "Dos años", "Cinco días hábiles"], "e": "También deben estar libres de gravámenes, limitaciones de dominio y pleitos que afecten su negociabilidad."}, {"q": "Las sociedades administradoras de fondos de pensiones y cesantías (AFPC) son sociedades:", "o": ["De objeto social exclusivo, vigiladas por la SFC", "Que pueden captar depósitos a la vista", "Que pueden ser comisionistas de bolsa al mismo tiempo", "No vigiladas"], "e": "Administran fondos de pensiones obligatorias, de cesantías, voluntarios y patrimonios autónomos pensionales, y deben mantener liquidez para responder por la rentabilidad mínima."}, {"q": "En los fondos mutuos de inversión, la inversión en acciones o bonos obligatoriamente convertibles en acciones no puede exceder:", "o": ["El 80 % del activo total del fondo", "El 10 % del activo", "El 50 % del patrimonio de la empresa", "No tiene límite"], "e": "Además, las operaciones repo, simultáneas y TTV no pueden superar en conjunto el 30 % del activo total. Los fondos mutuos se rigen por el Decreto 2968 de 1960."}, {"q": "La cámara de riesgo central de contraparte tiene como objeto:", "o": ["Exclusivamente prestar el servicio de compensación como contraparte central para reducir o eliminar el riesgo de incumplimiento", "Custodiar valores desmaterializados", "Calificar el riesgo de los emisores", "Administrar fondos de inversión"], "e": "Al interponerse como acreedora y deudora recíproca, la exposición de crédito de contraparte en operaciones aceptadas por la CRCC se considera cero (art. 15 de la Ley 964 de 2005)."}, {"q": "En una CRCC, si un miembro liquidador actúa por cuenta de un tercero que incumple, ¿quién responde ante la cámara?", "o": ["El miembro liquidador", "La cámara asume la pérdida", "La Superintendencia", "Nadie; la operación se anula"], "e": "El miembro no liquidador liquida a través de un miembro liquidador y también responde por los terceros por cuya cuenta actúa."}, {"q": "¿Qué principio de los registros de un depósito centralizado de valores indica que los titulares de valores de una misma emisión lo son por cantidad y no de valores específicos?", "o": ["Fungibilidad", "Tracto sucesivo", "Rogación", "Prioridad"], "e": "Prioridad: un registro excluye otros incompatibles anteriores. Tracto sucesivo: los registros se encadenan cronológicamente. Rogación: requieren solicitud del titular. Buena fe: el titular registrado se presume legítimo."}, {"q": "La vigencia de una calificación otorgada por una sociedad calificadora de riesgos no puede superar:", "o": ["Un año", "Tres años", "Seis meses", "Cinco años"], "e": "Las calificadoras deben revisarla y monitorearla permanentemente, y la calificación nunca es una recomendación de compra, venta o mantenimiento."}, {"q": "¿En qué plazo debe divulgar una calificadora la calificación aprobada por su comité técnico?", "o": ["En máximo 24 horas, y el documento que la sustenta dentro de los 8 días hábiles siguientes", "En 30 días calendario", "Al cierre del año", "Cuando el emisor lo autorice"], "e": "Debe informarla a la SFC, a los sistemas de negociación y publicarla en su página web."}, {"q": "¿Cuál de los siguientes valores NO necesita calificación para inscribirse en el RNVE?", "o": ["Un valor del segundo mercado", "Un bono ordinario de una empresa del sector real", "Un papel comercial", "Un valor emitido en una titularización"], "e": "Requieren al menos una calificación los bonos ordinarios, los papeles comerciales, los bonos de establecimientos de crédito y de entidades públicas (salvo Fogafín) y los valores de titularización."}, {"q": "Si la Superintendencia suspende la inscripción de un profesional en el RNPMV:", "o": ["El profesional no puede actuar en el mercado de valores y su entidad debe asegurarse de que deje esas funciones", "Puede seguir operando hasta que AMV decida", "Solo pierde su certificación de asesor", "Puede actuar si un directivo lo autoriza"], "e": "La suspensión en el RNVE impide la oferta pública del valor y la del RNAMV impide al agente actuar en las actividades afectadas."}, {"q": "Según el Decreto 151 de 2021, la información relevante de un emisor debe divulgarse:", "o": ["Inmediatamente, a través de la página web de la SFC", "Dentro de los 30 días siguientes al hecho", "Solo en la asamblea anual", "Cuando lo apruebe la junta directiva en su siguiente reunión"], "e": "Si el hecho se originó en un tercero, se divulga en cuanto el emisor lo conozca. También es relevante la información material que se revele a personas sin deber de confidencialidad."}, {"q": "Si un emisor obtiene autorización de la SFC para no divulgar un hecho relevante, esa información:", "o": ["Se considera información privilegiada mientras no se divulgue", "Deja de ser relevante", "Puede comentarse libremente con clientes", "Debe publicarse en redes sociales"], "e": "La SFC fija un plazo prorrogable. Si desaparecen las razones antes del vencimiento, el emisor debe divulgarla de inmediato."}, {"q": "¿Cuál de estos temas NO puede modificar el Gobierno nacional mediante decreto, por ser competencia del Congreso?", "o": ["La forma societaria y las causales de disolución de las entidades vigiladas", "El régimen de inversiones de los FIC", "Las reglas de los repos", "Los requisitos de información de los emisores"], "e": "Según el artículo 5 de la Ley 964 de 2005, la estructura del mercado, la constitución, el objeto principal, la forma societaria y las causales de disolución, toma de posesión y liquidación de las vigiladas son temas del Congreso."}, {"q": "¿Cuántos miembros tiene la Junta Directiva del Banco de la República y quién la preside?", "o": ["Siete miembros, presidida por el Ministro de Hacienda", "Cinco miembros, presidida por el Gerente", "Nueve miembros, presidida por el Superintendente Financiero", "Siete miembros, presidida por el Presidente de la República"], "e": "La Junta elige al Gerente entre sus miembros. Los otros cinco son de dedicación exclusiva, nombrados por el Presidente por períodos de cuatro años prorrogables (se reemplazan dos cada cuatro años)."}, {"q": "La Unidad de Regulación Financiera (URF):", "o": ["Hace parte del Ministerio de Hacienda y prepara los estudios y proyectos de decretos de regulación financiera", "Supervisa a las entidades vigiladas", "Es el autorregulador del mercado de divisas", "Administra el Depósito Central de Valores"], "e": "La regulación la expide el Gobierno por decreto (compilada en el Decreto 2555) y la URF le da el soporte técnico."}, {"q": "¿Qué principio de la facultad sancionatoria de la SFC busca que la sanción disuada a otros funcionarios y entidades de cometer la misma infracción?", "o": ["Principio ejemplarizante", "Principio de contradicción", "Principio de revelación dirigida", "Principio de proporcionalidad"], "e": "La revelación dirigida permite a la SFC decidir cuándo divulgar una sanción si su publicación puede afectar la estabilidad de las entidades."}, {"q": "La suspensión o inhabilitación que puede imponer la SFC para ejercer cargos que requieren posesión ante ella puede ser hasta por:", "o": ["Cinco años", "Diez años", "Un año", "De por vida"], "e": "Las sanciones administrativas incluyen amonestación, multa, remoción, suspensión o inhabilitación hasta por cinco años y clausura de oficinas de representación."}, {"q": "¿Cuál de las siguientes entidades NO forma parte de un conglomerado financiero según la Ley 1870 de 2017?", "o": ["Un fondo de pensiones obligatorias administrado por una AFP del grupo", "Un banco del grupo", "Una sociedad comisionista de bolsa del grupo", "El holding financiero"], "e": "Tampoco forman parte los FIC (salvo los FCP), los fondos mutuos, las titularizadoras, los proveedores de infraestructura ni las empresas en que invierten esos fondos."}, {"q": "¿Qué es el holding financiero en un conglomerado?", "o": ["La persona jurídica o vehículo que ejerce el primer nivel de control o influencia significativa sobre las entidades del conglomerado", "El banco más grande del grupo", "La Superintendencia Financiera", "El fondo de pensiones del grupo"], "e": "Con la Ley 1870 de 2017, la SFC supervisa al holding aunque no sea entidad financiera ni emisor de valores."}, {"q": "¿Cuáles son los riesgos asociados a través de los cuales se materializa el riesgo de LA/FT?", "o": ["Reputacional, legal, operativo y de contagio", "Mercado, crédito y liquidez", "Tasa de interés y tasa de cambio", "Estratégico y de concentración"], "e": "El riesgo de contagio es la posible pérdida por la acción o experiencia de un vinculado."}, {"q": "¿Cuál es un requisito para ser oficial de cumplimiento del SARLAFT?", "o": ["Ser como mínimo de segundo nivel jerárquico y tener al menos 24 meses de experiencia en administración de riesgos", "Pertenecer al área comercial", "Ser miembro del órgano de control interno", "No tener título profesional"], "e": "También debe tener título profesional, capacidad decisoria, equipo de apoyo, estar posesionado ante la SFC y no pertenecer a órganos de control ni a áreas del negocio principal. Tiene un suplente."}, {"q": "¿Con qué periodicidad mínima debe el oficial de cumplimiento presentar informes a la junta directiva?", "o": ["Semestral", "Anual", "Mensual", "Cada tres años"], "e": "La revisoría fiscal, por su parte, evalúa anualmente la efectividad del SARLAFT."}, {"q": "¿Cada cuánto deben confirmarse y actualizarse como mínimo los datos de los clientes que pueden variar (dirección, actividad, origen de recursos)?", "o": ["Anualmente", "Cada cinco años", "Solo al vincularlo", "Cada mes"], "e": "El formulario y la firma pueden ser electrónicos (Ley 527 de 1999), pero eso no sustituye la entrevista al cliente potencial."}, {"q": "Las fases del SARLAFT son:", "o": ["Prevención y control", "Compra y venta", "Captación y colocación", "Emisión y negociación"], "e": "La prevención busca impedir que entren recursos ilícitos; el control busca detectar y reportar operaciones que intenten darles apariencia de legalidad."}, {"q": "La segmentación de los factores de riesgo en el SARLAFT debe hacerse como mínimo por:", "o": ["Clientes, productos, canales de distribución y jurisdicciones", "Edad, sexo y estado civil", "Sucursales y horarios", "Tasa, plazo y monto"], "e": "La segmentación permite conocer las características usuales de las transacciones y detectar las inusuales."}, {"q": "Según la Ley 222 de 1995, ¿quién de los siguientes es administrador de una sociedad?", "o": ["El factor", "Un accionista minoritario", "El revisor fiscal", "Un cliente"], "e": "Son administradores el representante legal, el liquidador, el factor, los miembros de juntas y quienes ejerzan esas funciones. También los miembros de comités de inversiones de FIC y de inversión y riesgo de AFP."}, {"q": "Los administradores de una sociedad que causen perjuicios por dolo o culpa responden:", "o": ["Solidaria e ilimitadamente", "Solo hasta el monto de su salario", "Únicamente si son representantes legales", "Solo frente a la Superintendencia"], "e": "Artículo 200 del Código de Comercio. No responden quienes no conocieron la acción u omisión o votaron en contra, y se presume la culpa cuando hay violación de la ley o los estatutos."}, {"q": "La acción social de responsabilidad contra los administradores la ejerce la compañía previa decisión de la asamblea. Si no se inicia dentro de los tres meses siguientes:", "o": ["Puede ejercerla cualquier administrador, el revisor fiscal o cualquier socio", "Prescribe automáticamente", "La ejerce la Superintendencia de oficio", "Solo puede ejercerla AMV"], "e": "La decisión de la asamblea se toma por la mitad más una de las acciones representadas e implica la remoción del administrador (art. 25 de la Ley 222 de 1995)."}, {"q": "¿Quién designa al defensor del consumidor financiero y por qué período?", "o": ["La asamblea general de accionistas, por dos años prorrogables", "La junta directiva, por un año", "La Superintendencia Financiera, por cuatro años", "El presidente de la entidad, por tiempo indefinido"], "e": "Se designan un principal y un suplente, que deben posesionarse ante la SFC. Un mismo defensor puede atender varias entidades."}, {"q": "¿Cuál es un requisito para ser defensor del consumidor financiero?", "o": ["No haber sido director, empleado o contratista de la entidad o su grupo en el año anterior", "Ser empleado de la entidad con más de cinco años de antigüedad", "Tener certificación AMV como operador", "Ser accionista de la entidad"], "e": "Además debe acreditar al menos cinco años de experiencia o estudios especializados y estar certificado como conciliador (Ley 640 de 2001)."}, {"q": "¿Cuál de las siguientes quejas NO es competencia del defensor del consumidor financiero?", "o": ["Una reclamación por una cuantía superior a 100 SMMLV", "Una queja por un cobro indebido de comisión de 2 SMMLV", "Una queja por mala atención en una oficina", "Una queja por información incompleta sobre un producto"], "e": "Tampoco son de su competencia los asuntos laborales, los derivados de la condición de accionista, los hechos de tres años o más, los que estén en trámite judicial o arbitral y la decisión de la entidad de prestar o no un servicio."}, {"q": "El acuerdo al que se llega cuando el defensor del consumidor financiero actúa como conciliador:", "o": ["Presta mérito ejecutivo y tiene efectos de cosa juzgada", "No tiene ningún efecto jurídico", "Debe ser aprobado por la Superintendencia", "Solo obliga a la entidad"], "e": "Las demás decisiones del defensor solo son obligatorias si así se pactó o si lo prevé el reglamento de la defensoría."}, {"q": "Un abogado que, como parte de su asesoría legal, comenta a su cliente una oportunidad de inversión, sin promocionarse como asesor ni cobrar por ello. ¿Requiere certificación AMV?", "o": ["No, porque se trata de un consejo profesional accesorio a su profesión", "Sí, siempre que hable de inversiones", "Solo si el cliente invierte", "Sí, como asesor financiero"], "e": "El consejo profesional no requiere certificación ni inscripción en el RNPMV si es accesorio, se basa en su profesión, se remunera por ella y la persona no se promueve como asesor de inversiones."}, {"q": "Un cliente inversionista puede renunciar a recibir una recomendación profesional:", "o": ["Solo frente a productos simples, mediante un formato diseñado para ello y tras recibir información del producto", "Frente a cualquier producto, con una cláusula del contrato de adhesión", "Solo frente a productos complejos", "Nunca"], "e": "La entidad debe hacer, en todo caso, el análisis de conveniencia antes de la inversión."}, {"q": "El análisis de conveniencia en la actividad de asesoría es:", "o": ["La evaluación interna y previa que hace la entidad para determinar si el perfil del producto se adecúa al perfil del cliente", "La recomendación que el asesor le entrega al cliente", "La firma del contrato de vinculación", "La publicidad del producto"], "e": "No comprende la recomendación profesional, que es posterior y está a cargo del asesor."}, {"q": "¿Cuál es el orden de las etapas de la actividad de asesoría?", "o": ["Perfilamiento del cliente y del producto, análisis de conveniencia y recomendación profesional", "Recomendación, perfilamiento y venta", "Venta, conveniencia y perfilamiento", "Publicidad, venta y seguimiento"], "e": "Además está la entrega de información al inversionista, que es una obligación de la entidad."}, {"q": "¿Cuál de las siguientes actividades NO se considera asesoría en el mercado de valores?", "o": ["La labor comercial que se limita a entregar información sobre alternativas de inversión de CDT", "Dar una recomendación personalizada a un cliente identificado", "Recomendar comprar un TES a un cliente según su perfil", "Recomendar mantener un FIC a un cliente según su perfil"], "e": "Tampoco son asesoría las actividades de corresponsales ni de quienes promueven CDT o CDAT."}, {"q": "Las entidades que prestan asesoría deben publicar en su página web:", "o": ["Las personas autorizadas para asesorar y los productos sobre los que cada una puede dar recomendaciones", "Los salarios de sus asesores", "La lista de sus clientes", "Las recomendaciones dadas a cada cliente"], "e": "También deben publicar las tarifas aplicables a la actividad de asesoría."}, {"q": "Al distribuir un producto complejo a un cliente inversionista, la entidad debe, cuando los distribuya:", "o": ["Ofrecerle productos alternativos menos complejos o costosos", "Ofrecerle solo el producto más rentable", "Abstenerse de revelar los riesgos", "Exigirle que renuncie a la asesoría"], "e": "La información debe ser suficiente, los riesgos deben revelarse con escenarios, y el documento de la recomendación debe entregarse si el cliente lo pide."}, {"q": "¿Cuál de las siguientes características hace que un instrumento de deuda sea un producto complejo?", "o": ["Que su pago esté subordinado al reembolso de la deuda en poder de otros", "Que pague intereses fijos", "Que esté inscrito en el RNVE", "Que tenga un vencimiento de tres años"], "e": "También son complejos los instrumentos de deuda sin fecha de vencimiento específica o con garantías difíciles de comprender."}, {"q": "¿Cuál de los siguientes vehículos de inversión colectiva es siempre un producto complejo?", "o": ["Un fondo de capital privado", "Un FIC del mercado monetario", "Un FIC abierto de renta fija", "Una alternativa estandarizada de un FVP"], "e": "También son complejos los vehículos apalancados, los que invierten en valores o acciones no inscritos, en commodities no representados en valores, los inmobiliarios no negociados en sistemas y ciertos ETF."}, {"q": "Cuando un intermediario actúa como contraparte de un cliente inversionista en el mercado mostrador, debe:", "o": ["Explicarle que actúa en posición propia y no tiene la obligación de darle recomendaciones profesionales", "Darle siempre una recomendación profesional", "Garantizarle el precio más bajo del mercado", "Ocultarle que actúa como contraparte"], "e": "Además debe hacer el análisis de conveniencia (salvo en solo ejecución), operar en condiciones de mercado razonables y registrar las instrucciones en el libro de instrucciones internas el mismo día."}, {"q": "La inscripción en el RNPMV de la persona que hace asesoría es una obligación de:", "o": ["El propio profesional", "El cliente", "AMV", "La bolsa"], "e": "El asesor también debe conocer el perfil del cliente, el del producto y su correspondencia antes de recomendar."}, {"q": "Según el artículo 72 del EOSF, las entidades vigiladas y sus funcionarios deben abstenerse de:", "o": ["Facilitar o ejecutar prácticas que tengan como propósito la evasión fiscal", "Pagar impuestos", "Atender requerimientos de la SFC", "Llevar contabilidad"], "e": "Otras conductas prohibidas: concentrar riesgos por encima de los límites, usar recursos del público para tomar control de sociedades sin autorización, obstruir la supervisión y usar indebidamente información reservada."}], "riesgo": [{"q": "El riesgo de mercado es la posibilidad de pérdida por:", "o": ["Cambios en los precios de mercado, como tasas de interés, tasa de cambio o precio de las acciones", "El incumplimiento de pago de un emisor", "Fallas en los procesos internos o en la tecnología", "La imposibilidad de conseguir recursos para cumplir obligaciones"], "e": "El riesgo de mercado surge de movimientos adversos en variables como tasas, precios de acciones, tasa de cambio o precios de materias primas."}, {"q": "El riesgo de crédito es la posibilidad de pérdida por:", "o": ["El incumplimiento de las obligaciones de un deudor o emisor", "Una baja en el precio de una acción", "Un error en la digitación de una orden", "Un cambio en la regulación"], "e": "El riesgo de crédito se materializa cuando un deudor o emisor no cumple con el pago de capital o intereses."}, {"q": "El riesgo de contraparte se presenta cuando:", "o": ["La otra parte de una operación no cumple con la entrega del dinero o de los valores pactados", "El emisor de un bono quiebra antes del vencimiento", "La tasa de cambio se mueve en contra", "Un empleado comete un fraude"], "e": "El riesgo de contraparte es el incumplimiento de quien está al otro lado de una operación, por ejemplo al momento de la liquidación."}, {"q": "El riesgo de liquidez se refiere a:", "o": ["La posibilidad de no poder cumplir obligaciones por falta de recursos o de vender activos sin una pérdida importante", "La caída de los precios de las acciones", "El incumplimiento de un emisor", "La pérdida por fallas tecnológicas"], "e": "El riesgo de liquidez incluye el de fondeo (no conseguir recursos) y el de mercado (tener que vender con descuento por falta de profundidad)."}, {"q": "El riesgo operacional es la posibilidad de pérdida por:", "o": ["Fallas en procesos, personas, tecnología o por eventos externos", "Movimientos de las tasas de interés", "El incumplimiento de un deudor", "Cambios en la tasa de cambio"], "e": "El riesgo operacional comprende fallas o deficiencias en procesos, recurso humano, tecnología, infraestructura y eventos externos. Incluye el riesgo legal."}, {"q": "Un operador digita una orden de 100.000 acciones cuando el cliente pidió 10.000. ¿Qué tipo de riesgo se materializó?", "o": ["Riesgo operacional", "Riesgo de mercado", "Riesgo de crédito", "Riesgo de liquidez"], "e": "Un error humano en la ejecución de un proceso es un evento de riesgo operacional."}, {"q": "¿Cuál es la diferencia entre riesgo sistemático y no sistemático?", "o": ["El sistemático afecta a todo el mercado y no se elimina diversificando; el no sistemático es propio de cada emisor y sí se reduce diversificando", "El sistemático se elimina diversificando y el no sistemático no", "Ambos se eliminan con diversificación", "Ninguno puede reducirse"], "e": "El riesgo no sistemático (propio de cada empresa) se reduce al diversificar. El sistemático (de mercado) permanece y se mide con la beta."}, {"q": "El Valor en Riesgo (VaR) mide:", "o": ["La pérdida máxima esperada de un portafolio en un horizonte y con un nivel de confianza dados", "La ganancia máxima posible de un portafolio", "El valor de mercado del portafolio", "La pérdida promedio histórica"], "e": "El VaR estima la pérdida que no se superaría con un nivel de confianza dado, por ejemplo 99 %, en un horizonte, por ejemplo un día."}, {"q": "Un portafolio vale COP 1.000 millones y tiene una volatilidad diaria de 2 %. Con un nivel de confianza del 95 % (z = 1,65), ¿cuál es el VaR paramétrico a un día?", "o": ["COP 33 millones", "COP 20 millones", "COP 16,5 millones", "COP 46,6 millones"], "e": "VaR = valor × volatilidad × z = 1.000 × 0,02 × 1,65 = 33 millones."}, {"q": "Si el VaR a un día de un portafolio es COP 10 millones, ¿cuál es el VaR aproximado a 4 días, según la regla de la raíz del tiempo?", "o": ["COP 20 millones", "COP 40 millones", "COP 10 millones", "COP 16 millones"], "e": "VaR a n días = VaR a 1 día × √n = 10 × √4 = 20 millones."}, {"q": "¿Qué es el backtesting de un modelo de VaR?", "o": ["Comparar las pérdidas reales con las estimadas por el modelo para validar su precisión", "Simular escenarios extremos que nunca han ocurrido", "Calcular el VaR con datos del futuro", "Revisar el cumplimiento normativo de los operadores"], "e": "El backtesting contrasta los resultados reales con el VaR estimado. Si las pérdidas superan el VaR más veces de lo esperado, el modelo subestima el riesgo."}, {"q": "Las pruebas de estrés (stress testing) sirven para:", "o": ["Evaluar el impacto de escenarios extremos pero posibles sobre el portafolio", "Calcular el precio justo de un bono", "Medir la satisfacción de los clientes", "Reemplazar el cálculo del VaR"], "e": "Las pruebas de estrés complementan el VaR, que no captura bien los eventos extremos, al simular choques severos en tasas, precios o liquidez."}, {"q": "La duración de Macaulay de un bono representa:", "o": ["El plazo promedio ponderado en que se reciben los flujos del bono", "El plazo al vencimiento del bono", "La tasa cupón del bono", "El número de cupones pendientes"], "e": "La duración de Macaulay es el promedio de los plazos de los flujos, ponderados por su valor presente. En un bono cero cupón es igual al plazo."}, {"q": "Un bono tiene una duración de Macaulay de 4 años y una TIR de 10 % efectiva anual. ¿Cuál es su duración modificada?", "o": ["3,64", "4,40", "4,00", "0,40"], "e": "Duración modificada = duración de Macaulay / (1 + TIR) = 4 / 1,10 = 3,64."}, {"q": "Un bono tiene una duración modificada de 5 y un precio de COP 1.000. Si las tasas suben 0,5 %, ¿cuál es el cambio aproximado en el precio?", "o": ["Baja aproximadamente COP 25", "Sube aproximadamente COP 25", "Baja aproximadamente COP 50", "Baja aproximadamente COP 5"], "e": "Cambio % ≈ −DM × Δtasa = −5 × 0,5 % = −2,5 %. Sobre 1.000 son −25."}, {"q": "Entre dos bonos con el mismo plazo, ¿cuál tiene mayor duración?", "o": ["El de menor tasa cupón", "El de mayor tasa cupón", "Tienen la misma duración siempre", "El que tenga mejor calificación"], "e": "Con cupones más bajos, una mayor parte del valor se recibe al vencimiento, lo que alarga la duración. Un cero cupón tiene la duración máxima para su plazo."}, {"q": "La convexidad de un bono permite:", "o": ["Mejorar la estimación del cambio de precio ante movimientos grandes de tasas", "Medir el riesgo de crédito del emisor", "Calcular el cupón del bono", "Medir el riesgo operacional"], "e": "La duración es una aproximación lineal. La convexidad corrige la curvatura de la relación precio-tasa, sobre todo ante cambios grandes."}, {"q": "¿Cuál es el principal instrumento para gestionar el riesgo de contraparte en los mercados organizados?", "o": ["La compensación y liquidación a través de una cámara de riesgo central de contraparte con garantías", "La calificación de riesgo de los emisores", "La diversificación en muchos emisores", "El aumento del capital de la entidad"], "e": "La CRCC se interpone en las operaciones y exige garantías, lo que reduce el riesgo de que una parte incumpla."}, {"q": "El Indicador de Riesgo de Liquidez (IRL) compara:", "o": ["Los activos líquidos ajustados con los requerimientos netos de liquidez en un horizonte", "El patrimonio con los activos totales", "Las utilidades con los ingresos", "El VaR con el patrimonio técnico"], "e": "El IRL mide si la entidad tiene suficientes activos líquidos, ajustados por descuentos, para cubrir sus salidas netas de recursos en un horizonte determinado."}, {"q": "En Colombia, el Sistema Integral de Administración de Riesgos (SIAR) fue establecido por:", "o": ["La Superintendencia Financiera, mediante la Circular Externa 018 de 2021", "El Banco de la República, mediante su Junta Directiva", "AMV, mediante su reglamento", "El Congreso, mediante la Ley 964 de 2005"], "e": "La SFC expidió la Circular Externa 018 de 2021, que integra la gestión de riesgos (mercado, crédito, liquidez, operacional, entre otros) en el SIAR."}, {"q": "¿Cuál es el papel del área de riesgos (middle office) frente al área de negociación (front office)?", "o": ["Medir, controlar y reportar los riesgos de forma independiente del área que negocia", "Ejecutar las operaciones de la tesorería", "Liquidar y registrar las operaciones", "Buscar nuevos clientes"], "e": "El middle office mide y controla los riesgos con independencia del front office, que negocia, y del back office, que registra y liquida."}, {"q": "Un límite de 'stop loss' en una mesa de negociación sirve para:", "o": ["Cerrar o reducir posiciones cuando las pérdidas alcanzan un nivel definido", "Garantizar una ganancia mínima", "Aumentar el apalancamiento", "Medir el riesgo de crédito"], "e": "El stop loss limita las pérdidas: al llegar al umbral, la posición se cierra o se reduce según la política de riesgos."}, {"q": "El riesgo de tasa de cambio afecta principalmente a:", "o": ["Posiciones en activos o pasivos denominados en moneda extranjera", "Solo a los bonos en pesos", "Solo a las acciones locales", "Solo a los CDT"], "e": "Quien tiene activos o pasivos en otra moneda está expuesto a que la tasa de cambio se mueva en su contra."}, {"q": "El riesgo de reinversión es mayor para:", "o": ["Bonos con cupones altos y plazos largos, porque hay más flujos que reinvertir", "Bonos cero cupón", "Acciones sin dividendos", "Cuentas de ahorro a la vista"], "e": "Si las tasas bajan, los cupones recibidos deben reinvertirse a tasas menores. Un bono cero cupón no tiene flujos intermedios, así que no tiene ese riesgo."}, {"q": "¿Qué riesgo se materializa cuando una acción tiene tan poco volumen que solo puede venderse con un descuento importante?", "o": ["Riesgo de liquidez de mercado", "Riesgo de crédito", "Riesgo operacional", "Riesgo legal"], "e": "La falta de profundidad del mercado obliga a vender con descuento. Ese es el riesgo de liquidez de mercado."}, {"q": "El riesgo legal forma parte de:", "o": ["El riesgo operacional", "El riesgo de mercado", "El riesgo de crédito", "El riesgo de liquidez"], "e": "Las pérdidas por incumplir normas o por contratos mal elaborados se consideran riesgo legal, que se incluye dentro del riesgo operacional."}, {"q": "El 'mark to market' o valoración a precios de mercado consiste en:", "o": ["Registrar diariamente las inversiones por su precio de mercado", "Registrar las inversiones a su costo de compra hasta venderlas", "Calcular la TIR de compra de un bono", "Fijar el precio de una nueva emisión"], "e": "La valoración a mercado actualiza el valor de las posiciones según los precios del día, normalmente publicados por un proveedor de precios."}, {"q": "El riesgo reputacional es la posibilidad de pérdida por:", "o": ["El desprestigio o la mala imagen de la entidad, que lleva a perder clientes o ingresos", "El aumento de la tasa de interés", "El incumplimiento de un deudor", "La caída del precio de las acciones del portafolio"], "e": "El riesgo reputacional surge de una percepción negativa sobre la entidad, por ejemplo tras un escándalo o una sanción."}, {"q": "Si la correlación entre dos activos de un portafolio es −1, entonces:", "o": ["Es posible construir una combinación que elimine el riesgo total", "El riesgo del portafolio es la suma de los riesgos individuales", "La diversificación no tiene ningún efecto", "Ambos activos siempre suben al mismo tiempo"], "e": "Con correlación perfectamente negativa, los movimientos se compensan y existe una combinación de pesos con varianza cero."}, {"q": "Una cobertura (hedge) busca:", "o": ["Reducir la exposición a un riesgo tomando una posición que se mueva en sentido contrario", "Aumentar la rentabilidad asumiendo más riesgo", "Eliminar todos los riesgos de la entidad", "Especular sobre la dirección del mercado"], "e": "La cobertura compensa pérdidas potenciales con ganancias en otra posición, por ejemplo un forward de venta de dólares para un exportador."}, {"q": "¿Cuáles son los tres métodos más comunes para calcular el VaR?", "o": ["Paramétrico, simulación histórica y simulación de Montecarlo", "Duración, convexidad y beta", "Sharpe, Treynor y Jensen", "Contado, plazo y repo"], "e": "El VaR se calcula con un modelo paramétrico (varianza-covarianza), con datos históricos o con simulaciones aleatorias de Montecarlo."}, {"q": "¿Cuál es una limitación importante del VaR?", "o": ["No indica cuánto se puede perder cuando se supera el nivel de confianza", "No puede calcularse para portafolios de acciones", "Siempre sobreestima el riesgo", "Solo sirve para medir riesgo operacional"], "e": "El VaR dice cuál es la pérdida que no se supera con cierta confianza, pero no cuánto se pierde en el resto de los casos. Para eso se usa el VaR condicional o expected shortfall."}, {"q": "El expected shortfall (VaR condicional) mide:", "o": ["La pérdida promedio en los escenarios que superan el VaR", "La pérdida mínima esperada", "La ganancia promedio del portafolio", "La volatilidad anual del portafolio"], "e": "El expected shortfall promedia las pérdidas que exceden el VaR, por eso describe mejor el riesgo de cola."}, {"q": "Dos posiciones tienen un VaR individual de 30 y 40 millones, y su correlación es cero. ¿Cuál es el VaR conjunto?", "o": ["50 millones", "70 millones", "10 millones", "35 millones"], "e": "VaR conjunto = √(30² + 40² + 2 × 0 × 30 × 40) = √2.500 = 50. Es menor que la suma (70) por el efecto de la diversificación."}, {"q": "Una entidad tiene una exposición de COP 1.000 millones con un deudor, probabilidad de incumplimiento de 2 % y pérdida dado el incumplimiento de 45 %. ¿Cuál es la pérdida esperada?", "o": ["COP 9 millones", "COP 20 millones", "COP 450 millones", "COP 0,9 millones"], "e": "Pérdida esperada = PI × PDI × exposición = 0,02 × 0,45 × 1.000 = 9 millones."}, {"q": "La pérdida dado el incumplimiento (PDI) representa:", "o": ["El porcentaje de la exposición que se pierde cuando el deudor incumple, después de recuperaciones", "La probabilidad de que el deudor incumpla", "El valor total de la deuda", "El margen de intermediación del banco"], "e": "La PDI es la severidad de la pérdida: lo que no se recupera, por ejemplo después de ejecutar garantías."}, {"q": "Un cupo de contraparte sirve para:", "o": ["Limitar el monto máximo de exposición que la entidad puede tener con una contraparte", "Fijar la comisión de una operación", "Determinar el precio de un bono", "Calcular el VaR del portafolio"], "e": "Los cupos limitan la exposición frente a cada contraparte o emisor, según su análisis de crédito, para controlar el riesgo de contraparte."}, {"q": "El riesgo de concentración se presenta cuando:", "o": ["Una parte importante del portafolio depende de un mismo emisor, sector o factor de riesgo", "El portafolio está muy diversificado", "Las inversiones tienen distintos plazos", "Se invierte en el activo libre de riesgo"], "e": "Concentrar posiciones en un mismo emisor o sector aumenta el impacto de un evento adverso. Se controla con límites de concentración."}, {"q": "El riesgo de liquidación o de principal es la posibilidad de que:", "o": ["Una parte entregue el dinero o los valores y no reciba la contraprestación", "El precio del activo baje", "El emisor no pague los intereses", "Se cometa un error en la valoración"], "e": "Ocurre cuando las entregas no son simultáneas. Se mitiga con entrega contra pago y cámaras de contraparte."}, {"q": "¿Cuál es la duración de Macaulay de un bono cero cupón que vence en 5 años?", "o": ["5 años", "2,5 años", "Menos de 5 años, según la tasa", "Cero, porque no paga cupones"], "e": "Un bono cero cupón tiene un único flujo al vencimiento, así que su duración de Macaulay es igual a su plazo."}, {"q": "Si las tasas de interés bajan, el precio de un bono de tasa fija:", "o": ["Sube", "Baja", "No cambia", "Se vuelve cero"], "e": "Precio y tasa se mueven en sentido contrario: cuando la tasa de descuento baja, el valor presente de los flujos sube."}, {"q": "¿Qué es el riesgo inherente en una matriz de riesgos?", "o": ["El nivel de riesgo antes de aplicar los controles", "El nivel de riesgo después de aplicar los controles", "El riesgo que el regulador acepta", "El riesgo de mercado únicamente"], "e": "El riesgo inherente es el que existe por la naturaleza de la actividad, sin controles. El residual es el que queda después de los controles."}, {"q": "En una matriz de riesgos, el nivel de riesgo se determina normalmente combinando:", "o": ["La probabilidad de ocurrencia y el impacto del evento", "El VaR y la duración", "La beta y la volatilidad", "El precio y el volumen"], "e": "La matriz de riesgos ubica cada evento según su probabilidad y su impacto para priorizar los controles."}, {"q": "¿Cuál es el propósito del plan de continuidad del negocio?", "o": ["Asegurar que la entidad pueda seguir operando o recuperarse ante eventos que interrumpan sus operaciones", "Aumentar la rentabilidad de la tesorería", "Calcular el VaR diario", "Definir la política de dividendos"], "e": "El plan de continuidad prepara a la entidad para eventos como fallas tecnológicas, desastres o pandemias. Es parte de la gestión del riesgo operacional."}, {"q": "En el modelo de las tres líneas de defensa, la primera línea está formada por:", "o": ["Las áreas de negocio y operación, que asumen y gestionan los riesgos en su día a día", "La auditoría interna", "El área de riesgos", "La Superintendencia Financiera"], "e": "La primera línea son las áreas que toman los riesgos.
