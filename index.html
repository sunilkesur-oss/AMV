ormular observaciones. Si lo imprueba, el proceso continúa."}, {"q": "Mientras se tramita una solicitud escrita de ATA:", "o": ["El proceso disciplinario se suspende", "Corren normalmente los términos", "El investigado queda suspendido del mercado", "AMV debe archivar el proceso"], "e": "La radicación de la solicitud suspende el proceso hasta que el acuerdo se apruebe, no se apruebe o lleguen observaciones de la Sala de revisión."}, {"q": "Una vez firmado el ATA, el investigado:", "o": ["Renuncia a iniciar acciones judiciales o administrativas sobre los hechos del acuerdo", "Puede apelar ante la Sala de revisión", "Queda sin antecedentes disciplinarios", "Puede demandar a AMV por los mismos hechos"], "e": "Lo acordado tiene las consecuencias de una sanción disciplinaria y se entiende que se renuncia a otras acciones sobre esos hechos."}, {"q": "El ATA es:", "o": ["Un mecanismo de terminación del proceso con reconocimiento de responsabilidad, que no es una instancia del proceso", "Una tercera instancia ante la SFC", "Una forma de absolución automática", "Un recurso contra la decisión de segunda instancia"], "e": "El ATA termina el proceso por una vía distinta al fallo del Tribunal, y lo acordado tiene efectos de sanción disciplinaria."}, {"q": "¿Cuál es la multa máxima que AMV puede imponer a una persona natural, si no se prueba un beneficio económico mayor?", "o": ["5.470 UVT", "1.368 UVT", "27.351 UVT", "50.000 SMMLV"], "e": "El tope es 5.470 UVT. Si se prueba un beneficio mayor, la multa puede llegar al doble del beneficio obtenido."}, {"q": "¿Cuál es la multa máxima que AMV puede imponer a una persona jurídica, si no se prueba un beneficio mayor?", "o": ["27.351 UVT", "5.470 UVT", "2.735 UVT", "100.000 UVT"], "e": "Para personas jurídicas el tope es 27.351 UVT, o hasta el doble del beneficio probado si este es mayor."}, {"q": "Si en el proceso se prueba que el sancionado obtuvo un beneficio económico superior al tope de multa, AMV puede imponer:", "o": ["Una multa de hasta el doble del beneficio obtenido", "Solo el tope, sin excepción", "Una multa igual a la mitad del beneficio", "Una pena de prisión"], "e": "La regla aplica tanto a personas naturales como jurídicas."}, {"q": "¿Qué sanciones proceden contra una persona jurídica en AMV?", "o": ["Amonestación, multa y expulsión", "Suspensión, multa y expulsión", "Amonestación, suspensión y cursos", "Solo multa"], "e": "La suspensión y la orden de tomar cursos de educación continuada solo aplican a personas naturales."}, {"q": "¿Cuál es el rango de la sanción de suspensión para una persona natural?", "o": ["Entre un día hábil y diez años", "Entre un mes y cinco años", "Entre un año y veinte años", "Hasta seis meses"], "e": "El tope de suspensión se incrementó a 10 años. Es una sanción cuantificable que se gradúa con agravantes y atenuantes."}, {"q": "Una persona expulsada por AMV puede solicitar de nuevo su admisión:", "o": ["Después de 20 años desde la firmeza de la sanción, acreditando los requisitos de certificación", "Después de 3 años", "Nunca", "Al día siguiente si paga una multa"], "e": "La expulsión puede redimirse tras 20 años, tanto para personas naturales como jurídicas."}, {"q": "Para que una sala del Tribunal disciplinario imponga la sanción de expulsión se requiere:", "o": ["La unanimidad de los miembros asistentes", "Mayoría simple", "Autorización de la SFC", "Solicitud del Consejo directivo"], "e": "La expulsión exige unanimidad. Si se acuerda en un ATA, la Sala de revisión debe revisar su proporcionalidad."}, {"q": "Una PNV sancionada con la orden de tomar y aprobar cursos de educación continuada debe acreditar la aprobación:", "o": ["Dentro del mes siguiente a la firmeza de la sanción; si no, su certificación queda suspendida", "Dentro de tres años", "Cuando renueve su certificación", "No tiene plazo"], "e": "Esta sanción solo aplica a PNV vinculadas a un miembro, la paga el sancionado y los exámenes no sirven para renovar ni obtener certificaciones."}, {"q": "La multa impuesta a una PNV:", "o": ["Debe pagarse con su propio patrimonio; no puede asumirla la entidad ni su matriz o subordinadas", "La paga siempre la entidad a la que está vinculada", "Puede pagarla un cliente", "Se descuenta de las comisiones de los clientes"], "e": "El carácter personal de la multa refuerza su efecto disuasorio."}, {"q": "Según el principio de revelación dirigida, una sanción de amonestación u orden de tomar exámenes se mantiene publicada:", "o": ["Durante tres años, ocultando los nombres de los sancionados", "Durante veinte años con nombres", "No se publica nunca", "Solo mientras el proceso está en curso"], "e": "Las multas y suspensiones mantienen los nombres publicados 5 años; la expulsión, 20 años. Las sanciones se publican solo cuando están en firme."}, {"q": "¿Durante cuánto tiempo se mantiene publicada una sanción de expulsión?", "o": ["Veinte años desde su firmeza", "Tres años", "Cinco años", "Un año"], "e": "Amonestación y cursos: 3 años (sin nombres). Multa o suspensión: 5 años con nombres. Expulsión: 20 años."}, {"q": "Las sanciones de expulsión y suspensión, además de publicarse en la página web de AMV:", "o": ["Se informan mediante boletines dirigidos a toda la industria", "Se comunican solo al sancionado", "Se publican en el Diario Oficial", "Se envían a la Registraduría"], "e": "Todas las sanciones en firme se publican en la web. Las de expulsión y suspensión se informan además por boletines a la industria."}, {"q": "¿Cuáles son los principios de la facultad sancionatoria de AMV según el artículo 51 de la Ley 964 de 2005?", "o": ["Proporcionalidad, carácter disuasorio, revelación dirigida y contradicción", "Celeridad, gratuidad, publicidad y favorabilidad", "Legalidad monetaria, estabilidad y crecimiento", "Solidaridad, universalidad y eficiencia"], "e": "Estos principios guían la sanción, ya sea impuesta por el Tribunal o acordada en un ATA."}, {"q": "Los ATA y las resoluciones del Tribunal disciplinario que imponen multas:", "o": ["Prestan mérito ejecutivo, de modo que su pago puede exigirse ante los jueces", "Son simples recomendaciones", "Requieren ratificación de la SFC para cobrarse", "Solo obligan a personas jurídicas"], "e": "Según el artículo 82 del Reglamento de AMV, esos documentos prestan mérito ejecutivo. Los recursos de multas se destinan a profesionalizar el mercado."}, {"q": "Una persona jurídica sancionada con multa debe pagarla dentro de:", "o": ["Los 5 días hábiles siguientes a la decisión", "Los 15 días hábiles siguientes", "Un año", "Cuando lo decida su junta directiva"], "e": "Para personas naturales el plazo es de 15 días hábiles tras la ejecutoria. Para jurídicas, la guía indica 5 días hábiles."}, {"q": "Cuando AMV sanciona a una PNV, el miembro al que estaba vinculada en el momento de los hechos debe:", "o": ["Informar dentro del mes siguiente a la firmeza de la sanción las medidas adoptadas para evitar que se repita", "Despedirla de inmediato", "Pagar la multa", "Apelar la decisión en su nombre"], "e": "El artículo 39 del Reglamento de AMV impone este deber de informar las medidas preventivas."}, {"q": "¿Quién es responsable de los actos de las PNV de un miembro de AMV?", "o": ["El miembro, sin que ello exima a la PNV de verificar sus propias facultades", "Solo la PNV", "Solo AMV", "La SFC"], "e": "El artículo 36.3 del Reglamento de AMV hace responsable al miembro y le exige verificar que quien lo compromete tenga facultades."}, {"q": "Dar información diferente sobre riesgos o condiciones de una especie a clientes compradores y vendedores, para favorecer a un grupo, vulnera el deber de:", "o": ["Tratamiento equitativo", "Valoración", "Separación de activos", "Mejor ejecución exclusivamente"], "e": "El trato equitativo exige no dar información asimétrica a clientes en situación similar."}, {"q": "¿Cuál de las siguientes NO es una característica de la información que se debe dar al cliente?", "o": ["Persuasiva, para cerrar la venta", "Oportuna", "Imparcial", "Completa"], "e": "El Decreto 2555 exige información oportuna, objetiva, completa, imparcial, clara y acorde con el perfil del cliente."}, {"q": "Antes de la primera operación, el intermediario debe informar al cliente, entre otros:", "o": ["La naturaleza jurídica de la entidad, las características de las operaciones, de los valores ofrecidos y sus riesgos", "Solo el número de cuenta bancaria", "La rentabilidad garantizada de la inversión", "Los nombres de los demás clientes"], "e": "Además, en comisión, administración de valores, APT, corretaje y colocación debe informar las tarifas, comisiones y márgenes."}, {"q": "¿Qué mecanismos de información deben usar las administradoras de FIC y de fondos voluntarios de pensión?", "o": ["Reglamento, prospecto, ficha técnica, extracto de cuenta e informe de rendición de cuentas", "Solo un mensaje de texto anual", "Solo la publicidad en redes sociales", "Solo el contrato de vinculación"], "e": "Son los cinco mecanismos de información que exige la regulación para FIC y FVP."}, {"q": "¿Cuál es la diferencia entre informar y asesorar?", "o": ["Informar es transmitir hechos y datos objetivos; asesorar implica una opinión o recomendación según el perfil del cliente", "Son lo mismo", "Asesorar es solo entregar el extracto", "Informar exige certificación de asesor y asesorar no"], "e": "La guía distingue ambos deberes: la asesoría incluye recomendaciones basadas en el perfil del cliente y del producto."}, {"q": "Frente a un requerimiento de información de AMV, el intermediario:", "o": ["Debe entregar la información de forma oportuna, veraz y completa, sin oponer reserva", "Puede negarse por reserva bancaria", "Solo debe responder si lo ordena un juez", "Puede responder cuando quiera"], "e": "Negarse sin justificación es falta disciplinaria. La reserva no es oponible a AMV en ejercicio de sus funciones."}, {"q": "¿Frente a quién NO es oponible la reserva de la información de los clientes?", "o": ["Ante AMV en ejercicio de sus funciones, las autoridades judiciales y administrativas competentes y para efectos tributarios", "Ante cualquier otro cliente que la pida", "Ante los medios de comunicación", "Ante los competidores"], "e": "La reserva solo puede levantarse en los casos previstos por la ley."}, {"q": "Según el Decreto 2555 y el Reglamento de AMV, se considera vinculado al intermediario:", "o": ["El accionista o beneficiario real del 10 % o más del intermediario, su matriz, filiales y subordinadas y sus administradores", "Cualquier cliente con más de un año", "Solo el revisor fiscal", "Cualquier persona que compre acciones del intermediario"], "e": "También se consideran vinculadas las personas jurídicas en las que el intermediario sea beneficiario real del 10 % o más."}, {"q": "Las PNV deben revelar a su entidad sus partes relacionadas que sean PNV de otros intermediarios. ¿Cuál de estas es una parte relacionada?", "o": ["Su cónyuge o un familiar hasta el segundo grado de consanguinidad", "Un compañero de universidad sin vínculo actual", "Cualquier cliente de la entidad", "Un vecino"], "e": "Incluye cónyuge o compañero permanente, parientes hasta 2.º de consanguinidad, 2.º de afinidad y único civil, y las sociedades donde la PNV o esos familiares sean administradores o tengan participación material."}, {"q": "Ante la duda sobre si existe un conflicto de interés, la persona debe:", "o": ["Actuar como si existiera y abstenerse hasta que se resuelva", "Continuar con la operación", "Consultar al cliente después de ejecutar", "Ignorarla si la operación es rentable"], "e": "El deber de abstención aplica también en caso de duda: no intervenir, influir ni ejecutar hasta que el conflicto se revele y se decida."}, {"q": "Los cuatro deberes para administrar los conflictos de interés son:", "o": ["Abstención, revelación, obtener decisión y documentación", "Comprar, vender, mantener y liquidar", "Planear, hacer, verificar y actuar", "Informar, asesorar, ejecutar y cobrar"], "e": "Se revela al superior o al órgano designado y a los afectados; se obtiene decisión motivada y autorización de los afectados, y se conserva registro verificable."}, {"q": "Un operador por cuenta propia, por regla general:", "o": ["No puede realizar actividades de intermediación con clientes", "Puede recibir órdenes de clientes cuando quiera", "Puede ser operador de distribución al mismo tiempo", "Puede manejar cuentas de terceros"], "e": "La excepción es el programa de creadores de mercado: distribución de valores adquiridos en subastas primarias y operaciones de manejo de deuda."}, {"q": "Las PNV, respecto de sus inversiones personales, deben:", "o": ["Informarlas a la entidad, indicar por qué intermediarios las hacen y abstenerse de operaciones de signo contrario en el plazo que fije la entidad", "Mantenerlas en reserva incluso ante su empleador", "Hacerlas solo por medio de la posición propia", "Hacerlas siempre con clientes de la entidad"], "e": "Es uno de los deberes particulares de las PNV para prevenir conflictos de interés (artículos 38.9 a 38.15 del Reglamento)."}, {"q": "¿Cuál de estos NO se considera vinculado a un conglomerado financiero?", "o": ["Un fondo de pensiones obligatorias", "La holding financiera", "Una filial del conglomerado", "Una subordinada de la holding"], "e": "No son vinculados los fondos de pensiones obligatorias y de cesantías, los FVP, la mayoría de FIC y ciertos patrimonios autónomos, entre otros."}, {"q": "En el caso 'Una compra ciega', el operador de terceros avisa al operador de posición propia sobre la orden de su cliente, y ambos calzan las operaciones a precios preacordados. ¿Qué infracciones hay?", "o": ["Conflicto de interés mal administrado, violación de la reserva y no informar al cliente que su contraparte era la posición propia", "Ninguna, porque el cliente consiguió los títulos", "Solo una falta leve por horario", "Solo exceso de mandato"], "e": "La SCB tomó un provecho indebido que debió beneficiar al cliente, y se afectó la transparencia del mercado."}, {"q": "¿Qué deber se viola si una SCB usa los títulos de un cliente para garantizar operaciones de la posición propia sin autorización?", "o": ["Separación de activos", "Valoración", "Trato equitativo", "Información al mercado"], "e": "Los activos de terceros no son del intermediario ni garantía de sus acreedores, y no pueden usarse para operaciones propias o de otros clientes."}, {"q": "Las inversiones de los FIC y de los fondos de pensiones obligatorias deben clasificarse y valorarse como:", "o": ["Inversiones negociables, a precios de mercado", "Inversiones al vencimiento, a costo histórico", "Disponibles para la venta, sin valorar", "No se valoran"], "e": "La guía indica que todas las inversiones de FIC y FPO se valoran como negociables."}, {"q": "El precio justo de intercambio es:", "o": ["El precio al que un comprador y un vendedor suficientemente informados están dispuestos a transar", "El precio que fija el emisor", "El precio de compra original", "El precio que fija AMV"], "e": "La SFC considera justo el precio que determinan los proveedores de precios con metodologías aprobadas, o el que se fije por los otros métodos de la CBJ."}, {"q": "Las inversiones que se adquieren con el propósito principal de obtener utilidades por las fluctuaciones de precio en el corto plazo se clasifican como:", "o": ["Negociables", "Al vencimiento", "Disponibles para la venta", "Permanentes"], "e": "Al vencimiento: se tiene la intención y capacidad de mantenerlas hasta su redención. Disponibles para la venta: las que no son negociables ni al vencimiento."}, {"q": "Para un cliente inversionista, el deber de mejor ejecución se evalúa con base en:", "o": ["El precio o tasa de la operación en las condiciones de mercado del momento", "Solo la comisión cobrada", "La rentabilidad del año anterior", "El tiempo que el cliente lleva en la entidad"], "e": "Para los demás clientes se consideran además los costos, el tiempo, la probabilidad de ejecución y el volumen."}, {"q": "Cuando un intermediario actúa como contraparte de un cliente inversionista en el mercado mostrador:", "o": ["No cobra comisión, no aplica el deber de mejor ejecución y debe informar expresamente que actúa como contraparte", "Debe cobrar comisión y aplicar mejor ejecución", "No necesita informar nada al cliente", "Debe operar siempre a pérdida"], "e": "Puede cobrar márgenes según sus políticas, debe otorgar condiciones de mercado y el cliente debe aceptar cerrar en esas condiciones."}, {"q": "El cliente inversionista decide invertir en condiciones más riesgosas que las recomendadas. El asesor debe:", "o": ["Dejar registro de esa decisión en un medio verificable antes de la operación", "Negarse a ejecutar la operación", "Ejecutar sin dejar registro", "Pedir autorización a AMV"], "e": "El inversionista es libre de no acoger la recomendación, pero su decisión debe quedar documentada de forma previa."}, {"q": "Un inversionista profesional pide una recomendación profesional antes de invertir. La entidad:", "o": ["Está obligada a suministrarla", "Puede negarse porque es profesional", "Debe cobrarle una tarifa especial a AMV", "Debe remitirlo a otra entidad"], "e": "El artículo 2.40.1.3.1 del Decreto 2555 obliga a dar la recomendación al inversionista profesional que la solicite."}, {"q": "¿Qué es un medio verificable?", "o": ["El mecanismo institucional que registra de forma confiable el momento y el contenido de órdenes, asesoría y negociaciones", "Cualquier conversación personal sin registro", "Un mensaje de WhatsApp personal sin control de la entidad", "La memoria del operador"], "e": "Pueden ser grabaciones telefónicas, medios escritos o intercambio electrónico de datos. Sin medio verificable, se entiende que no hay orden."}, {"q": "Las grabaciones de las mesas de negociación deben:", "o": ["Identificar fecha, hora, minuto y segundo según la hora oficial colombiana, ser audibles, íntegras y mostrar alteraciones", "Borrarse al final del día", "Hacerse solo con clientes nuevos", "Conservarse solo si el cliente lo pide"], "e": "Además, los sistemas de grabación y operativos deben estar sincronizados con la hora oficial colombiana."}, {"q": "Los informes o comunicaciones generales sobre inversiones que no constituyen recomendación profesional deben incluir:", "o": ["Una leyenda que indique que no constituyen una recomendación profesional según el artículo 2.40.1.1.2 del Decreto 2555", "La firma del presidente de la SFC", "Una garantía de rentabilidad", "El perfil de cada destinatario"], "e": "Como son simple información, su elaboración y distribución no requiere ser entidad vigilada."}, {"q": "La PNV que participa en un documento con recomendaciones de inversión que se publica debe revelar:", "o": ["Cualquier situación que afecte su objetividad y si ella o sus partes relacionadas tienen inversión en los valores analizados", "Su salario", "Su perfil de riesgo personal", "Nada, si el informe es anónimo"], "e": "El miembro también debe revelar su vínculo con el emisor, si actúa como colocador y sus inversiones en esos valores."}, {"q": "¿Cuáles son las características de la información privilegiada?", "o": ["Concreta, no dada a conocer al público y relevante para un inversionista prudente", "Pública, general y antigua", "Cualquier rumor en redes sociales", "Solo la que se refiere a resultados financieros auditados"], "e": "No se requiere que el hecho realmente ocurra: basta con que tenga una posibilidad razonable de ocurrir, como una fusión en negociación."}, {"q": "En el caso de la posible fusión de Construcciones S.A., un miembro de junta compra acciones antes del anuncio oficial, mientras en redes circulan rumores. ¿Usó información privilegiada?", "o": ["Sí: los rumores de fuentes no oficiales no hacen pública la información", "No, porque la fusión aún no era un hecho", "No, porque circulaban rumores en redes", "No, porque todo accionista puede comprar"], "e": "La información solo se entiende divulgada por los canales legales. La restricción es temporal y busca proteger la transparencia del mercado."}, {"q": "En el mismo caso, un corredor recomienda comprar basándose solo en los rumores de redes sociales. ¿Incurrió en uso de información privilegiada?", "o": ["No, porque los rumores sin fuente fiable no tienen la calidad de información privilegiada", "Sí, siempre que gane dinero", "Sí, porque cualquier rumor es privilegiado", "Sí, porque trabaja en una SCB"], "e": "La guía concluye que el corredor no conoció información privilegiada, aunque basar recomendaciones en rumores es arriesgado."}, {"q": "En el ámbito del Reglamento de AMV, la prohibición sobre información privilegiada abarca:", "o": ["Operar con ella, suministrarla a terceros aunque no la usen, y recomendar operaciones con base en ella", "Solo operar con ella", "Solo suministrarla si el tercero gana dinero", "Solo recomendar acciones extranjeras"], "e": "Las tres conductas son infracción, sin que se requiera que se produzca el resultado esperado."}, {"q": "Según el artículo 404 del Código de Comercio, los administradores pueden negociar acciones de su propia sociedad:", "o": ["Solo en operaciones ajenas a la especulación y con autorización de la junta (2/3, excluido el solicitante) o de la asamblea", "Libremente en cualquier momento", "Nunca, bajo ninguna circunstancia", "Solo con autorización de AMV"], "e": "La prohibición busca evitar que los administradores se aprovechen de su posición. El infractor puede perder el cargo y recibir multa de la Superintendencia de Sociedades."}, {"q": "El churning consiste en:", "o": ["Hacer operaciones excesivas por cuenta del cliente para generar comisiones o márgenes al intermediario", "Estabilizar el precio de una nueva emisión", "Valorar inversiones a precios de mercado", "Cruzar operaciones informadas a la SFC"], "e": "Es una práctica defraudatoria: las operaciones no corresponden a los objetivos del cliente o son innecesarias."}, {"q": "Según el Tribunal disciplinario, para que haya defraudación deben concurrir tres elementos objetivos:", "o": ["Provecho indebido para el infractor o un tercero, afectación a un tercero o al mercado, y que ocurra en actividades de intermediación", "Una pérdida para la entidad, una denuncia y una sanción previa", "Una operación en divisas, un cliente extranjero y un derivado", "La intervención de la SFC, la BVC y el Banco de la República"], "e": "Además supone engaño, maquinación, infidelidad o abuso de confianza."}, {"q": "Las operaciones cruzadas sobre acciones en bolsa son contrarias a la libre concurrencia cuando, entre otros casos:", "o": ["Los clientes acordaron directamente los elementos esenciales y no se informó a la SFC y a la bolsa con al menos un mes de anticipación", "La SCB hace gestiones para compatibilizar órdenes de sus clientes", "Se cruzan órdenes de dos clientes distintos sin acuerdo previo", "La operación se hace en horario normal"], "e": "También cuando dos SCB en cuenta propia acuerdan la operación y la ejecutan cruzada, o cuando comprador y vendedor son el mismo beneficiario real sin aviso de 5 días comunes."}, {"q": "Si comprador y vendedor de una operación cruzada sobre acciones son el mismo beneficiario real, deben informar previamente a la SFC y a la bolsa con una antelación de:", "o": ["Cinco días comunes", "Un mes", "Un día hábil", "Un año"], "e": "Si los clientes acordaron directamente los elementos esenciales, el aviso debe hacerse con no menos de un mes de anticipación."}, {"q": "Que un operador de posición propia reciba órdenes por cuenta de terceros es un ejemplo de:", "o": ["Inadecuada separación funcional, conducta relacionada con conflictos de interés", "Mejor ejecución", "Estabilización legítima", "Formación de liquidez"], "e": "Las normas exigen separación física, funcional, operativa y decisoria entre las áreas que pueden entrar en conflicto."}, {"q": "¿Cuál de estas es una práctica insegura y no autorizada según la CBJ de la SFC?", "o": ["Ofrecer o garantizar una rentabilidad específica en contratos de comisión o APT", "Informar las tarifas al cliente", "Grabar las llamadas de la mesa", "Valorar a precios de mercado"], "e": "También lo son usar activos de clientes para garantizar operaciones de otros o propias sin autorización, trasladar a terceros los riesgos de la posición propia y ejercer cargos sin posesión ante la SFC."}, {"q": "En el caso 'El Rally', el cliente ordenó invertir el 30 % de sus ahorros en acciones y el corredor invirtió el 60 % porque el mercado subía. Aunque el cliente ganó, ¿qué infracciones hubo?", "o": ["Exceso de mandato, incumplimiento de la asesoría y del deber de información", "Ninguna, porque el resultado fue favorable", "Solo una falta leve de horario", "Solo uso de información privilegiada"], "e": "La mejor ejecución se busca dentro de las instrucciones del cliente. Un resultado favorable no mitiga el incumplimiento ni el riesgo asumido."}, {"q": "En un contrato de administración de valores, la SCB puede reinvertir el capital o los rendimientos cobrados:", "o": ["Solo según las instrucciones que imparta el cliente en cada caso, con soporte en medio verificable", "Libremente según su criterio", "Solo en la posición propia", "Solo en CDT de la misma entidad"], "e": "Las facultades del contrato de administración de valores son: cobrar rendimientos y capital, suscripción preferencial, valorar y reinvertir según instrucciones."}, {"q": "Una PNV que sigue ejerciendo funciones mientras está suspendida por AMV incurre en:", "o": ["Ejercicio indebido de un cargo dentro del mercado", "Una conducta permitida si su entidad lo autoriza", "Una simple falta administrativa sin sanción", "Mejor ejecución"], "e": "El ejercicio indebido también se da al actuar sin certificación e inscripción en el RNPMV, o bajo suspensión preventiva."}, {"q": "¿Qué delito del Código Penal castiga las transacciones que aparentan mayor liquidez o las maniobras fraudulentas para alterar la cotización de un valor inscrito en el RNVE?", "o": ["Manipulación fraudulenta de especies inscritas (artículo 317)", "Pánico económico (artículo 302)", "Estafa (artículo 246)", "Abuso de confianza (artículo 249)"], "e": "La pena es de 32 a 108 meses de prisión y multa de hasta 50.000 SMMLV, aumentada hasta la mitad si se produce el resultado."}, {"q": "¿Cuál es la pena de prisión del delito de utilización indebida de información privilegiada (artículo 258 del Código Penal)?", "o": ["De uno a tres años", "De 10 a 30 años", "De 32 a 144 meses", "No tiene pena de prisión"], "e": "Además, multa de 5 a 50 SMMLV. Aplica a empleados, asesores o directivos que usen información conocida por su cargo, y a quien la use por su profesión u oficio para negociar valores del RNVE."}, {"q": "El delito de pánico económico:", "o": ["Puede cometerlo cualquier persona que divulgue información falsa o inexacta que afecte la confianza en entidades vigiladas o esquemas de inversión colectiva", "Solo lo comete un funcionario de la SFC", "Requiere que efectivamente ocurra una corrida", "Solo aplica a bancos extranjeros"], "e": "Es un delito doloso que no exige calidad especial ni que se produzca el resultado. Si el resultado ocurre, la pena se agrava."}, {"q": "¿Cuál es la pena de prisión del delito de lavado de activos (artículo 323 del Código Penal)?", "o": ["De 10 a 30 años", "De 1 a 3 años", "De 16 a 72 meses", "De 6 meses a 1 año"], "e": "Además, multa de 1.000 a 50.000 SMMLV. Es punible aunque los delitos fuente hayan ocurrido en el extranjero."}, {"q": "¿Qué diferencia el abuso de confianza del hurto?", "o": ["En el abuso de confianza el dueño entrega voluntariamente el bien por un título no traslativo de dominio, y quien lo recibe se lo apropia o lo usa indebidamente", "Son el mismo delito", "En el abuso de confianza siempre hay violencia", "El hurto solo aplica a valores"], "e": "Conductas como el exceso de mandato y el uso indebido de recursos de clientes pueden encuadrar en el abuso de confianza (artículo 249)."}, {"q": "Inducir a un inversionista en error con artificios o engaños para obtener un provecho ilícito configura el delito de:", "o": ["Estafa", "Pánico económico", "Lavado de activos", "Manipulación fraudulenta"], "e": "El artículo 246 del Código Penal tipifica la estafa. La guía menciona el caso Enron, que falseaba su contabilidad."}], "eco": [{"q": "¿Qué entidad es la autoridad monetaria, cambiaria y crediticia en Colombia?", "o": ["La Junta Directiva del Banco de la República", "El Ministerio de Hacienda", "La Superintendencia Financiera", "El DANE"], "e": "La Constitución asigna a la Junta Directiva del Banco de la República el papel de autoridad monetaria, cambiaria y crediticia."}, {"q": "Si el Banco de la República sube su tasa de política monetaria, el efecto esperado es:", "o": ["Un encarecimiento del crédito, menor demanda agregada y menor presión inflacionaria", "Una caída de todas las tasas de interés del mercado", "Un aumento inmediato del consumo", "Una mayor inflación"], "e": "Subir la tasa de intervención encarece el crédito y desestimula el gasto. Así se reduce la presión sobre los precios."}, {"q": "¿Qué entidad calcula el Índice de Precios al Consumidor (IPC) en Colombia?", "o": ["El DANE", "El Banco de la República", "La Superintendencia Financiera", "El Ministerio de Hacienda"], "e": "El Departamento Administrativo Nacional de Estadística (DANE) calcula y publica el IPC cada mes."}, {"q": "La meta de inflación de largo plazo del Banco de la República es:", "o": ["3 %, con un rango de más o menos un punto porcentual", "5 % exacto", "0 %", "Variable cada año según el presupuesto"], "e": "El Banco de la República sigue un esquema de inflación objetivo con una meta de 3 % y un rango de +/- 1 punto porcentual."}, {"q": "¿Cuál es el efecto esperado de un alza fuerte en las tasas de interés sobre el precio de los bonos de tasa fija?", "o": ["El precio de los bonos baja", "El precio de los bonos sube", "El precio no cambia", "Los bonos dejan de pagar cupones"], "e": "El precio de un bono y la tasa de interés de mercado tienen una relación inversa: si las tasas suben, el valor presente de los flujos fijos baja."}, {"q": "Si el peso colombiano se devalúa frente al dólar, ¿quién se beneficia, en principio?", "o": ["Los exportadores colombianos", "Los importadores colombianos", "Las empresas con deuda en dólares", "Los viajeros colombianos al exterior"], "e": "Con una devaluación, cada dólar recibido por exportaciones equivale a más pesos. Los importadores y quienes deben en dólares se perjudican."}, {"q": "¿Qué entidad calcula y certifica la Tasa Representativa del Mercado (TRM)?", "o": ["La Superintendencia Financiera de Colombia", "El DANE", "La Bolsa de Valores de Colombia", "El Ministerio de Comercio"], "e": "La SFC calcula y certifica diariamente la TRM con base en las operaciones de compra y venta de divisas del mercado cambiario."}, {"q": "El Producto Interno Bruto (PIB) mide:", "o": ["El valor de los bienes y servicios finales producidos en un país durante un período", "El total de exportaciones de un país", "La riqueza acumulada de los hogares", "El total de impuestos recaudados"], "e": "El PIB mide la producción de bienes y servicios finales dentro del territorio en un período. Es la medida más usada de la actividad económica."}, {"q": "Por el método del gasto, el PIB se calcula como:", "o": ["Consumo + Inversión + Gasto público + (Exportaciones − Importaciones)", "Salarios + Utilidades + Impuestos", "Producción − Consumo intermedio", "Exportaciones + Importaciones"], "e": "El PIB por el lado del gasto suma consumo de los hogares, inversión, gasto del gobierno y exportaciones netas."}, {"q": "Una política fiscal expansiva consiste en:", "o": ["Aumentar el gasto público o reducir los impuestos", "Subir la tasa de interés de política", "Vender TES en operaciones de mercado abierto", "Aumentar el encaje bancario"], "e": "La política fiscal la maneja el Gobierno mediante gasto e impuestos. Más gasto o menos impuestos estimulan la demanda. Las otras opciones son instrumentos monetarios contractivos."}, {"q": "El IBR (Indicador Bancario de Referencia) refleja:", "o": ["El precio al que los bancos están dispuestos a ofrecer o captar recursos en el mercado monetario", "La rentabilidad promedio de las acciones", "La tasa de cambio peso-dólar", "La inflación esperada a un año"], "e": "El IBR es una tasa de referencia del mercado monetario colombiano, construida con las cotizaciones de bancos participantes."}, {"q": "Una curva de rendimientos con pendiente positiva indica que:", "o": ["Las tasas de largo plazo son mayores que las de corto plazo", "Las tasas de corto plazo son mayores que las de largo plazo", "Todas las tasas son iguales", "La inflación es negativa"], "e": "La curva normal tiene pendiente positiva: los plazos más largos exigen una mayor tasa por el mayor riesgo y la incertidumbre."}, {"q": "La balanza de pagos registra:", "o": ["Todas las transacciones económicas de un país con el resto del mundo en un período", "El presupuesto anual del Gobierno", "Los activos y pasivos del Banco de la República", "Las importaciones únicamente"], "e": "La balanza de pagos recoge las transacciones con el exterior: la cuenta corriente, la cuenta de capital y la cuenta financiera."}, {"q": "¿Qué es la tasa de interés real?", "o": ["La tasa nominal descontada la inflación", "La tasa que fija el Banco de la República", "La tasa nominal más la inflación", "La tasa de los créditos de consumo"], "e": "La tasa real mide el rendimiento en poder de compra. Aproximadamente, es la tasa nominal menos la inflación; con exactitud, (1 + nominal) / (1 + inflación) − 1."}, {"q": "Una empresa tiene un activo corriente de 500 y un pasivo corriente de 250. Su razón corriente es:", "o": ["2,0", "0,5", "250", "1,5"], "e": "Razón corriente = activo corriente / pasivo corriente = 500 / 250 = 2,0. Por cada peso de deuda de corto plazo, la empresa tiene dos pesos de activos de corto plazo."}, {"q": "Una empresa tiene una utilidad neta de 120 y un patrimonio promedio de 800. ¿Cuál es su rentabilidad sobre el patrimonio (ROE)?", "o": ["15 %", "12 %", "6,7 %", "20 %"], "e": "ROE = utilidad neta / patrimonio = 120 / 800 = 0,15, es decir, 15 %."}, {"q": "El EBITDA es un indicador de:", "o": ["La generación operativa de caja antes de intereses, impuestos, depreciaciones y amortizaciones", "La utilidad neta después de impuestos", "El endeudamiento de la empresa", "El valor de mercado de las acciones"], "e": "El EBITDA aproxima la caja que genera la operación, sin el efecto de la estructura financiera, los impuestos ni las partidas contables no monetarias."}, {"q": "¿Qué indica una razón de endeudamiento (pasivo total / activo total) de 0,7?", "o": ["Que el 70 % de los activos se financian con deuda", "Que la empresa tiene 70 % de liquidez", "Que el patrimonio es el 70 % de los activos", "Que la empresa es muy rentable"], "e": "La razón de endeudamiento indica qué proporción de los activos se financia con pasivos. Con 0,7, el 70 % se financia con deuda y el 30 % con patrimonio."}, {"q": "Durante una fase de recesión del ciclo económico normalmente se observa:", "o": ["Caída de la producción y aumento del desempleo", "Crecimiento acelerado del PIB", "Inflación creciente por exceso de demanda", "Disminución del desempleo"], "e": "La recesión se caracteriza por una contracción de la actividad económica, menor inversión y mayor desempleo."}, {"q": "Un déficit en la cuenta corriente de la balanza de pagos significa que el país:", "o": ["Gasta en el exterior más de lo que recibe por comercio, rentas y transferencias, y debe financiarse con la cuenta financiera", "Tiene superávit fiscal", "Exporta más de lo que importa", "No tiene deuda externa"], "e": "Un déficit corriente se financia con entradas de capital o con reservas, por ejemplo inversión extranjera o endeudamiento externo."}, {"q": "¿Qué mide el Índice de Precios al Productor (IPP)?", "o": ["La variación de los precios de los bienes en la primera etapa de comercialización", "La variación de los precios que pagan los hogares", "El crecimiento de la producción industrial", "La variación de los salarios"], "e": "El IPP mide los precios de los bienes al productor. Suele anticipar presiones sobre los precios al consumidor."}, {"q": "La inflación básica o núcleo excluye normalmente:", "o": ["Los precios más volátiles, como alimentos y regulados", "Los servicios de salud", "Los arriendos", "Todos los bienes importados"], "e": "La inflación básica quita los componentes más volátiles para ver la tendencia de fondo de los precios, que es la que guía la política monetaria."}, {"q": "La tasa de desempleo se calcula como:", "o": ["Desocupados divididos entre la fuerza de trabajo", "Desocupados divididos entre la población total", "Ocupados divididos entre la población total", "Inactivos divididos entre la población en edad de trabajar"], "e": "La tasa de desempleo es el porcentaje de la fuerza de trabajo (ocupados más desocupados) que está buscando empleo sin encontrarlo."}, {"q": "Un aumento de la inversión extranjera directa en Colombia tiende, en principio, a:", "o": ["Revaluar el peso por la mayor oferta de dólares", "Devaluar el peso", "No afectar la tasa de cambio", "Aumentar el déficit fiscal"], "e": "La entrada de dólares aumenta su oferta en el mercado cambiario, lo que presiona el peso hacia la revaluación."}, {"q": "¿Qué es la regla fiscal en Colombia?", "o": ["Un mecanismo que limita el déficit y la deuda del Gobierno central para asegurar la sostenibilidad de las finanzas públicas", "La regla que fija la tasa de interés del Banco de la República", "La norma que fija el salario mínimo", "El límite de inversión de los fondos de pensiones"], "e": "La regla fiscal, establecida por la Ley 1473 de 2011 y modificada después, fija metas de balance y deuda para el Gobierno nacional central."}, {"q": "Las reservas internacionales del Banco de la República sirven principalmente para:", "o": ["Respaldar la capacidad del país de cumplir sus pagos externos y enfrentar choques", "Financiar el gasto del Gobierno", "Pagar las pensiones de Colpensiones", "Prestar a las empresas privadas"], "e": "Las reservas dan liquidez en moneda extranjera y confianza para cumplir obligaciones con el exterior."}, {"q": "El encaje bancario es:", "o": ["La porción de los depósitos que los bancos deben mantener como reserva y no pueden prestar", "La ganancia de los bancos por sus créditos", "Un impuesto a las transacciones financieras", "El capital mínimo para crear un banco"], "e": "El encaje es un instrumento de política monetaria: si aumenta, los bancos tienen menos recursos para prestar."}, {"q": "En una operación de expansión monetaria, el Banco de la República:", "o": ["Suministra liquidez al sistema, por ejemplo comprando títulos o prestando mediante repos", "Retira liquidez vendiendo títulos", "Aumenta el encaje", "Sube la tasa de intervención"], "e": "Las operaciones de expansión inyectan dinero al sistema. Las de contracción lo retiran."}, {"q": "Una curva de rendimientos invertida, con tasas de corto plazo mayores que las de largo plazo, suele interpretarse como:", "o": ["Una señal de posible desaceleración o recesión futura", "Una señal de crecimiento económico acelerado", "Una señal de inflación creciente sin cambios en el crecimiento", "Un error de medición"], "e": "La curva invertida refleja expectativas de que las tasas bajen en el futuro, lo que suele asociarse con un menor crecimiento."}, {"q": "El margen bruto de una empresa se calcula como:", "o": ["Utilidad bruta dividida entre ventas", "Utilidad neta dividida entre activos", "Pasivos divididos entre patrimonio", "EBITDA dividido entre intereses"], "e": "El margen bruto muestra qué parte de cada peso vendido queda después del costo de ventas."}, {"q": "Una empresa tiene una utilidad neta de 50 y activos totales de 1.000. ¿Cuál es su ROA?", "o": ["5 %", "50 %", "20 %", "0,5 %"], "e": "ROA = utilidad neta / activos totales = 50 / 1.000 = 5 %."}, {"q": "La prueba ácida es un indicador de liquidez que:", "o": ["Excluye los inventarios del activo corriente", "Incluye todos los activos de la empresa", "Mide la rentabilidad del patrimonio", "Mide el nivel de endeudamiento"], "e": "Prueba ácida = (activo corriente − inventarios) / pasivo corriente. Es más exigente que la razón corriente, porque los inventarios pueden tardar en convertirse en efectivo."}, {"q": "¿Qué estado financiero muestra los activos, pasivos y patrimonio de una empresa en una fecha?", "o": ["El estado de situación financiera (balance general)", "El estado de resultados", "El estado de flujos de efectivo", "El estado de cambios en el patrimonio"], "e": "El balance muestra la posición financiera en una fecha. El estado de resultados muestra ingresos y gastos en un período."}, {"q": "Una empresa con alto apalancamiento financiero:", "o": ["Amplifica tanto sus ganancias como sus pérdidas para los accionistas", "Tiene menos riesgo que una sin deuda", "No paga intereses", "Siempre tiene un ROE más bajo"], "e": "La deuda aumenta el rendimiento del patrimonio cuando las cosas van bien, pero también aumenta las pérdidas y el riesgo de insolvencia."}, {"q": "Si la Reserva Federal de Estados Unidos sube sus tasas de interés, el efecto esperado sobre Colombia es:", "o": ["Presión hacia la devaluación del peso por la salida de capitales", "Revaluación inmediata del peso", "Caída de las tasas de los TES", "Ningún efecto"], "e": "Tasas más altas en Estados Unidos hacen más atractivos los activos en dólares. Puede haber salida de capitales, con presión sobre el peso y sobre las tasas locales."}, {"q": "¿Qué mide la tasa de cambio real?", "o": ["El precio relativo de los bienes de un país frente a los de otro, ajustando la tasa nominal por las inflaciones", "El número de pesos por dólar en un día", "La tasa de interés de los TES", "El nivel de reservas internacionales"], "e": "La tasa de cambio real ajusta la nominal por la diferencia de precios entre países y mide la competitividad."}, {"q": "Si la inflación en Colombia es mayor que la de sus socios comerciales y la tasa de cambio nominal no cambia, la competitividad de las exportaciones colombianas:", "o": ["Disminuye, porque el peso se revalúa en términos reales", "Aumenta", "No cambia", "Se vuelve infinita"], "e": "Con más inflación local y la misma tasa nominal, los productos colombianos se encarecen frente a los extranjeros."}, {"q": "El déficit fiscal ocurre cuando:", "o": ["Los gastos del Gobierno superan sus ingresos", "Las importaciones superan a las exportaciones", "La inflación supera la meta", "El desempleo aumenta"], "e": "El déficit fiscal es la diferencia negativa entre ingresos y gastos del Gobierno. Se financia con deuda."}, {"q": "¿Cómo financia normalmente el Gobierno nacional su déficit en el mercado local?", "o": ["Emitiendo TES", "Emitiendo acciones", "Imprimiendo billetes directamente", "Con los ahorros de Colpensiones"], "e": "El Gobierno emite TES en el mercado local y bonos en el exterior. La Constitución restringe la financiación directa del Banco de la República al Gobierno."}, {"q": "¿Qué es la DTF?", "o": ["Una tasa de referencia que refleja el promedio de las tasas de captación de los CDT a 90 días", "La tasa de política monetaria", "La tasa de los créditos de vivienda", "La tasa de cambio peso-dólar"], "e": "La DTF se calcula con las tasas de captación a 90 días de las entidades financieras. Fue durante años una referencia importante del mercado."}, {"q": "La UVR (Unidad de Valor Real) es:", "o": ["Una unidad de cuenta que se ajusta según la inflación, usada en créditos de vivienda y TES", "Una moneda extranjera", "Un índice bursátil", "Una tasa de interés fija"], "e": "La UVR refleja el poder adquisitivo con base en la variación del IPC. Hay TES y créditos denominados en UVR."}, {"q": "Una expectativa de inflación más alta tiende a provocar:", "o": ["Aumentos en las tasas de interés nominales de mercado", "Caídas en las tasas nominales", "Revaluación inmediata y segura", "Menores precios de los bienes"], "e": "Los inversionistas exigen compensación por la pérdida de poder de compra, así que las tasas nominales suben."}, {"q": "¿Cuál es el principal objetivo del Banco de la República según la Constitución?", "o": ["Mantener la capacidad adquisitiva de la moneda", "Maximizar el crecimiento a cualquier costo", "Financiar el gasto del Gobierno", "Fijar los salarios"], "e": "La Constitución de 1991 asigna al Banco de la República el objetivo de mantener el poder adquisitivo del peso, en coordinación con la política económica general."}, {"q": "El esquema cambiario de Colombia se caracteriza por:", "o": ["Una tasa de cambio flexible, determinada por el mercado, con intervenciones ocasionales del Banco de la República", "Una tasa de cambio fija", "Una banda cambiaria estricta", "La dolarización de la economía"], "e": "Colombia tiene un régimen de flotación. El Banco puede intervenir para acumular reservas o moderar la volatilidad."}, {"q": "La cuenta corriente de la balanza de pagos incluye:", "o": ["La balanza comercial, la renta de factores y las transferencias corrientes como las remesas", "La inversión extranjera directa", "Los préstamos externos del Gobierno", "Las reservas internacionales"], "e": "La cuenta corriente registra el comercio de bienes y servicios, las rentas y las transferencias. Los flujos de inversión van en la cuenta financiera."}, {"q": "Las remesas que envían los colombianos desde el exterior se registran en:", "o": ["La cuenta corriente, como transferencias corrientes", "La cuenta financiera", "El presupuesto nacional", "Las reservas del Banco de la República"], "e": "Las remesas son transferencias corrientes y ayudan a financiar el déficit comercial."}, {"q": "Un aumento fuerte del precio internacional del petróleo, en principio, para Colombia:", "o": ["Aumenta los ingresos por exportaciones y tiende a revaluar el peso", "Devalúa el peso", "Reduce los ingresos fiscales", "No tiene ningún efecto"], "e": "El petróleo es un producto clave de exportación. Un precio más alto aumenta la entrada de dólares y los ingresos del Gobierno."}, {"q": "La estanflación es una situación en la que se combinan:", "o": ["Estancamiento económico e inflación alta", "Crecimiento alto e inflación baja", "Deflación y pleno empleo", "Superávit fiscal y comercial"], "e": "La estanflación es difícil para la política monetaria: subir tasas para bajar la inflación empeora el estancamiento."}, {"q": "La deflación es:", "o": ["Una caída generalizada y sostenida del nivel de precios", "Un aumento de la inflación", "Una caída del precio de una acción", "Una devaluación de la moneda"], "e": "La deflación puede ser dañina porque incentiva a posponer el consumo y aumenta el peso real de las deudas."}, {"q": "En el análisis de estados financieros, la rotación de cartera mide:", "o": ["Las veces que la empresa cobra sus cuentas por cobrar en un período", "El número de clientes nuevos", "La rentabilidad del patrimonio", "El nivel de endeudamiento"], "e": "Rotación de cartera = ventas a crédito / cuentas por cobrar promedio. Una rotación más alta indica cobros más rápidos."}, {"q": "El flujo de caja libre de una empresa representa:", "o": ["El efectivo que genera la operación después de las inversiones necesarias, disponible para acreedores y accionistas", "La utilidad neta contable", "Los ingresos totales", "El valor de los activos fijos"], "e": "El flujo de caja libre es la base de la valoración por flujos descontados."}, {"q": "La cobertura de intereses ajustada (EBITDA / gastos financieros) mide:", "o": ["La capacidad de la empresa para pagar los intereses de su deuda con su generación operativa", "La liquidez de corto plazo", "La rentabilidad del accionista", "La participación de mercado"], "e": "Mide cuántas veces el EBITDA cubre los intereses del periodo. La guía de AMV distingue la razón de cobertura de intereses (EBIT / gastos financieros), con un mínimo aceptable cercano a 1,5, y la cobertura ajustada (EBITDA / gastos financieros)."}, {"q": "Una empresa con utilidad neta de 200, ventas de 2.000 y activos de 1.600 tiene un margen neto de:", "o": ["10 %", "12,5 %", "8 %", "20 %"], "e": "Margen neto = utilidad neta / ventas = 200 / 2.000 = 10 %."}, {"q": "Una empresa con pasivo total de 600 y patrimonio de 400 tiene una razón de endeudamiento (pasivo / activo) de:", "o": ["60 %", "150 %", "40 %", "66,7 %"], "e": "Activo = pasivo + patrimonio = 1.000. Endeudamiento = 600 / 1.000 = 60 %."}, {"q": "En un estado de resultados, la utilidad operacional se obtiene:", "o": ["Restando de la utilidad bruta los gastos de administración y ventas", "Restando los impuestos de la utilidad neta", "Sumando los ingresos financieros a las ventas", "Restando los dividendos pagados"], "e": "Utilidad operacional = utilidad bruta − gastos operacionales. Después se restan los gastos financieros y los impuestos."}, {"q": "El análisis vertical de un estado financiero consiste en:", "o": ["Expresar cada partida como porcentaje de un total del mismo período", "Comparar una partida a lo largo de varios años", "Calcular la TIR de la empresa", "Calcular el VaR de la empresa"], "e": "El análisis vertical muestra la estructura. El horizontal compara la evolución de las partidas entre períodos."}, {"q": "La relación precio/utilidad (P/U o PER) de una acción se calcula como:", "o": ["Precio de la acción dividido entre la utilidad por acción", "Utilidad por acción dividida entre el precio", "Dividendo dividido entre el precio", "Patrimonio dividido entre número de acciones"], "e": "El P/U indica cuántas veces paga el mercado la utilidad anual de la empresa."}, {"q": "Una acción vale COP 20.000 y la utilidad por acción es COP 2.000. ¿Cuál es su relación precio/utilidad?", "o": ["10 veces", "0,1 veces", "40 veces", "2 veces"], "e": "P/U = 20.000 / 2.000 = 10 veces."}, {"q": "La relación precio/valor en libros mide:", "o": ["El precio de mercado de la acción frente a su valor patrimonial por acción", "La rentabilidad de los dividendos", "El nivel de endeudamiento", "La liquidez de la acción"], "e": "Una relación mayor que 1 indica que el mercado valora la empresa por encima de su patrimonio contable."}, {"q": "La rentabilidad por dividendo (dividend yield) se calcula como:", "o": ["Dividendo anual por acción dividido entre el precio de la acción", "Precio dividido entre el dividendo", "Utilidad dividida entre el patrimonio", "Dividendo dividido entre la utilidad"], "e": "Mide qué porcentaje del precio recibe el inversionista cada año en dividendos."}, {"q": "Un indicador líder de la economía es aquel que:", "o": ["Tiende a anticipar los cambios en la actividad económica", "Se publica con varios años de rezago", "Solo confirma lo que ya pasó", "Mide únicamente el sector financiero"], "e": "Indicadores como la confianza del consumidor o los pedidos industriales ayudan a anticipar el ciclo."}, {"q": "El multiplicador del dinero se reduce cuando:", "o": ["Aumenta el encaje bancario", "Disminuye el encaje bancario", "Aumentan los créditos", "Baja la tasa de interés"], "e": "Con un encaje mayor, los bancos pueden prestar una menor proporción de los depósitos, lo que reduce la creación secundaria de dinero."}, {"q": "La tasa de interés interbancaria a un día en Colombia se mide principalmente con:", "o": ["El IBR overnight", "La DTF a 90 días", "La tasa de usura", "La TRM"], "e": "El IBR overnight refleja el costo del dinero a un día entre bancos y sigue de cerca la tasa de política monetaria."}, {"q": "¿Qué entidad certifica la tasa de interés bancario corriente que sirve de base para la tasa de usura?", "o": ["La Superintendencia Financiera", "El Banco de la República", "El DANE", "La Bolsa de Valores"], "e": "La SFC certifica el interés bancario corriente. La tasa de usura equivale a 1,5 veces ese interés."}, {"q": "Un choque de oferta negativo, como una sequía que reduce la producción de alimentos, tiende a generar:", "o": ["Más inflación y menor producción en el corto plazo", "Menos inflación y más producción", "Deflación inmediata", "Ningún cambio en precios"], "e": "Al reducirse la oferta, los precios suben y la producción cae, lo que complica la política monetaria."}, {"q": "¿Qué es el PIB nominal?", "o": ["El valor de la producción medido a precios corrientes del período", "El valor de la producción a precios de un año base", "El PIB dividido entre la población", "El crecimiento del PIB descontada la inflación"], "e": "El PIB nominal usa precios corrientes. El PIB real usa precios constantes para medir el crecimiento de la producción sin el efecto de los precios."}, {"q": "El deflactor del PIB se obtiene como:", "o": ["PIB nominal dividido entre PIB real", "PIB real dividido entre la población", "IPC dividido entre el PIB", "Exportaciones divididas entre importaciones"], "e": "El deflactor es un índice de precios de toda la producción del país."}, {"q": "El PIB per cápita es:", "o": ["El PIB dividido entre la población", "El PIB de cada departamento", "El PIB menos los impuestos", "El PIB en dólares"], "e": "El PIB per cápita aproxima el nivel de ingreso promedio por habitante."}, {"q": "¿Qué es la brecha del producto?", "o": ["La diferencia entre el PIB observado y el PIB potencial", "La diferencia entre exportaciones e importaciones", "La diferencia entre ingresos y gastos del Gobierno", "La diferencia entre la TRM y la tasa de los TES"], "e": "Una brecha positiva indica que la economía produce por encima de su potencial, con presiones inflacionarias."}, {"q": "Cuando la economía crece por encima de su potencial, el banco central normalmente:", "o": ["Sube las tasas de interés para evitar presiones inflacionarias", "Baja las tasas", "Aumenta el gasto público", "Fija la tasa de cambio"], "e": "Con una brecha positiva, la política monetaria se vuelve más restrictiva para contener la inflación."}, {"q": "Un aumento en la tasa de interés de política monetaria se transmite a la economía principalmente a través de:", "o": ["Las tasas de los créditos y depósitos, el crédito, la tasa de cambio y las expectativas", "El aumento de los salarios por decreto", "La impresión de billetes", "La reducción de impuestos"], "e": "Los canales de transmisión incluyen las tasas de mercado, el crédito, la tasa de cambio, el precio de los activos y las expectativas."}, {"q": "¿Qué son las operaciones de mercado abierto (OMA)?", "o": ["Compras y ventas de títulos o repos del banco central para regular la liquidez", "Ventas de acciones del Gobierno", "Subastas de divisas obligatorias para los exportadores", "Créditos a empresas privadas"], "e": "Con las OMA el Banco de la República ajusta la liquidez del sistema para que las tasas de corto plazo sigan su tasa de política."}, {"q": "Un superávit comercial significa que:", "o": ["Las exportaciones de bienes superan a las importaciones", "Las importaciones superan a las exportaciones", "El Gobierno gasta menos de lo que recauda", "La inflación es negativa"], "e": "La balanza comercial es superavitaria cuando el país vende al exterior más bienes de los que compra."}, {"q": "La inversión extranjera de portafolio se diferencia de la inversión extranjera directa en que:", "o": ["La de portafolio compra valores sin buscar el control de las empresas y suele ser más volátil", "La de portafolio siempre es de largo plazo", "La directa solo compra TES", "No hay diferencia"], "e": "La inversión directa busca participación duradera y control. La de portafolio puede entrar y salir con rapidez."}, {"q": "¿Qué mide la calificación soberana de un país?", "o": ["La capacidad y disposición del Gobierno de pagar su deuda", "El nivel de felicidad de la población", "El crecimiento del PIB", "La inflación esperada"], "e": "Las calificadoras internacionales califican la deuda soberana. Una baja de calificación suele aumentar el costo de financiación."}, {"q": "Si una calificadora baja la calificación soberana de Colombia, el efecto esperado sobre los TES es:", "o": ["Que sus tasas suban y sus precios bajen", "Que sus tasas bajen", "Que no cambien", "Que dejen de pagar cupones"], "e": "Una peor calificación aumenta el riesgo percibido y los inversionistas exigen mayor rendimiento."}, {"q": "El riesgo país se mide comúnmente con:", "o": ["El diferencial de tasas (spread) de la deuda del país frente a la deuda de Estados Unidos, o el precio de los CDS", "El nivel de la TRM", "El índice MSCI COLCAP", "La DTF"], "e": "El spread o los CDS soberanos reflejan la prima que exigen los inversionistas por el riesgo del país."}, {"q": "¿Qué es la política macroprudencial?", "o": ["Medidas para reducir el riesgo sistémico del sistema financiero, como requisitos de capital o límites al crédito", "La política de tasas de interés", "La política tributaria", "La regulación del comercio exterior"], "e": "La política macroprudencial complementa la monetaria y busca la estabilidad del sistema financiero."}, {"q": "La tasa de usura en Colombia es:", "o": ["La tasa máxima legal que se puede cobrar en créditos, equivalente a 1,5 veces el interés bancario corriente", "La tasa de política monetaria", "La tasa de los CDT", "La tasa promedio de los TES"], "e": "Cobrar intereses por encima de la tasa de usura es ilegal."}, {"q": "¿Qué entidad fija el salario mínimo en Colombia cuando no hay acuerdo en la comisión de concertación?", "o": ["El Gobierno nacional, por decreto", "El Banco de la República", "El Congreso", "La Superintendencia Financiera"], "e": "Si empresarios, trabajadores y Gobierno no llegan a un acuerdo, el Gobierno lo fija por decreto."}, {"q": "Un aumento fuerte del salario mínimo, por encima de la productividad, puede generar:", "o": ["Presiones inflacionarias e impactos sobre el empleo formal", "Deflación", "Revaluación inmediata", "Reducción del gasto público"], "e": "El salario mínimo es un referente de precios y de costos laborales en la economía."}, {"q": "El capital de trabajo neto de una empresa se calcula como:", "o": ["Activo corriente menos pasivo corriente", "Activo total menos pasivo total", "Ventas menos costos", "Utilidad neta más depreciación"], "e": "Mide los recursos de corto plazo disponibles para operar después de cubrir las obligaciones de corto plazo."}, {"q": "Una empresa con un ROE alto pero un endeudamiento muy alto:", "o": ["Puede estar obteniendo su rentabilidad a costa de un mayor riesgo financiero", "Siempre es la mejor inversión", "No tiene riesgo", "Tiene un ROA necesariamente alto"], "e": "El apalancamiento aumenta el ROE, pero también la vulnerabilidad ante caídas en los resultados."}, {"q": "El análisis DuPont descompone el ROE en:", "o": ["Margen neto, rotación de activos y multiplicador de apalancamiento", "Liquidez, solvencia y crecimiento", "Ventas, costos y gastos", "Precio, utilidad y dividendos"], "e": "ROE = (utilidad / ventas) × (ventas / activos) × (activos / patrimonio). Permite ver de dónde viene la rentabilidad."}, {"q": "El estado de flujos de efectivo clasifica los flujos en actividades:", "o": ["De operación, de inversión y de financiación", "Corrientes y no corrientes", "Fijas y variables", "Nacionales y extranjeras"], "e": "Esta clasificación muestra si la caja proviene del negocio, de la venta o compra de activos o de deuda y aportes."}, {"q": "Si el Banco de la República baja su tasa de interés, el efecto esperado sobre la tasa de cambio es, en principio:", "o": ["Presión hacia la devaluación del peso por menor atractivo de los activos en pesos", "Revaluación inmediata", "Ningún efecto", "Fijación de la tasa de cambio"], "e": "Tasas locales más bajas reducen el atractivo de invertir en pesos frente al exterior."}, {"q": "¿Qué mide la confianza del consumidor?", "o": ["La percepción de los hogares sobre su situación económica y la del país", "El número de consumidores", "El precio de la canasta familiar", "Las ventas de las empresas"], "e": "Es un indicador líder del consumo de los hogares."}, {"q": "La política monetaria tiene un efecto sobre la inflación que se observa:", "o": ["Con rezago, normalmente de varios trimestres", "De forma inmediata", "Solo después de diez años", "Nunca"], "e": "Los cambios en la tasa de política tardan en transmitirse a la demanda y a los precios."}, {"q": "La inflación de costos se presenta cuando:", "o": ["Suben los costos de producción, como salarios o materias primas, y se trasladan a los precios", "Hay exceso de demanda", "El banco central sube las tasas", "Cae el precio del petróleo"], "e": "Se distingue de la inflación de demanda, causada por gasto mayor a la capacidad de producción."}, {"q": "¿Qué efecto tiene una devaluación sobre la inflación?", "o": ["Tiende a aumentarla, porque encarece los bienes importados", "Tiende a reducirla", "No tiene efecto", "Siempre genera deflación"], "e": "El traspaso de la tasa de cambio a los precios eleva la inflación de bienes transables."}, {"q": "Las expectativas de inflación son importantes para el banco central porque:", "o": ["Influyen en la fijación de precios y salarios, y en las tasas de interés", "No tienen ningún efecto", "Solo afectan a los extranjeros", "Determinan el PIB potencial"], "e": "Si las expectativas se desanclan, la inflación se vuelve más persistente."}, {"q": "Un aumento del gasto público financiado con deuda puede presionar:", "o": ["Al alza las tasas de interés de mercado", "A la baja las tasas de interés", "La revaluación del dólar en el exterior", "La caída de la inflación siempre"], "e": "Una mayor demanda de financiación del Gobierno puede elevar las tasas que exigen los inversionistas."}, {"q": "¿Qué es la deuda pública como porcentaje del PIB?", "o": ["Un indicador de la sostenibilidad de las finanzas del Gobierno", "La cantidad de TES emitidos en un año", "El déficit comercial", "La inflación anual"], "e": "Compara el tamaño de la deuda con la capacidad de producción de la economía."}, {"q": "La balanza comercial forma parte de:", "o": ["La cuenta corriente de la balanza de pagos", "La cuenta financiera", "El presupuesto nacional", "Las reservas internacionales"], "e": "La cuenta corriente incluye la balanza comercial de bienes y servicios."}, {"q": "¿Qué indica una caída en los términos de intercambio de Colombia?", "o": ["Que los precios de sus exportaciones bajaron en relación con los de sus importaciones", "Que el país exporta más", "Que la inflación subió", "Que el peso se revaluó"], "e": "Términos de intercambio = precio de exportaciones / precio de importaciones. Una caída reduce el ingreso del país."}, {"q": "Las máquinas, equipos e inmuebles que usa una empresa para aumentar su capacidad de producción son:", "o": ["Bienes de capital", "Bienes de consumo no duraderos", "Servicios finales", "Bienes Giffen"], "e": "Los bienes de consumo los adquieren los consumidores para satisfacer sus necesidades y pueden ser duraderos, no duraderos o servicios."}, {"q": "¿Cuáles son los factores clásicos de producción?", "o": ["Capital, trabajo y tierra", "Oferta, demanda y precio", "Consumo, inversión y gasto", "Inflación, tasa de interés y tasa de cambio"], "e": "La tierra incluye el espacio físico y los recursos naturales; el trabajo es el capital humano; el capital, los bienes y el dinero invertidos para producir."}, {"q": "¿Qué diferencia hay entre un precio nominal y un precio relativo?", "o": ["El nominal son las unidades de dinero por unidad de un bien; el relativo es cuántas unidades de un bien B se dan por una de un bien A", "Son lo mismo", "El nominal incluye impuestos y el relativo no", "El relativo solo existe en el comercio exterior"], "e": "El precio relativo también se llama valor de cambio."}, {"q": "En competencia perfecta, los participantes son 'precio-aceptantes' porque:", "o": ["Hay tantos compradores y vendedores que ninguno puede influir individualmente en el precio", "El gobierno fija el precio", "Hay un solo vendedor", "Los productos son muy diferenciados"], "e": "Además, el producto es homogéneo, hay información perfecta y libertad de entrada y salida. La guía señala que el mercado global de divisas se parece mucho a la competencia perfecta."}, {"q": "En competencia perfecta, en el largo plazo los beneficios económicos de las empresas son:", "o": ["Iguales a cero, porque el precio se iguala al costo marginal", "Siempre crecientes", "Negativos", "Fijados por el regulador"], "e": "La entrada libre de competidores elimina los beneficios extraordinarios."}, {"q": "Un mercado con un solo vendedor y muchos compradores es un:", "o": ["Monopolio", "Oligopolio", "Mercado de competencia perfecta", "Monopsonio"], "e": "El oligopolio tiene pocos vendedores. Ambas son formas de competencia imperfecta."}, {"q": "Frente a un mercado competitivo, un monopolio tiende a producir:", "o": ["Menos cantidad a un precio mayor, con pérdida de bienestar social", "Más cantidad a menor precio", "La misma cantidad al mismo precio", "Cantidades ilimitadas"], "e": "La competencia imperfecta genera fallos de mercado y pérdida de eficiencia."}, {"q": "Según la ley de la demanda, si el precio de un bien baja, la cantidad demandada:", "o": ["Aumenta, con un movimiento a lo largo de la curva de demanda", "Disminuye", "No cambia", "Se desplaza toda la curva de oferta"], "e": "Hay una relación inversa entre precio y cantidad demandada. Los cambios en ingreso o gustos desplazan la curva."}, {"q": "Según la ley de la oferta, si sube el precio de un bien, la cantidad ofrecida:", "o": ["Aumenta, porque hay incentivo a vender y obtener más ganancia", "Disminuye", "No cambia", "Se vuelve cero"], "e": "La relación entre precio y cantidad ofrecida es directa."}, {"q": "¿Qué ocurre cuando el mercado está en equilibrio?", "o": ["La cantidad demandada es igual a la ofrecida, sin exceso de oferta ni de demanda", "El precio es cero", "Hay exceso de demanda", "Hay exceso de oferta"], "e": "El equilibrio está en la intersección de las curvas de oferta y demanda: el mercado se vacía."}, {"q": "Si aumenta el ingreso de los consumidores y el bien es normal, ¿qué pasa con el precio y la cantidad de equilibrio?", "o": ["Ambos suben", "Ambos bajan", "El precio baja y la cantidad sube", "No cambian"], "e": "Un aumento de la demanda desplaza la curva a la derecha: sube el precio y la cantidad de equilibrio."}, {"q": "Una reducción en los costos de producción aumenta la oferta de un bien. ¿Qué pasa con el equilibrio?", "o": ["El precio baja y la cantidad sube", "El precio y la cantidad suben", "El precio sube y la cantidad baja", "Nada cambia"], "e": "Un aumento de la oferta desplaza la curva a la derecha."}, {"q": "El precio de un bien sube 2 % y la cantidad demandada cae 10 %. ¿Cuál es la elasticidad-precio de la demanda y cómo se clasifica?", "o": ["5; relativamente elástica", "0,2; inelástica", "5; inelástica", "1; unitaria"], "e": "Elasticidad = %ΔQ / %ΔP = 10 / 2 = 5 en valor absoluto. Al ser mayor que 1, la demanda es relativamente elástica."}, {"q": "El precio de un bien cae 10 % y la cantidad ofrecida cae 4 %. ¿Cuál es la elasticidad-precio de la oferta?", "o": ["0,4; relativamente inelástica", "2,5; elástica", "4; elástica", "1; unitaria"], "e": "4 / 10 = 0,4. Al ser menor que 1, la oferta es relativamente inelástica en ese tramo."}, {"q": "Una elasticidad-precio de la demanda igual a 1 en valor absoluto indica:", "o": ["Elasticidad unitaria: la cantidad varía en la misma proporción que el precio", "Demanda perfectamente inelástica", "Demanda muy elástica", "Un bien Giffen"], "e": "Mayor que 1: elástica. Menor que 1: inelástica."}, {"q": "¿Qué bienes tienen elasticidad-precio de la demanda con signo positivo, es decir, su demanda sube cuando sube el precio?", "o": ["Los bienes Veblen y los bienes Giffen", "Los bienes normales", "Todos los bienes de capital", "Los commodities"], "e": "Los Veblen son bienes de lujo; los Giffen son bienes inferiores con pocos sustitutos para consumidores de bajo presupuesto."}, {"q": "En Colombia, ¿quién elabora las cuentas nacionales y quién las cuentas financieras?", "o": ["El DANE elabora las cuentas nacionales y el Banco de la República las cuentas financieras", "El Banco de la República elabora ambas", "La SFC elabora ambas", "El Ministerio de Hacienda elabora ambas"], "e": "Juntas generan las cuentas económicas integradas, con seis sectores institucionales: hogares, sociedades no financieras, sociedades financieras, ISFLSH, gobierno y resto del mundo."}, {"q": "Según David Ricardo, un país tiene ventaja comparativa en un bien cuando:", "o": ["Lo produce con menos recursos que otros países, es decir, a un costo relativo menor", "Tiene más población", "Tiene una moneda más fuerte", "Lo importa más barato"], "e": "Michael Porter añadió la idea de ventaja competitiva: crear más valor por especialización, diferenciación, liderazgo en costos e innovación."}, {"q": "¿Qué organización se creó en 1995 para regular el comercio internacional?", "o": ["La Organización Mundial del Comercio (OMC)", "El Fondo Monetario Internacional", "El Banco Mundial", "IOSCO"], "e": "La guía indica que en 2023 tenía 164 miembros, que representan el 98 % del comercio global."}, {"q": "¿Cuáles son las cuatro categorías de commodities según la clasificación del FMI?", "o": ["Energía, agricultura, fertilizantes y metales", "Acciones, bonos, divisas y derivados", "Bienes de capital, de consumo, servicios e intangibles", "Oro, plata, cobre y petróleo"], "e": "El FMI calcula el Primary Commodity Price Index con 68 commodities."}, {"q": "Un alza fuerte del precio internacional del petróleo, para Colombia, tiende a:", "o": ["Aumentar la entrada de dólares y presionar a la apreciación del peso", "Depreciar el peso", "Reducir las exportaciones", "No tener efecto"], "e": "Los commodities pesan mucho en las exportaciones colombianas, por lo que su precio afecta la oferta de divisas."}, {"q": "¿Cuál es la diferencia entre una variable y un indicador macroeconómico?", "o": ["La variable es el fenómeno (por ejemplo, la inflación) y el indicador es la forma de medirlo (por ejemplo, el IPC o el IPP)", "Son lo mismo", "La variable solo existe en microeconomía", "El indicador lo fija el Congreso"], "e": "Una misma variable puede medirse con varios indicadores con distinto alcance."}, {"q": "Una economía tiene tres empresas: un cultivador vende algodón por 20, una textilera vende tela por 45 y una tienda vende camisas por 100 a los hogares. ¿Cuál es el PIB?", "o": ["100", "165", "45", "65"], "e": "Solo cuentan los bienes finales (las camisas). También se llega sumando valores agregados: 20 + 25 + 55 = 100."}, {"q": "¿Cuáles son los cuatro métodos equivalentes para calcular el PIB?", "o": ["Producto, valor agregado, ingresos y gasto", "Ahorro, inversión, crédito y deuda", "Exportaciones, importaciones, reservas y deuda", "Consumo, inflación, desempleo y tasas"], "e": "Por el lado de los ingresos, el PIB es la suma de salarios, intereses, arrendamientos y utilidades."}, {"q": "¿Por qué el PIB nominal no es un buen indicador del crecimiento económico a lo largo del tiempo?", "o": ["Porque crece tanto por mayores cantidades como por mayores precios, y la inflación lo distorsiona", "Porque no incluye servicios", "Porque solo mide exportaciones", "Porque se calcula cada diez años"], "e": "El PIB real valora la producción a precios de un año base. Su variación porcentual es el crecimiento económico."}, {"q": "¿Con qué periodicidad se publica en Colombia el crecimiento del PIB real?", "o": ["Trimestral", "Diaria", "Cada diez años", "Semanal"], "e": "Por eso los indicadores adelantados, que salen antes, son tan útiles para anticipar la tendencia."}, {"q": "¿Cada cuánto realiza el DANE la Encuesta nacional de presupuestos de los hogares, que define la canasta del IPC?", "o": ["Cada 10 años", "Cada mes", "Cada año", "Cada 3 años"], "e": "Con la canasta definida, el DANE registra cada mes los precios de 443 artículos en 12 divisiones de gasto y 38 ciudades."}, {"q": "En la canasta del IPC colombiano, ¿cuál división de gasto tiene la mayor ponderación total?", "o": ["Alojamiento, agua, electricidad, gas y otros combustibles", "Educación", "Salud", "Prendas de vestir y calzado"], "e": "Según la actualización de 2019, alojamiento y servicios pesa cerca del 33 %, seguido de alimentos (15 %) y transporte (13 %)."}, {"q": "Desde 2007, ¿qué entidad calcula el Índice de precios del productor (IPP) en Colombia?", "o": ["El DANE", "El Banco de la República", "La SFC", "El Ministerio de Comercio"], "e": "Antes lo calculaba el Banco de la República. El IPP excluye los servicios y pondera industria manufacturera (67 %), minería (19 %) y agro (14 %)."}, {"q": "La canasta básica cuesta 650.000 en el año base y 820.000 un año después. ¿Cuál es la inflación?", "o": ["26,15 %", "20,73 %", "17,00 %", "126,15 %"], "e": "IPC = 820.000 / 650.000 × 100 = 126,15. Inflación = (126,15 − 100) / 100 = 26,15 %."}, {"q": "El IPC pasa de 105,48 a 111,41. ¿Cuál fue la inflación del periodo?", "o": ["5,62 %", "5,93 %", "11,41 %", "1,62 %"], "e": "(111,41 − 105,48) / 105,48 × 100 = 5,62 %. Según el DANE, fue la inflación de 2021."}, {"q": "Según Mankiw, citado en la guía, ¿desde qué nivel se considera que hay hiperinflación?", "o": ["Una inflación superior al 50 % mensual", "Una inflación superior al 10 % anual", "Una inflación superior al 3 % anual", "Cualquier inflación de dos dígitos"], "e": "Con 50 % mensual los precios suben cerca de 12.875 % en un año. El dinero pierde sus funciones y aparece el trueque."}, {"q": "Además de una fuerte desaceleración económica, la deflación puede resultar de:", "o": ["Grandes aumentos de productividad que reducen los costos unitarios", "Un alza fuerte de la demanda", "Una devaluación fuerte", "Un aumento del gasto público"], "e": "La deflación también es peligrosa: puede llevar a bajas de salarios atados a la inflación."}, {"q": "¿Por qué la estanflación se considera el peor escenario macroeconómico?", "o": ["Porque combina caída del PIB y alza de la inflación, y corregir un problema puede agravar el otro", "Porque siempre trae deflación", "Porque elimina el desempleo", "Porque solo afecta a las exportaciones"], "e": "Puede surgir de una reducción brusca e imprevista de la oferta agregada."}, {"q": "La diferencia entre la tasa de colocación y la tasa de captación de un banco se denomina:", "o": ["Margen de intermediación", "Tasa de usura", "Spread soberano", "Tasa real"], "e": "La tasa de captación es la que pagan a los ahorradores; la de colocación, la que cobran en los préstamos."}, {"q": "¿Cómo se calcula la tasa de usura en Colombia?", "o": ["1,5 veces el interés bancario corriente de cada modalidad, que certifica la SFC", "2 veces la tasa del Banco de la República", "La DTF más 10 puntos", "La inflación más 5 puntos"], "e": "Es la tasa máxima legal de colocación."}, {"q": "Un depósito paga 10 % nominal anual y la inflación del año es 4 %. ¿Cuál es la tasa de interés real?", "o": ["5,77 %", "6,00 %", "14,40 %", "4,00 %"], "e": "r = (1,10 / 1,04) − 1 = 5,77 %. Restar directamente (10 − 4 = 6 %) es solo una aproximación."}, {"q": "Un CDT paga 12 % nominal anual y la inflación es 9 %. ¿Cuál es la tasa real aproximada con la fórmula exacta?", "o": ["2,75 %", "3,00 %", "21,08 %", "1,33 %"], "e": "r = (1,12 / 1,09) − 1 = 2,75 %."}, {"q": "¿Qué encuesta usa el DANE para medir el mercado laboral?", "o": ["La Gran encuesta integrada de hogares (GEIH)", "La Encuesta nacional de presupuestos de los hogares", "El censo agropecuario", "La encuesta de opinión empresarial"], "e": "La GEIH clasifica a las personas en ocupadas, desocupadas o fuera de la fuerza de trabajo."}, {"q": "Una economía tiene una población económicamente activa de 25 millones y 2,5 millones de desocupados. ¿Cuál es la tasa de desocupación?", "o": ["10 %", "2,5 %", "12,5 %", "90 %"], "e": "Tasa de desocupación = desocupados / PEA × 100 = 2,5 / 25 = 10 %."}, {"q": "Para calcular el gasto público dentro de la demanda agregada, se excluyen:", "o": ["Los intereses de la deuda y las transferencias, como subsidios y pensiones", "Las compras de bienes del gobierno", "Los salarios de los funcionarios", "La inversión en infraestructura"], "e": "Las transferencias son ingresos de los hogares, que deciden cómo gastarlos."}, {"q": "Dentro de la demanda agregada, el componente que la guía considera buen indicador adelantado de la actividad por relacionarse con la capacidad productiva es:", "o": ["La inversión", "Las importaciones", "Las transferencias", "Los impuestos"], "e": "La inversión incluye bienes de equipo, construcción y variación de inventarios. El consumo suele ser el mayor componente."}, {"q": "En el largo plazo, según la guía, los aumentos de la oferta agregada dependen principalmente de:", "o": ["Mejoras tecnológicas y aumentos de productividad", "Más emisión de dinero", "Más gasto público", "Tasas de interés más bajas"], "e": "En el largo plazo la producción tiende a su nivel potencial, y los cambios de demanda solo mueven los precios."}, {"q": "El balance fiscal se calcula como Sg = T − G − TR. Si los impuestos son 300, el gasto 280 y las transferencias 40, el resultado es:", "o": ["Un déficit fiscal de 20", "Un superávit fiscal de 20", "Un superávit de 60", "Equilibrio fiscal"], "e": "300 − 280 − 40 = −20. Un Sg negativo es déficit, que obliga a usar ahorro previo o nueva deuda."}, {"q": "En el Presupuesto General de la Nación, los ingresos se dividen en:", "o": ["Ingresos corrientes (tributarios y no tributarios) y recursos de capital", "Ingresos fijos y variables", "Ingresos internos y externos únicamente", "Solo impuestos"], "e": "El IVA y el GMF son impuestos indirectos; renta y patrimonio, directos."}, {"q": "¿Qué proporción del gasto público representan aproximadamente los gastos corrientes, según la guía?", "o": ["Entre el 80 % y el 90 %", "Menos del 10 %", "Cerca del 50 %", "El 100 %"], "e": "El resto son gastos de inversión: bienes de capital e infraestructura."}, {"q": "Como se lleva por partida doble, la balanza de pagos:", "o": ["Siempre tiene saldo cero, aunque sus componentes no estén equilibrados", "Siempre es superavitaria", "Solo registra exportaciones", "Solo registra flujos de capital"], "e": "Un déficit en cuenta corriente se compensa con un superávit en la cuenta financiera."}, {"q": "En la balanza de pagos, el ingreso primario corresponde a:", "o": ["La renta de los factores: remuneración de empleados, dividendos e intereses", "Las remesas", "Las exportaciones de bienes", "La inversión extranjera directa"], "e": "El ingreso secundario son las transferencias, como las remesas."}, {"q": "¿Dónde se registra la inversión extranjera directa en la balanza de pagos?", "o": ["En la cuenta financiera", "En la cuenta corriente", "En el ingreso secundario", "No se registra"], "e": "La cuenta financiera incluye inversión directa, de cartera, créditos externos, derivados y activos de reserva."}, {"q": "¿Por qué preocupa un déficit alto en la cuenta corriente?", "o": ["Puede presionar la depreciación y depende de financiación externa que puede cortarse de forma súbita", "Porque aumenta las reservas", "Porque reduce la inflación", "Porque elimina la deuda externa"], "e": "La financiación puede reducirse por alzas de tasas externas, controles de capital o pérdida de confianza."}, {"q": "En el par USD/COP = 4.000, la moneda base es:", "o": ["El dólar estadounidense", "El peso colombiano", "Ninguna", "El euro"], "e": "La primera divisa es la base y la segunda la cotizada: se pagan 4.000 pesos por cada dólar."}, {"q": "¿Cuál es el código ISO 4217 del franco suizo?", "o": ["CHF", "FRS", "SWF", "CHE"], "e": "Otros códigos: USD, EUR, COP, CLP, GBP, ZAR, JPY, KRW."}, {"q": "Colombia exporta café a COP 1.500.000 por carga e importa máquinas a USD 75.000, con tasa de 4.000. ¿Cuántas cargas de café cuesta cada máquina (tasa de cambio real)?", "o": ["200", "50", "2.000", "300"], "e": "ε = E × P* / P = 4.000 × 75.000 / 1.500.000 = 200. Si ε sube, hay depreciación real; si baja, apreciación real."}, {"q": "¿Qué entidad calcu
